    const catMap = {}; categories.forEach(function (c) { catMap[c.CategoryID] = c.CategoryName; });
    const unitMap = {}; units.forEach(function (u) { unitMap[u.UOMID] = u; });
    const whMap = {}; warehouses.forEach(function (w) { whMap[w.WarehouseID] = w.WarehouseName; });

    const wrap = document.getElementById('itemTableWrap');
    if (!wrap) return; // ব্যবহারকারী এই ফাঁকে অন্য পেজ/ট্যাবে চলে গেলে এই এলিমেন্ট আর DOM-এ থাকবে না
    const active = items.filter(function (r) { return r.Status !== 'Deleted'; });
    if (active.length === 0) {
      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এখনো কোনো আইটেম যোগ করা হয়নি।" data-en="No items added yet.">${t('এখনো কোনো আইটেম যোগ করা হয়নি।','No items added yet.')}</div>`;
      return;
    }

    const headers = [
      ['কোড','Code'], ['নাম','Name'], ['গ্রুপ','Group'], ['ক্যাটাগরি','Category'], ['একক','Unit'], ['ওয়ারহাউজ','Warehouse'],
      ['পরিমাণ','Quantity'], ['দর','Rate'], ['মূল্য','Value'], ['স্ট্যাটাস','Status']
    ];
    const headCells = headers.map(function (h) { return `<th class="i18n" data-bn="${h[0]}" data-en="${h[1]}">${t(h[0], h[1])}</th>`; }).join('');

    const rowActionsHtml = function (r) {
      return `<td class="row-actions">
        <button onclick='openItemForm(${JSON.stringify(r).replace(/'/g,"&apos;")})' title="${t('সম্পাদনা','Edit')}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="m18.5 2.5 3 3L10 17l-4 1 1-4Z"/></svg>
        </button>
        <button onclick='deleteItemRecord(${JSON.stringify(r.ItemID)})' title="${t('ডিলিট','Delete')}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
        </button>
      </td>`;
    };

    const bodyRows = active.map(function (r) {
      const unit = unitMap[r.UOMID];
      const rate = Number(r.StandardCost) || 0;
      const statusCell = isTrue(r.IsActive)
        ? `<span class="badge active i18n" data-bn="সক্রিয়" data-en="Active">${t('সক্রিয়','Active')}</span>`
        : `<span class="badge inactive i18n" data-bn="নিষ্ক্রিয়" data-en="Inactive">${t('নিষ্ক্রিয়','Inactive')}</span>`;

      const itemStock = stock.filter(function (s) { return s.ItemID === r.ItemID; });
      const stockRows = itemStock.length > 0 ? itemStock : [null]; // স্টক না থাকলেও আইটেমটা অন্তত একবার দেখানো হবে

      return stockRows.map(function (s) {
        const qtyNum = s ? (Number(s.QtyOnHand) || 0) : 0;
        const value = qtyNum * rate;
        return `<tr>
          <td>${escapeHtml(r.ItemID)}</td><td>${escapeHtml(r.ItemName)}</td>
          <td>${escapeHtml(groupMap[r.GroupID] || '—')}</td><td>${escapeHtml(catMap[r.CategoryID] || '—')}</td>
          <td>${escapeHtml(unit ? unit.UOMName : '')}</td>
          <td>${s ? escapeHtml(whMap[s.WarehouseID] || s.WarehouseID) : '—'}</td>
          <td><b>${formatQtyByUOM(qtyNum, r.UOMID, units)}</b></td>
          <td>${rate ? rate.toFixed(2) : '—'}</td>
          <td><b>${value.toFixed(2)}</b></td>
          <td>${statusCell}</td>
          ${rowActionsHtml(r)}
        </tr>`;
      }).join('');
    }).join('');

    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}<th></th></tr></thead><tbody>${bodyRows}</tbody></table>`;
  }

  await loadList();
  window.__refreshItemList = loadList;
  document.getElementById('itemAddBtn').addEventListener('click', function () { openItemForm(null); });
}

async function deleteItemRecord(itemId) {
  if (!confirm(t('আপনি কি নিশ্চিত এই আইটেম ডিলিট করতে চান?','Are you sure you want to delete this item?'))) return;
  try {
    await api('delete', { sheet:'Items', idField:'ItemID', idValue: itemId });
    showToast(t('ডিলিট হয়েছে ✅','Deleted ✅'), 'success');
    if (window.__refreshItemList) await window.__refreshItemList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function openItemForm(existing) {
  const itemFormData = await cachedListMultiple(['ItemGroups', 'Categories', 'UOM', 'Warehouses']);
  const groups = itemFormData.ItemGroups.filter(function (g) { return g.Status !== 'Deleted'; });
  const categories = itemFormData.Categories.filter(function (c) { return c.Status !== 'Deleted'; });
  const units = itemFormData.UOM.filter(function (u) { return u.Status !== 'Deleted'; });
  const warehouses = itemFormData.Warehouses.filter(function (w) { return w.Status !== 'Deleted'; });
  window.__itemFormUnits = units;

  const isEdit = !!existing;
  let rec = existing || {};
  let currentItemId = isEdit ? rec.ItemID : null; // নতুন আইটেম হলে সেকশন ১ সেভ হওয়ার আগ পর্যন্ত এটা খালি থাকে

  // ক্রম — শুধু তথ্যের জন্য, তালিকায় এই আইটেমের অবস্থান কত নম্বরে সেটা দেখানো
  let serialNo = t('নতুন','New');
  if (isEdit) {
    try {
      const allItems = await api('list', { sheet:'Items' });
      const activeItems = allItems.filter(function (i) { return i.Status !== 'Deleted'; });
      const idx = activeItems.findIndex(function (i) { return i.ItemID === rec.ItemID; });
      if (idx >= 0) serialNo = String(idx + 1);
    } catch (e) {}
  }

  function opts(list, idF, labelF, selected) {
    return '<option value="">—</option>' + list.map(function (x) { return `<option value="${attr(x[idF])}" ${selected===x[idF]?'selected':''}>${escapeHtml(x[labelF])}</option>`; }).join('');
  }

  const bodyHtml = `
    <!-- ========== সেকশন ১ — মূল তথ্য ========== -->
    <div style="border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;">
      <h4 style="margin:0 0 12px;font-size:13px;color:var(--text-muted);text-transform:uppercase;">${t('১) মূল তথ্য','1) Basic Info')}</h4>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div class="field"><label>${t('ক্রম','Serial No')}</label><input id="it_Serial" value="${attr(serialNo)}" readonly style="background:var(--bg);"></div>
        <div class="field"><label>${t('কোড','Code')}</label><input id="it_Code" value="${isEdit ? attr(rec.ItemID) : t('সেভ করলে তৈরি হবে','Generated on save')}" readonly style="background:var(--bg);"></div>
        <div class="field"><label>${t('নাম','Name')}</label><input id="it_ItemName" value="${attr(rec.ItemName)}"></div>
        <div class="field"><label>${t('গ্রুপ','Group')}</label><select id="it_GroupID">${opts(groups, 'GroupID', 'GroupName', rec.GroupID)}</select></div>
        <div class="field"><label>${t('ক্যাটাগরি','Category')}</label><select id="it_CategoryID">${opts(categories, 'CategoryID', 'CategoryName', rec.CategoryID)}</select></div>
        <div class="field"><label>${t('একক','Unit')}</label><select id="it_UOMID" onchange="updateItemUnitEcho()">${opts(units, 'UOMID', 'UOMName', rec.UOMID)}</select>
          <p style="font-size:11px;color:var(--text-muted);margin:4px 0 0;">${t('এই আইটেমের ক্রয়, স্টক ও বিক্রয় — সবকিছু এই একক অনুযায়ীই হবে।','This item will be purchased, stocked, and sold entirely in this one unit.')}</p>
        </div>
        <div class="field"><label>${t('অবস্থা','Status')}</label><select id="it_IsActive">
            <option value="TRUE" ${!isEdit || isTrue(rec.IsActive) ? 'selected' : ''}>${t('সক্রিয়','Active')}</option>
            <option value="FALSE" ${isEdit && !isTrue(rec.IsActive) ? 'selected' : ''}>${t('নিষ্ক্রিয়','Inactive')}</option>
          </select></div>
      </div>
      <button type="button" class="btn btn-primary" style="width:auto;margin-top:12px;" id="it_SaveSection1">${t('মূল তথ্য সেভ করুন','Save Basic Info')}</button>
      <span id="it_Section1Status" style="margin-left:10px;font-size:12px;color:var(--success);"></span>
    </div>

    <!-- ========== সেকশন ২ — প্রারম্ভিক মজুদ ========== -->
    <div id="it_Section2" style="border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;${currentItemId?'':'opacity:.5;'}">
      <h4 style="margin:0 0 12px;font-size:13px;color:var(--text-muted);text-transform:uppercase;">${t('২) প্রারম্ভিক মজুদ বিবরণী','2) Opening Stock Details')}</h4>
      ${!currentItemId ? `<p style="font-size:12px;color:var(--text-muted);margin:0 0 10px;">${t('প্রথমে "মূল তথ্য" সেভ করুন — তারপর এই সেকশন ব্যবহার করা যাবে।','Save "Basic Info" first — then this section unlocks.')}</p>` : ''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div class="field"><label>${t('গ্রুপ','Group')}</label><input id="it_Op_GroupEcho" readonly style="background:var(--bg);"></div>
        <div class="field"><label>${t('ক্যাটাগরি','Category')}</label><input id="it_Op_CatEcho" readonly style="background:var(--bg);"></div>
        <div class="field"><label>${t('পণ্য','Item')}</label><input id="it_Op_ItemEcho" readonly style="background:var(--bg);"></div>
        <div class="field"><label>${t('ওয়ারহাউজ','Warehouse')}</label><select id="it_Op_WarehouseID" ${currentItemId?'':'disabled'}>${opts(warehouses, 'WarehouseID', 'WarehouseName', '')}</select></div>
        <div class="field"><label>${t('পরিমাণ','Quantity')}</label><input id="it_Op_Qty" type="number" step="any" ${currentItemId?'':'disabled'}></div>
        <div class="field"><label>${t('একক','Unit')}</label><input id="it_Op_UnitEcho" readonly style="background:var(--bg);"></div>
        <div class="field"><label>${t('দর','Rate')}</label><input id="it_Op_Rate" type="number" step="any" ${currentItemId?'':'disabled'}></div>
        <div class="field"><label>${t('মূল্য','Value')}</label><input id="it_Op_Value" readonly style="background:var(--bg);font-weight:600;"></div>
      </div>
      <button type="button" class="btn btn-primary" style="width:auto;margin-top:12px;" id="it_SaveSection2" ${currentItemId?'':'disabled'}>${t('প্রারম্ভিক মজুদ সেভ করুন','Save Opening Stock')}</button>
      <span id="it_Section2Status" style="margin-left:10px;font-size:12px;color:var(--success);"></span>
    </div>

    <!-- ========== সেকশন ৩ — আদর্শ ক্রয় দর ========== -->
    <div id="it_Section3" style="border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;${currentItemId?'':'opacity:.5;'}">
      <h4 style="margin:0 0 12px;font-size:13px;color:var(--text-muted);text-transform:uppercase;">${t('৩) আদর্শ ক্রয় দর','3) Standard Purchase Rate')}</h4>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;">
        <div class="field"><label>${t('দর','Rate')}</label><input id="it_StdPurchaseRate" type="number" step="any" value="${attr(rec.StandardCost)}" ${currentItemId?'':'disabled'}></div>
        <div class="field"><label>${t('একক','Unit')}</label><input id="it_StdPurchaseUnitEcho" readonly style="background:var(--bg);"></div>
        <div class="field"><label>${t('তারিখ','Date')}</label><input type="date" id="it_StdPurchaseDate" value="${attr(rec.StandardCostDate) || new Date().toISOString().slice(0,10)}" ${currentItemId?'':'disabled'}></div>
      </div>
      <button type="button" class="btn btn-primary" style="width:auto;margin-top:12px;" id="it_SaveSection3" ${currentItemId?'':'disabled'}>${t('ক্রয় দর সেভ করুন','Save Purchase Rate')}</button>
      <span id="it_Section3Status" style="margin-left:10px;font-size:12px;color:var(--success);"></span>
    </div>

    <!-- ========== সেকশন ৪ — আদর্শ বিক্রয় দর ========== -->
    <div id="it_Section4" style="border:1px solid var(--border);border-radius:10px;padding:16px;${currentItemId?'':'opacity:.5;'}">
      <h4 style="margin:0 0 12px;font-size:13px;color:var(--text-muted);text-transform:uppercase;">${t('৪) আদর্শ বিক্রয় দর','4) Standard Sales Rate')}</h4>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;">
        <div class="field"><label>${t('দর','Rate')}</label><input id="it_StdSalesRate" type="number" step="any" value="${attr(rec.SalesPrice)}" ${currentItemId?'':'disabled'}></div>
        <div class="field"><label>${t('একক','Unit')}</label><input id="it_StdSalesUnitEcho" readonly style="background:var(--bg);"></div>
        <div class="field"><label>${t('তারিখ','Date')}</label><input type="date" id="it_StdSalesDate" value="${attr(rec.SalesPriceDate) || new Date().toISOString().slice(0,10)}" ${currentItemId?'':'disabled'}></div>
      </div>
      <button type="button" class="btn btn-primary" style="width:auto;margin-top:12px;" id="it_SaveSection4" ${currentItemId?'':'disabled'}>${t('বিক্রয় দর সেভ করুন','Save Sales Rate')}</button>
      <span id="it_Section4Status" style="margin-left:10px;font-size:12px;color:var(--success);"></span>
    </div>
  `;

  openModal({
    title: (isEdit ? t('সম্পাদনা — ','Edit — ') : t('নতুন — ','New — ')) + t('আইটেম','Item'),
    bodyHtml: bodyHtml,
    wide: true,
    onSave: null
  });
  // এই ফর্মের প্রতিটা সেকশনের নিজস্ব সেভ বাটন আছে, তাই মোডালের সাধারণ
  // "সেভ করুন" বাটনটা এখানে লুকিয়ে রাখা হচ্ছে (দরকার নেই)
  const globalSaveBtn = document.getElementById('modalSaveBtn');
  if (globalSaveBtn) globalSaveBtn.style.display = 'none';
  document.getElementById('modalCloseBtn').addEventListener('click', function () { if (globalSaveBtn) globalSaveBtn.style.display = ''; }, { once: true });
  document.getElementById('modalCancelBtn').addEventListener('click', function () { if (globalSaveBtn) globalSaveBtn.style.display = ''; }, { once: true });

  function refreshUnitEchoes() {
    const uomId = val('it_UOMID');
    const unit = window.__itemFormUnits.find(function (u) { return u.UOMID === uomId; });
    const label = unit ? unit.UOMName : '—';
    ['it_StdPurchaseUnitEcho', 'it_StdSalesUnitEcho', 'it_Op_UnitEcho'].forEach(function (id) {
      const el = document.getElementById(id);
      if (el) el.value = label;
    });
    refreshOpeningEchoes();
  }
  window.updateItemUnitEcho = refreshUnitEchoes;

  function refreshOpeningEchoes() {
    const groupSel = document.getElementById('it_GroupID');
    const catSel = document.getElementById('it_CategoryID');
    const nameInput = document.getElementById('it_ItemName');
    document.getElementById('it_Op_GroupEcho').value = groupSel.options[groupSel.selectedIndex] ? groupSel.options[groupSel.selectedIndex].text : '';
    document.getElementById('it_Op_CatEcho').value = catSel.options[catSel.selectedIndex] ? catSel.options[catSel.selectedIndex].text : '';
    document.getElementById('it_Op_ItemEcho').value = nameInput.value;
  }
  document.getElementById('it_GroupID').addEventListener('change', refreshOpeningEchoes);
  document.getElementById('it_CategoryID').addEventListener('change', refreshOpeningEchoes);
  document.getElementById('it_ItemName').addEventListener('input', refreshOpeningEchoes);
  refreshUnitEchoes();

  function recalcOpeningValue() {
    const qty = Number(val('it_Op_Qty')) || 0;
    const rate = Number(val('it_Op_Rate')) || 0;
    document.getElementById('it_Op_Value').value = (qty * rate).toFixed(2);
  }
  document.getElementById('it_Op_Qty').addEventListener('input', recalcOpeningValue);
  document.getElementById('it_Op_Rate').addEventListener('input', recalcOpeningValue);

  function unlockSections() {
    ['it_Section2', 'it_Section3', 'it_Section4'].forEach(function (id) { document.getElementById(id).style.opacity = '1'; });
    document.getElementById('it_Op_WarehouseID').disabled = false;
    document.getElementById('it_Op_Qty').disabled = false;
    document.getElementById('it_Op_Rate').disabled = false;
    document.getElementById('it_SaveSection2').disabled = false;
    document.getElementById('it_StdPurchaseRate').disabled = false;
    document.getElementById('it_StdPurchaseDate').disabled = false;
    document.getElementById('it_SaveSection3').disabled = false;
    document.getElementById('it_StdSalesRate').disabled = false;
    document.getElementById('it_StdSalesDate').disabled = false;
    document.getElementById('it_SaveSection4').disabled = false;
    const p2 = document.querySelector('#it_Section2 p');
    if (p2) p2.remove();
  }

  // ---- সেকশন ১: মূল তথ্য সেভ ----
  document.getElementById('it_SaveSection1').addEventListener('click', async function () {
    const btn = this; const statusEl = document.getElementById('it_Section1Status');
    const name = val('it_ItemName');
    if (!name) { showToast(t('নাম আবশ্যক।','Name is required.'), 'error'); return; }
    btn.disabled = true; statusEl.textContent = t('সেভ হচ্ছে...','Saving...');
    try {
      const data = {
        ItemName: name, GroupID: val('it_GroupID') || null, CategoryID: val('it_CategoryID') || null,
        UOMID: val('it_UOMID') || null, IsActive: val('it_IsActive')
      };
      let saved;
      if (currentItemId) {
        saved = await api('update', { sheet:'Items', idField:'ItemID', idValue: currentItemId, data: data });
      } else {
        saved = await api('create', { sheet:'Items', idField:'ItemID', idPrefix:'ITM', requiredFields:['ItemName'], data: data });
        currentItemId = saved.ItemID;
        document.getElementById('it_Code').value = currentItemId;
        unlockSections();
      }
      refreshOpeningEchoes();
      statusEl.textContent = '✓ ' + t('সেভ হয়েছে','Saved');
      if (window.__refreshItemList) await window.__refreshItemList();
    } catch (err) {
      showToast(err.message, 'error');
      statusEl.textContent = '';
    } finally {
      btn.disabled = false;
    }
  });

  // ---- সেকশন ২: প্রারম্ভিক মজুদ সেভ ----
  document.getElementById('it_SaveSection2').addEventListener('click', async function () {
    if (!currentItemId) { showToast(t('প্রথমে মূল তথ্য সেভ করুন।','Save Basic Info first.'), 'error'); return; }
    const btn = this; const statusEl = document.getElementById('it_Section2Status');
    const warehouseId = val('it_Op_WarehouseID');
    const qty = Number(val('it_Op_Qty')) || 0;
    if (!warehouseId) { showToast(t('গুদাম বাছাই করুন।','Select a warehouse.'), 'error'); return; }
    if (qty <= 0) { showToast(t('পরিমাণ দিন।','Enter a quantity.'), 'error'); return; }
    btn.disabled = true; statusEl.textContent = t('সেভ হচ্ছে...','Saving...');
    try {
      await api('postOpeningStock', { itemId: currentItemId, warehouseId: warehouseId, quantity: qty });
      statusEl.textContent = '✓ ' + t('সেভ হয়েছে','Saved');
      showToast(t('প্রারম্ভিক মজুদ যোগ হয়েছে ✅','Opening stock added ✅'), 'success');
    } catch (err) {
      showToast(err.message, 'error');
      statusEl.textContent = '';
    } finally {
      btn.disabled = false;
    }
  });

  // ---- সেকশন ৩: আদর্শ ক্রয় দর সেভ ----
  document.getElementById('it_SaveSection3').addEventListener('click', async function () {
    if (!currentItemId) { showToast(t('প্রথমে মূল তথ্য সেভ করুন।','Save Basic Info first.'), 'error'); return; }
    const btn = this; const statusEl = document.getElementById('it_Section3Status');
    btn.disabled = true; statusEl.textContent = t('সেভ হচ্ছে...','Saving...');
    try {
      await api('update', { sheet:'Items', idField:'ItemID', idValue: currentItemId, data: {
        StandardCost: val('it_StdPurchaseRate') === '' ? 0 : val('it_StdPurchaseRate'),
        StandardCostDate: val('it_StdPurchaseDate') || null
      }});
      statusEl.textContent = '✓ ' + t('সেভ হয়েছে','Saved');
      showToast(t('ক্রয় দর সেভ হয়েছে ✅','Purchase rate saved ✅'), 'success');
      if (window.__refreshItemList) await window.__refreshItemList();
    } catch (err) {
      showToast(err.message, 'error');
      statusEl.textContent = '';
    } finally {
      btn.disabled = false;
    }
  });

  // ---- সেকশন ৪: আদর্শ বিক্রয় দর সেভ ----
  document.getElementById('it_SaveSection4').addEventListener('click', async function () {
    if (!currentItemId) { showToast(t('প্রথমে মূল তথ্য সেভ করুন।','Save Basic Info first.'), 'error'); return; }
    const btn = this; const statusEl = document.getElementById('it_Section4Status');
    btn.disabled = true; statusEl.textContent = t('সেভ হচ্ছে...','Saving...');
    try {
      await api('update', { sheet:'Items', idField:'ItemID', idValue: currentItemId, data: {
        SalesPrice: val('it_StdSalesRate') === '' ? 0 : val('it_StdSalesRate'),
        SalesPriceDate: val('it_StdSalesDate') || null
      }});
      statusEl.textContent = '✓ ' + t('সেভ হয়েছে','Saved');
      showToast(t('বিক্রয় দর সেভ হয়েছে ✅','Sales rate saved ✅'), 'success');
      if (window.__refreshItemList) await window.__refreshItemList();
    } catch (err) {
      showToast(err.message, 'error');
      statusEl.textContent = '';
    } finally {
      btn.disabled = false;
    }
  });
}

/**
 * প্রতিটা পার্টি (ব্যক্তি/প্রতিষ্ঠান) স্বয়ংক্রিয়ভাবেই সাপ্লায়ার ও
 * কাস্টমার — দুটো হিসেবেই ব্যবহারযোগ্য হয় (একবার এন্ট্রি দিলেই
 * Suppliers ও Customers দুই Sheet-এ একই Code দিয়ে সেভ হয়)। তাই
 * আলাদা করে টিক দেওয়ার দরকার নেই — Purchase-এ তাকে সাপ্লায়ার
 * হিসেবে, Sales-এ কাস্টমার হিসেবে সরাসরি বাছাই করা যাবে।
 */

async function renderPartyMasterPage(content) {
  content.innerHTML = `
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="পার্টি (সাপ্লায়ার / কাস্টমার)" data-en="Party (Supplier / Customer)">${t('পার্টি (সাপ্লায়ার / কাস্টমার)','Party (Supplier / Customer)')}</h1>
        <p class="i18n" data-bn="একই ব্যক্তি বা প্রতিষ্ঠান থেকে ক্রয় ও তার কাছে বিক্রয় — দুটোই করা যাবে" data-en="Buy from and sell to the same person or business — both work">${t('একই ব্যক্তি বা প্রতিষ্ঠান থেকে ক্রয় ও তার কাছে বিক্রয় — দুটোই করা যাবে','Buy from and sell to the same person or business — both work')}</p>
      </div>
      <button class="btn btn-primary i18n" style="width:auto;" id="partyAddBtn" data-bn="+ নতুন পার্টি" data-en="+ New Party">${t('+ নতুন পার্টি','+ New Party')}</button></div>
    <div class="panel"><div id="partyListWrap"></div></div>`;

  async function loadPartyList() {
    const [suppliers, customers] = await Promise.all([api('list', { sheet:'Suppliers' }), api('list', { sheet:'Customers' })]);
    const map = {};
    function upsert(rec) {
      const key = rec.Code || rec.SupplierID || rec.CustomerID;
      if (!key) return;
      if (!map[key]) map[key] = { Code:key, Name:rec.Name, CompanyName:rec.CompanyName, Phone:rec.Phone, Zone:rec.Zone, Active:false };
      if (!map[key].Name && rec.Name) map[key].Name = rec.Name;
      if (!map[key].CompanyName && rec.CompanyName) map[key].CompanyName = rec.CompanyName;
      if (isTrue(rec.IsActive)) map[key].Active = true;
    }
    suppliers.filter(function (s) { return s.Status !== 'Deleted'; }).forEach(upsert);
    customers.filter(function (c) { return c.Status !== 'Deleted'; }).forEach(upsert);

    const rows = Object.values(map);
    const wrap = document.getElementById('partyListWrap');
    if (!wrap) return; // ব্যবহারকারী এই ফাঁকে অন্য পেজ/ট্যাবে চলে গেলে এই এলিমেন্ট আর DOM-এ থাকবে না
    if (rows.length === 0) {
      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এখনো কোনো পার্টি যোগ করা হয়নি।" data-en="No parties added yet.">${t('এখনো কোনো পার্টি যোগ করা হয়নি।','No parties added yet.')}</div>`;
      return;
    }

    const headers = [
      ['কোড','Code'], ['প্রোপ্রাইটর','Proprietor'], ['ব্যবসার নাম','Business Name'],
      ['ফোন','Phone'], ['জোন','Zone'], ['অবস্থা','Status']
    ];
    const headCells = headers.map(function (h) { return `<th class="i18n" data-bn="${h[0]}" data-en="${h[1]}">${t(h[0], h[1])}</th>`; }).join('');

    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}<th></th></tr></thead><tbody>
      ${rows.map(function (r) {
        return `<tr>
          <td>${escapeHtml(r.Code)}</td><td>${escapeHtml(r.Name)}</td><td>${escapeHtml(r.CompanyName)}</td>
          <td>${escapeHtml(r.Phone)}</td><td>${escapeHtml(r.Zone)}</td>
          <td><span class="badge ${r.Active?'active':'inactive'} i18n" data-bn="${r.Active?'সক্রিয়':'নিষ্ক্রিয়'}" data-en="${r.Active?'Active':'Inactive'}">${t(r.Active?'সক্রিয়':'নিষ্ক্রিয়', r.Active?'Active':'Inactive')}</span></td>
          <td class="row-actions"><button onclick='openPartyForm(${JSON.stringify(r.Code)})' title="${t('সম্পাদনা','Edit')}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="m18.5 2.5 3 3L10 17l-4 1 1-4Z"/></svg>
          </button></td>
        </tr>`;
      }).join('')}
    </tbody></table>`;
  }

  await loadPartyList();
  window.__refreshPartyList = loadPartyList;
  document.getElementById('partyAddBtn').addEventListener('click', function () { openPartyForm(null); });
}

async function openPartyForm(existingCode) {
  let supplierRec = null, customerRec = null;
  const zonesPromise = api('list', { sheet: 'Zones' });
  if (existingCode) {
    const [suppliers, customers] = await Promise.all([api('list', { sheet:'Suppliers' }), api('list', { sheet:'Customers' })]);
    supplierRec = suppliers.find(function (s) { return s.Code === existingCode && s.Status !== 'Deleted'; }) || null;
    customerRec = customers.find(function (c) { return c.Code === existingCode && c.Status !== 'Deleted'; }) || null;
  }
  const zones = await zonesPromise;
  const rec = supplierRec || customerRec || {};
  const isEdit = !!existingCode;

  function zoneOptionsHtml() {
    return zones.filter(function (z) { return z.Status !== 'Deleted'; })
      .map(function (z) { return `<option value="${attr(z.ZoneName)}" ${rec.Zone===z.ZoneName?'selected':''}>${escapeHtml(z.ZoneName)}</option>`; }).join('');
  }

  const bodyHtml = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
      <div class="field"><label>কোড</label><input id="pf_Code" value="${attr(existingCode || '')}" ${isEdit ? 'readonly style="background:var(--bg);"' : 'placeholder="খালি রাখলে অটো তৈরি হবে"'}></div>
      <div class="field"><label>জোন</label>
        <div style="display:flex;gap:8px;">
          <select id="pf_Zone" style="flex:1;min-width:0;"><option value="">—</option>${zoneOptionsHtml()}</select>
          <button type="button" id="pf_AddZoneBtn" class="btn" style="width:auto;padding:0 14px;flex-shrink:0;" title="নতুন জোন যোগ করুন">+</button>
        </div>
      </div>
      <div class="field"><label>ব্যবসার নাম (Business Name)</label><input id="pf_CompanyName" value="${attr(rec.CompanyName)}"></div>
      <div class="field"><label>প্রোপ্রাইটরের নাম (Proprietor Name)</label><input id="pf_Name" value="${attr(rec.Name)}"></div>
      <div class="field"><label>ফোন</label><input id="pf_Phone" value="${attr(rec.Phone)}"></div>
      <div class="field"><label>Email</label><input id="pf_Email" value="${attr(rec.Email)}"></div>
      ${amountDrCrFieldHtml('pf_OpeningBalance', 'ওপেনিং ব্যালেন্স', rec.OpeningBalance)}
      ${amountDrCrFieldHtml('pf_CreditLimit', 'ক্রেডিট লিমিট', rec.CreditLimit)}
      <div class="field"><label>লিমিট পরিশোধের তারিখ</label><input type="date" id="pf_CreditLimitPaidDate" value="${attr(rec.CreditLimitPaidDate)}"></div>
      <div class="field"><label>ঠিকানা</label><input id="pf_Address" value="${attr(rec.Address)}"></div>
      <div class="field"><label>ব্যাংক নাম</label><input id="pf_BankName" value="${attr(rec.BankName)}" placeholder="যেমন: সোনালী ব্যাংক, মতিঝিল শাখা"></div>
      <div class="field"><label>ব্যাংক অ্যাকাউন্ট নম্বর</label><input id="pf_BankAccountNumber" value="${attr(rec.BankAccountNumber)}"></div>
      <div class="field"><label>অবস্থা</label><select id="pf_IsActive">
        <option value="TRUE" ${!isEdit || isTrue(rec.IsActive) ? 'selected' : ''}>Active</option>
        <option value="FALSE" ${isEdit && !isTrue(rec.IsActive) ? 'selected' : ''}>Inactive</option>
      </select></div>
    </div>
    ${isEdit ? '<div style="margin-top:16px;"><button type="button" id="partyDeleteBtn" class="btn" style="width:auto;background:#fdecea;color:var(--danger);border-color:#f6c6c2;">ডিলিট করুন</button></div>' : ''}`;

  openModal({
    title: (isEdit ? 'সম্পাদনা — ' : 'নতুন — ') + 'পার্টি',
    bodyHtml: bodyHtml,
    onSave: async function () {
      const code = val('pf_Code') || ('PTY-' + Date.now().toString().slice(-6));
      const name = val('pf_Name');
      if (!name) throw new Error('প্রোপ্রাইটরের নাম আবশ্যক।');

      const common = {
        Code: code, Name: name, CompanyName: val('pf_CompanyName'), Phone: val('pf_Phone'), Email: val('pf_Email'),
        Address: val('pf_Address'), Zone: val('pf_Zone'), CreditLimitPaidDate: val('pf_CreditLimitPaidDate') || null,
        OpeningBalance: readAmountDrCr('pf_OpeningBalance'), CreditLimit: readAmountDrCr('pf_CreditLimit'),
        BankName: val('pf_BankName') || null, BankAccountNumber: val('pf_BankAccountNumber') || null,
        IsActive: val('pf_IsActive')
      };

      if (supplierRec) {
        await api('update', { sheet:'Suppliers', idField:'SupplierID', idValue: supplierRec.SupplierID, data: common });
      } else {
        await api('create', { sheet:'Suppliers', idField:'SupplierID', idPrefix:'SUP', requiredFields:['Name'], data: common });
      }
      if (customerRec) {
        await api('update', { sheet:'Customers', idField:'CustomerID', idValue: customerRec.CustomerID, data: common });
      } else {
        await api('create', { sheet:'Customers', idField:'CustomerID', idPrefix:'CUS', requiredFields:['Name'], data: common });
      }

      showToast('সেভ হয়েছে ✅ (কোড: ' + code + ')', 'success');
      if (window.__refreshPartyList) await window.__refreshPartyList();
    }
  });

  document.getElementById('pf_AddZoneBtn').addEventListener('click', async function () {
    const name = prompt('নতুন জোনের নাম লিখুন:');
    if (!name || !name.trim()) return;
    try {
      const newZone = await api('create', { sheet:'Zones', idField:'ZoneID', idPrefix:'ZONE', requiredFields:['ZoneName'], data:{ ZoneName: name.trim() } });
      const select = document.getElementById('pf_Zone');
      if (!select) return; // মোডাল ততক্ষণে বন্ধ হয়ে গেলে আর কিছু করার দরকার নেই
      const opt = document.createElement('option');
      opt.value = newZone.ZoneName;
      opt.textContent = newZone.ZoneName;
      opt.selected = true;
      select.appendChild(opt);
      showToast('নতুন জোন যোগ হয়েছে ✅', 'success');
    } catch (err) {
      showToast(err.message, 'error');
    }
  });

  if (isEdit) {
    document.getElementById('partyDeleteBtn').addEventListener('click', async function () {
      if (!confirm('আপনি কি নিশ্চিত এই পার্টি ডিলিট করতে চান?')) return;
      try {
        if (supplierRec) await api('delete', { sheet:'Suppliers', idField:'SupplierID', idValue: supplierRec.SupplierID });
        if (customerRec) await api('delete', { sheet:'Customers', idField:'CustomerID', idValue: customerRec.CustomerID });
        showToast('ডিলিট হয়েছে ✅', 'success');
        closeModal();
        if (window.__refreshPartyList) await window.__refreshPartyList();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  }
}

async function openSimpleVoucherForm(existing) {
  const config = window.__activeSimpleVoucherConfig;
  const isEdit = !!existing;
  const isPosted = isEdit && existing.Status === 'Posted';

  const fkFieldsList = config.fields.filter(function (f) { return f.type === 'select-fk'; });
  const uniqueFkSheets = Array.from(new Set(fkFieldsList.map(function (f) { return f.fkSheet; })));
  const fkSheetMap = await cachedListMultiple(uniqueFkSheets);
  const fkLists = {};
  fkFieldsList.forEach(function (f) { fkLists[f.key] = fkSheetMap[f.fkSheet]; });

  const bodyHtml = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">` +
    config.fields.map(function (f) {
      const id = 'sv_' + f.key;
      const currentVal = existing ? existing[f.key] : '';
      const disabledAttr = isPosted ? 'disabled' : '';
      const label = t(f.label, f.labelEn || f.label);
      if (f.type === 'select-fk') {
        const opts = (fkLists[f.key] || []).filter(function (r) { return r.Status !== 'Deleted'; })
          .map(function (r) { return `<option value="${attr(r[f.fkIdField])}" ${currentVal===r[f.fkIdField]?'selected':''}>${escapeHtml(r[f.fkLabel])}</option>`; }).join('');
        return `<div class="field"><label>${label}</label><select id="${id}" ${disabledAttr}><option value="">—</option>${opts}</select></div>`;
      }
      if (f.type === 'select-enum') {
        const opts = f.options.map(function (o) { return `<option value="${o}" ${currentVal===o?'selected':''}>${o}</option>`; }).join('');
        return `<div class="field"><label>${label}</label><select id="${id}" ${disabledAttr}><option value="">—</option>${opts}</select></div>`;
      }
      if (f.type === 'date') return `<div class="field"><label>${label}</label><input type="date" id="${id}" value="${attr(currentVal)}" ${disabledAttr}></div>`;
      if (f.type === 'number') return `<div class="field"><label>${label}</label><input type="number" step="any" id="${id}" value="${attr(currentVal)}" ${disabledAttr}></div>`;
      return `<div class="field"><label>${label}</label><input id="${id}" value="${attr(currentVal)}" ${disabledAttr}></div>`;
    }).join('') +
    `</div>` +
    (isPosted ? `<p style="margin-top:14px;color:var(--text-muted);font-size:12.5px;">${t('এই ভাউচার পোস্ট হয়ে গেছে — আর সম্পাদনা করা যাবে না।','This voucher is already posted — it can no longer be edited.')}</p>` : '');

  openModal({
    title: (isEdit ? t('সম্পাদনা — ','Edit — ') : t('নতুন — ','New — ')) + t(config.titleBn, config.titleEn),
    bodyHtml: bodyHtml,
    onSave: async function () {
      if (isPosted) throw new Error(t('পোস্ট করা ভাউচার সম্পাদনা করা যাবে না।','A posted voucher cannot be edited.'));
      const data = {};
      config.fields.forEach(function (f) { data[f.key] = val('sv_' + f.key); });
      const missing = config.fields.filter(function (f) { return f.required && !data[f.key]; });
      if (missing.length > 0) throw new Error(missing.map(function (f) { return t(f.label, f.labelEn||f.label); }).join(', ') + t(' আবশ্যক।',' is required.'));

      if (isEdit) {
        await api('update', { sheet: config.sheet, idField: config.idField, idValue: existing[config.idField], data: data });
      } else {
        const requiredFields = config.fields.filter(function (f) { return f.required; }).map(function (f) { return f.key; });
        await api('create', { sheet: config.sheet, idField: config.idField, idPrefix: config.idPrefix, requiredFields: requiredFields, data: data });
      }
      showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
      if (window.__refreshSimpleVoucherList) await window.__refreshSimpleVoucherList();
    }
  });
}

/** ট্রায়াল ব্যালেন্স — বর্তমানে শুধু পোস্ট করা Journal Voucher-এর হিসাব দেখায় */
async function renderTrialBalance(content) {
  const [jvHeaders, jvLines, accounts] = await Promise.all([
    api('list', { sheet:'JournalVoucher' }), api('list', { sheet:'JV_Lines' }), api('list', { sheet:'ChartOfAccounts' })
  ]);
  const postedJVIDs = new Set(jvHeaders.filter(function (h) { return h.Status === 'Posted'; }).map(function (h) { return h.JVID; }));
  const accMap = {}; accounts.forEach(function (a) { accMap[a.AccountID] = a.AccountName; });

  const totals = {};
  jvLines.filter(function (l) { return postedJVIDs.has(l.JVID); }).forEach(function (l) {
    if (!totals[l.AccountID]) totals[l.AccountID] = { debit: 0, credit: 0 };
    totals[l.AccountID].debit += Number(l.Debit || 0);
    totals[l.AccountID].credit += Number(l.Credit || 0);
  });

  content.innerHTML = `
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="ট্রায়াল ব্যালেন্স" data-en="Trial Balance">${t('ট্রায়াল ব্যালেন্স','Trial Balance')}</h1>
        <p class="i18n" data-bn="বর্তমানে শুধু পোস্ট করা জার্নাল ভাউচার এন্ট্রি থেকে হিসাব করা হয়েছে" data-en="Currently computed from posted Journal Voucher entries only">${t('বর্তমানে শুধু পোস্ট করা জার্নাল ভাউচার এন্ট্রি থেকে হিসাব করা হয়েছে','Currently computed from posted Journal Voucher entries only')}</p>
      </div></div>
    <div class="panel"><div id="trialBalanceWrap"></div></div>`;

  const wrap = document.getElementById('trialBalanceWrap');
  if (!wrap) return; // ব্যবহারকারী এই ফাঁকে অন্য পেজ/ট্যাবে চলে গেলে এই এলিমেন্ট আর DOM-এ থাকবে না
  const accountIds = Object.keys(totals);
  if (accountIds.length === 0) {
    wrap.innerHTML = `<div class="empty-state i18n" data-bn="কোনো পোস্ট করা Journal Voucher নেই।" data-en="No posted Journal Vouchers yet.">${t('কোনো পোস্ট করা Journal Voucher নেই।','No posted Journal Vouchers yet.')}</div>`;
    return;
  }

  let grandDebit = 0, grandCredit = 0;
  const rows = accountIds.map(function (accId) {
    const tt = totals[accId];
    grandDebit += tt.debit; grandCredit += tt.credit;
    return `<tr><td>${escapeHtml(accMap[accId] || accId)}</td><td>${tt.debit.toFixed(2)}</td><td>${tt.credit.toFixed(2)}</td></tr>`;
  }).join('');

  const headers = [['হিসাব খাত','Account'],['Debit','Debit'],['Credit','Credit']];
  const headCells = headers.map(function (h) { return `<th class="i18n" data-bn="${h[0]}" data-en="${h[1]}">${t(h[0], h[1])}</th>`; }).join('');

  wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}</tr></thead><tbody>${rows}
    <tr style="font-weight:700;background:var(--bg);"><td class="i18n" data-bn="মোট" data-en="Total">${t('মোট','Total')}</td><td>${grandDebit.toFixed(2)}</td><td>${grandCredit.toFixed(2)}</td></tr>
  </tbody></table>`;
}

        return { EmployeeID: e.EmployeeID, BasicSalary: basic, Allowance: allow, Deduction: deduct, NetPay: basic + allow - deduct };
      });

      await api('createDocument', {
        headerSheet: 'Payroll', idField: 'PayrollID', idPrefix: 'PRL', requiredFields: ['Month','Year'],
        linesSheet: 'Payroll_Lines', lineIdField: 'PayrollID',
        headerData: { Month: month, Year: year, Status: 'Active' },
        lines: lines
      });
      showToast(t('পে-রোল তৈরি হয়েছে ✅','Payroll created ✅'), 'success');
      if (window.__refreshPayrollList) await window.__refreshPayrollList();
    }
  });
}
window.updatePayrollNet = function (idx) {
  const basic = Number(document.getElementById('pr_' + idx + '_basic').value) || 0;
  const allow = Number(document.getElementById('pr_' + idx + '_allow').value) || 0;

};

/**

window.recalcProcessing = function () {
  const qty = Number(val('pv_Qty')) || 0;
  const rmRate = Number(val('pv_RMRate')) || 0;
  const procRate = Number(val('pv_ProcRate')) || 0;

  const rmValue = qty * rmRate;
  const procValue = qty * procRate;
  const total = rmValue + procValue;

  document.getElementById('pv_RMValue').value = rmValue.toFixed(2);
  document.getElementById('pv_ProcValue').value = procValue.toFixed(2);
  document.getElementById('pv_Total').value = total.toFixed(2);

  let bpQtySum = 0, bpValueSum = 0;
  (window.__procByProductRows || []).forEach(function (_, idx) {
    const bpQty = Number(val('pv_bp_' + idx + '_qty')) || 0;
    const bpRate = Number(val('pv_bp_' + idx + '_rate')) || 0;
    const bpValue = bpQty * bpRate;
    bpQtySum += bpQty;
    bpValueSum += bpValue;
    const valEl = document.getElementById('pv_bp_' + idx + '_val');
    if (valEl) valEl.textContent = bpValue.toFixed(2);
  });

  const netWeight = qty - bpQtySum;
  const netValue = total - bpValueSum;
  document.getElementById('pv_NetWeight').value = netWeight.toFixed(3);
  document.getElementById('pv_NetValue').value = netValue.toFixed(2);

  const pieces = Number(val('pv_Pieces')) || 0;
  document.getElementById('pv_RatePerKg').value = netWeight > 0 ? (netValue / netWeight).toFixed(2) : '0.00';
  document.getElementById('pv_RatePerPiece').value = pieces > 0 ? (netValue / pieces).toFixed(2) : '0.00';
};

    if (rows.length === 0) { wrap.innerHTML = `<div class="empty-state">${t('কোনো লাইন পাওয়া যায়নি।','No lines found.')}</div>`; return; }

    const headers = [['কর্মচারী','Employee'],['মূল বেতন','Basic'],['ভাতা','Allowance'],['কর্তন','Deduction'],['নিট বেতন','Net Pay']];
    const headCells = headers.map(function (h) { return `<th>${t(h[0], h[1])}</th>`; }).join('');
    const bodyRows = rows.map(function (l) {
      return `<tr><td>${escapeHtml(empMap[l.EmployeeID] || l.EmployeeID)}</td><td>${Number(l.BasicSalary||0).toFixed(2)}</td>

    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}</tr></thead><tbody>${bodyRows}</tbody></table>`;
  });
}

        <p class="i18n" data-bn="ক্রয় ও ক্রয় ফেরত — একই জায়গা থেকে" data-en="Purchase and purchase return — from one place">${t('ক্রয় ও ক্রয় ফেরত — একই জায়গা থেকে','Purchase and purchase return — from one place')}</p>

      <button class="btn btn-primary i18n" style="width:auto;" id="pvAddBtn" data-bn="+ নতুন যোগ করুন" data-en="+ Add New">${t('+ নতুন যোগ করুন','+ Add New')}</button></div>

      api('list', { sheet:'PurchaseInvoice' }), api('list', { sheet:'PurchaseReturn' }),
      cachedList('Suppliers'), cachedList('Users')
    ]);
    const supMap = {}; suppliers.forEach(function (s) { supMap[s.SupplierID] = s.CompanyName || s.Name; });
    const purMap = {}; users.forEach(function (u) { purMap[u.UserID] = u.FullName; });

    const merged = invoices.filter(function (r) { return r.Status !== 'Deleted'; }).map(function (r) {
      return { type:'PurchaseInvoice', typeLabel:['ক্রয় ভাউচার','Purchase Voucher'], id:r.PIID, date:r.InvoiceDate, supplierId:r.SupplierID, walkInName:r.WalkInPartyName, purchaserId:r.PurchaserID, amount:r.TotalAmount, status:r.Status };
    }).concat(returns.filter(function (r) { return r.Status !== 'Deleted'; }).map(function (r) {
      return { type:'PurchaseReturn', typeLabel:['ক্রয় ফেরত ভাউচার','Purchase Return Voucher'], id:r.PRetID, date:r.Date, supplierId:r.SupplierID, purchaserId:r.PurchaserID, amount:null, status:r.Status };
    }));
    merged.sort(function (a, b) { return String(a.date||'').localeCompare(String(b.date||'')); });

    const wrap = document.getElementById('pvTableWrap');
    if (!wrap) return;
    if (merged.length === 0) {
      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এখনো কোনো ভাউচার তৈরি হয়নি।" data-en="No vouchers created yet.">${t('এখনো কোনো ভাউচার তৈরি হয়নি।','No vouchers created yet.')}</div>`;
      return;
    }

    const headers = [['টাইপ','Type'],['ভাউচার নম্বর','Voucher No'],['তারিখ','Date'],['সাপ্লায়ার','Supplier'],['ক্রয়কারী','Purchaser'],['মূল্য','Amount'],['অবস্থা','Status']];
    const headCells = headers.map(function (h) { return `<th class="i18n" data-bn="${h[0]}" data-en="${h[1]}">${t(h[0], h[1])}</th>`; }).join('');
    const bodyRows = merged.slice().reverse().map(function (r) {
      const isPosted = r.status === 'Posted';
      const postBtn = !isPosted
        ? `<button class="btn" style="width:auto;padding:6px 12px;font-size:12px;" onclick='postPurchaseVoucherRecord(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})'>${t('পোস্ট করুন','Post')}</button>`
        : '';
      const editBtn = !isPosted
        ? `<button onclick='openPurchaseVoucherForm(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('সম্পাদনা','Edit')}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="m18.5 2.5 3 3L10 17l-4 1 1-4Z"/></svg>
          </button>`
        : '';
      const deleteBtn = !isPosted
        ? `<button onclick='deletePurchaseVoucherRecord(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('ডিলিট','Delete')}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
          </button>`
        : (currentUser && currentUser.RoleID === 'ROLE-ADMIN'
            ? `<button onclick='deletePostedPurchaseVoucher(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('এডমিন ডিলিট (পাসওয়ার্ড লাগবে)','Admin delete (password required)')}" style="color:var(--danger);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </button>`
            : '');
      const previewBtn = `<button onclick='openPrintableVoucherView(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('প্রিভিউ/প্রিন্ট/শেয়ার','Preview/Print/Share')}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        </button>`;
      return `<tr ondblclick='openPurchaseVoucherForm(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' style="cursor:pointer;" title="${t('এডিট করতে ডাবল-ক্লিক করুন','Double-click to edit')}">
        <td>${t(r.typeLabel[0], r.typeLabel[1])}</td><td>${escapeHtml(r.id)}</td><td>${escapeHtml(r.date)}</td>
        <td>${escapeHtml(r.supplierId === 'SUP-CASH' && r.walkInName ? ('নগদ (' + r.walkInName + ')') : (supMap[r.supplierId] || r.supplierId))}</td><td>${escapeHtml(purMap[r.purchaserId] || '—')}</td>
        <td>${r.amount !== null ? Number(r.amount).toFixed(2) : '—'}</td>
        <td>${isPosted ? `<span class="badge active">${t('পোস্ট করা','Posted')}</span>` : `<span class="badge draft">${t('খসড়া','Draft')}</span>`}</td>
        <td class="row-actions" onclick="event.stopPropagation();">${postBtn}${previewBtn}${editBtn}${deleteBtn}</td>
      </tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}<th></th></tr></thead><tbody>${bodyRows}</tbody></table>`;
  }

  await loadList();
  window.__refreshPurchaseVoucherList = loadList;
  document.getElementById('pvAddBtn').addEventListener('click', function () { openPurchaseVoucherForm(defaultType, null); });
}

async function postPurchaseVoucherRecord(docType, docId) {
  if (!confirm(t('আপনি কি নিশ্চিত এই ভাউচার পোস্ট করতে চান? পোস্ট হয়ে গেলে স্টক/লেজারে এন্ট্রি পড়বে এবং এটা আর বাতিল করা যাবে না।','Are you sure you want to post this voucher? Once posted, stock/ledger entries will be created and this cannot be undone.'))) return;
  try {
    await api('postDocument', { docType: docType, docId: docId });
    showToast(t('পোস্ট হয়েছে ✅','Posted ✅'), 'success');
    if (window.__refreshPurchaseVoucherList) await window.__refreshPurchaseVoucherList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function deletePurchaseVoucherRecord(docType, docId) {
  if (!confirm(t('আপনি কি নিশ্চিত এই ভাউচার ডিলিট করতে চান?','Are you sure you want to delete this voucher?'))) return;
  const config = docType === 'PurchaseReturn'
    ? { sheet:'PurchaseReturn', idField:'PRetID' }
    : { sheet:'PurchaseInvoice', idField:'PIID' };
  try {
    await api('delete', { sheet: config.sheet, idField: config.idField, idValue: docId });
    showToast(t('ডিলিট হয়েছে ✅','Deleted ✅'), 'success');
    if (window.__refreshPurchaseVoucherList) await window.__refreshPurchaseVoucherList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function deletePostedPurchaseVoucher(docType, docId) {
  const config = docType === 'PurchaseReturn'
    ? { sheet:'PurchaseReturn', idField:'PRetID', linesSheet:'PR_Return_Lines', lineIdField:'PRetID' }
    : { sheet:'PurchaseInvoice', idField:'PIID', linesSheet:'PI_Lines', lineIdField:'PIID' };
  await deletePostedVoucherWithAdminAuth(docType, docId, config.sheet, config.idField, config.linesSheet, config.lineIdField, window.__refreshPurchaseVoucherList);
}

/** প্রিভিউ/প্রিন্ট/শেয়ার — একটা প্রিন্ট-উপযোগী ভাউচার নতুন ট্যাবে খুলবে।
 *  "পেজ সেটাপ" ব্রাউজারের নিজস্ব প্রিন্ট ডায়ালগেই থাকে (কাগজের সাইজ/মার্জিন) —
 *  আলাদা করে কাস্টম বানানো সম্ভব না, তাই সেই বাটনও প্রিন্ট ডায়ালগেই নিয়ে যায়। */
async function openPrintableVoucherView(docType, docId) {
  const isSales = docType === 'SalesInvoice' || docType === 'SalesReturn';
  const isReturn = docType === 'PurchaseReturn' || docType === 'SalesReturn';

  const cfg = isSales
    ? { headerSheet: isReturn ? 'SalesReturn' : 'SalesInvoice', idField: isReturn ? 'SRID' : 'SIID', linesSheet: isReturn ? 'SR_Lines' : 'SI_Lines', lineIdField: isReturn ? 'SRID' : 'SIID' }
    : { headerSheet: isReturn ? 'PurchaseReturn' : 'PurchaseInvoice', idField: isReturn ? 'PRetID' : 'PIID', linesSheet: isReturn ? 'PR_Return_Lines' : 'PI_Lines', lineIdField: isReturn ? 'PRetID' : 'PIID' };
  const headerSheet = cfg.headerSheet, idField = cfg.idField, linesSheet = cfg.linesSheet, lineIdField = cfg.lineIdField;

  const [doc, parties, personRefs, items, units, groups, categories, company] = await Promise.all([
    api('getDocument', { headerSheet: headerSheet, idField: idField, linesSheet: linesSheet, lineIdField: lineIdField, idValue: docId }),
    isSales ? cachedList('Customers') : cachedList('Suppliers'),
    cachedList('Users'),
    cachedList('Items'), cachedList('UOM'),
    cachedList('ItemGroups'), cachedList('Categories'),
    api('getSingleton', { sheet:'CompanyProfile' })
  ]);
  const header = doc.header, lines = doc.lines;
  const partyIdField = isSales ? 'CustomerID' : 'SupplierID';
  const party = parties.find(function (p) { return p[partyIdField] === header[partyIdField]; });
  const personIdField = isSales ? 'SalespersonID' : 'PurchaserID';
  const personNameField = 'FullName';
  const person = personRefs.find(function (p) { return p.UserID === header[personIdField]; });
  const itemMap = {}; items.forEach(function (i) { itemMap[i.ItemID] = i; });
  const unitMap = {}; units.forEach(function (u) { unitMap[u.UOMID] = u.UOMName; });
  const groupMap = {}; groups.forEach(function (g) { groupMap[g.GroupID] = g.GroupName; });
  const catMap = {}; categories.forEach(function (c) { catMap[c.CategoryID] = c.CategoryName; });

  // পশ্চিমা (0-9) সংখ্যাকে বাংলা অঙ্কে (০-৯) বদলে দেয় — প্রিন্ট ভাউচারের সব সংখ্যা বাংলায় দেখানোর জন্য
  function bn(num) {
    const map = { '0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯' };
    return String(num).replace(/[0-9]/g, function (d) { return map[d]; });
  }

  // আইটেম | পরিমাণ (একক-সহ) | দর | মূল্য — একক আলাদা কলামে না, পরিমাণের পাশেই
  let totalQty = 0, totalValue = 0, totalComm = 0, totalNet = 0;
  const hasComm = lines.some(function (l) { return Number(l.CommissionAmount) > 0; });
  const rowsHtml = lines.map(function (l) {
    const item = itemMap[l.ItemID] || {};
    const qty = Number(l.Quantity) || 0, rate = Number(l.Rate) || 0, amt = qty * rate;
    const unitLabel = unitMap[item.UOMID] || '';
    const commRate = Number(l.CommissionRate) || 0;
    const commAmt = Number(l.CommissionAmount) || 0;
    const netAmt = (l.NetAmount !== null && l.NetAmount !== undefined) ? Number(l.NetAmount) : (amt - commAmt);
    totalQty += qty; totalValue += amt; totalComm += commAmt; totalNet += netAmt;

    return `<tr>
      <td>${escapeHtml(item.ItemName || l.ItemID)}</td>
      <td>${bn(qty)} ${escapeHtml(unitLabel)}</td>
      <td>${bn(rate.toFixed(2))}</td>
      <td>${bn(amt.toFixed(2))}</td>
      ${hasComm ? `<td>${bn(commRate)}%</td><td>${bn(commAmt.toFixed(2))}</td><td><b>${bn(netAmt.toFixed(2))}</b></td>` : ''}
    </tr>`;
  }).join('');

  const titleMap = {
    PurchaseInvoice: ['ক্রয় ভাউচার', 'Purchase Voucher'],
    PurchaseReturn: ['ক্রয় ফেরত ভাউচার', 'Purchase Return Voucher'],
    SalesInvoice: ['বিক্রয় ভাউচার', 'Sales Voucher'],
    SalesReturn: ['বিক্রয় ফেরত ভাউচার', 'Sales Return Voucher']
  };
  const titleBn = titleMap[docType][0], titleEn = titleMap[docType][1];
  const voucherDate = header.InvoiceDate || header.Date || '';
  const printedAt = formatPrintDate();
  const printedAtEn = formatPrintDate();
  const partyLabelBn = isSales ? 'গ্রাহক' : 'সাপ্লায়ার', partyLabelEn = isSales ? 'Customer' : 'Supplier';
  const personLabelBn = isSales ? 'বিক্রয়কারী' : 'ক্রয়কারী', personLabelEn = isSales ? 'Salesperson' : 'Purchaser';
  const isCashParty = header[partyIdField] === 'SUP-CASH' || header[partyIdField] === 'CUS-CASH';
  // নগদ (ওয়াক-ইন) পার্টির ক্ষেত্রে মাস্টার রেকর্ডের (সাধারণত খালি) তথ্যের বদলে,
  // ভাউচারেই সেভ করা আসল ওয়াক-ইন পার্টির নাম/ঠিকানা/মোবাইল দেখানো হবে
  const partyName = isCashParty
    ? (header.WalkInPartyName ? ('নগদ (' + header.WalkInPartyName + ')') : (party ? (party.CompanyName || party.Name) : header[partyIdField]))
    : (party ? (party.CompanyName || party.Name) : header[partyIdField]);
  const partyAddress = isCashParty ? (header.WalkInPartyAddress || '') : (party ? (party.Address || '') : '');
  const partyZone = party ? (party.Zone || '') : '';
  const partyPhone = isCashParty ? (header.WalkInPartyMobile || '') : (party ? (party.Phone || '') : '');

  // প্রিন্ট ভাউচারের ভেতরের বাং/EN টোগল — L(bn, en) দিয়ে বানানো প্রতিটা লেবেল
  // টোগল বাটনে ক্লিক করলে বদলে যাবে (নিচের স্ক্রিপ্ট দেখুন)
  function L(bn, en) { return `<span data-bn="${attr(bn)}" data-en="${attr(en)}">${escapeHtml(bn)}</span>`; }

  const html = `<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${titleBn} — ${escapeHtml(docId)}</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
  html,body{max-width:100%;overflow-x:hidden;}

  .watermark{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-family:'Oswald',sans-serif;font-size:90px;font-weight:700;color:rgba(18,22,29,.06);letter-spacing:.05em;z-index:0;pointer-events:none;white-space:nowrap;width:100vw;max-width:100vw;overflow:hidden;text-align:center;}
  .doc-head{display:grid;grid-template-columns:80px 1fr 190px;align-items:center;gap:10px;border-bottom:2px solid #1a2029;padding-bottom:10px;margin-bottom:12px;}
  .doc-logo{width:100%;height:auto;aspect-ratio:1/1;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#aab0ba;font-size:10px;text-align:center;}
  .doc-logo img{width:100%;height:100%;object-fit:cover;display:block;}

  .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 24px;margin-bottom:10px;font-size:11px;line-height:1.35;}

/** ডেস্কটপে যেকোনো ফর্মে Enter চাপলে পরের ইনপুট ফিল্ডে, Escape চাপলে আগের
 *  ফিল্ডে ফোকাস যাবে — শুধু দৃশ্যমান ও সক্রিয় (disabled নয়) input/select/textarea
 *  ধরে, checkbox বাদ দিয়ে (checkbox নিজের স্বাভাবিক Space/click আচরণ রাখবে)। */
function wireSequentialKeyNav(container) {
  if (!container) return;
  function focusable() {
    return Array.from(container.querySelectorAll('input, select, textarea')).filter(function (el) {
      return !el.disabled && el.type !== 'checkbox' && el.offsetParent !== null;
    });
  }
  function handler(e) {
    if (e.key !== 'Enter' && e.key !== 'Escape') return;
    if (!document.body.contains(container)) { document.removeEventListener('keydown', handler, true); return; }
    if (!container.contains(document.activeElement)) return;
    if (document.activeElement.tagName === 'TEXTAREA' && e.key === 'Enter') return; // টেক্সট-এরিয়াতে Enter মানে নতুন লাইন
    const fields = focusable();
    const idx = fields.indexOf(document.activeElement);
    if (idx === -1) return;
    e.preventDefault();
    if (e.key === 'Enter') {
      const next = fields[idx + 1];
      if (next) next.focus();
    } else {
      const prev = fields[idx - 1];
      if (prev) prev.focus();
    }
  }
  document.addEventListener('keydown', handler, true);
}

      if (!supplierId) throw new Error(t('সাপ্লায়ার তথ্য আবশ্যক।','Supplier information is required.'));

      const hasPurchase = window.__pv3PurchaseLines.length > 0;
      const hasReturn = window.__pv3ReturnLines.length > 0;
      if (!hasPurchase && !hasReturn) throw new Error(t('অন্তত একটা ক্রয় বা ফেরত লাইন যোগ করুন।','Add at least one purchase or return line.'));

      const isCash = supplierId === 'SUP-CASH';
      const common = {
        SupplierID: supplierId,
        SupplierInvoiceNo: document.getElementById('pv3_SNNoCheck').checked ? (val('pv3_SupplierInvoiceNo') || null) : null,
        SupplierInvoiceDate: document.getElementById('pv3_SNDateCheck').checked ? (val('pv3_SupplierInvoiceDate') || null) : null,
        PurchaserID: currentUser ? currentUser.UserID : null
      };

      if (hasPurchase) {
        const warehouseId = window.__pv3PurchaseLines[0].warehouseId;
        if (!warehouseId) throw new Error(t('ক্রয় লাইনে গুদাম আবশ্যক।','Warehouse is required for purchase lines.'));
        const lineData = window.__pv3PurchaseLines.map(function (l) { return { ItemID: l.itemId, Quantity: l.qty, Rate: l.rate, Amount: l.amount, CommissionRate: l.commRate || 0, CommissionAmount: l.commAmount || 0, NetAmount: l.netAmount !== undefined ? l.netAmount : l.amount }; });
        const itemsTotal = lineData.reduce(function (s, l) { return s + (Number(l.Amount) || 0); }, 0);
        const cashExpenseAmount = (window.__pv3CashExpense && window.__pv3CashExpense.amount) || 0;
        const totalAmount = itemsTotal + cashExpenseAmount;
        const cashExpenseBreakdown = Object.keys((window.__pv3CashExpense && window.__pv3CashExpense.subAmounts) || {})
          .map(function (catId) { const cat = window.__pv3ExpenseCategories.find(function (c) { return c.ExpCatID === catId; }); const amt = window.__pv3CashExpense.subAmounts[catId]; return (cat && amt > 0) ? (cat.ExpCatName + ': ৳' + amt) : null; })
          .filter(Boolean).join(', ');
        const headerData = Object.assign({}, common, {
          InvoiceDate: val('pv3_Date'), WarehouseID: warehouseId, TotalAmount: totalAmount,
          CashExpenseAmount: cashExpenseAmount || null,
          CashExpenseCategory: null,
          CashExpenseNote: cashExpenseBreakdown || null,
          WalkInPartyName: isCash ? (val('pv3_CashName') || null) : null,
          WalkInPartyAddress: isCash ? (val('pv3_CashAddress') || null) : null,
          WalkInPartyMobile: isCash ? (val('pv3_CashMobile') || null) : null
        });
        // এই মুহূর্তে শুধু পেমেন্টের তথ্য হেডারে সেভ হচ্ছে — আসল লেজার/ব্যাংক-বই পোস্টিং
        // ঘটবে ভাউচারটা "পোস্ট করুন" চাপার সময়, যাতে ড্রাফট অবস্থায় হিসাব না বসে
        if (!isCash) {
          headerData.CashPaidAmount = Number(val('pv3_CashPaidAmount')) || 0;
          headerData.CashPaidNote = val('pv3_CashPaidNote') || null;
          headerData.BankPaidAmount = Number(val('pv3_BankPaidAmount')) || 0;
          if (headerData.BankPaidAmount > 0 && !pv3BankPopupFilled) {
            throw new Error(t('ব্যাংক প্রদানের বিবরণ (পপআপে) পূরণ করুন।','Fill in the bank payment details (in the popup).'));
          }
          headerData.BankPaidNote = val('pv3_BankPaidNote') || null;
          const bankPayMethod = val('pv3_BankPayMethod');
          if (headerData.BankPaidAmount > 0 && bankPayMethod === 'OurBankToSupplierBank') {
            const ourBankId = val('pv3_BankAccID');
            if (!ourBankId) throw new Error(t('আমাদের কোন ব্যাংক থেকে টাকা গেল, সেটা বাছাই করুন।','Select which of our banks the money was sent from.'));
            headerData.BankAccIDForPayment = ourBankId;
          } else if (headerData.BankPaidAmount > 0) {
            headerData.BankAccIDForPayment = 'BC-CASH'; // নগদ টু সাপ্লায়ার ব্যাংক — আমাদের ক্যাশ অ্যাকাউন্ট থেকে যাবে
          } else {
            headerData.BankAccIDForPayment = null;
          }
        }

        if (isEdit && existingDocType === 'PurchaseInvoice') {
          await api('updateDocument', { headerSheet:'PurchaseInvoice', idField:'PIID', linesSheet:'PI_Lines', lineIdField:'PIID', idValue: existingId, headerData: headerData, lines: lineData });
        } else {
          await api('createDocument', { headerSheet:'PurchaseInvoice', idField:'PIID', idPrefix:'PI', requiredFields:['SupplierID','WarehouseID'], linesSheet:'PI_Lines', lineIdField:'PIID', headerData: headerData, lines: lineData });
        }
      }

      if (hasReturn) {
        const warehouseId = window.__pv3ReturnLines[0].warehouseId;
        if (!warehouseId) throw new Error(t('ফেরত লাইনে গুদাম আবশ্যক।','Warehouse is required for return lines.'));
        const lineData = window.__pv3ReturnLines.map(function (l) { return { ItemID: l.itemId, Quantity: l.qty, Rate: l.rate, CommissionRate: l.commRate || 0, CommissionAmount: l.commAmount || 0, NetAmount: l.netAmount !== undefined ? l.netAmount : l.amount }; });
        const headerData = Object.assign({}, common, { Date: val('pv3_Date'), WarehouseID: warehouseId });
        if (isEdit && existingDocType === 'PurchaseReturn') {
          await api('updateDocument', { headerSheet:'PurchaseReturn', idField:'PRetID', linesSheet:'PR_Return_Lines', lineIdField:'PRetID', idValue: existingId, headerData: headerData, lines: lineData });
        } else {
          await api('createDocument', { headerSheet:'PurchaseReturn', idField:'PRetID', idPrefix:'PRET', requiredFields:['SupplierID','WarehouseID'], linesSheet:'PR_Return_Lines', lineIdField:'PRetID', headerData: headerData, lines: lineData });
        }
      }

      showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
      if (window.__refreshPurchaseVoucherList) await window.__refreshPurchaseVoucherList();
    }
  });

  function showTab(tab) {

  function wireRevealCheckbox(checkId, fieldId) {
    const check = document.getElementById(checkId), field = document.getElementById(fieldId);
    function sync() {
      field.disabled = !check.checked;
      field.style.display = check.checked ? '' : 'none';
      if (!check.checked) field.value = '';
    }
    check.addEventListener('change', sync);
    sync();
  }
  wireRevealCheckbox('pv3_SNDateCheck', 'pv3_SupplierInvoiceDate');
  wireRevealCheckbox('pv3_SNNoCheck', 'pv3_SupplierInvoiceNo');
  wireRevealCheckbox('pv3_StdPurchaseCheck', 'pv3_PreviewStdPurchaseRate');

  function refreshPv3SupplierOptions() {
    const zoneChecked = document.getElementById('pv3_ZoneCheck').checked;
    const zone = zoneChecked ? val('pv3_ZoneFilter') : '';
    const sel = document.getElementById('pv3_SupplierID');
    const prev = sel.value;
    Array.from(sel.options).forEach(function (opt) {
      if (!opt.value) return; // "—" অপশনটা সবসময় দেখা যাবে
      opt.hidden = !!(zone && opt.getAttribute('data-zone') !== zone);
    });
    if (zone && sel.options[sel.selectedIndex] && sel.options[sel.selectedIndex].hidden) { sel.value = ''; sel.dispatchEvent(new Event('change')); }
  }
  document.getElementById('pv3_ZoneCheck').addEventListener('change', function () {
    document.getElementById('pv3_ZoneFilter').disabled = !this.checked;
    refreshPv3SupplierOptions();

  // "খরচ(+)ঃ" — চেকবক্স টিক না থাকলেও এই ঘরে সরাসরি একটামাত্র (লাম্প-সাম) পরিমাণ
  // লেখা যাবে; টিক দিলে নিচে খাত-ভিত্তিক ভাঙন দেখা যাবে এবং প্রতিটা খাতের
  // পরিমাণ যোগ হয়ে এই উপরের ঘরেই স্বয়ংক্রিয়ভাবে বসে যাবে
  function pv3RecalcExpenseTotal() {
    if (!document.getElementById('pv3_ExpCheck').checked) return; // ম্যানুয়াল মোডে থাকলে হাত দেওয়া হবে না
    const rows = document.querySelectorAll('#pv3_ExpSubWrap [data-exp-amount]');
    let sum = 0;
    rows.forEach(function (inp) { sum += Number(inp.value) || 0; });
    document.getElementById('pv3_ExpTotalAmount').value = sum || '';
    window.__pv3CashExpense.amount = sum;
  }

  function pv3RenderExpSubRows() {
    const wrap = document.getElementById('pv3_ExpSubWrap');
    const amounts = window.__pv3CashExpense.subAmounts || {};
    wrap.innerHTML = `
      <div style="border:1px solid var(--border);border-radius:8px;padding:10px;">
        <div id="pv3_ExpSubRows"></div>
        <button type="button" id="pv3_ExpAddCatBtn" class="btn btn-outline" style="width:100%;margin-top:6px;padding:6px;font-size:12px;">➕ ${t('নতুন সাবখাত','New Sub-category')}</button>
      </div>`;
    const rowsWrap = document.getElementById('pv3_ExpSubRows');
    function renderRows() {
      rowsWrap.innerHTML = window.__pv3ExpenseCategories.map(function (c) {
        const amt = amounts[c.ExpCatID] || '';
        return `<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;" data-cat-id="${attr(c.ExpCatID)}">
          <input data-exp-name value="${attr(c.ExpCatName)}" style="flex:1.4;">
          <input data-exp-amount type="number" step="any" value="${amt}" placeholder="৳" style="flex:1;">
          <button type="button" data-exp-save class="btn btn-outline" style="width:auto;padding:5px 8px;" title="${t('নাম সেভ করুন','Save name')}">💾</button>
          <button type="button" data-exp-del class="btn btn-outline" style="width:auto;padding:5px 8px;" title="${t('মুছুন','Delete')}">🗑️</button>
        </div>`;
      }).join('') || `<div style="color:var(--text-muted);font-size:12px;padding:4px 0;">${t('কোনো সাবখাত নেই — নিচে থেকে যোগ করুন।','No sub-categories yet — add one below.')}</div>`;

      rowsWrap.querySelectorAll('[data-exp-amount]').forEach(function (inp) {
        inp.addEventListener('input', function () {
          const catId = this.closest('[data-cat-id]').getAttribute('data-cat-id');
          window.__pv3CashExpense.subAmounts[catId] = Number(this.value) || 0;
          pv3RecalcExpenseTotal();
        });
      });
      rowsWrap.querySelectorAll('[data-exp-save]').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          const row = this.closest('[data-cat-id]');
          const catId = row.getAttribute('data-cat-id');
          const nameInput = row.querySelector('[data-exp-name]');
          const newName = nameInput.value.trim();
          if (!newName) { showToast(t('খাতের নাম দিন।','Enter a category name.'), 'error'); return; }
          try {
            await api('update', { sheet:'ExpenseCategories', idField:'ExpCatID', idValue: catId, data:{ ExpCatName: newName } });
            const cat = window.__pv3ExpenseCategories.find(function (c) { return c.ExpCatID === catId; });
            if (cat) cat.ExpCatName = newName;
            showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
          } catch (err) { showToast(err.message, 'error'); }
        });
      });
      rowsWrap.querySelectorAll('[data-exp-del]').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          const row = this.closest('[data-cat-id]');
          const catId = row.getAttribute('data-cat-id');
          if (!confirm(t('এই সাবখাতটা মুছে ফেলতে চান?','Delete this sub-category?'))) return;
          try {
            await api('delete', { sheet:'ExpenseCategories', idField:'ExpCatID', idValue: catId });
            window.__pv3ExpenseCategories = window.__pv3ExpenseCategories.filter(function (c) { return c.ExpCatID !== catId; });
            delete window.__pv3CashExpense.subAmounts[catId];
            renderRows();
            pv3RecalcExpenseTotal();
            showToast(t('মুছে ফেলা হয়েছে ✅','Deleted ✅'), 'success');
          } catch (err) { showToast(err.message, 'error'); }
        });
      });
    }
    renderRows();

    document.getElementById('pv3_ExpAddCatBtn').addEventListener('click', async function () {
      const name = prompt(t('নতুন সাবখাতের নাম লিখুন:','Enter new sub-category name:'));
      if (!name || !name.trim()) return;
      try {
        const rec2 = await api('create', { sheet:'ExpenseCategories', idField:'ExpCatID', idPrefix:'EXPCAT', requiredFields:['ExpCatName'], data:{ ExpCatName: name.trim() } });
        window.__pv3ExpenseCategories.push(rec2);
        renderRows();
        showToast(t('সাবখাত যোগ হয়েছে ✅','Sub-category added ✅'), 'success');
      } catch (err) { showToast(err.message, 'error'); }
    });
  }
