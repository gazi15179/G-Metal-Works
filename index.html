  openModal({
    title: (isEdit ? t('সম্পাদনা — ','Edit — ') : t('নতুন — ','New — ')) + t('ক্রয় ভাউচার','Purchase Voucher'),
    bodyHtml: bodyHtml,
    wide: true,
    onSave: async function () {
      const currentType = val('pv_Type');
      const supplierId = val('pv_SupplierID');
      if (!supplierId) throw new Error(t('সাপ্লায়ার বাছাই করা আবশ্যক।','Supplier is required.'));

      const unitMismatches = [];
      const trackingMissing = [];
      const lines = window.__pvLineRows.map(function (_, idx) {
        const itemId = val('pv_ln_' + idx + '_item');
        const item = window.__pvItemMap[itemId];
        const qty = Number(val('pv_ln_' + idx + '_qty')) || 0;
        const rate = Number(val('pv_ln_' + idx + '_rate')) || 0;
        const pieces = Number(val('pv_ln_' + idx + '_pieces')) || 0;
        const ratePiece = Number(val('pv_ln_' + idx + '_rateperpiece')) || 0;

        // "ওজন + পিস" ট্র্যাকিং-ধরনের আইটেমে ওজন ও পিস দুটোই বাধ্যতামূলক —
        // দাম সবসময় ওজনের উপর ভিত্তি করে হিসাব হয়, পিস শুধু স্টকে আলাদাভাবে জমা থাকার জন্য
        if (item && item.TrackingType === 'WeightPieces' && itemId) {
          if (!(qty > 0 && rate > 0 && pieces > 0)) {
            trackingMissing.push(item.ItemName);
          }
          return { ItemID: itemId, Quantity: qty, Rate: rate, Pieces: pieces };
        }

        let finalQty = 0, finalRate = 0, usedMode = null;
        if (qty > 0 && rate > 0) {
          finalQty = qty; finalRate = rate; usedMode = 'Weight';
        } else if (pieces > 0 && ratePiece > 0) {
          usedMode = 'Piece';
          // পিস দিয়ে হিসাব করা হলেও স্টক সবসময় কেজি-সমতুল্যেই জমা থাকে (সামঞ্জস্যের জন্য),
          // Conversion Factor জানা না থাকলে পিস সংখ্যাটাই সরাসরি Quantity হিসেবে ব্যবহার হয়
          const unit = item ? window.__pvUnitMap[item.UOMID] : null;
          const kgPerPiece = Number(unit && unit.ConversionFactor) || 0;
          if (kgPerPiece > 0) {
            finalQty = pieces * kgPerPiece;
            finalRate = finalQty > 0 ? (pieces * ratePiece) / finalQty : 0;
          } else {
            finalQty = pieces; finalRate = ratePiece;
          }
        }

        if (item && item.UnitMode && usedMode && item.UnitMode !== usedMode) {
          unitMismatches.push(item.ItemName);
        }

        return { ItemID: itemId, Quantity: finalQty, Rate: finalRate, Pieces: 0 };
      }).filter(function (l) { return l.ItemID && l.Quantity > 0; });
      if (lines.length === 0) throw new Error(t('অন্তত একটা লাইন আইটেম যোগ করুন।','Add at least one line item.'));

      if (trackingMissing.length > 0) {
        throw new Error(
          t('এই আইটেমগুলো "ওজন + পিস" ধরনের — তাই ওজন, দর এবং পিস তিনটাই আবশ্যক: ', 'These items are tracked as "Weight + Pieces" — weight, rate and pieces are all required: ')
          + trackingMissing.join(', ')
        );
      }

      if (unitMismatches.length > 0) {
        const proceed = confirm(
          t('এই আইটেমগুলো তাদের নির্ধারিত পদ্ধতির (কেজি/পিস) বাইরে ব্যবহার হয়েছে: ', 'These items were used outside their set method (weight/piece): ')
          + unitMismatches.join(', ')
          + '\n\n' + t('তবুও কি সেভ করবেন?', 'Save anyway?')
        );
        if (!proceed) return;
      }

      const common = {
        SupplierID: supplierId,
        SupplierInvoiceNo: val('pv_SupplierInvoiceNo'),
        SupplierInvoiceDate: val('pv_SupplierInvoiceDate') || null,
        PurchaserID: val('pv_PurchaserID') || null
      };

      if (currentType === 'PurchaseInvoice') {
        const warehouseId = val('pv_WarehouseID');
        if (!warehouseId) throw new Error(t('গুদাম বাছাই করা আবশ্যক।','Warehouse is required.'));
        const lineData = lines.map(function (l) { return Object.assign({}, l, { Amount: l.Quantity * l.Rate }); });
        const totalAmount = lineData.reduce(function (s, l) { return s + (Number(l.Amount) || 0); }, 0);
        const headerData = Object.assign({}, common, { InvoiceDate: val('pv_Date'), GRNID: val('pv_GRNID') || null, WarehouseID: warehouseId, TotalAmount: totalAmount });
        if (isEdit) {
          await api('updateDocument', { headerSheet:'PurchaseInvoice', idField:'PIID', linesSheet:'PI_Lines', lineIdField:'PIID', idValue: existingId, headerData: headerData, lines: lineData });
        } else {
          await api('createDocument', { headerSheet:'PurchaseInvoice', idField:'PIID', idPrefix:'PI', requiredFields:['SupplierID','WarehouseID'], linesSheet:'PI_Lines', lineIdField:'PIID', headerData: headerData, lines: lineData });
        }
      } else {
        const grnId = val('pv_GRNID');
        if (!grnId) throw new Error(t('ক্রয় ফেরতের জন্য GRN রেফারেন্স আবশ্যক (গুদাম বের করার জন্য)।','GRN reference is required for a purchase return (to determine the warehouse).'));
        const headerData = Object.assign({}, common, { Date: val('pv_Date'), GRNID: grnId, Reason: val('pv_Reason') });
        if (isEdit) {
          await api('updateDocument', { headerSheet:'PurchaseReturn', idField:'PRetID', linesSheet:'PR_Return_Lines', lineIdField:'PRetID', idValue: existingId, headerData: headerData, lines: lines });
        } else {
          await api('createDocument', { headerSheet:'PurchaseReturn', idField:'PRetID', idPrefix:'PRET', requiredFields:['SupplierID','GRNID'], linesSheet:'PR_Return_Lines', lineIdField:'PRetID', headerData: headerData, lines: lines });
        }
      }

      showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
      if (window.__refreshPurchaseVoucherList) await window.__refreshPurchaseVoucherList();
    }
  });

  function toggleTypeFields() {
    const isReturn = val('pv_Type') === 'PurchaseReturn';
    document.getElementById('pv_GRNField').style.display = isReturn ? '' : 'none';
    document.getElementById('pv_WarehouseField').style.display = isReturn ? 'none' : '';
    document.getElementById('pv_ReasonField').style.display = isReturn ? '' : 'none';
  }
  document.getElementById('pv_Type').addEventListener('change', toggleTypeFields);
  toggleTypeFields();

  document.getElementById('pv_AddPurchaserBtn').addEventListener('click', async function () {
    const name = prompt(t('নতুন ক্রয়কারীর নাম লিখুন:','Enter new purchaser name:'));
    if (!name || !name.trim()) return;
    try {
      const newPurchaser = await api('create', { sheet:'Purchasers', idField:'PurchaserID', idPrefix:'PUR', requiredFields:['PurchaserName'], data:{ PurchaserName: name.trim() } });
      const select = document.getElementById('pv_PurchaserID');
      if (!select) return;
      const opt = document.createElement('option');
      opt.value = newPurchaser.PurchaserID;
      opt.textContent = newPurchaser.PurchaserName;
      opt.selected = true;
      select.appendChild(opt);
      showToast(t('নতুন ক্রয়কারী যোগ হয়েছে ✅','New purchaser added ✅'), 'success');
    } catch (err) {
      showToast(err.message, 'error');
    }
  });

  function onPvLineItemChange(idx) {
    const itemId = val('pv_ln_' + idx + '_item');
    const item = window.__pvItemMap[itemId];
    if (item) {
      const groupSel = document.getElementById('pv_ln_' + idx + '_group');
      const catSel = document.getElementById('pv_ln_' + idx + '_cat');
      const unitEl = document.getElementById('pv_ln_' + idx + '_unit');
      if (groupSel && item.GroupID) groupSel.value = item.GroupID;
      if (catSel && item.CategoryID) catSel.value = item.CategoryID;
      if (unitEl) unitEl.textContent = (window.__pvUnitMap[item.UOMID] && window.__pvUnitMap[item.UOMID].UOMName) || '—';
      const rateInput = document.getElementById('pv_ln_' + idx + '_rate');
      if (rateInput && !rateInput.value && item.StandardCost) rateInput.value = item.StandardCost;
    }
    recalcPvLine(idx);
  }
  window.updatePvLineItem = onPvLineItemChange;

  function recalcPvLine(idx) {
    const itemId = val('pv_ln_' + idx + '_item');
    const item = window.__pvItemMap[itemId];
    const qty = Number(val('pv_ln_' + idx + '_qty')) || 0;
    const rate = Number(val('pv_ln_' + idx + '_rate')) || 0;

    const piecesInput = document.getElementById('pv_ln_' + idx + '_pieces');
    const ratePieceInput = document.getElementById('pv_ln_' + idx + '_rateperpiece');
    const amtEl = document.getElementById('pv_ln_' + idx + '_amt');
    if (!piecesInput || !ratePieceInput || !amtEl) return;

    const pieces = Number(piecesInput.value) || 0;
    let value = 0;

    if (qty > 0 && rate > 0) {
      // ওজন পাশে পরিমাণ+দর জানা থাকলে সেটাই আসল মূল্য নির্ধারণ করে —
      // পিসের দর তখন সবসময় লাইভ হিসাব হবে (ব্যবহারকারী হাতে বদলাতে পারবেন না)
      value = qty * rate;
      if (pieces > 0) {
        ratePieceInput.value = (value / pieces).toFixed(2);
      } else {
        ratePieceInput.value = '';
      }
      ratePieceInput.readOnly = true;
      ratePieceInput.style.background = 'var(--bg)';
    } else {
      // ওজন পাশে তথ্য নেই — তাহলে পিস+তার দর থেকেই সরাসরি মূল্য নির্ধারিত হবে
      ratePieceInput.readOnly = false;
      ratePieceInput.style.background = '';
      const ratePiece = Number(ratePieceInput.value) || 0;
      if (pieces > 0 && ratePiece > 0) {
        value = pieces * ratePiece;
      }
    }

    amtEl.textContent = value.toFixed(2);
  }
  window.updatePvLine = recalcPvLine;

  function renderPvLines() {
    const wrap = document.getElementById('pv_LinesWrap');
    if (!wrap) return;
    const headers = [['আইটেম','Item'],['গ্রুপ','Group'],['ক্যাটাগরি','Category'],['পরিমাণ','Quantity'],['একক','Unit'],['দর','Rate'],['মূল্য','Value']];
    const headCells = headers.map(function (h) { return `<th>${t(h[0], h[1])}</th>`; }).join('') + '<th></th>';
    const rows = window.__pvLineRows.map(function (row, idx) {
      const item = row.itemId ? window.__pvItemMap[row.itemId] : null;
      const groupOpts = window.__pvGroups.map(function (g) { return `<option value="${attr(g.GroupID)}" ${item&&item.GroupID===g.GroupID?'selected':''}>${escapeHtml(g.GroupName)}</option>`; }).join('');
      const catOpts = window.__pvCategories.map(function (c) { return `<option value="${attr(c.CategoryID)}" ${item&&item.CategoryID===c.CategoryID?'selected':''}>${escapeHtml(c.CategoryName)}</option>`; }).join('');
      const unitLabel = item && window.__pvUnitMap[item.UOMID] ? window.__pvUnitMap[item.UOMID].UOMName : '—';
      return `
        <tr style="border-top:2px solid var(--border);">
          <td rowspan="2"><select id="pv_ln_${idx}_item" onchange="updatePvLineItem(${idx})"><option value="">—</option>${opts(window.__pvItems, 'ItemID', 'ItemName', row.itemId)}</select></td>
          <td rowspan="2"><select id="pv_ln_${idx}_group" style="min-width:90px;"><option value="">—</option>${groupOpts}</select></td>
          <td rowspan="2"><select id="pv_ln_${idx}_cat" style="min-width:90px;"><option value="">—</option>${catOpts}</select></td>
          <td><input id="pv_ln_${idx}_qty" type="number" step="any" value="${row.qty||''}" oninput="updatePvLine(${idx})" style="width:80px;"></td>
          <td id="pv_ln_${idx}_unit" style="color:var(--text-muted);">${escapeHtml(unitLabel)}</td>
          <td><input id="pv_ln_${idx}_rate" type="number" step="any" value="${row.rate||''}" oninput="updatePvLine(${idx})" style="width:80px;"></td>
          <td rowspan="2" id="pv_ln_${idx}_amt" style="font-weight:600;">0.00</td>
          <td rowspan="2"><button type="button" onclick="window.__removePvLine(${idx})">✕</button></td>
        </tr>
        <tr style="background:var(--bg);">
          <td style="border-top:1px dashed var(--border);"><input id="pv_ln_${idx}_pieces" type="number" step="any" value="${row.pieces||''}" oninput="updatePvLine(${idx})" style="width:80px;"></td>
          <td style="border-top:1px dashed var(--border);color:var(--text-muted);font-style:italic;">${t('পিস','pcs')}</td>
          <td style="border-top:1px dashed var(--border);"><input id="pv_ln_${idx}_rateperpiece" type="number" step="any" oninput="updatePvLine(${idx})" style="width:80px;"></td>
        </tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}</tr></thead><tbody>${rows}</tbody></table>`;
    window.__pvLineRows.forEach(function (_, idx) { recalcPvLine(idx); });
  }
  window.__removePvLine = function (idx) { window.__pvLineRows.splice(idx, 1); renderPvLines(); };
  document.getElementById('pv_AddLineBtn').addEventListener('click', function () { window.__pvLineRows.push({}); renderPvLines(); });
  renderPvLines();
}

/* ============================================================
   ১৩.৯৯) একত্রিত বিক্রয় ভাউচার — Sales Invoice + Sales Return
   একই ফর্মে, টাইপ ড্রপডাউন দিয়ে সুইচ করা যাবে (Purchase Voucher-এর আয়না)
   ============================================================ */
async function renderSalesVoucherPage(content, defaultType) {
  defaultType = defaultType || 'SalesInvoice';
  content.innerHTML = `
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="বিক্রয় ভাউচার" data-en="Sales Voucher">${t('বিক্রয় ভাউচার','Sales Voucher')}</h1>
        <p class="i18n" data-bn="বিক্রয় ও বিক্রয় ফেরত — একই জায়গা থেকে" data-en="Sales and sales return — from one place">${t('বিক্রয় ও বিক্রয় ফেরত — একই জায়গা থেকে','Sales and sales return — from one place')}</p>
      </div>
      <button class="btn btn-primary i18n" style="width:auto;" id="svAddBtn" data-bn="+ নতুন যোগ করুন" data-en="+ Add New">${t('+ নতুন যোগ করুন','+ Add New')}</button></div>
    <div class="panel"><div id="svTableWrap"></div></div>`;

  async function loadList() {
    const [invoices, returns, customers, salespersons] = await Promise.all([
      api('list', { sheet:'SalesInvoice' }), api('list', { sheet:'SalesReturn' }),
      cachedList('Customers'), cachedList('Salespersons')
    ]);
    const custMap = {}; customers.forEach(function (c) { custMap[c.CustomerID] = c.CompanyName || c.Name; });
    const slpMap = {}; salespersons.forEach(function (s) { slpMap[s.SalespersonID] = s.SalespersonName; });

    const merged = invoices.filter(function (r) { return r.Status !== 'Deleted'; }).map(function (r) {
      return { type:'SalesInvoice', typeLabel:['বিক্রয় ভাউচার','Sales Voucher'], id:r.SIID, date:r.InvoiceDate, customerId:r.CustomerID, salespersonId:r.SalespersonID, amount:r.TotalAmount, status:r.Status };
    }).concat(returns.filter(function (r) { return r.Status !== 'Deleted'; }).map(function (r) {
      return { type:'SalesReturn', typeLabel:['বিক্রয় ফেরত ভাউচার','Sales Return Voucher'], id:r.SRID, date:r.Date, customerId:r.CustomerID, salespersonId:r.SalespersonID, amount:null, status:r.Status };
    }));
    merged.sort(function (a, b) { return String(a.date||'').localeCompare(String(b.date||'')); });

    const wrap = document.getElementById('svTableWrap');
    if (!wrap) return;
    if (merged.length === 0) {
      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এখনো কোনো ভাউচার তৈরি হয়নি।" data-en="No vouchers created yet.">${t('এখনো কোনো ভাউচার তৈরি হয়নি।','No vouchers created yet.')}</div>`;
      return;
    }

    const headers = [['টাইপ','Type'],['ভাউচার নম্বর','Voucher No'],['তারিখ','Date'],['গ্রাহক','Customer'],['বিক্রয়কারী','Salesperson'],['মূল্য','Amount'],['অবস্থা','Status']];
    const headCells = headers.map(function (h) { return `<th class="i18n" data-bn="${h[0]}" data-en="${h[1]}">${t(h[0], h[1])}</th>`; }).join('');
    const bodyRows = merged.slice().reverse().map(function (r) {
      const isPosted = r.status === 'Posted';
      const postBtn = !isPosted
        ? `<button class="btn" style="width:auto;padding:6px 12px;font-size:12px;" onclick='postSalesVoucherRecord(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})'>${t('পোস্ট করুন','Post')}</button>`
        : '';
      const previewBtn = `<button onclick='openPrintableVoucherView(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('প্রিভিউ/প্রিন্ট/শেয়ার','Preview/Print/Share')}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        </button>`;
      const editBtn = !isPosted
        ? `<button onclick='openSalesVoucherForm(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('সম্পাদনা','Edit')}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="m18.5 2.5 3 3L10 17l-4 1 1-4Z"/></svg>
          </button>`
        : '';
      const deleteBtn = !isPosted
        ? `<button onclick='deleteSalesVoucherRecord(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('ডিলিট','Delete')}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
          </button>`
        : (currentUser && currentUser.RoleID === 'ROLE-ADMIN'
            ? `<button onclick='deletePostedSalesVoucher(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('এডমিন ডিলিট (পাসওয়ার্ড লাগবে)','Admin delete (password required)')}" style="color:var(--danger);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </button>`
            : '');
      return `<tr ondblclick='openSalesVoucherForm(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' style="cursor:pointer;" title="${t('এডিট করতে ডাবল-ক্লিক করুন','Double-click to edit')}">
        <td>${t(r.typeLabel[0], r.typeLabel[1])}</td><td>${escapeHtml(r.id)}</td><td>${escapeHtml(r.date)}</td>
        <td>${escapeHtml(custMap[r.customerId] || r.customerId)}</td><td>${escapeHtml(slpMap[r.salespersonId] || '—')}</td>
        <td>${r.amount !== null ? Number(r.amount).toFixed(2) : '—'}</td>
        <td>${isPosted ? `<span class="badge active">${t('পোস্ট করা','Posted')}</span>` : `<span class="badge draft">${t('খসড়া','Draft')}</span>`}</td>
        <td class="row-actions" onclick="event.stopPropagation();">${postBtn}${previewBtn}${editBtn}${deleteBtn}</td>
      </tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}<th></th></tr></thead><tbody>${bodyRows}</tbody></table>`;
  }

  await loadList();
  window.__refreshSalesVoucherList = loadList;
  document.getElementById('svAddBtn').addEventListener('click', function () { openSalesVoucherForm(defaultType, null); });
}

async function postSalesVoucherRecord(docType, docId) {
  if (!confirm(t('আপনি কি নিশ্চিত এই ভাউচার পোস্ট করতে চান? পোস্ট হয়ে গেলে স্টক/লেজারে এন্ট্রি পড়বে এবং এটা আর বাতিল করা যাবে না।','Are you sure you want to post this voucher? Once posted, stock/ledger entries will be created and this cannot be undone.'))) return;
  try {
    await api('postDocument', { docType: docType, docId: docId });
    showToast(t('পোস্ট হয়েছে ✅','Posted ✅'), 'success');
    if (window.__refreshSalesVoucherList) await window.__refreshSalesVoucherList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function deleteSalesVoucherRecord(docType, docId) {
  if (!confirm(t('আপনি কি নিশ্চিত এই ভাউচার ডিলিট করতে চান?','Are you sure you want to delete this voucher?'))) return;
  const config = docType === 'SalesReturn'
    ? { sheet:'SalesReturn', idField:'SRID' }
    : { sheet:'SalesInvoice', idField:'SIID' };
  try {
    await api('delete', { sheet: config.sheet, idField: config.idField, idValue: docId });
    showToast(t('ডিলিট হয়েছে ✅','Deleted ✅'), 'success');
    if (window.__refreshSalesVoucherList) await window.__refreshSalesVoucherList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function deletePostedSalesVoucher(docType, docId) {
  const config = docType === 'SalesReturn'
    ? { sheet:'SalesReturn', idField:'SRID', linesSheet:'SR_Lines', lineIdField:'SRID' }
    : { sheet:'SalesInvoice', idField:'SIID', linesSheet:'SI_Lines', lineIdField:'SIID' };
  await deletePostedVoucherWithAdminAuth(docType, docId, config.sheet, config.idField, config.linesSheet, config.lineIdField, window.__refreshSalesVoucherList);
}

async function openSalesVoucherForm(defaultType, existingId) {
  const svData = await cachedListMultiple(['Customers', 'Salespersons', 'Items', 'SalesInvoice', 'DeliveryChallan', 'ItemGroups', 'Categories', 'UOM', 'Warehouses']);
  const customers = svData.Customers, salespersons = svData.Salespersons, items = svData.Items, invoicesForRef = svData.SalesInvoice,
        deliveryChallans = svData.DeliveryChallan,
        groups = svData.ItemGroups, categories = svData.Categories, units = svData.UOM, warehouses = svData.Warehouses;
  window.__svItems = items.filter(function (i) { return i.Status !== 'Deleted'; });
  window.__svItemMap = {}; items.forEach(function (i) { window.__svItemMap[i.ItemID] = i; });
  window.__svGroups = groups.filter(function (g) { return g.Status !== 'Deleted'; });
  window.__svCategories = categories.filter(function (c) { return c.Status !== 'Deleted'; });
  window.__svUnits = units;
  window.__svUnitMap = {}; units.forEach(function (u) { window.__svUnitMap[u.UOMID] = u; });

  const isEdit = !!existingId;
  let existingHeader = null, existingLines = [];
  let type = defaultType || 'SalesInvoice';

  if (isEdit) {
    const config = type === 'SalesReturn'
      ? { headerSheet:'SalesReturn', idField:'SRID', linesSheet:'SR_Lines', lineIdField:'SRID', idValue: existingId }
      : { headerSheet:'SalesInvoice', idField:'SIID', linesSheet:'SI_Lines', lineIdField:'SIID', idValue: existingId };
    let doc;
    try {
      doc = await api('getDocument', config);
    } catch (err) {
      showToast(err.message, 'error');
      return;
    }
    existingHeader = doc.header;
    existingLines = doc.lines;
    if (existingHeader.Status === 'Posted') {
      showToast(t('পোস্ট হয়ে যাওয়া ভাউচার এডিট করা যাবে না।','A posted voucher cannot be edited.'), 'error');
      return;
    }
  }

  window.__svLineRows = isEdit
    ? existingLines.map(function (l) { return { itemId: l.ItemID, qty: l.Quantity, rate: l.Rate, pieces: l.Pieces }; })
    : [{}];

  function opts(list, idF, labelF, selected) {
    return list.filter(function (r) { return r.Status !== 'Deleted'; })
      .map(function (r) { return `<option value="${attr(r[idF])}" ${selected===r[idF]?'selected':''}>${escapeHtml(r[labelF])}</option>`; }).join('');
  }

  const rec = existingHeader || {};
  const bodyHtml = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
      <div class="field"><label>${t('ইনভয়েস টাইপ','Invoice Type')}</label>
        <select id="sv_Type" ${isEdit?'disabled':''}>
          <option value="SalesInvoice" ${type!=='SalesReturn'?'selected':''}>${t('বিক্রয় ভাউচার','Sales Voucher')}</option>
          <option value="SalesReturn" ${type==='SalesReturn'?'selected':''}>${t('বিক্রয় ফেরত ভাউচার','Sales Return Voucher')}</option>
        </select>
      </div>
      <div class="field"><label>${t('তারিখ','Date')}</label><input type="date" id="sv_Date" value="${attr(rec.InvoiceDate || rec.Date) || new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>${t('ভাউচার নম্বর','Voucher No')}</label><input id="sv_VoucherNo" value="${isEdit ? attr(existingId) : t('অটো তৈরি হবে','Will be auto-generated')}" readonly style="background:var(--bg);"></div>
      <div class="field" id="sv_SIField" style="display:none;"><label>${t('বিক্রয় চালান রেফারেন্স','Sales Invoice Reference')}</label><select id="sv_SIID"><option value="">—</option>${opts(invoicesForRef, 'SIID', 'SIID', rec.SIID)}</select></div>
      <div class="field" id="sv_DCField"><label>${t('ডেলিভারি চালান রেফারেন্স (ঐচ্ছিক)','Delivery Challan Reference (optional)')}</label><select id="sv_DCID"><option value="">—</option>${opts(deliveryChallans, 'DCID', 'DCID', rec.DCID)}</select></div>
      <div class="field"><label>${t('গুদাম','Warehouse')}</label><select id="sv_WarehouseID"><option value="">—</option>${opts(warehouses, 'WarehouseID', 'WarehouseName', rec.WarehouseID)}</select></div>
      <div class="field"><label>${t('গ্রাহক নাম','Customer Name')}</label><select id="sv_CustomerID"><option value="">—</option>${customers.filter(function(r){return r.Status!=='Deleted';}).map(function(r){const label=(r.CompanyName||r.Name)+(r.Zone?' — '+r.Zone:'');return `<option value="${attr(r.CustomerID)}" ${rec.CustomerID===r.CustomerID?'selected':''}>${escapeHtml(label)}</option>`;}).join('')}</select></div>
      <div class="field"><label>${t('বিক্রয়কারী','Salesperson')}</label>
        <div style="display:flex;gap:8px;">
          <select id="sv_SalespersonID" style="flex:1;min-width:0;"><option value="">—</option>${opts(salespersons, 'SalespersonID', 'SalespersonName', rec.SalespersonID)}</select>
          <button type="button" id="sv_AddSalespersonBtn" class="btn" style="width:auto;padding:0 14px;flex-shrink:0;" title="${t('নতুন বিক্রয়কারী যোগ করুন','Add new salesperson')}">+</button>
        </div>
      </div>
    </div>
    <div id="sv_ReasonField" style="display:none;margin-top:14px;"><div class="field"><label>${t('কারণ','Reason')}</label><input id="sv_Reason" value="${attr(rec.Reason)}"></div></div>

    <h4 style="margin:20px 0 10px;font-size:13px;color:var(--text-muted);text-transform:uppercase;border-top:1px solid var(--border);padding-top:14px;">${t('লাইন আইটেম','Line Items')}</h4>
    <div id="sv_LinesWrap"></div>
    <button type="button" class="btn" style="width:auto;margin-top:8px;" id="sv_AddLineBtn">${t('+ লাইন যোগ করুন','+ Add Line')}</button>`;

  openModal({
    title: (isEdit ? t('সম্পাদনা — ','Edit — ') : t('নতুন — ','New — ')) + t('বিক্রয় ভাউচার','Sales Voucher'),
    bodyHtml: bodyHtml,
    wide: true,
    onSave: async function () {
      const currentType = val('sv_Type');
      const customerId = val('sv_CustomerID');
      if (!customerId) throw new Error(t('গ্রাহক বাছাই করা আবশ্যক।','Customer is required.'));

      const unitMismatches = [];
      const lines = window.__svLineRows.map(function (_, idx) {
        const itemId = val('sv_ln_' + idx + '_item');
        const item = window.__svItemMap[itemId];
        const qty = Number(val('sv_ln_' + idx + '_qty')) || 0;
        const rate = Number(val('sv_ln_' + idx + '_rate')) || 0;
        const pieces = Number(val('sv_ln_' + idx + '_pieces')) || 0;
        const ratePiece = Number(val('sv_ln_' + idx + '_rateperpiece')) || 0;

        if (item && item.TrackingType === 'WeightPieces' && itemId) {
          // ওজন অথবা পিস — যেকোনো একটা দিলেই চলবে; স্টক থেকে ঠিক কতটা কমবে
          // (অন্য মাত্রাটা) তখনকার আসল/লাইভ গড় ওজন-প্রতি-পিস দিয়ে পোস্ট করার সময় হিসাব হবে
          if (!(qty > 0 || pieces > 0)) return null;
          const amount = qty > 0 ? qty * rate : pieces * ratePiece;
          return { ItemID: itemId, Quantity: qty, Rate: qty > 0 ? rate : 0, Pieces: pieces, Amount: amount };
        }

        let finalQty = 0, finalRate = 0, usedMode = null;
        if (qty > 0 && rate > 0) {
          finalQty = qty; finalRate = rate; usedMode = 'Weight';
        } else if (pieces > 0 && ratePiece > 0) {
          usedMode = 'Piece';
          const unit = item ? window.__svUnitMap[item.UOMID] : null;
          const kgPerPiece = Number(unit && unit.ConversionFactor) || 0;
          if (kgPerPiece > 0) {
            finalQty = pieces * kgPerPiece;
            finalRate = finalQty > 0 ? (pieces * ratePiece) / finalQty : 0;
          } else {
            finalQty = pieces; finalRate = ratePiece;
          }
        }

        if (item && item.UnitMode && usedMode && item.UnitMode !== usedMode) {
          unitMismatches.push(item.ItemName);
        }

        return { ItemID: itemId, Quantity: finalQty, Rate: finalRate, Pieces: 0, Amount: finalQty * finalRate };
      }).filter(function (l) { return l && l.ItemID && (l.Quantity > 0 || l.Pieces > 0); });

      if (unitMismatches.length > 0) {
        const proceed = confirm(
          t('এই আইটেমগুলো তাদের নির্ধারিত পদ্ধতির (কেজি/পিস) বাইরে ব্যবহার হয়েছে: ', 'These items were used outside their set method (weight/piece): ')
          + unitMismatches.join(', ')
          + '\n\n' + t('তবুও কি সেভ করবেন?', 'Save anyway?')
        );
        if (!proceed) return;
      }
      if (lines.length === 0) throw new Error(t('অন্তত একটা লাইন আইটেম যোগ করুন।','Add at least one line item.'));

      const warehouseId = val('sv_WarehouseID');
      if (!warehouseId) throw new Error(t('গুদাম বাছাই করা আবশ্যক।','Warehouse is required.'));

      const common = { CustomerID: customerId, SalespersonID: val('sv_SalespersonID') || null, WarehouseID: warehouseId };

      if (currentType === 'SalesInvoice') {
        const totalAmount = lines.reduce(function (s, l) { return s + (Number(l.Amount) || 0); }, 0);
        const headerData = Object.assign({}, common, { InvoiceDate: val('sv_Date'), DCID: val('sv_DCID') || null, TotalAmount: totalAmount });
        if (isEdit) {
          await api('updateDocument', { headerSheet:'SalesInvoice', idField:'SIID', linesSheet:'SI_Lines', lineIdField:'SIID', idValue: existingId, headerData: headerData, lines: lines });
        } else {
          await api('createDocument', { headerSheet:'SalesInvoice', idField:'SIID', idPrefix:'SI', requiredFields:['CustomerID','WarehouseID'], linesSheet:'SI_Lines', lineIdField:'SIID', headerData: headerData, lines: lines });
        }
      } else {
        const siId = val('sv_SIID');
        if (!siId) throw new Error(t('বিক্রয় ফেরতের জন্য বিক্রয় চালান রেফারেন্স আবশ্যক।','Sales invoice reference is required for a sales return.'));
        const headerData = Object.assign({}, common, { Date: val('sv_Date'), SIID: siId, Reason: val('sv_Reason') });
        if (isEdit) {
          await api('updateDocument', { headerSheet:'SalesReturn', idField:'SRID', linesSheet:'SR_Lines', lineIdField:'SRID', idValue: existingId, headerData: headerData, lines: lines });
        } else {
          await api('createDocument', { headerSheet:'SalesReturn', idField:'SRID', idPrefix:'SR', requiredFields:['CustomerID','WarehouseID','SIID'], linesSheet:'SR_Lines', lineIdField:'SRID', headerData: headerData, lines: lines });
        }
      }

      showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
      if (window.__refreshSalesVoucherList) await window.__refreshSalesVoucherList();
    }
  });

  function toggleSvTypeFields() {
    const isReturn = val('sv_Type') === 'SalesReturn';
    document.getElementById('sv_SIField').style.display = isReturn ? '' : 'none';
    document.getElementById('sv_DCField').style.display = isReturn ? 'none' : '';
    document.getElementById('sv_ReasonField').style.display = isReturn ? '' : 'none';
  }
  document.getElementById('sv_Type').addEventListener('change', toggleSvTypeFields);
  toggleSvTypeFields();

  document.getElementById('sv_AddSalespersonBtn').addEventListener('click', async function () {
    const name = prompt(t('নতুন বিক্রয়কারীর নাম লিখুন:','Enter new salesperson name:'));
    if (!name || !name.trim()) return;
    try {
      const newSalesperson = await api('create', { sheet:'Salespersons', idField:'SalespersonID', idPrefix:'SLP', requiredFields:['SalespersonName'], data:{ SalespersonName: name.trim() } });
      const select = document.getElementById('sv_SalespersonID');
      if (!select) return;
      const opt = document.createElement('option');
      opt.value = newSalesperson.SalespersonID;
      opt.textContent = newSalesperson.SalespersonName;
      opt.selected = true;
      select.appendChild(opt);
      showToast(t('নতুন বিক্রয়কারী যোগ হয়েছে ✅','New salesperson added ✅'), 'success');
    } catch (err) {
      showToast(err.message, 'error');
    }
  });

  function onSvLineItemChange(idx) {
    const itemId = val('sv_ln_' + idx + '_item');
    const item = window.__svItemMap[itemId];
    if (item) {
      const groupSel = document.getElementById('sv_ln_' + idx + '_group');
      const catSel = document.getElementById('sv_ln_' + idx + '_cat');
      const unitEl = document.getElementById('sv_ln_' + idx + '_unit');
      if (groupSel && item.GroupID) groupSel.value = item.GroupID;
      if (catSel && item.CategoryID) catSel.value = item.CategoryID;
      if (unitEl) unitEl.textContent = (window.__svUnitMap[item.UOMID] && window.__svUnitMap[item.UOMID].UOMName) || '—';
      const rateInput = document.getElementById('sv_ln_' + idx + '_rate');
      if (rateInput && !rateInput.value && item.SalesPrice) rateInput.value = item.SalesPrice;
    }
    recalcSvLine(idx);
  }
  window.updateSvLineItem = onSvLineItemChange;

  function recalcSvLine(idx) {
    const itemId = val('sv_ln_' + idx + '_item');
    const item = window.__svItemMap[itemId];
    const qty = Number(val('sv_ln_' + idx + '_qty')) || 0;
    const rate = Number(val('sv_ln_' + idx + '_rate')) || 0;

    const piecesInput = document.getElementById('sv_ln_' + idx + '_pieces');
    const ratePieceInput = document.getElementById('sv_ln_' + idx + '_rateperpiece');
    const amtEl = document.getElementById('sv_ln_' + idx + '_amt');
    const profitEl = document.getElementById('sv_ln_' + idx + '_profit');
    if (!piecesInput || !ratePieceInput || !amtEl) return;

    const pieces = Number(piecesInput.value) || 0;
    let value = 0;

    if (qty > 0 && rate > 0) {
      // ওজন পাশে পরিমাণ+দর জানা থাকলে সেটাই আসল মূল্য নির্ধারণ করে —
      // পিসের দর তখন সবসময় লাইভ হিসাব হবে
      value = qty * rate;
      if (pieces > 0) {
        ratePieceInput.value = (value / pieces).toFixed(2);
      } else {
        ratePieceInput.value = '';
      }
      ratePieceInput.readOnly = true;
      ratePieceInput.style.background = 'var(--bg)';
    } else {
      ratePieceInput.readOnly = false;
      ratePieceInput.style.background = '';
      const ratePiece = Number(ratePieceInput.value) || 0;
      if (pieces > 0 && ratePiece > 0) {
        value = pieces * ratePiece;
      }
    }

    amtEl.textContent = value.toFixed(2);

    // লাভ = বিক্রয় মূল্য − (পরিমাণ × আইটেম মাস্টারে দেওয়া স্ট্যান্ডার্ড কস্ট)
    if (profitEl) {
      const costRate = item ? (Number(item.StandardCost) || 0) : 0;
      if (value > 0 && qty > 0 && costRate > 0) {
        const profit = value - (qty * costRate);
        profitEl.textContent = profit.toFixed(2);
        profitEl.style.color = profit < 0 ? 'var(--danger)' : 'var(--success)';
      } else {
        profitEl.textContent = '—';
        profitEl.style.color = '';
      }
    }
    updateSvTotalProfit();
  }
  window.updateSvLine = recalcSvLine;

  function updateSvTotalProfit() {
    const totalEl = document.getElementById('sv_TotalProfit');
    if (!totalEl) return;
    let total = 0, hasAny = false;
    (window.__svLineRows || []).forEach(function (_, idx) {
      const el = document.getElementById('sv_ln_' + idx + '_profit');
      if (el && el.textContent !== '—') { total += Number(el.textContent) || 0; hasAny = true; }
    });
    totalEl.textContent = hasAny ? total.toFixed(2) : '—';
    totalEl.style.color = total < 0 ? 'var(--danger)' : 'var(--success)';
  }


  // পিস দিয়ে বিক্রয় করার সময় (ওজন খালি রেখে), স্টকের লাইভ গড় ওজন/পিস
  // দিয়ে ওজন ও ওজনের দর অটো-ফিল হবে — কোনো স্থির কনভার্সন ফ্যাক্টর ছাড়াই
  window.__svAvgCache = window.__svAvgCache || {};
  window.fillSvWeightFromAverage = async function (idx) {
    const qtyInput = document.getElementById('sv_ln_' + idx + '_qty');
    const rateInput = document.getElementById('sv_ln_' + idx + '_rate');
    if (!qtyInput || qtyInput.value) return; // ওজন আগে থেকে দেওয়া থাকলে কিছু করার দরকার নেই
    const itemId = val('sv_ln_' + idx + '_item');
    const warehouseId = val('sv_WarehouseID');
    const pieces = Number(val('sv_ln_' + idx + '_pieces')) || 0;
    if (!itemId || !warehouseId || pieces <= 0) return;

    const cacheKey = itemId + '::' + warehouseId;
    let avg = window.__svAvgCache[cacheKey];
    if (avg === undefined) {
      const { data } = await supabaseClient.from('current_stock').select('QtyOnHand,QtyPieces').eq('ItemID', itemId).eq('WarehouseID', warehouseId).maybeSingle();
      avg = (data && Number(data.QtyPieces) > 0) ? Number(data.QtyOnHand) / Number(data.QtyPieces) : 0;
      // এই গুদামে ইতিহাস না থাকলে, একই আইটেমের অন্য যেকোনো গুদামের গড় ফলব্যাক হিসেবে ব্যবহার হবে
      if (avg <= 0) {
        const { data: anyWh } = await supabaseClient.from('current_stock').select('QtyOnHand,QtyPieces').eq('ItemID', itemId).gt('QtyPieces', 0);
        if (anyWh && anyWh.length > 0) {
          const totalKg = anyWh.reduce(function (s, r) { return s + (Number(r.QtyOnHand) || 0); }, 0);
          const totalPieces = anyWh.reduce(function (s, r) { return s + (Number(r.QtyPieces) || 0); }, 0);
          avg = totalPieces > 0 ? totalKg / totalPieces : 0;
        }
      }
      window.__svAvgCache[cacheKey] = avg;
    }
    if (avg <= 0) {
      showToast(t('এই আইটেমের কোনো ওজন/পিস ইতিহাস পাওয়া যায়নি — ওজন হাতে লিখুন।','No weight/pieces history found for this item — please enter the weight manually.'), 'error');
      return;
    }
    if (qtyInput.value) return; // ইতিমধ্যে ব্যবহারকারী নিজে থেকে লিখে ফেলেছেন কিনা — শেষবার আবার চেক

    const estQty = pieces * avg;
    qtyInput.value = estQty.toFixed(3);

    const ratePiece = Number(val('sv_ln_' + idx + '_rateperpiece')) || 0;
    if (ratePiece > 0 && rateInput && !rateInput.value) {
      const value = pieces * ratePiece;
      rateInput.value = (value / estQty).toFixed(2);
    }
    recalcSvLine(idx);
  };

  function renderSvLines() {
    const wrap = document.getElementById('sv_LinesWrap');
    if (!wrap) return;
    const headers = [['আইটেম','Item'],['গ্রুপ','Group'],['ক্যাটাগরি','Category'],['পরিমাণ','Quantity'],['একক','Unit'],['দর','Rate'],['মূল্য','Value'],['লাভ','Profit']];
    const headCells = headers.map(function (h) { return `<th>${t(h[0], h[1])}</th>`; }).join('') + '<th></th>';
    const rows = window.__svLineRows.map(function (row, idx) {
      const item = row.itemId ? window.__svItemMap[row.itemId] : null;
      const groupOpts = window.__svGroups.map(function (g) { return `<option value="${attr(g.GroupID)}" ${item&&item.GroupID===g.GroupID?'selected':''}>${escapeHtml(g.GroupName)}</option>`; }).join('');
      const catOpts = window.__svCategories.map(function (c) { return `<option value="${attr(c.CategoryID)}" ${item&&item.CategoryID===c.CategoryID?'selected':''}>${escapeHtml(c.CategoryName)}</option>`; }).join('');
      const unitLabel = item && window.__svUnitMap[item.UOMID] ? window.__svUnitMap[item.UOMID].UOMName : '—';
      return `
        <tr style="border-top:2px solid var(--border);">
          <td rowspan="2"><select id="sv_ln_${idx}_item" onchange="updateSvLineItem(${idx})"><option value="">—</option>${opts(window.__svItems, 'ItemID', 'ItemName', row.itemId)}</select></td>
          <td rowspan="2"><select id="sv_ln_${idx}_group" style="min-width:90px;"><option value="">—</option>${groupOpts}</select></td>
          <td rowspan="2"><select id="sv_ln_${idx}_cat" style="min-width:90px;"><option value="">—</option>${catOpts}</select></td>
          <td><input id="sv_ln_${idx}_qty" type="number" step="any" value="${row.qty||''}" oninput="updateSvLine(${idx})" style="width:80px;"></td>
          <td id="sv_ln_${idx}_unit" style="color:var(--text-muted);">${escapeHtml(unitLabel)}</td>
          <td><input id="sv_ln_${idx}_rate" type="number" step="any" value="${row.rate||''}" oninput="updateSvLine(${idx})" style="width:80px;"></td>
          <td rowspan="2" id="sv_ln_${idx}_amt" style="font-weight:600;">0.00</td>
          <td rowspan="2" id="sv_ln_${idx}_profit" style="font-weight:600;">—</td>
          <td rowspan="2"><button type="button" onclick="window.__removeSvLine(${idx})">✕</button></td>
        </tr>
        <tr style="background:var(--bg);">
          <td style="border-top:1px dashed var(--border);"><input id="sv_ln_${idx}_pieces" type="number" step="any" value="${row.pieces||''}" oninput="updateSvLine(${idx}); fillSvWeightFromAverage(${idx});" style="width:80px;"></td>
          <td style="border-top:1px dashed var(--border);color:var(--text-muted);font-style:italic;">${t('পিস','pcs')}</td>
          <td style="border-top:1px dashed var(--border);"><input id="sv_ln_${idx}_rateperpiece" type="number" step="any" oninput="updateSvLine(${idx}); fillSvWeightFromAverage(${idx});" style="width:80px;"></td>
        </tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}</tr></thead><tbody>${rows}</tbody></table>
      <div style="margin-top:10px;font-size:14px;font-weight:700;text-align:right;">${t('আনুমানিক মোট লাভ','Estimated Total Profit')}: <span id="sv_TotalProfit">0.00</span></div>
      <p style="font-size:11px;color:var(--text-muted);margin:4px 0 0;text-align:right;">${t('(আইটেম মাস্টারে দেওয়া "স্ট্যান্ডার্ড কস্ট"-এর ভিত্তিতে আনুমানিক হিসাব)', '(Estimated based on the "Standard Cost" set in Item Master)')}</p>`;

  window.__removeSvLine = function (idx) { window.__svLineRows.splice(idx, 1); renderSvLines(); };

}

/* ============================================================
   জেনেরিক DOCUMENT ইঞ্জিন — Header+Lines থাকা বাকি সব ডকুমেন্ট
   (PR, PO, GRN, MaterialIssue, StockTransfer, StockAdjust, SO, DC,
   BOM, PMI, FGR, JV) এই একটামাত্র ইঞ্জিন দিয়ে চলে।

async function renderDocumentListPage(content, config) {
  const records = await api('list', { sheet: config.headerSheet });

  content.innerHTML = `
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="${attr(config.titleBn)}" data-en="${attr(config.titleEn)}">${t(config.titleBn, config.titleEn)}</h1>
        <p class="i18n" data-bn="${attr(config.subBn)}" data-en="${attr(config.subEn)}">${t(config.subBn, config.subEn)}</p>
      </div>
      <button class="btn btn-primary i18n" style="width:auto;" id="docAddBtn" data-bn="+ নতুন যোগ করুন" data-en="+ Add New">${t('+ নতুন যোগ করুন','+ Add New')}</button></div>
    <div class="panel"><div id="docTableWrap"></div></div>`;

  function renderTable(list) {
    const wrap = document.getElementById('docTableWrap');

    const active = list.filter(function (r) { return r.Status !== 'Deleted'; });

      return;
    }
    const headCells = config.listColumns.map(function (c) { return `<th class="i18n" data-bn="${attr(c.label)}" data-en="${attr(bnToEn(c.label))}">${t(c.label, bnToEn(c.label))}</th>`; }).join('');
    const bodyRows = active.slice().reverse().map(function (r) {
      const cells = config.listColumns.map(function (c) {
        let v = r[c.key];
        if (c.key === 'Status') {
          v = v === 'Posted' ? `<span class="badge active i18n" data-bn="পোস্ট করা" data-en="Posted">${t('পোস্ট করা','Posted')}</span>` : `<span class="badge draft i18n" data-bn="খসড়া" data-en="Draft">${t('খসড়া','Draft')}</span>`;
        } else if (c.key === 'TotalAmount') {
          v = v ? Number(v).toFixed(2) : '—';
        } else v = escapeHtml(v);
        return '<td>' + v + '</td>';
      }).join('');
      const editBtn = `<button onclick='openDocumentForm(${JSON.stringify(r[config.idField])})' title="${t('সম্পাদনা','Edit')}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="m18.5 2.5 3 3L10 17l-4 1 1-4Z"/></svg>
        </button>`;
      const postBtn = (config.postable && r.Status !== 'Posted')
        ? `<button class="btn" style="width:auto;padding:6px 12px;font-size:12px;" onclick='postDocumentRecord(${JSON.stringify(config.docType)}, ${JSON.stringify(r[config.idField])})'>${t('পোস্ট করুন','Post')}</button>`
        : '';
      return `<tr>${cells}<td class="row-actions">${postBtn}${editBtn}</td></tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}<th></th></tr></thead><tbody>${bodyRows}</tbody></table>`;

}

async function openDocumentForm(existingId) {
  const config = window.__activeDocConfig;
  const isEdit = !!existingId;

  let existingHeader = null, existingLines = [];
  if (isEdit) {
    const doc = await api('getDocument', { headerSheet: config.headerSheet, idField: config.idField, linesSheet: config.linesSheet, lineIdField: config.lineIdField, idValue: existingId });
    existingHeader = doc.header;
    existingLines = doc.lines;
    if (existingHeader.Status === 'Posted') {
      showToast(t('পোস্ট হয়ে যাওয়া ডকুমেন্ট এডিট করা যাবে না।','A posted document cannot be edited.'), 'error');
      return;
    }
  }

  // হেডার ও লাইন ফিল্ডের সব FK ড্রপডাউনের ডেটা একসাথে (parallel) আনা হচ্ছে
  const allFkFields = config.headerFields.concat(config.lineFields).filter(function (f) { return f.type === 'select-fk'; });
  const uniqueFkSheets = Array.from(new Set(allFkFields.map(function (f) { return f.fkSheet; })));
  const fkSheetMap = await cachedListMultiple(uniqueFkSheets);
  const fkLists = {};
  allFkFields.forEach(function (f) { fkLists[f.key] = fkSheetMap[f.fkSheet]; });
  window.__docFkLists = fkLists;
  window.__docConfig = config;

  function fieldInputHtml(f, prefix, currentVal) {
    const id = prefix + f.key;
    if (f.type === 'select-fk') {
      const opts = (fkLists[f.key] || []).filter(function (r) { return r.Status !== 'Deleted'; })
        .map(function (r) { return `<option value="${attr(r[f.fkIdField])}" ${currentVal===r[f.fkIdField]?'selected':''}>${escapeHtml(r[f.fkLabel])}</option>`; }).join('');
      return `<select id="${id}" ${f.key==='ItemID'?'onchange="updateDocLineAmount(this)"':''}><option value="">—</option>${opts}</select>`;
    }
    if (f.type === 'number') return `<input id="${id}" type="number" step="any" value="${attr(currentVal)}" ${config.computeTotal?'oninput="recalcDocTotal()"':''}>`;
    if (f.type === 'date') return `<input id="${id}" type="date" value="${attr(currentVal)}">`;
    return `<input id="${id}" value="${attr(currentVal)}">`;
  }

  const headerHtml = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">` +
    config.headerFields.map(function (f) {
      return `<div class="field"><label>${f.label}</label>${fieldInputHtml(f, 'doc_h_', existingHeader ? existingHeader[f.key] : '')}</div>`;
    }).join('') + `</div>`;

  window.__docLineRows = isEdit ? existingLines.slice() : [{}];

  function renderDocLines() {
    const wrap = document.getElementById('doc_LinesWrap');
    if (!wrap) return;
    const headCells = config.lineFields.map(function (f) { return `<th>${f.label}</th>`; }).join('') + (config.computeTotal ? '<th>' + t('মূল্য','Amount') + '</th>' : '') + '<th></th>';
    const rows = window.__docLineRows.map(function (row, idx) {
      const cells = config.lineFields.map(function (f) {
        return `<td>${fieldInputHtml(f, 'doc_ln_' + idx + '_', row[f.key])}</td>`;
      }).join('');
      const amtCell = config.computeTotal ? `<td id="doc_ln_${idx}_amt" style="font-weight:600;">0.00</td>` : '';
      return `<tr>${cells}${amtCell}<td><button type="button" onclick="window.__removeDocLine(${idx})">✕</button></td></tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}</tr></thead><tbody>${rows}</tbody></table>`;
    if (config.computeTotal) recalcDocTotal();
  }
  window.__renderDocLines = renderDocLines;
  window.__removeDocLine = function (idx) { window.__docLineRows.splice(idx, 1); renderDocLines(); };

  const bodyHtml = headerHtml +
    `<h4 style="margin:20px 0 10px;font-size:13px;color:var(--text-muted);text-transform:uppercase;border-top:1px solid var(--border);padding-top:14px;">${t('লাইন আইটেম','Line Items')}</h4>
    <div id="doc_LinesWrap"></div>
    <button type="button" class="btn" style="width:auto;margin-top:8px;" id="doc_AddLineBtn">${t('+ লাইন যোগ করুন','+ Add Line')}</button>` +
    (config.computeTotal ? `<div style="margin-top:14px;font-size:15px;font-weight:700;text-align:right;">${t('মোট','Total')}: <span id="doc_GrandTotal">0.00</span></div>` : '');

  openModal({
    title: (isEdit ? t('সম্পাদনা — ','Edit — ') : t('নতুন — ','New — ')) + t(config.titleBn, config.titleEn),
    bodyHtml: bodyHtml,
    wide: true,
    onSave: async function () {
      const headerData = {};
      config.headerFields.forEach(function (f) { const v = val('doc_h_' + f.key); headerData[f.key] = ((f.type === 'select-fk' || f.type === 'number' || f.type === 'date') && v === '') ? null : v; });
      const missingHeader = config.headerFields.filter(function (f) { return f.required && !headerData[f.key]; });
      if (missingHeader.length > 0) throw new Error(missingHeader.map(function (f) { return f.label; }).join(', ') + ' আবশ্যক।');

      const lines = window.__docLineRows.map(function (_, idx) {
        const line = {};
        config.lineFields.forEach(function (f) { const v = val('doc_ln_' + idx + '_' + f.key); line[f.key] = ((f.type === 'select-fk' || f.type === 'number') && v === '') ? null : v; });
        if (config.computeTotal) {
          const qty = Number(line.Quantity) || 0, rate = Number(line.Rate) || 0;
          line.Amount = qty * rate;
        }
        return line;
      }).filter(function (l) {
        return Object.keys(l).some(function (k) { return l[k] !== '' && l[k] !== null && l[k] !== undefined; });
      });
      if (lines.length === 0) throw new Error(t('অন্তত একটা লাইন আইটেম যোগ করুন।','Add at least one line item.'));

      if (config.computeTotal) {
        headerData.TotalAmount = lines.reduce(function (s, l) { return s + (Number(l.Amount) || 0); }, 0);
      }

      const requiredFields = config.headerFields.filter(function (f) { return f.required; }).map(function (f) { return f.key; });
      if (isEdit) {
        await api('updateDocument', { headerSheet: config.headerSheet, idField: config.idField, linesSheet: config.linesSheet, lineIdField: config.lineIdField, idValue: existingId, headerData: headerData, lines: lines });
      } else {
        await api('createDocument', { headerSheet: config.headerSheet, idField: config.idField, idPrefix: config.idPrefix, requiredFields: requiredFields, linesSheet: config.linesSheet, lineIdField: config.lineIdField, headerData: headerData, lines: lines });
      }
      showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
      if (window.__refreshDocTable) await window.__refreshDocTable();
    }
  });

  document.getElementById('doc_AddLineBtn').addEventListener('click', function () { window.__docLineRows.push({}); renderDocLines(); });
  renderDocLines();
}

window.updateDocLineAmount = function () { if (window.__docConfig && window.__docConfig.computeTotal) recalcDocTotal(); };
window.recalcDocTotal = function () {
  if (!window.__docLineRows) return;
  let grand = 0;
  window.__docLineRows.forEach(function (_, idx) {
    const qty = Number(val('doc_ln_' + idx + '_Quantity')) || 0;
    const rate = Number(val('doc_ln_' + idx + '_Rate')) || 0;
    const amt = qty * rate;
    grand += amt;
    const amtEl = document.getElementById('doc_ln_' + idx + '_amt');
    if (amtEl) amtEl.textContent = amt.toFixed(2);
  });
  const grandEl = document.getElementById('doc_GrandTotal');
  if (grandEl) grandEl.textContent = grand.toFixed(2);
};

async function postDocumentRecord(docType, docId) {
  if (!confirm(t('আপনি কি নিশ্চিত এই ডকুমেন্ট পোস্ট করতে চান? পোস্ট হয়ে গেলে স্টক/লেজারে এন্ট্রি পড়বে এবং এটা আর বাতিল করা যাবে না।','Are you sure you want to post this document? Once posted, stock/ledger entries will be created and this cannot be undone.'))) return;
  try {
    await api('postDocument', { docType: docType, docId: docId });
    showToast(t('পোস্ট হয়েছে ✅','Posted ✅'), 'success');
    if (window.__refreshDocTable) await window.__refreshDocTable();
    if (window.__refreshSimpleVoucherList) await window.__refreshSimpleVoucherList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

/* ============================================================

  ]);

  const today = new Date().toISOString().slice(0,10);
  const monthStart = today.slice(0,8) + '01';

  content.innerHTML = `
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="স্টক ওভারভিউ" data-en="Stock Overview">${t('স্টক ওভারভিউ','Stock Overview')}</h1>
        <p class="i18n" data-bn="নির্বাচিত সময়ের স্টক ইন/আউট এবং সামগ্রিক স্টক ব্যালেন্স" data-en="Stock in/out for the selected period and overall stock balance">${t('নির্বাচিত সময়ের স্টক ইন/আউট এবং সামগ্রিক স্টক ব্যালেন্স','Stock in/out for the selected period and overall stock balance')}</p>
      </div>
      <div style="display:flex;gap:8px;align-items:end;flex-wrap:wrap;">
        <div class="field" style="margin:0;"><label>${t('তারিখ থেকে','Date From')}</label><input type="date" id="so_DateFrom" value="${monthStart}"></div>
        <div class="field" style="margin:0;"><label>${t('তারিখ পর্যন্ত','Date To')}</label><input type="date" id="so_DateTo" value="${today}"></div>
        <button class="btn btn-primary" style="width:auto;" id="so_ApplyBtn">${t('প্রয়োগ করুন','Apply')}</button>
        <button class="btn btn-outline" style="width:auto;" id="so_PrintBtn">🖨️ ${t('A4 প্রিন্ট','A4 Print')}</button>
      </div>
    </div>
    <div class="panel"><div id="stockOverviewWrap" style="overflow-x:auto;"></div></div>`;

  const REF_LABEL = {
    'PurchaseInvoice': ['ক্রয় চালান','Purchase Invoice'], 'PurchaseReturn': ['ক্রয় ফেরত','Purchase Return'],
    'ProcessingVoucher-FG': ['প্রসেসিং (তৈরি পণ্য)','Processing (Finished Goods)'],
    'ProcessingVoucher-RM': ['প্রসেসিং (কাঁচামাল)','Processing (Raw Material)'],
    'ProcessingVoucher-ByProduct': ['প্রসেসিং (বাই-প্রডাক্ট)','Processing (By-Product)'],
    'SalesInvoice': ['বিক্রয় চালান','Sales Invoice'], 'SalesReturn': ['বিক্রয় ফেরত','Sales Return'],
    'MaterialIssue': ['মালামাল ইস্যু','Material Issue'],
    'StockTransfer-In': ['স্টক ট্রান্সফার (আগমন)','Stock Transfer (In)'], 'StockTransfer-Out': ['স্টক ট্রান্সফার (বহির্গমন)','Stock Transfer (Out)'],
    'StockAdjustment': ['স্টক সমন্বয়','Stock Adjustment'], 'Opening': ['ওপেনিং স্টক','Opening Stock']
  };

  function renderReport(fromDate, toDate) {
    const wrap = document.getElementById('stockOverviewWrap');
    if (!wrap) return;
    if (ledger.length === 0) {
      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এখনো কোনো স্টক মুভমেন্ট নেই।" data-en="No stock movement yet.">${t('এখনো কোনো স্টক মুভমেন্ট নেই।','No stock movement yet.')}</div>`;
      return;
    }

    // প্রতিটা আইটেম+গুদামের জন্য: রেঞ্জের ভেতরের ইন/আউট, আর "তারিখ পর্যন্ত" মোট ব্যালেন্স (শুরু থেকে হিসাব করে)
    const combos = {};
    function comboKey(itemId, whId) { return itemId + '::' + whId; }
    ledger.forEach(function (l) {
      const key = comboKey(l.ItemID, l.WarehouseID);
      if (!combos[key]) combos[key] = { ItemID: l.ItemID, WarehouseID: l.WarehouseID, inKg:0, inPieces:0, outKg:0, outPieces:0, balKg:0, balPieces:0 };

      if (l.Date <= toDate) { c.balKg += (Number(l.QtyIn)||0) - (Number(l.QtyOut)||0); c.balPieces += (Number(l.PiecesIn)||0) - (Number(l.PiecesOut)||0); }
      if (l.Date >= fromDate && l.Date <= toDate) {
        c.inKg += Number(l.QtyIn)||0; c.inPieces += Number(l.PiecesIn)||0;
        c.outKg += Number(l.QtyOut)||0; c.outPieces += Number(l.PiecesOut)||0;
      }
    });

    const rows = Object.values(combos).filter(function (c) { return c.inKg || c.inPieces || c.outKg || c.outPieces || c.balKg || c.balPieces; });

      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এই সময়ে কোনো স্টক মুভমেন্ট নেই।" data-en="No stock movement in this period.">${t('এই সময়ে কোনো স্টক মুভমেন্ট নেই।','No stock movement in this period.')}</div>`;
      return;
    }

    function group(qty, pieces, rate, isDual) {
      const value = qty * rate;
      const ratePiece = (isDual && pieces > 0) ? value / pieces : null;
      return `<td style="text-align:center;">${qty ? qty.toFixed(3) : '—'}</td><td style="text-align:center;">${rate ? rate.toFixed(2) : '—'}</td>
        <td style="text-align:center;">${isDual ? (pieces || '—') : '—'}</td><td style="text-align:center;">${ratePiece !== null ? ratePiece.toFixed(2) : '—'}</td>
        <td style="text-align:center;"><b>${value.toFixed(2)}</b></td>`;
    }

    const headHtml = `<tr>
        <th rowspan="2" style="text-align:center;vertical-align:middle;">${t('আইটেম','Item')}</th>
        <th rowspan="2" style="text-align:center;vertical-align:middle;">${t('ওয়ারহাউজ','Warehouse')}</th>
        <th colspan="5" style="text-align:center;">${t('স্টক ইন','Stock In')}</th>
        <th colspan="5" style="text-align:center;">${t('স্টক আউট','Stock Out')}</th>
        <th colspan="5" style="text-align:center;">${t('স্টক ব্যালেন্স','Stock Balance')}</th>
        <th rowspan="2" style="text-align:center;vertical-align:middle;">${t('ভিউ','View')}</th>
      </tr>
      <tr>
        <th style="text-align:center;">${t('ওজন','Weight')}</th><th style="text-align:center;">${t('দর','Rate')}</th><th style="text-align:center;">${t('পিস','Pieces')}</th><th style="text-align:center;">${t('দর','Rate')}</th><th style="text-align:center;">${t('মূল্য','Value')}</th>
        <th style="text-align:center;">${t('ওজন','Weight')}</th><th style="text-align:center;">${t('দর','Rate')}</th><th style="text-align:center;">${t('পিস','Pieces')}</th><th style="text-align:center;">${t('দর','Rate')}</th><th style="text-align:center;">${t('মূল্য','Value')}</th>
        <th style="text-align:center;">${t('ওজন','Weight')}</th><th style="text-align:center;">${t('দর','Rate')}</th><th style="text-align:center;">${t('পিস','Pieces')}</th><th style="text-align:center;">${t('দর','Rate')}</th><th style="text-align:center;">${t('মূল্য','Value')}</th>
      </tr>`;

    const bodyRows = rows.map(function (c) {
      const item = itemMap[c.ItemID] || {};
      const isDual = item.TrackingType === 'WeightPieces';
      const rate = Number(item.StandardCost) || 0;
      return `<tr>
        <td>${escapeHtml(item.ItemName || c.ItemID)}</td><td>${escapeHtml(whMap[c.WarehouseID] || c.WarehouseID)}</td>
        ${group(c.inKg, c.inPieces, rate, isDual)}
        ${group(c.outKg, c.outPieces, rate, isDual)}
        ${group(c.balKg, c.balPieces, rate, isDual)}
        <td style="text-align:center;"><button class="btn btn-outline" style="width:auto;padding:6px 12px;font-size:12px;" onclick='openStockItemVouchers(${JSON.stringify(c.ItemID)}, ${JSON.stringify(c.WarehouseID)}, ${JSON.stringify(fromDate)}, ${JSON.stringify(toDate)})'>${t('ভিউ','View')}</button></td>
      </tr>`;
    }).join('');

    wrap.innerHTML = `<table class="data-table" style="font-size:12px;"><thead>${headHtml}</thead><tbody>${bodyRows}</tbody></table>`;
  }

  window.__stockOverviewLedger = ledger;
  window.__stockOverviewRefLabel = REF_LABEL;

  renderReport(monthStart, today);
  document.getElementById('so_ApplyBtn').addEventListener('click', function () {
    renderReport(val('so_DateFrom'), val('so_DateTo'));
  });
  document.getElementById('so_PrintBtn').addEventListener('click', function () {
    openStockReportPrintView(val('so_DateFrom') || monthStart, val('so_DateTo') || today);

/** নির্দিষ্ট আইটেম+গুদামের সব ভাউচার (উৎস মডিউলসহ) — "ভিউ" বাটনে ক্লিক করলে দেখাবে */
function openStockItemVouchers(itemId, warehouseId, fromDate, toDate) {
  const ledger = window.__stockOverviewLedger || [];
  const REF_LABEL = window.__stockOverviewRefLabel || {};
  const rows = ledger.filter(function (l) { return l.ItemID === itemId && l.WarehouseID === warehouseId && l.Date >= fromDate && l.Date <= toDate; })
    .sort(function (a, b) { return String(a.Date).localeCompare(String(b.Date)); });

  const bodyHtml = rows.length === 0
    ? `<div class="empty-state">${t('এই সময়ে কোনো ভাউচার নেই।','No vouchers in this period.')}</div>`
    : `<table class="data-table"><thead><tr>
        <th>${t('তারিখ','Date')}</th><th>${t('উৎস','Source')}</th><th>${t('রেফারেন্স','Reference')}</th>
        <th>${t('ইন (কেজি/পিস)','In (kg/pcs)')}</th><th>${t('আউট (কেজি/পিস)','Out (kg/pcs)')}</th>
      </tr></thead><tbody>
        ${rows.map(function (l) {
          const lbl = REF_LABEL[l.TransactionType] || [l.TransactionType, l.TransactionType];
          const inTxt = (Number(l.QtyIn)||0) || (Number(l.PiecesIn)||0) ? (Number(l.QtyIn)||0) + ' কেজি' + ((Number(l.PiecesIn)||0) ? ' / ' + l.PiecesIn + ' পিস' : '') : '—';
          const outTxt = (Number(l.QtyOut)||0) || (Number(l.PiecesOut)||0) ? (Number(l.QtyOut)||0) + ' কেজি' + ((Number(l.PiecesOut)||0) ? ' / ' + l.PiecesOut + ' পিস' : '') : '—';
          return `<tr><td>${escapeHtml(l.Date)}</td><td>${t(lbl[0],lbl[1])}</td><td>${escapeHtml(l.RefID)}</td><td>${inTxt}</td><td>${outTxt}</td></tr>`;
        }).join('')}
      </tbody></table>`;

  openModal({ title: t('ভাউচারের তালিকা','Voucher List'), bodyHtml: bodyHtml, wide: true, onSave: null });
  // এই ভিউ শুধু দেখার জন্য — সেভ বাটনের দরকার নেই, তাই লুকিয়ে দেওয়া হচ্ছে
  const saveBtn = document.getElementById('modalSaveBtn');
  if (saveBtn) saveBtn.style.display = 'none';
  document.getElementById('modalCloseBtn').addEventListener('click', function () { if (saveBtn) saveBtn.style.display = ''; }, { once: true });
}

/** A4 প্রিন্ট-উপযোগী ভার্সন — নতুন ট্যাবে খুলবে */
async function openStockReportPrintView(fromDate, toDate) {
  const [items, warehouses] = await Promise.all([cachedList('Items'), cachedList('Warehouses')]);
  const ledger = window.__stockOverviewLedger || await api('list', { sheet:'StockLedger' });
  const itemMap = {}; items.forEach(function (i) { itemMap[i.ItemID] = i; });
  const whMap = {}; warehouses.forEach(function (w) { whMap[w.WarehouseID] = w.WarehouseName; });

  const combos = {};
  ledger.forEach(function (l) {
    const key = l.ItemID + '::' + l.WarehouseID;
    if (!combos[key]) combos[key] = { ItemID: l.ItemID, WarehouseID: l.WarehouseID, inKg:0, inPieces:0, outKg:0, outPieces:0, balKg:0, balPieces:0 };
    const c = combos[key];
    if (l.Date <= toDate) { c.balKg += (Number(l.QtyIn)||0) - (Number(l.QtyOut)||0); c.balPieces += (Number(l.PiecesIn)||0) - (Number(l.PiecesOut)||0); }
    if (l.Date >= fromDate && l.Date <= toDate) {
      c.inKg += Number(l.QtyIn)||0; c.inPieces += Number(l.PiecesIn)||0;
      c.outKg += Number(l.QtyOut)||0; c.outPieces += Number(l.PiecesOut)||0;
    }
  });
  const rows = Object.values(combos).filter(function (c) { return c.inKg || c.inPieces || c.outKg || c.outPieces || c.balKg || c.balPieces; });

  function grp(qty, pieces, rate, isDual) {
    const value = qty * rate;
    const rp = (isDual && pieces > 0) ? value / pieces : null;
    return `<td>${qty ? qty.toFixed(3) : '—'}</td><td>${rate ? rate.toFixed(2) : '—'}</td><td>${isDual ? (pieces||'—') : '—'}</td><td>${rp!==null?rp.toFixed(2):'—'}</td><td>${value.toFixed(2)}</td>`;
  }
  const bodyRows = rows.map(function (c) {
    const item = itemMap[c.ItemID] || {};
    const isDual = item.TrackingType === 'WeightPieces';
    const rate = Number(item.StandardCost) || 0;
    return `<tr><td>${escapeHtml(item.ItemName || c.ItemID)}</td><td>${escapeHtml(whMap[c.WarehouseID] || c.WarehouseID)}</td>${grp(c.inKg,c.inPieces,rate,isDual)}${grp(c.outKg,c.outPieces,rate,isDual)}${grp(c.balKg,c.balPieces,rate,isDual)}</tr>`;
  }).join('');

  const html = `<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8">
<title>স্টক রিপোর্ট ${escapeHtml(fromDate)} - ${escapeHtml(toDate)}</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @page { size: A4 landscape; margin: 10mm; }
  body{font-family:'Hind Siliguri',sans-serif;font-size:10.5px;color:#1b1f27;}
  h1{font-size:16px;margin:0 0 4px;} p{margin:0 0 14px;color:#555;font-size:11px;}
  table{width:100%;border-collapse:collapse;}
  th,td{border:1px solid #ccc;padding:4px 5px;text-align:center;}
  th{background:#1a2029;color:#f2a33c;}
  .toolbar{margin-bottom:14px;}
  .toolbar button{font-size:13px;padding:8px 16px;border-radius:8px;border:1px solid #1a2029;background:#1a2029;color:#f2a33c;cursor:pointer;}
  @media print { .toolbar{display:none;} }
</style></head><body>
  <div class="toolbar"><button onclick="window.print()">🖨️ প্রিন্ট করুন</button></div>
  <h1>স্টক ইন/আউট/ব্যালেন্স রিপোর্ট</h1>
  <p>সময়কাল: ${escapeHtml(fromDate)} থেকে ${escapeHtml(toDate)}</p>
  <table>
    <thead>
      <tr><th rowspan="2">আইটেম</th><th rowspan="2">ওয়ারহাউজ</th><th colspan="5">স্টক ইন</th><th colspan="5">স্টক আউট</th><th colspan="5">স্টক ব্যালেন্স</th></tr>
      <tr>
        <th>ওজন</th><th>দর</th><th>পিস</th><th>দর</th><th>মূল্য</th>
        <th>ওজন</th><th>দর</th><th>পিস</th><th>দর</th><th>মূল্য</th>
        <th>ওজন</th><th>দর</th><th>পিস</th><th>দর</th><th>মূল্য</th>
      </tr>
    </thead>
    <tbody>${bodyRows}</tbody>
  </table>
</body></html>`;

  const win = window.open('', '_blank');
  if (!win) { showToast(t('পপ-আপ ব্লক হয়েছে — এই সাইটের জন্য পপ-আপ অনুমতি দিন।','Pop-up was blocked — please allow pop-ups for this site.'), 'error'); return; }
  win.document.write(html);
  win.document.close();
}

/** পার্টি লেজার — একটা কাস্টমার/সাপ্লায়ার বাছাই করলে তার সব হিসাব এন্ট্রি দেখাবে, চলমান ব্যালেন্সসহ।

async function renderPartyLedger(content, partyTypeFilter) {

  const parties = [];
  if (!partyTypeFilter || partyTypeFilter === 'Customer') {

  }
  if (!partyTypeFilter || partyTypeFilter === 'Supplier') {
    suppliers.filter(function (s) { return s.Status !== 'Deleted'; }).forEach(function (s) { parties.push({ id:s.SupplierID, name:s.Name, type:'Supplier' }); });
  }

  content.innerHTML = `

    <div class="panel"><div id="plWrap"><div class="empty-state">${t('উপরে একটা পার্টি বাছাই করুন।','Select a party above.')}</div></div></div>`;

  document.getElementById('plPartyFilter').addEventListener('change', async function (e) {

    const allEntries = await api('list', { sheet:'PartyLedger' });
    const rows = allEntries.filter(function (r) { return r.PartyType === partyType && r.PartyID === partyId; });
    if (rows.length === 0) { wrap.innerHTML = `<div class="empty-state">${t('কোনো এন্ট্রি পাওয়া যায়নি।','No entries found.')}</div>`; return; }

    }).join('');

  });
}

      const a = document.createElement('a');

/* ============================================================

   ============================================================ */
function val(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}
function attr(v) {
  if (v === undefined || v === null) return '';
  return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeHtml(v) {
  if (v === undefined || v === null) return '';
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function isTrue(v) {
  return v === true || v === 'TRUE' || v === 'true' || v === 1 || v === '1';
}

/** Debit/Credit — পজিটিভ সংখ্যা মানে Debit, নেগেটিভ মানে Credit।
 *  ফর্মে দুটো আলাদা ইনপুট (Dr/Cr) দেখানো হয়, ভেতরে ভেতরে একটাই সংখ্যা হিসেবে সেভ হয়। */
function amountDrCrFieldHtml(id, label, currentVal) {
  const num = Number(currentVal) || 0;
  const drVal = num > 0 ? Math.abs(num).toFixed(2) : '';
  const crVal = num < 0 ? Math.abs(num).toFixed(2) : '';
  return `<div class="field"><label>${label}</label>
    <div style="display:flex;gap:8px;">
      <input id="${id}_dr" type="number" step="any" placeholder="Dr" value="${drVal}" style="flex:1;">
      <input id="${id}_cr" type="number" step="any" placeholder="Cr" value="${crVal}" style="flex:1;">
    </div></div>`;
}
function readAmountDrCr(id) {
  const dr = Number(val(id + '_dr')) || 0;
  const cr = Number(val(id + '_cr')) || 0;
  return dr - cr;
}
function formatAmountDrCr(v, showLabel) {
  const num = Number(v) || 0;
  const abs = Math.abs(num).toFixed(2);
  if (!showLabel) return abs;
  if (num > 0) return abs + ' Dr';
  if (num < 0) return abs + ' Cr';
  return abs;
}

/** UOM-এর DecimalPlaces অনুযায়ী পরিমাণ ফরম্যাট করে — যেমন কেজি হলে 10.000, পিস হলে 12.00 */
function formatQtyByUOM(qty, uomId, unitsList) {
  const unit = (unitsList || []).find(function (u) { return u.UOMID === uomId; });
  const decimals = unit && unit.DecimalPlaces !== undefined && unit.DecimalPlaces !== '' ? Number(unit.DecimalPlaces) : 2;
  return (Number(qty) || 0).toFixed(decimals);
}

  'তারিখ':'Date','মন্তব্য':'Remarks','পরিমাণ':'Quantity','রেট':'Rate','মোট মূল্য':'Total Amount','অবস্থা':'Status',

  'উৎপাদন আদেশ':'Production Order','বিবরণ':'Narration','Invoice':'Invoice'
};

/* ============================================================
   ১৮) INIT — শুরুতে সবসময় লগইন স্ক্রিন দেখানো হবে
   ============================================================ */
(function init() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').classList.remove('ready');
})();

/* ============================================================
   ১৯) ডিজিটাল ঘড়ি — টপবার ও মোডাল দুই জায়গাতেই লাইভ সময় দেখাবে
   ============================================================ */
(function startClock() {
  function tick() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    const clockEl = document.getElementById('digitalClock');
    if (clockEl) clockEl.textContent = timeStr;
    const modalClockEl = document.getElementById('modalClock');
    if (modalClockEl) modalClockEl.textContent = timeStr;
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
