      if (!note) { showToast(t('বিবরণ/নোট লিখুন।','Enter a note.'), 'error'); return; }
      document.getElementById('sv3_BankAccID').value = ourBank;
      document.getElementById('sv3_BankReceivedNote').value = note;
      sv3BankPopupFilled = true;
      updateBankRecSummary();
      closePopup();
    });
    setTimeout(function () { document.getElementById('sv3_PopBankAcc').focus(); }, 0);
  }

  function toggleRecType() {
    const isCash = val('sv3_RecTypeSelect') === 'Cash';
    document.getElementById('sv3_CashReceivedNote').style.display = isCash ? '' : 'none';
    document.getElementById('sv3_BankRecSummary').style.display = isCash ? 'none' : '';
    document.getElementById('sv3_RecAmount').value = isCash ? val('sv3_CashReceivedAmount') : val('sv3_BankReceivedAmount');
  }
  // ভ্যাট — চেকবক্স দিয়ে ঐচ্ছিক। % লিখলে পরিমাণ নিজে থেকে হিসাব হবে (নিট মোটের উপর),
  // আর চাইলে পরিমাণের ঘরে সরাসরি অংক লেখা যাবে — তখন সেটাই থাকবে, % দিয়ে আর বদলাবে না
  window.__sv3VatManual = !!(rec.VatAmount && !rec.VatRate);
  function sv3VatBase() {
    const net = window.__sv3SaleLines.reduce(function (s, l) { return s + (Number(l.netAmount !== undefined ? l.netAmount : l.amount) || 0); }, 0);
    const exp = (window.__sv3CashExpense && window.__sv3CashExpense.amount) || 0;
    return net + exp - (Number(val('sv3_DiscAmount')) || 0);
  }
  window.__sv3GetVat = function () {
    if (!document.getElementById('sv3_VatCheck').checked) return { rate: 0, amount: 0 };
    const rate = Number(val('sv3_VatRate')) || 0;
    let amount = Number(val('sv3_VatAmount')) || 0;
    if (!window.__sv3VatManual && rate > 0) {
      amount = Math.round(sv3VatBase() * rate) / 100;
      document.getElementById('sv3_VatAmount').value = amount || '';
    }
    return { rate: rate, amount: amount };
  };
  document.getElementById('sv3_VatCheck').addEventListener('change', function () {
    document.getElementById('sv3_VatWrap').style.display = this.checked ? 'flex' : 'none';
    if (this.checked) window.__sv3GetVat();
  });
  document.getElementById('sv3_VatRate').addEventListener('input', function () { window.__sv3VatManual = false; window.__sv3GetVat(); });
  document.getElementById('sv3_VatAmount').addEventListener('input', function () { window.__sv3VatManual = true; });
  document.getElementById('sv3_DiscAmount').addEventListener('input', function () { window.__sv3GetVat(); });

  document.getElementById('sv3_RecTypeSelect').addEventListener('change', toggleRecType);
  toggleRecType();

  document.getElementById('sv3_RecAmount').addEventListener('change', function () {
    const isCash = val('sv3_RecTypeSelect') === 'Cash';
    if (isCash) {
      document.getElementById('sv3_CashReceivedAmount').value = this.value;
    } else {
      document.getElementById('sv3_BankReceivedAmount').value = this.value;
      if (Number(this.value) > 0 && !sv3BankPopupFilled) openBankReceiptPopup();
      if (!(Number(this.value) > 0)) { sv3BankPopupFilled = false; updateBankRecSummary(); }
    }
  });
  document.getElementById('sv3_BankRecSummary').addEventListener('click', function () {
    if (Number(val('sv3_BankReceivedAmount')) > 0) openBankReceiptPopup();
  });

  document.getElementById('sv3_CustomerID').addEventListener('change', toggleCashCustomer);
  toggleCashCustomer();

  function refreshItemDropdown() {
    const groupChecked = document.getElementById('sv3_GroupCheck').checked;
    const catChecked = document.getElementById('sv3_CatCheck').checked;
    const groupVal = val('sv3_GroupSelect'), catVal = val('sv3_CatSelect');
    let list = window.__sv3Items;
    if (groupChecked && groupVal) list = list.filter(function (i) { return i.GroupID === groupVal; });
    if (catChecked && catVal) list = list.filter(function (i) { return i.CategoryID === catVal; });
    const sel = document.getElementById('sv3_ItemID');
    const prev = sel.value;
    sel.innerHTML = '<option value="">—</option>' + list.map(function (i) { return `<option value="${attr(i.ItemID)}">${escapeHtml(i.ItemName)}</option>`; }).join('');
    if (list.some(function (i) { return i.ItemID === prev; })) sel.value = prev;
  }
  document.getElementById('sv3_GroupCheck').addEventListener('change', function () {
    const sel = document.getElementById('sv3_GroupSelect');
    sel.disabled = !this.checked; sel.style.display = this.checked ? '' : 'none';
    if (!this.checked) sel.value = '';
    refreshItemDropdown();
  });
  document.getElementById('sv3_GroupSelect').addEventListener('change', refreshItemDropdown);
  document.getElementById('sv3_CatCheck').addEventListener('change', function () {
    const sel = document.getElementById('sv3_CatSelect');
    sel.disabled = !this.checked; sel.style.display = this.checked ? '' : 'none';
    if (!this.checked) sel.value = '';
    refreshItemDropdown();
  });
  document.getElementById('sv3_CatSelect').addEventListener('change', refreshItemDropdown);
  refreshItemDropdown();

  async function onItemOrWarehouseChange() {
    const itemId = val('sv3_ItemID');
    const warehouseId = val('sv3_WarehouseID');
    const item = window.__sv3ItemMap[itemId];
    document.getElementById('sv3_Unit').value = item ? ((window.__sv3UnitMap[item.UOMID]||{}).UOMName || '') : '';
    window.__sv3LastStockRate = item ? (Number(item.StandardCost)||0).toFixed(2) : '';
    if (item && warehouseId) {
      const { data } = await supabaseClient.from('current_stock').select('QtyOnHand,QtyPieces').eq('ItemID', itemId).eq('WarehouseID', warehouseId).maybeSingle();
      const unitName = (window.__sv3UnitMap[item.UOMID] || {}).UOMName || '';
      if (!data) window.__sv3LastStockQty = t('কোনো স্টক নেই','No stock');
      else if (isPieceUnitName(unitName)) {
        const kg = Number(data.QtyOnHand) || 0, pcs = Number(data.QtyPieces) || 0;
        window.__sv3LastStockQty = pcs + ' ' + unitName + (pcs > 0 ? ' (' + kg.toFixed(2) + ' ' + t('কেজি','kg') + ', ' + t('গড় ','avg ') + (kg / pcs).toFixed(3) + ' ' + t('কেজি/পিস','kg/pc') + ')' : '');
      } else window.__sv3LastStockQty = (Number(data.QtyOnHand)||0) + ' ' + unitName;
    } else {
      window.__sv3LastStockQty = '';
    }
    document.getElementById('sv3_PreviewStockQty').value = window.__sv3LastStockQty;
    document.getElementById('sv3_PreviewStockRate').value = window.__sv3LastStockRate;
    document.getElementById('sv3_PreviewStdSalesRate').value = item ? (Number(item.SalesPrice)||0).toFixed(2) : '';
    if (!val('sv3_Rate') && item && item.SalesPrice) document.getElementById('sv3_Rate').value = item.SalesPrice;
    await voucherDualRefresh('sv3', 'sales');   // স্টক কেজি/পিস, আঃ দর, মূল একক
    recalcAmount();
    renderRightSummary();
  }
  document.getElementById('sv3_ItemID').addEventListener('change', onItemOrWarehouseChange);
  document.getElementById('sv3_WarehouseID').addEventListener('change', onItemOrWarehouseChange);

  function recalcAmount() {
    const qty = Number(val('sv3_Qty')) || 0;
    const rate = Number(val('sv3_Rate')) || 0;
    const amount = Math.round(qty * rate);
    document.getElementById('sv3_Amount').value = amount;
    if (document.getElementById('sv3_CommCheck').checked) {
      const commRate = Number(val('sv3_CommRate')) || 0;
      const commAmount = amount * commRate / 100;
      document.getElementById('sv3_CommAmount').value = commAmount.toFixed(2);
      document.getElementById('sv3_NetLineAmount').value = (amount - commAmount).toFixed(2);
    }
  }
  document.getElementById('sv3_Qty').addEventListener('input', recalcAmount);
  document.getElementById('sv3_Rate').addEventListener('input', recalcAmount);
  document.getElementById('sv3_CommRate').addEventListener('input', recalcAmount);
  document.getElementById('sv3_CommCheck').addEventListener('change', function () {
    document.getElementById('sv3_CommRate').disabled = !this.checked;
    document.getElementById('sv3_CommResultRow').style.display = this.checked ? '' : 'none';
    if (!this.checked) { document.getElementById('sv3_CommRate').value = ''; document.getElementById('sv3_CommAmount').value = ''; document.getElementById('sv3_NetLineAmount').value = ''; }
    recalcAmount();
  });

  function resetLineEntry() {
    document.getElementById('sv3_GroupCheck').checked = false;
    const groupSel = document.getElementById('sv3_GroupSelect'); groupSel.disabled = true; groupSel.style.display = 'none'; groupSel.value = '';
    document.getElementById('sv3_CatCheck').checked = false;
    const catSel = document.getElementById('sv3_CatSelect'); catSel.disabled = true; catSel.style.display = 'none'; catSel.value = '';
    refreshItemDropdown();
    document.getElementById('sv3_ItemID').value = '';
    document.getElementById('sv3_WarehouseID').value = '';
    document.getElementById('sv3_Qty').value = '';
    document.getElementById('sv3_QtyKg').value = ''; document.getElementById('sv3_QtyPcs').value = ''; document.getElementById('sv3_QtyKg').placeholder = ''; document.getElementById('sv3_QtyPcs').placeholder = '';
    document.getElementById('sv3_AvgRateKg').value = ''; document.getElementById('sv3_AvgRatePc').value = '';
    document.getElementById('sv3_RateKg').value = ''; document.getElementById('sv3_RatePc').value = ''; window.__sv3RateBasis = null; window.__sv3KgManual = false;
    document.getElementById('sv3_RateKg').classList.remove('vdrv'); document.getElementById('sv3_RatePc').classList.remove('vdrv');
    document.getElementById('sv3_Rate').value = '';
    document.getElementById('sv3_Unit').value = '';
    document.getElementById('sv3_Amount').value = '';
    document.getElementById('sv3_PreviewStdSalesRate').value = '';
    document.getElementById('sv3_CommCheck').checked = false;
    document.getElementById('sv3_CommRate').disabled = true;
    document.getElementById('sv3_CommResultRow').style.display = 'none';
    document.getElementById('sv3_CommRate').value = '';
    document.getElementById('sv3_CommAmount').value = '';
    document.getElementById('sv3_NetLineAmount').value = '';
  }

  function collectCurrentLine() {
    const itemId = val('sv3_ItemID');
    const warehouseId = val('sv3_WarehouseID');
    const qty = Number(val('sv3_Qty')) || 0;
    const rate = Number(val('sv3_Rate')) || 0;
    if (!itemId) { showToast(t('আইটেম বাছাই করুন।','Select an item.'), 'error'); return null; }
    if (!warehouseId) { showToast(t('গুদাম বাছাই করুন।','Select a warehouse.'), 'error'); return null; }
    if (!(qty > 0) && (Number(val('sv3_QtyKg')) || Number(val('sv3_QtyPcs')))) { showToast(window.__sv3Piece ? t('এই আইটেমের মূল একক পিস — পরিমাণ (পিস) দিন।','This item is counted in pieces — enter Qty (pcs).') : t('এই আইটেমের মূল একক কেজি — পরিমাণ (কেজি) দিন।','This item is counted in kg — enter Qty (kg).'), 'error'); return null; }
    if (!(qty > 0 && rate > 0)) { showToast(t('পরিমাণ ও দর দিন।','Enter quantity and rate.'), 'error'); return null; }
    const amount = Math.round(qty * rate);
    const useComm = document.getElementById('sv3_CommCheck').checked;
    const commRate = useComm ? (Number(val('sv3_CommRate')) || 0) : 0;
    const commAmount = useComm ? Number((amount * commRate / 100).toFixed(2)) : 0;
    const costRate = Number(window.__sv3CostRate) || Number((window.__sv3ItemMap[itemId] || {}).StandardCost) || 0;   // খরচ-দর (প্রসেসিং/ক্রয় থেকে)
    return { itemId: itemId, warehouseId: warehouseId, qty: qty, qtyKg: Number(val('sv3_QtyKg')) || 0, qtyPcs: Number(val('sv3_QtyPcs')) || 0, rateKg: Number(val('sv3_RateKg')) || 0, ratePc: Number(val('sv3_RatePc')) || 0, rateBasis: window.__sv3RateBasis || null, rate: rate, amount: amount, commRate: commRate, commAmount: commAmount, netAmount: useComm ? Number((amount - commAmount).toFixed(2)) : amount, costRate: costRate };
  }

  document.getElementById('sv3_ConfirmSaleCheck').addEventListener('change', function () {
    if (!this.checked) return;
    const line = collectCurrentLine();
    if (!line) { this.checked = false; return; }
    window.__sv3SaleLines.push(line);
    resetLineEntry();
    this.checked = false;
    renderRightSummary();
    showToast(t('বিক্রয় লাইন যোগ হয়েছে ✅','Sale line added ✅'), 'success');
  });
  document.getElementById('sv3_AddReturnLineBtn').addEventListener('click', function () {
    const line = collectCurrentLine();
    if (!line) return;
    window.__sv3ReturnLines.push(line);
    resetLineEntry();
    renderRightSummary();
    showToast(t('বিক্রয় ফেরত লাইন যোগ হয়েছে ✅','Sale return line added ✅'), 'success');
  });

  window.__sv3RemoveSaleLine = function (i) { window.__sv3SaleLines.splice(i, 1); renderRightSummary(); renderFullPreview(); };
  window.__sv3RemoveReturnLine = function (i) { window.__sv3ReturnLines.splice(i, 1); renderRightSummary(); renderFullPreview(); };

  function renderRightSummary() {
    if (window.__sv3SchedulePreview) window.__sv3SchedulePreview();   // লাইভ প্রিভিউ হালনাগাদ
    document.getElementById('sv3_PreviewStockQty').value = window.__sv3LastStockQty;
    document.getElementById('sv3_PreviewStockRate').value = window.__sv3LastStockRate;
  }

  function miniLinesTable(lines, removeFnName, showComm) {
    if (lines.length === 0) return `<div style="color:var(--text-muted);padding:8px 0;">${t('কোনো লাইন নেই।','No lines.')}</div>`;
    const rows = lines.map(function (l, i) {
      const item = window.__sv3ItemMap[l.itemId] || {};
      return `<tr>
        <td>${i + 1}</td><td>${escapeHtml(item.ItemName || l.itemId)}</td>
        <td style="text-align:right;">${l.qty}</td><td style="text-align:right;">${l.rate}</td><td style="text-align:right;"><b>${l.amount}</b></td>
        ${showComm ? `<td style="text-align:right;">${l.commRate || 0}</td><td style="text-align:right;">${(l.commAmount||0).toFixed ? l.commAmount.toFixed(2) : l.commAmount}</td><td style="text-align:right;"><b>${(l.netAmount!==undefined?l.netAmount:l.amount).toFixed ? l.netAmount.toFixed(2) : l.netAmount}</b></td>` : ''}
        <td><button type="button" onclick="${removeFnName}(${i})" style="border:none;background:none;cursor:pointer;color:var(--danger);">✕</button></td>
      </tr>`;
    }).join('');
    return `<table style="width:100%;border-collapse:collapse;font-size:12px;">
      <thead><tr style="border-bottom:1px solid var(--border);"><th style="text-align:left;">${t('ক্রঃ','No.')}</th><th style="text-align:left;">${t('আইটেম','Item')}</th><th style="text-align:right;">${t('পরিমাণ','Qty')}</th><th style="text-align:right;">${t('দর','Rate')}</th><th style="text-align:right;">${t('মূল্য','Amt')}</th>${showComm ? `<th style="text-align:right;">${t('কমিঃ','Comm.')}</th><th style="text-align:right;">${t('(-)কমিঃ','(-)Comm.')}</th><th style="text-align:right;">${t('নিট মূল্য','Net Amt')}</th>` : ''}<th></th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }

  async function buildDraftPrintHtml() {
    const customerId = val('sv3_CustomerID');
    const isCash = customerId === 'CUS-CASH';
    const custRec = window.__sv3CustomerMap[customerId];
    const custName = isCash ? ('নগদ' + (val('sv3_CashName') ? ' (' + val('sv3_CashName') + ')' : '')) : (custRec ? (custRec.CompanyName || custRec.Name) : '—');
    const custZone = isCash ? '' : ((custRec && custRec.Zone) || '');
    const custAddress = isCash ? val('sv3_CashAddress') : ((custRec && custRec.Address) || '');
    const custPhone = isCash ? val('sv3_CashMobile') : ((custRec && custRec.Phone) || '');
    const company = await api('getSingleton', { sheet:'CompanyProfile' });
    const cashExpenseAmt = (window.__sv3CashExpense && window.__sv3CashExpense.amount) || 0;
    const discountAmt = Number(val('sv3_DiscAmount')) || 0;
    const manualDate = document.getElementById('sv3_ManualDateCheck').checked ? val('sv3_ManualVoucherDate') : '';
    const manualNo = document.getElementById('sv3_ManualNoCheck').checked ? val('sv3_ManualVoucherNo') : '';

    const draftVat = window.__sv3GetVat ? window.__sv3GetVat() : { rate: 0, amount: 0 };
    return buildVoucherTableHtml({
      titleBn: 'বিক্রয় ভাউচার', company: company,
      voucherDate: val('sv3_Date'), voucherNo: t('অটো তৈরি হবে','Auto'),
      manualDate: manualDate, manualNo: manualNo,
      partyLabelBn: 'গ্রাহক নামঃ', partyName: custName, partyZone: custZone, partyAddress: custAddress, partyPhone: custPhone,
      mainLines: window.__sv3SaleLines, mainLabel: 'বিক্রয়', mainTotalLabel: 'মোটঃ বিক্রয়ঃ',
      returnLines: window.__sv3ReturnLines, returnLabel: 'বিক্রয় ফেরত পণ্যঃ', returnTotalLabel: 'মোটঃ ফেরতঃ',
      itemMap: window.__sv3ItemMap, cashExpenseAmt: cashExpenseAmt, discountAmt: discountAmt,
      vatRate: draftVat.rate, vatAmount: draftVat.amount,
      isCashParty: isCash, prevDue: isCash ? 0 : (window.__sv3PartyBalance || 0),
      cashPaid: isCash ? 0 : (Number(val('sv3_CashReceivedAmount')) || 0), bankPaid: isCash ? 0 : (Number(val('sv3_BankReceivedAmount')) || 0),
      payCashLabel: 'নগদ গ্রহণঃ', payBankLabel: 'ব্যাংকে গ্রহণঃ',
      withProfit: true, showProfit: document.getElementById('sv3_ShowProfitCheck').checked,
      sign1: 'ক্রেতার স্বাঃ', sign3Label: 'বিক্রয়কারী স্বাঃ', isDraft: true
    });
  }

  async function renderFullPreview() {
    const wrap = document.getElementById('sv3_LivePreviewBody');
    if (!wrap) return;
    if (window.__sv3SaleLines.length === 0 && window.__sv3ReturnLines.length === 0) {
      wrap.innerHTML = `<div class="empty-state">${t('অন্তত একটা লাইন যোগ করলে প্রিভিউ দেখা যাবে।','Add at least one line to see the preview.')}</div>`;
      return;
    }
    const html = await buildDraftPrintHtml();
    wrap.innerHTML = `<iframe id="sv3_PreviewFrame" style="width:100%;height:62vh;border:1px solid var(--border);border-radius:8px;background:#fff;" srcdoc="${attr(html)}"></iframe>`;
  }

  function printDraftFrame() {
    const frame = document.getElementById('sv3_PreviewFrame');
    if (!frame || !frame.contentWindow) { showToast(t('প্রিন্ট করার জন্য অন্তত একটা লাইন যোগ করুন।','Add at least one line to print.'), 'error'); return; }
    frame.contentWindow.focus();
    frame.contentWindow.print();
  }
  async function shareDraft() {
    if (window.__sv3SaleLines.length === 0 && window.__sv3ReturnLines.length === 0) {
      showToast(t('শেয়ার করার জন্য অন্তত একটা লাইন যোগ করুন।','Add at least one line to share.'), 'error');
      return;
    }
    const saleTotal = window.__sv3SaleLines.reduce(function (s, l) { return s + (Number(l.amount) || 0); }, 0);
    const returnTotal = window.__sv3ReturnLines.reduce(function (s, l) { return s + (Number(l.amount) || 0); }, 0);
    const cashExpenseAmt = (window.__sv3CashExpense && window.__sv3CashExpense.amount) || 0;
    const discountAmt = Number(val('sv3_DiscAmount')) || 0;
    const text = 'বিক্রয় ভাউচার — নিট মোট: ৳ ' + (saleTotal + cashExpenseAmt - discountAmt - returnTotal).toFixed(2);
    if (navigator.share) {
      try { await navigator.share({ title: 'বিক্রয় ভাউচার', text: text }); } catch (e) {}
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(text);
      showToast(t('তথ্য ক্লিপবোর্ডে কপি হয়েছে।','Copied to clipboard.'), 'success');
    }
  }
  document.getElementById('sv3_LivePageSetupBtn').addEventListener('click', printDraftFrame);
  document.getElementById('sv3_ShowProfitCheck').addEventListener('change', renderFullPreview);
  document.getElementById('sv3_LivePrintBtn').addEventListener('click', printDraftFrame);
  document.getElementById('sv3_LiveShareBtn').addEventListener('click', shareDraft);

  renderRightSummary();
  showTab('entry');
}

/* ============================================================
   জেনেরিক DOCUMENT ইঞ্জিন — Header+Lines থাকা বাকি সব ডকুমেন্ট
   (PR, PO, GRN, MaterialIssue, StockTransfer, StockAdjust, SO, DC,
   BOM, PMI, FGR, JV) এই একটামাত্র ইঞ্জিন দিয়ে চলে।
   ============================================================ */
async function renderDocumentListPage(content, config) {
  const records = await api('list', { sheet: config.headerSheet });

  content.innerHTML = `
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="${attr(config.titleBn)}" data-en="${attr(config.titleEn)}">${t(config.titleBn, config.titleEn)}</h1>
        <p class="i18n" data-bn="${attr(config.subBn)}" data-en="${attr(config.subEn)}">${t(config.subBn, config.subEn)}</p>
      </div>
      <button class="btn btn-primary i18n" style="width:auto;" id="docAddBtn" data-bn="+ নতুন যোগ করুন" data-en="+ Add New">${t('+ নতুন যোগ করুন','+ Add New')}</button></div>
    <div class="panel"><div id="docTableWrap"></div></div>`;

  function renderTable(list) {
    const wrap = document.getElementById('docTableWrap');
    if (!wrap) return; // ব্যবহারকারী এই ফাঁকে অন্য পেজ/ট্যাবে চলে গেলে এই এলিমেন্ট আর DOM-এ থাকবে না
    const active = list.filter(function (r) { return r.Status !== 'Deleted'; });
    if (active.length === 0) {
      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এখনো কোনো এন্ট্রি নেই।" data-en="No entries yet.">${t('এখনো কোনো এন্ট্রি নেই।','No entries yet.')}</div>`;
      return;
    }
    const headCells = config.listColumns.map(function (c) { return `<th class="i18n" data-bn="${attr(c.label)}" data-en="${attr(bnToEn(c.label))}">${t(c.label, bnToEn(c.label))}</th>`; }).join('');
    const bodyRows = active.slice().reverse().map(function (r) {
      const cells = config.listColumns.map(function (c) {
        let v = r[c.key];
        if (c.key === 'Status') {
          v = v === 'Posted' ? `<span class="badge active i18n" data-bn="পোস্ট করা" data-en="Posted">${t('পোস্ট করা','Posted')}</span>` : `<span class="badge draft i18n" data-bn="খসড়া" data-en="Draft">${t('খসড়া','Draft')}</span>`;
        } else if (c.key === 'TotalAmount') {
          v = v ? Number(v).toFixed(2) : '—';
        } else v = escapeHtml(v);
        return '<td>' + v + '</td>';
      }).join('');
      const editBtn = `<button onclick='openDocumentForm(${JSON.stringify(r[config.idField])})' title="${t('সম্পাদনা','Edit')}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="m18.5 2.5 3 3L10 17l-4 1 1-4Z"/></svg>
        </button>`;
      const postBtn = (config.postable && r.Status !== 'Posted')
        ? `<button class="btn" style="width:auto;padding:6px 12px;font-size:12px;" onclick='postDocumentRecord(${JSON.stringify(config.docType)}, ${JSON.stringify(r[config.idField])})'>${t('পোস্ট করুন','Post')}</button>`
        : '';
      return `<tr>${cells}<td class="row-actions">${postBtn}${editBtn}</td></tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}<th></th></tr></thead><tbody>${bodyRows}</tbody></table>`;
  }

  renderTable(records);
  document.getElementById('docAddBtn').addEventListener('click', function () { openDocumentForm(null); });
  window.__activeDocConfig = config;
  window.__refreshDocTable = async function () { renderTable(await api('list', { sheet: config.headerSheet })); };
}

async function openDocumentForm(existingId) {
  const config = window.__activeDocConfig;
  const isEdit = !!existingId;

  let existingHeader = null, existingLines = [];
  if (isEdit) {
    const doc = await api('getDocument', { headerSheet: config.headerSheet, idField: config.idField, linesSheet: config.linesSheet, lineIdField: config.lineIdField, idValue: existingId });
    existingHeader = doc.header;
    existingLines = doc.lines;
    if (existingHeader.Status === 'Posted') {
      showToast(t('পোস্ট হয়ে যাওয়া ডকুমেন্ট এডিট করা যাবে না।','A posted document cannot be edited.'), 'error');
      return;
    }
  }

  // হেডার ও লাইন ফিল্ডের সব FK ড্রপডাউনের ডেটা একসাথে (parallel) আনা হচ্ছে
  const allFkFields = config.headerFields.concat(config.lineFields).filter(function (f) { return f.type === 'select-fk'; });
  const uniqueFkSheets = Array.from(new Set(allFkFields.map(function (f) { return f.fkSheet; })));
  const fkSheetMap = await cachedListMultiple(uniqueFkSheets);
  const fkLists = {};
  allFkFields.forEach(function (f) { fkLists[f.key] = fkSheetMap[f.fkSheet]; });
  window.__docFkLists = fkLists;
  window.__docConfig = config;

  function fieldInputHtml(f, prefix, currentVal) {
    const id = prefix + f.key;
    if (f.type === 'select-fk') {
      const opts = (fkLists[f.key] || []).filter(function (r) { return r.Status !== 'Deleted'; })
        .map(function (r) { return `<option value="${attr(r[f.fkIdField])}" ${currentVal===r[f.fkIdField]?'selected':''}>${escapeHtml(r[f.fkLabel])}</option>`; }).join('');
      return `<select id="${id}" ${f.key==='ItemID'?'onchange="updateDocLineAmount(this)"':''}><option value="">—</option>${opts}</select>`;
    }
    if (f.type === 'number') return `<input id="${id}" type="number" step="any" value="${attr(currentVal)}" ${config.computeTotal?'oninput="recalcDocTotal()"':''}>`;
    if (f.type === 'date') return `<input id="${id}" type="date" value="${attr(currentVal)}">`;
    return `<input id="${id}" value="${attr(currentVal)}">`;
  }

  const headerHtml = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">` +
    config.headerFields.map(function (f) {
      return `<div class="field"><label>${f.label}</label>${fieldInputHtml(f, 'doc_h_', existingHeader ? existingHeader[f.key] : '')}</div>`;
    }).join('') + `</div>`;

  window.__docLineRows = isEdit ? existingLines.slice() : [{}];

  function renderDocLines() {
    const wrap = document.getElementById('doc_LinesWrap');
    if (!wrap) return;
    const headCells = config.lineFields.map(function (f) { return `<th>${f.label}</th>`; }).join('') + (config.computeTotal ? '<th>' + t('মূল্য','Amount') + '</th>' : '') + '<th></th>';
    const rows = window.__docLineRows.map(function (row, idx) {
      const cells = config.lineFields.map(function (f) {
        return `<td>${fieldInputHtml(f, 'doc_ln_' + idx + '_', row[f.key])}</td>`;
      }).join('');
      const amtCell = config.computeTotal ? `<td id="doc_ln_${idx}_amt" style="font-weight:600;">0.00</td>` : '';
      return `<tr>${cells}${amtCell}<td><button type="button" onclick="window.__removeDocLine(${idx})">✕</button></td></tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}</tr></thead><tbody>${rows}</tbody></table>`;
    if (config.computeTotal) recalcDocTotal();
  }
  window.__renderDocLines = renderDocLines;
  window.__removeDocLine = function (idx) { window.__docLineRows.splice(idx, 1); renderDocLines(); };

  const bodyHtml = headerHtml +
    `<h4 style="margin:20px 0 10px;font-size:13px;color:var(--text-muted);text-transform:uppercase;border-top:1px solid var(--border);padding-top:14px;">${t('লাইন আইটেম','Line Items')}</h4>
    <div id="doc_LinesWrap"></div>
    <button type="button" class="btn" style="width:auto;margin-top:8px;" id="doc_AddLineBtn">${t('+ লাইন যোগ করুন','+ Add Line')}</button>` +
    (config.computeTotal ? `<div style="margin-top:14px;font-size:15px;font-weight:700;text-align:right;">${t('মোট','Total')}: <span id="doc_GrandTotal">0.00</span></div>` : '');

  openModal({
    title: (isEdit ? t('সম্পাদনা — ','Edit — ') : t('নতুন — ','New — ')) + t(config.titleBn, config.titleEn),
    bodyHtml: bodyHtml,
    wide: true,
    onSave: async function () {
      const headerData = {};
      config.headerFields.forEach(function (f) { const v = val('doc_h_' + f.key); headerData[f.key] = ((f.type === 'select-fk' || f.type === 'number' || f.type === 'date') && v === '') ? null : v; });
      const missingHeader = config.headerFields.filter(function (f) { return f.required && !headerData[f.key]; });
      if (missingHeader.length > 0) throw new Error(missingHeader.map(function (f) { return f.label; }).join(', ') + ' আবশ্যক।');

      const lines = window.__docLineRows.map(function (_, idx) {
        const line = {};
        config.lineFields.forEach(function (f) { const v = val('doc_ln_' + idx + '_' + f.key); line[f.key] = ((f.type === 'select-fk' || f.type === 'number') && v === '') ? null : v; });
        if (config.computeTotal) {
          const qty = Number(line.Quantity) || 0, rate = Number(line.Rate) || 0;
          line.Amount = qty * rate;
        }
        return line;
      }).filter(function (l) {
        return Object.keys(l).some(function (k) { return l[k] !== '' && l[k] !== null && l[k] !== undefined; });
      });
      if (lines.length === 0) throw new Error(t('অন্তত একটা লাইন আইটেম যোগ করুন।','Add at least one line item.'));

      if (config.computeTotal) {
        headerData.TotalAmount = lines.reduce(function (s, l) { return s + (Number(l.Amount) || 0); }, 0);
      }

      const requiredFields = config.headerFields.filter(function (f) { return f.required; }).map(function (f) { return f.key; });
      if (isEdit) {
        await api('updateDocument', { headerSheet: config.headerSheet, idField: config.idField, linesSheet: config.linesSheet, lineIdField: config.lineIdField, idValue: existingId, headerData: headerData, lines: lines });
      } else {
        await api('createDocument', { headerSheet: config.headerSheet, idField: config.idField, idPrefix: config.idPrefix, requiredFields: requiredFields, linesSheet: config.linesSheet, lineIdField: config.lineIdField, headerData: headerData, lines: lines });
      }
      showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
      if (window.__refreshDocTable) await window.__refreshDocTable();
    }
  });

  document.getElementById('doc_AddLineBtn').addEventListener('click', function () { window.__docLineRows.push({}); renderDocLines(); });
  renderDocLines();
}

window.updateDocLineAmount = function () { if (window.__docConfig && window.__docConfig.computeTotal) recalcDocTotal(); };
window.recalcDocTotal = function () {
  if (!window.__docLineRows) return;
  let grand = 0;
  window.__docLineRows.forEach(function (_, idx) {
    const qty = Number(val('doc_ln_' + idx + '_Quantity')) || 0;
    const rate = Number(val('doc_ln_' + idx + '_Rate')) || 0;
    const amt = qty * rate;
    grand += amt;
    const amtEl = document.getElementById('doc_ln_' + idx + '_amt');
    if (amtEl) amtEl.textContent = amt.toFixed(2);
  });
  const grandEl = document.getElementById('doc_GrandTotal');
  if (grandEl) grandEl.textContent = grand.toFixed(2);
};

async function postDocumentRecord(docType, docId) {
  if (!confirm(t('আপনি কি নিশ্চিত এই ডকুমেন্ট পোস্ট করতে চান? পোস্ট হয়ে গেলে স্টক/লেজারে এন্ট্রি পড়বে এবং এটা আর বাতিল করা যাবে না।','Are you sure you want to post this document? Once posted, stock/ledger entries will be created and this cannot be undone.'))) return;
  try {
    await api('postDocument', { docType: docType, docId: docId });
    showToast(t('পোস্ট হয়েছে ✅','Posted ✅'), 'success');
    if (window.__refreshDocTable) await window.__refreshDocTable();
    if (window.__refreshSimpleVoucherList) await window.__refreshSimpleVoucherList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

/* ============================================================
   ১৩.৫) ইনভেন্টরি — Stock Overview, Stock Ledger, Party Ledger
   ============================================================ */
/* ============================================================
   স্টক ওভারভিউ — ইন / আউট / ব্যালান্স, প্রতিটায় কেজি · পিস · দর/কেজি · দর/পিস · মূল্য
   • কেজি ও পিস দুটোই আলাদা হিসাব (লেজারের QtyIn/QtyOut = কেজি, PiecesIn/PiecesOut = পিস)
   • "মূল একক" = যে এককে আইটেম কেনা-বেচা হয় (আইটেমের একক); মূল্য সেই এককের দরে, ঘরে মোটা করে দেখানো
   • দরঃ সর্বশেষ পোস্ট করা প্রসেসিং (প্রস্তুত পণ্যের কেজি-দর ও পিস-দর) → না থাকলে সর্বশেষ পোস্ট করা ক্রয় → না থাকলে স্ট্যান্ডার্ড কস্ট;
     একটা দর না থাকলে গড় ওজন (কেজি ÷ পিস) দিয়ে অন্যটা থেকে
   • মাইনাস ব্যালান্স লাল; পোস্ট না করা ক্রয় চালান/প্রসেসিং থাকলে উপরে সতর্কবার্তা
   ============================================================ */
async function stockOverviewData() {
  const [items, warehouses, units, ledger] = await Promise.all([cachedList('Items'), cachedList('Warehouses'), cachedList('UOM'), api('list', { sheet: 'StockLedger' })]);
  const safe = async function (q) { try { const r = await q; return (r && !r.error && r.data) || []; } catch (e) { return []; } };
  const [fg, pv, pil, pih] = await Promise.all([
    safe(supabaseClient.from('ProcessingFG_Lines').select('*')), safe(supabaseClient.from('ProcessingVoucher').select('ProcessingID,Date,Status')),
    safe(supabaseClient.from('PI_Lines').select('*')), safe(supabaseClient.from('PurchaseInvoice').select('PIID,InvoiceDate,Status'))]);
  const itemMap = {}; items.forEach(function (i) { itemMap[i.ItemID] = i; });
  const whMap = {}; warehouses.forEach(function (w) { whMap[w.WarehouseID] = w.WarehouseName; });
  const pvMap = {}; pv.forEach(function (h) { pvMap[h.ProcessingID] = h; });
  const piMap = {}; pih.forEach(function (h) { piMap[h.PIID] = h; });
  const rates = {};   // ItemID → { kg, pc, src }
  fg.filter(function (l) { const h = pvMap[l.ProcessingID]; return h && h.Status === 'Posted'; })
    .sort(function (a, b) { return String(pvMap[a.ProcessingID].Date).localeCompare(String(pvMap[b.ProcessingID].Date)); })
    .forEach(function (l) { rates[l.ItemID] = { kg: Number(l.RatePerKg) || 0, pc: Number(l.RatePerPc) || 0, src: t('প্রসেসিং', 'processing') }; });
  pil.filter(function (l) { const h = piMap[l.PIID]; return h && h.Status === 'Posted' && Number(l.Quantity) > 0 && !rates[l.ItemID]; })
    .sort(function (a, b) { return String(piMap[a.PIID].InvoiceDate).localeCompare(String(piMap[b.PIID].InvoiceDate)); })
    .forEach(function (l) {
      const val = (l.NetAmount !== null && l.NetAmount !== undefined && l.NetAmount !== '') ? Number(l.NetAmount) : (l.Amount !== null && l.Amount !== undefined && l.Amount !== '') ? Number(l.Amount) : Number(l.Quantity) * Number(l.Rate);
      const r = (Number(val) || 0) / Number(l.Quantity), piece = isPieceUOM((itemMap[l.ItemID] || {}).UOMID, units);
      rates['__pi__' + l.ItemID] = { kg: piece ? 0 : r, pc: piece ? r : 0, src: t('ক্রয়', 'purchase') };
    });
  const drafts = { pi: pih.filter(function (h) { return h.Status === 'Draft'; }).length, pv: pv.filter(function (h) { return h.Status === 'Draft'; }).length };
  // লাভের জন্য বিক্রয় (পোস্ট করা বিক্রয় যোগ, পোস্ট করা বিক্রয় ফেরত বাদ)
  const sales = [];
  if (currentUser && currentUser.RoleID === 'ROLE-ADMIN') {
    const [sil, sih, srl, srh] = await Promise.all([safe(supabaseClient.from('SI_Lines').select('*')), safe(supabaseClient.from('SalesInvoice').select('SIID,InvoiceDate,WarehouseID,Status')),
      safe(supabaseClient.from('SR_Lines').select('*')), safe(supabaseClient.from('SalesReturn').select('SRID,Date,WarehouseID,Status'))]);
    const add = function (lines, heads, idf, df, sign) {
      const hm = {}; heads.forEach(function (h) { if (h.Status === 'Posted') hm[h[idf]] = h; });
      lines.forEach(function (l) {
        const h = hm[l[idf]]; if (!h) return;
        const piece = isPieceUOM((itemMap[l.ItemID] || {}).UOMID, units), q = Number(l.Quantity) || 0;
        const net = (l.NetAmount !== null && l.NetAmount !== undefined && l.NetAmount !== '') ? Number(l.NetAmount) : (Number(l.Amount) || q * (Number(l.Rate) || 0));
        sales.push({ ItemID: l.ItemID, WarehouseID: h.WarehouseID, date: String(h[df] || '').slice(0, 10), kg: piece ? (Number(l.QtyKg) || 0) : q, pc: piece ? q : (Number(l.QtyPcs) || 0), net: net, sign: sign });
      });
    };
    add(sil, sih, 'SIID', 'InvoiceDate', 1); add(srl, srh, 'SRID', 'Date', -1);
  }
  return { items: items, units: units, ledger: ledger, itemMap: itemMap, whMap: whMap, rates: rates, drafts: drafts, sales: sales };
}
function stockOverviewRows(D, fromDate, toDate) {
  const combos = {};
  D.ledger.forEach(function (l) {
    const key = l.ItemID + '::' + l.WarehouseID;
    const c = combos[key] = combos[key] || { ItemID: l.ItemID, WarehouseID: l.WarehouseID, inKg: 0, inPc: 0, outKg: 0, outPc: 0, balKg: 0, balPc: 0 };
    const d = String(l.Date || '').slice(0, 10);
    if (d <= toDate) { c.balKg += (Number(l.QtyIn) || 0) - (Number(l.QtyOut) || 0); c.balPc += (Number(l.PiecesIn) || 0) - (Number(l.PiecesOut) || 0); }
    if (d >= fromDate && d <= toDate) { c.inKg += Number(l.QtyIn) || 0; c.inPc += Number(l.PiecesIn) || 0; c.outKg += Number(l.QtyOut) || 0; c.outPc += Number(l.PiecesOut) || 0; }
  });
  const near0 = function (x) { return Math.abs(x) < 0.0005; };
  return Object.values(combos).filter(function (c) { return !(near0(c.inKg) && near0(c.inPc) && near0(c.outKg) && near0(c.outPc) && near0(c.balKg) && near0(c.balPc)); })
    .map(function (c) {
      const item = D.itemMap[c.ItemID] || {}, piece = isPieceUOM(item.UOMID, D.units);
      const u = D.units.find(function (x) { return x.UOMID === item.UOMID; });
      let r = D.rates[c.ItemID] || D.rates['__pi__' + c.ItemID] || null;
      r = r ? { kg: r.kg, pc: r.pc, src: r.src } : { kg: piece ? 0 : (Number(item.StandardCost) || 0), pc: piece ? (Number(item.StandardCost) || 0) : 0, src: t('স্ট্যান্ডার্ড কস্ট', 'standard cost') };
      const avg = (c.balKg > 0 && c.balPc > 0) ? c.balKg / c.balPc : ((c.inKg > 0 && c.inPc > 0) ? c.inKg / c.inPc : 0);   // গড় ওজন (কেজি/পিস)
      if (!r.kg && r.pc && avg) r.kg = r.pc / avg;
      if (!r.pc && r.kg && avg) r.pc = r.kg * avg;
      const val = function (kg, pc) { return piece ? (pc && r.pc ? pc * r.pc : kg * r.kg) : (kg && r.kg ? kg * r.kg : pc * r.pc); };
      // লাভ = বিক্রয়ের নিট মূল্য − বিক্রি হওয়া মালের খরচ (এই সময়ের মধ্যে)
      let rev = 0, sKg = 0, sPc = 0, sold = false;
      (D.sales || []).forEach(function (x) { if (x.ItemID === c.ItemID && x.WarehouseID === c.WarehouseID && x.date >= fromDate && x.date <= toDate) { sold = true; rev += x.sign * x.net; sKg += x.sign * x.kg; sPc += x.sign * x.pc; } });
      const profit = sold ? rev - val(sKg, sPc) : null;
      return { c: c, item: item, piece: piece, unit: u ? u.UOMName : '', wh: D.whMap[c.WarehouseID] || c.WarehouseID, r: r, val: val, profit: profit };
    }).sort(function (a, b) { return String(a.item.ItemName || '').localeCompare(String(b.item.ItemName || ''), 'bn'); });
}
function stockOverviewTableHtml(rows, fromDate, toDate, forPrint) {
  const q3 = function (x) { return Math.abs(x) < 0.0005 ? '—' : (+x.toFixed(3)).toLocaleString('en-IN', { maximumFractionDigits: 3 }); };
  const m2 = function (x) { return x ? x.toFixed(2) : '—'; };
  const neg = function (x) { return x < -0.0005; };
  const grp = function (R, kg, pc, isBal, g) {   // g: gi = ইন (সবুজ), go = আউট (লালচে), gb = ব্যালান্স (নীল)
    const v = R.val(kg, pc), bad = isBal && (neg(kg) || neg(pc));
    const cell = function (x, main) { return `<td class="r ${g} ${main ? 'mu' : ''} ${isBal && neg(x) ? 'neg' : ''}">${q3(x)}</td>`; };
    const cell1 = function (x, main) { return `<td class="r ${g} ${g === 'gi' ? 'gstart' : ''} ${main ? 'mu' : ''} ${isBal && neg(x) ? 'neg' : ''}">${q3(x)}</td>`; };
    return cell1(kg, !R.piece) + cell(pc, R.piece) + `<td class="r ${g}">${m2(R.r.kg)}</td><td class="r ${g}">${m2(R.r.pc)}</td><td class="r ${g} gend ${bad ? 'neg' : ''}"><b>${v ? v.toFixed(2) : '0.00'}</b>${bad && !forPrint ? ` <span title="${attr(t('স্টক মাইনাস — বিক্রি/খরচ বেশি হয়েছে, অথবা ক্রয় চালান/প্রসেসিং এখনো পোস্ট হয়নি', 'Negative stock — more sold/used than received, or a purchase/processing is not posted yet'))}">⚠️</span>` : ''}</td>`;
  };
  const sub = function (g) { return `<th class="${g} ${g === 'gi' ? 'gstart' : ''}">${t('কেজি', 'kg')}</th><th class="${g}">${t('পিস', 'pcs')}</th><th class="${g}">${t('দর/কেজি', 'rate/kg')}</th><th class="${g}">${t('দর/পিস', 'rate/pc')}</th><th class="${g} gend">${t('মূল্য', 'value')}</th>`; };
  let tIn = 0, tOut = 0, tBal = 0, tPf = 0;

/* ===== দিন-মাস-বছর (01-10-2026) তারিখ-ঘর =====
   ব্রাউজারের নিজের তারিখ-ঘর কম্পিউটারের ভাষা অনুযায়ী 10/01/2026 দেখায় — এটা সবসময় 01-10-2026।

function isoToDmy(iso) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || '')); return m ? m[3] + '-' + m[2] + '-' + m[1] : ''; }
function dmyToIso(dmy) {

  const d = Number(m[1]), mo = Number(m[2]), y = Number(m[3]); const dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return '';

}

function wireDmyFields(root) {

      const digits = inp.value.replace(/[০-৯]/g, function (c) { return '০১২৩৪৫৬৭৮৯'.indexOf(c); }).replace(/\D/g, '').slice(0, 8);
      let v = digits; if (digits.length > 4) v = digits.slice(0, 2) + '-' + digits.slice(2, 4) + '-' + digits.slice(4); else if (digits.length > 2) v = digits.slice(0, 2) + '-' + digits.slice(2);

/* ===== সব তারিখের ঘরঃ দিন-মাস-বছর (09-10-2026) =====

   আসল ঘরটা ভেতরে লুকিয়ে থাকে — কোড আগের মতোই .value দিয়ে 2026-10-09 পড়ে/লেখে, আর লেখার ঘর নিজে মিলে যায়। */
(function () {
  const desc = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');

      let v = digits; if (digits.length > 4) v = digits.slice(0, 2) + '-' + digits.slice(2, 4) + '-' + digits.slice(4); else if (digits.length > 2) v = digits.slice(0, 2) + '-' + digits.slice(2);

async function getFiscalYearStart(refIso) {
  let fy = '';
  try { const p = await api('getSingleton', { sheet: 'CompanyProfile' }); fy = (p && p.FiscalYearStart) || ''; } catch (e) {}
  const d = new Date(), ref = refIso || (d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));
  const md = /^\d{4}-\d{2}-\d{2}/.test(String(fy)) ? String(fy).slice(5, 10) : '07-01';
  const y = Number(ref.slice(0, 4));
  return (ref.slice(5, 10) >= md ? y : y - 1) + '-' + md;

  const monthStart = await getFiscalYearStart(today);   // "হইতে" ডিফল্টঃ অর্থবছরের শুরু (01-07-2026)
  content.innerHTML = `
    <style>${STOCK_OV_CSS} ${STOCK_OV_FREEZE_CSS} ${DMY_CSS} .so-dates label{font-size:11.5px;} .so-warn{background:#fff3e0;border:1px solid #f0b46a;color:#7a4300;border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:10px;} .so-legend{font-size:11.5px;color:var(--text-muted);margin-top:6px;} @media (max-width:760px){ .so-legend{font-size:10.5px;} }</style>
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="স্টক ওভারভিউ" data-en="Stock Overview">${t('স্টক ওভারভিউ', 'Stock Overview')}</h1>
        <p>${t('নির্বাচিত সময়ের স্টক ইন/আউট এবং সামগ্রিক স্টক ব্যালান্স — কেজি ও পিস আলাদা', 'Stock in/out for the period and overall balance — kg and pcs separately')}</p>
      </div>
      <div style="display:flex;gap:8px;align-items:end;flex-wrap:wrap;">
        <div class="field so-dates" style="margin:0;"><label>${t('তারিখ হইতে', 'Date from')}</label>${dmyDateField('so_DateFrom', monthStart)}</div>
        <div class="field so-dates" style="margin:0;"><label>${t('তারিখ পর্যন্ত', 'Date to')}</label>${dmyDateField('so_DateTo', today)}</div>
        <button class="btn btn-primary" style="width:auto;" id="so_ApplyBtn">${t('প্রয়োগ করুন', 'Apply')}</button>
        <button class="btn btn-outline" style="width:auto;" id="so_PrintBtn">🖨️ ${t('A4 প্রিন্ট', 'A4 Print')}</button>

    </div>

    <div class="panel"><div id="stockOverviewWrap"><div class="empty-state">${t('লোড হচ্ছে...', 'Loading...')}</div></div>
      <div class="so-legend">${t('মূল একক = যে এককে আইটেম কেনা-বেচা হয়; মূল্য সেই এককের দরে, পরিমাণ মোটা করে দেখানো। দরঃ সর্বশেষ পোস্ট করা প্রসেসিং বা ক্রয় থেকে (না থাকলে স্ট্যান্ডার্ড কস্ট) — এককের ঘরে মাউস রাখলে উৎস দেখায়। লাল = মাইনাস ব্যালান্স।', 'Main unit = the unit it is traded in; value uses that unit’s rate (bold). Rates come from the latest posted processing or purchase (else standard cost). Red = negative balance.')}</div></div>`;
  const D = await stockOverviewData();
  window.__stockOverviewLedger = D.ledger;
  window.__stockOverviewData = D;
  const warn = [];
  if (D.drafts.pi) warn.push(D.drafts.pi + t('টা ক্রয় চালান', ' purchase invoice(s)'));
  if (D.drafts.pv) warn.push(D.drafts.pv + t('টা প্রসেসিং ভাউচার', ' processing voucher(s)'));
  document.getElementById('so_Warn').innerHTML = warn.length ? `<div class="so-warn">⚠️ ${warn.join(t(' আর ', ' and '))} ${t('এখনো পোস্ট হয়নি — এগুলোর স্টক এখানে যোগ হয়নি। মাইনাস দেখালে আগে এগুলো পোস্ট করুন।', 'not posted yet — their stock is not counted here. Post them first if you see negatives.')}</div>` : '';
  function renderReport(fromDate, toDate) {
    const wrap = document.getElementById('stockOverviewWrap'); if (!wrap) return;
    const rows = stockOverviewRows(D, fromDate, toDate);
    wrap.innerHTML = rows.length ? stockOverviewTableHtml(rows, fromDate, toDate, false) : `<div class="empty-state">${t('এই সময়ে কোনো স্টক মুভমেন্ট নেই।', 'No stock movement in this period.')}</div>`;

    fitHead(); requestAnimationFrame(fitHead);
    if (!window.__soFitWired) { window.__soFitWired = true; window.addEventListener('resize', function () { const w2 = document.getElementById('stockOverviewWrap'); if (w2) { const h1 = w2.querySelector('.so-tbl thead tr.h1'); if (h1) { const hh = Math.round(h1.getBoundingClientRect().height); w2.querySelectorAll('.so-tbl thead tr.h2 th').forEach(function (th) { th.style.top = hh + 'px'; }); } } }); }

  renderReport(monthStart, today);
  window.__stockOverviewRerender = function () { const Dn = window.__stockOverviewData; if (Dn) { D.ledger = Dn.ledger; D.rates = Dn.rates; D.drafts = Dn.drafts; } if (document.getElementById('stockOverviewWrap')) renderReport(dmyIso('so_DateFrom') || monthStart, dmyIso('so_DateTo') || today); };
  wireDmyFields(content);
  ['so_DateFrom', 'so_DateTo'].forEach(function (id) {   // Enter = পরের ঘর / প্রয়োগ, Escape = আগের ঘর
    document.getElementById(id).addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); if (id === 'so_DateFrom') document.getElementById('so_DateTo').focus(); else document.getElementById('so_ApplyBtn').click(); }
      else if (e.key === 'Escape' && id === 'so_DateTo') { e.preventDefault(); document.getElementById('so_DateFrom').focus(); }
    });
  });
  document.getElementById('so_ApplyBtn').addEventListener('click', function () {
    if ((document.getElementById('so_DateFrom').value && !dmyIso('so_DateFrom')) || (document.getElementById('so_DateTo').value && !dmyIso('so_DateTo'))) { showToast(t('তারিখ দিন-মাস-বছর আকারে দিন, যেমন 01-10-2026', 'Enter dates as dd-mm-yyyy, e.g. 01-10-2026'), 'error'); return; } renderReport(dmyIso('so_DateFrom') || monthStart, dmyIso('so_DateTo') || today); });
  document.getElementById('so_PrintBtn').addEventListener('click', function () { openStockReportPrintView(dmyIso('so_DateFrom') || monthStart, dmyIso('so_DateTo') || today); });
}

/* ============================================================
   স্টক ওভারভিউ → "ভিউ" কার্ড: এই আইটেমের ভাউচারগুলো, প্রতিটায় 👁️ দেখুন · ✏️ এডিট · 🗑️ ডিলিট · 💾 পোস্ট
   • উপরেঃ পোস্ট হওয়া (স্টকে আছে) — এডিট/ডিলিট এডমিন পাসওয়ার্ডে; এডিট মানে আগে আনপোস্ট (স্টক, পার্টি লেজার ও
     ক্যাশ/ব্যাংকের এন্ট্রি ফেরত, ভাউচার খসড়া), তারপর ভাউচার খোলে — ঠিক করে আবার 💾 পোস্ট
   • নিচেঃ পোস্ট না হওয়া (খসড়া) ভাউচার যেগুলোতে এই আইটেম আছে — 💾 পোস্ট করলেই স্টকে
   ============================================================ */
const STOCK_CARD_TYPES = {
  PurchaseInvoice: { bn: 'ক্রয় চালান', table: 'PurchaseInvoice', idf: 'PIID', kind: 'purchase' },
  PurchaseReturn: { bn: 'ক্রয় ফেরত', table: 'PurchaseReturn', idf: 'PRetID', kind: 'purchase' },
  SalesInvoice: { bn: 'বিক্রয় চালান', table: 'SalesInvoice', idf: 'SIID', kind: 'sales' },
  SalesReturn: { bn: 'বিক্রয় ফেরত', table: 'SalesReturn', idf: 'SRID', kind: 'sales' },
  ProcessingVoucher: { bn: 'প্রসেসিং কষ্টিং', table: 'ProcessingVoucher', idf: 'ProcessingID', kind: 'processing' },
  MaterialIssue: { bn: 'মালামাল ইস্যু', table: 'MaterialIssue', idf: 'MIID', kind: 'doc', page: 'materialIssue' },
  StockTransfer: { bn: 'স্টক ট্রান্সফার', table: 'StockTransfer', idf: 'TransferID', kind: 'doc', page: 'stockTransfer' },
  StockAdjustment: { bn: 'স্টক সমন্বয়', table: 'StockAdjustment', idf: 'AdjID', kind: 'doc', page: 'stockAdjust' }
};
function stockCardDocType(l) { const m = String(l.RefModule || l.TransactionType || '').replace(/-(RM|FG|ByProduct|In|Out)$/, ''); return STOCK_CARD_TYPES[m] ? m : ''; }

/** পোস্ট করা ভাউচার আনপোস্ট (এডমিন + পাসওয়ার্ড): স্টক, পার্টি লেজার ও ক্যাশ/ব্যাংকের এন্ট্রি ফেরত, ভাউচার খসড়া */
async function unpostVoucherWithAdminAuth(docType, docId) {
  const cfg = STOCK_CARD_TYPES[docType]; if (!cfg) return false;
  if (!currentUser || currentUser.RoleID !== 'ROLE-ADMIN') { showToast(t('শুধু এডমিনই পোস্ট করা ভাউচার এডিট করতে পারবেন।', 'Only an Admin can edit a posted voucher.'), 'error'); return false; }
  const password = prompt(t('পোস্ট করা ভাউচার এডিট করতে এডমিন পাসওয়ার্ড দিন:', 'Enter your admin password to edit a posted voucher:'));
  if (!password) return false;
  const { error: pe } = await supabaseClient.auth.signInWithPassword({ email: currentUser.Email, password: password });
  if (pe) { showToast(t('পাসওয়ার্ড ভুল — এডিট বাতিল।', 'Incorrect password — edit cancelled.'), 'error'); return false; }
  if (!confirm(t('ভাউচার ', 'Voucher ') + docId + t(' আনপোস্ট হবে — এর স্টক, পার্টি লেজার ও ক্যাশ/ব্যাংকের এন্ট্রি ফেরত যাবে, ভাউচার খসড়া হবে। ঠিক করে আবার 💾 পোস্ট করতে হবে। চালিয়ে যাবেন?', ' will be unposted — its stock, party ledger and cash/bank entries are reversed and it becomes a draft. Post it again after fixing. Continue?'))) return false;
  try {
    await reversePostedDocumentStock(docType, docId);
    const { error } = await supabaseClient.from(cfg.table).update({ Status: 'Draft' }).eq(cfg.idf, docId);
    if (error) throw new Error(error.message);
    listCache = {};
    showToast(t('আনপোস্ট হয়েছে — এখন এডিট করে আবার পোস্ট করুন', 'Unposted — edit it and post again'), 'success');
    return true;
  } catch (err) { showToast(err.message, 'error'); return false; }
}

async function stockCardProcessingData(id) {   // সেভ করা প্রসেসিং ভাউচার → প্রিন্টের তথ্য
  const [hr, br, fr] = await Promise.all([
    supabaseClient.from('ProcessingVoucher').select('*').eq('ProcessingID', id).maybeSingle(),
    supabaseClient.from('ProcessingByProduct_Lines').select('*').eq('ProcessingID', id),
    supabaseClient.from('ProcessingFG_Lines').select('*').eq('ProcessingID', id)]);
  if (hr.error || !hr.data) throw new Error(t('ভাউচার পাওয়া যায়নি।', 'Voucher not found.'));
  const h0 = hr.data, n = function (x) { return Number(x) || 0; }, header = {};
  ['RawMaterialQty', 'RawMaterialRate', 'RawMaterialValue', 'ProcessingRate', 'ProcessingValue', 'TotalValue', 'ByProductQty', 'ByProductValue', 'NetWeight', 'NetValue', 'Pieces', 'RatePerKg', 'RatePerPiece', 'SaleRatePerKg', 'SaleRatePerPiece', 'Profit'].forEach(function (k) { header[k] = n(h0[k]); });
  ['Date', 'RawMaterialItemID', 'WarehouseID', 'FinishedGoodsItemID', 'DateFrom', 'DateTo'].forEach(function (k) { header[k] = h0[k] || ''; });
  const [items, whs] = await Promise.all([cachedList('Items'), cachedList('Warehouses')]);
  window.__procItemMap = {}; items.forEach(function (i) { window.__procItemMap[i.ItemID] = i; });
  window.__procWhMap = {}; whs.forEach(function (w) { window.__procWhMap[w.WarehouseID] = w.WarehouseName; });
  const lines = ((br && br.data) || []).map(function (l) { return { ByProductName: l.ByProductName || '', ItemID: l.ItemID || '', Quantity: n(l.Quantity), Rate: n(l.Rate), Value: n(l.Value) || n(l.Quantity) * n(l.Rate) }; });
  let fgLines = ((fr && !fr.error && fr.data) || []).map(function (l) { return { itemId: l.ItemID, kg: n(l.QtyKg), pcs: n(l.QtyPcs), rateKg: n(l.RatePerKg), ratePc: n(l.RatePerPc), value: n(l.Value) }; });
  if (!fgLines.length && h0.FinishedGoodsItemID) fgLines = [{ itemId: h0.FinishedGoodsItemID, kg: n(h0.NetWeight), pcs: n(h0.Pieces), rateKg: n(h0.RatePerKg), ratePc: n(h0.RatePerPiece), value: n(h0.NetValue) }];
  return { header: header, lines: lines, fgLines: fgLines };
}

/** এই আইটেম+গুদামের খসড়া (পোস্ট না হওয়া) ভাউচার — ক্রয়, বিক্রয়, প্রসেসিং */
async function stockCardDrafts(itemId, warehouseId, piece) {
  const safe = async function (q) { try { const r = await q; return (r && !r.error && r.data) || []; } catch (e) { return []; } };
  const uniq = function (a) { return Array.from(new Set(a)); }, n = function (x) { return Number(x) || 0; };
  const out = [];
  const qtyTxt = function (q) { return q ? String(+q.toFixed(3)) + ' ' + (piece ? t('পিস', 'pcs') : t('কেজি', 'kg')) : '—'; };
  for (const def of [['PurchaseInvoice', 'PI_Lines', 'PIID', 'InvoiceDate', 'in'], ['SalesInvoice', 'SI_Lines', 'SIID', 'InvoiceDate', 'out']]) {
    const ls = await safe(supabaseClient.from(def[1]).select('*').eq('ItemID', itemId));
    if (!ls.length) continue;
    const hs = await safe(supabaseClient.from(def[0]).select('*').in(def[2], uniq(ls.map(function (l) { return l[def[2]]; }))));
    hs.filter(function (h) { return h.Status === 'Draft' && (!h.WarehouseID || h.WarehouseID === warehouseId); }).forEach(function (h) {
      const q = ls.filter(function (l) { return l[def[2]] === h[def[2]]; }).reduce(function (s, l) { return s + n(l.Quantity); }, 0);
      out.push({ docType: def[0], id: h[def[2]], date: h[def[3]], dir: def[4], txt: qtyTxt(q) });
    });
  }
  const pvs = (await safe(supabaseClient.from('ProcessingVoucher').select('*').eq('Status', 'Draft'))).filter(function (h) { return !h.WarehouseID || h.WarehouseID === warehouseId; });
  if (pvs.length) {
    const ids = pvs.map(function (h) { return h.ProcessingID; });
    const items = await cachedList('Items'), me = items.find(function (i) { return i.ItemID === itemId; }) || {};
    const [fg, bp] = await Promise.all([safe(supabaseClient.from('ProcessingFG_Lines').select('*').in('ProcessingID', ids)), safe(supabaseClient.from('ProcessingByProduct_Lines').select('*').in('ProcessingID', ids))]);
    pvs.forEach(function (h) {
      if (h.RawMaterialItemID === itemId) out.push({ docType: 'ProcessingVoucher', id: h.ProcessingID, date: h.Date, dir: 'out', txt: qtyTxt(n(h.RawMaterialQty)) + t(' (কাঁচামাল)', ' (raw)') });
      fg.filter(function (l) { return l.ProcessingID === h.ProcessingID && l.ItemID === itemId; }).forEach(function (l) { out.push({ docType: 'ProcessingVoucher', id: h.ProcessingID, date: h.Date, dir: 'in', txt: (n(l.QtyKg) ? +n(l.QtyKg).toFixed(3) + ' ' + t('কেজি', 'kg') : '') + (n(l.QtyKg) && n(l.QtyPcs) ? ' / ' : '') + (n(l.QtyPcs) ? n(l.QtyPcs) + ' ' + t('পিস', 'pcs') : '') }); });
      bp.filter(function (l) { return l.ProcessingID === h.ProcessingID && (l.ItemID === itemId || (!l.ItemID && String(l.ByProductName || '').trim() === String(me.ItemName || '').trim())); }).forEach(function (l) { out.push({ docType: 'ProcessingVoucher', id: h.ProcessingID, date: h.Date, dir: 'in', txt: qtyTxt(n(l.Quantity)) + t(' (বাই-প্রোডাক্ট)', ' (by-product)') }); });
    });
  }
  return out.sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
}

async function stockCardAction(act, docType, id, posted, ctx) {
  const cfg = STOCK_CARD_TYPES[docType]; if (!cfg) return;
  const after = async function () { await refreshStockCard(ctx); };
  try {
    if (act === 'view') {
      if (cfg.kind === 'processing') { await openProcessingPrintView(id, false, await stockCardProcessingData(id)); return; }
      if (cfg.kind === 'purchase' || cfg.kind === 'sales') { await openPrintableVoucherView(docType, id); return; }
      await navigateTo(cfg.page, t('ইনভেন্টরি', 'Inventory'), t(cfg.bn, docType)); return;
    }
    if (act === 'post') {
      if (cfg.kind === 'purchase') await postPurchaseVoucherRecord(docType, id);
      else if (cfg.kind === 'sales') await postSalesVoucherRecord(docType, id);
      else if (cfg.kind === 'processing') { window.__refreshProcessingList = after; await postProcessingRecord(id); return; }
      else await postDocumentRecord(docType, id);
      await after(); return;
    }
    if (act === 'edit') {
      if (posted && !(await unpostVoucherWithAdminAuth(docType, id))) return;
      if (posted) await after();
      if (cfg.kind === 'purchase') await openPurchaseVoucherForm(docType, id);
      else if (cfg.kind === 'sales') await openSalesVoucherForm(docType, id);
      else if (cfg.kind === 'processing') { closeModal(); window.__pcEditId = id; await navigateTo('processing', t('প্রোডাকশন', 'Production'), t('প্রসেসিং কষ্টিং', 'Processing Costing')); }
      else { closeModal(); await navigateTo(cfg.page, t('ইনভেন্টরি', 'Inventory'), t(cfg.bn, docType)); }
      return;
    }
    if (act === 'del') {
      if (cfg.kind === 'purchase') { if (posted) await deletePostedPurchaseVoucher(docType, id); else await deletePurchaseVoucherRecord(docType, id); }
      else if (cfg.kind === 'sales') { if (posted) await deletePostedSalesVoucher(docType, id); else await deleteSalesVoucherRecord(docType, id); }
      else if (cfg.kind === 'processing') {
        const unlink = async function () { try { await supabaseClient.from('DailyProduction').update({ ProcessingID: null }).eq('ProcessingID', id); } catch (e) {} };
        if (posted) { await deletePostedVoucherWithAdminAuth('ProcessingVoucher', id, 'ProcessingVoucher', 'ProcessingID', 'ProcessingByProduct_Lines', 'ProcessingID', unlink); }
        else {
          if (!confirm(t('খসড়া প্রসেসিং ভাউচার ', 'Delete draft processing voucher ') + id + t(' ডিলিট করবেন?', '?'))) return;
          try { await supabaseClient.from('ProcessingFG_Lines').delete().eq('ProcessingID', id); } catch (e) {}
          await supabaseClient.from('ProcessingByProduct_Lines').delete().eq('ProcessingID', id);
          const { error } = await supabaseClient.from('ProcessingVoucher').delete().eq('ProcessingID', id); if (error) throw new Error(error.message);
          await unlink(); showToast(t('ডিলিট হয়েছে ✅', 'Deleted ✅'), 'success');
        }
      } else {
        const dc = Object.values(DOC_CONFIGS || {}).find(function (c) { return c.headerSheet === cfg.table; });
        if (!dc) { showToast(t('এই ভাউচার তার নিজের পেজ থেকে ডিলিট করুন।', 'Delete this voucher from its own page.'), 'error'); return; }
        if (posted) await deletePostedVoucherWithAdminAuth(docType, id, cfg.table, cfg.idf, dc.linesSheet, dc.lineIdField, null);
        else { if (!confirm(t('খসড়া ভাউচার ডিলিট করবেন?', 'Delete this draft voucher?'))) return; await supabaseClient.from(dc.linesSheet).delete().eq(dc.lineIdField, id); await supabaseClient.from(cfg.table).delete().eq(cfg.idf, id); }
      }
      await after(); return;
    }
  } catch (err) { showToast(err.message, 'error'); }
}

async function refreshStockCard(ctx) {   // স্টক ওভারভিউ ও কার্ড দুটোই নতুন করে
  listCache = {};
  const D = await stockOverviewData();
  window.__stockOverviewData = D; window.__stockOverviewLedger = D.ledger;

const VOUCHER_REGISTRY = {

  CollectionVoucher: { bn: 'কালেকশন (পুরনো)', table: 'CollectionVoucher', idf: ['CollectionID', 'ColID', 'CollID', 'VoucherID', 'ID'], lines: [], kind: 'legacy' }

async function voucherDelete(base, id) {
  const R = VOUCHER_REGISTRY[base] || { bn: base, table: null, idf: [], lines: [], kind: 'unknown' };
  const h = R.table ? await voucherFetchHeader(base, id) : null;
  const posted = !h || h.Status === 'Posted';
  if (posted) { if (!(await voucherAskAdmin(t('পোস্ট করা/ভুল ভাউচার মুছতে এডমিন পাসওয়ার্ড দিন:', 'Admin password to delete a posted/broken voucher:')))) return false; }
  const what = (R.bn || base) + ' ' + id + (h ? '' : t(' (ভাউচারটা আর নেই — শুধু লেজারের এন্ট্রি আছে)', ' (voucher missing — only ledger entries remain)'));
  if (!confirm(t('মুছবেনঃ ', 'Delete: ') + what + t('?\nএর স্টক, পার্টি লেজার ও ক্যাশ/ব্যাংকের এন্ট্রিও মুছবে। ফেরানো যাবে না।', '?\nIts stock, party and cash/bank entries are removed too. Cannot be undone.'))) return false;

    await step(R.table, async function () {
      let done = false;
      for (const f of [].concat(R.idf)) { if (h[f] === id) { const { error } = await supabaseClient.from(R.table).delete().eq(f, id); if (error) throw new Error(error.message); done = true; break; } }

    });

    // জোর করে — এরর হলেও লেজারের এন্ট্রি সরাসরি মুছে ব্যালান্স ঠিক (যাতে ভুল ভাউচার লেজারে থেকে না যায়)

    try { await adjustCurrentStock(e.ItemID, e.WarehouseID, (Number(e.QtyOut) || 0) - (Number(e.QtyIn) || 0), (Number(e.PiecesOut) || 0) - (Number(e.PiecesIn) || 0)); } catch (x) {}
    try { await supabaseClient.from('stock_ledger').delete().eq('id', e.id); } catch (x) {}
  }
  const pl = await safe(supabaseClient.from('PartyLedger').select('*').eq('RefID', id)), parties = {};

  const bk = await safe(supabaseClient.from('BankCashBook').select('*').eq('RefID', id)), accs = {};
  for (const e of bk.filter(function (e) { return voucherBaseType(e.RefModule) === base; })) { accs[e.BankCashAccID] = true; try { await supabaseClient.from('BankCashBook').delete().eq('id', e.id); } catch (x) {} }
  for (const k of Object.keys(parties)) { try { await rebalancePartyLedger(parties[k].PartyType, parties[k].PartyID); } catch (x) {} }

  document.addEventListener('click', function (e) { if (!e.target.closest || !e.target.closest('.pl-pick')) hidePick(); });

  function findPartyByTypedValue(typedValue) {
    const opt = Array.from(datalist.options).find(function (o) { return o.value === typedValue; });
    return opt ? opt.getAttribute('data-key') : null;
  }

  // প্রতিটা RefModule-এর জন্য "বিবরণী" ও "ভাউচার ধরন" — ইন-অ্যাপ টেবিল ও A4 প্রিন্ট দুই জায়গাতেই ব্যবহার হয়
  function refModuleInfo(refModule) {
    const map = {
      PurchaseInvoice: { desc:['ক্রয় ভাউচার পোস্টিং','Purchase voucher posting'], type:['ক্রয়','Purchase'] },
      'PurchaseInvoice-Payment': { desc:['ক্রয় ভাউচারে প্রদান','Payment against purchase voucher'], type:['পেমেন্ট','Payment'] },
      PurchaseReturn: { desc:['ক্রয় ফেরত ভাউচার পোস্টিং','Purchase return posting'], type:['ক্রয় ফেরত','Purchase Return'] },
      SalesInvoice: { desc:['বিক্রয় ভাউচার পোস্টিং','Sales voucher posting'], type:['বিক্রয়','Sales'] },
      'SalesInvoice-Receipt': { desc:['বিক্রয় ভাউচারে গ্রহণ','Receipt against sales voucher'], type:['রিসিট','Receipt'] },
      SalesReturn: { desc:['বিক্রয় ফেরত ভাউচার পোস্টিং','Sales return posting'], type:['বিক্রয় ফেরত','Sales Return'] },
      ContraVoucher: { desc:['কন্ট্রা ভাউচার','Contra voucher'], type:['কন্ট্রা','Contra'] },
      PaymentVoucher: { desc:['পেমেন্ট ভাউচার','Payment voucher'], type:['পেমেন্ট','Payment'] },
      ReceiptVoucher: { desc:['রিসিট ভাউচার','Receipt voucher'], type:['রিসিট','Receipt'] },
      CollectionVoucher: { desc:['কালেকশন ভাউচার (পুরনো)','Collection voucher (old)'], type:['কালেকশন','Collection'] },
      'PaymentVoucher-Reversal': { desc:['পেমেন্ট ভাউচার বাতিল','Payment voucher reversal'], type:['বাতিল','Reversal'] },
      SalaryIssue: { desc:['সেলারী ইস্যু (বেতন পরিশোধ)','Salary issue'], type:['বেতন','Salary'] },
      'SalaryIssue-Reversal': { desc:['সেলারী ইস্যু বাতিল','Salary issue reversal'], type:['বেতন ফেরত','Salary reversal'] }
    };
    if (map[refModule]) return map[refModule];
    if (/-Reversal$/.test(String(refModule || ''))) { const b = map[voucherBaseType(refModule)]; return { desc: [(b ? b.desc[0] : refModule) + ' — বাতিল', (b ? b.desc[1] : refModule) + ' — reversal'], type: ['বাতিল', 'Reversal'] }; }
    return { desc:[refModule, refModule], type:[refModule, refModule] };
  }

  let lastRows = [], lastParty = null, lastPartyName = '';

  async function loadLedgerForKey(key) {
    const wrap = document.getElementById('plWrap');
    if (!wrap) return;
    currentPartyKey = key;
    printBtn.style.display = key ? '' : 'none';
    if (!key) { wrap.innerHTML = `<div class="empty-state">${t('উপরে একটা পার্টি বাছাই করুন।','Select a party above.')}</div>`; return; }
    const party = combined[key];
    lastParty = party; lastPartyName = party.name;
    wrap.innerHTML = `<div class="empty-state">${t('লোড হচ্ছে...','Loading...')}</div>`;

    // শুধু এই পার্টির সারি — ডেটাবেসেই ছেঁকে আনা হয় (পুরো লেজার একবারে আনলে ১০০০ সারির পরের এন্ট্রি বাদ পড়ত)
    const custIds = party.customerIds && party.customerIds.length ? party.customerIds : (party.customerId ? [party.customerId] : []);
    const suppIds = party.supplierIds && party.supplierIds.length ? party.supplierIds : (party.supplierId ? [party.supplierId] : []);
    const fetchRows = async function (type, ids) {
      if (!ids.length) return [];
      const { data, error } = await supabaseClient.from('PartyLedger').select('*').eq('PartyType', type).in('PartyID', ids).order('id', { ascending: true });
      if (error) throw new Error(error.message);
      return data || [];
    };
    let rows;
    try { rows = (await fetchRows('Customer', custIds)).concat(await fetchRows('Supplier', suppIds)); }
    catch (err) { wrap.innerHTML = `<div class="empty-state">${escapeHtml(err.message)}</div>`; return; }
    rows.sort(function (a, b) { return String(a.Date || '').localeCompare(String(b.Date || '')) || (Number(a.id) || 0) - (Number(b.id) || 0); });
    lastRows = rows;

    if (rows.length === 0) {   // কেন খালি — পোস্ট না হওয়া (খসড়া) ভাউচার আছে কিনা দেখানো
      const safe = async function (q) { try { const r = await q; return (r && !r.error && r.data) || []; } catch (e) { return []; } };
      const lists = await Promise.all([
        custIds.length ? safe(supabaseClient.from('SalesInvoice').select('SIID,InvoiceDate,Status').in('CustomerID', custIds)) : [],
        custIds.length ? safe(supabaseClient.from('SalesReturn').select('SRID,Date,Status').in('CustomerID', custIds)) : [],
        suppIds.length ? safe(supabaseClient.from('PurchaseInvoice').select('PIID,InvoiceDate,Status').in('SupplierID', suppIds)) : [],
        suppIds.length ? safe(supabaseClient.from('PurchaseReturn').select('PRetID,Date,Status').in('SupplierID', suppIds)) : []]);
      const all = [].concat(lists[0].map(function (h) { return { no: h.SIID, base: 'SalesInvoice', kind: t('বিক্রয়', 'Sale'), st: h.Status }; }), lists[1].map(function (h) { return { no: h.SRID, base: 'SalesReturn', kind: t('বিক্রয় ফেরত', 'Sales return'), st: h.Status }; }),
        lists[2].map(function (h) { return { no: h.PIID, base: 'PurchaseInvoice', kind: t('ক্রয়', 'Purchase'), st: h.Status }; }), lists[3].map(function (h) { return { no: h.PRetID, base: 'PurchaseReturn', kind: t('ক্রয় ফেরত', 'Purchase return'), st: h.Status }; }))
        .filter(function (x) { return x.st !== 'Deleted'; });
      const drafts = all.filter(function (x) { return x.st !== 'Posted'; }), posted = all.filter(function (x) { return x.st === 'Posted'; });
      const listTxt = function (arr) {
        return arr.slice(0, 20).map(function (x) {
          const ic = function (act, icon, title) { return `<button type="button" class="pl-ic" data-pl="${act}" data-base="${attr(x.base)}" data-id="${attr(x.no)}" title="${attr(title)}">${icon}</button>`; };
          return `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;"><span><b>${escapeHtml(x.no)}</b> (${escapeHtml(x.kind)})</span><span style="white-space:nowrap;">${ic('view', '👁️', t('দেখুন', 'View'))}${ic('edit', '✏️', t('এডিট', 'Edit'))}${ic('del', '🗑️', t('ডিলিট', 'Delete'))}${x.st !== 'Posted' ? ic('post', '💾', t('পোস্ট করুন — লেজারে যাবে', 'Post — goes to the ledger')) : ''}</span></div>`;
        }).join('') + (arr.length > 20 ? ' …' : '');
      };
      let why = '';
      if (drafts.length) why += `<div style="margin-top:10px;padding:10px 12px;border:1px solid #f0b46a;background:#fff3e0;color:#7a4300;border-radius:8px;text-align:left;">⚠️ ${t('এই পার্টির ', 'This party has ')}<b>${drafts.length}</b>${t('টা ভাউচার এখনো পোস্ট হয়নি (খসড়া) — খসড়া ভাউচার লেজারে আসে না। ভাউচারের তালিকা থেকে 💾 পোস্ট করলেই এখানে দেখাবে।', ' unposted (draft) voucher(s) — drafts do not reach the ledger. Post them (💾) and they will show here.')}<div style="margin-top:6px;font-size:12px;">${listTxt(drafts)}</div></div>`;
      if (posted.length) why += `<div style="margin-top:10px;padding:10px 12px;border:1px solid #e8a29b;background:#fdf0ef;color:#8a1f12;border-radius:8px;text-align:left;">❗ ${t('এই পার্টির ', 'This party has ')}<b>${posted.length}</b>${t('টা পোস্ট করা ভাউচার আছে, অথচ লেজারে এন্ট্রি নেই — নগদ গ্রাহক/সাপ্লায়ারে পোস্ট হয়েছিল, অথবা এন্ট্রি মুছে গেছে। ভাউচারটা আনপোস্ট করে আবার পোস্ট করলে ঠিক হবে।', ' posted voucher(s) but no ledger entries — posted as a cash party, or entries were removed. Unpost and post again to fix.')}<div style="margin-top:6px;font-size:12px;">${listTxt(posted)}</div></div>`;
      if (!all.length) why = `<div style="margin-top:6px;font-size:12px;color:var(--text-muted);">${t('এই পার্টির নামে এখনো কোনো ক্রয়/বিক্রয় ভাউচার নেই।', 'No purchase/sales vouchers for this party yet.')}</div>`;
      wrap.innerHTML = `<div class="empty-state">${t('কোনো এন্ট্রি পাওয়া যায়নি।','No entries found.')}${why}</div>`;
      return;
    }

    // দুই দিকের (ক্রয় + বিক্রয়) এন্ট্রি একসাথে মিলিয়ে, তারিখ অনুযায়ী সাজিয়ে,
    // নতুন করে একটামাত্র চলমান ব্যালেন্স হিসাব করা হচ্ছে — টেবিলে যেটা আলাদা
    // আলাদা করে জমা ছিল সেটার উপর ভরসা না করে, যাতে দুই পাশ মিলে সত্যিকারের একটা হিসাব পাওয়া যায়
    let runningBalance = 0, totalDebit = 0, totalCredit = 0;
    // "PurchaseInvoice-Payment" জাতীয় সাফিক্স-লাগানো রেফারেন্সের আসল ভাউচার এখনো
    // মূল ডকুমেন্টেই (RefID একই) থাকে — তাই "ভিউ" বাটনের জন্য সাফিক্স বাদ দিয়ে মূল ধরন বের করা হচ্ছে
    const viewableTypes = { PurchaseInvoice:1, PurchaseReturn:1, SalesInvoice:1, SalesReturn:1 };
    const headers = [['তারিখ','Date'],['ধরন','Type'],['রেফারেন্স','Reference'],['Debit','Debit'],['Credit','Credit'],['ব্যালেন্স','Balance'],['','']];
    const headCells = headers.map(function (h) { return `<th>${t(h[0], h[1])}</th>`; }).join('');
    const bodyRows = rows.map(function (r) {
      const debit = Number(r.Debit || 0), credit = Number(r.Credit || 0);
      runningBalance += debit - credit;
      totalDebit += debit; totalCredit += credit;
      const info = refModuleInfo(r.RefModule), baseType = voucherBaseType(r.RefModule);
      const typeLabel = t(info.type[0], info.type[1]);
      const known = !!VOUCHER_REGISTRY[baseType] && VOUCHER_REGISTRY[baseType].kind !== 'legacy';
      const ic = function (act, icon, title, dis) { return `<button type="button" class="pl-ic" data-pl="${act}" data-base="${attr(baseType)}" data-id="${attr(r.RefID)}" title="${attr(title)}" ${dis ? 'disabled' : ''}>${icon}</button>`; };
      const icons = ic('view', '👁️', t('দেখুন', 'View'), !known) + ic('edit', '✏️', t('এডিট (এডমিন — আগে আনপোস্ট হবে)', 'Edit (admin — unposts first)'), !known) +
        ic('del', '🗑️', t('ডিলিট — এরর হলেও জোর করে মোছা যায় (এডমিন)', 'Delete — can force-delete broken vouchers (admin)'), false) + ic('post', '✅', t('পোস্ট হয়ে গেছে', 'Posted'), true);
      return `<tr><td>${escapeHtml(formatShortDate(r.Date))}</td><td>${escapeHtml(typeLabel)}</td><td style="text-align:left;">${escapeHtml(t(info.desc[0], info.desc[1]))} — <b>${escapeHtml(r.RefID)}</b></td>
        <td>${debit.toFixed(2)}</td><td>${credit.toFixed(2)}</td><td><b>${formatAmountDrCr(runningBalance, true)}</b></td><td style="white-space:nowrap;">${icons}</td></tr>`;
    }).join('');
    wrap.innerHTML = `
      <div style="display:flex;gap:24px;flex-wrap:wrap;margin-bottom:14px;padding:12px 14px;background:var(--bg);border-radius:8px;font-size:13px;">
        <div><span style="color:var(--text-muted);">${t('মোট Debit','Total Debit')}:</span> <b>${totalDebit.toFixed(2)}</b></div>
        <div><span style="color:var(--text-muted);">${t('মোট Credit','Total Credit')}:</span> <b>${totalCredit.toFixed(2)}</b></div>
        <div><span style="color:var(--text-muted);">${t('সর্বশেষ ব্যালেন্স','Closing Balance')}:</span> <b>${formatAmountDrCr(runningBalance, true)}</b></div>
      </div>
      <table class="data-table"><thead><tr>${headCells}</tr></thead><tbody>${bodyRows}</tbody></table>`;
  }

  document.getElementById('plWrap').addEventListener('click', async function (ev) {
    const b = ev.target.closest('[data-pl]'); if (!b || b.disabled || b.__busy) return;
    b.__busy = true; b.disabled = true;
    const act = b.getAttribute('data-pl'), base = b.getAttribute('data-base'), id = b.getAttribute('data-id');
    try {
      if (act === 'view') await voucherView(base, id);
      else if (act === 'edit') await voucherEdit(base, id);
      else if (act === 'post') { await voucherPost(base, id); await loadLedgerForKey(currentPartyKey); }
      else if (act === 'del') { if (await voucherDelete(base, id)) await loadLedgerForKey(currentPartyKey); }
    } catch (err) { showToast(err.message, 'error'); }
    finally { b.__busy = false; if (document.body.contains(b)) b.disabled = false; }
  });

  searchInput.addEventListener('change', function () {
    const v = searchInput.value.trim(); if (!v) return;
    const hit = parties.find(function (p) { return partyLabel(p) === v; });
    if (hit) loadLedgerForKey(hit.key);   // একই পার্টি আবার বাছলেও নতুন করে (মোছা/যোগের পর হালনাগাদ)
  });

  printBtn.addEventListener('click', function () {
    if (!lastRows.length) { showToast(t('কোনো এন্ট্রি নেই।','No entries.'), 'error'); return; }
    openPartyLedgerPrintView(lastPartyName, lastRows, refModuleInfo);
  });
}

/** পার্টি লেজারের A4 প্রিন্ট-প্রিভিউ — তারিখ | বিবরণী | ভাউচার ধরন | ভাউচার নং |
 *  ডেবিট | ক্রেডিট | ব্যালান্স | ব্যবহারকারী কলামসহ, নতুন ট্যাবে খোলে */
function openPartyLedgerPrintView(partyName, rows, refModuleInfo) {
  const lang = currentLang || 'bn';
  const L = function (bn, en) { return lang === 'bn' ? bn : en; };
  let runningBalance = 0;
  const bodyRows = rows.map(function (r) {
    const debit = Number(r.Debit || 0), credit = Number(r.Credit || 0);
    runningBalance += debit - credit;
    const info = refModuleInfo(r.RefModule);
    return `<tr>
      <td>${escapeHtml(formatShortDate(r.Date))}</td>
      <td>${escapeHtml(L(info.desc[0], info.desc[1]))}</td>
      <td>${escapeHtml(L(info.type[0], info.type[1]))}</td>
      <td>${escapeHtml(r.RefID)}</td>
      <td>${debit ? debit.toFixed(2) : ''}</td>
      <td>${credit ? credit.toFixed(2) : ''}</td>
      <td><b>${formatAmountDrCr(runningBalance, true)}</b></td>
      <td>${escapeHtml(r.CreatedBy || '—')}</td>
    </tr>`;
  }).join('');
  const totalDebit = rows.reduce(function (s, r) { return s + (Number(r.Debit) || 0); }, 0);
  const totalCredit = rows.reduce(function (s, r) { return s + (Number(r.Credit) || 0); }, 0);

  const html = `<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${L('পার্টি লেজার','Party Ledger')} — ${escapeHtml(partyName)}</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Anek Bangla',sans-serif;color:#1b1f27;max-width:1000px;margin:20px auto;padding:0 20px;width:100%;box-sizing:border-box;}
  html,body{max-width:100%;overflow-x:hidden;}
  h1{font-family:'Oswald',sans-serif;font-size:19px;margin:0 0 4px;text-align:center;}
  .sub{text-align:center;color:#888;font-size:12px;margin-bottom:16px;}
  table{width:100%;border-collapse:collapse;margin:8px 0;}
  th,td{border:1px solid #ccc;padding:6px 8px;font-size:11.5px;text-align:center;}
  th{background:#1a2029;color:#f2a33c;}
  tfoot td{font-weight:700;border-top:2px solid #1a2029;}
  .toolbar{display:flex;gap:10px;margin-bottom:20px;align-items:center;flex-wrap:wrap;}
  .toolbar button{font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:8px;border:1px solid #d1d5db;background:#f5f6f8;cursor:pointer;}
  .toolbar button.primary{background:#1a2029;color:#f2a33c;border-color:#1a2029;}
  @page { size: A4; margin: 12mm; }
  @media print { .toolbar{display:none;} }
</style></head><body>
  <div class="toolbar">
    <button onclick="window.print()">📄 ${L('পেজ সেটাপ','Page Setup')}</button>
    <button class="primary" onclick="window.print()">🖨️ ${L('প্রিন্ট','Print')}</button>
    <button id="shareBtn">🔗 ${L('শেয়ার','Share')}</button>
  </div>
  <h1>${L('পার্টি লেজার','Party Ledger')} — ${escapeHtml(partyName)}</h1>
  <div class="sub">${L('প্রিন্টঃ','Print: ')}${formatPrintDate()}</div>
  <table>
    <thead><tr>
      <th>${L('তারিখ','Date')}</th><th>${L('বিবরণী','Description')}</th><th>${L('ভাউচার ধরন','Voucher Type')}</th><th>${L('ভাউচার নং','Voucher No')}</th>
      <th>${L('ডেবিট','Debit')}</th><th>${L('ক্রেডিট','Credit')}</th><th>${L('ব্যালান্স','Balance')}</th><th>${L('ব্যবহারকারী','User')}</th>
    </tr></thead>
    <tbody>${bodyRows}</tbody>
    <tfoot><tr><td colspan="4">${L('মোট','Total')}</td><td>${totalDebit.toFixed(2)}</td><td>${totalCredit.toFixed(2)}</td><td colspan="2"><b>${formatAmountDrCr(runningBalance, true)}</b></td></tr></tfoot>
  </table>
<script>
  document.getElementById('shareBtn').addEventListener('click', async function () {
    const text = ${JSON.stringify(L('পার্টি লেজার','Party Ledger'))} + ' — ' + ${JSON.stringify(partyName)};
    if (navigator.share) { try { await navigator.share({ title: text, text: text }); } catch (e) {} }
    else if (navigator.clipboard) { await navigator.clipboard.writeText(text); alert(${JSON.stringify(L('ক্লিপবোর্ডে কপি হয়েছে।','Copied to clipboard.'))}); }
  });
<\/script>
</body></html>`;

  const win = window.open('', '_blank');
  if (!win) { showToast(t('পপ-আপ ব্লক হয়েছে — এই সাইটের জন্য পপ-আপ অনুমতি দিন।','Pop-up was blocked — please allow pop-ups for this site.'), 'error'); return; }
  win.document.write(html);
  win.document.close();
}

/* ============================================================
   ১৩.৯) REPORTS মডিউল
   ============================================================ */
async function renderInventoryReport(content) {
  const [stock, items, warehouses, units] = await Promise.all([api('list', { sheet:'CurrentStock' }), cachedList('Items'), cachedList('Warehouses'), cachedList('UOM')]);
  const itemMap = {}; items.forEach(function (i) { itemMap[i.ItemID] = i; });
  const whMap = {}; warehouses.forEach(function (w) { whMap[w.WarehouseID] = w.WarehouseName; });
  let totalValue = 0;
  const rows = stock.map(function (s) {
    const item = itemMap[s.ItemID] || {};
    const pcsItem = isPieceUOM(item.UOMID, units);
    const qty = Number(pcsItem ? s.QtyPieces : s.QtyOnHand) || 0;
    const rate = Number(item.StandardCost) || 0;
    const value = qty * rate;
    totalValue += value;
    return `<tr><td>${escapeHtml(item.ItemName || s.ItemID)}</td><td>${escapeHtml(whMap[s.WarehouseID] || s.WarehouseID)}</td><td>${qty}${pcsItem ? ' ' + t('পিস','pcs') + `<div style="font-size:11px;color:var(--text-muted);">${(Number(s.QtyOnHand) || 0).toFixed(2)} ${t('কেজি','kg')}</div>` : ''}</td><td>${rate.toFixed(2)}</td><td>${value.toFixed(2)}</td></tr>`;
  }).join('');
  content.innerHTML = `
    <div class="page-head"><div><h1>${t('ইনভেন্টরি প্রতিবেদন','Inventory Report')}</h1><p>${t('স্টকের মূল্যসহ সম্পূর্ণ তালিকা','Full stock list with valuation')}</p></div></div>
    <div class="panel"><table class="data-table"><thead><tr><th>${t('আইটেম','Item')}</th><th>${t('গুদাম','Warehouse')}</th><th>${t('পরিমাণ','Qty')}</th><th>${t('দর','Rate')}</th><th>${t('মূল্য','Value')}</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="5" class="empty-state">${t('কোনো ডেটা নেই।','No data.')}</td></tr>`}</tbody>
      <tfoot><tr style="font-weight:700;background:var(--bg);"><td colspan="4">${t('মোট মূল্য','Total Value')}</td><td>${totalValue.toFixed(2)}</td></tr></tfoot>
    </table></div>`;
}
