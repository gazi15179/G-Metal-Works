        </tbody>
      </table>
      <p id="it_OpRatioHint" style="font-size:11.5px;color:var(--text-muted);margin:8px 0 0;">${t('প্রথমে পরিমাণ ও পিস দুটোই একসাথে দিন, তাহলে অনুপাত স্থির হয়ে যাবে।','Enter both Quantity and Pieces together once, to establish the ratio.')}</p>
      ${isEdit ? `<p style="font-size:12px;color:var(--danger);margin:8px 0 0;line-height:1.7;">⚠ ${t('এখানে বদলালে শুধু আইটেমের তথ্য (রেফারেন্স সংখ্যা) আপডেট হবে — বাস্তব স্টক ব্যালেন্স/স্টক লেজারে এর কোনো এন্ট্রি পড়বে না। প্রকৃত স্টক ঠিক করতে Inventory → Stock Adjustment ব্যবহার করুন।','Changing this here only updates the reference numbers on the item — no entry is posted to the actual stock balance or Stock Ledger. Use Inventory → Stock Adjustment to correct real stock.')}</p>` : ''}
    </div>

    <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border);max-width:240px;">
      <div class="field"><label>${t('স্ট্যাটাস','Status')}</label>
        <select id="it_IsActive">
          <option value="TRUE" ${!isEdit || isTrue(rec.IsActive) ? 'selected' : ''}>${t('সক্রিয়','Active')}</option>
          <option value="FALSE" ${isEdit && !isTrue(rec.IsActive) ? 'selected' : ''}>${t('নিষ্ক্রিয়','Inactive')}</option>
        </select>
      </div>
    </div>`;

  openModal({
    title: (isEdit ? t('সম্পাদনা — ','Edit — ') : t('নতুন — ','New — ')) + t('আইটেম','Item'),
    bodyHtml: bodyHtml,
    onSave: async function () {
      const name = val('it_ItemName');
      if (!name) throw new Error(t('নাম আবশ্যক।','Name is required.'));

      const openQtyCheck = Number(val('it_OpQty')) || 0;
      const openPiecesCheck = Number(val('it_OpPieces')) || 0;
      if (val('it_TrackingType') === 'WeightPieces' && openQtyCheck > 0 && openPiecesCheck <= 0) {
        throw new Error(t('এই আইটেম "ওজন + পিস" ধরনের — ওপেনিং স্টকে ওজন দিলে পিস সংখ্যাও (নিচের সারিতে) দেওয়া আবশ্যক।', 'This item is tracked as "Weight + Pieces" — if you enter an opening weight, you must also enter the pieces count (bottom row).'));
      }

      const data = {
        ItemName: name, GroupID: val('it_GroupID') || null, CategoryID: val('it_CategoryID') || null, UOMID: val('it_UOMID') || null, UnitMode: val('it_UnitMode'),
        TrackingType: val('it_TrackingType'),
        OpeningStock: val('it_OpQty') === '' ? 0 : val('it_OpQty'), StandardCost: val('it_OpRate') === '' ? 0 : val('it_OpRate'),
        IsActive: val('it_IsActive')
      };

      let savedItem;
      if (isEdit) {
        savedItem = await api('update', { sheet:'Items', idField:'ItemID', idValue: rec.ItemID, data: data });
      } else {
        savedItem = await api('create', { sheet:'Items', idField:'ItemID', idPrefix:'ITM', requiredFields:['ItemName'], data: data });
        const openQty = Number(val('it_OpQty')) || 0;
        const openPieces = Number(val('it_OpPieces')) || 0;
        const openWh = val('it_WarehouseID');
        if (openQty > 0 && openWh) {
          await api('postOpeningStock', { itemId: savedItem.ItemID, warehouseId: openWh, quantity: openQty, pieces: openPieces });
        }
      }

      showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
      if (window.__refreshItemList) await window.__refreshItemList();
    }
  });
  updateItemUnitEcho(); // ফর্ম খোলার সাথে সাথেই বাছাই করা এককের নাম ওপেনিং স্টক টেবিলে দেখানোর জন্য
}
window.updateItemUnitEcho = function () {
  const uomId = val('it_UOMID');
  const unit = (window.__itemFormUnits || []).find(function (u) { return u.UOMID === uomId; });
  const opUnitEcho = document.getElementById('it_OpUnitEcho');
  if (opUnitEcho) opUnitEcho.textContent = unit ? unit.UOMName : '—';
};
/** ওপেনিং স্টকের কেজি-পিস-মূল্য ক্যালকুলেটর — এই ফর্ম খোলা থাকাকালীন "প্রতি পিসে কত কেজি"
 *  অনুপাতটা মনে রাখা হয়, একবার কেজি ও পিস দুটোই জানা গেলে সেটা স্থির হয়ে যায়, তারপর
 *  থেকে যেকোনো দিক (কেজি অথবা পিস) দিয়ে শুরু করলেও বাকিটা নিজে থেকে বসে যাবে। */
let itemOpeningKgPerPiece = null;

function updateItemOpeningHint_() {
  const hintEl = document.getElementById('it_OpRatioHint');
  if (!hintEl) return;
  hintEl.textContent = itemOpeningKgPerPiece
    ? t('প্রতি পিস ≈ ', 'Each piece ≈ ') + itemOpeningKgPerPiece.toFixed(3) + ' ' + t('কেজি', 'kg')
    : t('প্রথমে পরিমাণ ও পিস দুটোই একসাথে দিন, তাহলে অনুপাত স্থির হয়ে যাবে।', 'Enter both Quantity and Pieces together once, to establish the ratio.');
}

/** কেজি (পরিমাণ) বা তার দর বদলালে — মূল্য বসবে, আর পিস আগে থেকে জানা থাকলে পিসের দরও বসে যাবে */
window.updateItemOpeningFromKg = function () {
  const qtyEl = document.getElementById('it_OpQty'), rateKgEl = document.getElementById('it_OpRate');
  const piecesEl = document.getElementById('it_OpPieces'), ratePieceEl = document.getElementById('it_OpRatePerPiece');
  const valueEl = document.getElementById('it_OpValue');
  if (!qtyEl || !rateKgEl || !piecesEl || !ratePieceEl || !valueEl) return;

  const qty = Number(qtyEl.value) || 0, rateKg = Number(rateKgEl.value) || 0, pieces = Number(piecesEl.value) || 0;
  const value = qty * rateKg;
  valueEl.value = value.toFixed(2);
  if (qty > 0 && pieces > 0) itemOpeningKgPerPiece = qty / pieces;
  if (pieces > 0 && value > 0) ratePieceEl.value = (value / pieces).toFixed(2);
  updateItemOpeningHint_();
};

/** পিস সংখ্যা বদলালে — কেজি আগে থেকে জানা থাকলে অনুপাত স্থির হবে ও পিসের দর বসবে;
 *  কেজি খালি কিন্তু আগের অনুপাত জানা থাকলে কেজি নিজে থেকে বসে যাবে */
window.updateItemOpeningFromPieces = function () {
  const qtyEl = document.getElementById('it_OpQty'), rateKgEl = document.getElementById('it_OpRate');
  const piecesEl = document.getElementById('it_OpPieces'), ratePieceEl = document.getElementById('it_OpRatePerPiece');
  const valueEl = document.getElementById('it_OpValue');
  if (!qtyEl || !rateKgEl || !piecesEl || !ratePieceEl || !valueEl) return;

  const pieces = Number(piecesEl.value) || 0;
  let qty = Number(qtyEl.value) || 0;
  const rateKg = Number(rateKgEl.value) || 0;

  if (qty > 0 && pieces > 0) {
    itemOpeningKgPerPiece = qty / pieces;
  } else if (pieces > 0 && itemOpeningKgPerPiece) {
    qty = pieces * itemOpeningKgPerPiece;
    qtyEl.value = qty.toFixed(3);
  }

  if (qty > 0 && rateKg > 0) {
    const value = qty * rateKg;
    valueEl.value = value.toFixed(2);
    if (pieces > 0) ratePieceEl.value = (value / pieces).toFixed(2);
  }
  updateItemOpeningHint_();
};

/** পিসের দর বদলালে — মূল্য বসবে; অনুপাত জানা থাকলে কেজি ও কেজি-প্রতি-দরও বসে যাবে */
window.updateItemOpeningFromPieceRate = function () {
  const qtyEl = document.getElementById('it_OpQty'), rateKgEl = document.getElementById('it_OpRate');
  const piecesEl = document.getElementById('it_OpPieces'), ratePieceEl = document.getElementById('it_OpRatePerPiece');
  const valueEl = document.getElementById('it_OpValue');
  if (!qtyEl || !rateKgEl || !piecesEl || !ratePieceEl || !valueEl) return;

  const pieces = Number(piecesEl.value) || 0, ratePiece = Number(ratePieceEl.value) || 0;
  if (pieces <= 0) return;

  const value = pieces * ratePiece;
  valueEl.value = value.toFixed(2);

  if (itemOpeningKgPerPiece) {
    const qty = pieces * itemOpeningKgPerPiece;
    qtyEl.value = qty.toFixed(3);
    if (qty > 0) rateKgEl.value = (value / qty).toFixed(2);
  }
  updateItemOpeningHint_();
};

/* ============================================================
   ১২.৫) পার্টি (Party) ফর্ম — Supplier/Customer একসাথে
   ============================================================ */
/**
 * প্রতিটা পার্টি (ব্যক্তি/প্রতিষ্ঠান) স্বয়ংক্রিয়ভাবেই সাপ্লায়ার ও
 * কাস্টমার — দুটো হিসেবেই ব্যবহারযোগ্য হয় (একবার এন্ট্রি দিলেই
 * Suppliers ও Customers দুই Sheet-এ একই Code দিয়ে সেভ হয়)। তাই
 * আলাদা করে টিক দেওয়ার দরকার নেই — Purchase-এ তাকে সাপ্লায়ার
 * হিসেবে, Sales-এ কাস্টমার হিসেবে সরাসরি বাছাই করা যাবে।
 */

async function renderPartyMasterPage(content) {
  content.innerHTML = `
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="পার্টি (সাপ্লায়ার / কাস্টমার)" data-en="Party (Supplier / Customer)">${t('পার্টি (সাপ্লায়ার / কাস্টমার)','Party (Supplier / Customer)')}</h1>
        <p class="i18n" data-bn="একই ব্যক্তি বা প্রতিষ্ঠান থেকে ক্রয় ও তার কাছে বিক্রয় — দুটোই করা যাবে" data-en="Buy from and sell to the same person or business — both work">${t('একই ব্যক্তি বা প্রতিষ্ঠান থেকে ক্রয় ও তার কাছে বিক্রয় — দুটোই করা যাবে','Buy from and sell to the same person or business — both work')}</p>
      </div>
      <button class="btn btn-primary i18n" style="width:auto;" id="partyAddBtn" data-bn="+ নতুন পার্টি" data-en="+ New Party">${t('+ নতুন পার্টি','+ New Party')}</button></div>
    <div class="panel"><div id="partyListWrap"></div></div>`;

  async function loadPartyList() {
    const [suppliers, customers] = await Promise.all([api('list', { sheet:'Suppliers' }), api('list', { sheet:'Customers' })]);
    const map = {};
    function upsert(rec) {
      const key = rec.Code || rec.SupplierID || rec.CustomerID;
      if (!key) return;
      if (!map[key]) map[key] = { Code:key, Name:rec.Name, CompanyName:rec.CompanyName, Phone:rec.Phone, Zone:rec.Zone, Active:false };
      if (!map[key].Name && rec.Name) map[key].Name = rec.Name;
      if (!map[key].CompanyName && rec.CompanyName) map[key].CompanyName = rec.CompanyName;
      if (isTrue(rec.IsActive)) map[key].Active = true;
    }
    suppliers.filter(function (s) { return s.Status !== 'Deleted'; }).forEach(upsert);
    customers.filter(function (c) { return c.Status !== 'Deleted'; }).forEach(upsert);

    const rows = Object.values(map);
    const wrap = document.getElementById('partyListWrap');
    if (!wrap) return; // ব্যবহারকারী এই ফাঁকে অন্য পেজ/ট্যাবে চলে গেলে এই এলিমেন্ট আর DOM-এ থাকবে না
    if (rows.length === 0) {
      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এখনো কোনো পার্টি যোগ করা হয়নি।" data-en="No parties added yet.">${t('এখনো কোনো পার্টি যোগ করা হয়নি।','No parties added yet.')}</div>`;
      return;
    }

    const headers = [
      ['কোড','Code'], ['প্রোপ্রাইটর','Proprietor'], ['ব্যবসার নাম','Business Name'],
      ['ফোন','Phone'], ['জোন','Zone'], ['অবস্থা','Status']
    ];
    const headCells = headers.map(function (h) { return `<th class="i18n" data-bn="${h[0]}" data-en="${h[1]}">${t(h[0], h[1])}</th>`; }).join('');

    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}<th></th></tr></thead><tbody>
      ${rows.map(function (r) {
        return `<tr>
          <td>${escapeHtml(r.Code)}</td><td>${escapeHtml(r.Name)}</td><td>${escapeHtml(r.CompanyName)}</td>
          <td>${escapeHtml(r.Phone)}</td><td>${escapeHtml(r.Zone)}</td>
          <td><span class="badge ${r.Active?'active':'inactive'} i18n" data-bn="${r.Active?'সক্রিয়':'নিষ্ক্রিয়'}" data-en="${r.Active?'Active':'Inactive'}">${t(r.Active?'সক্রিয়':'নিষ্ক্রিয়', r.Active?'Active':'Inactive')}</span></td>
          <td class="row-actions"><button onclick='openPartyForm(${JSON.stringify(r.Code)})' title="${t('সম্পাদনা','Edit')}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="m18.5 2.5 3 3L10 17l-4 1 1-4Z"/></svg>
          </button></td>
        </tr>`;
      }).join('')}
    </tbody></table>`;
  }

  await loadPartyList();
  window.__refreshPartyList = loadPartyList;
  document.getElementById('partyAddBtn').addEventListener('click', function () { openPartyForm(null); });
}

async function openPartyForm(existingCode) {
  let supplierRec = null, customerRec = null;
  const zonesPromise = api('list', { sheet: 'Zones' });
  if (existingCode) {
    const [suppliers, customers] = await Promise.all([api('list', { sheet:'Suppliers' }), api('list', { sheet:'Customers' })]);
    supplierRec = suppliers.find(function (s) { return s.Code === existingCode && s.Status !== 'Deleted'; }) || null;
    customerRec = customers.find(function (c) { return c.Code === existingCode && c.Status !== 'Deleted'; }) || null;
  }
  const zones = await zonesPromise;
  const rec = supplierRec || customerRec || {};
  const isEdit = !!existingCode;

  function zoneOptionsHtml() {
    return zones.filter(function (z) { return z.Status !== 'Deleted'; })
      .map(function (z) { return `<option value="${attr(z.ZoneName)}" ${rec.Zone===z.ZoneName?'selected':''}>${escapeHtml(z.ZoneName)}</option>`; }).join('');
  }

  const bodyHtml = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
      <div class="field"><label>কোড</label><input id="pf_Code" value="${attr(existingCode || '')}" ${isEdit ? 'readonly style="background:var(--bg);"' : 'placeholder="খালি রাখলে অটো তৈরি হবে"'}></div>
      <div class="field"><label>জোন</label>
        <div style="display:flex;gap:8px;">
          <select id="pf_Zone" style="flex:1;min-width:0;"><option value="">—</option>${zoneOptionsHtml()}</select>
          <button type="button" id="pf_AddZoneBtn" class="btn" style="width:auto;padding:0 14px;flex-shrink:0;" title="নতুন জোন যোগ করুন">+</button>
        </div>
      </div>
      <div class="field"><label>ব্যবসার নাম (Business Name)</label><input id="pf_CompanyName" value="${attr(rec.CompanyName)}"></div>
      <div class="field"><label>প্রোপ্রাইটরের নাম (Proprietor Name)</label><input id="pf_Name" value="${attr(rec.Name)}"></div>
      <div class="field"><label>ফোন</label><input id="pf_Phone" value="${attr(rec.Phone)}"></div>
      <div class="field"><label>Email</label><input id="pf_Email" value="${attr(rec.Email)}"></div>
      ${amountDrCrFieldHtml('pf_OpeningBalance', 'ওপেনিং ব্যালেন্স', rec.OpeningBalance)}
      ${amountDrCrFieldHtml('pf_CreditLimit', 'ক্রেডিট লিমিট', rec.CreditLimit)}
      <div class="field"><label>লিমিট পরিশোধের তারিখ</label><input type="date" id="pf_CreditLimitPaidDate" value="${attr(rec.CreditLimitPaidDate)}"></div>
      <div class="field"><label>ঠিকানা</label><input id="pf_Address" value="${attr(rec.Address)}"></div>
      <div class="field"><label>অবস্থা</label><select id="pf_IsActive">
        <option value="TRUE" ${!isEdit || isTrue(rec.IsActive) ? 'selected' : ''}>Active</option>
        <option value="FALSE" ${isEdit && !isTrue(rec.IsActive) ? 'selected' : ''}>Inactive</option>
      </select></div>
    </div>
    ${isEdit ? '<div style="margin-top:16px;"><button type="button" id="partyDeleteBtn" class="btn" style="width:auto;background:#fdecea;color:var(--danger);border-color:#f6c6c2;">ডিলিট করুন</button></div>' : ''}`;

  openModal({
    title: (isEdit ? 'সম্পাদনা — ' : 'নতুন — ') + 'পার্টি',
    bodyHtml: bodyHtml,
    onSave: async function () {
      const code = val('pf_Code') || ('PTY-' + Date.now().toString().slice(-6));
      const name = val('pf_Name');
      if (!name) throw new Error('প্রোপ্রাইটরের নাম আবশ্যক।');

      const common = {
        Code: code, Name: name, CompanyName: val('pf_CompanyName'), Phone: val('pf_Phone'), Email: val('pf_Email'),
        Address: val('pf_Address'), Zone: val('pf_Zone'), CreditLimitPaidDate: val('pf_CreditLimitPaidDate') || null,
        OpeningBalance: readAmountDrCr('pf_OpeningBalance'), CreditLimit: readAmountDrCr('pf_CreditLimit'),
        IsActive: val('pf_IsActive')
      };

      if (supplierRec) {
        await api('update', { sheet:'Suppliers', idField:'SupplierID', idValue: supplierRec.SupplierID, data: common });
      } else {
        await api('create', { sheet:'Suppliers', idField:'SupplierID', idPrefix:'SUP', requiredFields:['Name'], data: common });
      }
      if (customerRec) {
        await api('update', { sheet:'Customers', idField:'CustomerID', idValue: customerRec.CustomerID, data: common });
      } else {
        await api('create', { sheet:'Customers', idField:'CustomerID', idPrefix:'CUS', requiredFields:['Name'], data: common });
      }

      showToast('সেভ হয়েছে ✅ (কোড: ' + code + ')', 'success');
      if (window.__refreshPartyList) await window.__refreshPartyList();
    }

  document.getElementById('pf_AddZoneBtn').addEventListener('click', async function () {
    const name = prompt('নতুন জোনের নাম লিখুন:');

  if (isEdit) {

      if (!confirm('আপনি কি নিশ্চিত এই পার্টি ডিলিট করতে চান?')) return;
      try {
        if (supplierRec) await api('delete', { sheet:'Suppliers', idField:'SupplierID', idValue: supplierRec.SupplierID });
        if (customerRec) await api('delete', { sheet:'Customers', idField:'CustomerID', idValue: customerRec.CustomerID });
        showToast('ডিলিট হয়েছে ✅', 'success');
        closeModal();
        if (window.__refreshPartyList) await window.__refreshPartyList();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  }
}

async function renderSimpleVoucherPage(content, config) {
  const records = await api('list', { sheet: config.sheet });

  content.innerHTML = `
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="${attr(config.titleBn)}" data-en="${attr(config.titleEn)}">${t(config.titleBn, config.titleEn)}</h1>
        <p class="i18n" data-bn="${attr(config.subBn)}" data-en="${attr(config.subEn)}">${t(config.subBn, config.subEn)}</p>
      </div>
      <button class="btn btn-primary i18n" style="width:auto;" id="simpleVoucherAddBtn" data-bn="+ নতুন যোগ করুন" data-en="+ Add New">${t('+ নতুন যোগ করুন','+ Add New')}</button></div>
    <div class="panel"><div id="svTableWrap"></div></div>`;

  function renderTable(list) {
    const wrap = document.getElementById('svTableWrap');
    if (!wrap) return; // ব্যবহারকারী এই ফাঁকে অন্য পেজ/ট্যাবে চলে গেলে এই এলিমেন্ট আর DOM-এ থাকবে না
    const active = list.filter(function (r) { return r.Status !== 'Deleted'; });
    if (active.length === 0) {
      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এখনো কোনো এন্ট্রি নেই।" data-en="No entries yet.">${t('এখনো কোনো এন্ট্রি নেই।','No entries yet.')}</div>`;
      return;
    }
    const headCells = config.listColumns.map(function (c) { return `<th class="i18n" data-bn="${attr(c.label)}" data-en="${attr(c.labelEn||c.label)}">${t(c.label, c.labelEn||c.label)}</th>`; }).join('');
    const bodyRows = active.slice().reverse().map(function (r) {
      const cells = config.listColumns.map(function (c) {
        let v = r[c.key];
        if (c.key === 'Status') {
          v = v === 'Posted' ? `<span class="badge active i18n" data-bn="পোস্ট করা" data-en="Posted">${t('পোস্ট করা','Posted')}</span>` : `<span class="badge draft i18n" data-bn="খসড়া" data-en="Draft">${t('খসড়া','Draft')}</span>`;
        } else v = escapeHtml(v);
        return '<td>' + v + '</td>';
      }).join('');
      const postBtn = r.Status !== 'Posted'
        ? `<button class="btn i18n" style="width:auto;padding:6px 12px;font-size:12px;" data-bn="পোস্ট করুন" data-en="Post" onclick='event.stopPropagation();postDocumentRecord(${JSON.stringify(config.docType)}, ${JSON.stringify(r[config.idField])})'>${t('পোস্ট করুন','Post')}</button>`
        : '';
      return `<tr onclick='openSimpleVoucherForm(${JSON.stringify(r).replace(/'/g,"&apos;")})' style="cursor:pointer;">${cells}<td class="row-actions">${postBtn}</td></tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}<th></th></tr></thead><tbody>${bodyRows}</tbody></table>`;
  }

  renderTable(records);
  document.getElementById('simpleVoucherAddBtn').addEventListener('click', function () { openSimpleVoucherForm(null); });
  window.__refreshSimpleVoucherList = async function () { renderTable(await api('list', { sheet: config.sheet })); };
  window.__activeSimpleVoucherConfig = config;
}

async function openSimpleVoucherForm(existing) {
  const config = window.__activeSimpleVoucherConfig;
  const isEdit = !!existing;
  const isPosted = isEdit && existing.Status === 'Posted';

  const fkFieldsList = config.fields.filter(function (f) { return f.type === 'select-fk'; });
  const uniqueFkSheets = Array.from(new Set(fkFieldsList.map(function (f) { return f.fkSheet; })));
  const fkSheetMap = await cachedListMultiple(uniqueFkSheets);
  const fkLists = {};
  fkFieldsList.forEach(function (f) { fkLists[f.key] = fkSheetMap[f.fkSheet]; });

  const bodyHtml = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">` +
    config.fields.map(function (f) {
      const id = 'sv_' + f.key;
      const currentVal = existing ? existing[f.key] : '';
      const disabledAttr = isPosted ? 'disabled' : '';
      const label = t(f.label, f.labelEn || f.label);
      if (f.type === 'select-fk') {
        const opts = (fkLists[f.key] || []).filter(function (r) { return r.Status !== 'Deleted'; })
          .map(function (r) { return `<option value="${attr(r[f.fkIdField])}" ${currentVal===r[f.fkIdField]?'selected':''}>${escapeHtml(r[f.fkLabel])}</option>`; }).join('');
        return `<div class="field"><label>${label}</label><select id="${id}" ${disabledAttr}><option value="">—</option>${opts}</select></div>`;
      }
      if (f.type === 'select-enum') {
        const opts = f.options.map(function (o) { return `<option value="${o}" ${currentVal===o?'selected':''}>${o}</option>`; }).join('');
        return `<div class="field"><label>${label}</label><select id="${id}" ${disabledAttr}><option value="">—</option>${opts}</select></div>`;
      }
      if (f.type === 'date') return `<div class="field"><label>${label}</label><input type="date" id="${id}" value="${attr(currentVal)}" ${disabledAttr}></div>`;
      if (f.type === 'number') return `<div class="field"><label>${label}</label><input type="number" step="any" id="${id}" value="${attr(currentVal)}" ${disabledAttr}></div>`;
      return `<div class="field"><label>${label}</label><input id="${id}" value="${attr(currentVal)}" ${disabledAttr}></div>`;
    }).join('') +
    `</div>` +
    (isPosted ? `<p style="margin-top:14px;color:var(--text-muted);font-size:12.5px;">${t('এই ভাউচার পোস্ট হয়ে গেছে — আর সম্পাদনা করা যাবে না।','This voucher is already posted — it can no longer be edited.')}</p>` : '');

  openModal({
    title: (isEdit ? t('সম্পাদনা — ','Edit — ') : t('নতুন — ','New — ')) + t(config.titleBn, config.titleEn),
    bodyHtml: bodyHtml,
    onSave: async function () {
      if (isPosted) throw new Error(t('পোস্ট করা ভাউচার সম্পাদনা করা যাবে না।','A posted voucher cannot be edited.'));
      const data = {};
      config.fields.forEach(function (f) { data[f.key] = val('sv_' + f.key); });
      const missing = config.fields.filter(function (f) { return f.required && !data[f.key]; });
      if (missing.length > 0) throw new Error(missing.map(function (f) { return t(f.label, f.labelEn||f.label); }).join(', ') + t(' আবশ্যক।',' is required.'));

      if (isEdit) {
        await api('update', { sheet: config.sheet, idField: config.idField, idValue: existing[config.idField], data: data });
      } else {
        const requiredFields = config.fields.filter(function (f) { return f.required; }).map(function (f) { return f.key; });
        await api('create', { sheet: config.sheet, idField: config.idField, idPrefix: config.idPrefix, requiredFields: requiredFields, data: data });
      }
      showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
      if (window.__refreshSimpleVoucherList) await window.__refreshSimpleVoucherList();
    }
  });
}

      </div>

        <option value="" class="i18n" data-bn="সব অ্যাকাউন্ট" data-en="All Accounts">${t('সব অ্যাকাউন্ট','All Accounts')}</option>
        ${accounts.filter(function(a){return a.Status!=='Deleted';}).map(function (a) { return `<option value="${attr(a.BankAccID)}">${escapeHtml(a.AccountName)}</option>`; }).join('')}
      </select>
    </div>
    <div class="panel"><div id="bcbWrap"></div></div>`;

  function renderTable(filterAcc) {
    const wrap = document.getElementById('bcbWrap');
    if (!wrap) return; // ব্যবহারকারী এই ফাঁকে অন্য পেজ/ট্যাবে চলে গেলে এই এলিমেন্ট আর DOM-এ থাকবে না

/** ট্রায়াল ব্যালেন্স — বর্তমানে শুধু পোস্ট করা Journal Voucher-এর হিসাব দেখায় */
async function renderTrialBalance(content) {
  const [jvHeaders, jvLines, accounts] = await Promise.all([
    api('list', { sheet:'JournalVoucher' }), api('list', { sheet:'JV_Lines' }), api('list', { sheet:'ChartOfAccounts' })
  ]);
  const postedJVIDs = new Set(jvHeaders.filter(function (h) { return h.Status === 'Posted'; }).map(function (h) { return h.JVID; }));
  const accMap = {}; accounts.forEach(function (a) { accMap[a.AccountID] = a.AccountName; });

  const totals = {};
  jvLines.filter(function (l) { return postedJVIDs.has(l.JVID); }).forEach(function (l) {
    if (!totals[l.AccountID]) totals[l.AccountID] = { debit: 0, credit: 0 };
    totals[l.AccountID].debit += Number(l.Debit || 0);
    totals[l.AccountID].credit += Number(l.Credit || 0);
  });

  content.innerHTML = `
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="ট্রায়াল ব্যালেন্স" data-en="Trial Balance">${t('ট্রায়াল ব্যালেন্স','Trial Balance')}</h1>
        <p class="i18n" data-bn="বর্তমানে শুধু পোস্ট করা জার্নাল ভাউচার এন্ট্রি থেকে হিসাব করা হয়েছে" data-en="Currently computed from posted Journal Voucher entries only">${t('বর্তমানে শুধু পোস্ট করা জার্নাল ভাউচার এন্ট্রি থেকে হিসাব করা হয়েছে','Currently computed from posted Journal Voucher entries only')}</p>
      </div></div>
    <div class="panel"><div id="trialBalanceWrap"></div></div>`;

  const wrap = document.getElementById('trialBalanceWrap');
  if (!wrap) return; // ব্যবহারকারী এই ফাঁকে অন্য পেজ/ট্যাবে চলে গেলে এই এলিমেন্ট আর DOM-এ থাকবে না
  const accountIds = Object.keys(totals);
  if (accountIds.length === 0) {
    wrap.innerHTML = `<div class="empty-state i18n" data-bn="কোনো পোস্ট করা Journal Voucher নেই।" data-en="No posted Journal Vouchers yet.">${t('কোনো পোস্ট করা Journal Voucher নেই।','No posted Journal Vouchers yet.')}</div>`;
    return;
  }

  let grandDebit = 0, grandCredit = 0;
  const rows = accountIds.map(function (accId) {
    const tt = totals[accId];
    grandDebit += tt.debit; grandCredit += tt.credit;
    return `<tr><td>${escapeHtml(accMap[accId] || accId)}</td><td>${tt.debit.toFixed(2)}</td><td>${tt.credit.toFixed(2)}</td></tr>`;
  }).join('');

  const headers = [['হিসাব খাত','Account'],['Debit','Debit'],['Credit','Credit']];
  const headCells = headers.map(function (h) { return `<th class="i18n" data-bn="${h[0]}" data-en="${h[1]}">${t(h[0], h[1])}</th>`; }).join('');

  wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}</tr></thead><tbody>${rows}
    <tr style="font-weight:700;background:var(--bg);"><td class="i18n" data-bn="মোট" data-en="Total">${t('মোট','Total')}</td><td>${grandDebit.toFixed(2)}</td><td>${grandCredit.toFixed(2)}</td></tr>
  </tbody></table>`;
}

async function openLeaveForm(existing) {

async function openPayrollForm() {
  const employees = (await cachedList('Employees')).filter(function (e) { return e.Status !== 'Deleted' && isTrue(e.IsActive); });
  if (employees.length === 0) { showToast(t('কোনো সক্রিয় কর্মচারী পাওয়া যায়নি — আগে Employee Master-এ যোগ করুন।','No active employees found — add some in Employee Master first.'), 'error'); return; }

  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const monthOpts = monthNames.map(function (m, i) { return `<option value="${m}" ${new Date().getMonth()===i?'selected':''}>${m}</option>`; }).join('');

  const rowsHtml = employees.map(function (e, idx) {
    const basic = Number(e.BasicSalary) || 0;
    return `<tr>
      <td>${escapeHtml(e.Name)}</td>
      <td><input type="number" step="any" id="pr_${idx}_basic" value="${basic}" oninput="updatePayrollNet(${idx})" style="width:100px;"></td>
      <td><input type="number" step="any" id="pr_${idx}_allow" value="0" oninput="updatePayrollNet(${idx})" style="width:90px;"></td>
      <td><input type="number" step="any" id="pr_${idx}_deduct" value="0" oninput="updatePayrollNet(${idx})" style="width:90px;"></td>
      <td><b id="pr_${idx}_net">${basic.toFixed(2)}</b></td>
    </tr>`;
  }).join('');

  const headers = [['কর্মচারী','Employee'],['মূল বেতন','Basic'],['ভাতা','Allowance'],['কর্তন','Deduction'],['নিট বেতন','Net Pay']];
  const headCells = headers.map(function (h) { return `<th>${t(h[0], h[1])}</th>`; }).join('');

  openModal({
    title: t('নতুন পে-রোল রান','New Payroll Run'),
    bodyHtml: `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;">
        <div class="field"><label>${t('মাস','Month')}</label><select id="pr_Month">${monthOpts}</select></div>
        <div class="field"><label>${t('বছর','Year')}</label><input type="number" id="pr_Year" value="${new Date().getFullYear()}"></div>
      </div>
      <div style="max-height:320px;overflow-y:auto;"><table class="data-table"><thead><tr>${headCells}</tr></thead><tbody>${rowsHtml}</tbody></table></div>`,
    onSave: async function () {
      const month = val('pr_Month'), year = val('pr_Year');
      if (!year) throw new Error(t('বছর আবশ্যক।','Year is required.'));

      const lines = employees.map(function (e, idx) {
        const basic = Number(val('pr_' + idx + '_basic')) || 0;
        const allow = Number(val('pr_' + idx + '_allow')) || 0;
        const deduct = Number(val('pr_' + idx + '_deduct')) || 0;
        return { EmployeeID: e.EmployeeID, BasicSalary: basic, Allowance: allow, Deduction: deduct, NetPay: basic + allow - deduct };
      });

      await api('createDocument', {
        headerSheet: 'Payroll', idField: 'PayrollID', idPrefix: 'PRL', requiredFields: ['Month','Year'],
        linesSheet: 'Payroll_Lines', lineIdField: 'PayrollID',
        headerData: { Month: month, Year: year, Status: 'Active' },
        lines: lines
      });
      showToast(t('পে-রোল তৈরি হয়েছে ✅','Payroll created ✅'), 'success');
      if (window.__refreshPayrollList) await window.__refreshPayrollList();
    }
  });
}
window.updatePayrollNet = function (idx) {
  const basic = Number(document.getElementById('pr_' + idx + '_basic').value) || 0;
  const allow = Number(document.getElementById('pr_' + idx + '_allow').value) || 0;
  const deduct = Number(document.getElementById('pr_' + idx + '_deduct').value) || 0;
  document.getElementById('pr_' + idx + '_net').textContent = (basic + allow - deduct).toFixed(2);
};

/**

      </div>

      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এখনো কোনো প্রসেসিং ভাউচার তৈরি হয়নি।" data-en="No processing vouchers created yet.">${t('এখনো কোনো প্রসেসিং ভাউচার তৈরি হয়নি।','No processing vouchers created yet.')}</div>`;
      return;
    }
    const headers = [['আইডি','ID'],['তারিখ','Date'],['কাঁচামাল','Raw Material'],['প্রস্তুত পণ্য','Finished Goods'],['নেট ওজন','Net Weight'],['নেট মূল্য','Net Value'],['অবস্থা','Status']];

        ? `<button class="btn" style="width:auto;padding:6px 12px;font-size:12px;" onclick='postProcessingRecord(${JSON.stringify(r.ProcessingID)})'>${t('পোস্ট করুন','Post')}</button>`

      </tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}<th></th></tr></thead><tbody>${bodyRows}</tbody></table>`;
  }

  await loadList();
  window.__refreshProcessingList = loadList;
  document.getElementById('procAddBtn').addEventListener('click', function () { openProcessingForm(); });

async function postProcessingRecord(processingId) {

  try {
    await api('postDocument', { docType: 'ProcessingVoucher', docId: processingId });

      if (!rawMaterialItemId) throw new Error(t('কাঁচামাল আইটেম বাছাই করা আবশ্যক।','Raw material item is required.'));
      if (!warehouseId) throw new Error(t('গুদাম বাছাই করা আবশ্যক।','Warehouse is required.'));
      if (!fgItemId) throw new Error(t('প্রস্তুত পণ্য আইটেম বাছাই করা আবশ্যক।','Finished goods item is required.'));
      if (qty <= 0) throw new Error(t('পরিমাণ আবশ্যক।','Quantity is required.'));

      const fgItem = window.__procItemMap[fgItemId];
      const pieces = Number(val('pv_Pieces')) || 0;
      if (fgItem && fgItem.TrackingType === 'WeightPieces' && pieces <= 0) {
        throw new Error(t('"' + fgItem.ItemName + '" আইটেমটা "ওজন + পিস" ধরনের — তাই পিস সংখ্যা দেওয়া আবশ্যক।', '"' + fgItem.ItemName + '" is tracked as "Weight + Pieces" — the pieces count is required.'));
      }

      const byProductLines = window.__procByProductRows
        .map(function (_, idx) {
          return {
            ByProductName: val('pv_bp_' + idx + '_name'),
            ItemID: val('pv_bp_' + idx + '_item'),
            Quantity: Number(val('pv_bp_' + idx + '_qty')) || 0,
            Rate: Number(val('pv_bp_' + idx + '_rate')) || 0,
            Value: (Number(val('pv_bp_' + idx + '_qty')) || 0) * (Number(val('pv_bp_' + idx + '_rate')) || 0)
          };
        })
        .filter(function (l) { return l.Quantity > 0; });

      const headerData = {
        Date: val('pv_Date'), RawMaterialItemID: rawMaterialItemId,
        DateFrom: val('pv_DateFrom'), DateTo: val('pv_DateTo'), WarehouseID: warehouseId,
        RawMaterialQty: qty, RawMaterialRate: Number(val('pv_RMRate')) || 0, RawMaterialValue: Number(val('pv_RMValue')) || 0,
        ProcessingRate: Number(val('pv_ProcRate')) || 0, ProcessingValue: Number(val('pv_ProcValue')) || 0,
        TotalValue: Number(val('pv_Total')) || 0,
        ByProductQty: byProductLines.reduce(function (s, l) { return s + l.Quantity; }, 0),
        ByProductValue: byProductLines.reduce(function (s, l) { return s + l.Value; }, 0),
        NetWeight: Number(val('pv_NetWeight')) || 0, NetValue: Number(val('pv_NetValue')) || 0,
        FinishedGoodsItemID: fgItemId, Pieces: Number(val('pv_Pieces')) || 0,
        RatePerKg: Number(val('pv_RatePerKg')) || 0, RatePerPiece: Number(val('pv_RatePerPiece')) || 0
      };

      await api('createDocument', {
        headerSheet: 'ProcessingVoucher', idField: 'ProcessingID', idPrefix: 'PROC',
        requiredFields: ['RawMaterialItemID','WarehouseID','FinishedGoodsItemID'],
        linesSheet: 'ProcessingByProduct_Lines', lineIdField: 'ProcessingID',
        headerData: headerData, lines: byProductLines
      });

      showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
      if (window.__refreshProcessingList) await window.__refreshProcessingList();
    }
  });

  document.getElementById('pv_FetchRateBtn').addEventListener('click', async function () {
    const itemId = val('pv_RawMaterialItemID');
    const dateFrom = val('pv_DateFrom'), dateTo = val('pv_DateTo');
    if (!itemId) { showToast(t('আগে কাঁচামাল আইটেম বাছাই করুন।','Select the raw material item first.'), 'error'); return; }
    try {
      const result = await api('getAverageRate', { itemId: itemId, dateFrom: dateFrom, dateTo: dateTo });
      document.getElementById('pv_RMRate').value = result.averageRate.toFixed(2);
      document.getElementById('pv_RateHint').textContent = t(
        result.grnCount + 'টা GRN থেকে মোট ' + result.totalQtyPurchased.toFixed(2) + ' কেজির গড় দর',
        'Averaged from ' + result.grnCount + ' GRN(s), total ' + result.totalQtyPurchased.toFixed(2) + ' kg purchased'
      );
      recalcProcessing();
    } catch (err) {
      showToast(err.message, 'error');
    }
  });

  document.getElementById('pv_AddByProductBtn').addEventListener('click', function () {
    window.__procByProductRows.push({});
    renderProcByProductRows();
  });

  function renderProcByProductRows() {
    const wrap = document.getElementById('pv_ByProductWrap');
    if (!wrap) return;
    if (window.__procByProductRows.length === 0) {
      wrap.innerHTML = `<div class="empty-state" style="padding:14px;">${t('কোনো বাই-প্রডাক্ট নেই।','No by-products yet.')}</div>`;
      return;
    }
    const headCells = `<th>${t('নাম','Name')}</th><th>${t('আইটেম (ঐচ্ছিক)','Item (optional)')}</th><th>${t('পরিমাণ','Qty')}</th><th>${t('দর','Rate')}</th><th>${t('মূল্য','Value')}</th><th></th>`;
    const rows = window.__procByProductRows.map(function (row, idx) {
      return `<tr>
        <td><input id="pv_bp_${idx}_name" value="${attr(row.name)}" style="width:100px;"></td>
        <td><select id="pv_bp_${idx}_item"><option value="">—</option>${opts(window.__procItems, 'ItemID', 'ItemName')}</select></td>
        <td><input id="pv_bp_${idx}_qty" type="number" step="any" value="${row.qty||''}" oninput="recalcProcessing()" style="width:80px;"></td>
        <td><input id="pv_bp_${idx}_rate" type="number" step="any" value="${row.rate||''}" oninput="recalcProcessing()" style="width:80px;"></td>
        <td><span id="pv_bp_${idx}_val">0.00</span></td>
        <td><button type="button" onclick="window.__removeProcByProduct(${idx})">✕</button></td>
      </tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}</tr></thead><tbody>${rows}</tbody></table>`;
  }
  window.__renderProcByProductRows = renderProcByProductRows;
  window.__removeProcByProduct = function (idx) {
    window.__procByProductRows.splice(idx, 1);
    renderProcByProductRows();
    recalcProcessing();
  };
  renderProcByProductRows();
}

window.recalcProcessing = function () {
  const qty = Number(val('pv_Qty')) || 0;
  const rmRate = Number(val('pv_RMRate')) || 0;
  const procRate = Number(val('pv_ProcRate')) || 0;

  const rmValue = qty * rmRate;
  const procValue = qty * procRate;
  const total = rmValue + procValue;

  document.getElementById('pv_RMValue').value = rmValue.toFixed(2);
  document.getElementById('pv_ProcValue').value = procValue.toFixed(2);
  document.getElementById('pv_Total').value = total.toFixed(2);

  let bpQtySum = 0, bpValueSum = 0;
  (window.__procByProductRows || []).forEach(function (_, idx) {
    const bpQty = Number(val('pv_bp_' + idx + '_qty')) || 0;
    const bpRate = Number(val('pv_bp_' + idx + '_rate')) || 0;
    const bpValue = bpQty * bpRate;
    bpQtySum += bpQty;
    bpValueSum += bpValue;
    const valEl = document.getElementById('pv_bp_' + idx + '_val');
    if (valEl) valEl.textContent = bpValue.toFixed(2);
  });

  const netWeight = qty - bpQtySum;
  const netValue = total - bpValueSum;
  document.getElementById('pv_NetWeight').value = netWeight.toFixed(3);
  document.getElementById('pv_NetValue').value = netValue.toFixed(2);

  const pieces = Number(val('pv_Pieces')) || 0;
  document.getElementById('pv_RatePerKg').value = netWeight > 0 ? (netValue / netWeight).toFixed(2) : '0.00';
  document.getElementById('pv_RatePerPiece').value = pieces > 0 ? (netValue / pieces).toFixed(2) : '0.00';
};

/* ============================================================
   ১৩.৯৮) একত্রিত ক্রয় ভাউচার — Purchase Invoice + Purchase Return
   একই ফর্মে, টাইপ ড্রপডাউন দিয়ে সুইচ করা যাবে
   ============================================================ */
async function renderPurchaseVoucherPage(content, defaultType) {
  defaultType = defaultType || 'PurchaseInvoice';
  content.innerHTML = `
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="ক্রয় ভাউচার" data-en="Purchase Voucher">${t('ক্রয় ভাউচার','Purchase Voucher')}</h1>
        <p class="i18n" data-bn="ক্রয় ও ক্রয় ফেরত — একই জায়গা থেকে" data-en="Purchase and purchase return — from one place">${t('ক্রয় ও ক্রয় ফেরত — একই জায়গা থেকে','Purchase and purchase return — from one place')}</p>
      </div>
      <button class="btn btn-primary i18n" style="width:auto;" id="pvAddBtn" data-bn="+ নতুন যোগ করুন" data-en="+ Add New">${t('+ নতুন যোগ করুন','+ Add New')}</button></div>
    <div class="panel"><div id="pvTableWrap"></div></div>`;

  async function loadList() {
    const [invoices, returns, suppliers, purchasers] = await Promise.all([
      api('list', { sheet:'PurchaseInvoice' }), api('list', { sheet:'PurchaseReturn' }),
      cachedList('Suppliers'), cachedList('Purchasers')
    ]);
    const supMap = {}; suppliers.forEach(function (s) { supMap[s.SupplierID] = s.CompanyName || s.Name; });
    const purMap = {}; purchasers.forEach(function (p) { purMap[p.PurchaserID] = p.PurchaserName; });

    const merged = invoices.filter(function (r) { return r.Status !== 'Deleted'; }).map(function (r) {
      return { type:'PurchaseInvoice', typeLabel:['ক্রয় ভাউচার','Purchase Voucher'], id:r.PIID, date:r.InvoiceDate, supplierId:r.SupplierID, purchaserId:r.PurchaserID, amount:r.TotalAmount, status:r.Status };
    }).concat(returns.filter(function (r) { return r.Status !== 'Deleted'; }).map(function (r) {
      return { type:'PurchaseReturn', typeLabel:['ক্রয় ফেরত ভাউচার','Purchase Return Voucher'], id:r.PRetID, date:r.Date, supplierId:r.SupplierID, purchaserId:r.PurchaserID, amount:null, status:r.Status };
    }));
    merged.sort(function (a, b) { return String(a.date||'').localeCompare(String(b.date||'')); });

    const wrap = document.getElementById('pvTableWrap');
    if (!wrap) return;
    if (merged.length === 0) {
      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এখনো কোনো ভাউচার তৈরি হয়নি।" data-en="No vouchers created yet.">${t('এখনো কোনো ভাউচার তৈরি হয়নি।','No vouchers created yet.')}</div>`;
      return;
    }

    const headers = [['টাইপ','Type'],['ভাউচার নম্বর','Voucher No'],['তারিখ','Date'],['সাপ্লায়ার','Supplier'],['ক্রয়কারী','Purchaser'],['মূল্য','Amount'],['অবস্থা','Status']];
    const headCells = headers.map(function (h) { return `<th class="i18n" data-bn="${h[0]}" data-en="${h[1]}">${t(h[0], h[1])}</th>`; }).join('');
    const bodyRows = merged.slice().reverse().map(function (r) {
      const isPosted = r.status === 'Posted';
      const postBtn = !isPosted
        ? `<button class="btn" style="width:auto;padding:6px 12px;font-size:12px;" onclick='postPurchaseVoucherRecord(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})'>${t('পোস্ট করুন','Post')}</button>`
        : '';
      const editBtn = !isPosted
        ? `<button onclick='openPurchaseVoucherForm(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('সম্পাদনা','Edit')}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="m18.5 2.5 3 3L10 17l-4 1 1-4Z"/></svg>
          </button>`
        : '';
      const deleteBtn = !isPosted
        ? `<button onclick='deletePurchaseVoucherRecord(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('ডিলিট','Delete')}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
          </button>`
        : (currentUser && currentUser.RoleID === 'ROLE-ADMIN'
            ? `<button onclick='deletePostedPurchaseVoucher(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('এডমিন ডিলিট (পাসওয়ার্ড লাগবে)','Admin delete (password required)')}" style="color:var(--danger);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>

      const previewBtn = `<button onclick='openPrintableVoucherView(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('প্রিভিউ/প্রিন্ট/শেয়ার','Preview/Print/Share')}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>

        <td>${t(r.typeLabel[0], r.typeLabel[1])}</td><td>${escapeHtml(r.id)}</td><td>${escapeHtml(r.date)}</td>
        <td>${escapeHtml(supMap[r.supplierId] || r.supplierId)}</td><td>${escapeHtml(purMap[r.purchaserId] || '—')}</td>
        <td>${r.amount !== null ? Number(r.amount).toFixed(2) : '—'}</td>
        <td>${isPosted ? `<span class="badge active">${t('পোস্ট করা','Posted')}</span>` : `<span class="badge draft">${t('খসড়া','Draft')}</span>`}</td>
        <td class="row-actions" onclick="event.stopPropagation();">${postBtn}${previewBtn}${editBtn}${deleteBtn}</td>
      </tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}<th></th></tr></thead><tbody>${bodyRows}</tbody></table>`;
  }

  await loadList();
  window.__refreshPurchaseVoucherList = loadList;
  document.getElementById('pvAddBtn').addEventListener('click', function () { openPurchaseVoucherForm(defaultType, null); });
}

async function postPurchaseVoucherRecord(docType, docId) {
  if (!confirm(t('আপনি কি নিশ্চিত এই ভাউচার পোস্ট করতে চান? পোস্ট হয়ে গেলে স্টক/লেজারে এন্ট্রি পড়বে এবং এটা আর বাতিল করা যাবে না।','Are you sure you want to post this voucher? Once posted, stock/ledger entries will be created and this cannot be undone.'))) return;
  try {
    await api('postDocument', { docType: docType, docId: docId });
    showToast(t('পোস্ট হয়েছে ✅','Posted ✅'), 'success');
    if (window.__refreshPurchaseVoucherList) await window.__refreshPurchaseVoucherList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function deletePurchaseVoucherRecord(docType, docId) {
  if (!confirm(t('আপনি কি নিশ্চিত এই ভাউচার ডিলিট করতে চান?','Are you sure you want to delete this voucher?'))) return;
  const config = docType === 'PurchaseReturn'
    ? { sheet:'PurchaseReturn', idField:'PRetID' }
    : { sheet:'PurchaseInvoice', idField:'PIID' };
  try {
    await api('delete', { sheet: config.sheet, idField: config.idField, idValue: docId });
    showToast(t('ডিলিট হয়েছে ✅','Deleted ✅'), 'success');
    if (window.__refreshPurchaseVoucherList) await window.__refreshPurchaseVoucherList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function deletePostedPurchaseVoucher(docType, docId) {
  const config = docType === 'PurchaseReturn'
    ? { sheet:'PurchaseReturn', idField:'PRetID', linesSheet:'PR_Return_Lines', lineIdField:'PRetID' }
    : { sheet:'PurchaseInvoice', idField:'PIID', linesSheet:'PI_Lines', lineIdField:'PIID' };
  await deletePostedVoucherWithAdminAuth(docType, docId, config.sheet, config.idField, config.linesSheet, config.lineIdField, window.__refreshPurchaseVoucherList);
}

/** প্রিভিউ/প্রিন্ট/শেয়ার — একটা প্রিন্ট-উপযোগী ভাউচার নতুন ট্যাবে খুলবে।
 *  "পেজ সেটাপ" ব্রাউজারের নিজস্ব প্রিন্ট ডায়ালগেই থাকে (কাগজের সাইজ/মার্জিন) —
 *  আলাদা করে কাস্টম বানানো সম্ভব না, তাই সেই বাটনও প্রিন্ট ডায়ালগেই নিয়ে যায়। */
async function openPrintableVoucherView(docType, docId) {
  const isSales = docType === 'SalesInvoice' || docType === 'SalesReturn';
  const isReturn = docType === 'PurchaseReturn' || docType === 'SalesReturn';

  const cfg = isSales
    ? { headerSheet: isReturn ? 'SalesReturn' : 'SalesInvoice', idField: isReturn ? 'SRID' : 'SIID', linesSheet: isReturn ? 'SR_Lines' : 'SI_Lines', lineIdField: isReturn ? 'SRID' : 'SIID' }
    : { headerSheet: isReturn ? 'PurchaseReturn' : 'PurchaseInvoice', idField: isReturn ? 'PRetID' : 'PIID', linesSheet: isReturn ? 'PR_Return_Lines' : 'PI_Lines', lineIdField: isReturn ? 'PRetID' : 'PIID' };
  const headerSheet = cfg.headerSheet, idField = cfg.idField, linesSheet = cfg.linesSheet, lineIdField = cfg.lineIdField;

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>

</style></head><body>
  <div class="toolbar">

      <div>${L('ঠিকানা','Address')}: ${escapeHtml(partyAddress || '—')} &nbsp;&nbsp; ${L('মোবাইল','Mobile')}: ${escapeHtml(partyPhone || '—')}</div>

      ${header.SupplierInvoiceDate ? `<div><b>${L('নিঃভাউঃতারিখ','Supplier Voucher Date')}:</b> ${escapeHtml(header.SupplierInvoiceDate)}</div>` : ''}
      ${header.GRNID ? `<div><b>GRN:</b> ${escapeHtml(header.GRNID)}</div>` : ''}

    </div>

  <script>

      if (navigator.share) {

      } else if (navigator.clipboard) {

        alert('তথ্য ক্লিপবোর্ডে কপি হয়েছে — এখন যেকোনো জায়গায় পেস্ট করুন।');

  win.document.write(html);
  win.document.close();
}

async function openPurchaseVoucherForm(defaultType, existingId) {
  const pvData = await cachedListMultiple(['Suppliers', 'Purchasers', 'Items', 'GRN', 'ItemGroups', 'Categories', 'UOM', 'Warehouses']);
  const suppliers = pvData.Suppliers, purchasers = pvData.Purchasers, items = pvData.Items, grns = pvData.GRN,
        groups = pvData.ItemGroups, categories = pvData.Categories, units = pvData.UOM, warehouses = pvData.Warehouses;
  window.__pvItems = items.filter(function (i) { return i.Status !== 'Deleted'; });
  window.__pvItemMap = {}; items.forEach(function (i) { window.__pvItemMap[i.ItemID] = i; });
  window.__pvGroupMap = {}; groups.forEach(function (g) { window.__pvGroupMap[g.GroupID] = g.GroupName; });
  window.__pvCategoryMap = {}; categories.forEach(function (c) { window.__pvCategoryMap[c.CategoryID] = c.CategoryName; });
  window.__pvUnitMap = {}; units.forEach(function (u) { window.__pvUnitMap[u.UOMID] = u; });
  window.__pvGroups = groups.filter(function (g) { return g.Status !== 'Deleted'; });
  window.__pvCategories = categories.filter(function (c) { return c.Status !== 'Deleted'; });
  window.__pvUnits = units;

  const isEdit = !!existingId;
  let existingHeader = null, existingLines = [];
  let type = defaultType || 'PurchaseInvoice';

  if (isEdit) {
    const config = type === 'PurchaseReturn'
      ? { headerSheet:'PurchaseReturn', idField:'PRetID', linesSheet:'PR_Return_Lines', lineIdField:'PRetID', idValue: existingId }
      : { headerSheet:'PurchaseInvoice', idField:'PIID', linesSheet:'PI_Lines', lineIdField:'PIID', idValue: existingId };
    let doc;
    try {
      doc = await api('getDocument', config);
    } catch (err) {
      showToast(err.message, 'error');
      return;
    }
    existingHeader = doc.header;
    existingLines = doc.lines;
    if (existingHeader.Status === 'Posted') {
      showToast(t('পোস্ট হয়ে যাওয়া ভাউচার এডিট করা যাবে না।','A posted voucher cannot be edited.'), 'error');
      return;
    }
  }

  window.__pvLineRows = isEdit
    ? existingLines.map(function (l) { return { itemId: l.ItemID, qty: l.Quantity, rate: l.Rate, pieces: l.Pieces }; })
    : [{}];

  function opts(list, idF, labelF, selected) {
    return list.filter(function (r) { return r.Status !== 'Deleted'; })
      .map(function (r) { return `<option value="${attr(r[idF])}" ${selected===r[idF]?'selected':''}>${escapeHtml(r[labelF])}</option>`; }).join('');
  }

  const rec = existingHeader || {};
  const bodyHtml = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
      <div class="field"><label>${t('ইনভয়েস টাইপ','Invoice Type')}</label>
        <select id="pv_Type" ${isEdit?'disabled':''}>
          <option value="PurchaseInvoice" ${type!=='PurchaseReturn'?'selected':''}>${t('ক্রয় ভাউচার','Purchase Voucher')}</option>
          <option value="PurchaseReturn" ${type==='PurchaseReturn'?'selected':''}>${t('ক্রয় ফেরত ভাউচার','Purchase Return Voucher')}</option>
        </select>
      </div>
      <div class="field"><label>${t('তারিখ','Date')}</label><input type="date" id="pv_Date" value="${attr(rec.InvoiceDate || rec.Date) || new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>${t('ভাউচার নম্বর','Voucher No')}</label><input id="pv_VoucherNo" value="${isEdit ? attr(existingId) : t('অটো তৈরি হবে','Will be auto-generated')}" readonly style="background:var(--bg);"></div>
      <div class="field" id="pv_GRNField" style="display:none;"><label>${t('GRN রেফারেন্স','GRN Reference')}</label><select id="pv_GRNID"><option value="">—</option>${opts(grns, 'GRNID', 'GRNID', rec.GRNID)}</select></div>
      <div class="field" id="pv_WarehouseField"><label>${t('গুদাম','Warehouse')}</label><select id="pv_WarehouseID"><option value="">—</option>${opts(warehouses, 'WarehouseID', 'WarehouseName', rec.WarehouseID)}</select></div>
      <div class="field"><label>${t('নিঃভাউঃতারিখ (ঐচ্ছিক)','Supplier Voucher Date (optional)')}</label><input type="date" id="pv_SupplierInvoiceDate" value="${attr(rec.SupplierInvoiceDate)}"></div>
      <div class="field"><label>${t('নিঃভাউঃনম্বর (ঐচ্ছিক)','Supplier Voucher No (optional)')}</label><input id="pv_SupplierInvoiceNo" value="${attr(rec.SupplierInvoiceNo)}"></div>
      <div class="field"><label>${t('সাপ্লায়ার নাম','Supplier Name')}</label><select id="pv_SupplierID"><option value="">—</option>${suppliers.filter(function(r){return r.Status!=='Deleted';}).map(function(r){const label=(r.CompanyName||r.Name)+(r.Zone?' — '+r.Zone:'');return `<option value="${attr(r.SupplierID)}" ${rec.SupplierID===r.SupplierID?'selected':''}>${escapeHtml(label)}</option>`;}).join('')}</select></div>
      <div class="field"><label>${t('ক্রয়কারী','Purchaser')}</label>
        <div style="display:flex;gap:8px;">
          <select id="pv_PurchaserID" style="flex:1;min-width:0;"><option value="">—</option>${opts(purchasers, 'PurchaserID', 'PurchaserName', rec.PurchaserID)}</select>
          <button type="button" id="pv_AddPurchaserBtn" class="btn" style="width:auto;padding:0 14px;flex-shrink:0;" title="${t('নতুন ক্রয়কারী যোগ করুন','Add new purchaser')}">+</button>
        </div>
      </div>
    </div>
    <div id="pv_ReasonField" style="display:none;margin-top:14px;"><div class="field"><label>${t('কারণ','Reason')}</label><input id="pv_Reason" value="${attr(rec.Reason)}"></div></div>

    <h4 style="margin:20px 0 10px;font-size:13px;color:var(--text-muted);text-transform:uppercase;border-top:1px solid var(--border);padding-top:14px;">${t('লাইন আইটেম','Line Items')}</h4>
