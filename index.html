/** প্রসেসিং ভাউচারের সারাংশ শেয়ার — মোবাইলে শেয়ার শিট, ডেস্কটপে ক্লিপবোর্ডে কপি */
async function shareProcessingVoucher(docId) {
  const h = collectProcessingForm().header;
  const itemMap = window.__procItemMap || {};
  const nm = function (id) { return (itemMap[id] && itemMap[id].ItemName) || id || '—'; };
  const text = 'প্রসেসিং ভাউচার' + (docId ? ' ' + docId : ' (খসড়া)') + '\n' +
    'তারিখ: ' + formatShortDate(h.Date) + '\n' +
    'কাঁচামাল: ' + nm(h.RawMaterialItemID) + ' — ' + h.RawMaterialQty + ' কেজি @ ' + h.RawMaterialRate.toFixed(2) + '\n' +
    'প্রস্তুত পণ্য: ' + nm(h.FinishedGoodsItemID) + ' — ' + h.NetWeight.toFixed(3) + ' কেজি, ' + h.Pieces + ' পিস\n' +
    'প্রতি কেজি দর: ' + h.RatePerKg.toFixed(2) + ', প্রতি পিস দর: ' + h.RatePerPiece.toFixed(2) + '\n' +
    'নেট মূল্য: ' + h.NetValue.toFixed(2);
  if (navigator.share) {
    try { await navigator.share({ title: 'প্রসেসিং ভাউচার', text: text }); } catch (e) {}
  } else if (navigator.clipboard) {
    await navigator.clipboard.writeText(text);
    showToast(t('তথ্য ক্লিপবোর্ডে কপি হয়েছে — যেকোনো জায়গায় পেস্ট করুন।','Copied to clipboard — paste it anywhere.'), 'success');
  }
}

window.recalcProcessing = function () {
  const qty = Number(val('pv_Qty')) || 0;
  const rmRate = Number(val('pv_RMRate')) || 0;
  const procRate = Number(val('pv_ProcRate')) || 0;

  const rmValue = qty * rmRate;
  const procValue = qty * procRate;
  const total = rmValue + procValue;

  document.getElementById('pv_RMValue').value = rmValue.toFixed(2);
  document.getElementById('pv_ProcValue').value = procValue.toFixed(2);
  document.getElementById('pv_Total').value = total.toFixed(2);

  let bpQtySum = 0, bpValueSum = 0;
  (window.__procByProductRows || []).forEach(function (_, idx) {
    const bpQty = Number(val('pv_bp_' + idx + '_qty')) || 0;
    const bpRate = Number(val('pv_bp_' + idx + '_rate')) || 0;
    const bpValue = bpQty * bpRate;
    bpQtySum += bpQty;
    bpValueSum += bpValue;
    const valEl = document.getElementById('pv_bp_' + idx + '_val');
    if (valEl) valEl.textContent = bpValue.toFixed(2);
  });

  const netWeight = qty - bpQtySum;
  const netValue = total - bpValueSum;
  document.getElementById('pv_NetWeight').value = netWeight.toFixed(3);
  document.getElementById('pv_NetValue').value = netValue.toFixed(2);

  const pieces = Number(val('pv_Pieces')) || 0;
  document.getElementById('pv_RatePerKg').value = netWeight > 0 ? (netValue / netWeight).toFixed(2) : '0.00';
  document.getElementById('pv_RatePerPiece').value = pieces > 0 ? (netValue / pieces).toFixed(2) : '0.00';

  // লাভ = বিক্রয় মূল্য − নেট খরচ। কেজি বিক্রয় দর দিলে সেটা ধরে, না দিলে পিস বিক্রয় দর ধরে।
  const saleKg = Number(val('pv_SaleRatePerKg')) || 0;
  const salePc = Number(val('pv_SaleRatePerPiece')) || 0;
  const profitEl = document.getElementById('pv_Profit');
  const hintEl = document.getElementById('pv_ProfitHint');
  let profit = 0, hint = '';
  if (saleKg > 0) { profit = saleKg * netWeight - netValue; hint = t('কেজি বিক্রয় দর অনুযায়ী','Based on sale rate per kg'); }
  else if (salePc > 0) { profit = salePc * pieces - netValue; hint = t('পিস বিক্রয় দর অনুযায়ী','Based on sale rate per piece'); }
  if (profitEl) {
    profitEl.value = profit.toFixed(2);
    profitEl.style.color = profit < 0 ? 'var(--danger, #c0392b)' : '';
  }
  if (hintEl) hintEl.textContent = profit < 0 ? t('ক্ষতি — ', 'Loss — ') + hint : hint;
};

      cachedList('Suppliers'), cachedList('Users')

    const purMap = {}; users.forEach(function (u) { purMap[u.UserID] = u.FullName; });

    const merged = invoices.filter(function (r) { return r.Status !== 'Deleted'; }).map(function (r) {
      return { type:'PurchaseInvoice', typeLabel:['ক্রয় ভাউচার','Purchase Voucher'], id:r.PIID, date:r.InvoiceDate, supplierId:r.SupplierID, walkInName:r.WalkInPartyName, purchaserId:r.PurchaserID, amount:r.TotalAmount, status:r.Status };
    }).concat(returns.filter(function (r) { return r.Status !== 'Deleted'; }).map(function (r) {
      return { type:'PurchaseReturn', typeLabel:['ক্রয় ফেরত ভাউচার','Purchase Return Voucher'], id:r.PRetID, date:r.Date, supplierId:r.SupplierID, purchaserId:r.PurchaserID, amount:null, status:r.Status };
    }));

    const headers = [['টাইপ','Type'],['ভাউচার নম্বর','Voucher No'],['তারিখ','Date'],['সাপ্লায়ার','Supplier'],['ক্রয়কারী','Purchaser'],['মূল্য','Amount'],['অবস্থা','Status']];

    const bodyRows = merged.slice().reverse().map(function (r) {

        ? `<button onclick='openPurchaseVoucherForm(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('সম্পাদনা','Edit')}">

          </button>`
        : '';
      const deleteBtn = !isPosted
        ? `<button onclick='deletePurchaseVoucherRecord(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('ডিলিট','Delete')}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>

        <td>${t(r.typeLabel[0], r.typeLabel[1])}</td><td>${escapeHtml(r.id)}</td><td>${escapeHtml(r.date)}</td>
        <td>${escapeHtml(r.supplierId === 'SUP-CASH' && r.walkInName ? ('নগদ (' + r.walkInName + ')') : (supMap[r.supplierId] || r.supplierId))}</td><td>${escapeHtml(purMap[r.purchaserId] || '—')}</td>

  }

  await loadList();

    const map = { '0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯' };

  const voucherTableBody = buildVoucherTableBody({

/** ডেস্কটপে যেকোনো ফর্মে Enter চাপলে পরের ইনপুট ফিল্ডে, Escape চাপলে আগের
 *  ফিল্ডে ফোকাস যাবে — শুধু দৃশ্যমান ও সক্রিয় (disabled নয়) input/select/textarea
 *  ধরে, checkbox বাদ দিয়ে (checkbox নিজের স্বাভাবিক Space/click আচরণ রাখবে)। */
function wireSequentialKeyNav(container) {
  if (!container) return;
  function focusable() {
    return Array.from(container.querySelectorAll('input, select, textarea')).filter(function (el) {
      return !el.disabled && el.type !== 'checkbox' && el.offsetParent !== null;
    });
  }
  function handler(e) {
    if (e.key !== 'Enter' && e.key !== 'Escape') return;
    if (!document.body.contains(container)) { document.removeEventListener('keydown', handler, true); return; }
    if (!container.contains(document.activeElement)) return;
    if (document.activeElement.tagName === 'TEXTAREA' && e.key === 'Enter') return; // টেক্সট-এরিয়াতে Enter মানে নতুন লাইন
    const fields = focusable();
    const idx = fields.indexOf(document.activeElement);
    if (idx === -1) return;
    e.preventDefault();
    if (e.key === 'Enter') {
      const next = fields[idx + 1];
      if (next) next.focus();
    } else {
      const prev = fields[idx - 1];
      if (prev) prev.focus();
    }
  }
  document.addEventListener('keydown', handler, true);
}

  openModal({
    title: (isEdit ? t('সম্পাদনা — ','Edit — ') : t('নতুন — ','New — ')) + t('ক্রয় ভাউচার','Purchase Voucher'),
    bodyHtml: bodyHtml,
    wide: true,
    onSave: async function () {
      const supplierId = val('pv3_SupplierID');
      if (!supplierId) throw new Error(t('সাপ্লায়ার তথ্য আবশ্যক।','Supplier information is required.'));

      const hasPurchase = window.__pv3PurchaseLines.length > 0;
      const hasReturn = window.__pv3ReturnLines.length > 0;
      if (!hasPurchase && !hasReturn) throw new Error(t('অন্তত একটা ক্রয় বা ফেরত লাইন যোগ করুন।','Add at least one purchase or return line.'));

      const isCash = supplierId === 'SUP-CASH';
      const common = {
        SupplierID: supplierId,
        SupplierInvoiceNo: document.getElementById('pv3_SNNoCheck').checked ? (val('pv3_SupplierInvoiceNo') || null) : null,
        SupplierInvoiceDate: document.getElementById('pv3_SNDateCheck').checked ? (val('pv3_SupplierInvoiceDate') || null) : null,
        PurchaserID: currentUser ? currentUser.UserID : null
      };

      if (hasPurchase) {
        const warehouseId = window.__pv3PurchaseLines[0].warehouseId;
        if (!warehouseId) throw new Error(t('ক্রয় লাইনে গুদাম আবশ্যক।','Warehouse is required for purchase lines.'));
        const lineData = window.__pv3PurchaseLines.map(function (l) { return { ItemID: l.itemId, Quantity: l.qty, Rate: l.rate, Amount: l.amount, CommissionRate: l.commRate || 0, CommissionAmount: l.commAmount || 0, NetAmount: l.netAmount !== undefined ? l.netAmount : l.amount }; });
        const itemsTotal = lineData.reduce(function (s, l) { return s + (Number(l.Amount) || 0); }, 0);
        const cashExpenseAmount = (window.__pv3CashExpense && window.__pv3CashExpense.amount) || 0;
        const discountAmount = Number(val('pv3_DiscAmount')) || 0;
        // পার্টির হিসাবে বসবে কমিশন বাদ দিয়ে নিট মূল্য + খরচ − ডিসকাউন্ট + ভ্যাট — প্রিন্টের "সর্বমোট"-এর সাথে মিলবে
        const netItemsTotal = lineData.reduce(function (s, l) { return s + (Number(l.NetAmount) || 0); }, 0);
        const vat = window.__pv3GetVat ? window.__pv3GetVat() : { rate: 0, amount: 0 };
        const totalAmount = netItemsTotal + cashExpenseAmount - discountAmount + vat.amount;
        const cashExpenseBreakdown = Object.keys((window.__pv3CashExpense && window.__pv3CashExpense.subAmounts) || {})
          .map(function (catId) { const cat = window.__pv3ExpenseCategories.find(function (c) { return c.ExpCatID === catId; }); const amt = window.__pv3CashExpense.subAmounts[catId]; return (cat && amt > 0) ? (cat.ExpCatName + ': ৳' + amt) : null; })
          .filter(Boolean).join(', ');
        const headerData = Object.assign({}, common, {
          InvoiceDate: val('pv3_Date'), WarehouseID: warehouseId, TotalAmount: totalAmount,
          CashExpenseAmount: cashExpenseAmount || null,
          CashExpenseCategory: null,
          CashExpenseNote: cashExpenseBreakdown || null,
          DiscountAmount: discountAmount || null,
          VatRate: vat.amount ? (vat.rate || null) : null,
          VatAmount: vat.amount || null,
          WalkInPartyName: isCash ? (val('pv3_CashName') || null) : null,
          WalkInPartyAddress: isCash ? (val('pv3_CashAddress') || null) : null,
          WalkInPartyMobile: isCash ? (val('pv3_CashMobile') || null) : null
        });
        // এই মুহূর্তে শুধু পেমেন্টের তথ্য হেডারে সেভ হচ্ছে — আসল লেজার/ব্যাংক-বই পোস্টিং
        // ঘটবে ভাউচারটা "পোস্ট করুন" চাপার সময়, যাতে ড্রাফট অবস্থায় হিসাব না বসে
        if (!isCash) {
          headerData.CashPaidAmount = Number(val('pv3_CashPaidAmount')) || 0;
          headerData.CashPaidNote = val('pv3_CashPaidNote') || null;
          headerData.BankPaidAmount = Number(val('pv3_BankPaidAmount')) || 0;
          if (headerData.BankPaidAmount > 0 && !pv3BankPopupFilled) {
            throw new Error(t('ব্যাংক প্রদানের বিবরণ (পপআপে) পূরণ করুন।','Fill in the bank payment details (in the popup).'));
          }
          headerData.BankPaidNote = val('pv3_BankPaidNote') || null;
          const bankPayMethod = val('pv3_BankPayMethod');
          if (headerData.BankPaidAmount > 0 && bankPayMethod === 'OurBankToSupplierBank') {
            const ourBankId = val('pv3_BankAccID');
            if (!ourBankId) throw new Error(t('আমাদের কোন ব্যাংক থেকে টাকা গেল, সেটা বাছাই করুন।','Select which of our banks the money was sent from.'));
            headerData.BankAccIDForPayment = ourBankId;
          } else if (headerData.BankPaidAmount > 0) {
            headerData.BankAccIDForPayment = 'BC-CASH'; // নগদ টু সাপ্লায়ার ব্যাংক — আমাদের ক্যাশ অ্যাকাউন্ট থেকে যাবে
          } else {
            headerData.BankAccIDForPayment = null;
          }
        }

        if (isEdit && existingDocType === 'PurchaseInvoice') {
          await api('updateDocument', { headerSheet:'PurchaseInvoice', idField:'PIID', linesSheet:'PI_Lines', lineIdField:'PIID', idValue: existingId, headerData: headerData, lines: lineData });
        } else {
          await api('createDocument', { headerSheet:'PurchaseInvoice', idField:'PIID', idPrefix:'PI', requiredFields:['SupplierID','WarehouseID'], linesSheet:'PI_Lines', lineIdField:'PIID', headerData: headerData, lines: lineData });
        }
      }

      if (hasReturn) {
        const warehouseId = window.__pv3ReturnLines[0].warehouseId;
        if (!warehouseId) throw new Error(t('ফেরত লাইনে গুদাম আবশ্যক।','Warehouse is required for return lines.'));
        const lineData = window.__pv3ReturnLines.map(function (l) { return { ItemID: l.itemId, Quantity: l.qty, Rate: l.rate, CommissionRate: l.commRate || 0, CommissionAmount: l.commAmount || 0, NetAmount: l.netAmount !== undefined ? l.netAmount : l.amount }; });
        const headerData = Object.assign({}, common, { Date: val('pv3_Date'), WarehouseID: warehouseId });
        if (isEdit && existingDocType === 'PurchaseReturn') {
          await api('updateDocument', { headerSheet:'PurchaseReturn', idField:'PRetID', linesSheet:'PR_Return_Lines', lineIdField:'PRetID', idValue: existingId, headerData: headerData, lines: lineData });
        } else {
          await api('createDocument', { headerSheet:'PurchaseReturn', idField:'PRetID', idPrefix:'PRET', requiredFields:['SupplierID','WarehouseID'], linesSheet:'PR_Return_Lines', lineIdField:'PRetID', headerData: headerData, lines: lineData });
        }
      }

      showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
      if (window.__refreshPurchaseVoucherList) await window.__refreshPurchaseVoucherList();
    }
  });

      entryBtn.style.borderBottomColor = 'transparent'; entryBtn.style.color = 'var(--text-muted)';

  function wireRevealCheckbox(checkId, fieldId) {
    const check = document.getElementById(checkId), field = document.getElementById(fieldId);
    function sync() {
      field.disabled = !check.checked;
      field.style.display = check.checked ? '' : 'none';
      if (!check.checked) field.value = '';
    }
    check.addEventListener('change', sync);
    sync();
  }
  wireRevealCheckbox('pv3_SNDateCheck', 'pv3_SupplierInvoiceDate');
  wireRevealCheckbox('pv3_SNNoCheck', 'pv3_SupplierInvoiceNo');
  wireRevealCheckbox('pv3_StdPurchaseCheck', 'pv3_PreviewStdPurchaseRate');

  function refreshPv3SupplierOptions() {
    const zoneChecked = document.getElementById('pv3_ZoneCheck').checked;
    const zone = zoneChecked ? val('pv3_ZoneFilter') : '';
    const sel = document.getElementById('pv3_SupplierID');
    const prev = sel.value;
    Array.from(sel.options).forEach(function (opt) {
      if (!opt.value) return; // "—" অপশনটা সবসময় দেখা যাবে
      opt.hidden = !!(zone && opt.getAttribute('data-zone') !== zone);
    });
    if (zone && sel.options[sel.selectedIndex] && sel.options[sel.selectedIndex].hidden) { sel.value = ''; sel.dispatchEvent(new Event('change')); }
  }
  document.getElementById('pv3_ZoneCheck').addEventListener('change', function () {
    document.getElementById('pv3_ZoneFilter').disabled = !this.checked;
    refreshPv3SupplierOptions();
  });
  document.getElementById('pv3_ZoneFilter').addEventListener('change', refreshPv3SupplierOptions);

  // "খরচ(+)ঃ" — চেকবক্স টিক না থাকলেও এই ঘরে সরাসরি একটামাত্র (লাম্প-সাম) পরিমাণ
  // লেখা যাবে; টিক দিলে নিচে খাত-ভিত্তিক ভাঙন দেখা যাবে এবং প্রতিটা খাতের
  // পরিমাণ যোগ হয়ে এই উপরের ঘরেই স্বয়ংক্রিয়ভাবে বসে যাবে
  function pv3RecalcExpenseTotal() {
    if (!document.getElementById('pv3_ExpCheck').checked) return; // ম্যানুয়াল মোডে থাকলে হাত দেওয়া হবে না
    const rows = document.querySelectorAll('#pv3_ExpSubWrap [data-exp-amount]');
    let sum = 0;
    rows.forEach(function (inp) { sum += Number(inp.value) || 0; });
    document.getElementById('pv3_ExpTotalAmount').value = sum || '';
    window.__pv3CashExpense.amount = sum;
  }

    overlay.innerHTML = `

          </select>

        <div style="display:flex;gap:8px;margin-top:16px;">
          <button type="button" id="pv3_PopCancel" class="btn" style="flex:1;">${t('বাতিল','Cancel')}</button>
          <button type="button" id="pv3_PopConfirm" data-order="3" class="btn btn-primary" style="flex:1;">${t('নিশ্চিত করুন','Confirm')}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    function togglePopOurBank() {
      document.getElementById('pv3_PopOurBankField').style.display = document.getElementById('pv3_PopMethod').value === 'OurBankToSupplierBank' ? '' : 'none';
    }
    document.getElementById('pv3_PopMethod').addEventListener('change', togglePopOurBank);
    togglePopOurBank();

    // ডেস্কটপে কীবোর্ড দিয়ে দ্রুত চলাচল: Enter = পরের ঘর, Escape = আগের ঘর
    // document-এ capture-phase-এ শোনা হচ্ছে যাতে <select>-এর নিজস্ব কীবোর্ড
    // আচরণ (কোনো কোনো ব্রাউজারে) মাঝপথে আটকে না দেয়; পপআপ বন্ধ হলে সরিয়ে ফেলা হয়
    function focusableFields() {
      return Array.from(overlay.querySelectorAll('[data-order]')).filter(function (el) { return el.offsetParent !== null; });
    }
    function keyNavHandler(e) {
      if (e.key !== 'Enter' && e.key !== 'Escape') return;
      if (!overlay.contains(document.activeElement)) return;
      const fields = focusableFields();
      const curIdx = fields.indexOf(document.activeElement);
      if (curIdx === -1) return;
      e.preventDefault();
      e.stopPropagation();
      if (e.key === 'Enter') {
        const next = fields[curIdx + 1];
        if (next) { next.focus(); } else { document.getElementById('pv3_PopConfirm').click(); }
      } else {
        const prev = fields[curIdx - 1];
        if (prev) prev.focus(); else document.getElementById('pv3_PopCancel').click();
      }
    }
    document.addEventListener('keydown', keyNavHandler, true);
    function closePopup() {
      document.removeEventListener('keydown', keyNavHandler, true);
      overlay.remove();
    }

    document.getElementById('pv3_PopCancel').addEventListener('click', function () {

      document.getElementById('pv3_BankPayMethod').value = method;
      document.getElementById('pv3_BankAccID').value = method === 'OurBankToSupplierBank' ? ourBank : '';
      document.getElementById('pv3_BankPaidNote').value = note;
      pv3BankPopupFilled = true;
      updateBankPaySummary();
      closePopup();
    });
    setTimeout(function () { document.getElementById('pv3_PopMethod').focus(); }, 0);
  }

  // ভ্যাট — চেকবক্স দিয়ে ঐচ্ছিক। % লিখলে পরিমাণ নিজে থেকে হিসাব হবে (নিট মোটের উপর),

  window.__pv3VatManual = !!(rec.VatAmount && !rec.VatRate);
  function pv3VatBase() {
    const net = window.__pv3PurchaseLines.reduce(function (s, l) { return s + (Number(l.netAmount !== undefined ? l.netAmount : l.amount) || 0); }, 0);
    const exp = (window.__pv3CashExpense && window.__pv3CashExpense.amount) || 0;
    return net + exp - (Number(val('pv3_DiscAmount')) || 0);
  }
  window.__pv3GetVat = function () {
    if (!document.getElementById('pv3_VatCheck').checked) return { rate: 0, amount: 0 };
    const rate = Number(val('pv3_VatRate')) || 0;
    let amount = Number(val('pv3_VatAmount')) || 0;
    if (!window.__pv3VatManual && rate > 0) {
      amount = Math.round(pv3VatBase() * rate) / 100;
      document.getElementById('pv3_VatAmount').value = amount || '';
    }
    return { rate: rate, amount: amount };
  };

  function collectCurrentLine() {
    const itemId = val('pv3_ItemID');
    const warehouseId = val('pv3_WarehouseID');
    const qty = Number(val('pv3_Qty')) || 0;
    const rate = Number(val('pv3_Rate')) || 0;
    if (!itemId) { showToast(t('আইটেম বাছাই করুন।','Select an item.'), 'error'); return null; }
    if (!warehouseId) { showToast(t('গুদাম বাছাই করুন।','Select a warehouse.'), 'error'); return null; }
    if (!(qty > 0 && rate > 0)) { showToast(t('পরিমাণ ও দর দিন।','Enter quantity and rate.'), 'error'); return null; }
    const amount = Math.round(qty * rate);
    const useComm = document.getElementById('pv3_CommCheck').checked;
    const commRate = useComm ? (Number(val('pv3_CommRate')) || 0) : 0;
    const commAmount = useComm ? Number((amount * commRate / 100).toFixed(2)) : 0;
    return { itemId: itemId, warehouseId: warehouseId, qty: qty, rate: rate, amount: amount, commRate: commRate, commAmount: commAmount, netAmount: useComm ? Number((amount - commAmount).toFixed(2)) : amount };
  }

  document.getElementById('pv3_ConfirmPurchaseCheck').addEventListener('change', function () {
    if (!this.checked) return;
    const line = collectCurrentLine();
    if (!line) { this.checked = false; return; }
    window.__pv3PurchaseLines.push(line);
    resetLineEntry();
    this.checked = false;
    renderRightSummary();
    showToast(t('ক্রয় লাইন যোগ হয়েছে ✅','Purchase line added ✅'), 'success');
  });
  document.getElementById('pv3_AddReturnLineBtn').addEventListener('click', function () {
    const line = collectCurrentLine();
    if (!line) return;
    window.__pv3ReturnLines.push(line);
    resetLineEntry();
    renderRightSummary();
    showToast(t('ক্রয় ফেরত লাইন যোগ হয়েছে ✅','Purchase return line added ✅'), 'success');
  });

  window.__pv3RemovePurchaseLine = function (i) { window.__pv3PurchaseLines.splice(i, 1); renderRightSummary(); renderFullPreview(); };
  window.__pv3RemoveReturnLine = function (i) { window.__pv3ReturnLines.splice(i, 1); renderRightSummary(); renderFullPreview(); };

  function kgPcsTotals(lines) {
    let kg = 0, pcs = 0;
    lines.forEach(function (l) {
      const item = window.__pv3ItemMap[l.itemId] || {};
      const unitName = (window.__pv3UnitMap[item.UOMID] || {}).UOMName || '';
      if (unitName.indexOf('কেজি') !== -1 || unitName.toLowerCase().indexOf('kg') !== -1) kg += l.qty;
      else if (unitName.indexOf('পিস') !== -1 || unitName.toLowerCase().indexOf('pc') !== -1) pcs += l.qty;
    });
    return { kg: kg, pcs: pcs };
  }

  function renderRightSummary() {
    document.getElementById('pv3_PreviewStockQty').value = window.__pv3LastStockQty;
    document.getElementById('pv3_PreviewStockRate').value = window.__pv3LastStockRate;
  }

  function miniLinesTable(lines, removeFnName, showComm) {
    if (lines.length === 0) return `<div style="color:var(--text-muted);padding:8px 0;">${t('কোনো লাইন নেই।','No lines.')}</div>`;
    const rows = lines.map(function (l, i) {
      const item = window.__pv3ItemMap[l.itemId] || {};
      return `<tr>
        <td>${i + 1}</td><td>${escapeHtml(item.ItemName || l.itemId)}</td>
        <td style="text-align:right;">${l.qty}</td><td style="text-align:right;">${l.rate}</td><td style="text-align:right;"><b>${l.amount}</b></td>
        ${showComm ? `<td style="text-align:right;">${l.commRate || 0}</td><td style="text-align:right;">${(l.commAmount||0).toFixed ? l.commAmount.toFixed(2) : l.commAmount}</td><td style="text-align:right;"><b>${(l.netAmount!==undefined?l.netAmount:l.amount).toFixed ? l.netAmount.toFixed(2) : l.netAmount}</b></td>` : ''}
        <td><button type="button" onclick="${removeFnName}(${i})" style="border:none;background:none;cursor:pointer;color:var(--danger);">✕</button></td>
      </tr>`;
    }).join('');
    return `<table style="width:100%;border-collapse:collapse;font-size:12px;">
      <thead><tr style="border-bottom:1px solid var(--border);"><th style="text-align:left;">${t('ক্রঃ','No.')}</th><th style="text-align:left;">${t('আইটেম','Item')}</th><th style="text-align:right;">${t('পরিমাণ','Qty')}</th><th style="text-align:right;">${t('দর','Rate')}</th><th style="text-align:right;">${t('মূল্য','Amt')}</th>${showComm ? `<th style="text-align:right;">${t('কমিঃ','Comm.')}</th><th style="text-align:right;">${t('(-)কমিঃ','(-)Comm.')}</th><th style="text-align:right;">${t('নিট মূল্য','Net Amt')}</th>` : ''}<th></th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }

  async function buildDraftPrintHtml() {
    const supplierId = val('pv3_SupplierID');
    const isCash = supplierId === 'SUP-CASH';
    const supplierRec = window.__pv3SupplierMap[supplierId];
    const supplierName = isCash ? ('নগদ' + (val('pv3_CashName') ? ' (' + val('pv3_CashName') + ')' : '')) : (supplierRec ? (supplierRec.CompanyName || supplierRec.Name) : '—');
    const supplierZone = isCash ? '' : ((supplierRec && supplierRec.Zone) || '');
    const supplierAddress = isCash ? val('pv3_CashAddress') : ((supplierRec && supplierRec.Address) || '');
    const supplierPhone = isCash ? val('pv3_CashMobile') : ((supplierRec && supplierRec.Phone) || '');
    const company = await api('getSingleton', { sheet:'CompanyProfile' });
    const cashExpenseAmt = (window.__pv3CashExpense && window.__pv3CashExpense.amount) || 0;
    const discountAmt = Number(val('pv3_DiscAmount')) || 0;
    const manualDate = document.getElementById('pv3_SNDateCheck').checked ? val('pv3_SupplierInvoiceDate') : '';
    const manualNo = document.getElementById('pv3_SNNoCheck').checked ? val('pv3_SupplierInvoiceNo') : '';

    const draftVat = window.__pv3GetVat ? window.__pv3GetVat() : { rate: 0, amount: 0 };
    return buildVoucherTableHtml({
      titleBn: 'ক্রয় ভাউচার', company: company,
      voucherDate: val('pv3_Date'), voucherNo: t('অটো তৈরি হবে','Auto'),
      manualDate: manualDate, manualNo: manualNo,
      partyLabelBn: 'সাপ্লায়ার নামঃ', partyName: supplierName, partyZone: supplierZone, partyAddress: supplierAddress, partyPhone: supplierPhone,
      mainLines: window.__pv3PurchaseLines, mainLabel: 'ক্রয়', mainTotalLabel: 'মোটঃ ক্রয়ঃ',
      returnLines: window.__pv3ReturnLines, returnLabel: 'ক্রয় ফেরত পণ্যঃ', returnTotalLabel: 'মোটঃ ফেরতঃ',
      itemMap: window.__pv3ItemMap, cashExpenseAmt: cashExpenseAmt, discountAmt: discountAmt,
      vatRate: draftVat.rate, vatAmount: draftVat.amount,
      isCashParty: isCash, prevDue: isCash ? 0 : -(window.__pv3PartyBalance || 0),
      cashPaid: isCash ? 0 : (Number(val('pv3_CashPaidAmount')) || 0), bankPaid: isCash ? 0 : (Number(val('pv3_BankPaidAmount')) || 0),
      payCashLabel: 'নগদ প্রদানঃ', payBankLabel: 'ব্যাংক প্রদানঃ',
      sign1: 'বিক্রেতার স্বাঃ', sign3Label: 'ক্রয়কারী স্বাঃ', isDraft: true
    });
  }

  async function renderFullPreview() {
    const wrap = document.getElementById('pv3_LivePreviewBody');
    if (!wrap) return;
    if (window.__pv3PurchaseLines.length === 0 && window.__pv3ReturnLines.length === 0) {
      wrap.innerHTML = `<div class="empty-state">${t('অন্তত একটা লাইন যোগ করলে প্রিভিউ দেখা যাবে।','Add at least one line to see the preview.')}</div>`;
      return;
    }
    const html = await buildDraftPrintHtml();
    wrap.innerHTML = `<iframe id="pv3_PreviewFrame" style="width:100%;height:70vh;border:1px solid var(--border);border-radius:8px;background:#fff;" srcdoc="${attr(html)}"></iframe>`;
  }

  function printDraftFrame() {
    const frame = document.getElementById('pv3_PreviewFrame');
    if (!frame || !frame.contentWindow) { showToast(t('প্রিন্ট করার জন্য অন্তত একটা লাইন যোগ করুন।','Add at least one line to print.'), 'error'); return; }
    frame.contentWindow.focus();
    frame.contentWindow.print();
  }
  async function shareDraft() {
    if (window.__pv3PurchaseLines.length === 0 && window.__pv3ReturnLines.length === 0) {
      showToast(t('শেয়ার করার জন্য অন্তত একটা লাইন যোগ করুন।','Add at least one line to share.'), 'error');
      return;
    }
    const purchaseTotal = window.__pv3PurchaseLines.reduce(function (s, l) { return s + (Number(l.amount) || 0); }, 0);
    const returnTotal = window.__pv3ReturnLines.reduce(function (s, l) { return s + (Number(l.amount) || 0); }, 0);
    const cashExpenseAmt = (window.__pv3CashExpense && window.__pv3CashExpense.amount) || 0;
    const discountAmt = Number(val('pv3_DiscAmount')) || 0;
    const text = 'ক্রয় ভাউচার — নিট মোট: ৳ ' + (purchaseTotal + cashExpenseAmt - discountAmt - returnTotal).toFixed(2);
    if (navigator.share) {
      try { await navigator.share({ title: 'ক্রয় ভাউচার', text: text }); } catch (e) {}
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(text);
      showToast(t('তথ্য ক্লিপবোর্ডে কপি হয়েছে।','Copied to clipboard.'), 'success');
    }
  }
  document.getElementById('pv3_LivePageSetupBtn').addEventListener('click', printDraftFrame);
  document.getElementById('pv3_LivePrintBtn').addEventListener('click', printDraftFrame);
  document.getElementById('pv3_LiveShareBtn').addEventListener('click', shareDraft);

  renderRightSummary();
  showTab('entry');
}
async function renderSalesVoucherPage(content, defaultType) {

    <div class="page-head"><div>
        <h1 class="i18n" data-bn="বিক্রয় ভাউচার" data-en="Sales Voucher">${t('বিক্রয় ভাউচার','Sales Voucher')}</h1>
        <p class="i18n" data-bn="বিক্রয় ও বিক্রয় ফেরত — একই জায়গা থেকে" data-en="Sales and sales return — from one place">${t('বিক্রয় ও বিক্রয় ফেরত — একই জায়গা থেকে','Sales and sales return — from one place')}</p>
      </div>
      <button class="btn btn-primary i18n" style="width:auto;" id="svAddBtn" data-bn="+ নতুন যোগ করুন" data-en="+ Add New">${t('+ নতুন যোগ করুন','+ Add New')}</button></div>
    <div class="panel"><div id="svTableWrap"></div></div>`;

  async function loadList() {

      api('list', { sheet:'SalesInvoice' }), api('list', { sheet:'SalesReturn' }),
      cachedList('Customers'), cachedList('Users')
    ]);
    const custMap = {}; customers.forEach(function (c) { custMap[c.CustomerID] = c.CompanyName || c.Name; });
    const slpMap = {}; users.forEach(function (u) { slpMap[u.UserID] = u.FullName; });

    const merged = invoices.filter(function (r) { return r.Status !== 'Deleted'; }).map(function (r) {
      return { type:'SalesInvoice', typeLabel:['বিক্রয় ভাউচার','Sales Voucher'], id:r.SIID, date:r.InvoiceDate, customerId:r.CustomerID, walkInName:r.WalkInPartyName, salespersonId:r.SalespersonID, amount:r.TotalAmount, status:r.Status };
    }).concat(returns.filter(function (r) { return r.Status !== 'Deleted'; }).map(function (r) {
      return { type:'SalesReturn', typeLabel:['বিক্রয় ফেরত ভাউচার','Sales Return Voucher'], id:r.SRID, date:r.Date, customerId:r.CustomerID, salespersonId:r.SalespersonID, amount:null, status:r.Status };
    }));
    merged.sort(function (a, b) { return String(a.date||'').localeCompare(String(b.date||'')); });

    const wrap = document.getElementById('svTableWrap');
    if (!wrap) return;
    if (merged.length === 0) {
      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এখনো কোনো ভাউচার তৈরি হয়নি।" data-en="No vouchers created yet.">${t('এখনো কোনো ভাউচার তৈরি হয়নি।','No vouchers created yet.')}</div>`;
      return;
    }

    const headers = [['টাইপ','Type'],['ভাউচার নম্বর','Voucher No'],['তারিখ','Date'],['গ্রাহক','Customer'],['বিক্রয়কারী','Salesperson'],['মূল্য','Amount'],['অবস্থা','Status']];
    const headCells = headers.map(function (h) { return `<th class="i18n" data-bn="${h[0]}" data-en="${h[1]}">${t(h[0], h[1])}</th>`; }).join('');
    const bodyRows = merged.slice().reverse().map(function (r) {
      const isPosted = r.status === 'Posted';
      const postBtn = !isPosted
        ? `<button class="btn" style="width:auto;padding:6px 12px;font-size:12px;" onclick='postSalesVoucherRecord(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})'>${t('পোস্ট করুন','Post')}</button>`
        : '';
      const previewBtn = `<button onclick='openPrintableVoucherView(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('প্রিভিউ/প্রিন্ট/শেয়ার','Preview/Print/Share')}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        </button>`;
      const editBtn = !isPosted
        ? `<button onclick='openSalesVoucherForm(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('সম্পাদনা','Edit')}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="m18.5 2.5 3 3L10 17l-4 1 1-4Z"/></svg>
          </button>`
        : '';
      const deleteBtn = !isPosted
        ? `<button onclick='deleteSalesVoucherRecord(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('ডিলিট','Delete')}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
          </button>`
        : (currentUser && currentUser.RoleID === 'ROLE-ADMIN'
            ? `<button onclick='deletePostedSalesVoucher(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('এডমিন ডিলিট (পাসওয়ার্ড লাগবে)','Admin delete (password required)')}" style="color:var(--danger);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </button>`
            : '');
      return `<tr ondblclick='openSalesVoucherForm(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' style="cursor:pointer;" title="${t('এডিট করতে ডাবল-ক্লিক করুন','Double-click to edit')}">
        <td>${t(r.typeLabel[0], r.typeLabel[1])}</td><td>${escapeHtml(r.id)}</td><td>${escapeHtml(r.date)}</td>
        <td>${escapeHtml(r.customerId === 'CUS-CASH' && r.walkInName ? ('নগদ (' + r.walkInName + ')') : (custMap[r.customerId] || r.customerId))}</td><td>${escapeHtml(slpMap[r.salespersonId] || '—')}</td>
        <td>${r.amount !== null ? Number(r.amount).toFixed(2) : '—'}</td>
        <td>${isPosted ? `<span class="badge active">${t('পোস্ট করা','Posted')}</span>` : `<span class="badge draft">${t('খসড়া','Draft')}</span>`}</td>
        <td class="row-actions" onclick="event.stopPropagation();">${postBtn}${previewBtn}${editBtn}${deleteBtn}</td>
      </tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}<th></th></tr></thead><tbody>${bodyRows}</tbody></table>`;
  }

  await loadList();
  window.__refreshSalesVoucherList = loadList;
  document.getElementById('svAddBtn').addEventListener('click', function () { openSalesVoucherForm(defaultType, null); });
}

async function postSalesVoucherRecord(docType, docId) {
  if (!confirm(t('আপনি কি নিশ্চিত এই ভাউচার পোস্ট করতে চান? পোস্ট হয়ে গেলে স্টক/লেজারে এন্ট্রি পড়বে এবং এটা আর বাতিল করা যাবে না।','Are you sure you want to post this voucher? Once posted, stock/ledger entries will be created and this cannot be undone.'))) return;
  try {
    await api('postDocument', { docType: docType, docId: docId });
    showToast(t('পোস্ট হয়েছে ✅','Posted ✅'), 'success');
    if (window.__refreshSalesVoucherList) await window.__refreshSalesVoucherList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function deleteSalesVoucherRecord(docType, docId) {
  if (!confirm(t('আপনি কি নিশ্চিত এই ভাউচার ডিলিট করতে চান?','Are you sure you want to delete this voucher?'))) return;
  const config = docType === 'SalesReturn'
    ? { sheet:'SalesReturn', idField:'SRID' }
    : { sheet:'SalesInvoice', idField:'SIID' };
  try {
    await api('delete', { sheet: config.sheet, idField: config.idField, idValue: docId });

    if (window.__refreshSalesVoucherList) await window.__refreshSalesVoucherList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function deletePostedSalesVoucher(docType, docId) {
  const config = docType === 'SalesReturn'
    ? { sheet:'SalesReturn', idField:'SRID', linesSheet:'SR_Lines', lineIdField:'SRID' }
    : { sheet:'SalesInvoice', idField:'SIID', linesSheet:'SI_Lines', lineIdField:'SIID' };

async function openSalesVoucherForm(defaultType, existingId) {
  const svData = await cachedListMultiple(['Customers', 'Items', 'ItemGroups', 'Categories', 'UOM', 'Warehouses', 'BankCashAccounts', 'ExpenseCategories']);
  const customers = svData.Customers, items = svData.Items,
        groups = svData.ItemGroups, categories = svData.Categories, units = svData.UOM, warehouses = svData.Warehouses,
        bankAccounts = (svData.BankCashAccounts || []).filter(function (b) { return b.Status !== 'Deleted'; });
  window.__sv3ItemMap = {}; items.forEach(function (i) { window.__sv3ItemMap[i.ItemID] = i; });
  window.__sv3Items = items.filter(function (i) { return i.Status !== 'Deleted'; });
  window.__sv3Groups = groups.filter(function (g) { return g.Status !== 'Deleted'; });
  window.__sv3Categories = categories.filter(function (c) { return c.Status !== 'Deleted'; });
  window.__sv3UnitMap = {}; units.forEach(function (u) { window.__sv3UnitMap[u.UOMID] = u; });
  window.__sv3Warehouses = warehouses.filter(function (w) { return w.Status !== 'Deleted'; });
  window.__sv3CustomerMap = {}; customers.forEach(function (c) { window.__sv3CustomerMap[c.CustomerID] = c; });
  window.__sv3ExpenseCategories = (svData.ExpenseCategories || []).filter(function (c) { return c.Status !== 'Deleted'; });
  window.__sv3CashExpense = { amount: 0, subAmounts: {} };
  const sv3ZoneList = Array.from(new Set(customers.filter(function (c) { return c.Status !== 'Deleted' && c.Zone; }).map(function (c) { return c.Zone; }))).sort(function (a, b) { return String(a).localeCompare(String(b), 'bn'); });

  const isEdit = !!existingId;
  let existingHeader = null, existingLines = [], existingDocType = defaultType || 'SalesInvoice';

  if (isEdit) {
    const config = existingDocType === 'SalesReturn'
      ? { headerSheet:'SalesReturn', idField:'SRID', linesSheet:'SR_Lines', lineIdField:'SRID', idValue: existingId }
      : { headerSheet:'SalesInvoice', idField:'SIID', linesSheet:'SI_Lines', lineIdField:'SIID', idValue: existingId };
    let doc;
    try {
      doc = await api('getDocument', config);
    } catch (err) {
      showToast(err.message, 'error');
      return;
    }
    existingHeader = doc.header;
    existingLines = doc.lines;
    if (existingHeader.Status === 'Posted') {
      showToast(t('পোস্ট হয়ে যাওয়া ভাউচার এডিট করা যাবে না।','A posted voucher cannot be edited.'), 'error');
      return;
    }
  }

  const rec = existingHeader || {};
  if (rec.CashExpenseAmount) window.__sv3CashExpense = { amount: Number(rec.CashExpenseAmount) || 0, subAmounts: {} };

  // লাভ হিসাবের জন্য প্রতিটা লাইনের খরচ-দর — সেভ করা থাকলে সেটা, না হলে আইটেমের স্টক দর
  function sv3CostRateOf(l) {
    if (l.CostRate !== null && l.CostRate !== undefined) return Number(l.CostRate) || 0;
    return Number((window.__sv3ItemMap[l.ItemID] || {}).StandardCost) || 0;
  }
  window.__sv3SaleLines = (isEdit && existingDocType === 'SalesInvoice')
    ? existingLines.map(function (l) {
        const amt = Math.round((Number(l.Quantity)||0) * (Number(l.Rate)||0));
        const commAmt = Number(l.CommissionAmount) || 0;
        return { itemId: l.ItemID, warehouseId: rec.WarehouseID, qty: Number(l.Quantity)||0, rate: Number(l.Rate)||0, amount: amt, commRate: Number(l.CommissionRate)||0, commAmount: commAmt, netAmount: l.NetAmount !== null && l.NetAmount !== undefined ? Number(l.NetAmount) : (amt - commAmt), costRate: sv3CostRateOf(l) };
      })
    : [];
  window.__sv3ReturnLines = (isEdit && existingDocType === 'SalesReturn')
    ? existingLines.map(function (l) {

    onSave: async function () {
      const customerId = val('sv3_CustomerID');
      if (!customerId) throw new Error(t('গ্রাহক তথ্য আবশ্যক।','Customer information is required.'));

      const hasSale = window.__sv3SaleLines.length > 0;

      if (!hasSale && !hasReturn) throw new Error(t('অন্তত একটা বিক্রয় বা ফেরত লাইন যোগ করুন।','Add at least one sale or return line.'));

      const isCash = customerId === 'CUS-CASH';
      const common = {
        CustomerID: customerId,
        SalespersonID: currentUser ? currentUser.UserID : null
      };

      if (hasSale) {
        const warehouseId = window.__sv3SaleLines[0].warehouseId;
        if (!warehouseId) throw new Error(t('বিক্রয় লাইনে গুদাম আবশ্যক।','Warehouse is required for sale lines.'));
        const lineData = window.__sv3SaleLines.map(function (l) { return { ItemID: l.itemId, Quantity: l.qty, Rate: l.rate, Amount: l.amount, CommissionRate: l.commRate || 0, CommissionAmount: l.commAmount || 0, NetAmount: l.netAmount !== undefined ? l.netAmount : l.amount, CostRate: l.costRate || 0 }; });
        const itemsTotal = lineData.reduce(function (s, l) { return s + (Number(l.Amount) || 0); }, 0);
        const cashExpenseAmount = (window.__sv3CashExpense && window.__sv3CashExpense.amount) || 0;
        const discountAmount = Number(val('sv3_DiscAmount')) || 0;
        // পার্টির হিসাবে বসবে কমিশন বাদ দিয়ে নিট মূল্য + খরচ − ডিসকাউন্ট + ভ্যাট — প্রিন্টের "সর্বমোট"-এর সাথে মিলবে
        const netItemsTotal = lineData.reduce(function (s, l) { return s + (Number(l.NetAmount) || 0); }, 0);
        const vat = window.__sv3GetVat ? window.__sv3GetVat() : { rate: 0, amount: 0 };
        const totalAmount = netItemsTotal + cashExpenseAmount - discountAmount + vat.amount;
        const cashExpenseBreakdown = Object.keys((window.__sv3CashExpense && window.__sv3CashExpense.subAmounts) || {})
          .map(function (catId) { const cat = window.__sv3ExpenseCategories.find(function (c) { return c.ExpCatID === catId; }); const amt = window.__sv3CashExpense.subAmounts[catId]; return (cat && amt > 0) ? (cat.ExpCatName + ': ৳' + amt) : null; })
          .filter(Boolean).join(', ');
        const headerData = Object.assign({}, common, {
          InvoiceDate: val('sv3_Date'), WarehouseID: warehouseId, TotalAmount: totalAmount,
          CashExpenseAmount: cashExpenseAmount || null,
          CashExpenseCategory: null,
          CashExpenseNote: cashExpenseBreakdown || null,
          DiscountAmount: discountAmount || null,
          VatRate: vat.amount ? (vat.rate || null) : null,
          VatAmount: vat.amount || null,
          ManualVoucherDate: document.getElementById('sv3_ManualDateCheck').checked ? (val('sv3_ManualVoucherDate') || null) : null,
          ManualVoucherNo: document.getElementById('sv3_ManualNoCheck').checked ? (val('sv3_ManualVoucherNo') || null) : null,
          WalkInPartyName: isCash ? (val('sv3_CashName') || null) : null,
          WalkInPartyAddress: isCash ? (val('sv3_CashAddress') || null) : null,
          WalkInPartyMobile: isCash ? (val('sv3_CashMobile') || null) : null
        });
        if (!isCash) {
          headerData.CashReceivedAmount = Number(val('sv3_CashReceivedAmount')) || 0;
          headerData.CashReceivedNote = val('sv3_CashReceivedNote') || null;
          headerData.BankReceivedAmount = Number(val('sv3_BankReceivedAmount')) || 0;

          }
          headerData.BankReceivedNote = val('sv3_BankReceivedNote') || null;
          headerData.BankAccIDForReceipt = headerData.BankReceivedAmount > 0 ? (val('sv3_BankAccID') || null) : null;
        }

        if (isEdit && existingDocType === 'SalesInvoice') {
          await api('updateDocument', { headerSheet:'SalesInvoice', idField:'SIID', linesSheet:'SI_Lines', lineIdField:'SIID', idValue: existingId, headerData: headerData, lines: lineData });
        } else {
          await api('createDocument', { headerSheet:'SalesInvoice', idField:'SIID', idPrefix:'SI', requiredFields:['CustomerID','WarehouseID'], linesSheet:'SI_Lines', lineIdField:'SIID', headerData: headerData, lines: lineData });
        }
      }

      if (hasReturn) {
        const warehouseId = window.__sv3ReturnLines[0].warehouseId;
        if (!warehouseId) throw new Error(t('ফেরত লাইনে গুদাম আবশ্যক।','Warehouse is required for return lines.'));
        const lineData = window.__sv3ReturnLines.map(function (l) { return { ItemID: l.itemId, Quantity: l.qty, Rate: l.rate, CommissionRate: l.commRate || 0, CommissionAmount: l.commAmount || 0, NetAmount: l.netAmount !== undefined ? l.netAmount : l.amount, CostRate: l.costRate || 0 }; });

  // পরিমাণ যোগ হয়ে এই উপরের ঘরেই স্বয়ংক্রিয়ভাবে বসে যাবে
  function sv3RecalcExpenseTotal() {
    if (!document.getElementById('sv3_ExpCheck').checked) return; // ম্যানুয়াল মোডে থাকলে হাত দেওয়া হবে না
    const rows = document.querySelectorAll('#sv3_ExpSubWrap [data-exp-amount]');
    let sum = 0;
    rows.forEach(function (inp) { sum += Number(inp.value) || 0; });
    document.getElementById('sv3_ExpTotalAmount').value = sum || '';
  }

  function sv3RenderExpSubRows() {
    const wrap = document.getElementById('sv3_ExpSubWrap');
    const amounts = window.__sv3CashExpense.subAmounts || {};
    wrap.innerHTML = `
      <div style="border:1px solid var(--border);border-radius:8px;padding:10px;">
        <div id="sv3_ExpSubRows"></div>
        <button type="button" id="sv3_ExpAddCatBtn" class="btn btn-outline" style="width:100%;margin-top:6px;padding:6px;font-size:12px;">➕ ${t('নতুন সাবখাত','New Sub-category')}</button>
      </div>`;
    const rowsWrap = document.getElementById('sv3_ExpSubRows');
    function renderRows() {
      rowsWrap.innerHTML = window.__sv3ExpenseCategories.map(function (c) {
        const amt = amounts[c.ExpCatID] || '';
        return `<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;" data-cat-id="${attr(c.ExpCatID)}">
          <input data-exp-name value="${attr(c.ExpCatName)}" style="flex:1.4;">
          <input data-exp-amount type="number" step="any" value="${amt}" placeholder="৳" style="flex:1;">
          <button type="button" data-exp-save class="btn btn-outline" style="width:auto;padding:5px 8px;" title="${t('নাম সেভ করুন','Save name')}">💾</button>
          <button type="button" data-exp-del class="btn btn-outline" style="width:auto;padding:5px 8px;" title="${t('মুছুন','Delete')}">🗑️</button>
        </div>`;
      }).join('') || `<div style="color:var(--text-muted);font-size:12px;padding:4px 0;">${t('কোনো সাবখাত নেই — নিচে থেকে যোগ করুন।','No sub-categories yet — add one below.')}</div>`;

      rowsWrap.querySelectorAll('[data-exp-amount]').forEach(function (inp) {
        inp.addEventListener('input', function () {
          const catId = this.closest('[data-cat-id]').getAttribute('data-cat-id');
          window.__sv3CashExpense.subAmounts[catId] = Number(this.value) || 0;
          sv3RecalcExpenseTotal();
        });
      });
      rowsWrap.querySelectorAll('[data-exp-save]').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          const row = this.closest('[data-cat-id]');
          const catId = row.getAttribute('data-cat-id');
          const nameInput = row.querySelector('[data-exp-name]');
          const newName = nameInput.value.trim();
          if (!newName) { showToast(t('খাতের নাম দিন।','Enter a category name.'), 'error'); return; }
          try {
            await api('update', { sheet:'ExpenseCategories', idField:'ExpCatID', idValue: catId, data:{ ExpCatName: newName } });
            const cat = window.__sv3ExpenseCategories.find(function (c) { return c.ExpCatID === catId; });
            if (cat) cat.ExpCatName = newName;
            showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
          } catch (err) { showToast(err.message, 'error'); }
        });
      });
      rowsWrap.querySelectorAll('[data-exp-del]').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          const row = this.closest('[data-cat-id]');
          const catId = row.getAttribute('data-cat-id');
          if (!confirm(t('এই সাবখাতটা মুছে ফেলতে চান?','Delete this sub-category?'))) return;
          try {
            await api('delete', { sheet:'ExpenseCategories', idField:'ExpCatID', idValue: catId });
            window.__sv3ExpenseCategories = window.__sv3ExpenseCategories.filter(function (c) { return c.ExpCatID !== catId; });
            delete window.__sv3CashExpense.subAmounts[catId];
            renderRows();
            sv3RecalcExpenseTotal();
            showToast(t('মুছে ফেলা হয়েছে ✅','Deleted ✅'), 'success');
          } catch (err) { showToast(err.message, 'error'); }
        });
      });
    }
    renderRows();

    document.getElementById('sv3_ExpAddCatBtn').addEventListener('click', async function () {
      const name = prompt(t('নতুন সাবখাতের নাম লিখুন:','Enter new sub-category name:'));
      if (!name || !name.trim()) return;
      try {
        const rec2 = await api('create', { sheet:'ExpenseCategories', idField:'ExpCatID', idPrefix:'EXPCAT', requiredFields:['ExpCatName'], data:{ ExpCatName: name.trim() } });
        window.__sv3ExpenseCategories.push(rec2);
        renderRows();
        showToast(t('সাবখাত যোগ হয়েছে ✅','Sub-category added ✅'), 'success');
      } catch (err) { showToast(err.message, 'error'); }
    });
  }

  document.getElementById('sv3_ExpCheck').addEventListener('change', function () {
    const wrap = document.getElementById('sv3_ExpSubWrap');
    wrap.style.display = this.checked ? '' : 'none';
    if (this.checked) {

  if (window.__sv3CashExpense && window.__sv3CashExpense.amount) {

  async function toggleCashCustomer() {
    const customerId = val('sv3_CustomerID');
    const isCash = customerId === 'CUS-CASH';
    document.getElementById('sv3_CashCustomerCard').style.display = isCash ? '' : 'none';
    renderRightSummary();

    const balInput = document.getElementById('sv3_CustomerBalance');

      balInput.value = '';
      window.__sv3PartyBalance = 0;
      return;
    }
    balInput.value = t('লোড হচ্ছে...','Loading...');
    const { data } = await supabaseClient.from('PartyLedger').select('Balance').eq('PartyType', 'Customer').eq('PartyID', customerId).order('id', { ascending: false }).limit(1);
    const balance = (data && data[0]) ? Number(data[0].Balance) || 0 : 0;
    balInput.value = formatAmountDrCr(balance, true);
    window.__sv3PartyBalance = balance;

    const custRec = window.__sv3CustomerMap[customerId];

  function updateBankRecSummary() {
    const summaryEl = document.getElementById('sv3_BankRecSummary');
    const amt = Number(val('sv3_BankReceivedAmount')) || 0;
    if (!summaryEl) return;
    if (amt <= 0) { summaryEl.textContent = t('টাকা লিখলে বিস্তারিত জিজ্ঞাসা করা হবে','Details will be asked once you enter an amount'); return; }
    const bankAccId = val('sv3_BankAccID');
    const bankAccLabel = bankAccId ? (bankAccounts.find(function (b) { return b.BankAccID === bankAccId; }) || {}).AccountName : '';
    summaryEl.textContent = (bankAccLabel || t('ব্যাংক বাছাই করা হয়নি','No bank selected')) + (val('sv3_BankReceivedNote') ? ' — ' + val('sv3_BankReceivedNote') : '');
  }

  let sv3BankPopupFilled = false;
  function openBankReceiptPopup() {
    const amt = Number(val('sv3_BankReceivedAmount')) || 0;
    if (amt <= 0) return;

    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
    const custBankName = val('sv3_CustomerBankName') || t('তথ্য নেই','No info');
    const custBankAcc = val('sv3_CustomerBankAccNo') || t('তথ্য নেই','No info');
    const curBankAcc = val('sv3_BankAccID') || '';
    const curNote = val('sv3_BankReceivedNote') || '';

    overlay.innerHTML = `
      <div style="background:var(--surface);border-radius:12px;max-width:380px;width:100%;padding:20px;max-height:90vh;overflow-y:auto;">
        <h3 style="margin:0 0 14px;font-size:15px;">${t('ব্যাংকে গ্রহণের বিবরণ','Bank Receipt Details')}</h3>
        <div class="field"><label>${t('পরিমাণ','Amount')}</label><input value="৳ ${amt}" readonly style="background:var(--bg);"></div>
        <div class="field"><label>${t('আমাদের ব্যাংক','Our Bank')} *</label>
          <select id="sv3_PopBankAcc" data-order="0"><option value="">—</option>${optsHtml(bankAccounts, 'BankAccID', 'AccountName', curBankAcc)}</select>
        </div>
        <div class="field" style="display:flex;align-items:center;gap:6px;">
          <input type="checkbox" id="sv3_PopCustBankCheck" style="width:auto;">
          <label style="margin:0;">${t('গ্রাহকের নিজের ব্যাংক থেকে এসেছে (ঐচ্ছিক)','From customer\u2019s own bank (optional)')}</label>
        </div>
        <div id="sv3_PopCustBankFields" style="display:none;">
          <div class="field"><label>${t('গ্রাহকের ব্যাংক','Customer\u2019s Bank')}</label><input value="${attr(custBankName)}" readonly style="background:var(--bg);"></div>
          <div class="field"><label>${t('অ্যাকাউন্ট নম্বর','Account No')}</label><input value="${attr(custBankAcc)}" readonly style="background:var(--bg);"></div>
        </div>
        <div class="field"><label>${t('বিবরণ/নোট','Note')} *</label><input id="sv3_PopNote" data-order="1" value="${attr(curNote)}" placeholder="${t('টিক না দিলে এখানে কোন ব্যাংক/বিকাশ/নগদ থেকে এলো লিখুন','If unchecked, write which bank/bKash/Nagad it came from')}"></div>
        <div style="display:flex;gap:8px;margin-top:16px;">
          <button type="button" id="sv3_PopCancel" class="btn" style="flex:1;">${t('বাতিল','Cancel')}</button>
          <button type="button" id="sv3_PopConfirm" data-order="2" class="btn btn-primary" style="flex:1;">${t('নিশ্চিত করুন','Confirm')}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    document.getElementById('sv3_PopCustBankCheck').addEventListener('change', function () {
      document.getElementById('sv3_PopCustBankFields').style.display = this.checked ? '' : 'none';
    });

    function focusableFields() {
      return Array.from(overlay.querySelectorAll('[data-order]')).filter(function (el) { return el.offsetParent !== null; });
    }
    function keyNavHandler(e) {
      if (e.key !== 'Enter' && e.key !== 'Escape') return;
      if (!overlay.contains(document.activeElement)) return;
      const fields = focusableFields();
      const curIdx = fields.indexOf(document.activeElement);
      if (curIdx === -1) return;
      e.preventDefault();
      e.stopPropagation();
      if (e.key === 'Enter') {
        const next = fields[curIdx + 1];
        if (next) { next.focus(); } else { document.getElementById('sv3_PopConfirm').click(); }
      } else {
        const prev = fields[curIdx - 1];
        if (prev) prev.focus(); else document.getElementById('sv3_PopCancel').click();
      }
    }
    document.addEventListener('keydown', keyNavHandler, true);
    function closePopup() {
      document.removeEventListener('keydown', keyNavHandler, true);
      overlay.remove();
    }

    document.getElementById('sv3_PopCancel').addEventListener('click', function () {
      document.getElementById('sv3_RecAmount').value = '';
      document.getElementById('sv3_BankReceivedAmount').value = '';
      sv3BankPopupFilled = false;
      updateBankRecSummary();
      closePopup();
    });
    document.getElementById('sv3_PopConfirm').addEventListener('click', function () {
      const ourBank = val('sv3_PopBankAcc');
      const note = document.getElementById('sv3_PopNote').value.trim();
      if (!ourBank) { showToast(t('আমাদের ব্যাংক বাছাই করুন।','Select our bank.'), 'error'); return; }
      if (!note) { showToast(t('বিবরণ/নোট লিখুন।','Enter a note.'), 'error'); return; }
      document.getElementById('sv3_BankAccID').value = ourBank;
      document.getElementById('sv3_BankReceivedNote').value = note;
      sv3BankPopupFilled = true;
      updateBankRecSummary();
      closePopup();
    });
    setTimeout(function () { document.getElementById('sv3_PopBankAcc').focus(); }, 0);
  }

  function toggleRecType() {
    const isCash = val('sv3_RecTypeSelect') === 'Cash';
    document.getElementById('sv3_CashReceivedNote').style.display = isCash ? '' : 'none';
    document.getElementById('sv3_BankRecSummary').style.display = isCash ? 'none' : '';
    document.getElementById('sv3_RecAmount').value = isCash ? val('sv3_CashReceivedAmount') : val('sv3_BankReceivedAmount');
  }
  // ভ্যাট — চেকবক্স দিয়ে ঐচ্ছিক। % লিখলে পরিমাণ নিজে থেকে হিসাব হবে (নিট মোটের উপর),
  // আর চাইলে পরিমাণের ঘরে সরাসরি অংক লেখা যাবে — তখন সেটাই থাকবে, % দিয়ে আর বদলাবে না
  window.__sv3VatManual = !!(rec.VatAmount && !rec.VatRate);
  function sv3VatBase() {
    const net = window.__sv3SaleLines.reduce(function (s, l) { return s + (Number(l.netAmount !== undefined ? l.netAmount : l.amount) || 0); }, 0);
    const exp = (window.__sv3CashExpense && window.__sv3CashExpense.amount) || 0;
    return net + exp - (Number(val('sv3_DiscAmount')) || 0);
  }
  window.__sv3GetVat = function () {
    if (!document.getElementById('sv3_VatCheck').checked) return { rate: 0, amount: 0 };
    const rate = Number(val('sv3_VatRate')) || 0;
    let amount = Number(val('sv3_VatAmount')) || 0;
    if (!window.__sv3VatManual && rate > 0) {
      amount = Math.round(sv3VatBase() * rate) / 100;
      document.getElementById('sv3_VatAmount').value = amount || '';
    }
    return { rate: rate, amount: amount };
  };
  document.getElementById('sv3_VatCheck').addEventListener('change', function () {
    document.getElementById('sv3_VatWrap').style.display = this.checked ? 'flex' : 'none';
    if (this.checked) window.__sv3GetVat();
  });
  document.getElementById('sv3_VatRate').addEventListener('input', function () { window.__sv3VatManual = false; window.__sv3GetVat(); });
  document.getElementById('sv3_VatAmount').addEventListener('input', function () { window.__sv3VatManual = true; });
  document.getElementById('sv3_DiscAmount').addEventListener('input', function () { window.__sv3GetVat(); });

  document.getElementById('sv3_RecTypeSelect').addEventListener('change', toggleRecType);
  toggleRecType();

  document.getElementById('sv3_RecAmount').addEventListener('change', function () {
    const isCash = val('sv3_RecTypeSelect') === 'Cash';
    if (isCash) {
      document.getElementById('sv3_CashReceivedAmount').value = this.value;
    } else {
      document.getElementById('sv3_BankReceivedAmount').value = this.value;
      if (Number(this.value) > 0 && !sv3BankPopupFilled) openBankReceiptPopup();
      if (!(Number(this.value) > 0)) { sv3BankPopupFilled = false; updateBankRecSummary(); }
    }
  });
  document.getElementById('sv3_BankRecSummary').addEventListener('click', function () {
    if (Number(val('sv3_BankReceivedAmount')) > 0) openBankReceiptPopup();
  });

  document.getElementById('sv3_CustomerID').addEventListener('change', toggleCashCustomer);
  toggleCashCustomer();

  function refreshItemDropdown() {
    const groupChecked = document.getElementById('sv3_GroupCheck').checked;
    const catChecked = document.getElementById('sv3_CatCheck').checked;
    const groupVal = val('sv3_GroupSelect'), catVal = val('sv3_CatSelect');
    let list = window.__sv3Items;
    if (groupChecked && groupVal) list = list.filter(function (i) { return i.GroupID === groupVal; });
    if (catChecked && catVal) list = list.filter(function (i) { return i.CategoryID === catVal; });
    const sel = document.getElementById('sv3_ItemID');
    const prev = sel.value;
    sel.innerHTML = '<option value="">—</option>' + list.map(function (i) { return `<option value="${attr(i.ItemID)}">${escapeHtml(i.ItemName)}</option>`; }).join('');
    if (list.some(function (i) { return i.ItemID === prev; })) sel.value = prev;
  }
  document.getElementById('sv3_GroupCheck').addEventListener('change', function () {
    const sel = document.getElementById('sv3_GroupSelect');
    sel.disabled = !this.checked; sel.style.display = this.checked ? '' : 'none';
    if (!this.checked) sel.value = '';
    refreshItemDropdown();
  });
  document.getElementById('sv3_GroupSelect').addEventListener('change', refreshItemDropdown);
  document.getElementById('sv3_CatCheck').addEventListener('change', function () {
    const sel = document.getElementById('sv3_CatSelect');
    sel.disabled = !this.checked; sel.style.display = this.checked ? '' : 'none';
    if (!this.checked) sel.value = '';
    refreshItemDropdown();
  });
  document.getElementById('sv3_CatSelect').addEventListener('change', refreshItemDropdown);
  refreshItemDropdown();

  async function onItemOrWarehouseChange() {
    const itemId = val('sv3_ItemID');
    const warehouseId = val('sv3_WarehouseID');
    const item = window.__sv3ItemMap[itemId];
    document.getElementById('sv3_Unit').value = item ? ((window.__sv3UnitMap[item.UOMID]||{}).UOMName || '') : '';
    window.__sv3LastStockRate = item ? (Number(item.StandardCost)||0).toFixed(2) : '';
    if (item && warehouseId) {
      const { data } = await supabaseClient.from('current_stock').select('QtyOnHand,QtyPieces').eq('ItemID', itemId).eq('WarehouseID', warehouseId).maybeSingle();
      const unitName = (window.__sv3UnitMap[item.UOMID] || {}).UOMName || '';
      if (!data) window.__sv3LastStockQty = t('কোনো স্টক নেই','No stock');
      else if (isPieceUnitName(unitName)) {
        const kg = Number(data.QtyOnHand) || 0, pcs = Number(data.QtyPieces) || 0;
        window.__sv3LastStockQty = pcs + ' ' + unitName + (pcs > 0 ? ' (' + kg.toFixed(2) + ' ' + t('কেজি','kg') + ', ' + t('গড় ','avg ') + (kg / pcs).toFixed(3) + ' ' + t('কেজি/পিস','kg/pc') + ')' : '');
      } else window.__sv3LastStockQty = (Number(data.QtyOnHand)||0) + ' ' + unitName;
    } else {
      window.__sv3LastStockQty = '';
    }
    document.getElementById('sv3_PreviewStockQty').value = window.__sv3LastStockQty;
    document.getElementById('sv3_PreviewStockRate').value = window.__sv3LastStockRate;
    document.getElementById('sv3_PreviewStdSalesRate').value = item ? (Number(item.SalesPrice)||0).toFixed(2) : '';
    if (!val('sv3_Rate') && item && item.SalesPrice) document.getElementById('sv3_Rate').value = item.SalesPrice;
    recalcAmount();
    renderRightSummary();
  }
  document.getElementById('sv3_ItemID').addEventListener('change', onItemOrWarehouseChange);
  document.getElementById('sv3_WarehouseID').addEventListener('change', onItemOrWarehouseChange);

  function recalcAmount() {
    const qty = Number(val('sv3_Qty')) || 0;
    const rate = Number(val('sv3_Rate')) || 0;
    const amount = Math.round(qty * rate);
    document.getElementById('sv3_Amount').value = amount;
    if (document.getElementById('sv3_CommCheck').checked) {
      const commRate = Number(val('sv3_CommRate')) || 0;
      const commAmount = amount * commRate / 100;
      document.getElementById('sv3_CommAmount').value = commAmount.toFixed(2);
      document.getElementById('sv3_NetLineAmount').value = (amount - commAmount).toFixed(2);
    }
  }
  document.getElementById('sv3_Qty').addEventListener('input', recalcAmount);
  document.getElementById('sv3_Rate').addEventListener('input', recalcAmount);
  document.getElementById('sv3_CommRate').addEventListener('input', recalcAmount);
  document.getElementById('sv3_CommCheck').addEventListener('change', function () {
    document.getElementById('sv3_CommRate').disabled = !this.checked;
    document.getElementById('sv3_CommResultRow').style.display = this.checked ? '' : 'none';
    if (!this.checked) { document.getElementById('sv3_CommRate').value = ''; document.getElementById('sv3_CommAmount').value = ''; document.getElementById('sv3_NetLineAmount').value = ''; }
    recalcAmount();
  });

  function resetLineEntry() {
    document.getElementById('sv3_GroupCheck').checked = false;
    const groupSel = document.getElementById('sv3_GroupSelect'); groupSel.disabled = true; groupSel.style.display = 'none'; groupSel.value = '';
    document.getElementById('sv3_CatCheck').checked = false;
    const catSel = document.getElementById('sv3_CatSelect'); catSel.disabled = true; catSel.style.display = 'none'; catSel.value = '';

    document.getElementById('sv3_Qty').value = '';

    document.getElementById('sv3_Unit').value = '';
    document.getElementById('sv3_Amount').value = '';
    document.getElementById('sv3_PreviewStdSalesRate').value = '';
