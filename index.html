  }

  // ---------- ৩) উৎপাদন ও মজুরি খরচ ----------
  async function runProd() {
    const out = document.getElementById('rpOut');
    const heads = await hrQueryRange('TeamProduction', 'WorkDate', st.pFrom, st.pTo);
    let tpi = [], mems = [];
    if (heads.length) {
      const ids = heads.map(function (h) { return h.TeamProdID; });
      const [a, b] = await Promise.all([supabaseClient.from('TeamProduction_Items').select('*').in('TeamProdID', ids), supabaseClient.from('TeamProduction_Members').select('*').in('TeamProdID', ids)]);
      tpi = a.data || []; mems = b.data || [];
    }
    const okItem = function (id) { const it = itemMap[id] || {}; return (!st.pGroup || it.GroupID === st.pGroup) && (!st.pCat || it.CategoryID === st.pCat); };
    const tpItem = {}; tpi.forEach(function (x) { (tpItem[String(x.TeamProdID)] = tpItem[String(x.TeamProdID)] || []).push(x); });
    const costRate = function (itemId) { return gp.costRoles.reduce(function (s, r) { return s + gp.rateOf(itemId, r.RoleID); }, 0); };
    if (st.pBy === 'item') {
      const per = {};
      tpi.forEach(function (x) { if (!okItem(x.ItemID)) return; const p = per[x.ItemID] = per[x.ItemID] || { kg: 0, wage: 0, days: {} }; p.kg += Number(x.Qty) || 0; });
      mems.forEach(function (mm) {
        const its = (tpItem[String(mm.TeamProdID)] || []).filter(function (x) { return okItem(x.ItemID); }); if (!its.length) return;
        const tot = its.reduce(function (s, x) { return s + (Number(x.Qty) || 0); }, 0) || 1;
        its.forEach(function (x) { per[x.ItemID].wage += (Number(mm.Amount) || 0) * (Number(x.Qty) || 0) / tot; }); // একাধিক আইটেম হলে কেজি অনুপাতে ভাগ
      });
      const list = sortItemsBySerial(Object.keys(per).map(function (id) { return itemMap[id] || { ItemID: id, ItemName: id }; }), catName);
      const T = { kg: 0, wage: 0, cost: 0 };
      const trs = list.map(function (it) {
        const p = per[it.ItemID], cr = costRate(it.ItemID), cost = p.kg * cr;
        T.kg += p.kg; T.wage += p.wage; T.cost += cost;
        return `<tr><td class="l">${escapeHtml(it.ItemName)}</td><td>${hrNum(Math.round(p.kg * 100) / 100)}</td><td>${hrMoney(p.wage)}</td><td>${p.kg ? hrMoney(p.wage / p.kg) : '—'}</td><td>${cr ? hrMoney(cr) : '—'}</td><td>${cost ? hrMoney(cost) : '—'}</td><td><b>${p.kg ? hrMoney((p.wage + cost) / p.kg) : '—'}</b></td><td class="ic">${rowIcons('pi', it.ItemID)}</td></tr>`;
      }).join('');
      st.print = { title: t('উৎপাদন ও মজুরি খরচ — আইটেম অনুযায়ী','Production & wage cost — by item'), sub: formatShortDate(st.pFrom) + ' — ' + formatShortDate(st.pTo) };
      out.innerHTML = `
        <div class="rp-cards"><div>${t('মোট উৎপাদন','Total produced')}<b>${hrNum(Math.round(T.kg * 100) / 100)} ${t('কেজি','kg')}</b></div><div>${t('মোট মজুরি','Total wages')}<b>${hrMoney(T.wage)}</b></div><div>${t('মজুরি / কেজি','Wage / kg')}<b>${T.kg ? hrMoney(T.wage / T.kg) : '—'}</b></div><div>${t('মোট খরচ / কেজি','Total cost / kg')}<b>${T.kg ? hrMoney((T.wage + T.cost) / T.kg) : '—'}</b></div></div>
        <div class="rp-wrap" id="rpPrintArea"><table class="rp-tbl"><thead><tr><th>${t('আইটেম','Item')}</th><th>${t('মোট কেজি','Total kg')}</th><th>${t('মজুরি','Wages')}</th><th>${t('মজুরি / কেজি','Wage / kg')}</th><th>${t('অন্যান্য খরচ দর / কেজি','Other cost rate / kg')}</th><th>${t('অন্যান্য খরচ','Other cost')}</th><th>${t('মোট খরচ / কেজি','Total cost / kg')}</th><th></th></tr></thead>
          <tbody>${trs || `<tr><td class="l" colspan="8" style="color:var(--text-muted);">${t('এই সময়ে কোনো উৎপাদন নেই।','No production in this period.')}</td></tr>`}
          <tr class="tot"><td class="l">${t('মোট','Total')}</td><td>${hrNum(Math.round(T.kg * 100) / 100)}</td><td>${hrMoney(T.wage)}</td><td>${T.kg ? hrMoney(T.wage / T.kg) : '—'}</td><td></td><td>${hrMoney(T.cost)}</td><td>${T.kg ? hrMoney((T.wage + T.cost) / T.kg) : '—'}</td><td></td></tr></tbody></table></div>
        <div class="rp-hint">${t('মজুরি = দৈনিক উৎপাদনে লেখা আসল মজুরি। অন্যান্য খরচ (বিদ্যুৎ, মেশিঃ ও ডাইস, মেডিসিন, ধোলাই, বিবিধ) = মজুরি দর পেজের বর্তমান দর × কেজি — আনুমানিক।','Wages are actual; other costs are estimated from current rates × kg.')}</div>`;
    } else {
      const per = {};
      mems.forEach(function (mm) {
        const its = (tpItem[String(mm.TeamProdID)] || []).filter(function (x) { return okItem(x.ItemID); }); if (!its.length) return;
        const p = per[mm.EmployeeID] = per[mm.EmployeeID] || { kg: 0, wage: 0, days: {}, roles: {} };
        p.kg += its.reduce(function (s, x) { return s + (Number(x.Qty) || 0); }, 0); p.wage += Number(mm.Amount) || 0;
        const h = heads.find(function (x) { return String(x.TeamProdID) === String(mm.TeamProdID); }); if (h) p.days[String(h.WorkDate).slice(0, 10)] = true;
        if (mm.RoleID) p.roles[gp.roleMap[mm.RoleID] || mm.RoleID] = true;
      });
      const ids = Object.keys(per).sort(function (a, b) { return per[b].wage - per[a].wage; });
      const T = { kg: 0, wage: 0 };
      const trs = ids.map(function (id) {
        const p = per[id], e = base.empMap[id] || {}, nd = Object.keys(p.days).length; T.kg += p.kg; T.wage += p.wage;
        return `<tr><td class="l"><b>${escapeHtml(empName(id))}</b><div style="font-size:11px;color:var(--text-muted);">${escapeHtml(base.catMap[e.CategoryID] || '')}</div></td><td class="l" style="white-space:normal;">${escapeHtml(Object.keys(p.roles).join(', '))}</td>
          <td>${nd}</td><td>${hrNum(Math.round(p.kg * 100) / 100)}</td><td><b>${hrMoney(p.wage)}</b></td><td>${nd ? hrMoney(p.wage / nd) : '—'}</td><td class="ic">${rowIcons('pe', id)}</td></tr>`;
      }).join('');
      st.print = { title: t('উৎপাদন ও মজুরি — কর্মচারী অনুযায়ী','Production & wages — by employee'), sub: formatShortDate(st.pFrom) + ' — ' + formatShortDate(st.pTo) };
      out.innerHTML = `
        <div class="rp-cards"><div>${t('কর্মচারী','Employees')}<b>${ids.length}</b></div><div>${t('মোট কেজি (কাজ অনুযায়ী)','Total kg (by job)')}<b>${hrNum(Math.round(T.kg * 100) / 100)}</b></div><div>${t('মোট মজুরি','Total wages')}<b>${hrMoney(T.wage)}</b></div><div>${t('গড় মজুরি / জন','Avg / person')}<b>${ids.length ? hrMoney(T.wage / ids.length) : '—'}</b></div></div>
        <div class="rp-wrap" id="rpPrintArea"><table class="rp-tbl"><thead><tr><th>${t('কর্মচারী','Employee')}</th><th>${t('কাজের ধরন','Jobs')}</th><th>${t('কাজের দিন','Work days')}</th><th>${t('কেজি','Kg')}</th><th>${t('মজুরি','Wages')}</th><th>${t('গড় / দিন','Avg / day')}</th><th></th></tr></thead>
          <tbody>${trs || `<tr><td class="l" colspan="7" style="color:var(--text-muted);">${t('এই সময়ে কোনো উৎপাদন নেই।','No production in this period.')}</td></tr>`}
          <tr class="tot"><td class="l" colspan="3">${t('মোট','Total')}</td><td>${hrNum(Math.round(T.kg * 100) / 100)}</td><td>${hrMoney(T.wage)}</td><td></td><td></td></tr></tbody></table></div>
        <div class="rp-hint">${t('একই আইটেমে একজন একাধিক কাজ করলে (যেমন শেপ ও ফিনিশ) কেজি প্রতিটা কাজের জন্য আলাদা গোনা হয়।','Kg is counted once per job a person did on an item.')}</div>`;
    }
  }

  // ---------- প্রতি সারির বাটনঃ 👁 দেখুন · ✏️ এডিট · 🗑 ডিলিট · 💾 PDF সেভ ----------
  function rowIcons(kind, id) {
    const b = function (act, ic, title, dis) { return `<button type="button" data-ra="${act}" data-rk="${kind}" data-rid="${attr(id)}" title="${title}" aria-label="${title}" ${dis ? 'disabled' : ''}>${ic}</button>`; };
    const delOk = kind === 'v' || kind === 'i';
    return `<span class="rp-ic">${b('view', '👁', t('দেখুন','View'))}${b('edit', '✏️', t('এডিট','Edit'))}${b('delete', '🗑', delOk ? t('ডিলিট','Delete') : t('এখানে ডিলিট নেই — খতিয়ান বা মূল পেজ থেকে করুন','Delete from the ledger or the source page'), !delOk)}${b('pdf', '💾', t('PDF হিসেবে সেভ','Save as PDF')).replace('<button ', '<button data-perm-safe="1" ')}</span>`;
  }
  const HR_MOD = function () { return t('এইচআর ও পে-রোল','HR & Payroll'); };
  async function rowAction(act, kind, id) {
    if (kind === 'v') { window.__svOpen = { id: id, action: act }; await navigateTo('payroll', HR_MOD(), t('সেলারী ভাউচার','Salary Voucher')); return; }
    if (kind === 'i') { window.__siOpen = { id: id, action: act }; await navigateTo('salaryIssue', HR_MOD(), t('সেলারী ইস্যু','Salary Issue')); return; }
    if (kind === 'm') {
      const r = hrMonthRange(st.month);
      if (act === 'view' || act === 'pdf') {
        st.tab = 'ledger'; st.emp = id; st.from = r.from; st.to = r.to;
        content.querySelectorAll('.rp-tab').forEach(function (x) { x.classList.toggle('on', x.dataset.tab === 'ledger'); });
        renderBar(); await run(); if (act === 'pdf') await printReport();
      } else if (act === 'edit') {
        const d = await loadMoney();
        const v = d.vouchers.filter(function (x) { return x.EmployeeID === id && x._date >= r.from && x._date <= r.to; }).sort(function (a, b) { return b._date.localeCompare(a._date); })[0];
        if (v) { window.__svOpen = { id: v.PayrollID, action: 'edit' }; } else window.__svOpen = { emp: id };
        await navigateTo('payroll', HR_MOD(), t('সেলারী ভাউচার','Salary Voucher'));
      }
      return;
    }
    if (kind === 'pi' || kind === 'pe') {
      if (act === 'edit') { window.__dpgOpen = { date: st.pTo }; await navigateTo('prodDaily', t('প্রোডাকশন','Production'), t('দৈনিক উৎপাদন','Daily Production')); return; }
      await prodDetails(kind, id, act === 'pdf');
    }
  }
  /** উৎপাদনের দিনওয়ারি বিস্তারিত — প্রতিটা এন্ট্রিতে এডিট (সেই দিনের উৎপাদন পেজ) ও ডিলিট (বেতনে না উঠলে) */
  async function prodDetails(kind, id, pdf) {
    const heads = await hrQueryRange('TeamProduction', 'WorkDate', st.pFrom, st.pTo);
    if (!heads.length) return;
    const ids = heads.map(function (h) { return h.TeamProdID; });
    const [a, b] = await Promise.all([supabaseClient.from('TeamProduction_Items').select('*').in('TeamProdID', ids), supabaseClient.from('TeamProduction_Members').select('*').in('TeamProdID', ids)]);
    const tpi = a.data || [], mems = b.data || [];
    const rows = [];
    heads.sort(function (x, y) { return String(x.WorkDate).localeCompare(String(y.WorkDate)); }).forEach(function (h) {
      const its = tpi.filter(function (x) { return String(x.TeamProdID) === String(h.TeamProdID); });
      const ms = mems.filter(function (x) { return String(x.TeamProdID) === String(h.TeamProdID); });
      if (kind === 'pi' && !its.some(function (x) { return x.ItemID === id; })) return;
      ms.forEach(function (mm) {
        if (kind === 'pe' && mm.EmployeeID !== id) return;
        rows.push({ tp: h.TeamProdID, date: String(h.WorkDate).slice(0, 10), item: its.map(function (x) { return (itemMap[x.ItemID] || {}).ItemName || x.ItemID; }).join(', '), kg: its.reduce(function (s, x) { return s + (Number(x.Qty) || 0); }, 0),
          emp: empName(mm.EmployeeID), role: gp.roleMap[mm.RoleID] || '', rate: Number(mm.Rate) || 0, amt: Number(mm.Amount) || 0, billed: mm.BilledIn || '' });
      });
    });
    const title = kind === 'pi' ? ((itemMap[id] || {}).ItemName || id) : empName(id);
    const tot = rows.reduce(function (s, r) { return s + r.amt; }, 0);
    const tbl = `<table class="rp-tbl" style="min-width:560px;"><thead><tr><th>${t('তারিখ','Date')}</th><th>${kind === 'pi' ? t('কর্মচারী','Employee') : t('আইটেম','Item')}</th><th>${t('কাজ','Job')}</th><th>${t('কেজি','Kg')}</th><th>${t('দর','Rate')}</th><th>${t('মজুরি','Wage')}</th><th></th></tr></thead><tbody>
      ${rows.map(function (r) { return `<tr><td class="l">${escapeHtml(formatShortDate(r.date))}</td><td class="l">${escapeHtml(kind === 'pi' ? r.emp : r.item)}</td><td class="l">${escapeHtml(r.role)}</td><td>${hrNum(r.kg)}</td><td>${hrMoney(r.rate)}</td><td>${hrMoney(r.amt)}</td>
        <td class="ic"><span class="rp-ic"><button type="button" data-pde="${escapeHtml(r.date)}" title="${t('এডিট — সেই দিনের উৎপাদন পেজ','Edit — open that day')}">✏️</button><button type="button" data-pdd="${attr(r.tp)}" ${r.billed ? 'disabled title="' + t('বেতনে উঠে গেছে — আগে ভাউচার ডিলিট করুন','Already paid — delete the voucher first') + '"' : 'title="' + t('এই দিনের এই আইটেমের এন্ট্রি ডিলিট','Delete this entry') + '"'}>🗑</button></span></td></tr>`; }).join('')}
      <tr class="tot"><td class="l" colspan="5">${t('মোট','Total')}</td><td>${hrMoney(tot)}</td><td></td></tr></tbody></table>`;
    if (pdf) {
      st.print = { title: t('উৎপাদনের বিস্তারিত — ','Production details — ') + title, sub: formatShortDate(st.pFrom) + ' — ' + formatShortDate(st.pTo) };
      const holder = document.createElement('div'); holder.id = 'rpPrintArea'; holder.innerHTML = tbl; holder.style.display = 'none';
      const old = document.getElementById('rpPrintArea'); if (old) old.id = 'rpPrintAreaOld';
      document.body.appendChild(holder); await printReport(); holder.remove(); if (old) old.id = 'rpPrintArea';
      return;
    }
    openModal({ title: t('উৎপাদনের বিস্তারিত — ','Production details — ') + title, wide: true, bodyHtml: `<div style="overflow-x:auto;">${tbl}</div>`, onSave: async function () {} });
    const mb = document.getElementById('modalBody');
    mb.addEventListener('click', async function (ev) {
      const e = ev.target.closest('[data-pde]'), d = ev.target.closest('[data-pdd]');
      if (e) { closeModal(); window.__dpgOpen = { date: e.dataset.pde }; await navigateTo('prodDaily', t('প্রোডাকশন','Production'), t('দৈনিক উৎপাদন','Daily Production')); }
      else if (d && !d.disabled) {
        if (!confirm(t('এই উৎপাদন এন্ট্রি (ওই দিনের ওই আইটেমের সব কাজ) ডিলিট করবেন?','Delete this production entry?'))) return;

/* ============================================================
   ১২.৯৫) প্রসেসিং ভাউচার (Processing Voucher) — Production মডিউল
   ============================================================ */
/**
 * কাঁচামাল + উৎপাদন খরচ − বাই-প্রডাক্ট = নেট ফিনিশড গুডস কস্টিং।
 * কাঁচামালের দর দুই তারিখের মধ্যে GRN থেকে গড় (weighted average) করে
 * অটো-বসানো হয়, ব্যবহারকারী চাইলে বদলাতে পারবেন।
 */
/* ============================================================
   প্রোডাকশন → দৈনিক উৎপাদন
   • আজকের উৎপাদনঃ (আজকের তারিখ ডিফল্ট) — নতুন লাইন এই তারিখে যোগ হয়; উৎপাদনঃ হইতে/পর্যন্ত দিয়ে কয়েক দিনের তালিকা দেখা
   • কোন সার্কেল (কাঁচামাল আইটেম) — সেটা প্রসেসিং ভাউচারে বাছাই হয়; এখানে শুধু পরিমাণ
   • প্রতিটা লাইন (ক্রঃ ১, ২, ৩ …): সার্কেল | কাটিং | ভাঙ্গাড়ী | অপচয় | তৈরী পণ্য (কেজি, পিস) | তৈরী আইটেম-১/২/৩ | = (তিন আইটেমের সমন্বয়)
     — প্রতিটা আইটেমের নিচে তিনটা ঘরঃ ১ পিসের ওজন | মোট পিস | মোট ওজন (নিজে = ১ পিস ওজন × মোট পিস)
     — যেমন একই হাঁড়ির তিন সাইজ রাইচ/তরকারী/ডিস্কো; প্রতিটা আইটেম লাইনে ড্রপডাউনে, কেজি ও পিসসহ
   • ক্রঃ অনুযায়ী প্রসেসিং ভাউচারে প্রস্তুত পণ্যের লাইন সাজানো হয় ("দৈনিক উৎপাদন থেকে আনুন")
   • প্রসেসিং ভাউচারে ব্যবহার হওয়া লাইন লক থাকে (একই লাইন দুবার ব্যবহার হয় না)
   • দুই অংশ, উপরের 👁️ দিয়ে বদলায়ঃ ১ম অংশ দৈনিক উৎপাদন; ২য় অংশ দৈনিক উৎপাদন ও দল (ক্রঃ ও সার্কেলের পর শেপ … শেষ পর্যন্ত)
     — ২য় অংশের মজুরি সেলারী ভাউচারে আর মজুরি+খরচ প্রসেসিং ভাউচারে নিজে যায়; এখান থেকেই প্রসেসিং ভাউচার তৈরী
   • শিরোনাম (ইউনিটসহ এক সারি), ক্রঃ কলাম আর নিচের মোট — স্ক্রল করলেও স্থির (ফ্রিজ); ঘরগুলো চিকন, তীর-চিহ্ন ছাড়া
   ============================================================ */
async function renderProdDailyPage(content) {
  const gp = await hrLoadGroups(), base = await hrLoadBase();   // ২য় অংশের জন্যঃ কাজের কলাম, দর, কর্মচারী
  const items = (await cachedList('Items')).filter(function (i) { return i.Status !== 'Deleted'; })
    .sort(function (a, b) { return String(a.ItemName).localeCompare(String(b.ItemName), 'bn'); });
  const itemName = {}; items.forEach(function (i) { itemName[i.ItemID] = i.ItemName; });
  const dayBn = ['রবি', 'সোম', 'মঙ্গল', 'বুধ', 'বৃহঃ', 'শুক্র', 'শনি'], dayEn = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const now = new Date();
  const todayIso = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
  const st = { date: todayIso, from: todayIso, to: todayIso, lines: [], seq: 0, view: 'dp', team: {}, present: {}, teamErr: '' };
  const NUM = ['raw', 'cut', 'scrap', 'waste', 'fgk', 'fgp'];
  const COL = { raw: 'RawQty', cut: 'CuttingQty', scrap: 'ScrapQty', waste: 'WasteQty', fgk: 'FGQty', fgp: 'FGPcs' };
  const n = function (x) { return Number(x) || 0; };
  const show = function (x, dec) { const v = Number(x); if (!v) return ''; return String(+v.toFixed(dec === undefined ? 3 : dec)); };
  const $ = function (id) { return document.getElementById(id); };
  const dayLabel = function (d) { const wd = new Date(d + 'T00:00:00').getDay(); return formatShortDate(d) + ' ' + (currentLang === 'bn' ? dayBn[wd] : dayEn[wd]); };

  function newLine(date, serial) { return { key: 'L' + (++st.seq), id: null, date: date, serial: serial, rawId: '', v: {}, fgkOv: false, fgpOv: false, it: [{ id: '', u: '', p: '', k: '', kOv: false }, { id: '', u: '', p: '', k: '', kOv: false }, { id: '', u: '', p: '', k: '', kOv: false }], saved: false, edit: false, dirty: false, procId: '', by: '' }; }
  function byKey(k) { return st.lines.find(function (l) { return l.key === k; }); }
  function locked(L) { return !!L.procId || (L.saved && !L.edit); }
  function autoFgk(L) { const raw = n(L.v.raw); if (!raw) return 0; return raw - n(L.v.cut) - n(L.v.scrap) - n(L.v.waste); }
  function fgk(L) { return L.fgkOv ? n(L.v.fgk) : autoFgk(L); }
  function itemsPcs(L) { return n(L.it[0].p) + n(L.it[1].p) + n(L.it[2].p); }
  function fgp(L) { return L.fgpOv ? n(L.v.fgp) : itemsPcs(L); }   // পিস নিজে = তিন আইটেমের পিস; হাতে বদলানো যায়
  // আইটেমের মোট ওজন নিজে = ১ পিসের ওজন × মোট পিস; হাতে লিখলে সেটাই
  function itemKg(x) { return x.kOv ? n(x.k) : n(x.u) * n(x.p); }
  function itemsKg(L) { return itemKg(L.it[0]) + itemKg(L.it[1]) + itemKg(L.it[2]); }
  function hasAny(L) { return NUM.some(function (k) { return n(L.v[k]) !== 0; }) || L.it.some(function (x) { return itemKg(x) || n(x.p); }); }
  function warnOf(L) { const s = itemsKg(L); return s > 0 && Math.abs(s - fgk(L)) > 0.0005; }

  // "=" কলামঃ তিন আইটেমের মোট ওজন ও পিস, তৈরী পণ্য পরিমাণের সাথে মিলছে কিনা
  function eqCell(L) {

  function renderDP() {

  // ---------- রেকর্ড (দৈনিক উৎপাদন) ----------
  function recItems(r) { const out = []; for (let i = 1; i <= 3; i++) if (r['FG' + i + 'ItemID']) out.push(escapeHtml(itemName[r['FG' + i + 'ItemID']] || r['FG' + i + 'ItemID']) + (n(r['FG' + i + 'Kg']) ? ` <small style="color:var(--text-muted)">${show(r['FG' + i + 'Kg'])}${t('কেজি', 'kg')}${n(r['FG' + i + 'Pcs']) ? '/' + show(r['FG' + i + 'Pcs'], 0) + t('পিস', 'pc') : ''}</small>` : '')); return out.join('<br>') || '—'; }
  function renderRec() {
    const wrap = $('pc_RecWrap');
    if (!st.rec.length) { wrap.innerHTML = `<div class="empty-state" style="padding:14px;">${t('প্রসেসিং বাকি এমন কোনো লাইন নেই।', 'No lines waiting for processing.')}</div>`; return; }
    wrap.innerHTML = `<table><thead><tr><th><input type="checkbox" id="pc_RecAll" title="${attr(t('সব', 'All'))}"></th><th>${t('তারিখ', 'Date')}</th><th>${t('ক্রঃ', 'No.')}</th><th>${t('তৈরী পণ্য আইটেম', 'Finished items')}</th><th>${t('সার্কেল (কেজি)', 'Circle (kg)')}</th><th>${t('তৈরী (কেজি / পিস)', 'Finished (kg / pcs)')}</th><th>${t('মজুরি + খরচ', 'Wages + costs')}</th></tr></thead>
      <tbody>${st.rec.map(function (r) {
        const tm = st.recTeam[String(r.id)];
        return `<tr data-rid="${attr(r.id)}" class="${st.dpIds.indexOf(r.id) !== -1 ? 'picked' : ''}"><td><input type="checkbox" data-rec="${attr(r.id)}" ${st.dpIds.indexOf(r.id) !== -1 ? 'checked' : ''}></td>
          <td>${escapeHtml(formatShortDate(r.ProdDate))}</td><td><b>${escapeHtml(r.SerialNo || 1)}</b></td><td class="l">${recItems(r)}</td>
          <td class="r">${show(r.RawQty) || 0}</td><td class="r">${show(r.FGQty) || 0} / ${show(r.FGPcs, 0) || 0}</td><td class="r">${tm ? hrMoney(tm) : '—'}</td></tr>`;
      }).join('')}</tbody></table>`;
  }
  async function loadRec() {
    // প্রসেসিং না হওয়া সব লাইন — তারিখ-সীমা ছাড়াই (তারিখ দিলে শুধু ছাঁকা); এডিটের সময় এই ভাউচারের লাইনগুলোও
    const from = gv('pc_RecFrom'), to = gv('pc_RecTo');
    const [ra, rb] = await Promise.all([
      supabaseClient.from('DailyProduction').select('*').is('ProcessingID', null),
      st.editId ? supabaseClient.from('DailyProduction').select('*').eq('ProcessingID', st.editId) : Promise.resolve({ data: [] })]);
    const error = ra.error || rb.error;
    if (error) { $('pc_RecWrap').innerHTML = `<div class="empty-state">${escapeHtml(error.message)}</div>`; return; }
    const data = (ra.data || []).concat(rb.data || []);
    st.rec = data.filter(function (r) { const d = String(r.ProdDate).slice(0, 10); return (!from || d >= from) && (!to || d <= to); }).sort(function (a, b) { return String(a.ProdDate).localeCompare(String(b.ProdDate)) || (n(a.SerialNo) - n(b.SerialNo)); });
    st.recTeam = {};
    const ids = st.rec.map(function (r) { return r.id; });
    if (ids.length) {
      try {   // ২য় অংশে (দৈনিক উৎপাদন ও দল) সেভ করা মজুরি + খরচ, লাইন ধরে
        const hr = await supabaseClient.from('TeamProduction').select('*').in('DPLineID', ids);
        const heads = (hr && !hr.error && hr.data) || [];
        if (heads.length) {
          const tids = heads.map(function (h) { return h.TeamProdID; });
          const [rm, rc] = await Promise.all([supabaseClient.from('TeamProduction_Members').select('*').in('TeamProdID', tids), supabaseClient.from('TeamProduction_Costs').select('*').in('TeamProdID', tids)]);
          const byTp = {}; heads.forEach(function (h) { byTp[String(h.TeamProdID)] = String(h.DPLineID); });
          ((rm && rm.data) || []).concat((rc && !rc.error && rc.data) || []).forEach(function (m) { const k = byTp[String(m.TeamProdID)]; if (k) st.recTeam[k] = (st.recTeam[k] || 0) + n(m.Amount); });
        }
      } catch (e) { /* দলের রেকর্ড না থাকলে মজুরি দেখাবে না */ }
    }
    $('pc_RecInfo').textContent = st.rec.length + t('টা লাইন প্রসেসিং বাকি', ' lines waiting') + (st.rec.length ? t(' — সবচেয়ে পুরনো ', ' — oldest ') + formatShortDate(st.rec[0].ProdDate) : '') + (from || to ? t(' (তারিখে ছাঁকা)', ' (filtered)') : '');
    renderRec();
  }

  // ---------- সেভ করা ভাউচারের তালিকা ----------
  async function voucherData(id) {   // সেভ করা ভাউচার → প্রিন্ট/শেয়ারের তথ্য (ফর্মের মতো একই আকারে)
    const [hr, br, fr] = await Promise.all([
      supabaseClient.from('ProcessingVoucher').select('*').eq('ProcessingID', id).maybeSingle(),
      supabaseClient.from('ProcessingByProduct_Lines').select('*').eq('ProcessingID', id),
      supabaseClient.from('ProcessingFG_Lines').select('*').eq('ProcessingID', id)]);
    if (hr.error || !hr.data) throw new Error((hr.error && hr.error.message) || t('ভাউচার পাওয়া যায়নি।', 'Voucher not found.'));
    const h0 = hr.data, header = {};
    ['RawMaterialQty', 'RawMaterialPcs', 'RawMaterialRate', 'RawMaterialValue', 'ProcessingRate', 'ProcessingValue', 'TotalValue', 'ByProductQty', 'ByProductValue', 'NetWeight', 'NetValue', 'Pieces', 'RatePerKg', 'RatePerPiece', 'SaleRatePerKg', 'SaleRatePerPiece', 'Profit'].forEach(function (k) { header[k] = n(h0[k]); });
    ['Date', 'RawMaterialItemID', 'WarehouseID', 'FinishedGoodsItemID', 'DateFrom', 'DateTo'].forEach(function (k) { header[k] = h0[k] || ''; });
    const lines = ((br && br.data) || []).map(function (l) { return { ByProductName: l.ByProductName || '', ItemID: l.ItemID || '', Quantity: n(l.Quantity), Rate: n(l.Rate), Value: n(l.Value) || n(l.Quantity) * n(l.Rate), QtyPcs: n(l.QtyPcs), RatePerPc: n(l.RatePerPc) }; });
    let fgLines = ((fr && !fr.error && fr.data) || []).map(function (l) { return { itemId: l.ItemID, kg: n(l.QtyKg), pcs: n(l.QtyPcs), rateKg: n(l.RatePerKg), ratePc: n(l.RatePerPc), value: n(l.Value) }; });
    if (!fgLines.length && h0.FinishedGoodsItemID) fgLines = [{ itemId: h0.FinishedGoodsItemID, kg: n(h0.NetWeight), pcs: n(h0.Pieces), rateKg: n(h0.RatePerKg), ratePc: n(h0.RatePerPiece), value: n(h0.NetValue) }];
    return { header: header, lines: lines, fgLines: fgLines, status: h0.Status };
  }
  async function loadList() {
    const from = gv('pc_ListFrom'), to = gv('pc_ListTo') || today;
    const [rec, fr] = await Promise.all([api('list', { sheet: 'ProcessingVoucher' }), supabaseClient.from('ProcessingFG_Lines').select('ProcessingID,ItemID,QtyKg,QtyPcs')]);
    const fgBy = {}; ((fr && !fr.error && fr.data) || []).forEach(function (l) { (fgBy[l.ProcessingID] = fgBy[l.ProcessingID] || []).push(l); });
    st.list = rec.filter(function (r) { const d = String(r.Date || '').slice(0, 10); return r.Status !== 'Deleted' && (!from || d >= from) && (!to || d <= to); })
      .sort(function (a, b) { return String(b.Date).localeCompare(String(a.Date)) || String(b.ProcessingID).localeCompare(String(a.ProcessingID)); });
    $('pc_ListInfo').textContent = st.list.length + t('টা ভাউচার', ' vouchers');
    const wrap = $('pc_ListWrap');
    if (!st.list.length) { wrap.innerHTML = `<div class="empty-state" style="padding:14px;">${t('এই তারিখে কোনো ভাউচার নেই।', 'No vouchers for these dates.')}</div>`; return; }
    const ico = function (act, id, icon, title, dis) { return `<button type="button" class="pcx-ico" data-lact="${act}" data-lid="${attr(id)}" title="${attr(title)}" ${dis ? 'disabled' : ''}>${icon}</button>`; };
    wrap.innerHTML = `<table><thead><tr><th>${t('ক্রঃ', 'No.')}</th><th>${t('ভাউচার নং', 'Voucher')}</th><th>${t('তারিখ', 'Date')}</th><th>${t('কাঁচামাল', 'Raw')}</th><th>${t('প্রস্তুত পণ্য', 'Finished goods')}</th><th>${t('নীট ওজন', 'Net wt')}</th><th>${t('নীট মূল্য', 'Net value')}</th><th>${t('অবস্থা', 'Status')}</th><th></th></tr></thead>
      <tbody>${st.list.map(function (r, i) {
        const posted = r.Status === 'Posted', fgs = fgBy[r.ProcessingID] || [];
        return `<tr class="${st.editId === r.ProcessingID ? 'editing' : ''}"><td>${i + 1}</td><td><b>${escapeHtml(r.ProcessingID)}</b></td><td>${escapeHtml(formatShortDate(r.Date))}</td>
          <td class="l">${escapeHtml(itemName[r.RawMaterialItemID] || r.RawMaterialItemID || '')} <small style="color:var(--text-muted)">${show(r.RawMaterialQty)} ${t('কেজি', 'kg')}</small></td>
          <td class="l">${fgs.length ? fgs.map(function (l) { return escapeHtml(itemName[l.ItemID] || l.ItemID) + ` <small style="color:var(--text-muted)">${show(l.QtyKg)}${t('কেজি', 'kg')}${n(l.QtyPcs) ? '/' + show(l.QtyPcs, 0) + t('পিস', 'pc') : ''}</small>`; }).join('<br>') : escapeHtml(itemName[r.FinishedGoodsItemID] || r.FinishedGoodsItemID || '—')}</td>
          <td class="r">${show(r.NetWeight)}</td><td class="r">${n(r.NetValue).toFixed(2)}</td>
          <td>${posted ? `<span class="badge active">${t('পোস্ট করা', 'Posted')}</span>` : `<span class="badge draft">${t('খসড়া', 'Draft')}</span>`}</td>
          <td style="white-space:nowrap;">${ico('view', r.ProcessingID, '👁️', t('প্রিভিউ', 'Preview'))}${ico('edit', r.ProcessingID, '✏️', posted ? t('পোস্ট করা ভাউচার এডিট করা যায় না', 'Posted — cannot edit') : t('এডিট', 'Edit'), posted)}${ico('del', r.ProcessingID, '🗑️', posted ? t('ডিলিট (এডমিন — স্টক ফেরত যাবে)', 'Delete (admin — stock reversed)') : t('ডিলিট', 'Delete'))}${ico('post', r.ProcessingID, '💾', posted ? t('পোস্ট হয়ে গেছে', 'Already posted') : t('পোস্ট করুন — স্টকে জমা', 'Post — into stock'), posted)}${ico('print', r.ProcessingID, '🖨️', t('প্রিন্ট', 'Print'))}${ico('share', r.ProcessingID, '🔗', t('শেয়ার', 'Share'))}</td></tr>`;
      }).join('')}</tbody></table>`;
  }
  window.__refreshProcessingList = async function () { await loadList(); };
  async function unlinkDP(id) { try { await supabaseClient.from('DailyProduction').update({ ProcessingID: null }).eq('ProcessingID', id); } catch (e) {} }
  async function listAction(act, id) {
    const r = st.list.find(function (x) { return x.ProcessingID === id; }); if (!r) return;
    try {
      if (act === 'view' || act === 'print') { await openProcessingPrintView(id, act === 'print', await voucherData(id)); return; }
      if (act === 'share') { await shareProcessingVoucher(id, await voucherData(id)); return; }
      if (act === 'post') { await postProcessingRecord(id); return; }
      if (act === 'edit') { await loadIntoForm(id); return; }
      if (act === 'del') {
        if (r.Status === 'Posted') {
          await deletePostedVoucherWithAdminAuth('ProcessingVoucher', id, 'ProcessingVoucher', 'ProcessingID', 'ProcessingByProduct_Lines', 'ProcessingID', async function () { await unlinkDP(id); if (st.editId === id) resetVoucher(); await loadList(); await loadRec(); });
          return;
        }
        if (!confirm(t('ভাউচার ', 'Delete voucher ') + id + t(' ডিলিট করবেন? এর দৈনিক উৎপাদনের লাইনগুলো আবার রেকর্ডে ফিরে আসবে।', '? Its daily production lines go back to the records.'))) return;
        try { await supabaseClient.from('ProcessingFG_Lines').delete().eq('ProcessingID', id); } catch (e) {}
        await supabaseClient.from('ProcessingByProduct_Lines').delete().eq('ProcessingID', id);
        const { error } = await supabaseClient.from('ProcessingVoucher').delete().eq('ProcessingID', id);
        if (error) throw new Error(error.message);
        await unlinkDP(id);
        showToast(t('ডিলিট হয়েছে ✅', 'Deleted ✅'), 'success');
        if (st.editId === id) resetVoucher();
        await loadList(); await loadRec();
      }
    } catch (err) { showToast(err.message, 'error'); }
  }
  // সেভ করা (খসড়া) ভাউচার উপরের ফর্মে — দৈনিক উৎপাদনের লাইন টিকসহ
  async function loadIntoForm(id) {
    const d = await voucherData(id);
    if (d.status === 'Posted') { showToast(t('পোস্ট করা ভাউচার এডিট করা যায় না।', 'A posted voucher cannot be edited.'), 'error'); return; }
    const h = d.header;

  // ---------- হিসাব ----------
  // যে দর লেখা (কেজি বা পিস) সেটাই মূল্যের ভিত্তি; অন্য দর = মূল্য ÷ অন্য পরিমাণ
  // সার্কেল ও বাই-প্রোডাক্ট শুধু কেজিতে — মূল্য = কেজি × দর/কেজি
  function rmValue() { return n(gv('pc_Qty')) * n(gv('pc_RMRate')); }
  function bpValue(b) { return n(b.qty) * n(b.rate); }
  function bpQty() { return st.bp.reduce(function (s, b) { return s + n(b.qty); }, 0); }
  function bpPcs() { return st.bp.reduce(function (s, b) { return s + n(b.pcs); }, 0); }
  function bpVal() { return st.bp.reduce(function (s, b) { return s + bpValue(b); }, 0); }
  function total() { return rmValue() + n(gv('pc_Qty')) * n(gv('pc_ProcRate')); }
  function netW() { return n(gv('pc_Qty')) - bpQty(); }
  function netV() { return total() - bpVal(); }
  function recalc() {
    const qty = n(gv('pc_Qty')), rawPcs = n(gv('pc_RawPcs')), rm = rmValue(), pv = qty * n(gv('pc_ProcRate'));
    const setIf = function (id, v) { const el = $(id); if (el && document.activeElement !== el) el.value = v; };
    if (st.rmBasis === 'pc') setIf('pc_RMRate', qty > 0 && rm > 0 ? String(+(rm / qty).toFixed(4)) : ''); else setIf('pc_RMRatePc', rawPcs > 0 && rm > 0 ? (rm / rawPcs).toFixed(2) : '');
    $('pc_RMRate').classList.toggle('drv', st.rmBasis !== 'pc' && !!gv('pc_RMRate')); $('pc_RMRatePc').classList.toggle('drv', st.rmBasis === 'pc');
    $('pc_RMValue').value = rm.toFixed(2); $('pc_ProcQty').value = show(qty) || ''; $('pc_ProcPcs').value = rawPcs ? String(rawPcs) : ''; $('pc_ProcValue').value = pv.toFixed(2);
    $('pc_ProcRatePc').value = rawPcs > 0 && pv > 0 ? (pv / rawPcs).toFixed(2) : '';
    $('pc_TotQty').textContent = show(qty) || '0'; $('pc_TotPcs').textContent = rawPcs ? String(rawPcs) : ''; $('pc_Total').textContent = (rm + pv).toFixed(2);
    st.bp.forEach(function (b, i) {
      const v = bpValue(b), el = $('pc_bp_' + i + '_val'); if (el) el.textContent = v.toFixed(2);
      if (b.drv === 'pc') { b.rate = n(b.qty) > 0 && v > 0 ? String(+(v / n(b.qty)).toFixed(4)) : ''; setIf('pc_bp_' + i + '_rk', b.rate); }
      else if (n(b.rate) && $('pc_bp_' + i + '_rp')) { b.ratePc = n(b.pcs) > 0 && v > 0 ? (v / n(b.pcs)).toFixed(2) : ''; setIf('pc_bp_' + i + '_rp', b.ratePc); }
    });
    $('pc_BPQty').textContent = show(bpQty()) || '0'; $('pc_BPPcs').textContent = bpPcs() ? String(bpPcs()) : ''; $('pc_BPVal').textContent = bpVal().toFixed(2);
    $('pc_GQty').textContent = show(netW()) || '0'; $('pc_GVal').textContent = netV().toFixed(2);
    const w = netW(), v = netV(), pcs = st.fg.reduce(function (s, r) { return s + n(r.pcs); }, 0), dr = defRate();
    $('pc_NetW').value = w.toFixed(3); $('pc_NetV').value = v.toFixed(2); $('pc_Pcs').value = pcs ? String(pcs) : '';
    $('pc_RateKg').value = w > 0 ? (v / w).toFixed(2) : '0.00'; $('pc_RatePc').value = pcs > 0 ? (v / pcs).toFixed(2) : '0.00';
    let fk = 0, fv = 0;
    st.fg.forEach(function (r, i) {
      const value = fgValue(r), kg = n(r.kg), p = n(r.pcs);
      if (r.auto !== false) { r.rateKg = dr > 0 && kg ? dr.toFixed(2) : ''; r.ratePc = p > 0 && value > 0 ? (value / p).toFixed(2) : ''; const a = $('pc_fg_' + i + '_rk'), b = $('pc_fg_' + i + '_rp'); if (a && document.activeElement !== a) a.value = r.rateKg; if (b && document.activeElement !== b) b.value = r.ratePc; }
      else if (r.driver === 'pc') { const a = $('pc_fg_' + i + '_rk'); r.rateKg = kg > 0 && value > 0 ? (value / kg).toFixed(2) : ''; if (a && document.activeElement !== a) a.value = r.rateKg; }
      else { const b = $('pc_fg_' + i + '_rp'); r.ratePc = p > 0 && value > 0 ? (value / p).toFixed(2) : ''; if (b && document.activeElement !== b) b.value = r.ratePc; }
      const ve = $('pc_fg_' + i + '_val'); if (ve) ve.textContent = value.toFixed(2);
      fk += kg; fv += value;
    });
    $('pc_FGKg').textContent = show(fk) || '0'; $('pc_FGPcs').textContent = show(pcs, 0) || '0'; $('pc_FGVal').textContent = fv.toFixed(2);
    const saleKg = n(gv('pc_SaleKg')), salePc = n(gv('pc_SalePc'));
    const profit = saleKg > 0 ? saleKg * w - v : salePc > 0 ? salePc * pcs - v : 0;
    $('pc_Profit').value = profit.toFixed(2); $('pc_Profit').style.color = profit < 0 ? 'var(--danger)' : '';
    const row = function (lbl, net, got, unit, dec, tol) {
      const d = net - got, ok = Math.abs(d) <= tol;
      return `<div style="background:${ok ? '#e5f5ec' : '#fdf3e3'};color:${ok ? 'var(--success)' : 'var(--amber-dim)'};"><span>${lbl}: ${t('নীট', 'Net')} <b>${net.toFixed(dec)}</b> ${unit} — ${t('প্রস্তুত পণ্যের মোট', 'finished total')} <b>${got.toFixed(dec)}</b> ${unit}</span><b>${ok ? '✓ ' + t('মিলেছে', 'matched') : t('অমিল', 'Difference') + ': ' + (d > 0 ? '+' : '') + d.toFixed(dec)}</b></div>`;
    };
    $('pc_Recon').innerHTML = row(t('ওজন', 'Weight'), w, fk, t('কেজি', 'kg'), 3, 0.0005) + row(t('মূল্য', 'Value'), v, fv, '৳', 2, 0.5);
  }

  // ---------- দৈনিক উৎপাদনের লাইন ভাউচারে ----------
  async function postSelected() {
    const ids = Array.from(document.querySelectorAll('[data-rec]:checked')).map(function (c) { return st.rec.find(function (r) { return String(r.id) === c.getAttribute('data-rec'); }); }).filter(Boolean);
    if (!ids.length) { showToast(t('আগে রেকর্ড থেকে লাইন টিক দিন।', 'Tick some lines first.'), 'error'); return; }
    const rows = ids.slice().sort(function (a, b) { return String(a.ProdDate).localeCompare(String(b.ProdDate)) || (n(a.SerialNo) - n(b.SerialNo)); });
    st.dpIds = rows.map(function (r) { return r.id; });
    const sum = function (f) { return rows.reduce(function (s, r) { return s + n(r[f]); }, 0); };
    const qty = sum('RawQty');
    $('pc_Qty').value = String(+qty.toFixed(3));
    // বাই-প্রোডাক্ট — আগে লেখা দর থাকলে থাকে
    const oldRate = {}; st.bp.forEach(function (b) { if (b.name) oldRate[String(b.name).trim()] = b.rate; });
    st.bp = [['কাটিং', sum('CuttingQty')], ['ভাঙ্গাড়ী', sum('ScrapQty')], ['অপচয়', sum('WasteQty')]].filter(function (x) { return x[1] > 0; }).map(function (x) { return { name: x[0], qty: String(+x[1].toFixed(3)), pcs: '', rate: oldRate[x[0]] || '', ratePc: '', drv: 'kg' }; });
    // প্রস্তুত পণ্য — তারিখ ও ক্রঃ অনুযায়ী, আইটেম ধরে যোগ
    const order = [], agg = {};
    rows.forEach(function (r) { for (let i = 1; i <= 3; i++) { const id = r['FG' + i + 'ItemID'], k = n(r['FG' + i + 'Kg']), p = n(r['FG' + i + 'Pcs']); if (!id || (!k && !p)) continue; if (!agg[id]) { agg[id] = { k: 0, p: 0 }; order.push(id); } agg[id].k += k; agg[id].p += p; } });
    st.fg = order.map(function (id) { return { itemId: id, kg: String(+agg[id].k.toFixed(3)), pcs: agg[id].p ? String(agg[id].p) : '', rateKg: '', ratePc: '', driver: 'kg', auto: true }; });
    // উৎপাদন খরচ — ওই লাইনগুলোর মজুরি + খরচ (দৈনিক উৎপাদন ও দল)
    const wc = rows.reduce(function (s, r) { return s + (st.recTeam[String(r.id)] || 0); }, 0);
    if (wc > 0 && qty > 0) { $('pc_ProcRate').value = String(+(wc / qty).toFixed(8)); $('pc_ProcSrc').textContent = t('দৈনিক উৎপাদন থেকেঃ মজুরি + খরচ ৳', 'From daily production: wages + costs ৳') + wc.toFixed(2) + ' ÷ ' + show(qty) + t(' কেজি', ' kg'); }
    else { $('pc_ProcSrc').textContent = t('এই লাইনগুলোর মজুরি এখনো সেভ হয়নি (দৈনিক উৎপাদন ও দল) — দর নিজে লিখুন', 'No wages saved for these lines yet — type the rate'); }
    // কাঁচামালের দর ফাঁকা থাকলে সর্বশেষ ক্রয় দর
    if (!gv('pc_RMRate') && gv('pc_Raw')) { const lp = await lastPurchaseRate(gv('pc_Raw')); if (lp.rate > 0) { $('pc_RMRate').value = String(+lp.rate.toFixed(4)); st.rateSrc = 'last'; $('pc_RateSrc').textContent = t('সর্বশেষ ক্রয়ঃ ', 'Last purchase: ') + lp.info; } }
    const dates = rows.map(function (r) { return String(r.ProdDate).slice(0, 10); });
    $('pc_DPHint').textContent = t('দৈনিক উৎপাদন থেকেঃ ', 'From daily production: ') + rows.length + t('টা লাইন (', ' lines (') + formatShortDate(dates[0]) + (dates[0] !== dates[dates.length - 1] ? ' — ' + formatShortDate(dates[dates.length - 1]) : '') + t(') — সার্কেল ', ') — circle ') + show(qty) + t(' কেজি → তৈরী পণ্য ', ' kg → finished ') + show(sum('FGQty')) + t(' কেজি / ', ' kg / ') + (show(sum('FGPcs'), 0) || 0) + t(' পিস', ' pcs');
    renderBP(); renderFG(); renderRec(); recalc();
    $('pc_Voucher').scrollIntoView({ behavior: 'smooth', block: 'start' });
    showToast(t('ভাউচারে বসানো হয়েছে ✅ — দর দেখে সেভ করুন', 'Filled ✅ — check the rates and save'), 'success');
  }

  // ---------- কাঁচামালের দর ----------
  async function lastPurchaseRate(itemId) {
    const { data: lines } = await supabaseClient.from('PI_Lines').select('*').eq('ItemID', itemId);
    if (!lines || !lines.length) return { rate: 0, info: '' };
    const ids = Array.from(new Set(lines.map(function (l) { return l.PIID; })));
    const { data: heads } = await supabaseClient.from('PurchaseInvoice').select('PIID, InvoiceDate, Status').in('PIID', ids);
    const hm = {}; (heads || []).forEach(function (h) { if (h.Status === 'Posted') hm[h.PIID] = h; });
    const ok = lines.filter(function (l) { return hm[l.PIID] && n(l.Quantity) > 0; }).sort(function (a, b) { return String(hm[b.PIID].InvoiceDate).localeCompare(String(hm[a.PIID].InvoiceDate)) || String(b.PIID).localeCompare(String(a.PIID)); });
    if (!ok.length) return { rate: 0, info: '' };
    const l = ok[0], val = (l.NetAmount !== null && l.NetAmount !== undefined && l.NetAmount !== '') ? n(l.NetAmount) : (l.Amount !== null && l.Amount !== undefined && l.Amount !== '') ? n(l.Amount) : n(l.Quantity) * n(l.Rate);
    return { rate: val / n(l.Quantity), info: l.PIID + ', ' + formatShortDate(hm[l.PIID].InvoiceDate) };
  }

        <div class="row"><input type="number" step="any" id="pcr_Avg"><button type="button" class="btn" data-pop="avg" style="width:auto;">${t('এটা নিন', 'Use this')}</button><small id="pcr_AvgInfo"></small></div></div>
      <div class="pcx-hint" style="margin-top:8px;">${t('দুটো দরই হাতে বদলানো যায়; "এটা নিন" চাপলে ভাউচারে বসে।', 'Both rates are editable; "Use this" puts it in the voucher.')}</div></div>`;
    document.body.appendChild(pop);

    const calcAvg = async function () {

      catch (e) { pop.querySelector('#pcr_AvgInfo').textContent = e.message; }

    pop.addEventListener('click', function (e) {
      if (e.target === pop) { close(); return; }

        recalc(); close();

    });

    const lp = await lastPurchaseRate(raw);
    pop.querySelector('#pcr_Last').value = lp.rate > 0 ? String(+lp.rate.toFixed(4)) : '';
    pop.querySelector('#pcr_LastInfo').textContent = lp.rate > 0 ? lp.info : t('পোস্ট করা কোনো ক্রয় নেই', 'no posted purchase');

    pop.querySelector('#pcr_Last').focus();
  }

  // ---------- সেভ / বাতিল ----------
  function resetVoucher() {
    const wasEdit = !!st.editId;
    st.dpIds = []; st.bp = []; st.fg = []; st.rateSrc = ''; st.avgFrom = st.avgTo = ''; st.editId = null;
    $('pc_No').textContent = t('অটো (সেভে বসবে)', 'auto (on save)'); $('pc_Save').innerHTML = '💾 ' + t('সেভ', 'Save');
    if (wasEdit) { loadRec(); loadList(); }
    ['pc_Qty', 'pc_RawPcs', 'pc_RMRate', 'pc_RMRatePc', 'pc_ProcRate', 'pc_SaleKg', 'pc_SalePc'].forEach(function (id) { $(id).value = ''; }); st.rmBasis = 'kg';
    $('pc_Date').value = today; $('pc_RateSrc').textContent = ''; $('pc_ProcSrc').textContent = ''; $('pc_DPHint').textContent = '';
    renderBP(); renderFG(); renderRec(); recalc();
  }
  async function save() {
    const raw = gv('pc_Raw'), wh = gv('pc_Wh'), qty = n(gv('pc_Qty'));
    if (!raw) { showToast(t('কাঁচামাল বাছাই করুন।', 'Pick the raw material.'), 'error'); return; }
    if (!wh) { showToast(t('গুদাম বাছাই করুন।', 'Pick the warehouse.'), 'error'); return; }
    if (!(qty > 0)) { showToast(t('কাঁচামালের পরিমাণ দিন।', 'Enter the raw material quantity.'), 'error'); return; }
    if (!(rmValue() > 0)) { showToast(t('কাঁচামালের দর দিন (ঘরে চাপলে দর বাছাইয়ের পপআপ)।', 'Enter the raw material rate (click the field for options).'), 'error'); return; }
    const fg = [];
    for (let i = 0; i < st.fg.length; i++) {
      const r = st.fg[i], kg = n(r.kg), pcs = n(r.pcs), value = fgValue(r);
      if (!r.itemId && !kg && !pcs) continue;
      if (!r.itemId) { showToast(t('প্রস্তুত পণ্য লাইন ', 'Finished line ') + (i + 1) + t(': আইটেম বাছাই করুন।', ': pick the item.'), 'error'); return; }
      if (!(kg > 0) && !(pcs > 0)) { showToast(t('প্রস্তুত পণ্য লাইন ', 'Finished line ') + (i + 1) + t(': কেজি বা পিস দিন।', ': enter kg or pcs.'), 'error'); return; }
      fg.push({ itemId: r.itemId, kg: kg, pcs: pcs, value: value, rateKg: kg > 0 ? value / kg : n(r.rateKg), ratePc: pcs > 0 ? value / pcs : n(r.ratePc) });
    }
    if (!fg.length) { showToast(t('অন্তত একটা প্রস্তুত পণ্য লাইন দিন।', 'Add at least one finished line.'), 'error'); return; }
    const w = netW(), v = netV(), fk = fg.reduce(function (s, l) { return s + l.kg; }, 0), fv = fg.reduce(function (s, l) { return s + l.value; }, 0), pcs = fg.reduce(function (s, l) { return s + l.pcs; }, 0);
    if ((Math.abs(w - fk) > 0.0005 || Math.abs(v - fv) > 0.5) && !confirm(t('প্রস্তুত পণ্যের মোট নীট ওজন/মূল্যের সাথে মিলছে না। তবুও সেভ করবেন?', 'Finished totals do not match net weight/value. Save anyway?'))) return;
    const bpl = st.bp.filter(function (b) { return n(b.qty) > 0 || n(b.pcs) > 0; }).map(function (b) { const v = bpValue(b); return { ByProductName: b.name || '', ItemID: ((items.find(function (i) { return String(i.ItemName || '').trim() === String(b.name || '').trim(); }) || {}).ItemID) || null, Quantity: n(b.qty), Rate: n(b.qty) > 0 ? v / n(b.qty) : 0, Value: v, QtyPcs: n(b.pcs), RatePerPc: n(b.pcs) > 0 ? v / n(b.pcs) : 0 }; });
    const saleKg = n(gv('pc_SaleKg')), salePc = n(gv('pc_SalePc'));
    const header = {
      Date: gv('pc_Date') || today, RawMaterialItemID: raw, WarehouseID: wh,
      DateFrom: (st.rateSrc === 'avg' && st.avgFrom) ? st.avgFrom : null, DateTo: (st.rateSrc === 'avg' && st.avgTo) ? st.avgTo : null,
      RawMaterialQty: qty, RawMaterialPcs: n(gv('pc_RawPcs')), RawMaterialRate: qty > 0 ? rmValue() / qty : 0, RawMaterialValue: rmValue(),
      ProcessingRate: n(gv('pc_ProcRate')), ProcessingValue: qty * n(gv('pc_ProcRate')), TotalValue: total(),
      ByProductQty: bpQty(), ByProductValue: bpVal(), NetWeight: w, NetValue: v,
      FinishedGoodsItemID: fg[0].itemId, Pieces: pcs, RatePerKg: w > 0 ? v / w : 0, RatePerPiece: pcs > 0 ? v / pcs : 0,
      SaleRatePerKg: saleKg, SaleRatePerPiece: salePc, Profit: saleKg > 0 ? saleKg * w - v : salePc > 0 ? salePc * pcs - v : 0
    };
    const btn = $('pc_Save'); btn.disabled = true;
    try {
      const fgRows = function (id) { return fg.map(function (l) { return { ProcessingID: id, ItemID: l.itemId, QtyKg: l.kg, RatePerKg: l.rateKg, QtyPcs: l.pcs, RatePerPc: l.ratePc, Value: l.value }; }); };
      if (st.editId) {   // সেভ করা (খসড়া) ভাউচার হালনাগাদ
        const pid = st.editId;
        await api('updateDocument', { headerSheet: 'ProcessingVoucher', idField: 'ProcessingID', idValue: pid, linesSheet: 'ProcessingByProduct_Lines', lineIdField: 'ProcessingID', headerData: header, lines: bpl });
        const del = await supabaseClient.from('ProcessingFG_Lines').delete().eq('ProcessingID', pid); if (del.error) throw new Error(del.error.message);
        const ins = await supabaseClient.from('ProcessingFG_Lines').insert(fgRows(pid)); if (ins.error) throw new Error(ins.error.message);
        await unlinkDP(pid);
        if (st.dpIds.length) { const u = await supabaseClient.from('DailyProduction').update({ ProcessingID: pid }).in('id', st.dpIds); if (u.error) showToast(u.error.message, 'error'); }
        showToast(t('আপডেট হয়েছে ✅ ', 'Updated ✅ ') + pid, 'success');
        listCache = {}; resetVoucher(); $('pc_No').textContent = t('অটো (সেভে বসবে) — শেষ সেভঃ ', 'auto — last saved: ') + pid;
        await loadRec(); await loadList(); btn.disabled = false; return;
      }
      const created = await api('createDocument', { headerSheet: 'ProcessingVoucher', idField: 'ProcessingID', idPrefix: 'PROC', requiredFields: ['RawMaterialItemID', 'WarehouseID', 'FinishedGoodsItemID'], linesSheet: 'ProcessingByProduct_Lines', lineIdField: 'ProcessingID', headerData: header, lines: bpl });
      const pid = created && created.ProcessingID;
      const { error: fgErr } = await supabaseClient.from('ProcessingFG_Lines').insert(fgRows(pid));
      if (fgErr) {
        await supabaseClient.from('ProcessingByProduct_Lines').delete().eq('ProcessingID', pid);
        await supabaseClient.from('ProcessingVoucher').delete().eq('ProcessingID', pid);
        throw new Error(fgErr.message + t(' — (21_processing_fg_lines.sql রান করা আছে কিনা দেখুন)', ' — (check migration 21)'));
      }
      if (st.dpIds.length) { const u = await supabaseClient.from('DailyProduction').update({ ProcessingID: pid }).in('id', st.dpIds); if (u.error) showToast(t('সেভ হয়েছে, কিন্তু দৈনিক উৎপাদনের লাইনে নম্বর বসেনি: ', 'Saved, but daily lines were not marked: ') + u.error.message, 'error'); }
      showToast(t('সেভ হয়েছে ✅ ', 'Saved ✅ ') + pid + t(' — নিচের তালিকা থেকে 💾 পোস্ট করলে প্রস্তুত পণ্য স্টকে জমা হবে', ' — post it (💾) in the list below to put the goods into stock'), 'success');
      listCache = {};
      resetVoucher(); $('pc_No').textContent = t('অটো (সেভে বসবে) — শেষ সেভঃ ', 'auto — last saved: ') + pid;
      await loadRec(); await loadList();
    } catch (err) { showToast(err.message, 'error'); }
    btn.disabled = false;
  }

  // ---------- ঘটনা ----------
  const root = content.querySelector('.pcx');
  root.addEventListener('input', function (e) {
    const el = e.target;
    if (el.hasAttribute('data-bp')) { const b = st.bp[Number(el.getAttribute('data-bp'))], f = el.getAttribute('data-f'); b[f] = el.value; if (f === 'rate') b.drv = 'kg'; if (f === 'ratePc') b.drv = 'pc'; recalc(); return; }
    if (el.hasAttribute('data-fg')) {
      const r = st.fg[Number(el.getAttribute('data-fg'))], f = el.getAttribute('data-f');
      r[f] = el.value;
      if (f === 'rateKg') { r.driver = 'kg'; r.auto = el.value === ''; el.classList.toggle('ov', !r.auto); }
      if (f === 'ratePc') { r.driver = 'pc'; r.auto = el.value === ''; el.classList.toggle('ov', !r.auto); }
      recalc(); return;
    }
    if (el.id === 'pc_RMRate') st.rmBasis = 'kg'; if (el.id === 'pc_RMRatePc') st.rmBasis = 'pc';
    if (['pc_Qty', 'pc_RawPcs', 'pc_RMRate', 'pc_RMRatePc', 'pc_ProcRate', 'pc_SaleKg', 'pc_SalePc'].indexOf(el.id) !== -1) {
      if (el.id === 'pc_RMRate') { st.rateSrc = el.value ? 'manual' : ''; $('pc_RateSrc').textContent = el.value ? t('হাতে লেখা', 'typed') : ''; }
      if (el.id === 'pc_ProcRate') $('pc_ProcSrc').textContent = el.value ? t('হাতে লেখা', 'typed') : '';
      recalc();
    }
  });
  root.addEventListener('change', function (e) {
    const el = e.target;
    if (el.hasAttribute('data-fg') && el.getAttribute('data-f') === 'itemId') { st.fg[Number(el.getAttribute('data-fg'))].itemId = el.value; return; }
    if (el.id === 'pc_RecAll') { document.querySelectorAll('[data-rec]').forEach(function (c) { c.checked = el.checked; }); return; }
    if (el.id === 'pc_Raw') { st.rateSrc = ''; $('pc_RMRate').value = ''; $('pc_RateSrc').textContent = ''; recalc(); }
  });
  root.addEventListener('click', function (e) {
    const el = e.target;
    if (el.id === 'pc_RMRate') { openRatePopup(); return; }
    const b = el.closest('button'); if (!b) return;
    if (b.hasAttribute('data-bpadd')) { st.bp.push({ name: '', qty: '', pcs: '', rate: '', ratePc: '', drv: 'kg' }); renderBP(); recalc(); const q = root.querySelector(`[data-bp="${st.bp.length - 1}"][data-f="name"]`); if (q) q.focus(); }
    else if (b.hasAttribute('data-bpdel')) { st.bp.splice(Number(b.getAttribute('data-bpdel')), 1); renderBP(); recalc(); }
    else if (b.hasAttribute('data-fgadd')) { st.fg.push({ itemId: '', kg: '', pcs: '', rateKg: '', ratePc: '', driver: 'kg', auto: true }); renderFG(); recalc(); const q = root.querySelector(`[data-fg="${st.fg.length - 1}"][data-f="itemId"]`); if (q) q.focus(); }
    else if (b.hasAttribute('data-fgdel')) { st.fg.splice(Number(b.getAttribute('data-fgdel')), 1); renderFG(); recalc(); }
  });
  $('pc_RMRate').addEventListener('keydown', function (e) { if (e.key === 'F2' || (e.key === 'Enter' && !this.value)) { e.preventDefault(); openRatePopup(); } });
  $('pc_RecLoad').addEventListener('click', loadRec);
  $('pc_RecPost').addEventListener('click', postSelected);
  $('pc_Save').addEventListener('click', save);
  $('pc_Cancel').addEventListener('click', function () { if (confirm(st.editId ? t('এডিট বাতিল করে নতুন ভাউচারে ফিরবেন? (সেভ করা ভাউচার যেমন ছিল থাকবে)', 'Cancel editing? (the saved voucher stays as it was)') : t('ভাউচারের সব লেখা মুছে নতুন করে শুরু করবেন?', 'Clear the voucher and start again?'))) resetVoucher(); });

  wireSequentialKeyNav($('pc_Voucher'));

  const pre = window.__pcPreselect; window.__pcPreselect = null;
  const editPre = window.__pcEditId; window.__pcEditId = null;   // স্টক ওভারভিউর কার্ড থেকে "এডিট"
  if (pre && pre.ids && pre.ids.length) { $('pc_RecFrom').value = pre.from; $('pc_RecTo').value = pre.to; }
  await loadRec();
  await loadList();
  if (editPre) { try { await loadIntoForm(editPre); } catch (e) { showToast(e.message, 'error'); } }
  if (pre && pre.ids && pre.ids.length) {   // দৈনিক উৎপাদনের "⚙️ প্রসেসিং ভাউচার তৈরী" থেকে আসা — লাইনগুলো টিক দিয়ে ভাউচারে বসানো
    document.querySelectorAll('[data-rec]').forEach(function (c) { c.checked = pre.ids.map(String).indexOf(c.getAttribute('data-rec')) !== -1; });
    await postSelected();
  }
}

async function renderProcessingPage(content) {
  content.innerHTML = `
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="প্রসেসিং" data-en="Processing">${t('প্রসেসিং','Processing')}</h1>

      </div>
      <button class="btn btn-primary i18n" style="width:auto;" id="procAddBtn" data-bn="+ নতুন যোগ করুন" data-en="+ Add New">${t('+ নতুন যোগ করুন','+ Add New')}</button></div>
    <div class="panel"><div id="procTableWrap"></div></div>`;

  async function loadList() {
    const [records, items] = await Promise.all([api('list', { sheet:'ProcessingVoucher' }), cachedList('Items')]);
    const itemMap = {}; items.forEach(function (i) { itemMap[i.ItemID] = i.ItemName; });
    // প্রস্তুত পণ্য লাইন (টেবিল না থাকলে/ফাঁকা হলে আগের মতো হেডারের আইটেম দেখানো হয়)
    const fgByProc = {};
    try {
      const fr = await supabaseClient.from('ProcessingFG_Lines').select('ProcessingID,ItemID,QtyKg,QtyPcs');
      (fr.data || []).forEach(function (l) { (fgByProc[l.ProcessingID] = fgByProc[l.ProcessingID] || []).push(l); });
    } catch (e) { /* ignore */ }
    const wrap = document.getElementById('procTableWrap');
    if (!wrap) return;
    const active = records.filter(function (r) { return r.Status !== 'Deleted'; });
    if (active.length === 0) {
      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এখনো কোনো প্রসেসিং ভাউচার তৈরি হয়নি।" data-en="No processing vouchers created yet.">${t('এখনো কোনো প্রসেসিং ভাউচার তৈরি হয়নি।','No processing vouchers created yet.')}</div>`;
      return;
    }
    const headers = [['আইডি','ID'],['তারিখ','Date'],['কাঁচামাল','Raw Material'],['প্রস্তুত পণ্য','Finished Goods'],['নেট ওজন','Net Weight'],['নেট মূল্য','Net Value'],['অবস্থা','Status']];
    const headCells = headers.map(function (h) { return `<th class="i18n" data-bn="${h[0]}" data-en="${h[1]}">${t(h[0], h[1])}</th>`; }).join('');
    const bodyRows = active.slice().reverse().map(function (r) {
      const postBtn = r.Status !== 'Posted'
        ? `<button class="btn" style="width:auto;padding:6px 12px;font-size:12px;" onclick='postProcessingRecord(${JSON.stringify(r.ProcessingID)})'>${t('পোস্ট করুন','Post')}</button>`
        : '';
      return `<tr>
        <td>${escapeHtml(r.ProcessingID)}</td><td>${escapeHtml(r.Date)}</td>
        <td>${escapeHtml(itemMap[r.RawMaterialItemID] || r.RawMaterialItemID)}</td>
        <td>${(fgByProc[r.ProcessingID] && fgByProc[r.ProcessingID].length)
          ? fgByProc[r.ProcessingID].map(function (l) { return escapeHtml(itemMap[l.ItemID] || l.ItemID) + ' <span style="color:var(--text-muted);font-size:11px;">(' + (Number(l.QtyKg) ? Number(l.QtyKg).toFixed(2) + ' ' + t('কেজি','kg') : '') + (Number(l.QtyKg) && Number(l.QtyPcs) ? ' / ' : '') + (Number(l.QtyPcs) ? Number(l.QtyPcs) + ' ' + t('পিস','pcs') : '') + ')</span>'; }).join('<br>')

        <td>${escapeHtml(r.NetWeight)}</td><td>${escapeHtml(r.NetValue)}</td>
        <td>${r.Status === 'Posted' ? `<span class="badge active">${t('পোস্ট করা','Posted')}</span>` : `<span class="badge draft">${t('খসড়া','Draft')}</span>`}</td>

      </tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}<th></th></tr></thead><tbody>${bodyRows}</tbody></table>`;
  }

  await loadList();
  window.__refreshProcessingList = loadList;

}

async function postProcessingRecord(processingId) {
  if (!confirm(t('আপনি কি নিশ্চিত এই প্রসেসিং ভাউচার পোস্ট করতে চান? পোস্ট হয়ে গেলে স্টকে এন্ট্রি পড়বে এবং এটা আর বাতিল করা যাবে না।','Are you sure you want to post this Processing Voucher? Once posted, stock entries will be created and this cannot be undone.'))) return;
  try {
    await api('postDocument', { docType: 'ProcessingVoucher', docId: processingId });
    showToast(t('পোস্ট হয়েছে ✅','Posted ✅'), 'success');
    if (window.__refreshProcessingList) await window.__refreshProcessingList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

      const fgHint = t(' — (21_processing_fg_lines.sql মাইগ্রেশন রান করা আছে কিনা দেখুন)',' — (check that migration 21_processing_fg_lines.sql has been run)');

      let savedId = state.id;
      if (state.id) {
        await api('updateDocument', {
          headerSheet: 'ProcessingVoucher', idField: 'ProcessingID', idValue: state.id,
          linesSheet: 'ProcessingByProduct_Lines', lineIdField: 'ProcessingID',
          headerData: d.header, lines: d.lines
        });
        const del = await supabaseClient.from('ProcessingFG_Lines').delete().eq('ProcessingID', state.id);
        if (del.error) throw new Error(del.error.message + fgHint);
        const ins = await supabaseClient.from('ProcessingFG_Lines').insert(fgRows(state.id));
        if (ins.error) throw new Error(ins.error.message + fgHint);
      } else {
        const created = await api('createDocument', {
          headerSheet: 'ProcessingVoucher', idField: 'ProcessingID', idPrefix: 'PROC',
          requiredFields: ['RawMaterialItemID','WarehouseID','FinishedGoodsItemID'],
          linesSheet: 'ProcessingByProduct_Lines', lineIdField: 'ProcessingID',
          headerData: d.header, lines: d.lines
        });
        savedId = created && created.ProcessingID;
        // প্রস্তুত পণ্যের লাইন আলাদা টেবিলে; না বসলে অসম্পূর্ণ ভাউচার যেন পড়ে না থাকে
        const { error: fgErr } = await supabaseClient.from('ProcessingFG_Lines').insert(fgRows(savedId));
        if (fgErr) {
          await supabaseClient.from('ProcessingByProduct_Lines').delete().eq('ProcessingID', savedId);
          await supabaseClient.from('ProcessingVoucher').delete().eq('ProcessingID', savedId);
          throw new Error(fgErr.message + fgHint);
        }
      }
      // দৈনিক উৎপাদনের যে লাইনগুলো দিয়ে এই ভাউচার, সেগুলোতে ভাউচার নম্বর (আগে যুক্ত, এখন বাদ পড়া লাইনগুলো মুক্ত)
      if (savedId) {
        try {
          const u1 = await supabaseClient.from('DailyProduction').update({ ProcessingID: null }).eq('ProcessingID', savedId);
          if (u1.error) throw new Error(u1.error.message);
          const ids = window.__procDPIds || [];
          if (ids.length) { const u2 = await supabaseClient.from('DailyProduction').update({ ProcessingID: savedId }).in('id', ids); if (u2.error) throw new Error(u2.error.message); }
        } catch (e) {
          if ((window.__procDPIds || []).length) showToast(t('ভাউচার সেভ হয়েছে, কিন্তু দৈনিক উৎপাদনের লাইনে ভাউচার নম্বর বসানো যায়নি: ','Voucher saved, but the daily production lines could not be marked: ') + e.message, 'error');
        }
      }
      showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
      if (window.__refreshProcessingList) await window.__refreshProcessingList();
    }
  });

  // দৈনিক উৎপাদন (প্রোডাকশন মেনু) থেকে আনা — সার্কেলের মোট, কাটিং/ভাঙ্গাড়ী/অপচয় বাই-প্রডাক্টে,
  // আর তৈরী আইটেমগুলো ক্রঃ অনুযায়ী (আইটেম ধরে কেজি ও পিস যোগ করে) প্রস্তুত পণ্যের লাইনে; দর নেট মূল্য থেকে নিজে আসে
  document.getElementById('pv_FetchDPBtn').addEventListener('click', async function () {
    const from = val('pv_DPFrom') || val('pv_Date'), to = val('pv_DPTo') || from;
    if (!from) { showToast(t('দৈনিক উৎপাদনের তারিখ দিন।','Enter the daily production date.'), 'error'); return; }
    if (from > to) { showToast(t('"তারিখ হইতে" অবশ্যই "তারিখ পর্যন্ত"-এর আগে হতে হবে।','Date from must be before date to.'), 'error'); return; }
    const range = formatShortDate(from) + (to !== from ? ' — ' + formatShortDate(to) : '');
    try {
      const { data, error } = await supabaseClient.from('DailyProduction').select('*').gte('ProdDate', from).lte('ProdDate', to);
      if (error) throw new Error(error.message + t(' — (25_daily_production_lines.sql রান করা আছে কিনা দেখুন)',' — (check that 25_daily_production_lines.sql has been run)'));
      const all = data || [];
      const free = all.filter(function (r) { return !r.ProcessingID || (state.id && r.ProcessingID === state.id); });
      const usedElse = all.length - free.length;
      // কোন সার্কেল — সেটা এই ফর্মের "কাঁচামাল আইটেম"; দৈনিক উৎপাদনের লাইনে আইটেম থাকে না (আগের কিছু লাইনে থাকলে মিলিয়ে নেওয়া হয়)
      let raw = val('pv_RawMaterialItemID');
      const raws = Array.from(new Set(free.map(function (r) { return r.RawItemID; }).filter(Boolean)));
      if (!raw && raws.length === 1 && free.every(function (r) { return r.RawItemID; })) { raw = raws[0]; document.getElementById('pv_RawMaterialItemID').value = raw; }
      const rows = free.filter(function (r) { return !raw || !r.RawItemID || r.RawItemID === raw; })
        .sort(function (a, b) { return String(a.ProdDate).localeCompare(String(b.ProdDate)) || ((Number(a.SerialNo) || 0) - (Number(b.SerialNo) || 0)); });
      if (!rows.length) {
        document.getElementById('pv_DPHint').textContent = range + ': ' + t('কোনো লাইন পাওয়া যায়নি','no lines found') + (usedElse ? ' — ' + usedElse + t('টা লাইন আগেই অন্য প্রসেসিং ভাউচারে ব্যবহৃত',' line(s) already used in another processing voucher') : '');
        showToast(t('এই তারিখে ব্যবহারযোগ্য দৈনিক উৎপাদনের লাইন নেই।','No usable daily production lines for these dates.'), 'error'); return;
      }
      const sum = function (f) { return rows.reduce(function (s, r) { return s + (Number(r[f]) || 0); }, 0); };
      const rawQty = sum('RawQty'), cut = sum('CuttingQty'), scrap = sum('ScrapQty'), waste = sum('WasteQty');
      document.getElementById('pv_Qty').value = String(+rawQty.toFixed(3));
      // বাই-প্রডাক্টঃ কাটিং/ভাঙ্গাড়ী/অপচয় — আগে লেখা দর/আইটেম থাকলে সেটা রেখে পরিমাণ বসানো; অন্য নামের সারি যেমন ছিল থাকে
      syncProcByProductRows();
      const prev = window.__procByProductRows.slice(), names = ['কাটিং', 'ভাঙ্গাড়ী', 'অপচয়'];
      const bps = [[names[0], cut], [names[1], scrap], [names[2], waste]].filter(function (x) { return x[1] > 0; }).map(function (x) {
        const old = prev.find(function (r) { return String(r.name || '').trim() === x[0]; });
        return { name: x[0], itemId: old ? old.itemId : '', qty: String(+x[1].toFixed(3)), rate: old ? old.rate : '' };
      });
      window.__procByProductRows = bps.concat(prev.filter(function (r) { return names.indexOf(String(r.name || '').trim()) === -1 && (r.name || r.qty); }));
      renderProcByProductRows();
      // প্রস্তুত পণ্যঃ তারিখ ও ক্রঃ অনুযায়ী, প্রতিটা লাইনের আইটেম-১→২→৩ — একই আইটেম হলে কেজি ও পিস যোগ
      const order = [], agg = {};
      rows.forEach(function (r) {
        for (let i = 1; i <= 3; i++) {
          const id = r['FG' + i + 'ItemID'], k = Number(r['FG' + i + 'Kg']) || 0, p = Number(r['FG' + i + 'Pcs']) || 0;
          if (!id || (!k && !p)) continue;
          if (!agg[id]) { agg[id] = { k: 0, p: 0 }; order.push(id); }
          agg[id].k += k; agg[id].p += p;
        }
      });
      window.__procFGRows = order.length ? order.map(function (id) { return { itemId: id, kg: String(+agg[id].k.toFixed(3)), pcs: agg[id].p ? String(agg[id].p) : '', rateKg: '', ratePc: '', driver: 'kg', auto: true }; }) : [{}];
      renderFGRows();
      window.__procDPIds = rows.map(function (r) { return r.id; });
      if (!val('pv_WageFrom') && !val('pv_WageTo')) { document.getElementById('pv_WageFrom').value = from; document.getElementById('pv_WageTo').value = to; }   // মজুরিও একই দিনগুলোর
      recalcProcessing();
      const fgK = order.reduce(function (s, id) { return s + agg[id].k; }, 0), fgP = order.reduce(function (s, id) { return s + agg[id].p; }, 0);
      document.getElementById('pv_DPHint').textContent = range + ': ' + rows.length + t('টা লাইন — সার্কেল ',' lines — circle ') + (+rawQty.toFixed(3)) + t(' কেজি, কাটিং ',' kg, cutting ') + (+cut.toFixed(3)) + t(', ভাঙ্গাড়ী ',', scrap ') + (+scrap.toFixed(3)) + t(', অপচয় ',', wastage ') + (+waste.toFixed(3)) +
        t(' → তৈরী পণ্য ',' → finished ') + (+fgK.toFixed(3)) + t(' কেজি / ',' kg / ') + fgP + t(' পিস (',' pcs (') + order.length + t('টা আইটেম, ক্রঃ অনুযায়ী)',' items, in line order)') + (usedElse ? ' · ' + usedElse + t('টা লাইন আগেই অন্য ভাউচারে',' line(s) already in another voucher') : '');
      if (!val('pv_RawMaterialItemID')) showToast(t('বসানো হয়েছে — এখন উপরে "কাঁচামাল আইটেম"-এ সার্কেল বাছাই করুন।','Filled — now pick the circle in "Raw material item" above.'), 'success');
      else showToast(t('দৈনিক উৎপাদন থেকে বসানো হয়েছে ✅','Filled from daily production ✅'), 'success');
    } catch (err) { showToast(err.message, 'error'); }
  });

  // দৈনিক উৎপাদন ও দল পেজের মজুরির যোগফল → উৎপাদন খরচ (উৎপাদন খরচ মূল্য = মোট মজুরি, প্রতি কেজি = মজুরি ÷ কাঁচামালের কেজি)
  document.getElementById('pv_FetchWageBtn').addEventListener('click', async function () {
    const from = val('pv_WageFrom') || val('pv_Date'), to = val('pv_WageTo') || from;
    const qty = Number(val('pv_Qty')) || 0;
    if (!from) { showToast(t('মজুরির তারিখ দিন।','Enter the wage date.'), 'error'); return; }
    if (from > to) { showToast(t('"তারিখ হইতে" অবশ্যই "তারিখ পর্যন্ত"-এর আগে হতে হবে।','Date From must be before Date To.'), 'error'); return; }
    if (!(qty > 0)) { showToast(t('আগে কাঁচামালের পরিমাণ (কেজি) দিন — মজুরি প্রতি কেজিতে ভাগ হয়ে উৎপাদন খরচে বসবে।','Enter the raw material quantity first — wages are spread per kg into the processing cost.'), 'error'); return; }
    const onlyFG = document.getElementById('pv_WageOnlyFG').checked;
    // প্রস্তুত পণ্যের লাইনে যে আইটেমগুলো বাছাই করা (দর তখনো না থাকলেও চলবে — যেমন দৈনিক উৎপাদন থেকে সবে আনা)
    const fgIds = onlyFG ? Array.from(new Set(Array.from(document.querySelectorAll('#pv_FGWrap select[data-f="item"]')).map(function (s) { return s.value; }).filter(Boolean))) : [];
    if (onlyFG && !fgIds.length) { showToast(t('আগে প্রস্তুত পণ্যের লাইন দিন, অথবা "শুধু এই ভাউচারের প্রস্তুত পণ্য" টিক তুলে দিন।','Add finished goods lines first, or untick "only this voucher’s finished goods".'), 'error'); return; }
    try {
      const heads = await hrQueryRange('TeamProduction', 'WorkDate', from, to);
      let wage = 0, cost = 0, kg = 0; const itemsSeen = {}, days = {};
      if (heads.length) {
        const ids = heads.map(function (h) { return h.TeamProdID; });
        const [ri, rm, rc, gpc] = await Promise.all([
          supabaseClient.from('TeamProduction_Items').select('*').in('TeamProdID', ids), supabaseClient.from('TeamProduction_Members').select('*').in('TeamProdID', ids),
          supabaseClient.from('TeamProduction_Costs').select('*').in('TeamProdID', ids), hrLoadGroups()
        ]);
        if (ri.error) throw new Error(ri.error.message);
        if (rm.error) throw new Error(rm.error.message);
        // শুধু এখনকার খরচের খাতের সারি — কোনো খাত (যেমন ধোলাই) কর্মচারীর কাজে বদলালে তার আগের খরচ-সারি দুবার ধরা হবে না
        const costIds = {}; gpc.costRoles.forEach(function (ro) { costIds[ro.RoleID] = true; });
        const costRows = ((rc && !rc.error && rc.data) || []).filter(function (c) { return costIds[c.RoleID]; });
        const hDate = {}; heads.forEach(function (h) { hDate[String(h.TeamProdID)] = String(h.WorkDate).slice(0, 10); });
        const byTp = {}; (ri.data || []).forEach(function (x) { (byTp[String(x.TeamProdID)] = byTp[String(x.TeamProdID)] || []).push(x); });
        const ok = function (id) { return !fgIds.length || fgIds.indexOf(id) !== -1; };
        (ri.data || []).forEach(function (x) { if (ok(x.ItemID)) { kg += Number(x.Qty) || 0; itemsSeen[x.ItemID] = true; days[hDate[String(x.TeamProdID)]] = true; } });
        (rm.data || []).forEach(function (mm) {   // একাধিক আইটেম হলে কেজি অনুপাতে ভাগ (রিপোর্টের নিয়মেই)
          const its = byTp[String(mm.TeamProdID)] || [], tot = its.reduce(function (s, x) { return s + (Number(x.Qty) || 0); }, 0) || 1;
          its.forEach(function (x) { if (ok(x.ItemID)) wage += (Number(mm.Amount) || 0) * (Number(x.Qty) || 0) / tot; });
        });
        // খরচের খাতঃ সেভ করা খরচ; কোনো দিনের সারিতে খরচ সেভ না থাকলে (এই সুবিধার আগের এন্ট্রি) এখনকার দর × কেজি ধরা হয়
        const costByTp = {}; costRows.forEach(function (c) { (costByTp[String(c.TeamProdID)] = costByTp[String(c.TeamProdID)] || []).push(c); });
        heads.forEach(function (h) {
          const key = String(h.TeamProdID), its = byTp[key] || [], tot = its.reduce(function (s, x) { return s + (Number(x.Qty) || 0); }, 0) || 1;
          if (costByTp[key]) {
            const amt = costByTp[key].reduce(function (s, c) { return s + (Number(c.Amount) || 0); }, 0);
            its.forEach(function (x) { if (ok(x.ItemID)) cost += amt * (Number(x.Qty) || 0) / tot; });
          } else {
            its.forEach(function (x) { if (ok(x.ItemID)) cost += (Number(x.Qty) || 0) * gpc.costRoles.reduce(function (s, ro) { return s + gpc.rateOf(x.ItemID, ro.RoleID); }, 0); });
          }
        });
      }
      const range = formatShortDate(from) + (to !== from ? ' — ' + formatShortDate(to) : '');
      const total = wage + cost;
      if (!(total > 0)) {
        document.getElementById('pv_WageHint').textContent = range + ': ' + t('কোনো মজুরি বা খরচ পাওয়া যায়নি।','no wages or costs found.');
        showToast(t('এই তারিখে দৈনিক উৎপাদনে কোনো মজুরি বা খরচ পাওয়া যায়নি।','No daily-production wages or costs found for these dates.'), 'error'); return;
      }
      document.getElementById('pv_ProcRate').value = String(+(total / qty).toFixed(8));   // পুরো মান — যাতে উৎপাদন খরচ মূল্য ঠিক মজুরি+খরচের সমান হয়
      recalcProcessing();
      document.getElementById('pv_WageHint').textContent = range + ': ' + Object.keys(itemsSeen).length + t('টা আইটেম, ',' items, ') + hrNum(kg) + t(' কেজি — মজুরি ৳',' kg — wages ৳') + wage.toFixed(2) +
        t(' + খরচ ৳',' + costs ৳') + cost.toFixed(2) + ' = ৳' + total.toFixed(2) +
        t(' উৎপাদন খরচে বসানো হলো (প্রতি কেজি ',' set as processing cost (per kg ') + (total / qty).toFixed(2) + ')' + (fgIds.length ? t(' — শুধু এই ভাউচারের প্রস্তুত পণ্য',' — this voucher’s finished goods only') : t(' — সব আইটেম',' — all items'));
      showToast(t('মজুরি ও খরচ উৎপাদন খরচে বসানো হয়েছে ✅','Wages & costs set as processing cost ✅'), 'success');
    } catch (err) { showToast(err.message, 'error'); }

  function syncProcByProductRows() {
