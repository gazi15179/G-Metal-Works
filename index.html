/** ব্যাকআপ ও পুনরুদ্ধার — প্রতিটা Sheet-এর ডেটা JSON হিসেবে ডাউনলোড করা যাবে।
 *  আপলোড করে পুনরুদ্ধার (restore) করার ফিচারটা এখনো Phase 4-এ যুক্ত হয়নি —
 *  কারণ ভুল করে পুরনো ডেটা দিয়ে বর্তমান ডেটা ওভাররাইট হয়ে গেলে সেটা আর
 *  ফেরত আনার কোনো উপায় থাকবে না, তাই সেটা সাবধানে আলাদা ধাপে যোগ হবে। */
async function renderBackupRestorePage(content) {
  content.innerHTML = `
    <div class="page-head"><div><h1>ব্যাকআপ ও পুনরুদ্ধার</h1><p>পুরো ডেটাবেসের ব্যাকআপ ডাউনলোড করুন</p></div></div>
    <div class="panel"><div class="modal-body" style="padding:22px;">
      <p style="font-size:13.5px;color:var(--text-muted);margin-bottom:16px;">নিচের বাটনে ক্লিক করলে সব Sheet-এর ডেটা একটা JSON ফাইলে ডাউনলোড হবে। এটা নিয়মিত করে রাখা ভালো অভ্যাস।</p>
      <button class="btn btn-primary" style="width:auto;" id="backupBtn">⬇ সম্পূর্ণ ব্যাকআপ ডাউনলোড করুন</button>
      <div id="backupProgress" style="margin-top:14px;font-size:12.5px;color:var(--text-muted);"></div>
    </div></div>`;

  document.getElementById('backupBtn').addEventListener('click', async function () {
    const btn = this; btn.disabled = true;
    const progressEl = document.getElementById('backupProgress');
    const allData = {};
    try {
      for (let i = 0; i < ALL_DATA_SHEETS.length; i++) {
        const sheet = ALL_DATA_SHEETS[i];
        progressEl.textContent = 'আনা হচ্ছে: ' + sheet + ' (' + (i+1) + '/' + ALL_DATA_SHEETS.length + ')';
        try { allData[sheet] = await api('list', { sheet: sheet }); } catch (e) { allData[sheet] = []; }
      }
      const blob = new Blob([JSON.stringify(allData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'gmetal-backup-' + new Date().toISOString().slice(0,10) + '.json';
      a.click();
      URL.revokeObjectURL(url);
      progressEl.textContent = 'ব্যাকআপ সম্পন্ন ✅';
      showToast('ব্যাকআপ ডাউনলোড হয়েছে ✅', 'success');
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  });
}

/* ============================================================
   ১৪) জেনেরিক MODAL — সব পেজের ফর্মই এই একটা মোডাল পুনর্ব্যবহার করে
   ============================================================ */
let modalOnSaveHandler = null;

/* ===== উইন্ডো ব্যবস্থাপক: প্রতিটা উইন্ডোতে − (মিনিমাইজ) ▢ (ম্যাক্সিমাইজ) ✕ (বন্ধ) =====
   • মিনিমাইজ করলে উইন্ডোর লেখা/ঘর যেমন ছিল তেমনই নিচের টাস্কবারে জমা থাকে (DOM সরিয়ে রাখা হয়, মোছা হয় না)
   • খোলা উইন্ডো থাকা অবস্থায় নতুন উইন্ডো খুললে আগেরটা নিজে মিনিমাইজ হয়
   • পিছনের ফাঁকা জায়গায় ক্লিক করলে বন্ধ নয় — মিনিমাইজ হয় (ভুল ক্লিকে লেখা হারাবে না) */
let modalWindows = [], modalSeq = 0, modalCurrentTitle = '', modalCurrentKey = '', modalPendingKey = '';
function modalIsOpen() { return document.getElementById('modalOverlay').classList.contains('show'); }
function setModalMax(on) {
  document.getElementById('modalBox').classList.toggle('modal-max', !!on);
  document.getElementById('modalOverlay').classList.toggle('has-max', !!on);
  const b = document.getElementById('modalMaxBtn'); if (b) { b.textContent = on ? '❐' : '▢'; b.title = on ? 'আগের মাপ' : 'ম্যাক্সিমাইজ'; }
}
function minimizeModal() {
  if (!modalIsOpen()) return;
  const body = document.getElementById('modalBody'), acts = document.getElementById('modalHeaderActions');
  const holder = document.createElement('div'), actHolder = document.createElement('div');
  while (body.firstChild) holder.appendChild(body.firstChild);
  while (acts.firstChild) actHolder.appendChild(acts.firstChild);
  const err = document.getElementById('modalError');
  modalWindows.push({
    id: ++modalSeq, key: modalCurrentKey, title: modalCurrentTitle || document.getElementById('modalTitle').textContent,
    holder: holder, actHolder: actHolder, actShow: acts.style.display, onSave: modalOnSaveHandler,
    wide: document.getElementById('modalBox').classList.contains('modal-wide'),
    max: document.getElementById('modalBox').classList.contains('modal-max'),
    hideSave: document.getElementById('modalSaveBtn').style.display === 'none',
    errText: err.textContent, errShow: err.classList.contains('show'), scroll: body.scrollTop
  });
  document.getElementById('modalOverlay').classList.remove('show');
  acts.style.display = 'none'; modalOnSaveHandler = null; setModalMax(false);
  renderModalTaskbar();
}
function restoreModal(id) {
  const w = modalWindows.find(function (x) { return x.id === id; }); if (!w) return;
  if (modalIsOpen()) minimizeModal();
  modalWindows = modalWindows.filter(function (x) { return x.id !== id; });
  const body = document.getElementById('modalBody'), acts = document.getElementById('modalHeaderActions');
  body.innerHTML = ''; acts.innerHTML = '';
  while (w.holder.firstChild) body.appendChild(w.holder.firstChild);
  while (w.actHolder.firstChild) acts.appendChild(w.actHolder.firstChild);
  acts.style.display = w.actShow || (acts.children.length ? 'flex' : 'none');
  document.getElementById('modalTitle').textContent = w.title; modalCurrentTitle = w.title; modalCurrentKey = w.key || '';
  document.getElementById('modalBox').classList.toggle('modal-wide', !!w.wide);
  setModalMax(w.max);
  document.getElementById('modalSaveBtn').style.display = w.hideSave ? 'none' : '';
  const err = document.getElementById('modalError'); err.textContent = w.errText || ''; err.classList.toggle('show', !!w.errShow);
  modalOnSaveHandler = w.onSave;
  document.getElementById('modalOverlay').classList.add('show');
  body.scrollTop = w.scroll || 0;
  renderModalTaskbar();
}
function discardModalWindow(id) {
  if (!confirm('এই উইন্ডোটা বন্ধ করবেন? সেভ না করা লেখা হারিয়ে যাবে।')) return;
  modalWindows = modalWindows.filter(function (x) { return x.id !== id; });
  renderModalTaskbar();
}
// একই ধরনের ফর্ম (যেমন ক্রয় ভাউচার) একসাথে দুটো নয় — নিচে মিনিমাইজ করা থাকলে সেটাই ফেরত আসে (ফর্মগুলোর কিছু তথ্য এক জায়গায় থাকে)
function singleWindowForm(fnName) {
  const orig = window[fnName]; if (typeof orig !== 'function' || orig.__single) return;
  const wrapped = async function () {
    const w = modalWindows.find(function (x) { return x.key === fnName; });
    if (w) { restoreModal(w.id); showToast('এই ধরনের একটা উইন্ডো নিচে মিনিমাইজ করা ছিল — সেটাই খোলা হলো। নতুনটা খুলতে আগে এটা সেভ বা বন্ধ করুন।', 'error'); return; }
    if (modalIsOpen() && modalCurrentKey === fnName) closeModal();   // একই ধরনের খোলা ফর্ম আগের মতোই বদলে যায় (তথ্য গুলিয়ে না যায়)

function amountDrCrFieldHtml(id, label, currentVal) {

}
function readAmountDrCr(id) {

}
/** সব ভাউচার/লেজার প্রিন্টে ব্যবহৃত তারিখ+সময়ের কমপ্যাক্ট ফরম্যাট —
 *  যেমন 26/09/26;4:27:21AM (DD/MM/YY;H:MM:SSAM/PM) */
function formatPrintDate(d) {
  d = d || new Date();
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yy = String(d.getFullYear()).slice(-2);
  let h = d.getHours();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  const mi = String(d.getMinutes()).padStart(2, '0');
  const ss = String(d.getSeconds()).padStart(2, '0');
  return dd + '/' + mm + '/' + yy + ';' + h + ':' + mi + ':' + ss + ampm;
}

/** ভাউচারের নিজের তারিখ (সেভ থাকে YYYY-MM-DD হিসেবে) প্রিন্টে DD-MM-YY

function formatShortDate(isoDate) {
  if (!isoDate) return '';
  const parts = String(isoDate).split('-');
  if (parts.length !== 3) return isoDate;
  const [yyyy, mm, dd] = parts;
  return dd + '-' + mm + '-' + yyyy;   // সব জায়গায় 09-10-2026 (চার অঙ্কের বছর)
}

        <td class="l">${escapeHtml(item.ItemName || l.itemId)}</td>
        <td>${Q3(x.kg)}</td><td>${Q3(x.pc)}</td>

      </tr>`;
    }).join('');
  }
  function sumField(lines, field) { return lines.reduce(function (s, l) { return s + (Number(l[field]) || 0); }, 0); }
  function sumNet(lines) { return lines.reduce(function (s, l) { return s + (Number(l.netAmount !== undefined ? l.netAmount : l.amount) || 0); }, 0); }

  function sumKP(lines) { return lines.reduce(function (s, l) { const x = kp(l); s.kg += x.kg; s.pc += x.pc; return s; }, { kg: 0, pc: 0 }); }
  const mainKP = sumKP(opts.mainLines), retKP = sumKP(opts.returnLines);
  const mainQty = sumField(opts.mainLines, 'qty'), mainAmt = sumField(opts.mainLines, 'amount'), mainComm = sumField(opts.mainLines, 'commAmount'), mainNet = sumNet(opts.mainLines);
  const retQty = sumField(opts.returnLines, 'qty'), retAmt = sumField(opts.returnLines, 'amount'), retComm = sumField(opts.returnLines, 'commAmount'), retNet = sumNet(opts.returnLines);
  const netGrandTotal = mainNet + (opts.cashExpenseAmt || 0) - (opts.discountAmt || 0) - retNet;
  const colCount = (hasComm ? 10 : 7) + (pcol ? 1 : 0);
  const sumProfit = function (lines) { return lines.reduce(function (s, l) { return s + lineProfit(l); }, 0); };
  const mainProfit = sumProfit(opts.mainLines), retProfit = sumProfit(opts.returnLines);
  const vatAmt = Number(opts.vatAmount) || 0, vatRate = Number(opts.vatRate) || 0;
  const voucherGrand = netGrandTotal + vatAmt;
  // শুধু-ফেরত ভাউচার (ক্রয় ফেরত / বিক্রয় ফেরত) — যোগফল ঋণাত্মক হয়, তাই চিহ্ন ছাড়া (−) দিয়ে দেখানো হবে
  const isReturnOnly = opts.mainLines.length === 0 && opts.returnLines.length > 0;
  const SM = function (n) { return (n < 0 ? '(−) ' : '') + M(Math.abs(n)); };
  const grandQty = Math.abs(mainQty - retQty);
  const grandLabel = isReturnOnly ? 'সর্বমোট ফেরতঃ (ভাউচার)' : 'সর্বমোটঃ (ভাউচার)';
  const colgroup = pcol
    ? (hasComm ? '<colgroup><col style="width:4%"><col style="width:17%"><col style="width:8%"><col style="width:6%"><col style="width:8%"><col style="width:8%"><col style="width:11%"><col style="width:10%"><col style="width:6%"><col style="width:9%"><col style="width:13%"></colgroup>'

  // দুই সারির হেডারঃ পরিমাণ (কেজি | পিস) · দর (কেজি | পিস)
  const headCells = `<th rowspan="2">ক্রঃ</th><th rowspan="2">আইটেম (পণ্য)</th><th colspan="2" class="grp">পরিমাণ</th><th colspan="2" class="grp">দর</th><th rowspan="2" class="r">মূল্য</th>${pcol ? '<th rowspan="2" class="pcol">লাভ</th>' : ''}${hasComm ? '<th rowspan="2">কমিঃ %</th><th rowspan="2" class="r">(-) কমিঃ</th><th rowspan="2" class="r">নিট মূল্য</th>' : ''}</tr><tr class="sub"><th>কেজি</th><th>পিস</th><th class="r">কেজি</th><th class="r">পিস</th>`;
  const totalRow = function (label, q, a, c, n, pr) {
    return `<tr class="total-row"><td colspan="2">${escapeHtml(label)}</td><td>${Q3(q.kg)}</td><td>${Q3(q.pc)}</td><td></td><td></td><td class="r">${M(a)}</td>${pcol ? `<td class="r pcol">${PF(pr || 0)}</td>` : ''}${hasComm ? `<td></td><td class="r">${M(c)}</td><td class="r">${M(n)}</td>` : ''}</tr>`;
  };
  // শেষ ঘরে টাকা — লাভের কলাম থাকলে আর কমিশন না থাকলে টাকা "মূল্য" কলামে, লাভের ঘর ফাঁকা
  const tail = function (valueHtml) { return (pcol && !hasComm) ? `<td class="r">${valueHtml}</td><td class="pcol"></td>` : `<td class="r">${valueHtml}</td>`; };
  const spanL = (pcol && !hasComm) ? colCount - 2 : colCount - 1;
  const labelRow = function (label, valueHtml) {
    return `<tr><td colspan="${spanL}" class="r">${escapeHtml(label)}</td>${tail(valueHtml)}</tr>`;
  };

  // প্রিন্টের তারিখ ও সময় — যখন প্রিভিউ/প্রিন্ট তৈরি হয় তখনকার সময়
  const _now = new Date(), _p = function (n) { return String(n).padStart(2, '0'); };
  const _h = _now.getHours() % 12 || 12;
  const printStamp = _p(_now.getDate()) + '-' + _p(_now.getMonth() + 1) + '-' + _now.getFullYear() + ' ' +
                     _p(_h) + ':' + _p(_now.getMinutes()) + (_now.getHours() < 12 ? ' AM' : ' PM');

  // প্রিন্ট সম্পূর্ণ বাংলায় — কোম্পানি প্রোফাইলে CompanyNameBn/AddressBn থাকলে সেটাই, না থাকলে বাংলা ডিফল্ট
  const coName = co.CompanyNameBn || 'জি মেটাল ওয়ার্কস';

  return `

    </div>
    <div class="v-meta">
      <div class="v-print">প্রিন্টঃ <span class="en">${escapeHtml(printStamp)}</span></div>
      <div class="v-meta-row"><span>ভাউচার নংঃ</span><b class="en">${escapeHtml(opts.voucherNo)}</b></div>
      <div class="v-meta-row"><span>তারিখঃ</span><b class="en">${escapeHtml(formatShortDate(opts.voucherDate))}</b></div>
      ${opts.manualNo ? `<div class="v-meta-row"><span>নিঃ ভাউঃ নংঃ</span><span class="en">${escapeHtml(opts.manualNo)}</span></div>` : ''}
      ${opts.manualDate ? `<div class="v-meta-row"><span>নিঃ ভাউঃ তারিখঃ</span><span class="en">${escapeHtml(formatShortDate(opts.manualDate))}</span></div>` : ''}
      ${opts.isDraft ? '<div class="v-draft">খসড়া — এখনো সেভ হয়নি</div>' : ''}

      ${opts.partyZone ? `<span>জোনঃ ${escapeHtml(opts.partyZone)}</span>` : ''}
    </div>
  </div>

  <table class="items-table">
    ${colgroup}
    <thead><tr>${headCells}</tr></thead>
    ${opts.mainLines.length > 0 ? `
    <tbody>${itemRows(opts.mainLines, 0, 1)}</tbody>
    <tbody>${totalRow(opts.mainTotalLabel, mainKP, mainAmt, mainComm, mainNet, mainProfit)}</tbody>` : ''}
    ${opts.returnLines.length > 0 ? `
    <tbody>
      <tr class="section-head"><td colspan="${colCount}">${escapeHtml(opts.returnLabel)}</td></tr>
      ${itemRows(opts.returnLines, 0, -1)}
      ${totalRow(opts.returnTotalLabel, retKP, retAmt, retComm, retNet, -retProfit)}
    </tbody>` : ''}
    <tbody>
      ${opts.cashExpenseAmt > 0 ? labelRow('খরচ যোগঃ', M(opts.cashExpenseAmt)) : ''}
      ${opts.discountAmt > 0 ? labelRow('ডিসকাউন্টঃ', '− ' + M(opts.discountAmt)) : ''}
      <tr class="grand"><td colspan="${spanL}" class="r">নিট মোটঃ</td>${tail(SM(netGrandTotal))}</tr>
      ${vatAmt > 0 ? `<tr class="vat-row"><td colspan="${spanL}" class="r">ভ্যাটঃ ${vatRate ? '(' + B(vatRate) + ' %)' : ''}</td>${tail('+ ' + M(vatAmt))}</tr>` : ''}
      ${pcol
        ? `<tr class="grand-all"><td colspan="2" class="r">${grandLabel}</td><td>${Q3(Math.abs(mainKP.kg - retKP.kg))}</td><td>${Q3(Math.abs(mainKP.pc - retKP.pc))}</td><td colspan="2"></td>${hasComm ? '<td></td>' : `<td class="r">${SM(voucherGrand)}</td>`}<td class="r pcol" title="মোট লাভ (ডিসকাউন্ট বাদে)">${PF(mainProfit - retProfit - (Number(opts.discountAmt) || 0))}</td>${hasComm ? `<td></td><td></td><td class="r">${SM(voucherGrand)}</td>` : ''}</tr>`
        : `<tr class="grand-all"><td colspan="2" class="r">${grandLabel}</td><td>${Q3(Math.abs(mainKP.kg - retKP.kg))}</td><td>${Q3(Math.abs(mainKP.pc - retKP.pc))}</td><td colspan="${colCount-5}"></td><td class="r">${SM(voucherGrand)}</td></tr>`}
    </tbody>

  ${opts.withProfit && currentUser && currentUser.RoleID === 'ROLE-ADMIN' ? buildVoucherProfitBox(opts, B, M) : ''}   <!-- লাভ — শুধু এডমিন -->

  <div class="sign-row"><div>${escapeHtml(opts.sign1)}</div><div>অথরাইজেশন স্বাঃ<br>${escapeHtml(currentUser ? currentUser.FullName : '')}</div><div>${escapeHtml(opts.sign3Label)}<br>${escapeHtml(currentUser ? currentUser.FullName : '')}</div></div>`;
}

/** নিট মোটের নিচের আলাদা বর্ডার-বক্স: (ঐচ্ছিক) ভ্যাট → মোটা লাইন → সর্বমোট →
 *  পূর্বের বকেয়া → সর্বমোট বকেয়া → নগদ/ব্যাংক হিসাব → অবশিষ্ট বকেয়া বা অগ্রিম।
 *  বকেয়া সবসময় ভাউচারের দিক থেকে ধনাত্মক — ক্রয়ে "আমরা সাপ্লায়ারকে দেব",
 *  বিক্রয়ে "গ্রাহক আমাদের দেবে"; ঋণাত্মক হলে সেটা "অগ্রিম" হিসেবে দেখায়। */
function buildVoucherSummaryBox(opts, netGrandTotal, B, M) {
  if (opts.prevDue === undefined) return '';
  const vatAmt = Number(opts.vatAmount) || 0, vatRate = Number(opts.vatRate) || 0;
  const grand = netGrandTotal + vatAmt;
  const row = function (label, value, cls) {
    return `<tr class="${cls || ''}"><td class="k" colspan="3">${escapeHtml(label)}</td><td class="v">${value}</td></tr>`;
  };
  const dueRow = function (posLabel, negLabel, amt, cls) {
    return row(amt < 0 ? negLabel : posLabel, M(Math.abs(amt)), cls);
  };
  // ভ্যাট ও "সর্বমোট (ভাউচার)" এখন আইটেম টেবিলের ভেতরে — এই বক্স শুরু হয় বকেয়া হিসাব থেকে
  let rows = '';
  if (opts.isCashParty) {
    rows += row(opts.payCashLabel || 'নগদঃ', (grand < 0 ? '(+) ' : '(−) ') + M(Math.abs(grand)));
    rows += row('অবশিষ্ট বকেয়াঃ', M(0), 'big thick');
  } else {
    const prev = Number(opts.prevDue) || 0;
    const totalDue = prev + grand;
    const cash = Number(opts.cashPaid) || 0, bank = Number(opts.bankPaid) || 0;
    rows += dueRow('পূর্বের বকেয়াঃ', 'পূর্বের অগ্রিমঃ', prev);
    rows += dueRow('সর্বমোট বকেয়াঃ', 'সর্বমোট অগ্রিমঃ', totalDue, 'big');
    if (cash > 0 || bank === 0) rows += row(opts.payCashLabel || 'নগদঃ', '(−) ' + M(cash));
    if (bank > 0) rows += row(opts.payBankLabel || 'ব্যাংকঃ', '(−) ' + M(bank));
    rows += dueRow('অবশিষ্ট বকেয়াঃ', 'অগ্রিমঃ', totalDue - cash - bank, 'big thick');
  }
  return `<div class="v-sum"><table><colgroup><col style="width:22%"><col style="width:18%"><col style="width:25%"><col style="width:35%"></colgroup>${rows}</table></div>`;
}

/** লাভের হিসাব (শুধু বিক্রয়ে): প্রতি লাইনে লাভ = নিট মূল্য − পরিমাণ × স্টক দর;
 *  ফেরত লাইনের লাভ বাদ যায়, ডিসকাউন্টও বাদ যায়। খরচ(+) ও ভ্যাট পার্টির কাছ থেকে
 *  আদায় হয় বলে লাভে ধরা হয় না। বক্সটা প্রিন্টে কখনো আসে না (@media print)। */
function buildVoucherProfitBox(opts, B, M) {
  const lineProfit = function (l) {
    const net = Number(l.netAmount !== undefined ? l.netAmount : l.amount) || 0;
    return net - (Number(l.qty) || 0) * (Number(l.costRate) || 0);
  };
  const fmt = function (v) { return `<span class="${v < 0 ? 'neg' : ''}">${v < 0 ? '−' : ''}${M(Math.abs(v))}</span>`; };
  let n = 0, total = 0;
  const rowsFor = function (lines, sign, tag) {
    return lines.map(function (l) {
      const item = opts.itemMap[l.itemId] || {};
      const pr = sign * lineProfit(l); total += pr; n++;
      return `<tr><td>${B(n)}</td><td class="l">${escapeHtml(item.ItemName || l.itemId)}${tag}</td><td>${B(l.qty)}</td><td>${M(l.costRate)}</td><td>${M(l.netAmount !== undefined ? l.netAmount : l.amount)}</td><td>${fmt(pr)}</td></tr>`;
    }).join('');
  };
  const rows = rowsFor(opts.mainLines, 1, '') + rowsFor(opts.returnLines, -1, ' (ফেরত)');
  const disc = Number(opts.discountAmt) || 0;
  const net = total - disc;
  return `<div class="v-profit" style="${opts.showProfit ? '' : 'display:none;'}">
    <h5>📈 লাভের হিসাব (প্রিন্টে আসবে না)</h5>
    <table><colgroup><col style="width:7%"><col style="width:33%"><col style="width:13%"><col style="width:14%"><col style="width:16%"><col style="width:17%"></colgroup>
      <thead><tr><th>ক্রঃ</th><th class="l">আইটেম</th><th>পরিমাণ</th><th>স্টক দর</th><th>নিট মূল্য</th><th>লাভ</th></tr></thead>
      <tbody>${rows}
        ${disc > 0 ? `<tr><td colspan="5">(−) ডিসকাউন্টঃ</td><td>${fmt(-disc)}</td></tr>` : ''}
        <tr class="tot"><td colspan="5">মোট লাভঃ</td><td>${fmt(net)}</td></tr>
      </tbody></table></div>`;
}

function buildVoucherTableHtml(opts) {

<title>${escapeHtml(opts.titleBn)}${opts.isDraft ? ' (খসড়া)' : ''}</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">

  ${buildVoucherBodyScreenPrint(opts)}
</body></html>`;
}

function formatAmountDrCr(v, showLabel) {
  const num = Number(v) || 0;
  const abs = Math.abs(num).toFixed(2);
  if (!showLabel) return abs;
  if (num > 0) return abs + ' Dr';
  if (num < 0) return abs + ' Cr';
  return abs;
}

/** আইটেমের একক "পিস" কিনা — পিস হলে বিক্রি পিসে, কেজি কমে স্টকের গড় ওজনে */
function isPieceUnitName(name) { return /পিস|pcs|pc\b|piece/i.test(String(name || '')); }
function isPieceUOM(uomId, unitsList) {
  const u = (unitsList || []).find(function (x) { return x.UOMID === uomId; });
  return !!u && isPieceUnitName(u.UOMName);
}
async function itemIsPiece(itemId) {
  const m = await cachedListMultiple(['Items', 'UOM']);
  const it = (m.Items || []).find(function (i) { return i.ItemID === itemId; });
  return !!it && isPieceUOM(it.UOMID, m.UOM);
}
/** এই গুদামে এই আইটেমের এখনকার গড় ওজন (কেজি/পিস) — ব্যাচভেদে ওজন বদলায়, তাই স্টক থেকেই নেওয়া হয় */
async function avgKgPerPiece(itemId, warehouseId) {
  const { data } = await supabaseClient.from('current_stock').select('QtyOnHand,QtyPieces').eq('ItemID', itemId).eq('WarehouseID', warehouseId).maybeSingle();
  const kg = data ? Number(data.QtyOnHand) || 0 : 0, pcs = data ? Number(data.QtyPieces) || 0 : 0;
  return pcs > 0 && kg > 0 ? kg / pcs : 0;
}
/** একক-সচেতন স্টক পোস্ট (বিক্রয়, ক্রয়, ফেরত, ইস্যু, সমন্বয়, ওপেনিং) — পিসের আইটেমে পিস ও (পিস × গড় ওজন) কেজি, কেজির আইটেমে শুধু কেজি */
async function postSalesStock(itemId, warehouseId, date, txType, refModule, refId, qty, sign, other) {
  // other = { kg, pcs } — লাইনে অন্য এককের আসল পরিমাণ লেখা থাকলে সেটাই স্টকে যায় (না থাকলে পিস × গড় ওজন)
  qty = Number(qty) || 0; const o = other || {};
  if (await itemIsPiece(itemId)) {
    const kg = Number(o.kg) > 0 ? Number(o.kg) : qty * (await avgKgPerPiece(itemId, warehouseId));
    await postStockMovement(itemId, warehouseId, date, txType, refModule, refId, sign * kg, sign * qty);
  } else {
    await postStockMovement(itemId, warehouseId, date, txType, refModule, refId, sign * qty, sign * (Number(o.pcs) > 0 ? Number(o.pcs) : 0));
  }
}

/** UOM-এর DecimalPlaces অনুযায়ী পরিমাণ ফরম্যাট করে — যেমন কেজি হলে 10.000, পিস হলে 12.00 */
function formatQtyByUOM(qty, uomId, unitsList) {
  const unit = (unitsList || []).find(function (u) { return u.UOMID === uomId; });
  const decimals = unit && unit.DecimalPlaces !== undefined && unit.DecimalPlaces !== '' ? Number(unit.DecimalPlaces) : 2;
  return (Number(qty) || 0).toFixed(decimals);
}

/* ============================================================
   ১৬) ভাষা সুইচ (বাংলা ⇄ English)
   ============================================================ */
/** যেখানে ইংরেজি টেক্সট আগে থেকে লেখা নেই, সেখানে এই ডিকশনারি দিয়ে
 *  বাংলা লেবেল থেকে ইংরেজি অনুবাদ বের করা হয় (মূলত টেবিল হেডারের জন্য)। */
const BN_EN_DICT = {
  'আইডি':'ID','কোড':'Code','নাম':'Name','ফোন':'Phone','ওপেনিং ব্যালেন্স':'Opening Balance',
  'গুদামের নাম':'Warehouse Name','ডিস্ক্রিপশন':'Description',
  'একক নাম':'Unit Name','দশমিক ঘর':'Decimal Places',
  'ক্যাটাগরির নাম':'Category Name','প্যারেন্ট ক্যাটাগরি':'Parent Category',
  'গ্রুপের নাম':'Group Name','জোনের নাম':'Zone Name',
  'পদবি':'Designation','বিভাগ':'Department',
  'হিসাবের নাম':'Account Name','ধরন':'Type','প্যারেন্ট':'Parent',
  'অ্যাকাউন্টের নাম':'Account Name','সাপ্লায়ার':'Supplier','গ্রাহক':'Customer',
  'তারিখ':'Date','মন্তব্য':'Remarks','পরিমাণ':'Quantity','রেট':'Rate','মোট মূল্য':'Total Amount','অবস্থা':'Status',
  'অনুরোধকারী':'Requested By','অর্ডারের তারিখ':'Order Date','প্রত্যাশিত তারিখ':'Expected Date',
  'গ্রহণের তারিখ':'Receive Date','বিল নম্বর':'Bill No','ডেলিভারির তারিখ':'Delivery Date',
  'কার কাছে':'Issued To','উৎস':'From','গন্তব্য':'To','কারণ':'Reason',
  'উৎপাদন আদেশ':'Production Order','বিবরণ':'Narration','Invoice':'Invoice'
};
function bnToEn(bnLabel) {
  if (!bnLabel) return bnLabel;
  return BN_EN_DICT[bnLabel] || bnLabel;
}

function t(bn, en) { return currentLang === 'bn' ? bn : (en || bn); }

function applyLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-switch button').forEach(function (btn) { btn.classList.toggle('active', btn.dataset.lang === lang); });
  updateModalLangButtons();
  document.querySelectorAll('[data-bn]').forEach(function (el) {
    const text = el.getAttribute('data-' + lang);
    if (text !== null) el.textContent = text;
  });
  // সাইডবার সাবমেনুর active লেবেলও (module/page breadcrumb) নতুন ভাষায় রিফ্রেশ হবে
  const activeSub = document.querySelector('.submenu a.active');
  if (activeSub) {
    document.getElementById('crumbTitle').textContent = getLangText(activeSub);
    document.getElementById('crumbPath').textContent = activeSub.dataset[lang === 'bn' ? 'mbn' : 'men'] + ' / ' + getLangText(activeSub);
  }
  renderTabBar();
}
document.getElementById('langSwitch').querySelectorAll('button').forEach(function (btn) {
  btn.addEventListener('click', function () { applyLang(btn.dataset.lang); });
});

/* ============================================================
   ১৭) রিফ্রেশ, অ্যাকাউন্ট মেনু, সাইডবার কোল্যাপ্স, মোবাইল ড্রয়ার
   ============================================================ */
document.getElementById('refreshBtn').addEventListener('click', function () {
  this.classList.add('spinning');
  setTimeout(() => this.classList.remove('spinning'), 700);
  listCache = {};
  const activeTab = openTabs.find(function (tb) { return tb.key === activeTabKey; });
  if (activeTab) navigateTo(activeTab.key, activeTab.moduleLabel, activeTab.pageLabel);
});

document.getElementById('acctBtn').addEventListener('click', function (e) {
  e.stopPropagation();
  document.getElementById('acctMenu').classList.toggle('open');
});
document.addEventListener('click', function () { document.getElementById('acctMenu').classList.remove('open'); });

document.getElementById('collapseBtn').addEventListener('click', function () {
  document.getElementById('sidebar').classList.toggle('collapsed');
});

function openMobile() {
  document.getElementById('sidebar').classList.add('mobile-open');
  document.getElementById('overlayMobile').classList.add('show');
}
function closeMobile() {
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('overlayMobile').classList.remove('show');
}
document.getElementById('hamburger').addEventListener('click', openMobile);
document.getElementById('overlayMobile').addEventListener('click', closeMobile);

/* ============================================================
   ১৮) INIT — শুরুতে সবসময় লগইন স্ক্রিন দেখানো হবে
   ============================================================ */
(function init() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').classList.remove('ready');
})();

/* ============================================================
   ১৯) ডিজিটাল ঘড়ি — টপবার ও মোডাল দুই জায়গাতেই লাইভ সময় দেখাবে
   ============================================================ */
(function startClock() {
  function tick() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    const clockEl = document.getElementById('digitalClock');
    if (clockEl) clockEl.textContent = timeStr;
    const modalClockEl = document.getElementById('modalClock');
    if (modalClockEl) modalClockEl.textContent = timeStr;
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
