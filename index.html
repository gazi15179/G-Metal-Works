        <div class="field"><label>${t('গ্রুপ','Group')}</label><select id="dpgGroup"><option value="">${t('সব গ্রুপ','All groups')}</option>${gp.groups.map(function (g) { return `<option value="${attr(g.GroupID)}">${escapeHtml(g.GroupName)}</option>`; }).join('')}</select></div>
        <div class="field"><label>${t('ক্যাটাগরি','Category')}</label><select id="dpgCat"></select></div>
        <div class="field"><label>${t('আইটেম','Item')}</label><select id="dpgItem"></select></div>
        <button class="btn btn-primary" id="dpgSave">💾 ${t('সেভ','Save')}</button>
      </div>
      <div id="dpgGrid"></div>
      <div class="dpg-sum" id="dpgSum"></div>
      <div class="dpg-bon">
        <div class="dpg-bon-h"><b>${t('বোনাস','Bonus')}</b><span>${t('এই দিনে কাউকে আলাদা টাকা দিলে এখানে লিখুন — সাপ্তাহিক বেতন শিটে যোগ হবে','Extra money for anyone on this day — added to the weekly sheet')}</span></div>
        <div id="dpgBonus"></div>
        <button type="button" class="btn btn-outline" id="dpgBonusAdd" style="width:auto;height:30px;padding:0 12px;font-size:12.5px;margin-top:6px;">+ ${t('বোনাস যোগ','Add bonus')}</button>
      </div>
    </div>`;

  // ---------- ফিল্টার ----------
  function filtered(ignoreItem) {
    return sortItemsBySerial(items.filter(function (i) {
      return (!st.group || i.GroupID === st.group) && (!st.cat || i.CategoryID === st.cat) && (ignoreItem || !st.item || i.ItemID === st.item);
    }), catName);
  }
  function fillCats() {
    const used = {}; items.forEach(function (i) { if ((!st.group || i.GroupID === st.group) && i.CategoryID) used[i.CategoryID] = true; });
    const sel = document.getElementById('dpgCat');
    sel.innerHTML = `<option value="">${t('সব ক্যাটাগরি','All categories')}</option>` + cats.filter(function (c) { return used[c.CategoryID]; })
      .sort(function (a, b) { return String(a.CategoryName).localeCompare(String(b.CategoryName)); })
      .map(function (c) { return `<option value="${attr(c.CategoryID)}">${escapeHtml(c.CategoryName)}</option>`; }).join('');
    if (!used[st.cat]) st.cat = ''; sel.value = st.cat;
  }
  function fillItems() {
    const list = filtered(true), sel = document.getElementById('dpgItem');
    sel.innerHTML = `<option value="">${t('সব আইটেম','All items')} (${list.length})</option>` + list.map(function (i) { return `<option value="${attr(i.ItemID)}">${escapeHtml(i.ItemName)}</option>`; }).join('');
    if (!list.some(function (i) { return i.ItemID === st.item; })) st.item = ''; sel.value = st.item;
  }

  // ---------- কর্মচারীর ড্রপডাউন (সেদিন P থাকা কর্মচারীরা আগে) ----------
  function empOptions(selected) {
    const sorted = base.emps.slice().sort(function (a, b) { return (st.present[b.EmployeeID] ? 1 : 0) - (st.present[a.EmployeeID] ? 1 : 0) || String(a.Name).localeCompare(String(b.Name)); });
    return `<option value="">—</option>` + sorted.map(function (e) {
      return `<option value="${attr(e.EmployeeID)}" ${e.EmployeeID === selected ? 'selected' : ''}>${escapeHtml(e.Name)}${st.present[e.EmployeeID] ? ' ✓' : ''}</option>`;
    }).join('');
  }
  function row(itemId) { return st.rows[itemId] = st.rows[itemId] || { tpId: null, qty: '', who: {}, locked: false, dirty: false }; }
  function rowAmount(itemId, roleId) { const r = row(itemId); return (Number(r.qty) || 0) * gp.rateOf(itemId, roleId); }
  /** ঘরের নিচের লেখাঃ দর সবসময় (মজুরি দর পেজ থেকে), নাম ও কেজি থাকলে টাকাও */
  function amtText(itemId, roleId) {
    const rate = gp.rateOf(itemId, roleId), r = row(itemId);
    if (!rate) return r.who[roleId] ? `<button type="button" class="setrate" data-setrate="${attr(itemId + '|' + roleId)}">${t('দর নেই — দিন','No rate — set')}</button>` : '';
    return t('দর ','rate ') + hrMoney(rate) + (r.who[roleId] && Number(r.qty) ? ' = <b>' + hrMoney(rowAmount(itemId, roleId)) + '</b>' : '');
  }

  function renderGrid() {
    const list = filtered(false), wrap = document.getElementById('dpgGrid');
    if (!roles.length) { wrap.innerHTML = `<div class="dpg-hint" style="color:#d97706;">⚠ ${t('"দরের কলাম" পেজে কর্মচারীর কাজের কলাম যোগ করুন।','Add worker job columns in "Rate Columns".')}</div>`; return; }
    if (!st.group && !st.cat && !st.item) { wrap.innerHTML = `<div class="dpg-hint">${t('গ্রুপ, ক্যাটাগরি বা আইটেম বাছাই করুন।','Select a group, category or item.')}</div>`; renderSum(); return; }
    wrap.innerHTML = list.length ? `<div class="dpg-scroll"><table class="dpg-tbl"><thead><tr>
        <th>${t('আইটেম','Item')}</th><th>${t('পরিমাণ (কেজি)','Qty (kg)')}</th>${roles.map(function (r) { return `<th>${escapeHtml(r.RoleName)}</th>`; }).join('')}</tr></thead><tbody>
      ${list.map(function (i) {
        const r = row(i.ItemID), dis = r.locked ? 'disabled' : '';
        const has = (Number(r.qty) || 0) > 0 || Object.keys(r.who).some(function (k) { return r.who[k]; });
        return `<tr class="${has ? 'has' : ''} ${r.dirty ? 'dirty' : ''} ${r.locked ? 'locked' : ''}" title="${r.locked ? t('এই উৎপাদনের মজুরি বেতন রানে উঠে গেছে — বদলানো যাবে না','Already paid in a salary run — locked') : ''}">
          <td title="${attr(i.ItemName)}">${escapeHtml(i.ItemName)}${r.locked ? ' 🔒' : ''}</td>
          <td><input type="number" step="any" min="0" inputmode="decimal" data-qty="${attr(i.ItemID)}" value="${attr(r.qty)}" ${dis}></td>
          ${roles.map(function (ro) {
            const rate = gp.rateOf(i.ItemID, ro.RoleID);
            return `<td><select data-item="${attr(i.ItemID)}" data-role="${attr(ro.RoleID)}" ${dis} title="${t('দর ','Rate ')}${rate ? hrMoney(rate) : t('ঠিক করা নেই','not set')}">${empOptions(r.who[ro.RoleID])}</select>
              <div class="amt ${r.who[ro.RoleID] ? 'on' : ''}" data-amt="${attr(i.ItemID + '|' + ro.RoleID)}">${amtText(i.ItemID, ro.RoleID)}</div></td>`;
          }).join('')}</tr>`;
      }).join('')}</tbody></table></div>` : `<div class="dpg-hint">${t('এই বাছাইয়ে কোনো আইটেম নেই।','No items for this selection.')}</div>`;
    renderSum();
  }
  function renderBonus() {
    const el = document.getElementById('dpgBonus');
    el.innerHTML = st.bonus.length ? st.bonus.map(function (b, i) {
      const dis = b.billed ? 'disabled' : '';
      return `<div class="dpg-brow"><select data-bi="${i}" data-bf="emp" ${dis}>${empOptions(b.emp)}</select>
        <input type="number" step="any" min="0" placeholder="${t('টাকা','Amount')}" data-bi="${i}" data-bf="amount" value="${attr(b.amount)}" ${dis}>
        <input class="note" placeholder="${t('কারণ (যেমনঃ ভালো কাজ, ঈদ)','Reason')}" data-bi="${i}" data-bf="note" value="${attr(b.note)}" ${dis}>
        ${b.billed ? `<span title="${t('বেতনে উঠে গেছে','Paid')}">🔒</span>` : `<button type="button" data-bdel="${i}">✕</button>`}</div>`;
    }).join('') : `<div class="dpg-hint">${t('এই দিনে কোনো বোনাস নেই।','No bonus on this day.')}</div>`;
  }
  function renderSum() {
    let kg = 0, wage = 0, n = 0, dirty = 0;
    Object.keys(st.rows).forEach(function (id) {
      const r = st.rows[id], q = Number(r.qty) || 0;
      if (r.dirty) dirty++;
      if (q > 0) { kg += q; n++; roles.forEach(function (ro) { if (r.who[ro.RoleID]) wage += q * gp.rateOf(id, ro.RoleID); }); }
    });
    if (st.bonusDirty) dirty++;
    document.getElementById('dpgSum').innerHTML = `<span>${hrDayLabel(st.date)}</span><span>${t('আইটেম ','Items ')}<b>${n}</b></span><span>${t('মোট ','Total ')}<b>${hrNum(kg)}</b> ${t('কেজি','kg')}</span><span>${t('মজুরি ','Wages ')}<b>${hrMoney(wage)}</b></span>${dirty ? `<span style="color:#d97706;">● ${dirty} ${t('টা সারি সেভ হয়নি','row(s) unsaved')}</span>` : ''}
      <span style="color:var(--text-muted);">✓ = ${t('আজ হাজিরায় P','present today')}</span>`;
  }

  // ---------- দিনের ডেটা ----------
  async function loadRates() {
    try {
      const data = await selectAllRows('SizeRates');
      Object.keys(gp.rate).forEach(function (k) { delete gp.rate[k]; });
      (data || []).forEach(function (x) { if (Number(x.Rate) > 0) gp.rate[x.ItemID + '|' + x.RoleID] = Number(x.Rate); });
    } catch (e) {}
  }
  async function loadDay() {
    st.rows = {}; st.bonus = []; st.bonusDirty = false;
    await loadRates();
    try {
      const bon = await hrQueryRange('DailyBonus', 'WorkDate', st.date, st.date);
      st.bonus = bon.map(function (b) { return { id: b.BonusID, emp: b.EmployeeID, amount: b.Amount, note: b.Note || '', billed: !!b.BilledIn }; });
    } catch (e) { st.bonus = []; }
    try {
      const [att, heads] = await Promise.all([hrQueryRange('Attendance', 'Date', st.date, st.date), hrQueryRange('TeamProduction', 'WorkDate', st.date, st.date)]);
      st.present = {}; att.forEach(function (a) { if (HR_ATT_CODE[a.Status] === 'P') st.present[a.EmployeeID] = true; });
      const own = heads.filter(function (h) { return !h.ProcessingID; });
      if (own.length) {
        const ids = own.map(function (h) { return h.TeamProdID; });
        const [{ data: its }, { data: mems }] = await Promise.all([
          supabaseClient.from('TeamProduction_Items').select('*').in('TeamProdID', ids),
          supabaseClient.from('TeamProduction_Members').select('*').in('TeamProdID', ids)
        ]);
        own.forEach(function (h) {
          const it = (its || []).find(function (x) { return String(x.TeamProdID) === String(h.TeamProdID); }); if (!it) return;
          const r = row(it.ItemID); r.tpId = h.TeamProdID; r.qty = Number(it.Qty) || Number(h.TotalKg) || '';
          (mems || []).filter(function (x) { return String(x.TeamProdID) === String(h.TeamProdID); }).forEach(function (mm) { if (mm.RoleID) r.who[mm.RoleID] = mm.EmployeeID; if (mm.BilledIn) r.locked = true; });
        });
      }
    } catch (err) { showToast(err.message, 'error'); }
    renderGrid(); renderBonus();
  }

  // ---------- ইভেন্ট ----------
  document.getElementById('dpgDate').addEventListener('change', function () {
    if (!this.value) return;
    if ((st.bonusDirty || Object.keys(st.rows).some(function (k) { return st.rows[k].dirty; })) && !confirm(t('সেভ না করা পরিবর্তন আছে — তারিখ বদলালে হারিয়ে যাবে। চালিয়ে যাবেন?','Unsaved changes will be lost. Continue?'))) { this.value = st.date; return; }
    st.date = this.value; loadDay();
  });
  document.getElementById('dpgGroup').addEventListener('change', function () { st.group = this.value; fillCats(); fillItems(); renderGrid(); });
  document.getElementById('dpgCat').addEventListener('change', function () { st.cat = this.value; fillItems(); renderGrid(); });
  document.getElementById('dpgItem').addEventListener('change', function () { st.item = this.value; renderGrid(); });
  const grid = document.getElementById('dpgGrid');
  document.getElementById('dpgBonusAdd').addEventListener('click', function () { st.bonus.push({ id: null, emp: '', amount: '', note: '', billed: false }); st.bonusDirty = true; renderBonus(); renderSum(); });
  const bonEl = document.getElementById('dpgBonus');
  function onBonus(ev) { const el = ev.target; if (el.dataset.bi === undefined) return; st.bonus[Number(el.dataset.bi)][el.dataset.bf] = el.value; if (!st.bonusDirty) { st.bonusDirty = true; renderSum(); } }
  bonEl.addEventListener('input', onBonus); bonEl.addEventListener('change', onBonus);
  bonEl.addEventListener('click', function (ev) { const b = ev.target.closest('[data-bdel]'); if (!b) return; st.bonus.splice(Number(b.dataset.bdel), 1); st.bonusDirty = true; renderBonus(); renderSum(); });
  grid.addEventListener('input', function (ev) {
    const el = ev.target; if (!el.dataset.qty) return;
    const r = row(el.dataset.qty); r.qty = el.value; r.dirty = true;
    const tr = el.closest('tr'); tr.classList.add('dirty'); tr.classList.toggle('has', Number(el.value) > 0 || Object.keys(r.who).some(function (k) { return r.who[k]; }));
    roles.forEach(function (ro) { const a = grid.querySelector(`[data-amt="${el.dataset.qty}|${ro.RoleID}"]`); if (a) a.innerHTML = amtText(el.dataset.qty, ro.RoleID); });
    renderSum();
  });
  grid.addEventListener('click', async function (ev) {
    const b = ev.target.closest('[data-setrate]'); if (!b) return;
    const p = b.dataset.setrate.split('|'), it = items.find(function (x) { return x.ItemID === p[0]; }) || {};
    const v = prompt((it.ItemName || '') + ' — ' + (gp.roleMap[p[1]] || '') + t(' এর দর (প্রতি কেজি):',' rate (per kg):'), '');
    if (v === null) return;
    const rate = Number(String(v).replace(/[০-৯]/g, function (d) { return '০১২৩৪৫৬৭৮৯'.indexOf(d); }));
    if (!(rate > 0)) { showToast(t('সঠিক দর লিখুন।','Enter a valid rate.'), 'error'); return; }
    const { error } = await supabaseClient.from('SizeRates').upsert({ ItemID: p[0], RoleID: p[1], Rate: rate }, { onConflict: 'ItemID,RoleID' });
    if (error) { showToast(error.message, 'error'); return; }
    gp.rate[p[0] + '|' + p[1]] = rate; listCache = {};
    showToast(t('দর সেভ হয়েছে — মজুরি দর পেজেও বসে গেছে ✅','Rate saved — also in the rate page ✅'), 'success');
    const sc = grid.querySelector('.dpg-scroll'), top = sc ? sc.scrollTop : 0, left = sc ? sc.scrollLeft : 0;
    renderGrid(); const sc2 = grid.querySelector('.dpg-scroll'); if (sc2) { sc2.scrollTop = top; sc2.scrollLeft = left; }
  });
  grid.addEventListener('change', function (ev) {
    const el = ev.target; if (!el.dataset.role) return;
    const r = row(el.dataset.item); r.who[el.dataset.role] = el.value; r.dirty = true;
    // ক্রল পজিশন ঠিক রেখে শুধু টেবিল নতুন করে
    const sc = grid.querySelector('.dpg-scroll'), top = sc ? sc.scrollTop : 0, left = sc ? sc.scrollLeft : 0;
    renderGrid(); const sc2 = grid.querySelector('.dpg-scroll'); if (sc2) { sc2.scrollTop = top; sc2.scrollLeft = left; }
  });

  document.getElementById('dpgSave').addEventListener('click', async function () {
    const dirty = Object.keys(st.rows).filter(function (k) { return st.rows[k].dirty && !st.rows[k].locked; });
    if (!dirty.length && !st.bonusDirty) { showToast(t('সেভ করার মতো কোনো পরিবর্তন নেই।','Nothing to save.'), 'error'); return; }
    for (const b of st.bonus) {
      if (b.billed) continue;
      if ((Number(b.amount) || 0) > 0 && !b.emp) { showToast(t('বোনাস — কর্মচারী বাছাই করুন।','Bonus — select the employee.'), 'error'); return; }
      if (b.emp && !((Number(b.amount) || 0) > 0)) { showToast(t('বোনাস — টাকার অঙ্ক লিখুন।','Bonus — enter the amount.'), 'error'); return; }
    }
    const itemName = {}; items.forEach(function (i) { itemName[i.ItemID] = i.ItemName; });
    for (const id of dirty) {
      const r = st.rows[id], q = Number(r.qty) || 0, who = Object.keys(r.who).filter(function (k) { return r.who[k]; });
      if (q > 0 && !who.length) { showToast(itemName[id] + t(' — কে বানিয়েছে সেটা বাছাই করুন।',' — select who made it.'), 'error'); return; }
      if (q <= 0 && who.length) { showToast(itemName[id] + t(' — পরিমাণ (কেজি) লিখুন।',' — enter the quantity (kg).'), 'error'); return; }
      const noRate = who.filter(function (k) { return !gp.rateOf(id, k); });
      if (q > 0 && noRate.length) { showToast(itemName[id] + ' — ' + noRate.map(function (k) { return gp.roleMap[k]; }).join(', ') + t(' এর দর ঠিক করা নেই ("সাইজ অনুযায়ী মজুরি দর" পেজে দিন)।',': rate not set (use "Size Wage Rates").'), 'error'); return; }
    }
    this.disabled = true;
    try {
      for (const id of dirty) {
        const r = st.rows[id], q = Number(r.qty) || 0;
        if (r.tpId) {
          await supabaseClient.from('TeamProduction_Members').delete().eq('TeamProdID', r.tpId);
          await supabaseClient.from('TeamProduction_Costs').delete().eq('TeamProdID', r.tpId);
          await supabaseClient.from('TeamProduction_Items').delete().eq('TeamProdID', r.tpId);
          await supabaseClient.from('TeamProduction').delete().eq('TeamProdID', r.tpId);
          r.tpId = null;
        }
        if (q > 0) {
          const it = items.find(function (x) { return x.ItemID === id; }) || {};
          const { data: hd, error } = await supabaseClient.from('TeamProduction').insert({ WorkDate: st.date, GroupID: it.GroupID || null, TotalKg: q, TargetKg: 0, ExtraKg: 0, IsHoliday: false }).select();
          if (error) throw new Error(error.message);
          const pid = hd[0].TeamProdID;
          const e1 = (await supabaseClient.from('TeamProduction_Items').insert({ TeamProdID: pid, ItemID: id, Qty: q })).error;
          const mems = Object.keys(r.who).filter(function (k) { return r.who[k]; }).map(function (k) { const rate = gp.rateOf(id, k); return { TeamProdID: pid, EmployeeID: r.who[k], RoleID: k, Rate: rate, Amount: q * rate }; });
          const e2 = e1 || (await supabaseClient.from('TeamProduction_Members').insert(mems)).error;
          if (e1 || e2) { await supabaseClient.from('TeamProduction_Items').delete().eq('TeamProdID', pid); await supabaseClient.from('TeamProduction').delete().eq('TeamProdID', pid); throw new Error((e1 || e2).message); }
          r.tpId = pid;
        }
        r.dirty = false;
      }
      if (st.bonusDirty) {
        // বেতনে না ওঠা বোনাসগুলো নতুন করে লেখা
        const { error: de } = await supabaseClient.from('DailyBonus').delete().eq('WorkDate', st.date).is('BilledIn', null);
        if (de) throw new Error(de.message);
        const rowsB = st.bonus.filter(function (b) { return !b.billed && b.emp && Number(b.amount) > 0; }).map(function (b) { return { WorkDate: st.date, EmployeeID: b.emp, Amount: Number(b.amount), Note: b.note || '' }; });
        if (rowsB.length) { const { error } = await supabaseClient.from('DailyBonus').insert(rowsB); if (error) throw new Error(error.message); }
        st.bonusDirty = false;
      }
      showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
      await loadDay();
    } catch (err) { showToast(err.message, 'error'); }
    this.disabled = false;
  });

  fillCats(); fillItems();
  await loadDay();
}

/* ============================================================
   সেলারী ভাউচার — প্রতিজন কর্মচারীর জন্য আলাদা ভাউচার
   ধরনঃ হাজিরা / মুজুরী / হাজিরা ও মুজুরী (আপাতত শুধু ৩য়টা চালু)
   • তারিখ, আইটেম, কেজি, দর, মুজুরী — দৈনিক উৎপাদন ও দল পেজ থেকে নিজে থেকে
   • দিনঃ টিক দিলে সেদিনের হাজিরা (হাজিরা পেজে P থাকলে দৈনিক হাজিরা) মোটে যোগ হয়; টাকা হাতে বদলানো যায়
   • অন্যান্যঃ খাত বাছাই (বোনাস, অগ্রিম কর্তন…) + টাকা; কর্তনের খাত বিয়োগ হয়; ড্রপডাউনেই নতুন খাত
   • + দিয়ে বাড়তি সারি (শুধু এই ভাউচারে)
   ============================================================ */
function payrollPeriodLabel(r) {
  if (r.DateFrom && r.DateTo) return r.DateFrom === r.DateTo ? formatShortDate(r.DateFrom) : formatShortDate(r.DateFrom) + ' — ' + formatShortDate(r.DateTo);
  return (r.Month || '') + ' ' + (r.Year || '');
}
const SV_DAY_FULL = ['রবি','সোম','মঙ্গল','বুধ','বৃহঃ','শুক্র','শনি'];

async function renderPayrollPage(content) {
  const base = await hrLoadBase();
  const gp = await hrLoadGroups();
  const items = (await cachedList('Items')).filter(function (i) { return i.Status !== 'Deleted'; });
  let heads = (await cachedList('PayHeads').catch(function () { return []; })).filter(function (h) { return h.Status !== 'Deleted' && (h.IsActive === undefined || h.IsActive === null || isTrue(h.IsActive)); });
  const w0 = hrWeekOf(hrToday());
  const st = { id: null, no: '', vdate: hrToday(), from: w0.from, to: hrAddDays(w0.from, 5), emp: '', days: [], dirty: false };

  content.innerHTML = `
    <style>
      .sv{padding:12px !important;max-width:1100px;}
      .sv-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 10px;} .sv-head h1{font-size:18px;margin:0;} .sv-head span{font-size:11.5px;color:var(--text-muted);}
      .sv .field{margin:0;min-width:0;} .sv .field label{font-size:11.5px;margin-bottom:3px;}
      .sv input:not([type=checkbox]):not([type=radio]),.sv select{height:36px;padding:4px 8px;font-size:14px;width:100%;min-width:0;box-sizing:border-box;}
      .sv-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;margin-bottom:8px;}
      .sv-rad{display:flex;flex-wrap:wrap;gap:6px;}
      .sv-rad label{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;margin:0;cursor:pointer;}
      .sv-rad label.on{border-color:#16a34a;background:#f0fdf4;font-weight:600;} .sv-rad label.off{opacity:.45;cursor:not-allowed;}
      .sv-rad input{width:16px;height:16px;margin:0;}
      .sv-range{display:flex;gap:6px;align-items:center;} .sv-range span{color:var(--text-muted);}
      .sv-nav{width:36px !important;flex-shrink:0;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;height:36px;font-size:16px;}
      .sv-emp{font-size:12px;color:var(--text-muted);margin-top:4px;}
      .sv-tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;margin-top:6px;}
      .sv-tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;min-width:900px;}
      .sv-tbl th{background:var(--bg);font-size:11.5px;font-weight:700;padding:7px 5px;text-align:center !important;white-space:nowrap;border-bottom:2px solid var(--border);position:sticky;top:0;}
      .sv-tbl td{padding:4px 5px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;vertical-align:middle;}
      .sv-tbl .l{text-align:left;} .sv-tbl tr.first td{border-top:1px solid var(--border-strong,#d4d4d4);}
      .sv-tbl tr.fri td{background:rgba(127,127,127,.05);}
      .sv-tbl input:not([type=checkbox]),.sv-tbl select{height:30px !important;font-size:13px !important;padding:2px 5px !important;}
      .sv-tbl .num{width:74px !important;text-align:right;} .sv-tbl .itm{min-width:130px;}
      .sv-tbl tr.sum td{font-weight:700;background:var(--bg);border-bottom:0;}
      .sv-day{display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin:0;font-weight:600;}
      .sv-day input{width:18px;height:18px;margin:0;}
      .sv-att{font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:4px;}
      .sv-att.P{background:#dcfce7;color:#166534;} .sv-att.A{background:#fee2e2;color:#991b1b;} .sv-att.L{background:#fef3c7;color:#92400e;}
      .sv-plus,.sv-x{width:30px;height:30px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;font-size:15px;padding:0;}
      .sv-x{color:var(--danger);font-size:12px;}
      .sv-muted{color:var(--text-muted);}
      .sv-cards{display:none;}
      .sv-card{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;}
      .sv-card.fri{opacity:.85;}
      .sv-ch{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);flex-wrap:wrap;}
      .sv-ch .tot{margin-left:auto;font-weight:700;font-size:15px;}
      .sv-ch .haj{width:96px !important;height:32px !important;}
      .sv-line{padding:8px 10px;border-top:1px solid var(--border);}
      .sv-line .top{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13.5px;}
      .sv-line .calc{font-size:12.5px;color:var(--text-muted);}
      .sv-line .row2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:6px;margin-top:6px;}
      .sv-line .mrow{display:grid;grid-template-columns:minmax(0,1.6fr) 72px 72px;gap:6px;margin-top:6px;}
      .sv-foot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0;}
      .sv-foot div{background:var(--bg);border-radius:10px;padding:8px;text-align:center;font-size:11.5px;color:var(--text-muted);} .sv-foot b{display:block;font-size:17px;color:var(--text);margin-top:2px;}
      .sv-foot .net{background:#f0fdf4;} .sv-foot .net b{color:#166534;}
      .sv-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
      .sv-acts .btn{width:auto;height:40px;padding:0 16px;margin:0;font-size:14px;}
      .sv-list{margin-top:16px;border-top:1px solid var(--border);padding-top:10px;}
      .sv-li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--border);font-size:13px;}
      .sv-li .meta{font-size:11.5px;color:var(--text-muted);} .sv-li .ic{display:flex;gap:6px;align-items:center;}
      .sv-li .ic button{width:34px;height:34px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;font-size:15px;padding:0;}
      .sv-badge{font-size:11px;padding:2px 8px;border-radius:10px;background:#fef3c7;color:#92400e;margin-left:6px;}
      @media (max-width:760px){
        .sv-g2{grid-template-columns:minmax(0,1fr);}
        .sv-tbl-wrap{display:none;} .sv-cards{display:block;}
        .sv-foot{grid-template-columns:repeat(2,minmax(0,1fr));}
        .sv-acts .btn{flex:1;}
      }
    </style>
    <div class="panel sv">
      <div class="sv-head"><h1>${t('সেলারী ভাউচার','Salary Voucher')}</h1><span id="svState"></span></div>
      <div class="sv-g2">
        <div class="field"><label>${t('ভাউচার তারিখঃ','Voucher date:')}</label><input type="date" id="svDate" value="${st.vdate}"></div>
        <div class="field"><label>${t('ভাউচার নম্বরঃ','Voucher no:')}</label><input id="svNo" readonly style="background:var(--bg);font-weight:600;"></div>
      </div>
      <div class="sv-g2">
        <div class="field"><label>${t('ভাউচার ধরনঃ','Voucher type:')}</label>
          <div class="sv-rad">
            <label class="off" title="${t('শীঘ্রই আসছে','Coming soon')}"><input type="radio" name="svType" disabled> ${t('হাজিরা','Attendance')}</label>
            <label class="off" title="${t('শীঘ্রই আসছে','Coming soon')}"><input type="radio" name="svType" disabled> ${t('মুজুরী','Wage')}</label>
            <label class="on"><input type="radio" name="svType" checked> ${t('হাজিরা ও মুজুরী','Attendance and wage')}</label>
          </div></div>
        <div class="field"><label>${t('তারিখ রেঞ্জ (শনি থেকে বৃহঃ)','Date range (Sat–Thu)')}</label>
          <div class="sv-range"><button type="button" class="sv-nav" id="svPrev" aria-label="${t('আগের সপ্তাহ','Previous week')}">‹</button><input type="date" id="svFrom" value="${st.from}"><span>—</span><input type="date" id="svTo" value="${st.to}"><button type="button" class="sv-nav" id="svNext" aria-label="${t('পরের সপ্তাহ','Next week')}">›</button></div></div>
      </div>
      <div class="field"><label>${t('কর্মচারী নামঃ','Employee name:')}</label><input id="svEmp" placeholder="${t('নাম লিখুন — তালিকা থেকে বাছাই করুন','Type a name — pick from the list')}"><div class="sv-emp" id="svEmpInfo"></div></div>
      <div id="svBody"></div>
      <div class="sv-list"><div style="font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:4px;">${t('সাম্প্রতিক ভাউচার','Recent vouchers')}</div><div id="svList"></div></div>
    </div>`;

  // ---------- সাহায্যকারী ----------
  const itemName = {}; items.forEach(function (i) { itemName[i.ItemID] = i.ItemName; });
  const headMap = function () { const m = {}; heads.forEach(function (h) { m[h.HeadID] = h; }); return m; };
  function wageOf() { return hrDailyWage(base.empMap[st.emp] || {}, gp.divisor); }
  function sign(headId) { const h = headMap()[headId]; return h && h.HeadType === 'Deduction' ? -1 : 1; }
  function newRow(kind) { return { kind: kind || 'manual', memIds: [], bonusIds: [], itemId: '', item: '', qty: '', rate: '', wage: 0, head: '', oth: '' }; }
  function rowWage(r) { return r.kind === 'manual' ? (Number(r.qty) || 0) * (Number(r.rate) || 0) : (Number(r.wage) || 0); }
  function rowOther(r) { return r.head ? sign(r.head) * (Number(r.oth) || 0) : 0; }
  function dayCalc(d) {
    const wage = d.rows.reduce(function (s, r) { return s + rowWage(r); }, 0);
    const haj = d.hajOn ? (Number(d.haj) || 0) : 0;
    const oth = d.rows.reduce(function (s, r) { return s + rowOther(r); }, 0);
    return { wage: wage, haj: haj, oth: oth, total: wage + haj + oth };
  }
  function totals() { return st.days.reduce(function (s, d) { const c = dayCalc(d); s.wage += c.wage; s.haj += c.haj; s.oth += c.oth; s.total += c.total; return s; }, { wage: 0, haj: 0, oth: 0, total: 0 }); }
  function headOptions(sel) {
    return `<option value="">—</option>` + heads.map(function (h) { return `<option value="${attr(h.HeadID)}" ${h.HeadID === sel ? 'selected' : ''}>${escapeHtml(h.HeadName)}${h.HeadType === 'Deduction' ? ' (−)' : ''}</option>`; }).join('') + `<option value="__new">➕ ${t('নতুন খাত…','New head…')}</option>`;
  }
  function itemOptions(sel) { return `<option value="">${t('— আইটেম —','— item —')}</option>` + items.map(function (i) { return `<option value="${attr(i.ItemID)}" ${i.ItemID === sel ? 'selected' : ''}>${escapeHtml(i.ItemName)}</option>`; }).join(''); }
  function dayName(d) { return SV_DAY_FULL[hrDate(d).getDay()]; }
  function dd(d) { const x = hrDate(d); return String(x.getDate()).padStart(2, '0') + '/' + String(x.getMonth() + 1).padStart(2, '0'); }

  // ---------- আঁকা ----------
  function renderState() {
    document.getElementById('svNo').value = st.no || t('সেভের পর বসবে','assigned on save');
    document.getElementById('svState').innerHTML = (st.id ? t('সেভ করা ভাউচার','Saved voucher') + ' ' + escapeHtml(st.no) : t('নতুন ভাউচার','New voucher')) + (st.dirty ? ` <span class="sv-badge">● ${t('সেভ হয়নি','unsaved')}</span>` : '');
  }
  function lineCellsDesktop(d, r, di, ri) {
    const manual = r.kind === 'manual', bonus = r.kind === 'bonus';
    const item = manual ? `<select class="itm" data-di="${di}" data-ri="${ri}" data-f="itemId">${itemOptions(r.itemId)}</select>` : `<span>${escapeHtml(r.item)}</span>`;
    const qty = manual ? `<input type="number" step="any" min="0" class="num" data-di="${di}" data-ri="${ri}" data-f="qty" value="${attr(r.qty)}">` : (bonus || !r.qty ? '' : hrNum(r.qty));
    const rate = manual ? `<input type="number" step="any" min="0" class="num" data-di="${di}" data-ri="${ri}" data-f="rate" value="${attr(r.rate)}">` : (bonus || !r.rate ? '' : hrMoney(r.rate));
    return { item: item, qty: qty, rate: rate, wage: (bonus ? '' : `<span data-rw="${di}|${ri}">${hrMoney(rowWage(r))}</span>`) };
  }
  function renderBody() {
    const body = document.getElementById('svBody');
    renderState();
    if (!st.emp) { body.innerHTML = `<div class="sv-muted" style="padding:12px 0;">${t('কর্মচারীর নাম বাছাই করুন — তারপর শনি থেকে বৃহঃ পর্যন্ত সব দিন নিজে থেকে আসবে।','Pick an employee — the days fill in automatically.')}</div>`; return; }
    const tt = totals();
    // ---- কম্পিউটার: টেবিল ----
    const trs = st.days.map(function (d, di) {
      const dc = dayCalc(d);
      return d.rows.map(function (r, ri) {
        const first = ri === 0, cells = lineCellsDesktop(d, r, di, ri);
        const rt = rowWage(r) + rowOther(r) + (first && d.hajOn ? (Number(d.haj) || 0) : 0);
        return `<tr class="${first ? 'first' : ''} ${hrIsFriday(d.date) ? 'fri' : ''}">
          <td class="l">${first ? dd(d.date) : ''}</td>
          <td class="l">${cells.item}</td><td>${cells.qty}</td><td>${cells.rate}</td><td>${cells.wage}</td>
          <td class="l">${first ? `<label class="sv-day"><input type="checkbox" data-di="${di}" data-f="hajOn" ${d.hajOn ? 'checked' : ''}>${dayName(d.date)}</label>${d.att ? `<span class="sv-att ${d.att}">${d.att}</span>` : ''}` : ''}</td>
          <td>${first ? `<input type="number" step="any" min="0" class="num" data-di="${di}" data-f="haj" value="${attr(d.haj)}" ${d.hajOn ? '' : 'disabled style="opacity:.45"'}>` : ''}</td>
          <td class="l"><select data-di="${di}" data-ri="${ri}" data-f="head" style="min-width:120px;">${headOptions(r.head)}</select></td>
          <td><input type="number" step="any" min="0" class="num" data-di="${di}" data-ri="${ri}" data-f="oth" value="${attr(r.oth)}"></td>
          <td><b data-rt="${di}|${ri}">${hrMoney(rt)}</b></td>
          <td>${r.kind === 'manual' && d.rows.length > 1 ? `<button type="button" class="sv-x" data-del="${di}|${ri}" aria-label="${t('সারি মুছুন','Remove row')}">✕</button>` : ''}<button type="button" class="sv-plus" data-add="${di}|${ri}" aria-label="${t('সারি যোগ','Add row')}">+</button></td></tr>`;
      }).join('');
    }).join('');
    // ---- মোবাইলঃ দিনওয়ারি কার্ড ----
    const cards = st.days.map(function (d, di) {
      const dc = dayCalc(d);
      return `<div class="sv-card ${hrIsFriday(d.date) ? 'fri' : ''}">
        <div class="sv-ch"><label class="sv-day"><input type="checkbox" data-di="${di}" data-f="hajOn" ${d.hajOn ? 'checked' : ''}>${dayName(d.date)} ${dd(d.date)}</label>${d.att ? `<span class="sv-att ${d.att}">${d.att}</span>` : ''}
          <input type="number" step="any" min="0" class="haj" placeholder="${t('হাজিরা','Wage')}" data-di="${di}" data-f="haj" value="${attr(d.haj)}" ${d.hajOn ? '' : 'disabled style="opacity:.45"'}>
          <span class="tot" data-dt="${di}">${hrMoney(dc.total)}</span></div>
        ${d.rows.map(function (r, ri) {
          const manual = r.kind === 'manual', bonus = r.kind === 'bonus';
          return `<div class="sv-line">
            ${manual ? `<div class="mrow"><select data-di="${di}" data-ri="${ri}" data-f="itemId">${itemOptions(r.itemId)}</select><input type="number" step="any" min="0" placeholder="${t('কেজি','kg')}" data-di="${di}" data-ri="${ri}" data-f="qty" value="${attr(r.qty)}"><input type="number" step="any" min="0" placeholder="${t('দর','rate')}" data-di="${di}" data-ri="${ri}" data-f="rate" value="${attr(r.rate)}"></div>
                <div class="calc" style="margin-top:4px;">${t('মুজুরী ','Wage ')}<span data-rw="${di}|${ri}">${hrMoney(rowWage(r))}</span></div>`
              : `<div class="top"><span>${escapeHtml(r.item)}</span>${bonus ? '' : `<b>${hrMoney(rowWage(r))}</b>`}</div>${bonus || !r.qty ? '' : `<div class="calc">${hrNum(r.qty)} ${t('কেজি','kg')} × ${hrMoney(r.rate)}</div>`}`}
            <div class="row2"><select data-di="${di}" data-ri="${ri}" data-f="head">${headOptions(r.head)}</select>
              <input type="number" step="any" min="0" placeholder="(৳)" data-di="${di}" data-ri="${ri}" data-f="oth" value="${attr(r.oth)}">
              <span style="display:flex;gap:4px;">${manual && d.rows.length > 1 ? `<button type="button" class="sv-x" data-del="${di}|${ri}" aria-label="${t('সারি মুছুন','Remove row')}">✕</button>` : ''}<button type="button" class="sv-plus" data-add="${di}|${ri}" aria-label="${t('সারি যোগ','Add row')}">+</button></span></div>
          </div>`;
        }).join('')}
      </div>`;
    }).join('');
    body.innerHTML = `
      <div class="sv-tbl-wrap"><table class="sv-tbl"><thead><tr>
        <th class="l">${t('তারিখ','Date')}</th><th class="l">${t('আইটেম','Item')}</th><th>${t('পরিমান কেজি','Qty kg')}</th><th>${t('দর','Rate')}</th><th>${t('মুজুরী','Wage')}</th>
        <th class="l">${t('দিন','Day')}</th><th>${t('হাজিরা','Attendance')}</th><th class="l">${t('অন্যান্য','Other')}</th><th>(৳)</th><th>${t('মোট','Total')}</th><th></th></tr></thead>
        <tbody>${trs}<tr class="sum"><td class="l" colspan="4">${t('মুজুরীর যোগফল','Wage total')}</td><td id="svSW">${hrMoney(tt.wage)}</td><td></td><td id="svSH">${hrMoney(tt.haj)}</td><td></td><td id="svSO">${hrMoney(tt.oth)}</td><td id="svST">${hrMoney(tt.total)}</td><td></td></tr></tbody></table></div>
      <div class="sv-cards">${cards}</div>
      <div class="sv-foot"><div>${t('মুজুরী','Wage')}<b id="svFW">${hrMoney(tt.wage)}</b></div><div>${t('হাজিরা','Attendance')}<b id="svFH">${hrMoney(tt.haj)}</b></div><div>${t('অন্যান্য','Other')}<b id="svFO">${tt.oth < 0 ? '−' : ''}${hrMoney(Math.abs(tt.oth))}</b></div><div class="net">${t('মোট প্রদেয়','Net payable')}<b id="svFT">${hrMoney(tt.total)}</b></div></div>
      <div class="sv-acts">
        ${st.id ? `<button class="btn btn-outline" id="svNew">＋ ${t('নতুন ভাউচার','New')}</button><button class="btn btn-outline" id="svDel" style="color:var(--danger);">🗑 ${t('ডিলিট','Delete')}</button>` : ''}
        <button class="btn btn-outline" id="svView">👁 ${t('ভিউ / প্রিন্ট','View / print')}</button>
        <button class="btn btn-primary" id="svSave">💾 ${t('সেভ','Save')}</button>
      </div>`;
  }
  function refresh(focusSel) {
    const pos = focusSel ? (function () { const el = document.querySelector(focusSel); return el ? el.selectionStart : null; })() : null;
    renderBody();
    if (focusSel) { const el = document.querySelector(focusSel); if (el) { el.focus(); try { if (pos !== null) el.setSelectionRange(pos, pos); } catch (e) {} } }
  }

  // ---------- কর্মচারীর সপ্তাহের ডেটা ----------
  async function loadFresh() {
    st.id = null; st.no = ''; st.days = [];
    if (!st.emp) { renderBody(); return; }
    // একই কর্মচারীর মিলে যাওয়া ভাউচার আগে থাকলে সেটাই খোলা
    const ex = (await api('list', { sheet: 'Payroll' })).filter(function (h) { return h.Status !== 'Deleted' && h.RunType === 'SalaryVoucher' && h.EmployeeID === st.emp && !(String(h.DateTo).slice(0, 10) < st.from || String(h.DateFrom).slice(0, 10) > st.to); });
    if (ex.length) { showToast(t('এই সময়ের ভাউচার আগেই আছে — সেটা খোলা হলো ', 'A voucher already exists — opened ') + (ex[0].VoucherNo || ex[0].PayrollID), 'success'); await openSaved(ex[0]); return; }
    const [att, tp, bon] = await Promise.all([
      hrQueryRange('Attendance', 'Date', st.from, st.to),
      hrQueryRange('TeamProduction', 'WorkDate', st.from, st.to),
      hrQueryRange('DailyBonus', 'WorkDate', st.from, st.to).catch(function () { return []; })
    ]);
    let mems = [], tpi = [];
    if (tp.length) {
      const ids = tp.map(function (h) { return h.TeamProdID; });
      const [r1, r2] = await Promise.all([supabaseClient.from('TeamProduction_Members').select('*').in('TeamProdID', ids), supabaseClient.from('TeamProduction_Items').select('*').in('TeamProdID', ids)]);
      mems = (r1.data || []).filter(function (m) { return m.EmployeeID === st.emp && !m.BilledIn; });
      tpi = r2.data || [];
    }
    const tpDate = {}; tp.forEach(function (h) { tpDate[String(h.TeamProdID)] = String(h.WorkDate).slice(0, 10); });

  async function save() {
    if (!st.emp) throw new Error(t('কর্মচারী বাছাই করুন।','Select an employee.'));
    if (st.from > st.to) throw new Error(t('তারিখ রেঞ্জ ঠিক নেই।','Invalid date range.'));
    for (const d of st.days) for (const r of d.rows) {
      if (r.kind === 'manual' && (Number(r.qty) || 0) > 0 && !(Number(r.rate) > 0)) throw new Error(dd(d.date) + t(' — বাড়তি সারির দর লিখুন।',' — enter the rate.'));
      if ((Number(r.oth) || 0) && !r.head) throw new Error(dd(d.date) + t(' — অন্যান্য টাকার খাত বাছাই করুন।',' — pick a head for the other amount.'));
    }
    const tt = totals(), e = base.empMap[st.emp] || {};
    const hdr = { RunType: 'SalaryVoucher', VoucherType: 'Both', EmployeeID: st.emp, VoucherDate: st.vdate, DateFrom: st.from, DateTo: st.to, TotalNetPay: tt.total, Status: 'Active', Month: HR_MONTHS_BN[hrDate(st.to).getMonth()], Year: String(hrDate(st.to).getFullYear()) };
    let pid = st.id;
    if (pid) {
      await supabaseClient.from('TeamProduction_Members').update({ BilledIn: null }).eq('BilledIn', pid);
      await supabaseClient.from('DailyBonus').update({ BilledIn: null }).eq('BilledIn', pid);
      await supabaseClient.from('Payroll_Details').delete().eq('PayrollID', pid);
      await supabaseClient.from('Payroll_Lines').delete().eq('PayrollID', pid);
      const { error } = await supabaseClient.from('Payroll').update(hdr).eq('PayrollID', pid);
      if (error) throw new Error(error.message);
    } else {
      hdr.VoucherNo = await nextVoucherNo();
      const { data, error } = await supabaseClient.from('Payroll').insert(hdr).select();
      if (error) throw new Error(error.message);
      pid = data[0].PayrollID; st.no = hdr.VoucherNo;
    }
    const p = st.days.filter(function (d) { return d.att === 'P'; }).length, a = st.days.filter(function (d) { return d.att === 'A'; }).length, l = st.days.filter(function (d) { return d.att === 'L'; }).length;
    const plus = st.days.reduce(function (s, d) { return s + d.rows.reduce(function (x, r) { const v = rowOther(r); return x + (v > 0 ? v : 0); }, 0); }, 0);
    const minus = st.days.reduce(function (s, d) { return s + d.rows.reduce(function (x, r) { const v = rowOther(r); return x + (v < 0 ? -v : 0); }, 0); }, 0);
    const r1 = await supabaseClient.from('Payroll_Lines').insert({ PayrollID: pid, EmployeeID: st.emp, CategoryID: e.CategoryID || null, SalaryType: 'Both', DailyWage: wageOf(),
      PresentDays: p, AbsentDays: a, LeaveDays: l, ProductionAmount: tt.wage, AttendancePay: tt.haj, Bonus: plus, Allowance: plus, Deduction: minus, NetPay: tt.total, CalculatedPay: tt.total, BasicSalary: tt.wage, DaysWorked: p, RatePerUnit: wageOf() });
    if (r1.error) throw new Error(r1.error.message);
    const det = [], memIds = [], bonIds = [];
    st.days.forEach(function (d) {
      det.push({ PayrollID: pid, EmployeeID: st.emp, DetailType: 'SVDay', WorkDate: d.date, Description: d.att || '', TargetQty: d.hajOn ? 1 : 0, Amount: Number(d.haj) || 0 });
      d.rows.forEach(function (r) {
        if (r.kind === 'manual' && !rowWage(r) && !(Number(r.oth) || 0) && !r.itemId) return; // খালি সারি বাদ
        const nm = r.kind === 'manual' ? (itemName[r.itemId] || '') : r.item;
        det.push({ PayrollID: pid, EmployeeID: st.emp, DetailType: 'SVRow', WorkDate: d.date, ItemID: r.itemId || null, HeadID: r.head || null, Qty: Number(r.qty) || 0, Rate: Number(r.rate) || 0, Amount: rowWage(r),
          OverQty: rowOther(r), Description: JSON.stringify({ k: r.kind, n: nm, o: r.oth, m: r.memIds, b: r.bonusIds }) });
        memIds.push.apply(memIds, r.memIds); bonIds.push.apply(bonIds, r.bonusIds);
      });
    });
    if (det.length) { const { error } = await supabaseClient.from('Payroll_Details').insert(det); if (error) throw new Error(error.message); }
    if (memIds.length) await supabaseClient.from('TeamProduction_Members').update({ BilledIn: pid }).in('MemberID', memIds);
    if (bonIds.length) await supabaseClient.from('DailyBonus').update({ BilledIn: pid }).in('BonusID', bonIds);
    st.id = pid; st.dirty = false;
  }

      d.rows.forEach(function (r, ri) {
        set(`[data-rw="${di}|${ri}"]`, hrMoney(rowWage(r)));
        set(`[data-rt="${di}|${ri}"]`, hrMoney(rowWage(r) + rowOther(r) + (ri === 0 && d.hajOn ? (Number(d.haj) || 0) : 0)));
      });
    });
    const tt = totals(), neg = (tt.oth < 0 ? '−' : '') + hrMoney(Math.abs(tt.oth));
    set('#svSW', hrMoney(tt.wage)); set('#svSH', hrMoney(tt.haj)); set('#svSO', hrMoney(tt.oth)); set('#svST', hrMoney(tt.total));
    set('#svFW', hrMoney(tt.wage)); set('#svFH', hrMoney(tt.haj)); set('#svFO', neg); set('#svFT', hrMoney(tt.total));
    renderState();
  }
  body.addEventListener('input', function (ev) {
    const el = ev.target; if (el.dataset.di === undefined || !(el.tagName === 'INPUT' && el.type === 'number')) return;
    field(el);
    updateNumbers(el);
  });
  async function addHead(sel, r) {
    const name = prompt(t('নতুন খাতের নাম (যেমনঃ যাতায়াত, জরিমানা):','New head name:'), '');
    if (!name || !name.trim()) { sel.value = r.head || ''; return; }
    const isDed = confirm(t('"' + name.trim() + '" কি কর্তনের খাত (টাকা বিয়োগ হবে)?\nOK = কর্তন, Cancel = যোগ','Is this a deduction? OK = deduction, Cancel = addition'));
    const { data, error } = await supabaseClient.from('PayHeads').insert({ HeadName: name.trim(), HeadType: isDed ? 'Deduction' : 'Earning' }).select();
    if (error) { showToast(error.message, 'error'); sel.value = r.head || ''; return; }
    heads.push(data[0]); listCache = {}; r.head = data[0].HeadID; st.dirty = true; refresh();
    showToast(t('নতুন খাত যোগ হয়েছে ✅','Head added ✅'), 'success');
  }
  body.addEventListener('click', async function (ev) {
    const add = ev.target.closest('[data-add]'), rm = ev.target.closest('[data-del]');
    if (add) { const p = add.dataset.add.split('|').map(Number); st.days[p[0]].rows.splice(p[1] + 1, 0, newRow('manual')); st.dirty = true; refresh(); return; }
    if (rm) { const p = rm.dataset.del.split('|').map(Number); st.days[p[0]].rows.splice(p[1], 1); st.dirty = true; refresh(); return; }
    const b = ev.target.closest('button'); if (!b) return;
    try {
      if (b.id === 'svSave') { b.disabled = true; await save(); showToast(t('সেলারী ভাউচার সেভ হয়েছে ✅ ','Salary voucher saved ✅ ') + st.no, 'success'); renderBody(); await renderList(); }
      else if (b.id === 'svView') await printVoucher();
      else if (b.id === 'svDel') await del();
      else if (b.id === 'svNew') { if (!guard()) return; st.emp = ''; document.getElementById('svEmp').value = ''; showEmpInfo(); await loadFresh(); }
    } catch (err) { showToast(err.message, 'error'); }
    b.disabled = false;
  });
  document.getElementById('svList').addEventListener('click', async function (ev) {
    const b = ev.target.closest('button'); if (!b) return;
    const id = b.dataset.lv || b.dataset.le || b.dataset.ld;
    const h = (await api('list', { sheet: 'Payroll' })).find(function (x) { return x.PayrollID === id; }); if (!h) return;
    if (!guard()) return;
    await openSaved(h);
    try {
      if (b.dataset.lv) await printVoucher();
      else if (b.dataset.ld) await del();
      else window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) { showToast(err.message, 'error'); }
  });

  renderBody(); await renderList();
}

    <div class="panel si">
      <div class="si-head"><h1>${t('সেলারী ইস্যু','Salary Issue')}</h1><span>${t('সেলারী ভাউচারের পাওনা টাকা কর্মচারীকে দেওয়া — ক্যাশ/ব্যাংক বইতে খরচ হিসেবে উঠে যায়','Pay salary vouchers — posted to the cash/bank book')}</span></div>
      <div class="si-g2">

  // ---------- হিসাব ----------
  async function loadLedger() {
    const [heads, issues] = await Promise.all([api('list', { sheet: 'Payroll' }), api('list', { sheet: 'SalaryIssue' }).catch(function () { return []; })]);
    const L = {};
    const row = function (id) { return L[id] = L[id] || { vouchers: [], issues: [], earned: 0, paid: 0 }; };
    heads.filter(function (h) { return h.Status !== 'Deleted' && h.RunType === 'SalaryVoucher' && h.EmployeeID; }).forEach(function (h) { const r = row(h.EmployeeID); r.vouchers.push(h); r.earned += Number(h.TotalNetPay) || 0; });
    issues.filter(function (x) { return x.Status !== 'Deleted'; }).forEach(function (x) { const r = row(x.EmployeeID); r.issues.push(x); r.paid += Number(x.Amount) || 0; });
    Object.keys(L).forEach(function (k) {
      L[k].due = Math.round((L[k].earned - L[k].paid) * 100) / 100;
      L[k].vouchers.sort(function (a, b) { return String(a.DateFrom).localeCompare(String(b.DateFrom)); });
      L[k].issues.sort(function (a, b) { return String(b.IssueDate).localeCompare(String(a.IssueDate)) || (Number(b.IssueID) || 0) - (Number(a.IssueID) || 0); });
    });
    st.ledger = L;
    st.allIssues = issues.filter(function (x) { return x.Status !== 'Deleted'; }).sort(function (a, b) { return (Number(b.IssueID) || 0) - (Number(a.IssueID) || 0); });
  }
  /** কোন ভাউচারের কত বাকি — পুরনো ভাউচার আগে শোধ ধরা হয় (FIFO) */
  function voucherDues(L) {
    let left = L.paid;
    return L.vouchers.map(function (v) { const amt = Number(v.TotalNetPay) || 0, used = Math.min(amt, Math.max(0, left)); left -= used; return { v: v, amt: amt, paid: used, due: amt - used }; });
  }

  // ---------- আঁকা ----------
  function renderBody() {
    const body = document.getElementById('siBody');
    if (!st.emp) { body.innerHTML = `<div style="color:var(--text-muted);font-size:13px;padding:6px 0;">${t('কর্মচারী বাছাই করুন, অথবা নিচের বকেয়া তালিকা থেকে "ইস্যু" চাপুন।','Pick an employee, or press "Issue" in the dues list below.')}</div>`; return; }
    const L = st.ledger[st.emp] || { vouchers: [], issues: [], earned: 0, paid: 0, due: 0 };
    const amt = Number(st.amount) || 0, after = L.due - amt;
    const rows = voucherDues(L).filter(function (x) { return x.due > 0.005; });
    body.innerHTML = `
      <div class="si-sum">
        <div>${t('মোট পাওনা (সব ভাউচার)','Total earned')}<b>${hrMoney(L.earned)}</b></div>
        <div>${t('আগে দেওয়া হয়েছে','Already paid')}<b>${hrMoney(L.paid)}</b></div>
        <div class="due">${L.due >= 0 ? t('বর্তমান বকেয়া','Current due') : t('অগ্রিম দেওয়া আছে','Advance paid')}<b>${hrMoney(Math.abs(L.due))}</b></div>
      </div>
      ${rows.length ? `<div class="si-box"><table class="si-vt"><thead><tr><th>${t('ভাউচার','Voucher')}</th><th>${t('সময়কাল','Period')}</th><th>${t('ভাউচারের টাকা','Amount')}</th><th>${t('দেওয়া','Paid')}</th><th>${t('বাকি','Due')}</th></tr></thead><tbody>
        ${rows.map(function (x) { return `<tr><td class="l">${escapeHtml(x.v.VoucherNo || x.v.PayrollID)}</td><td class="l">${escapeHtml(payrollPeriodLabel(x.v))}</td><td>${hrMoney(x.amt)}</td><td>${hrMoney(x.paid)}</td><td><b>${hrMoney(x.due)}</b></td></tr>`; }).join('')}
      </tbody></table></div>` : ''}
      <div class="si-g2">
        <div class="field"><label>${t('পরিশোধের মাধ্যম (ক্যাশ/ব্যাংক)','Paid from (cash/bank)')}</label><select id="siAcc">${accounts.map(function (a) { return `<option value="${attr(a.BankAccID)}" ${a.BankAccID === st.acc ? 'selected' : ''}>${escapeHtml(a.AccountName)}${a.Type ? ' (' + (a.Type === 'Cash' ? t('ক্যাশ','Cash') : t('ব্যাংক','Bank')) + ')' : ''}</option>`; }).join('')}</select></div>
        <div class="field"><label>${t('টাকার পরিমাণ','Amount')}</label><input type="number" step="any" min="0" inputmode="decimal" id="siAmt" value="${attr(st.amount)}"></div>
      </div>
      <div class="field"><label>${t('নোট (ঐচ্ছিক)','Note (optional)')}</label><input id="siNote" value="${attr(st.note)}" placeholder="${t('যেমনঃ সাপ্তাহিক বেতন, আংশিক পরিশোধ','e.g. weekly salary, partial payment')}"></div>
      <div class="si-sum" style="grid-template-columns:repeat(2,minmax(0,1fr));">
        <div>${t('এখন দেওয়া হচ্ছে','Paying now')}<b id="siNow">${hrMoney(amt)}</b></div>
        <div class="after">${t('ইস্যুর পর ','After issue: ')}<span id="siAfterL">${after >= 0 ? t('বকেয়া','due') : t('অগ্রিম','advance')}</span><b id="siAfter">${hrMoney(Math.abs(after))}</b></div>
      </div>
      <div class="si-acts"><button class="btn btn-primary" id="siSave">💾 ${t('ইস্যু ও সেভ','Issue & save')}</button></div>`;
  }
  function renderDues() {
    const el = document.getElementById('siDues');
    const list = Object.keys(st.ledger).map(function (id) { return { id: id, L: st.ledger[id] }; }).filter(function (x) { return Math.abs(x.L.due) > 0.005; })
      .sort(function (a, b) { return b.L.due - a.L.due; });
    const tot = list.reduce(function (s, x) { return s + Math.max(0, x.L.due); }, 0);

      const e = base.empMap[x.id] || {};

    }).join('') + `<div style="text-align:right;font-size:13px;margin-top:6px;">${t('মোট বকেয়াঃ ','Total due: ')}<b>${hrMoney(tot)}</b></div>`

  }
  function renderList() {
    const el = document.getElementById('siList');

    el.innerHTML = list.length ? list.map(function (x) {
      const e = base.empMap[x.EmployeeID] || {};
      return `<div class="si-li"><div><b>${escapeHtml(x.IssueNo || x.IssueID)}</b> · ${escapeHtml(e.Name || x.EmployeeID)}
          <div class="meta">${escapeHtml(formatShortDate(x.IssueDate))} · ${escapeHtml(accName[x.BankCashAccID] || '')} · <b>${hrMoney(x.Amount)}</b>${x.Note ? ' · ' + escapeHtml(x.Note) : ''}</div></div>
        <div class="ic"><button data-view="${attr(x.IssueID)}" title="${t('প্রিন্ট','Print')}" aria-label="${t('প্রিন্ট','Print')}">👁</button><button data-del="${attr(x.IssueID)}" title="${t('ডিলিট','Delete')}" aria-label="${t('ডিলিট','Delete')}">🗑</button></div></div>`;
    }).join('') : `<div style="color:var(--text-muted);font-size:13px;">${t('এখনো কোনো সেলারী ইস্যু নেই।','No salary issues yet.')}</div>`;
  }
  async function reloadAll() { await loadLedger(); renderBody(); renderDues(); renderList(); }

  function pickEmp(id) {
    st.emp = id; const e = base.empMap[id] || {};
    document.getElementById('siEmp').value = e.Name || id;
    const L = st.ledger[id]; st.amount = L && L.due > 0 ? L.due : ''; st.note = '';
    renderBody(); window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ---------- সেভ / ডিলিট / প্রিন্ট ----------
  async function nextNo() {
    const n = (st.allIssues || []).reduce(function (m, x) { const r = /^SAL-(\d+)$/.exec(x.IssueNo || ''); return r ? Math.max(m, Number(r[1])) : m; }, 0) + 1;
    return 'SAL-' + String(n).padStart(4, '0');
  }
  async function save() {
    const amt = Number(st.amount) || 0;
    if (!st.emp) throw new Error(t('কর্মচারী বাছাই করুন।','Select an employee.'));
    if (!(amt > 0)) throw new Error(t('টাকার পরিমাণ লিখুন।','Enter the amount.'));
    if (!st.acc) throw new Error(t('ক্যাশ/ব্যাংক অ্যাকাউন্ট বাছাই করুন (হিসাব → ব্যাংক ও ক্যাশ অ্যাকাউন্ট)।','Select a cash/bank account.'));
    const L = st.ledger[st.emp] || { due: 0 };
    if (amt > L.due + 0.005 && !confirm(t('বকেয়ার (' + hrMoney(L.due) + ') চেয়ে বেশি দিচ্ছেন — বাড়তি অংশ অগ্রিম হিসেবে থাকবে। চালিয়ে যাবেন?','Paying more than due — the extra becomes an advance. Continue?'))) return null;
    const no = await nextNo();
    const { data, error } = await supabaseClient.from('SalaryIssue').insert({ IssueNo: no, IssueDate: st.date, EmployeeID: st.emp, BankCashAccID: st.acc, Amount: amt, Note: st.note || '', DueBefore: L.due, Status: 'Active' }).select();
    if (error) throw new Error(error.message);
    try { await postBankCashBookEntry(st.acc, st.date, 'SalaryIssue', no, 0, amt); } // টাকা বের হলো — ক্যাশ/ব্যাংক বইতে Credit
    catch (err) { await supabaseClient.from('SalaryIssue').delete().eq('IssueID', data[0].IssueID); throw err; }
    listCache = {};
    return data[0];
  }
  async function del(id) {
    const x = (st.allIssues || []).find(function (y) { return String(y.IssueID) === String(id); }); if (!x) return;
    if (!confirm(t(x.IssueNo + ' ডিলিট করবেন? ক্যাশ/ব্যাংক বইতে টাকা ফেরত এন্ট্রি হবে।','Delete ' + x.IssueNo + '? A reversal will be posted to the cash/bank book.'))) return;
    await postBankCashBookEntry(x.BankCashAccID, hrToday(), 'SalaryIssue-Reversal', x.IssueNo, Number(x.Amount) || 0, 0);
    const { error } = await supabaseClient.from('SalaryIssue').update({ Status: 'Deleted' }).eq('IssueID', x.IssueID);
    if (error) throw new Error(error.message);
    listCache = {}; showToast(t('ডিলিট হয়েছে ✅','Deleted ✅'), 'success');
    await reloadAll();
  }
  async function printIssue(x) {
    const win = window.open('', '_blank');
    if (!win) { showToast(t('পপ-আপ ব্লক হয়েছে — এই সাইটের জন্য পপ-আপ অনুমতি দিন।','Pop-up blocked — allow pop-ups for this site.'), 'error'); return; }
    let co = {}; try { co = await api('getSingleton', { sheet: 'CompanyProfile' }); } catch (e) {}
    const e = base.empMap[x.EmployeeID] || {}, acc = accounts.find(function (a) { return a.BankAccID === x.BankCashAccID; }) || {};
    const before = Number(x.DueBefore) || 0, after = before - (Number(x.Amount) || 0);
    win.document.write(`<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>সেলারী ইস্যু — ${escapeHtml(x.IssueNo)}</title>

        ${x.Note ? `<tr><td colspan="2">নোটঃ ${escapeHtml(x.Note)}</td></tr>` : ''}

      <script>window.addEventListener("load",function(){setTimeout(function(){window.print();},400);});<\/script></body></html>`);

  // ---------- ইভেন্ট ----------
  document.getElementById('siDate').addEventListener('change', function () { st.date = this.value; });
  hrNameSuggest(document.getElementById('siEmp'), { list: function () { return hrEmpSuggestList(base, base.emps); }, onPick: function (it) { pickEmp(it.id); } });
  const body = document.getElementById('siBody');
  body.addEventListener('input', function (ev) {
    const el = ev.target;
    if (el.id === 'siAmt') {
      st.amount = el.value;
      const L = st.ledger[st.emp] || { due: 0 }, after = L.due - (Number(el.value) || 0);
      document.getElementById('siNow').textContent = hrMoney(Number(el.value) || 0);
      document.getElementById('siAfter').textContent = hrMoney(Math.abs(after));
      document.getElementById('siAfterL').textContent = after >= 0 ? t('বকেয়া','due') : t('অগ্রিম','advance');
    } else if (el.id === 'siNote') st.note = el.value;
  });
  body.addEventListener('change', function (ev) { if (ev.target.id === 'siAcc') st.acc = ev.target.value; });
  body.addEventListener('click', async function (ev) {
    const b = ev.target.closest('#siSave'); if (!b) return;
    b.disabled = true;
    try {
      const x = await save();
      if (x) {
        showToast(t('সেলারী ইস্যু হয়েছে ✅ ','Salary issued ✅ ') + x.IssueNo, 'success');
        document.getElementById('siNo').value = x.IssueNo;
        await reloadAll();
        if (confirm(t('রসিদ প্রিন্ট করবেন?','Print the receipt?'))) await printIssue(x);
        st.emp = ''; document.getElementById('siEmp').value = ''; st.amount = ''; renderBody();
      }
    } catch (err) { showToast(err.message, 'error'); }
    b.disabled = false;
  });
  document.getElementById('siDues').addEventListener('click', function (ev) { const b = ev.target.closest('[data-pay]'); if (b) pickEmp(b.dataset.pay); });
  document.getElementById('siList').addEventListener('click', async function (ev) {
    const b = ev.target.closest('button'); if (!b) return;
    try {
      if (b.dataset.view) { const x = st.allIssues.find(function (y) { return String(y.IssueID) === b.dataset.view; }); if (x) await printIssue(x); }
      else if (b.dataset.del) await del(b.dataset.del);
    } catch (err) { showToast(err.message, 'error'); }
  });

  if (!accounts.length) showToast(t('আগে হিসাব → ব্যাংক ও ক্যাশ অ্যাকাউন্টে অন্তত একটা ক্যাশ অ্যাকাউন্ট যোগ করুন।','Add a cash account first in Accounts → Bank & Cash.'), 'error');
  await reloadAll();
}

async function openLeaveForm(existing) {
  const employees = await cachedList('Employees');
  const isEdit = !!existing;
  const rec = existing || {};
  const empOptions = employees.filter(function (e) { return e.Status !== 'Deleted'; })
    .map(function (e) { return `<option value="${attr(e.EmployeeID)}" ${rec.EmployeeID===e.EmployeeID?'selected':''}>${escapeHtml(e.Name)}</option>`; }).join('');
  const typeOpts = ['Casual','Sick','Earned','Unpaid'].map(function (s) { return `<option value="${s}" ${(rec.Type||'Casual')===s?'selected':''}>${s}</option>`; }).join('');
  const statusOpts = ['Pending','Approved','Rejected'].map(function (s) { return `<option value="${s}" ${(rec.Status||'Pending')===s?'selected':''}>${s}</option>`; }).join('');

  openModal({
    title: (isEdit ? t('সম্পাদনা — ','Edit — ') : t('নতুন — ','New — ')) + t('ছুটির আবেদন','Leave Request'),
    bodyHtml: `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
      <div class="field"><label>${t('কর্মচারী','Employee')}</label><select id="lv_EmployeeID"><option value="">—</option>${empOptions}</select></div>
      <div class="field"><label>${t('ধরন','Type')}</label><select id="lv_Type">${typeOpts}</select></div>
      <div class="field"><label>${t('শুরুর তারিখ','From Date')}</label><input type="date" id="lv_FromDate" value="${attr(rec.FromDate)}"></div>
      <div class="field"><label>${t('শেষের তারিখ','To Date')}</label><input type="date" id="lv_ToDate" value="${attr(rec.ToDate)}"></div>
      <div class="field"><label>${t('অবস্থা','Status')}</label><select id="lv_Status">${statusOpts}</select></div>
    </div>`,
    onSave: async function () {
      const data = { EmployeeID: val('lv_EmployeeID'), Type: val('lv_Type'), FromDate: val('lv_FromDate'), ToDate: val('lv_ToDate'), Status: val('lv_Status') };
      if (!data.EmployeeID) throw new Error(t('কর্মচারী বাছাই করা আবশ্যক।','Employee selection is required.'));
      if (!data.FromDate || !data.ToDate) throw new Error(t('শুরু ও শেষের তারিখ আবশ্যক।','From and To dates are required.'));
      if (isEdit) {
        await api('update', { sheet:'LeaveRequests', idField:'LeaveID', idValue: rec.LeaveID, data: data });
      } else {
        await api('create', { sheet:'LeaveRequests', idField:'LeaveID', idPrefix:'LV', requiredFields:['EmployeeID','FromDate','ToDate'], data: data });
      }
      showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
      if (window.__refreshLeaveList) await window.__refreshLeaveList();
    }
  });
}

async function postProcessingRecord(processingId) {
  if (!confirm(t('আপনি কি নিশ্চিত এই প্রসেসিং ভাউচার পোস্ট করতে চান? পোস্ট হয়ে গেলে স্টকে এন্ট্রি পড়বে এবং এটা আর বাতিল করা যাবে না।','Are you sure you want to post this Processing Voucher? Once posted, stock entries will be created and this cannot be undone.'))) return;
  try {
    await api('postDocument', { docType: 'ProcessingVoucher', docId: processingId });
    showToast(t('পোস্ট হয়েছে ✅','Posted ✅'), 'success');
    if (window.__refreshProcessingList) await window.__refreshProcessingList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

      <div class="field"><label class="pv-chk"><input type="checkbox" id="pv_UseAvgRate"> <span>${t('গড় দর','Avg Rate')}</span></label></div>
      <div class="field"><label>${t('তারিখ হইতে','Date From')}</label><input type="date" id="pv_DateFrom" disabled></div>
      <div class="field"><label>${t('তারিখ পর্যন্ত','Date To')}</label><input type="date" id="pv_DateTo" disabled></div>
      <!-- লাইন ৩: বামে 'গড় দর আনুন', ডানে ভাউচার তারিখ ("তারিখ পর্যন্ত"-এর ঠিক নিচে) -->
      <div class="pv-fetch"><button type="button" class="btn" id="pv_FetchRateBtn" disabled>${t('↻ গড় দর আনুন','↻ Fetch Avg Rate')}</button><div id="pv_RateHint" class="pv-hint"></div></div>
      <div class="field pv-vdate"><label>${t('ভাউচার তারিখ','Voucher Date')}</label><input type="date" id="pv_Date" value="${new Date().toISOString().slice(0,10)}"></div>
    </div>

    <h4 style="margin:14px 0 8px;font-size:12px;color:var(--text-muted);text-transform:uppercase;border-top:1px solid var(--border);padding-top:10px;">${t('কাঁচামাল ও উৎপাদন খরচ','Raw Material & Processing Cost')}</h4>
    <div class="pv-g3">
      <div class="field"><label>${t('পরিমাণ (কেজি)','Quantity (kg)')}</label><input id="pv_Qty" type="number" step="any" oninput="recalcProcessing()"></div>
      <div class="field"><label>${t('কাঁচামালের দর/কেজি','RM Rate/kg')}</label><input id="pv_RMRate" type="number" step="any" oninput="recalcProcessing()"></div>
      <div class="field"><label>${t('কাঁচামাল মূল্য','RM Value')}</label><input id="pv_RMValue" readonly style="background:var(--bg);"></div>
      <div class="field"><label>${t('উৎপাদন খরচ/কেজি','Processing Rate/kg')}</label><input id="pv_ProcRate" type="number" step="any" oninput="recalcProcessing()"></div>
      <div class="field"><label>${t('উৎপাদন খরচ মূল্য','Processing Value')}</label><input id="pv_ProcValue" readonly style="background:var(--bg);"></div>
      <div class="field"><label>${t('মোট','Total')}</label><input id="pv_Total" readonly style="background:var(--bg);font-weight:600;"></div>
    </div>

    <h4 style="margin:14px 0 8px;font-size:12px;color:var(--text-muted);text-transform:uppercase;border-top:1px solid var(--border);padding-top:10px;">${t('বাই-প্রডাক্ট (ভাঙারি/কাটিং/অপচয়)','By-Products (scrap/cutting/wastage)')}</h4>
    <div id="pv_ByProductWrap"></div>
    <button type="button" class="btn" style="width:auto;margin-top:8px;" id="pv_AddByProductBtn">${t('+ বাই-প্রডাক্ট যোগ করুন','+ Add By-Product')}</button>

    <h4 style="margin:14px 0 8px;font-size:12px;color:var(--text-muted);text-transform:uppercase;border-top:1px solid var(--border);padding-top:10px;">${t('ফলাফল — নেট ফিনিশড গুডস','Result — Net Finished Goods')}</h4>
    <div class="pv-g2">
      <div class="field"><label>${t('নেট ওজন','Net Weight')}</label><input id="pv_NetWeight" readonly style="background:var(--bg);font-weight:600;"></div>
      <div class="field"><label>${t('নেট মূল্য','Net Value')}</label><input id="pv_NetValue" readonly style="background:var(--bg);font-weight:600;"></div>
      <div class="field"><label>${t('প্রস্তুত পণ্য আইটেম','Finished Goods Item')}</label><select id="pv_FinishedGoodsItemID"><option value="">—</option>${opts(window.__procItems, 'ItemID', 'ItemName')}</select></div>
      <div class="field"><label>${t('পিস','Pieces')}</label><input id="pv_Pieces" type="number" step="any" oninput="recalcProcessing()"></div>
      <div class="field"><label>${t('প্রতি কেজি দর','Rate per kg')}</label><input id="pv_RatePerKg" readonly style="background:var(--bg);font-weight:600;"></div>
      <div class="field"><label>${t('প্রতি পিস দর','Rate per piece')}</label><input id="pv_RatePerPiece" readonly style="background:var(--bg);font-weight:600;"></div>
      <div class="field"><label>${t('প্রতি কেজি বিক্রয় দর','Sale rate per kg')}</label><input id="pv_SaleRatePerKg" type="number" step="any" oninput="recalcProcessing()"></div>
      <div class="field"><label>${t('প্রতি পিস বিক্রয় দর','Sale rate per piece')}</label><input id="pv_SaleRatePerPiece" type="number" step="any" oninput="recalcProcessing()"></div>
      <div class="field"><label>${t('লাভ','Profit')}</label><input id="pv_Profit" readonly style="background:var(--bg);font-weight:700;"><div id="pv_ProfitHint" style="font-size:11.5px;color:var(--text-muted);margin-top:4px;"></div></div>
    </div>

    </div>`;


  const ic = {
    preview: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    print: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    del: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
    share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>'
  };
  const needSave = t('ভাউচার সেভ করার পর চালু হবে','Available after the voucher is saved');
  const headerActionsHtml = `
    <button type="button" class="modal-act-btn" id="pv_act_preview" title="${t('প্রিন্ট প্রিভিউ','Print Preview')}">${ic.preview}<span>${t('প্রিভিউ','Preview')}</span></button>
    <button type="button" class="modal-act-btn" id="pv_act_print" title="${t('প্রিন্ট','Print')}">${ic.print}<span>${t('প্রিন্ট','Print')}</span></button>
    <button type="button" class="modal-act-btn" id="pv_act_edit" title="${existingId ? (isPosted ? t('পোস্ট করা ভাউচার এডিট করা যায় না','Posted vouchers cannot be edited') : t('এডিট','Edit')) : needSave}" ${existingId && !isPosted ? '' : 'disabled'}>${ic.edit}<span>${t('এডিট','Edit')}</span></button>
    <button type="button" class="modal-act-btn danger" id="pv_act_delete" title="${existingId ? t('ডিলিট','Delete') : needSave}" ${existingId ? '' : 'disabled'}>${ic.del}<span>${t('ডিলিট','Delete')}</span></button>
    <button type="button" class="modal-act-btn" id="pv_act_share" title="${t('শেয়ার','Share')}">${ic.share}<span>${t('শেয়ার','Share')}</span></button>`;

  const titleText = existingId
    ? t('প্রসেসিং ভাউচার','Processing Voucher') + ' — ' + existingId + (isPosted ? t(' (পোস্ট করা)',' (Posted)') : '')
    : t('নতুন — প্রসেসিং ভাউচার','New — Processing Voucher');

  openModal({
    title: titleText,
    bodyHtml: bodyHtml,
    wide: true,
    headerActionsHtml: headerActionsHtml,
    hideSave: !!existingId, // পুরনো ভাউচার আগে শুধু দেখার জন্য খোলে, এডিট চাপলে সেভ বাটন আসে
    onSave: async function () {
      const d = collectProcessingForm();
      if (!d.header.RawMaterialItemID) throw new Error(t('কাঁচামাল আইটেম বাছাই করা আবশ্যক।','Raw material item is required.'));
      if (!d.header.WarehouseID) throw new Error(t('গুদাম বাছাই করা আবশ্যক।','Warehouse is required.'));
      if (!d.header.FinishedGoodsItemID) throw new Error(t('প্রস্তুত পণ্য আইটেম বাছাই করা আবশ্যক।','Finished goods item is required.'));
      if (d.header.RawMaterialQty <= 0) throw new Error(t('পরিমাণ আবশ্যক।','Quantity is required.'));

      let savedId = state.id;
      if (state.id) {
        await api('updateDocument', {
          headerSheet: 'ProcessingVoucher', idField: 'ProcessingID', idValue: state.id,
          linesSheet: 'ProcessingByProduct_Lines', lineIdField: 'ProcessingID',
          headerData: d.header, lines: d.lines
        });
      } else {
        const created = await api('createDocument', {
          headerSheet: 'ProcessingVoucher', idField: 'ProcessingID', idPrefix: 'PROC',
          requiredFields: ['RawMaterialItemID','WarehouseID','FinishedGoodsItemID'],
          linesSheet: 'ProcessingByProduct_Lines', lineIdField: 'ProcessingID',
          headerData: d.header, lines: d.lines
        });
        savedId = created && created.ProcessingID;
      }
      showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
      if (window.__refreshProcessingList) await window.__refreshProcessingList();
    }
  });

  // ---- হেডার অ্যাকশন ----
  document.getElementById('pv_act_preview').addEventListener('click', function () { openProcessingPrintView(state.id, false); });
  document.getElementById('pv_act_print').addEventListener('click', function () { openProcessingPrintView(state.id, true); });
  document.getElementById('pv_act_share').addEventListener('click', function () { shareProcessingVoucher(state.id); });
  document.getElementById('pv_act_edit').addEventListener('click', function () {
    if (!state.id || isPosted) return;
    state.editing = true;
    setProcessingFormLocked(false);
    document.getElementById('modalSaveBtn').style.display = '';
    this.disabled = true;
    showToast(t('এডিট মোড চালু — পরিবর্তন করে সেভ করুন।','Edit mode on — make changes and save.'), 'success');
  });
  document.getElementById('pv_act_delete').addEventListener('click', async function () {
    if (!state.id) return;
    const refresh = window.__refreshProcessingList;
    if (isPosted) {
      await deletePostedVoucherWithAdminAuth('ProcessingVoucher', state.id, 'ProcessingVoucher', 'ProcessingID', 'ProcessingByProduct_Lines', 'ProcessingID', async function () { closeModal(); if (refresh) await refresh(); });
      return;
    }
    if (!confirm(t('এই খসড়া প্রসেসিং ভাউচারটা ডিলিট করতে চান? এটা ফেরানো যাবে না।','Delete this draft processing voucher? This cannot be undone.'))) return;
    try {
      await supabaseClient.from('ProcessingByProduct_Lines').delete().eq('ProcessingID', state.id);
      const { error } = await supabaseClient.from('ProcessingVoucher').delete().eq('ProcessingID', state.id);
      if (error) throw new Error(error.message);
      showToast(t('ডিলিট হয়েছে ✅','Deleted ✅'), 'success');
      closeModal();
      if (refresh) await refresh();
    } catch (err) { showToast(err.message, 'error'); }
  });

  // "গড় দর" চেকবক্স: টিক দিলে তারিখ ও 'গড় দর আনুন' চালু হবে, না দিলে বন্ধ থাকবে (দর হাতে লিখবেন)
  document.getElementById('pv_UseAvgRate').addEventListener('change', function () {
    const on = this.checked;
    ['pv_DateFrom','pv_DateTo','pv_FetchRateBtn'].forEach(function (id) { document.getElementById(id).disabled = !on; });
    if (on && !val('pv_DateTo')) document.getElementById('pv_DateTo').value = val('pv_Date');
    if (!on) document.getElementById('pv_RateHint').textContent = '';
  });

  document.getElementById('pv_FetchRateBtn').addEventListener('click', async function () {
    const itemId = val('pv_RawMaterialItemID');
    const dateFrom = val('pv_DateFrom'), dateTo = val('pv_DateTo');
    if (!itemId) { showToast(t('আগে কাঁচামাল আইটেম বাছাই করুন।','Select the raw material item first.'), 'error'); return; }
    if (!dateFrom || !dateTo) { showToast(t('তারিখ হইতে ও তারিখ পর্যন্ত — দুটোই দিন।','Enter both Date From and Date To.'), 'error'); return; }
    if (dateFrom > dateTo) { showToast(t('"তারিখ হইতে" অবশ্যই "তারিখ পর্যন্ত"-এর আগে হতে হবে।','Date From must be before Date To.'), 'error'); return; }
    try {
      const result = await api('getAverageRate', { itemId: itemId, dateFrom: dateFrom, dateTo: dateTo });
      document.getElementById('pv_RMRate').value = result.averageRate.toFixed(2);
      document.getElementById('pv_RateHint').textContent = t(
        result.grnCount + 'টা GRN থেকে মোট ' + result.totalQtyPurchased.toFixed(2) + ' কেজির গড় দর',
        'Averaged from ' + result.grnCount + ' GRN(s), total ' + result.totalQtyPurchased.toFixed(2) + ' kg purchased'
      );
      recalcProcessing();
    } catch (err) {
      showToast(err.message, 'error');
    }
  });

  document.getElementById('pv_AddByProductBtn').addEventListener('click', function () {
    syncProcByProductRows();
    window.__procByProductRows.push({});
    renderProcByProductRows();
    recalcProcessing();
  });

  // রো যোগ/বাদ দেওয়ার আগে ইতিমধ্যে লেখা মান ধরে রাখা হচ্ছে, যাতে মুছে না যায়
  function syncProcByProductRows() {
    window.__procByProductRows = window.__procByProductRows.map(function (_, idx) {
      return { name: val('pv_bp_' + idx + '_name'), itemId: val('pv_bp_' + idx + '_item'), qty: val('pv_bp_' + idx + '_qty'), rate: val('pv_bp_' + idx + '_rate') };
    });
  }

  function renderProcByProductRows() {
    const wrap = document.getElementById('pv_ByProductWrap');
    if (!wrap) return;
    if (window.__procByProductRows.length === 0) {
      wrap.innerHTML = `<div class="empty-state" style="padding:14px;">${t('কোনো বাই-প্রডাক্ট নেই।','No by-products yet.')}</div>`;
      return;
    }
    const headCells = `<th>${t('নাম','Name')}</th><th>${t('আইটেম (ঐচ্ছিক)','Item (optional)')}</th><th>${t('পরিমাণ','Qty')}</th><th>${t('দর','Rate')}</th><th>${t('মূল্য','Value')}</th><th></th>`;
    const rows = window.__procByProductRows.map(function (row, idx) {
      return `<tr>
        <td><input id="pv_bp_${idx}_name" value="${attr(row.name)}" style="width:100px;"></td>
        <td><select id="pv_bp_${idx}_item"><option value="">—</option>${opts(window.__procItems, 'ItemID', 'ItemName')}</select></td>
        <td><input id="pv_bp_${idx}_qty" type="number" step="any" value="${attr(row.qty)}" oninput="recalcProcessing()" style="width:80px;"></td>
        <td><input id="pv_bp_${idx}_rate" type="number" step="any" value="${attr(row.rate)}" oninput="recalcProcessing()" style="width:80px;"></td>
        <td><span id="pv_bp_${idx}_val">0.00</span></td>
        <td><button type="button" class="pv-bp-del" onclick="window.__removeProcByProduct(${idx})">✕</button></td>
      </tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}</tr></thead><tbody>${rows}</tbody></table>`;
    window.__procByProductRows.forEach(function (row, idx) {
      const sel = document.getElementById('pv_bp_' + idx + '_item');
      if (sel && row.itemId) sel.value = row.itemId;
    });
  }
  window.__renderProcByProductRows = renderProcByProductRows;
  window.__removeProcByProduct = function (idx) {
    syncProcByProductRows();
    window.__procByProductRows.splice(idx, 1);
    renderProcByProductRows();
    recalcProcessing();
  };
  renderProcByProductRows();

  // পুরনো ভাউচারের মান ফর্মে বসানো
  if (existing) {
    const h = existing.header;
    const setV = function (id, v) { const el = document.getElementById(id); if (el && v !== undefined && v !== null) el.value = v; };
    setV('pv_RawMaterialItemID', h.RawMaterialItemID); setV('pv_WarehouseID', h.WarehouseID);
    setV('pv_Date', h.Date); setV('pv_DateFrom', h.DateFrom); setV('pv_DateTo', h.DateTo);
    if (h.DateFrom || h.DateTo) document.getElementById('pv_UseAvgRate').checked = true;
    setV('pv_Qty', h.RawMaterialQty); setV('pv_RMRate', h.RawMaterialRate); setV('pv_ProcRate', h.ProcessingRate);
    setV('pv_FinishedGoodsItemID', h.FinishedGoodsItemID); setV('pv_Pieces', h.Pieces);
    setV('pv_SaleRatePerKg', h.SaleRatePerKg || ''); setV('pv_SaleRatePerPiece', h.SaleRatePerPiece || '');
    recalcProcessing();
    setProcessingFormLocked(true);
  }
}


/** প্রসেসিং ফর্মের সব ইনপুট লক/আনলক — পুরনো ভাউচার শুধু দেখার সময় লক থাকে */
function setProcessingFormLocked(locked) {
  const root = document.querySelector('#modalBody .pv-compact');
  if (!root) return;
  root.querySelectorAll('input, select, button').forEach(function (el) { el.disabled = locked; });
  if (!locked) {
    const on = document.getElementById('pv_UseAvgRate').checked;
    ['pv_DateFrom','pv_DateTo','pv_FetchRateBtn'].forEach(function (id) { document.getElementById(id).disabled = !on; });
    // হিসাব করা ঘরগুলো সবসময় readonly থাকে (disabled নয়)
  }
}

/** ফর্মের বর্তমান মান থেকে হেডার ও বাই-প্রডাক্ট লাইন — সেভ, প্রিন্ট ও শেয়ার তিন জায়গাতেই ব্যবহার হয় */
function collectProcessingForm() {
  const useAvg = document.getElementById('pv_UseAvgRate').checked;
  const lines = (window.__procByProductRows || [])
    .map(function (_, idx) {
      const q = Number(val('pv_bp_' + idx + '_qty')) || 0, r = Number(val('pv_bp_' + idx + '_rate')) || 0;
      return { ByProductName: val('pv_bp_' + idx + '_name'), ItemID: val('pv_bp_' + idx + '_item'), Quantity: q, Rate: r, Value: q * r };
    })
    .filter(function (l) { return l.Quantity > 0; });
  const header = {
    Date: val('pv_Date'), RawMaterialItemID: val('pv_RawMaterialItemID'),
    DateFrom: useAvg ? val('pv_DateFrom') : '', DateTo: useAvg ? val('pv_DateTo') : '',
    WarehouseID: val('pv_WarehouseID'),
    RawMaterialQty: Number(val('pv_Qty')) || 0, RawMaterialRate: Number(val('pv_RMRate')) || 0, RawMaterialValue: Number(val('pv_RMValue')) || 0,
    ProcessingRate: Number(val('pv_ProcRate')) || 0, ProcessingValue: Number(val('pv_ProcValue')) || 0,
    TotalValue: Number(val('pv_Total')) || 0,
    ByProductQty: lines.reduce(function (s, l) { return s + l.Quantity; }, 0),
    ByProductValue: lines.reduce(function (s, l) { return s + l.Value; }, 0),
    NetWeight: Number(val('pv_NetWeight')) || 0, NetValue: Number(val('pv_NetValue')) || 0,
    FinishedGoodsItemID: val('pv_FinishedGoodsItemID'), Pieces: Number(val('pv_Pieces')) || 0,
    RatePerKg: Number(val('pv_RatePerKg')) || 0, RatePerPiece: Number(val('pv_RatePerPiece')) || 0,
    SaleRatePerKg: Number(val('pv_SaleRatePerKg')) || 0, SaleRatePerPiece: Number(val('pv_SaleRatePerPiece')) || 0,
    Profit: Number(val('pv_Profit')) || 0
  };
  return { header: header, lines: lines };
}

/** প্রসেসিং ভাউচারের A5 প্রিন্ট — ক্রয়/বিক্রয় ভাউচারের একই হেডার ডিজাইন।
 *  autoPrint=true হলে খোলার সাথে সাথে প্রিন্ট ডায়ালগ আসে। লাভ শুধু স্ক্রিনে, প্রিন্টে আসে না। */
async function openProcessingPrintView(docId, autoPrint) {
  const d = collectProcessingForm();
  const h = d.header;
