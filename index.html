function mfParseFiles(v) {
  if (!v) return [];
  if (Array.isArray(v)) return v;
  try { const x = JSON.parse(v); return Array.isArray(x) ? x : []; } catch (e) { return []; }
}
function mfFilesHtml(f, currentVal) {
  window.__mfFiles = window.__mfFiles || {};
  window.__mfFiles[f.key] = mfParseFiles(currentVal);
  return `<div class="field"><label>${f.label}</label><div class="mf-files" id="mff_${f.key}"></div></div>`;
}
function mfRenderFiles(key) {
  const box = document.getElementById('mff_' + key); if (!box) return;
  const list = window.__mfFiles[key] || [];
  box.innerHTML = (list.length ? list.map(function (d, i) {
    return `<div class="mf-file">${/pdf/i.test(d.type || d.name) ? '📄' : '🖼'}<span title="${attr(d.name)}">${escapeHtml(d.name)}</span>
      <button type="button" data-mf-view="${key}|${i}" title="দেখুন">👁</button><button type="button" data-mf-rm="${key}|${i}" title="সরান">✕</button></div>`;
  }).join('') : '<div class="mf-prog">এখনো কোনো ডকুমেন্ট নেই।</div>') +
  `<label class="mf-up">📎 ডকুমেন্ট যোগ করুন<input type="file" multiple accept="image/*,application/pdf" data-mf-upload="${key}"></label><div class="mf-prog" id="mfp_${key}"></div>`;
}
function mfSetupExtras(config) {
  const body = document.getElementById('modalBody'); if (!body) return;
  if (config.photo) mfSetupPhoto(config.photo);
  config.fields.forEach(function (f) { if (f.type === 'files') mfRenderFiles(f.key); });
  const mode = {};
  body.addEventListener('change', async function (ev) {
    const el = ev.target;
    if (!el.dataset || !el.dataset.mfUpload) return;
    const key = el.dataset.mfUpload, f = config.fields.find(function (x) { return x.key === key; });
    const files = Array.prototype.slice.call(el.files || []);
    const prog = document.getElementById('mfp_' + key);
    let ok = 0;
    for (const file of files) {
      if (file.size > 10 * 1024 * 1024) { showToast(file.name + ' — ১০ MB-এর বেশি বড় ফাইল নেওয়া যাবে না।', 'error'); continue; }
      prog.textContent = file.name + ' আপলোড হচ্ছে…';
      const path = config.sheet + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '-' + file.name.replace(/[^A-Za-z0-9._-]/g, '_');
      const { error } = await supabaseClient.storage.from(f.bucket).upload(path, file, { contentType: file.type, upsert: false });
      if (error) { showToast('আপলোড হয়নি — ' + error.message, 'error'); continue; }
      window.__mfFiles[key].push({ name: file.name, path: path, type: file.type, size: file.size, uploadedAt: new Date().toISOString() });
      ok++;
    }
    mfRenderFiles(key);
    if (ok) showToast(ok + ' টা ডকুমেন্ট আপলোড হয়েছে — ফর্মটা সেভ করতে ভুলবেন না।', 'success');
  });
  body.addEventListener('click', async function (ev) {
    const b = ev.target.closest('button'); if (!b) return;
    const d = b.dataset;
    if (d.mfView) {
      const p = d.mfView.split('|'), f = config.fields.find(function (x) { return x.key === p[0]; }), doc = window.__mfFiles[p[0]][Number(p[1])];
      const win = window.open('', '_blank');
      const { data, error } = await supabaseClient.storage.from(f.bucket).createSignedUrl(doc.path, 3600);
      if (error) { if (win) win.close(); showToast(error.message, 'error'); return; }
      if (win) win.location = data.signedUrl; else window.location = data.signedUrl;
    } else if (d.mfRm) {
      const p = d.mfRm.split('|'), f = config.fields.find(function (x) { return x.key === p[0]; });
      if (!confirm('এই ডকুমেন্টটা সরাবেন?')) return;
      const doc = window.__mfFiles[p[0]].splice(Number(p[1]), 1)[0];
      if (doc) await supabaseClient.storage.from(f.bucket).remove([doc.path]);
      mfRenderFiles(p[0]); showToast('সরানো হয়েছে — ফর্মটা সেভ করুন।', 'success');
    } else if (d.mfAdd || d.mfEdit) {
      const key = d.mfAdd || d.mfEdit, sel = document.getElementById('mf_' + key);
      if (d.mfEdit && !sel.value) { showToast('এডিট করতে আগে একটা বাছাই করুন।', 'error'); return; }
      mode[key] = d.mfAdd ? 'add' : 'edit';
      document.getElementById('mfi_' + key).classList.add('on');
      const inp = document.getElementById('mfin_' + key); inp.value = d.mfEdit ? sel.options[sel.selectedIndex].text : ''; inp.focus();
      body.querySelector(`[data-mf-save="${key}"]`).disabled = false;
    } else if (d.mfSave) {
      const key = d.mfSave, f = config.fields.find(function (x) { return x.key === key; }), sel = document.getElementById('mf_' + key);
      const name = val('mfin_' + key).trim(); if (!name) { showToast('নাম লিখুন।', 'error'); return; }
      const row = {}; row[f.fkLabel] = name;
      try {
        if (mode[key] === 'add') {
          const cur = await cachedList(f.fkSheet);
          row.SortOrder = cur.reduce(function (m, r) { return Math.max(m, Number(r.SortOrder) || 0); }, 0) + 1;
          const { data, error } = await supabaseClient.from(tableFor(f.fkSheet)).insert(row).select();
          if (error) throw new Error(error.message);
          const o = document.createElement('option'); o.value = data[0][f.fkIdField]; o.textContent = name; sel.appendChild(o); sel.value = o.value;
        } else {
          const { error } = await supabaseClient.from(tableFor(f.fkSheet)).update(row).eq(f.fkIdField, sel.value);
          if (error) throw new Error(error.message);
          sel.options[sel.selectedIndex].text = name;
        }
        listCache = {}; mode[key] = '';
        document.getElementById('mfi_' + key).classList.remove('on'); b.disabled = true;
        showToast('সেভ হয়েছে ✅', 'success');
      } catch (err) { showToast(err.message, 'error'); }
    } else if (d.mfDel) {
      const key = d.mfDel, f = config.fields.find(function (x) { return x.key === key; }), sel = document.getElementById('mf_' + key);
      if (!sel.value) { showToast('ডিলিট করতে আগে একটা বাছাই করুন।', 'error'); return; }
      const used = (await api('list', { sheet: config.sheet })).filter(function (r) { return r.Status !== 'Deleted' && r[key] === sel.value; }).length;
      if (used) { showToast(used + ' টা রেকর্ডে এটা ব্যবহার হচ্ছে — আগে সেগুলো বদলান।', 'error'); return; }
      if (!confirm('"' + sel.options[sel.selectedIndex].text + '" ডিলিট করবেন?')) return;
      const { error } = await supabaseClient.from(tableFor(f.fkSheet)).update({ Status: 'Deleted' }).eq(f.fkIdField, sel.value);
      if (error) { showToast(error.message, 'error'); return; }
      sel.remove(sel.selectedIndex); sel.value = ''; listCache = {};
      showToast('ডিলিট হয়েছে ✅', 'success');
    }
  });
}

/* ============================================================
   ১২.৪) আইটেম মাস্টার — কাস্টম কার্ড (কোড/গ্রুপ/ক্যাটাগরি/একক/ডেসিমাল/

   দিয়ে নয় — কারণ এতে সেকশন-ভিত্তিক লেআউট ও লাইভ হিসাব (Decimal
   অটো-ফিল, Value = পরিমাণ×দর) দরকার যা জেনেরিক ইঞ্জিনে নেই।
   ============================================================ */
async function renderItemMasterPage(content) {
  content.innerHTML = `
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="আইটেম মাস্টার" data-en="Item Master">${t('আইটেম মাস্টার','Item Master')}</h1>
        <p class="i18n" data-bn="কাঁচামাল, তৈরি পণ্য ও অন্যান্য সব আইটেমের তালিকা" data-en="List of raw materials, finished goods and other items">${t('কাঁচামাল, তৈরি পণ্য ও অন্যান্য সব আইটেমের তালিকা','List of raw materials, finished goods and other items')}</p>
      </div>
      <button class="btn btn-primary" style="width:auto;" id="itemAddBtn">Item +</button></div>
    <div class="panel"><div id="itemTableWrap"></div></div>`;

  async function loadList() {
    const [items, groups, categories, units, stock, warehouses] = await Promise.all([
      api('list', { sheet:'Items' }), cachedList('ItemGroups'), cachedList('Categories'),
      cachedList('UOM'), api('list', { sheet:'CurrentStock' }), cachedList('Warehouses')
    ]);
    const groupMap = {}; groups.forEach(function (g) { groupMap[g.GroupID] = g.GroupName; });
    const catMap = {}; categories.forEach(function (c) { catMap[c.CategoryID] = c.CategoryName; });
    const unitMap = {}; units.forEach(function (u) { unitMap[u.UOMID] = u; });
    const whMap = {}; warehouses.forEach(function (w) { whMap[w.WarehouseID] = w.WarehouseName; });

    const wrap = document.getElementById('itemTableWrap');
    if (!wrap) return; // ব্যবহারকারী এই ফাঁকে অন্য পেজ/ট্যাবে চলে গেলে এই এলিমেন্ট আর DOM-এ থাকবে না
    const active = sortItemsBySerial(items.filter(function (r) { return r.Status !== 'Deleted'; }), catMap); // ক্যাটাগরি অনুযায়ী এক জায়গায়, সিরিয়াল ক্রমে
    if (active.length === 0) {
      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এখনো কোনো আইটেম যোগ করা হয়নি।" data-en="No items added yet.">${t('এখনো কোনো আইটেম যোগ করা হয়নি।','No items added yet.')}</div>`;
      return;
    }

    const headers = [
      ['কোড','Code'], ['নাম','Name'], ['গ্রুপ','Group'], ['ক্যাটাগরি','Category'], ['একক','Unit'], ['ওয়ারহাউজ','Warehouse'],
      ['পরিমাণ','Quantity'], ['দর','Rate'], ['মূল্য','Value'], ['স্ট্যাটাস','Status']
    ];
    const headCells = headers.map(function (h) { return `<th class="i18n" data-bn="${h[0]}" data-en="${h[1]}">${t(h[0], h[1])}</th>`; }).join('');

    const rowActionsHtml = function (r) {
      return `<td class="row-actions">
        <button onclick='openItemForm(${JSON.stringify(r).replace(/'/g,"&apos;")})' title="${t('সম্পাদনা','Edit')}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="m18.5 2.5 3 3L10 17l-4 1 1-4Z"/></svg>
        </button>
        <button onclick='deleteItemRecord(${JSON.stringify(r.ItemID)})' title="${t('ডিলিট','Delete')}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
        </button>
      </td>`;
    };

    const bodyRows = active.map(function (r) {
      const unit = unitMap[r.UOMID];
      const rate = Number(r.StandardCost) || 0;
      const statusCell = isTrue(r.IsActive)
        ? `<span class="badge active i18n" data-bn="সক্রিয়" data-en="Active">${t('সক্রিয়','Active')}</span>`
        : `<span class="badge inactive i18n" data-bn="নিষ্ক্রিয়" data-en="Inactive">${t('নিষ্ক্রিয়','Inactive')}</span>`;

      const itemStock = stock.filter(function (s) { return s.ItemID === r.ItemID; });
      const stockRows = itemStock.length > 0 ? itemStock : [null]; // স্টক না থাকলেও আইটেমটা অন্তত একবার দেখানো হবে

      return stockRows.map(function (s) {
        const pcsItem = isPieceUOM(r.UOMID, units);
        const qtyNum = s ? (Number(pcsItem ? s.QtyPieces : s.QtyOnHand) || 0) : 0;
        const value = qtyNum * rate;
        return `<tr>
          <td>${escapeHtml(r.ItemID)}</td><td>${escapeHtml(r.ItemName)}</td>
          <td>${escapeHtml(groupMap[r.GroupID] || '—')}</td><td>${escapeHtml(catMap[r.CategoryID] || '—')}</td>
          <td>${escapeHtml(unit ? unit.UOMName : '')}</td>
          <td>${s ? escapeHtml(whMap[s.WarehouseID] || s.WarehouseID) : '—'}</td>
          <td><b>${formatQtyByUOM(qtyNum, r.UOMID, units)}</b>${pcsItem && s && Number(s.QtyOnHand) ? `<div style="font-size:11px;color:var(--text-muted);">${(Number(s.QtyOnHand) || 0).toFixed(2)} ${t('কেজি','kg')}</div>` : ''}</td>
          <td>${rate ? rate.toFixed(2) : '—'}</td>
          <td><b>${value.toFixed(2)}</b></td>
          <td>${statusCell}</td>
          ${rowActionsHtml(r)}
        </tr>`;
      }).join('');
    }).join('');

    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}<th></th></tr></thead><tbody>${bodyRows}</tbody></table>`;
  }

  await loadList();
  window.__refreshItemList = loadList;
  document.getElementById('itemAddBtn').addEventListener('click', function () { openItemForm(null); });
}

async function deleteItemRecord(itemId) {

  try {

        </div>

    <div id="it_Section2" style="border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;${currentItemId?'':'opacity:.5;'}">

      ${!currentItemId ? `<p style="font-size:12px;color:var(--text-muted);margin:0 0 10px;">${t('প্রথমে "মূল তথ্য" সেভ করুন — তারপর এই সেকশন ব্যবহার করা যাবে।','Save "Basic Info" first — then this section unlocks.')}</p>` : ''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div class="field"><label>${t('গ্রুপ','Group')}</label><input id="it_Op_GroupEcho" readonly style="background:var(--bg);"></div>

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;">
        <div class="field"><label>${t('দর','Rate')}</label><input id="it_StdPurchaseRate" type="number" step="any" value="${attr(rec.StandardCost)}" ${currentItemId?'':'disabled'}></div>
        <div class="field"><label>${t('একক','Unit')}</label><input id="it_StdPurchaseUnitEcho" readonly style="background:var(--bg);"></div>
        <div class="field"><label>${t('তারিখ','Date')}</label><input type="date" id="it_StdPurchaseDate" value="${attr(rec.StandardCostDate) || new Date().toISOString().slice(0,10)}" ${currentItemId?'':'disabled'}></div>
      </div>
      <button type="button" class="btn btn-primary" style="width:auto;margin-top:12px;" id="it_SaveSection3" ${currentItemId?'':'disabled'}>${t('ক্রয় দর সেভ করুন','Save Purchase Rate')}</button>
      <span id="it_Section3Status" style="margin-left:10px;font-size:12px;color:var(--success);"></span>
    </div>

    <!-- ========== সেকশন ৪ — আদর্শ বিক্রয় দর ========== -->
    <div id="it_Section4" style="border:1px solid var(--border);border-radius:10px;padding:16px;${currentItemId?'':'opacity:.5;'}">
      <h4 style="margin:0 0 12px;font-size:13px;color:var(--text-muted);text-transform:uppercase;">${t('৪) আদর্শ বিক্রয় দর','4) Standard Sales Rate')}</h4>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;">

        <div class="field"><label>${t('তারিখ','Date')}</label><input type="date" id="it_StdSalesDate" value="${attr(rec.SalesPriceDate) || new Date().toISOString().slice(0,10)}" ${currentItemId?'':'disabled'}></div>
      </div>
      <button type="button" class="btn btn-primary" style="width:auto;margin-top:12px;" id="it_SaveSection4" ${currentItemId?'':'disabled'}>${t('বিক্রয় দর সেভ করুন','Save Sales Rate')}</button>

    bodyHtml: bodyHtml,
    wide: true,

  });

  }
  window.updateItemUnitEcho = refreshUnitEchoes;

  function refreshOpeningEchoes() {
    const groupSel = document.getElementById('it_GroupID');
    const catSel = document.getElementById('it_CategoryID');
    const nameInput = document.getElementById('it_ItemName');
    document.getElementById('it_Op_GroupEcho').value = groupSel.options[groupSel.selectedIndex] ? groupSel.options[groupSel.selectedIndex].text : '';
    document.getElementById('it_Op_CatEcho').value = catSel.options[catSel.selectedIndex] ? catSel.options[catSel.selectedIndex].text : '';
    document.getElementById('it_Op_ItemEcho').value = nameInput.value;
  }
  document.getElementById('it_GroupID').addEventListener('change', refreshOpeningEchoes);
  document.getElementById('it_CategoryID').addEventListener('change', refreshOpeningEchoes);
  document.getElementById('it_ItemName').addEventListener('input', refreshOpeningEchoes);
  refreshUnitEchoes();

  function recalcOpeningValue() {
    const qty = Number(val('it_Op_Qty')) || 0;
    const rate = Number(val('it_Op_Rate')) || 0;
    document.getElementById('it_Op_Value').value = (qty * rate).toFixed(2);
  }
  document.getElementById('it_Op_Qty').addEventListener('input', recalcOpeningValue);
  document.getElementById('it_Op_Rate').addEventListener('input', recalcOpeningValue);

  function unlockSections() {
    ['it_Section2', 'it_Section3', 'it_Section4'].forEach(function (id) { document.getElementById(id).style.opacity = '1'; });

      await api('postOpeningStock', { itemId: currentItemId, warehouseId: warehouseId, quantity: qty });
      statusEl.textContent = '✓ ' + t('সেভ হয়েছে','Saved');
      showToast(t('প্রারম্ভিক মজুদ যোগ হয়েছে ✅','Opening stock added ✅'), 'success');
    } catch (err) {
      showToast(err.message, 'error');
      statusEl.textContent = '';

      btn.disabled = false;

  // ---- সেকশন ৩: আদর্শ ক্রয় দর সেভ ----
  document.getElementById('it_SaveSection3').addEventListener('click', async function () {
    if (!currentItemId) { showToast(t('প্রথমে মূল তথ্য সেভ করুন।','Save Basic Info first.'), 'error'); return; }

      showToast(t('ক্রয় দর সেভ হয়েছে ✅','Purchase rate saved ✅'), 'success');
      if (window.__refreshItemList) await window.__refreshItemList();
    } catch (err) {
      showToast(err.message, 'error');
      statusEl.textContent = '';
    } finally {

    }

    try {

      if (window.__refreshItemList) await window.__refreshItemList();

/**
 * প্রতিটা পার্টি (ব্যক্তি/প্রতিষ্ঠান) স্বয়ংক্রিয়ভাবেই সাপ্লায়ার ও
 * কাস্টমার — দুটো হিসেবেই ব্যবহারযোগ্য হয় (একবার এন্ট্রি দিলেই
 * Suppliers ও Customers দুই Sheet-এ একই Code দিয়ে সেভ হয়)। তাই
 * আলাদা করে টিক দেওয়ার দরকার নেই — Purchase-এ তাকে সাপ্লায়ার
 * হিসেবে, Sales-এ কাস্টমার হিসেবে সরাসরি বাছাই করা যাবে।
 */

async function renderPartyMasterPage(content) {
  content.innerHTML = `
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="পার্টি (সাপ্লায়ার / কাস্টমার)" data-en="Party (Supplier / Customer)">${t('পার্টি (সাপ্লায়ার / কাস্টমার)','Party (Supplier / Customer)')}</h1>
        <p class="i18n" data-bn="একই ব্যক্তি বা প্রতিষ্ঠান থেকে ক্রয় ও তার কাছে বিক্রয় — দুটোই করা যাবে" data-en="Buy from and sell to the same person or business — both work">${t('একই ব্যক্তি বা প্রতিষ্ঠান থেকে ক্রয় ও তার কাছে বিক্রয় — দুটোই করা যাবে','Buy from and sell to the same person or business — both work')}</p>
      </div>
      <button class="btn btn-primary i18n" style="width:auto;" id="partyAddBtn" data-bn="+ নতুন পার্টি" data-en="+ New Party">${t('+ নতুন পার্টি','+ New Party')}</button></div>
    <div class="panel"><div id="partyListWrap"></div></div>`;

  async function loadPartyList() {
    const [suppliers, customers] = await Promise.all([api('list', { sheet:'Suppliers' }), api('list', { sheet:'Customers' })]);
    const map = {};
    function upsert(rec) {
      const key = rec.Code || rec.SupplierID || rec.CustomerID;
      if (!key) return;
      if (!map[key]) map[key] = { Code:key, Name:rec.Name, CompanyName:rec.CompanyName, Phone:rec.Phone, Zone:rec.Zone, Active:false };
      if (!map[key].Name && rec.Name) map[key].Name = rec.Name;
      if (!map[key].CompanyName && rec.CompanyName) map[key].CompanyName = rec.CompanyName;
      if (isTrue(rec.IsActive)) map[key].Active = true;
    }
    suppliers.filter(function (s) { return s.Status !== 'Deleted'; }).forEach(upsert);
    customers.filter(function (c) { return c.Status !== 'Deleted'; }).forEach(upsert);

    const rows = Object.values(map);
    const wrap = document.getElementById('partyListWrap');
    if (!wrap) return; // ব্যবহারকারী এই ফাঁকে অন্য পেজ/ট্যাবে চলে গেলে এই এলিমেন্ট আর DOM-এ থাকবে না
    if (rows.length === 0) {
      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এখনো কোনো পার্টি যোগ করা হয়নি।" data-en="No parties added yet.">${t('এখনো কোনো পার্টি যোগ করা হয়নি।','No parties added yet.')}</div>`;
      return;
    }

    const headers = [
      ['কোড','Code'], ['প্রোপ্রাইটর','Proprietor'], ['ব্যবসার নাম','Business Name'],
      ['ফোন','Phone'], ['জোন','Zone'], ['অবস্থা','Status']
    ];
    const headCells = headers.map(function (h) { return `<th class="i18n" data-bn="${h[0]}" data-en="${h[1]}">${t(h[0], h[1])}</th>`; }).join('');

    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}<th></th></tr></thead><tbody>
      ${rows.map(function (r) {
        return `<tr>
          <td>${escapeHtml(r.Code)}</td><td>${escapeHtml(r.Name)}</td><td>${escapeHtml(r.CompanyName)}</td>
          <td>${escapeHtml(r.Phone)}</td><td>${escapeHtml(r.Zone)}</td>
          <td><span class="badge ${r.Active?'active':'inactive'} i18n" data-bn="${r.Active?'সক্রিয়':'নিষ্ক্রিয়'}" data-en="${r.Active?'Active':'Inactive'}">${t(r.Active?'সক্রিয়':'নিষ্ক্রিয়', r.Active?'Active':'Inactive')}</span></td>
          <td class="row-actions"><button onclick='openPartyForm(${JSON.stringify(r.Code)})' title="${t('সম্পাদনা','Edit')}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="m18.5 2.5 3 3L10 17l-4 1 1-4Z"/></svg>
          </button></td>
        </tr>`;
      }).join('')}
    </tbody></table>`;
  }

  await loadPartyList();
  window.__refreshPartyList = loadPartyList;
  document.getElementById('partyAddBtn').addEventListener('click', function () { openPartyForm(null); });
}

async function openPartyForm(existingCode) {
  let supplierRec = null, customerRec = null;
  const zonesPromise = api('list', { sheet: 'Zones' });
  if (existingCode) {
    const [suppliers, customers] = await Promise.all([api('list', { sheet:'Suppliers' }), api('list', { sheet:'Customers' })]);
    supplierRec = suppliers.find(function (s) { return s.Code === existingCode && s.Status !== 'Deleted'; }) || null;
    customerRec = customers.find(function (c) { return c.Code === existingCode && c.Status !== 'Deleted'; }) || null;
  }
  const zones = await zonesPromise;
  const rec = supplierRec || customerRec || {};
  const isEdit = !!existingCode;

  function zoneOptionsHtml() {
    return zones.filter(function (z) { return z.Status !== 'Deleted'; })
      .map(function (z) { return `<option value="${attr(z.ZoneName)}" ${rec.Zone===z.ZoneName?'selected':''}>${escapeHtml(z.ZoneName)}</option>`; }).join('');
  }

  const bodyHtml = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
      <div class="field"><label>কোড</label><input id="pf_Code" value="${attr(existingCode || '')}" ${isEdit ? 'readonly style="background:var(--bg);"' : 'placeholder="খালি রাখলে অটো তৈরি হবে"'}></div>
      <div class="field"><label>জোন</label>
        <div style="display:flex;gap:8px;">
          <select id="pf_Zone" style="flex:1;min-width:0;"><option value="">—</option>${zoneOptionsHtml()}</select>
          <button type="button" id="pf_AddZoneBtn" class="btn" style="width:auto;padding:0 14px;flex-shrink:0;" title="নতুন জোন যোগ করুন">+</button>
        </div>
      </div>
      <div class="field"><label>ব্যবসার নাম (Business Name)</label><input id="pf_CompanyName" value="${attr(rec.CompanyName)}"></div>
      <div class="field"><label>প্রোপ্রাইটরের নাম (Proprietor Name)</label><input id="pf_Name" value="${attr(rec.Name)}"></div>
      <div class="field"><label>ফোন</label><input id="pf_Phone" value="${attr(rec.Phone)}"></div>
      <div class="field"><label>Email</label><input id="pf_Email" value="${attr(rec.Email)}"></div>
      ${amountDrCrFieldHtml('pf_OpeningBalance', 'ওপেনিং ব্যালেন্স', rec.OpeningBalance)}
      ${amountDrCrFieldHtml('pf_CreditLimit', 'ক্রেডিট লিমিট', rec.CreditLimit)}
      <div class="field"><label>লিমিট পরিশোধের তারিখ</label><input type="date" id="pf_CreditLimitPaidDate" value="${attr(rec.CreditLimitPaidDate)}"></div>
      <div class="field"><label>ঠিকানা</label><input id="pf_Address" value="${attr(rec.Address)}"></div>
      <div class="field"><label>ব্যাংক নাম</label><input id="pf_BankName" value="${attr(rec.BankName)}" placeholder="যেমন: সোনালী ব্যাংক, মতিঝিল শাখা"></div>
      <div class="field"><label>ব্যাংক অ্যাকাউন্ট নম্বর</label><input id="pf_BankAccountNumber" value="${attr(rec.BankAccountNumber)}"></div>
      <div class="field"><label>অবস্থা</label><select id="pf_IsActive">
        <option value="TRUE" ${!isEdit || isTrue(rec.IsActive) ? 'selected' : ''}>Active</option>
        <option value="FALSE" ${isEdit && !isTrue(rec.IsActive) ? 'selected' : ''}>Inactive</option>
      </select></div>
    </div>
    ${isEdit ? '<div style="margin-top:16px;"><button type="button" id="partyDeleteBtn" class="btn" style="width:auto;background:#fdecea;color:var(--danger);border-color:#f6c6c2;">ডিলিট করুন</button></div>' : ''}`;

  openModal({
    title: (isEdit ? 'সম্পাদনা — ' : 'নতুন — ') + 'পার্টি',
    bodyHtml: bodyHtml,
    onSave: async function () {
      const code = val('pf_Code') || ('PTY-' + Date.now().toString().slice(-6));
      const name = val('pf_Name');
      if (!name) throw new Error('প্রোপ্রাইটরের নাম আবশ্যক।');

      const common = {
        Code: code, Name: name, CompanyName: val('pf_CompanyName'), Phone: val('pf_Phone'), Email: val('pf_Email'),
        Address: val('pf_Address'), Zone: val('pf_Zone'), CreditLimitPaidDate: val('pf_CreditLimitPaidDate') || null,
        OpeningBalance: readAmountDrCr('pf_OpeningBalance'), CreditLimit: readAmountDrCr('pf_CreditLimit'),
        BankName: val('pf_BankName') || null, BankAccountNumber: val('pf_BankAccountNumber') || null,
        IsActive: val('pf_IsActive')
      };

      if (supplierRec) {
        await api('update', { sheet:'Suppliers', idField:'SupplierID', idValue: supplierRec.SupplierID, data: common });
      } else {
        await api('create', { sheet:'Suppliers', idField:'SupplierID', idPrefix:'SUP', requiredFields:['Name'], data: common });
      }
      if (customerRec) {
        await api('update', { sheet:'Customers', idField:'CustomerID', idValue: customerRec.CustomerID, data: common });
      } else {
        await api('create', { sheet:'Customers', idField:'CustomerID', idPrefix:'CUS', requiredFields:['Name'], data: common });
      }

      showToast('সেভ হয়েছে ✅ (কোড: ' + code + ')', 'success');
      if (window.__refreshPartyList) await window.__refreshPartyList();
    }
  });

  document.getElementById('pf_AddZoneBtn').addEventListener('click', async function () {
    const name = prompt('নতুন জোনের নাম লিখুন:');
    if (!name || !name.trim()) return;
    try {
      const newZone = await api('create', { sheet:'Zones', idField:'ZoneID', idPrefix:'ZONE', requiredFields:['ZoneName'], data:{ ZoneName: name.trim() } });
      const select = document.getElementById('pf_Zone');
      if (!select) return; // মোডাল ততক্ষণে বন্ধ হয়ে গেলে আর কিছু করার দরকার নেই
      const opt = document.createElement('option');
      opt.value = newZone.ZoneName;
      opt.textContent = newZone.ZoneName;
      opt.selected = true;
      select.appendChild(opt);
      showToast('নতুন জোন যোগ হয়েছে ✅', 'success');
    } catch (err) {
      showToast(err.message, 'error');
    }
  });

  if (isEdit) {
    document.getElementById('partyDeleteBtn').addEventListener('click', async function () {
      if (!confirm('আপনি কি নিশ্চিত এই পার্টি ডিলিট করতে চান?')) return;
      try {
        if (supplierRec) await api('delete', { sheet:'Suppliers', idField:'SupplierID', idValue: supplierRec.SupplierID });
        if (customerRec) await api('delete', { sheet:'Customers', idField:'CustomerID', idValue: customerRec.CustomerID });
        showToast('ডিলিট হয়েছে ✅', 'success');
        closeModal();
        if (window.__refreshPartyList) await window.__refreshPartyList();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  }
}

    <div class="page-head"><div>

    const bodyRows = active.slice().reverse().map(function (r) {
      const cells = config.listColumns.map(function (c) {
        let v = r[c.key];
        if (c.key === 'Status') {
          v = v === 'Posted' ? `<span class="badge active i18n" data-bn="পোস্ট করা" data-en="Posted">${t('পোস্ট করা','Posted')}</span>` : `<span class="badge draft i18n" data-bn="খসড়া" data-en="Draft">${t('খসড়া','Draft')}</span>`;

        return '<td>' + v + '</td>';

        : '';
      return `<tr onclick='openSimpleVoucherForm(${JSON.stringify(r).replace(/'/g,"&apos;")})' style="cursor:pointer;">${cells}<td class="row-actions">${postBtn}</td></tr>`;
    }).join('');

async function openSimpleVoucherForm(existing) {
  const config = window.__activeSimpleVoucherConfig;
  const isEdit = !!existing;
  const isPosted = isEdit && existing.Status === 'Posted';

  const fkFieldsList = config.fields.filter(function (f) { return f.type === 'select-fk'; });
  const uniqueFkSheets = Array.from(new Set(fkFieldsList.map(function (f) { return f.fkSheet; })));
  const fkSheetMap = await cachedListMultiple(uniqueFkSheets);
  const fkLists = {};
  fkFieldsList.forEach(function (f) { fkLists[f.key] = fkSheetMap[f.fkSheet]; });

  const bodyHtml = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">` +
    config.fields.map(function (f) {
      const id = 'sv_' + f.key;
      const currentVal = existing ? existing[f.key] : '';
      const disabledAttr = isPosted ? 'disabled' : '';
      const label = t(f.label, f.labelEn || f.label);
      if (f.type === 'select-fk') {
        const opts = (fkLists[f.key] || []).filter(function (r) { return r.Status !== 'Deleted'; })
          .map(function (r) { return `<option value="${attr(r[f.fkIdField])}" ${currentVal===r[f.fkIdField]?'selected':''}>${escapeHtml(r[f.fkLabel])}</option>`; }).join('');
        return `<div class="field"><label>${label}</label><select id="${id}" ${disabledAttr}><option value="">—</option>${opts}</select></div>`;
      }
      if (f.type === 'select-enum') {
        const opts = f.options.map(function (o) { const ov = Array.isArray(o) ? o[0] : o, ol = Array.isArray(o) ? o[1] : o; return `<option value="${ov}" ${currentVal===ov?'selected':''}>${ol}</option>`; }).join('');
        return `<div class="field"><label>${label}</label><select id="${id}" ${disabledAttr}><option value="">—</option>${opts}</select></div>`;
      }
      if (f.type === 'date') return `<div class="field"><label>${label}</label><input type="date" id="${id}" value="${attr(currentVal)}" ${disabledAttr}></div>`;
      if (f.type === 'number') return `<div class="field"><label>${label}</label><input type="number" step="any" id="${id}" value="${attr(currentVal)}" ${disabledAttr}></div>`;
      return `<div class="field"><label>${label}</label><input id="${id}" value="${attr(currentVal)}" ${disabledAttr}></div>`;
    }).join('') +
    `</div>` +
    (isPosted ? `<p style="margin-top:14px;color:var(--text-muted);font-size:12.5px;">${t('এই ভাউচার পোস্ট হয়ে গেছে — আর সম্পাদনা করা যাবে না।','This voucher is already posted — it can no longer be edited.')}</p>` : '');

  openModal({
    title: (isEdit ? t('সম্পাদনা — ','Edit — ') : t('নতুন — ','New — ')) + t(config.titleBn, config.titleEn),
    bodyHtml: bodyHtml,
    onSave: async function () {
      if (isPosted) throw new Error(t('পোস্ট করা ভাউচার সম্পাদনা করা যাবে না।','A posted voucher cannot be edited.'));
      const data = {};
      config.fields.forEach(function (f) { data[f.key] = val('sv_' + f.key); });
      const missing = config.fields.filter(function (f) { return f.required && !data[f.key]; });
      if (missing.length > 0) throw new Error(missing.map(function (f) { return t(f.label, f.labelEn||f.label); }).join(', ') + t(' আবশ্যক।',' is required.'));

      if (isEdit) {
        await api('update', { sheet: config.sheet, idField: config.idField, idValue: existing[config.idField], data: data });
      } else {
        const requiredFields = config.fields.filter(function (f) { return f.required; }).map(function (f) { return f.key; });
        await api('create', { sheet: config.sheet, idField: config.idField, idPrefix: config.idPrefix, requiredFields: requiredFields, data: data });
      }
      showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
      if (window.__refreshSimpleVoucherList) await window.__refreshSimpleVoucherList();
    }
  });
}

/** ট্রায়াল ব্যালেন্স — বর্তমানে শুধু পোস্ট করা Journal Voucher-এর হিসাব দেখায় */
async function renderTrialBalance(content) {
  const [jvHeaders, jvLines, accounts] = await Promise.all([
    api('list', { sheet:'JournalVoucher' }), api('list', { sheet:'JV_Lines' }), api('list', { sheet:'ChartOfAccounts' })
  ]);
  const postedJVIDs = new Set(jvHeaders.filter(function (h) { return h.Status === 'Posted'; }).map(function (h) { return h.JVID; }));
  const accMap = {}; accounts.forEach(function (a) { accMap[a.AccountID] = a.AccountName; });

  const totals = {};
  jvLines.filter(function (l) { return postedJVIDs.has(l.JVID); }).forEach(function (l) {
    if (!totals[l.AccountID]) totals[l.AccountID] = { debit: 0, credit: 0 };
    totals[l.AccountID].debit += Number(l.Debit || 0);
    totals[l.AccountID].credit += Number(l.Credit || 0);
  });

  content.innerHTML = `
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="ট্রায়াল ব্যালেন্স" data-en="Trial Balance">${t('ট্রায়াল ব্যালেন্স','Trial Balance')}</h1>
        <p class="i18n" data-bn="বর্তমানে শুধু পোস্ট করা জার্নাল ভাউচার এন্ট্রি থেকে হিসাব করা হয়েছে" data-en="Currently computed from posted Journal Voucher entries only">${t('বর্তমানে শুধু পোস্ট করা জার্নাল ভাউচার এন্ট্রি থেকে হিসাব করা হয়েছে','Currently computed from posted Journal Voucher entries only')}</p>
      </div></div>
    <div class="panel"><div id="trialBalanceWrap"></div></div>`;

  const wrap = document.getElementById('trialBalanceWrap');
  if (!wrap) return; // ব্যবহারকারী এই ফাঁকে অন্য পেজ/ট্যাবে চলে গেলে এই এলিমেন্ট আর DOM-এ থাকবে না
  const accountIds = Object.keys(totals);
  if (accountIds.length === 0) {
    wrap.innerHTML = `<div class="empty-state i18n" data-bn="কোনো পোস্ট করা Journal Voucher নেই।" data-en="No posted Journal Vouchers yet.">${t('কোনো পোস্ট করা Journal Voucher নেই।','No posted Journal Vouchers yet.')}</div>`;
    return;
  }

  let grandDebit = 0, grandCredit = 0;
  const rows = accountIds.map(function (accId) {
    const tt = totals[accId];
    grandDebit += tt.debit; grandCredit += tt.credit;
    return `<tr><td>${escapeHtml(accMap[accId] || accId)}</td><td>${tt.debit.toFixed(2)}</td><td>${tt.credit.toFixed(2)}</td></tr>`;
  }).join('');

const HR_WEEKDAYS_BN = ['রবি','সোম','মঙ্গল','বুধ','বৃহঃ','শুক্র','শনি'];
const HR_MONTHS_BN = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const HR_ATT = { P: 'Present', A: 'Absent', L: 'Leave' };
const HR_ATT_CODE = { Present: 'P', Absent: 'A', Leave: 'L', Idle: 'P' }; // পুরনো "বসা" এন্ট্রি উপস্থিত হিসেবে ধরা হয়

function hrIso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function hrDate(iso) { const p = String(iso).slice(0, 10).split('-'); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); }
function hrAddDays(iso, n) { const d = hrDate(iso); d.setDate(d.getDate() + n); return hrIso(d); }
function hrToday() { return hrIso(new Date()); }
function hrDayLabel(iso) { const d = hrDate(iso); return HR_WEEKDAYS_BN[d.getDay()] + ' ' + String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); }
function hrIsFriday(iso) { return hrDate(iso).getDay() === 5; }
/** যেকোনো তারিখের সপ্তাহ: শনিবার থেকে বৃহস্পতিবার */
function hrWeekOf(iso) {
  const d = hrDate(iso);
  const back = (d.getDay() + 1) % 7; // শনি=0, রবি=1 ... শুক্র=6
  const from = hrAddDays(iso, -back);
  return { from: from, to: hrAddDays(from, 5) };
}
function hrMonthRange(ym) { // ym = "2026-09"
  const y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7));
  return { from: hrIso(new Date(y, m - 1, 1)), to: hrIso(new Date(y, m, 0)), year: y, month: m };
}
function hrDatesBetween(from, to) { const out = []; let d = from; while (d <= to) { out.push(d); d = hrAddDays(d, 1); } return out; }
function hrMoney(n) { return (Number(n) || 0).toFixed(2); }
function hrNum(n) { const v = Math.round((Number(n) || 0) * 1000) / 1000; return String(v); }


/** "নাম খুঁজুন" ঘরের অটো ড্রপডাউন — লেখা শুরু করলে (বা ঘরে চাপ দিলে) মিলে যাওয়া নামের তালিকা নিচে ভেসে ওঠে।
 *  ↑ ↓ দিয়ে বাছাই, Enter চাপলে বা আঙুল/মাউসে চাপলে নেওয়া হয়। opts.list() → [{id, name, sub}], opts.onPick(item) */
function hrNameSuggest(input, opts) {
  if (!input || input.__sug) return;
  input.__sug = true;
  input.setAttribute('autocomplete', 'off');
  if (!document.getElementById('hrSugCss')) {
    const st = document.createElement('style'); st.id = 'hrSugCss';
    st.textContent = '.hr-sug{position:fixed;z-index:99999;background:var(--surface,#fff);border:1px solid var(--border,#ddd);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:260px;overflow-y:auto;font-size:13.5px;}'
      + '.hr-sug div{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border,#eee);display:flex;justify-content:space-between;gap:10px;}'
      + '.hr-sug div:last-child{border-bottom:0;} .hr-sug div.on,.hr-sug div:hover{background:var(--bg,#f3f4f6);}'
      + '.hr-sug span{color:var(--text-muted,#888);font-size:11.5px;white-space:nowrap;} .hr-sug b{font-weight:600;} .hr-sug .none{color:var(--text-muted,#888);cursor:default;}';
    document.head.appendChild(st);
  }
  let box = null, items = [], idx = -1;
  function close() { if (box) { box.remove(); box = null; } idx = -1; }
  function place() {
    if (!box) return;
    const r = input.getBoundingClientRect();
    box.style.left = r.left + 'px'; box.style.width = Math.max(r.width, 220) + 'px';
    const below = window.innerHeight - r.bottom;
    if (below < 200 && r.top > below) { box.style.top = ''; box.style.bottom = (window.innerHeight - r.top + 4) + 'px'; }
    else { box.style.bottom = ''; box.style.top = (r.bottom + 4) + 'px'; }
  }
  function open() {
    if (window.__hrSugActive && window.__hrSugActive !== api) window.__hrSugActive.close();
    window.__hrSugActive = api;
    const q = input.value.trim().toLowerCase();
    items = (opts.list() || []).filter(function (x) { return !q || String(x.name || '').toLowerCase().indexOf(q) !== -1; }).slice(0, 40);
    if (!box) { box = document.createElement('div'); box.className = 'hr-sug'; document.body.appendChild(box); }
    idx = items.length ? 0 : -1;
    box.innerHTML = items.length ? items.map(function (x, i) { return `<div data-i="${i}" class="${i === idx ? 'on' : ''}"><b>${escapeHtml(x.name)}</b><span>${escapeHtml(x.sub || '')}</span></div>`; }).join('')
      : `<div class="none">${t('কোনো নাম মেলেনি','No match')}</div>`;
    place();
  }
  function mark() { if (!box) return; box.querySelectorAll('[data-i]').forEach(function (el) { el.classList.toggle('on', Number(el.dataset.i) === idx); }); const on = box.querySelector('.on'); if (on) on.scrollIntoView({ block: 'nearest' }); }
  function pick(i) { const it = items[i]; close(); if (it) opts.onPick(it); }
  input.addEventListener('focus', open);
  input.addEventListener('input', open);
  input.addEventListener('keydown', function (ev) {
    if (!box) { if (ev.key === 'ArrowDown') open(); return; }
    if (ev.key === 'ArrowDown') { idx = Math.min(items.length - 1, idx + 1); mark(); ev.preventDefault(); }
    else if (ev.key === 'ArrowUp') { idx = Math.max(0, idx - 1); mark(); ev.preventDefault(); }
    else if (ev.key === 'Enter') { if (idx >= 0) { pick(idx); ev.preventDefault(); } }
    else if (ev.key === 'Escape') close();
  });
  input.addEventListener('blur', function () { setTimeout(function () { if (window.__hrSugActive === api) close(); }, 180); });
  const api = { close: close, place: place, pick: pick, owns: function (el) { return box && box.contains(el); }, input: input };
  // পুরো পেজে একটাই লিসেনার — যতবারই ঘর নতুন করে আঁকা হোক, লিসেনার জমে না
  if (!window.__hrSugGlobal) {
    window.__hrSugGlobal = true;
    document.addEventListener('mousedown', function (ev) {
      const a = window.__hrSugActive; if (!a) return;
      if (a.owns(ev.target)) { ev.preventDefault(); const el = ev.target.closest('[data-i]'); if (el) a.pick(Number(el.dataset.i)); }
      else if (ev.target !== a.input) a.close();
    });
    window.addEventListener('resize', function () { if (window.__hrSugActive) window.__hrSugActive.place(); });
    document.addEventListener('scroll', function () { if (window.__hrSugActive) window.__hrSugActive.place(); }, true);
  }
}

/** দৈনিক হাজিরাঃ মাসিক বেতন ÷ ৩০ (সেটিংস অনুযায়ী), সাপ্তাহিক বেতন ÷ ৬ (শনি–বৃহঃ)।
 *  পুরনো রেকর্ডে "দৈনিক" থাকলে বেতনটাই দৈনিক হাজিরা; ধরন না থাকলে মাসিক ধরা হয়। */
const HR_WEEK_DAYS = 6;
function hrDailyWage(emp, divisor) {
  emp = emp || {};
  if (Number(emp.DailyRate) > 0) return Number(emp.DailyRate);
  // পুরনো রেকর্ডঃ মাসিক ÷ ৩০, সাপ্তাহিক ÷ ৬, দৈনিক = বেতন
  const sal = Number(emp.BasicSalary) || 0, type = emp.SalaryType;
  if (type === 'Weekly') return sal / HR_WEEK_DAYS;
  if (type === 'Daily') return sal;
  return sal / (divisor || 30);
}
/** SortOrder অনুযায়ী সাজানো (না থাকলে শেষে, নাম অনুযায়ী) */
function hrBySortOrder(nameKey) {
  return function (a, b) {
    const so = function (x) { return (x.SortOrder === null || x.SortOrder === undefined || x.SortOrder === '') ? 9999 : Number(x.SortOrder); };
    return so(a) - so(b) || String(a[nameKey] || '').localeCompare(String(b[nameKey] || ''));
  };
}

    .sort(function (a, b) { return String(a.Name || '').localeCompare(String(b.Name || '')); });
  const items = (m.Items || []).filter(function (i) { return i.Status !== 'Deleted'; });
  const catMap = {}; cats.forEach(function (c) { catMap[c.CategoryID] = c.CategoryName; });

  const empMap = {}; (m.Employees || []).forEach(function (e) { empMap[e.EmployeeID] = e; });
  return { cats: cats, emps: emps, items: items, catMap: catMap, itemMap: itemMap, empMap: empMap };
}

/* ============================================================
   উৎপাদনের মজুরি — সাইজ × কাজের ধরন অনুযায়ী দর (সবার জন্য এক)।
   একজন কর্মচারী একই ভাউচারে একাধিক কাজের ধরন করতে পারে (যেমন শেপ + হাফ ফিনিশ)।
   সদস্যের উৎপাদন মূল্য = পরিমাণ (কাঁচামালের কেজি) × সেই কাজের দর।
   বেতন রানে ও.ডি = দিনের উৎপাদন মূল্য + বোনাস − সেদিনের হাজিরা।
   ============================================================ */
async function hrLoadGroups() {
  const m = await cachedListMultiple(['ItemGroups', 'WorkRoles', 'SizeRates']);
  const groups = (m.ItemGroups || []).filter(function (g) { return g.Status !== 'Deleted'; })
    .sort(function (a, b) { return String(a.GroupName || '').localeCompare(String(b.GroupName || '')); });
  const groupMap = {}; (m.ItemGroups || []).forEach(function (g) { groupMap[g.GroupID] = g.GroupName; });
  const roles = (m.WorkRoles || []).filter(function (r) { return r.Status !== 'Deleted' && (r.IsActive === undefined || r.IsActive === null || isTrue(r.IsActive)); })
    .sort(function (a, b) { const so = function (x) { return (x.SortOrder === null || x.SortOrder === undefined || x.SortOrder === '') ? 999 : Number(x.SortOrder); }; return so(a) - so(b) || String(a.RoleID).localeCompare(String(b.RoleID)); });
  const roleMap = {}; (m.WorkRoles || []).forEach(function (r) { roleMap[r.RoleID] = r.RoleName; });
  // Kind = 'Cost' হলে সেটা কর্মচারীর কাজ নয়, প্রতি কেজি উৎপাদন খরচ (বিদ্যুৎ, মেশিনারীজ, মেডিসিন, বিবিধ…)
  const laborRoles = roles.filter(function (r) { return r.Kind !== 'Cost'; });
  const costRoles = roles.filter(function (r) { return r.Kind === 'Cost'; });
  const rate = {}; (m.SizeRates || []).forEach(function (x) { if (Number(x.Rate) > 0) rate[x.ItemID + '|' + x.RoleID] = Number(x.Rate); });
  let settings = {};
  try { settings = await api('getSystemSettings', {}); } catch (e) { settings = {}; }
  const divisor = Number(settings.PayrollDivisor) > 0 ? Number(settings.PayrollDivisor) : 30;
  return { groups: groups, groupMap: groupMap, roles: roles, laborRoles: laborRoles, costRoles: costRoles, roleMap: roleMap, rate: rate, divisor: divisor,
    rateOf: function (itemId, roleId) { return rate[itemId + '|' + roleId] || 0; } };
}
/** প্রতিটা আইটেমের "ডিউটি পরিমাণ" (কত কেজিতে এক দিনের হাজিরা) — SizeRates-এ এই বিশেষ RoleID দিয়ে রাখা হয় */
const HR_DUTY_KEY = 'DUTY';
function hrIsHelper(base, empId) { return /হেল্পার|হেলপার|helper/i.test(base.catMap[(base.empMap[empId] || {}).CategoryID] || ''); }
/** নতুন সদস্য যোগ হলে ডিফল্ট কাজের ধরন — হেল্পার হলে "হেল্পার", নইলে প্রথম কারিগরের কাজ */
function hrDefaultRole(gp, base, empId) {
  const isH = function (r) { return /হেল্পার|হেলপার|helper/i.test(r.RoleName); };
  const helperRole = gp.laborRoles.find(isH);
  if (hrIsHelper(base, empId) && helperRole) return helperRole.RoleID;
  const other = gp.laborRoles.find(function (r) { return !isH(r); });
  return other ? other.RoleID : (gp.laborRoles[0] ? gp.laborRoles[0].RoleID : '');
}
/** একজন সদস্যের একটা কাজের ধরনের উৎপাদন মূল্য; দর না থাকা সাইজের তালিকাও ফেরত দেয় */
function hrRoleValue(gp, qtyByItem, roleId, ovRate) {
  let value = 0, qty = 0; const missing = [];
  const ov = (ovRate === undefined || ovRate === null || ovRate === '') ? null : Number(ovRate) || 0; // হাতে লেখা দর থাকলে সেটাই
  Object.keys(qtyByItem).forEach(function (itemId) {
    const q = Number(qtyByItem[itemId]) || 0; if (q <= 0) return;
    const r = ov !== null ? ov : gp.rateOf(itemId, roleId);
    if (!r) missing.push(itemId);
    value += q * r; qty += q;
  });
  return { value: value, qty: qty, rate: qty > 0 ? value / qty : 0, missing: missing };
}

/** দলের সদস্য বাছাইয়ের অংশ — প্রসেসিং ভাউচার ও দৈনিক উৎপাদন দুই জায়গাতেই একই */
function hrTeamMembersHtml(o) {

  const rates = o.rates || {};
  const items = Object.keys(o.qtyByItem).filter(function (k) { return Number(o.qtyByItem[k]) > 0; });
  return o.list.map(function (e) {
    const id = e.EmployeeID, sel = o.members[id], on = !!sel && Object.keys(sel).some(function (k) { return sel[k]; });
    const chips = o.gp.laborRoles.map(function (r) {

      return `<button type="button" class="hr-chip ${act ? 'on' : ''}" data-role="${attr(r.RoleID)}" data-emp="${attr(id)}" ${o.locked ? 'disabled' : ''}>${escapeHtml(r.RoleName)}</button>`;
    }).join('');
    const rateRows = on ? o.gp.laborRoles.filter(function (r) { return sel[r.RoleID]; }).map(function (r) {
      const k = id + '|' + r.RoleID, ov = rates[k];
      const def = items.length === 1 ? o.gp.rateOf(items[0], r.RoleID) : '';
      const v = (ov !== undefined && ov !== '') ? ov : def;

      return `<label class="hr-rate">${escapeHtml(r.RoleName)} <span>${t('দর','rate')}</span>
        <input type="number" step="any" min="0" data-rate="${attr(k)}" value="${attr(v)}" placeholder="${items.length > 1 ? t('সাইজ অনুযায়ী','per size') : ''}" ${o.locked ? 'disabled' : ''} class="${changed ? 'ov' : ''}">
        ${changed ? `<em title="${t('ডিফল্ট দর','Default rate')}">${t('ডিফল্ট ','default ')}${hrMoney(def)}</em>` : ''}</label>`;
    }).join('') : '';
    return `<div class="hr-mem ${on ? 'on' : ''}"><div class="hr-mem-top"><input type="checkbox" data-mem="${attr(id)}" ${on ? 'checked' : ''} ${o.locked ? 'disabled' : ''}>
        <div class="nm"><b>${escapeHtml(e.Name)} ${o.present[id] ? '<span style="color:#16a34a;font-weight:700;">P</span>' : ''}</b><span>${escapeHtml(o.base.catMap[e.CategoryID] || '—')}</span></div>
        <div class="amt" data-amt="${attr(id)}">${on ? hrMoney(hrMemberTotal(o.gp, sel, o.qtyByItem, rates, id)) : ''}</div></div>
      ${on ? `<div class="hr-chips">${chips}</div><div class="hr-rates">${rateRows}</div>` : ''}</div>`;
  }).join('');
}
function hrMemberTotal(gp, sel, qtyByItem, rates, id) {
  return Object.keys(sel || {}).reduce(function (s, roleId) { return sel[roleId] ? s + hrRoleValue(gp, qtyByItem, roleId, (rates || {})[id + '|' + roleId]).value : s; }, 0);
}
/** দর লেখার সময় পুরো অংশ নতুন করে না এঁকে শুধু টাকার ঘরগুলো বদলানো — যাতে লেখার ঘরের ফোকাস না হারায় */

/** সদস্যদের নির্বাচিত কাজ থেকে TeamProduction_Members-এর সারি — হাতে লেখা দর থাকলে সেটাই */
function hrMemberRows(gp, members, qtyByItem, teamProdId, rates) {
  const rows = [];
  Object.keys(members).forEach(function (id) {
    Object.keys(members[id] || {}).forEach(function (roleId) {
      if (!members[id][roleId]) return;
      const v = hrRoleValue(gp, qtyByItem, roleId, (rates || {})[id + '|' + roleId]);
      rows.push({ TeamProdID: teamProdId, EmployeeID: id, RoleID: roleId, Rate: v.rate, Amount: v.value });
    });
  });
  return rows;
}
function hrMembersMissingRates(gp, members, qtyByItem, rates) {

      if (!members[id][roleId]) return;
      hrRoleValue(gp, qtyByItem, roleId, (rates || {})[id + '|' + roleId]).missing.forEach(function (it) { miss[it + '|' + roleId] = true; });
    });
  });
  return Object.keys(miss);
}
function hrSelectedIds(members) { return Object.keys(members).filter(function (id) { return Object.keys(members[id] || {}).some(function (k) { return members[id][k]; }); }); }
