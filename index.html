<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>G Metal Works — Production ERP</title>
<!-- হোম স্ক্রিনে যোগ করলে অ্যাপের মতো (ব্রাউজার বার ছাড়া) খুলবে -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12161d">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="G Metal Works">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink-900:#12161d; --ink-800:#1a2029; --ink-700:#232b36; --steel-line:#2c3542;
  --amber:#f2a33c; --amber-dim:#c9812b; --slate-blue:#4c8fae;
  --bg:#eef0f3; --surface:#ffffff; --text:#1b1f27; --text-muted:#6b7280;
  --border:#e2e5ea; --danger:#d5484a; --success:#3fa66a;
  --sidebar-w:272px; --sidebar-w-collapsed:76px; --topbar-h:64px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter','Hind Siliguri',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
[lang-bn]{font-family:'Hind Siliguri','Inter',sans-serif;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#c7cbd3;border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}
button{font-family:inherit;}

/* ===== Login Screen ===== */
.login-screen{
  position:fixed;inset:0;z-index:200;
  background:radial-gradient(circle at 30% 20%, #232b38, var(--ink-900) 70%);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.login-card{
  width:100%;max-width:380px;background:var(--surface);border-radius:16px;
  padding:34px 30px;box-shadow:0 30px 70px rgba(0,0,0,.4);
}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
.login-brand .mark{
  width:42px;height:42px;flex-shrink:0;
  background:radial-gradient(circle at 30% 30%, #ffcf85, var(--amber) 55%, var(--amber-dim) 100%);
  clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-weight:700;color:var(--ink-900);font-size:17px;
}
.login-brand b{font-family:'Oswald',sans-serif;font-size:17px;display:block;}
.login-brand span{font-size:11px;color:var(--text-muted);letter-spacing:.08em;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--text);}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
  font:inherit;font-size:13.5px;background:var(--bg);color:var(--text);outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--amber);background:#fff;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 18px;border-radius:8px;border:none;cursor:pointer;
  font-size:13.5px;font-weight:600;font-family:inherit;
}
.btn-primary{background:var(--ink-900);color:var(--amber);width:100%;}
.btn-primary:hover{background:#000;}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-outline:hover{background:var(--bg);}
.btn-danger{background:var(--danger);color:#fff;}
.login-error{
  background:#fdecec;color:var(--danger);font-size:12.5px;padding:9px 12px;
  border-radius:8px;margin-bottom:14px;display:none;
}
.login-error.show{display:block;}
.login-hint{font-size:11.5px;color:var(--text-muted);margin-top:16px;text-align:center;line-height:1.6;}

/* ===== App shell ===== */
.app{display:none;min-height:100vh;}
.app.ready{display:flex;}
.sidebar{
  width:var(--sidebar-w);background:linear-gradient(180deg,var(--ink-900) 0%, var(--ink-800) 100%);
  color:#cdd3dc;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;
  transition:width .22s ease, transform .22s ease;z-index:40;border-right:1px solid var(--steel-line);
}
.sidebar.collapsed{width:var(--sidebar-w-collapsed);}
.brand{height:var(--topbar-h);display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--steel-line);flex-shrink:0;position:relative;}
.brand-mark{
  width:38px;height:38px;flex-shrink:0;
  background:radial-gradient(circle at 30% 30%, #ffcf85, var(--amber) 55%, var(--amber-dim) 100%);
  clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);
  display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:700;color:var(--ink-900);font-size:16px;
  box-shadow:0 0 0 2px rgba(0,0,0,.25) inset;
}
.brand-text{font-family:'Oswald',sans-serif;letter-spacing:.06em;line-height:1.1;overflow:hidden;white-space:nowrap;}
.brand-text b{display:block;font-size:15px;font-weight:600;color:#fff;}
.brand-text span{display:block;font-size:10px;color:var(--amber);font-weight:500;letter-spacing:.12em;}
.sidebar.collapsed .brand-text{display:none;}
.collapse-btn{position:absolute;right:-13px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--ink-800);border:1px solid var(--steel-line);color:var(--amber);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;z-index:5;}
.collapse-btn:hover{background:var(--amber);color:var(--ink-900);}
.nav-scroll{overflow-y:auto;flex:1;padding:10px 0 16px;}
.nav-item{list-style:none;}
.nav-link{display:flex;align-items:center;gap:12px;padding:10px 18px;cursor:pointer;color:#c3c9d3;font-size:13.5px;font-weight:500;position:relative;border-left:3px solid transparent;white-space:nowrap;}
.nav-link:hover{background:rgba(255,255,255,.04);color:#fff;}
.nav-item.active > .nav-link{background:rgba(242,163,60,.1);color:#fff;border-left:3px solid var(--amber);}
.nav-ico{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--amber);}
.nav-ico svg{width:18px;height:18px;}
.nav-label{flex:1;overflow:hidden;text-overflow:ellipsis;}
.chev{width:14px;height:14px;flex-shrink:0;transition:transform .18s ease;opacity:.7;}
.nav-item.open > .nav-link .chev{transform:rotate(90deg);}
.sidebar.collapsed .nav-label,.sidebar.collapsed .chev{display:none;}
.submenu{max-height:0;overflow:hidden;transition:max-height .22s ease;background:rgba(0,0,0,.18);}
.nav-item.open > .submenu{max-height:600px;}
.submenu a{display:block;padding:8px 18px 8px 52px;font-size:12.8px;color:#9aa2ae;border-left:3px solid transparent;cursor:pointer;}
.submenu a:hover{color:#fff;background:rgba(255,255,255,.04);}
.submenu a.active{color:var(--amber);border-left-color:var(--amber);}
.sidebar.collapsed .submenu{display:none;}
.sidebar-foot{border-top:1px solid var(--steel-line);padding:12px 18px;font-size:11px;color:#616876;flex-shrink:0;}
.sidebar.collapsed .sidebar-foot{display:none;}

.main{flex:1;margin-left:var(--sidebar-w);min-width:0;transition:margin-left .22s ease;}
.sidebar.collapsed ~ .main{margin-left:var(--sidebar-w-collapsed);}
.topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:30;}

/* ===== Tab Bar — একাধিক পেজ পরপর খোলা রাখার জন্য ===== */
.tab-bar{
  display:flex;align-items:stretch;gap:2px;
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 14px;overflow-x:auto;overflow-y:hidden;
  position:sticky;top:var(--topbar-h);z-index:25;
  scrollbar-width:thin;
}
.tab-bar:empty{display:none;}
.tab-item{
  display:flex;align-items:center;gap:8px;
  padding:9px 10px 9px 14px;
  font-size:12.5px;font-weight:500;color:var(--text-muted);
  border-bottom:2px solid transparent;
  cursor:pointer;white-space:nowrap;flex-shrink:0;
  max-width:220px;
}
.tab-item:hover{color:var(--text);background:var(--bg);}
.tab-item.active{color:var(--text);border-bottom-color:var(--amber);font-weight:600;}
.tab-item span.tab-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tab-item .tab-close{
  width:18px;height:18px;flex-shrink:0;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);
}
.tab-item .tab-close:hover{background:var(--danger);color:#fff;}
.tab-item .tab-close svg{width:11px;height:11px;}

.hamburger{display:none;width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface);align-items:center;justify-content:center;cursor:pointer;color:var(--text);flex-shrink:0;}
.crumb{font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;letter-spacing:.02em;}
.crumb small{display:block;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;color:var(--text-muted);letter-spacing:.02em;}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:10px;}
.icon-btn{width:38px;height:38px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);flex-shrink:0;position:relative;}
.icon-btn:hover{background:var(--bg);}
.icon-btn svg{width:17px;height:17px;}
.icon-btn.spinning svg{animation:spin .7s linear;}
.modal-tool-btn.spinning svg{animation:spin .7s linear;}
@keyframes spin{to{transform:rotate(360deg);}}
.lang-switch{display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:3px;font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;letter-spacing:.03em;flex-shrink:0;}
.lang-switch button{border:none;background:transparent;padding:6px 13px;border-radius:999px;cursor:pointer;color:var(--text-muted);}
.lang-switch button.active{background:var(--ink-900);color:var(--amber);}
.acct{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 5px;border:1px solid var(--border);border-radius:999px;cursor:pointer;position:relative;background:var(--surface);flex-shrink:0;}
.acct-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--slate-blue),#2c5a72);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:'Oswald',sans-serif;flex-shrink:0;}
.acct-name{font-size:12.5px;font-weight:600;line-height:1.1;}
.acct-role{font-size:10.5px;color:var(--text-muted);line-height:1.1;}
.acct-chev{width:12px;height:12px;color:var(--text-muted);}
.acct-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 14px 34px rgba(20,24,31,.14);padding:8px;display:none;z-index:50;}
.acct-menu.open{display:block;}
.acct-menu a{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:7px;font-size:13px;color:var(--text);cursor:pointer;}
.acct-menu a:hover{background:var(--bg);}
.acct-menu hr{border:none;border-top:1px solid var(--border);margin:6px 2px;}
.acct-menu a.danger{color:var(--danger);}

.content{padding:24px 26px 60px;max-width:1300px;}
.page-head{margin-bottom:20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.page-head h1{font-family:'Oswald',sans-serif;font-size:22px;margin:0 0 4px;font-weight:600;}
.page-head p{margin:0;color:var(--text-muted);font-size:13.5px;}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;top:0;left:0;width:4px;height:100%;background:var(--amber);}
.kpi.blue::before{background:var(--slate-blue);} .kpi.green::before{background:var(--success);} .kpi.red::before{background:var(--danger);}
.kpi-label{font-size:11.5px;color:var(--text-muted);letter-spacing:.03em;margin-bottom:8px;font-weight:600;text-transform:uppercase;}
.kpi-val{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;}
.kpi-sub{font-size:11.5px;color:var(--text-muted);margin-top:6px;}
.section-title{font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;margin:0 0 12px;letter-spacing:.02em;}

/* ===== Data table ===== */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap;}
table.data-table{width:100%;border-collapse:collapse;font-size:13px;}
.data-table th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);padding:11px 16px;border-bottom:1px solid var(--border);white-space:nowrap;}
.data-table td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:middle;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:#fafbfc;}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;}
.badge.active,.badge.posted,.badge.true{background:#e5f5ec;color:var(--success);}
.badge.deleted,.badge.false,.badge.inactive{background:#fdecec;color:var(--danger);}
.badge.draft{background:#fdf3e3;color:var(--amber-dim);}
.row-actions{display:flex;gap:6px;}
.row-actions button{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-muted);}
.row-actions button:hover{background:var(--bg);color:var(--text);}
.row-actions svg{width:14px;height:14px;}
.empty-state{padding:50px 20px;text-align:center;color:var(--text-muted);font-size:13.5px;}
.empty-state svg{width:38px;height:38px;color:var(--border);margin-bottom:10px;}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(10,12,16,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal-overlay.show{display:flex;}
.modal{width:100%;max-width:460px;background:var(--surface);border-radius:14px;max-height:90vh;display:flex;flex-direction:column;transition:max-width .15s;}
.modal.modal-wide{max-width:820px;}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.modal-head h3{margin:0;font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;flex-shrink:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.modal-toolbar{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.modal-toolbar #modalClock{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--text-muted);white-space:nowrap;}
.modal-tool-btn{width:26px;height:26px;flex-shrink:0;border-radius:6px;border:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);}
.modal-tool-btn:hover{background:var(--border);}
.modal-actions{display:none;align-items:center;gap:4px;padding-right:6px;margin-right:2px;border-right:1px solid var(--border);}
.modal-act-btn{height:26px;padding:0 7px;border-radius:6px;border:1px solid var(--border);background:var(--bg);display:flex;align-items:center;gap:4px;cursor:pointer;color:var(--text);font-family:inherit;font-size:11.5px;font-weight:600;white-space:nowrap;}
.modal-act-btn svg{width:13px;height:13px;flex-shrink:0;}
.modal-act-btn:hover:not(:disabled){background:var(--border);}
.modal-act-btn:disabled{opacity:.4;cursor:not-allowed;}
.modal-act-btn.danger{color:var(--danger);}
@media (max-width:900px){ .modal-act-btn span{display:none;} .modal-act-btn{width:28px;padding:0;justify-content:center;} }
.modal-tool-btn svg{width:13px;height:13px;}
.modal-lang-switch{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;flex-shrink:0;}
.modal-lang-switch button{font-family:'Oswald',sans-serif;font-size:10px;font-weight:600;padding:5px 8px;border:none;cursor:pointer;background:var(--bg);color:var(--text-muted);}
.modal-lang-switch button.active{background:var(--ink-900);color:var(--amber);}
#modalUserName{font-size:11px;color:var(--text-muted);white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;}
.modal-close{width:30px;height:30px;border-radius:8px;border:none;background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
@media (max-width:640px){
  .modal-toolbar #modalClock, #modalUserName{display:none;}
}
.modal-body{padding:18px 20px;overflow-y:auto;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.field-error{color:var(--danger);font-size:11.5px;margin-top:12px;padding:8px 10px;background:#fdecec;border-radius:7px;display:none;}
.field-error.show{display:block;}

/* ===== Toast ===== */
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:150;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink-900);color:#fff;padding:12px 16px;border-radius:9px;font-size:13px;box-shadow:0 10px 25px rgba(0,0,0,.25);border-left:4px solid var(--amber);max-width:320px;}
.toast.error{border-left-color:var(--danger);}
.toast.success{border-left-color:var(--success);}

.overlay-mobile{display:none;position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:35;}
.overlay-mobile.show{display:block;}

@media (max-width:1023px){
  .sidebar{transform:translateX(-100%);width:var(--sidebar-w);box-shadow:0 0 40px rgba(0,0,0,.3);}
  .sidebar.mobile-open{transform:translateX(0);}
  .sidebar.collapsed{width:var(--sidebar-w);}
  .sidebar.collapsed .brand-text,.sidebar.collapsed .nav-label,.sidebar.collapsed .chev,.sidebar.collapsed .sidebar-foot{display:block;}
  .sidebar.collapsed .submenu{display:block;}
  .collapse-btn{display:none;} .hamburger{display:flex;}
  .main{margin-left:0 !important;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:640px){
  .kpi-grid{grid-template-columns:1fr 1fr;gap:10px;}
  .kpi{padding:12px;border-radius:9px;}
  .kpi-label{font-size:9.5px;margin-bottom:5px;}
  .kpi-val{font-size:17px;}
  .kpi-sub{font-size:10px;margin-top:3px;}
  .content{padding:16px 14px 40px;}
  .acct-name,.acct-role{display:none;} .acct{padding:5px;}
  .crumb{font-size:14px;}
  .data-table{font-size:12px;}
  .data-table th,.data-table td{padding:9px 10px;}
}
/* চওড়া টেবিলে (অনেক কলাম/বাটন থাকলে) মোবাইলে যাতে ডানদিকের বাটনগুলো
   কেটে না যায়, প্যানেলে পাশে স্ক্রল করা যাবে — বড় স্ক্রিনে এটা প্রভাব ফেলে না */
.panel{overflow-x:auto;}

/* ===== মোবাইলঃ পেজ যেন পর্দার চেয়ে চওড়া না হয় (হেডার ছোট পর্দায় এঁটে যায়) ===== */
@media (max-width: 760px) {
  html, body { max-width: 100%; overflow-x: hidden; }
  .topbar { padding: 0 10px !important; gap: 8px !important; }
  .topbar .crumb { min-width: 0; flex: 1 1 auto; overflow: hidden; }
  .topbar .crumb #crumbTitle, .topbar .crumb small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-actions { gap: 6px !important; flex-shrink: 0; }
  #digitalClock { display: none !important; }
  .lang-switch button { padding: 5px 8px !important; font-size: 11.5px !important; }
  .acct-chev { display: none !important; }
  .icon-btn { width: 34px !important; height: 34px !important; }
}

/* ===== সব তারিখের ঘরঃ দিন-মাস-বছর (সাধারণ ব্যবস্থা) ===== */

let activeTabKey = null;
/** Supabase একবারে সর্বোচ্চ ১০০০ সারি দেয় — তাই ১০০০ করে পাতায় পাতায় সব সারি আনা হয়,
 *  যাতে আইটেম/দর/হাজিরা বেড়ে গেলেও কোনো সারি বাদ না পড়ে */
async function selectAllRows(table) {
  const size = 1000; let from = 0, all = [];
  for (let guard = 0; guard < 200; guard++) {
    const { data, error } = await supabaseClient.from(table).select('*').range(from, from + size - 1);
    if (error) throw new Error(error.message);
    all = all.concat(data || []);
    if (!data || data.length < size) break;
    from += size;
  }
  return all;
}
let listCache = {};     // ড্রপডাউনের রেফারেন্স ডেটা (Warehouse/Item/Supplier ইত্যাদি) ক্যাশ — বারবার ফর্ম খুললে
                         // প্রতিবার নতুন করে আনতে হবে না, যেটাই ধীরগতির প্রধান কারণ ছিল
const READ_ONLY_API_ACTIONS = ['list', 'login', 'logout', 'get', 'getSingleton', 'listMultiple', 'getDocument', 'getSystemSettings', 'getAverageRate'];

/* ============================================================
   ৩) API লেয়ার — এখন Google Apps Script-এর বদলে Supabase-এর
   সাথে কথা বলে। বাকি পুরো অ্যাপ (হাজারো লাইন কোড) অপরিবর্তিত
   রইলো — কারণ সেগুলো শুধু এই একটামাত্র api() ফাংশন ব্যবহার করে।
   ============================================================ */

// 'Sheet' নাম থেকে Postgres টেবিলের আসল নাম — যেসব টেবিল ছোট হাতের
// অক্ষরে বানানো হয়েছে (Core+Master), শুধু সেগুলোর জন্যই এই ম্যাপ লাগবে।

const SHEET_TABLE_MAP = {

  SystemSettings:'system_settings', CurrentStock:'current_stock', StockLedger:'stock_ledger'
};
function tableFor(sheet) { return SHEET_TABLE_MAP[sheet] || sheet; }

// docType → {table, idField} — postDocument-এর জন্য কোন টেবিল/আইডি-কলাম ব্যবহার হবে
const DOC_TYPE_MAP = {
  GRN: { table:'GRN', idField:'GRNID' },

  SalesInvoice: { table:'SalesInvoice', idField:'SIID' },

  ReceiptVoucher: { table:'ReceiptVoucher', idField:'RecID' }
};

async function api(action, payload) {
  payload = payload || {};
  try {
    const data = await runSupabaseAction(action, payload);
    if (READ_ONLY_API_ACTIONS.indexOf(action) === -1) {
      listCache = {}; // যেকোনো Create/Update/Delete/Post-এর পর ক্যাশ বাতিল, যাতে পুরনো ডেটা কখনো না দেখায়
    }
    return data;
  } catch (err) {
    throw new Error(err.message || 'অজানা একটা সমস্যা হয়েছে।');
  }
}

/* ============================================================
   স্টক পোস্টিং — দুই-মাত্রার (ওজন + পিস) ইনভেন্টরি লজিক
   ============================================================ */

/** CurrentStock ও StockLedger — দুটোতেই একসাথে কেজি ও পিসের
 *  পরিবর্তন বসিয়ে দেয়। kgDelta/piecesDelta পজিটিভ হলে স্টক বাড়বে,
 *  নেগেটিভ হলে কমবে। এটাই সব ধরনের স্টক-মুভমেন্টের একমাত্র কেন্দ্রবিন্দু —
 *  যাতে CurrentStock ও StockLedger কখনো একে অপরের থেকে আলাদা (out of sync) না হয়ে যায়। */
/** শুধু current_stock বদলায় (লেজারে সারি নয়) — ভাউচার ডিলিট/এডিটে স্টক ফেরতের জন্য */
async function adjustCurrentStock(itemId, warehouseId, kgDelta, piecesDelta) {
  if (!itemId || !warehouseId) return;
  kgDelta = Number(kgDelta) || 0; piecesDelta = Number(piecesDelta) || 0;
  const { data: ex } = await supabaseClient.from('current_stock').select('*').eq('ItemID', itemId).eq('WarehouseID', warehouseId).maybeSingle();
  if (ex) {
    const { error } = await supabaseClient.from('current_stock').update({ QtyOnHand: (Number(ex.QtyOnHand) || 0) + kgDelta, QtyPieces: (Number(ex.QtyPieces) || 0) + piecesDelta }).eq('ItemID', itemId).eq('WarehouseID', warehouseId);
    if (error) throw new Error(error.message);
  } else {
    const { error } = await supabaseClient.from('current_stock').insert({ ItemID: itemId, WarehouseID: warehouseId, QtyOnHand: kgDelta, QtyPieces: piecesDelta });
    if (error) throw new Error(error.message);
  }
}
async function postStockMovement(itemId, warehouseId, date, transactionType, refModule, refId, kgDelta, piecesDelta) {
  if (!itemId || !warehouseId) throw new Error('আইটেম বা গুদাম উল্লেখ করা নেই — স্টক পোস্ট করা যায়নি।');
  kgDelta = Number(kgDelta) || 0;
  piecesDelta = Number(piecesDelta) || 0;

  const { data: existing } = await supabaseClient.from('current_stock').select('*').eq('ItemID', itemId).eq('WarehouseID', warehouseId).maybeSingle();
  const newKg = (existing ? Number(existing.QtyOnHand) : 0) + kgDelta;
  const newPieces = (existing ? Number(existing.QtyPieces) : 0) + piecesDelta;

  if (existing) {
    const { error } = await supabaseClient.from('current_stock').update({ QtyOnHand: newKg, QtyPieces: newPieces }).eq('ItemID', itemId).eq('WarehouseID', warehouseId);
    if (error) throw new Error(error.message);
  } else {
    const { error } = await supabaseClient.from('current_stock').insert({ ItemID: itemId, WarehouseID: warehouseId, QtyOnHand: newKg, QtyPieces: newPieces });
    if (error) throw new Error(error.message);
  }

  const { error: ledgerErr } = await supabaseClient.from('stock_ledger').insert({
    ItemID: itemId, WarehouseID: warehouseId, Date: date, TransactionType: transactionType,
    RefModule: refModule, RefID: refId,
    QtyIn: kgDelta > 0 ? kgDelta : 0, QtyOut: kgDelta < 0 ? -kgDelta : 0, BalanceAfter: newKg,
    PiecesIn: piecesDelta > 0 ? piecesDelta : 0, PiecesOut: piecesDelta < 0 ? -piecesDelta : 0, PiecesBalanceAfter: newPieces
  });
  if (ledgerErr) throw new Error(ledgerErr.message);
}

/** পার্টি লেজারে (সাপ্লায়ার/কাস্টমার হিসাব) একটা এন্ট্রি বসায় — আগের
 *  ব্যালেন্স খুঁজে বের করে তার উপর নতুন Debit/Credit যোগ করে নতুন
 *  চলমান ব্যালেন্স হিসাব করে। নিয়ম: সাপ্লায়ার — Credit মানে আমরা তার
 *  কাছে আরও দেনাদার হলাম (ক্রয়), Debit মানে দেনা কমলো (ফেরত/পেমেন্ট)।
 *  কাস্টমার — Debit মানে সে আমাদের কাছে আরও পাওনাদার হলো (বিক্রয়),
 *  Credit মানে পাওনা কমলো (ফেরত/রিসিট)। */
async function postPartyLedgerEntry(partyType, partyId, date, refModule, refId, debit, credit) {
  if (!partyType || !partyId) return;
  debit = Number(debit) || 0; credit = Number(credit) || 0;
  if (debit === 0 && credit === 0) return;

  const { data: existing } = await supabaseClient.from('PartyLedger').select('Balance').eq('PartyType', partyType).eq('PartyID', partyId).order('id', { ascending: false }).limit(1);
  const prevBalance = (existing && existing[0]) ? Number(existing[0].Balance) || 0 : 0;
  const newBalance = prevBalance + debit - credit;

  const { error } = await supabaseClient.from('PartyLedger').insert({
    PartyType: partyType, PartyID: partyId, Date: date, RefModule: refModule, RefID: refId,
    Debit: debit, Credit: credit, Balance: newBalance,
    CreatedBy: currentUser ? (currentUser.FullName || currentUser.Email || null) : null
  });
  if (error) throw new Error(error.message);
}

/** ব্যাংক/ক্যাশ অ্যাকাউন্টের বইতে একটা এন্ট্রি বসায় — টাকা ঢুকলে Debit,
 *  বের হলে Credit, একইভাবে আগের ব্যালেন্স থেকে নতুন চলমান ব্যালেন্স হিসাব করে। */
async function postBankCashBookEntry(bankAccId, date, refModule, refId, debit, credit) {
  if (!bankAccId) return;
  debit = Number(debit) || 0; credit = Number(credit) || 0;
  if (debit === 0 && credit === 0) return;

  const { data: existing } = await supabaseClient.from('BankCashBook').select('Balance').eq('BankCashAccID', bankAccId).order('id', { ascending: false }).limit(1);
  const prevBalance = (existing && existing[0]) ? Number(existing[0].Balance) || 0 : 0;
  const newBalance = prevBalance + debit - credit;

  const { error } = await supabaseClient.from('BankCashBook').insert({
    BankCashAccID: bankAccId, Date: date, RefModule: refModule, RefID: refId,
    Debit: debit, Credit: credit, Balance: newBalance
  });
  if (error) throw new Error(error.message);
}

/** প্রতিটা ডকুমেন্ট টাইপ পোস্ট করলে ঠিক কী স্টক-প্রভাব পড়বে, তার
 *  ব্যবসায়িক নিয়ম। Status='Posted' হওয়ার আগেই এটা রান হয় (postDocument কেস দেখুন)। */
async function runPostingLogic(docType, header, docId) {
  const today = new Date().toISOString().slice(0, 10);

  if (docType === 'GRN') {
    // GRN এখন শুধু রেকর্ডের জন্য — আসল স্টক-বৃদ্ধি হয় Purchase Invoice পোস্ট করলে (নিচে দেখুন),
    // যাতে GRN+Invoice দুটোতেই স্টক দুইবার যোগ না হয়ে যায়।
    return;
  }

  if (docType === 'PurchaseInvoice') {
    if (!header.WarehouseID) throw new Error('এই ক্রয় চালানে কোনো গুদাম উল্লেখ নেই।');
    const { data: lines, error } = await supabaseClient.from('PI_Lines').select('*').eq('PIID', docId);
    if (error) throw new Error(error.message);
    for (const line of (lines || [])) {
      await postSalesStock(line.ItemID, header.WarehouseID, header.InvoiceDate || today, 'PurchaseInvoice', 'PurchaseInvoice', docId, line.Quantity, 1, { kg: line.QtyKg, pcs: line.QtyPcs });   // পিসের আইটেমে পিসের ঘরে
    }
    if (header.SupplierID === 'SUP-CASH') {
      // নগদ ক্রয় — কোনো দেনা তৈরি হবে না, সরাসরি ক্যাশ অ্যাকাউন্ট থেকে টাকা বের হয়ে যাবে
      await postBankCashBookEntry('BC-CASH', header.InvoiceDate || today, 'PurchaseInvoice', docId, 0, Number(header.TotalAmount) || 0);
    } else {
      await postPartyLedgerEntry('Supplier', header.SupplierID, header.InvoiceDate || today, 'PurchaseInvoice', docId, 0, Number(header.TotalAmount) || 0);
      // ভাউচারের সাথে সাথেই যদি আংশিক/পূর্ণ নগদ বা ব্যাংকে প্রদান করা হয়ে থাকে,
      // সেটা এখনই সরবরাহকারীর দেনা থেকে বাদ যাবে
      const cashPaid = Number(header.CashPaidAmount) || 0;
      const bankPaid = Number(header.BankPaidAmount) || 0;
      if (cashPaid > 0) {
        await postPartyLedgerEntry('Supplier', header.SupplierID, header.InvoiceDate || today, 'PurchaseInvoice-Payment', docId, cashPaid, 0);
        await postBankCashBookEntry('BC-CASH', header.InvoiceDate || today, 'PurchaseInvoice-Payment', docId, 0, cashPaid);
      }
      if (bankPaid > 0 && header.BankAccIDForPayment) {
        await postPartyLedgerEntry('Supplier', header.SupplierID, header.InvoiceDate || today, 'PurchaseInvoice-Payment', docId, bankPaid, 0);
        await postBankCashBookEntry(header.BankAccIDForPayment, header.InvoiceDate || today, 'PurchaseInvoice-Payment', docId, 0, bankPaid);
      }
    }
    return;
  }

  if (docType === 'PurchaseReturn') {
    let warehouseId = header.WarehouseID;
    if (!warehouseId && header.GRNID) {
      const { data: grn } = await supabaseClient.from('GRN').select('WarehouseID').eq('GRNID', header.GRNID).maybeSingle();
      warehouseId = grn ? grn.WarehouseID : null;
    }
    if (!warehouseId) throw new Error('গুদাম খুঁজে পাওয়া যায়নি — GRN রেফারেন্স যাচাই করুন।');
    const { data: lines, error } = await supabaseClient.from('PR_Return_Lines').select('*').eq('PRetID', docId);
    if (error) throw new Error(error.message);
    let returnTotal = 0;
    for (const line of (lines || [])) {
      await postSalesStock(line.ItemID, warehouseId, header.Date || today, 'PurchaseReturn', 'PurchaseReturn', docId, line.Quantity, -1, { kg: line.QtyKg, pcs: line.QtyPcs });
      returnTotal += (Number(line.Quantity) || 0) * (Number(line.Rate) || 0);
    }
    if (header.SupplierID === 'SUP-CASH') {
      // নগদ ক্রয়-ফেরত — টাকা ফেরত আসবে সরাসরি ক্যাশ অ্যাকাউন্টে
      await postBankCashBookEntry('BC-CASH', header.Date || today, 'PurchaseReturn', docId, returnTotal, 0);
    } else {
      await postPartyLedgerEntry('Supplier', header.SupplierID, header.Date || today, 'PurchaseReturn', docId, returnTotal, 0);
    }
    return;
  }

  if (docType === 'MaterialIssue') {
    if (!header.WarehouseID) throw new Error('গুদাম উল্লেখ নেই।');
    const { data: lines, error } = await supabaseClient.from('MI_Lines').select('*').eq('MIID', docId);
    if (error) throw new Error(error.message);
    for (const line of (lines || [])) {
      await postSalesStock(line.ItemID, header.WarehouseID, header.Date || today, 'MaterialIssue', 'MaterialIssue', docId, line.Quantity, -1);
    }
    return;
  }

  if (docType === 'StockTransfer') {
    if (!header.FromWarehouseID || !header.ToWarehouseID) throw new Error('উৎস/গন্তব্য গুদাম উল্লেখ নেই।');
    const { data: lines, error } = await supabaseClient.from('Transfer_Lines').select('*').eq('TransferID', docId);
    if (error) throw new Error(error.message);
    for (const line of (lines || [])) {
      const qty = Number(line.Quantity) || 0;
      const trPiece = await itemIsPiece(line.ItemID);   // পিসের আইটেমঃ পিস আর (পিস × উৎস-গুদামের গড় ওজন) কেজি দুটোই সরে
      const trKg = trPiece ? qty * (await avgKgPerPiece(line.ItemID, header.FromWarehouseID)) : qty, trPc = trPiece ? qty : 0;
      await postStockMovement(line.ItemID, header.FromWarehouseID, header.Date || today, 'StockTransfer-Out', 'StockTransfer', docId, -trKg, -trPc);
      await postStockMovement(line.ItemID, header.ToWarehouseID, header.Date || today, 'StockTransfer-In', 'StockTransfer', docId, trKg, trPc);
    }
    return;
  }

  if (docType === 'StockAdjustment') {
    if (!header.WarehouseID) throw new Error('গুদাম উল্লেখ নেই।');
    const { data: lines, error } = await supabaseClient.from('Adjustment_Lines').select('*').eq('AdjID', docId);
    if (error) throw new Error(error.message);
    for (const line of (lines || [])) {
      await postSalesStock(line.ItemID, header.WarehouseID, header.Date || today, 'StockAdjustment', 'StockAdjustment', docId, Math.abs(Number(line.QtyChange) || 0), (Number(line.QtyChange) || 0) < 0 ? -1 : 1);
    }
    return;
  }

  if (docType === 'DeliveryChallan') {
    // DC এখন শুধু রেকর্ডের জন্য — আসল স্টক-হ্রাস হয় Sales Invoice পোস্ট করলে
    return;
  }

  if (docType === 'SalesInvoice') {
    if (!header.WarehouseID) throw new Error('এই বিক্রয় চালানে কোনো গুদাম উল্লেখ নেই।');
    const { data: lines, error } = await supabaseClient.from('SI_Lines').select('*').eq('SIID', docId);
    if (error) throw new Error(error.message);
    for (const line of (lines || [])) {
      await postSalesStock(line.ItemID, header.WarehouseID, header.InvoiceDate || today, 'SalesInvoice', 'SalesInvoice', docId, line.Quantity, -1, { kg: line.QtyKg, pcs: line.QtyPcs });
    }
    if (header.CustomerID === 'CUS-CASH') {
      // নগদ বিক্রয় — কোনো পাওনা তৈরি হবে না, সরাসরি ক্যাশ অ্যাকাউন্টে টাকা জমা হবে
      await postBankCashBookEntry('BC-CASH', header.InvoiceDate || today, 'SalesInvoice', docId, Number(header.TotalAmount) || 0, 0);
    } else {
      await postPartyLedgerEntry('Customer', header.CustomerID, header.InvoiceDate || today, 'SalesInvoice', docId, Number(header.TotalAmount) || 0, 0);
      // ভাউচারের সাথে সাথেই যদি আংশিক/পূর্ণ নগদ বা ব্যাংকে গ্রহণ করা হয়ে থাকে,
      // সেটা এখনই গ্রাহকের পাওনা থেকে বাদ যাবে
      const cashReceived = Number(header.CashReceivedAmount) || 0;
      const bankReceived = Number(header.BankReceivedAmount) || 0;
      if (cashReceived > 0) {
        await postPartyLedgerEntry('Customer', header.CustomerID, header.InvoiceDate || today, 'SalesInvoice-Receipt', docId, 0, cashReceived);
        await postBankCashBookEntry('BC-CASH', header.InvoiceDate || today, 'SalesInvoice-Receipt', docId, cashReceived, 0);
      }
      if (bankReceived > 0 && header.BankAccIDForReceipt) {
        await postPartyLedgerEntry('Customer', header.CustomerID, header.InvoiceDate || today, 'SalesInvoice-Receipt', docId, 0, bankReceived);
        await postBankCashBookEntry(header.BankAccIDForReceipt, header.InvoiceDate || today, 'SalesInvoice-Receipt', docId, bankReceived, 0);
      }
    }
    return;
  }

  if (docType === 'SalesReturn') {
    if (!header.WarehouseID) throw new Error('এই বিক্রয় ফেরত ভাউচারে কোনো গুদাম উল্লেখ নেই।');
    const { data: lines, error } = await supabaseClient.from('SR_Lines').select('*').eq('SRID', docId);
    if (error) throw new Error(error.message);
    let salesReturnTotal = 0;
    for (const line of (lines || [])) {
      await postSalesStock(line.ItemID, header.WarehouseID, header.Date || today, 'SalesReturn', 'SalesReturn', docId, line.Quantity, 1, { kg: line.QtyKg, pcs: line.QtyPcs });
      salesReturnTotal += (Number(line.Quantity) || 0) * (Number(line.Rate) || 0);
    }
    if (header.CustomerID === 'CUS-CASH') {
      // নগদ বিক্রয়-ফেরত — টাকা ফেরত দেওয়া হবে সরাসরি ক্যাশ অ্যাকাউন্ট থেকে
      await postBankCashBookEntry('BC-CASH', header.Date || today, 'SalesReturn', docId, 0, salesReturnTotal);
    } else {
      await postPartyLedgerEntry('Customer', header.CustomerID, header.Date || today, 'SalesReturn', docId, 0, salesReturnTotal);
    }
    return;
  }

  if (docType === 'ProcessingVoucher') {
    if (!header.WarehouseID) throw new Error('এই প্রসেসিং ভাউচারে কোনো গুদাম উল্লেখ নেই।');
    // প্রস্তুত পণ্য লাইনগুলো আগেই যাচাই — কোনো লাইনে সমস্যা থাকলে কাঁচামালসহ স্টকে কিছুই পোস্ট না হয়ে শুরুতেই থামবে
    let fgLines = [];
    try { const fr = await supabaseClient.from('ProcessingFG_Lines').select('*').eq('ProcessingID', docId); fgLines = fr.data || []; } catch (e) { fgLines = []; }
    const fgPlan = [];
    for (const fl of fgLines) {
      const kg = Number(fl.QtyKg) || 0, pcs = Number(fl.QtyPcs) || 0;
      if (!(kg > 0) && !(pcs > 0)) throw new Error('প্রস্তুত পণ্যের কোনো লাইনে কেজি বা পিস কোনোটাই দেওয়া নেই।');
      fgPlan.push({ itemId: fl.ItemID, kg: kg, pcs: pcs });
    }
    // কাঁচামাল খরচ — স্টক থেকে কমবে
    await postStockMovement(header.RawMaterialItemID, header.WarehouseID, header.Date || today, 'ProcessingVoucher-RM', 'ProcessingVoucher', docId, -(Number(header.RawMaterialQty) || 0), -(Number(header.RawMaterialPcs) || 0));
    // বাই-প্রডাক্ট (ভাঙারি/কাটিং) — স্টকে যোগ হবে
    const { data: byProducts } = await supabaseClient.from('ProcessingByProduct_Lines').select('*').eq('ProcessingID', docId);
    const bpItems = await cachedList('Items');
    for (const bp of (byProducts || [])) {
      // আইটেম বাছাই না থাকলে একই নামের আইটেম (যেমন "কাটিং", "ভাঙ্গাড়ী", "অপচয়") — তাতে স্টকে যোগ
      let bpItem = bp.ItemID;
      if (!bpItem && bp.ByProductName) { const nm = String(bp.ByProductName).trim(); const hit = bpItems.find(function (i) { return i.Status !== 'Deleted' && String(i.ItemName || '').trim() === nm; }); if (hit) bpItem = hit.ItemID; }
      if (bpItem && ((Number(bp.Quantity) || 0) > 0 || (Number(bp.QtyPcs) || 0) > 0)) {
        await postStockMovement(bpItem, header.WarehouseID, header.Date || today, 'ProcessingVoucher-ByProduct', 'ProcessingVoucher', docId, Number(bp.Quantity) || 0, Number(bp.QtyPcs) || 0);
      }
    }
    // প্রস্তুত পণ্য — প্রতিটা লাইন নিজ নিজ আইটেমে, কেজি ও পিস দুটোই স্টকে যোগ হবে
    if (fgPlan.length > 0) {
      for (const fp of fgPlan) {
        await postStockMovement(fp.itemId, header.WarehouseID, header.Date || today, 'ProcessingVoucher-FG', 'ProcessingVoucher', docId, fp.kg, fp.pcs);
      }
    } else {
      // আগের (একক-পণ্যের) ভাউচারে লাইন-টেবিলে কিছু নেই — আগের নিয়মই চলে
      await postStockMovement(header.FinishedGoodsItemID, header.WarehouseID, header.Date || today, 'ProcessingVoucher-FG', 'ProcessingVoucher', docId, Number(header.NetWeight) || 0, Number(header.Pieces) || 0);
    }
    return;
  }

  if (docType === 'ContraVoucher') {
    const amt = Number(header.Amount) || 0;
    await postBankCashBookEntry(header.FromAccountID, header.Date || today, 'ContraVoucher', docId, 0, amt);
    await postBankCashBookEntry(header.ToAccountID, header.Date || today, 'ContraVoucher', docId, amt, 0);
    return;
  }

  if (docType === 'PaymentVoucher') {
    const amt = Number(header.Amount) || 0;
    // টাকা বের হয়ে যাচ্ছে, তাই ব্যাংক/ক্যাশ বইতে Credit
    await postBankCashBookEntry(header.BankCashAccID, header.Date || today, 'PaymentVoucher', docId, 0, amt);
    // সাপ্লায়ারকে পেমেন্ট দিলে দেনা কমে (Debit); কাস্টমারকে পেমেন্ট দিলে (যেমন ফেরত) তার পাওনা কমে (Credit)
    if (header.PartyType === 'Supplier') {
      await postPartyLedgerEntry('Supplier', header.PartyID, header.Date || today, 'PaymentVoucher', docId, amt, 0);
    } else if (header.PartyType === 'Customer') {
      await postPartyLedgerEntry('Customer', header.PartyID, header.Date || today, 'PaymentVoucher', docId, 0, amt);
    }
    return;
  }

  if (docType === 'ReceiptVoucher') {
    const amt = Number(header.Amount) || 0;
    // টাকা ঢুকছে, তাই ব্যাংক/ক্যাশ বইতে Debit
    await postBankCashBookEntry(header.BankCashAccID, header.Date || today, 'ReceiptVoucher', docId, amt, 0);
    // কাস্টমারের কাছ থেকে রিসিট পেলে তার পাওনা কমে (Credit); সাপ্লায়ারের কাছ থেকে (যেমন রিফান্ড) পেলে দেনা কমে (Debit)
    if (header.PartyType === 'Customer') {
      await postPartyLedgerEntry('Customer', header.PartyID, header.Date || today, 'ReceiptVoucher', docId, 0, amt);
    } else if (header.PartyType === 'Supplier') {
      await postPartyLedgerEntry('Supplier', header.PartyID, header.Date || today, 'ReceiptVoucher', docId, amt, 0);
    }
    return;
  }

  // বাকি ডকুমেন্ট টাইপ (BOM-ভিত্তিক Production Order route) এখনো শুধু
  // স্ট্যাটাস বদলাবে — এটা একটা আলাদা পরবর্তী ধাপে যোগ হবে।
}

/** পোস্ট করা ডকুমেন্ট ডিলিট করার আগে, সেই ডকুমেন্টের কারণে যা যা স্টক
 *  মুভমেন্ট হয়েছিল (StockLedger-এ RefModule+RefID দিয়ে খুঁজে) — প্রতিটার
 *  উল্টো এন্ট্রি বসিয়ে দিয়ে স্টক আবার আগের অবস্থায় ফিরিয়ে আনা হয়,
 *  তারপর পুরনো লেজার এন্ট্রিগুলো মুছে ফেলা হয়। */
async function reversePostedDocumentStock(docType, docId) {
  const nowDate = new Date().toISOString().slice(0,10);

  // স্টক ফেরতঃ এই ভাউচারের লেজার-সারিগুলো মুছে current_stock সমন্বয় — আলাদা "উল্টো সারি" বসানো হয় না।
  // (আগে উল্টো সারি বসিয়ে আসলটা মুছে ফেলা হতো; লেজারে শুধু মাইনাস সারি থেকে যেত আর স্টক ওভারভিউ মাইনাস দেখাত)
  const { data: entries } = await supabaseClient.from('stock_ledger').select('*').eq('RefModule', docType).eq('RefID', docId);
  for (const e of (entries || [])) {
    const kgDelta = (Number(e.QtyOut) || 0) - (Number(e.QtyIn) || 0);
    const piecesDelta = (Number(e.PiecesOut) || 0) - (Number(e.PiecesIn) || 0);
    await adjustCurrentStock(e.ItemID, e.WarehouseID, kgDelta, piecesDelta);
  }
  await supabaseClient.from('stock_ledger').delete().eq('RefModule', docType).eq('RefID', docId);

  // এই ডকুমেন্টের পার্টি লেজার ও ক্যাশ/ব্যাংক বইয়ের এন্ট্রি (মূল + সাথে সাথে করা প্রদান/গ্রহণ) মুছে ফেলা হয়,
  // তারপর সংশ্লিষ্ট পার্টি/অ্যাকাউন্টের চলমান ব্যালান্স নতুন করে হিসাব — আলাদা "উল্টো সারি" বসানো হয় না।
  // (আগে উল্টো সারি বসিয়ে আসলটা মুছে ফেলা হতো; একা উল্টো সারি থেকে গিয়ে আবার পোস্টে ব্যালান্স দ্বিগুণ ভুল হতো)
  const refModules = [docType, docType + '-Payment', docType + '-Receipt'];
  const parties = {}, accounts = {};
  for (const refMod of refModules) {
    const { data: partyEntries } = await supabaseClient.from('PartyLedger').select('PartyType,PartyID').eq('RefModule', refMod).eq('RefID', docId);
    (partyEntries || []).forEach(function (e) { parties[e.PartyType + '|' + e.PartyID] = e; });
    await supabaseClient.from('PartyLedger').delete().eq('RefModule', refMod).eq('RefID', docId);
    const { data: bankEntries } = await supabaseClient.from('BankCashBook').select('BankCashAccID').eq('RefModule', refMod).eq('RefID', docId);
    (bankEntries || []).forEach(function (e) { accounts[e.BankCashAccID] = true; });
    await supabaseClient.from('BankCashBook').delete().eq('RefModule', refMod).eq('RefID', docId);
  }
  for (const k of Object.keys(parties)) await rebalancePartyLedger(parties[k].PartyType, parties[k].PartyID);
  for (const a of Object.keys(accounts)) await rebalanceBankCashBook(a);
}
/** পার্টি লেজারের চলমান ব্যালান্স নতুন করে (সারি মোছার পর) — যে সারির ব্যালান্স বদলায় শুধু সেটাই হালনাগাদ */
async function rebalancePartyLedger(partyType, partyId) {
  if (!partyType || !partyId) return;
  const { data } = await supabaseClient.from('PartyLedger').select('id,Debit,Credit,Balance').eq('PartyType', partyType).eq('PartyID', partyId).order('id', { ascending: true });
  let bal = 0;
  for (const r of (data || [])) {
    bal += (Number(r.Debit) || 0) - (Number(r.Credit) || 0);
    if (Math.abs((Number(r.Balance) || 0) - bal) > 0.004) await supabaseClient.from('PartyLedger').update({ Balance: bal }).eq('id', r.id);
  }
}
async function rebalanceBankCashBook(accId) {
  if (!accId) return;
  const { data } = await supabaseClient.from('BankCashBook').select('id,Debit,Credit,Balance').eq('BankCashAccID', accId).order('id', { ascending: true });
  let bal = 0;
  for (const r of (data || [])) {
    bal += (Number(r.Debit) || 0) - (Number(r.Credit) || 0);
    if (Math.abs((Number(r.Balance) || 0) - bal) > 0.004) await supabaseClient.from('BankCashBook').update({ Balance: bal }).eq('id', r.id);
  }
}

/** এডমিনের পাসওয়ার্ড আবার যাচাই করে, পোস্ট করা ভাউচার নিরাপদে ডিলিট করে —
 *  স্টক এন্ট্রিও উল্টে ফেলা হয়, যাতে ইনভেন্টরিতে ভুতুড়ে গরমিল না থেকে যায়। */
async function deletePostedVoucherWithAdminAuth(docType, docId, sheetName, idField, linesSheet, lineIdField, onDone) {
  if (!currentUser || currentUser.RoleID !== 'ROLE-ADMIN') {
    showToast(t('শুধু এডমিনই পোস্ট করা ভাউচার ডিলিট করতে পারবেন।','Only an Admin can delete a posted voucher.'), 'error');
    return;
  }
  const password = prompt(t('নিরাপত্তার জন্য আপনার এডমিন পাসওয়ার্ড দিন:','Enter your admin password to confirm:'));
  if (!password) return;

  try {
    const { error } = await supabaseClient.auth.signInWithPassword({ email: currentUser.Email, password: password });
    if (error) throw new Error(t('পাসওয়ার্ড ভুল — ডিলিট বাতিল হয়েছে।','Incorrect password — delete cancelled.'));
  } catch (err) {
    showToast(err.message, 'error');
    return;
  }

  if (!confirm(t('আপনি কি সত্যিই এই পোস্ট করা ভাউচারটা ডিলিট করতে চান? এটা স্টক থেকে সংশ্লিষ্ট এন্ট্রি উল্টে দেবে এবং ফেরানো যাবে না।','Are you sure you want to delete this posted voucher? This will reverse its stock entries and cannot be undone.'))) return;

  try {
    await reversePostedDocumentStock(docType, docId);
    await supabaseClient.from(linesSheet).delete().eq(lineIdField, docId);
    await supabaseClient.from(sheetName).delete().eq(idField, docId);
    showToast(t('ভাউচার ও এর স্টক এন্ট্রি বাতিল করা হয়েছে ✅','Voucher and its stock entries have been reversed ✅'), 'success');
    if (onDone) await onDone();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

// তারিখ ও আইটেমের ঘরে ফাঁকা লেখা ("") ডেটাবেস নেয় না ("invalid input syntax for type date" / foreign key) — সেভের আগে null করা হয়
function cleanEmptyDates(obj) {
  if (!obj || typeof obj !== 'object') return obj;
  if (Array.isArray(obj)) { obj.forEach(cleanEmptyDates); return obj; }
  Object.keys(obj).forEach(function (k) { if (obj[k] === '' && (/date/i.test(k) || /ItemID$/.test(k))) obj[k] = null; });   // আইটেমের ঘরে "" = আইটেম তালিকায় নেই এমন আইটেম — তাই null
  return obj;
}
// ধাপে ধাপে যোগ হওয়া ঘর — ডেটাবেসে এখনো না থাকলে এগুলো বাদ দিয়ে সেভ (SQL চালানোর আগেও সফটওয়্যার চলে)
const OPTIONAL_COLS = ['QtyKg', 'QtyPcs', 'RateKg', 'RatePc', 'RateBasis', 'RawMaterialPcs', 'RatePerPc'];
const OPTIONAL_COLS_RE = new RegExp(OPTIONAL_COLS.join('|'));
function stripOptionalCols(r) { const c = Object.assign({}, r); OPTIONAL_COLS.forEach(function (k) { delete c[k]; }); return c; }
async function runSupabaseAction(action, p) {
  if (p && (action === 'create' || action === 'update' || action === 'createDocument' || action === 'updateDocument')) {
    cleanEmptyDates(p.data); cleanEmptyDates(p.headerData); cleanEmptyDates(p.lines);
  }
  switch (action) {

    case 'login': {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email: p.email, password: p.password });
      if (error) throw new Error('লগইন ব্যর্থ — ইমেইল অথবা পাসওয়ার্ড ভুল।');
      const { data: profile, error: profErr } = await supabaseClient.from('users').select('*').eq('UserID', data.user.id).single();
      if (profile && (profile.Status === 'Deleted' || profile.IsActive === false || String(profile.IsActive).toUpperCase() === 'FALSE')) { await supabaseClient.auth.signOut(); throw new Error('এই ব্যবহারকারী নিষ্ক্রিয় — অ্যাডমিনের সাথে যোগাযোগ করুন।'); }
      if (profErr || !profile) throw new Error('এই অ্যাকাউন্টের কোনো প্রোফাইল পাওয়া যায়নি — অ্যাডমিনের সাথে যোগাযোগ করুন।');
      await supabaseClient.from('users').update({ LastLogin: new Date().toISOString() }).eq('UserID', data.user.id);
      return { token: data.session.access_token, user: profile };
    }

    case 'logout': {
      await supabaseClient.auth.signOut();
      return {};
    }

    case 'list': {
      return await selectAllRows(tableFor(p.sheet));
    }

    case 'listMultiple': {
      const out = {};
      for (const sheet of p.sheets) {
        out[sheet] = await selectAllRows(tableFor(sheet));
      }
      return out;
    }

    case 'getSingleton': {
      const { data, error } = await supabaseClient.from(tableFor(p.sheet)).select('*').eq('id', 1).maybeSingle();
      if (error) throw new Error(error.message);
      return data || {};
    }
    case 'saveSingleton': {
      const { error } = await supabaseClient.from(tableFor(p.sheet)).update(p.data).eq('id', 1);
      if (error) throw new Error(error.message);
      return {};
    }

    case 'create': {
      const { data, error } = await supabaseClient.from(tableFor(p.sheet)).insert(p.data).select().single();
      if (error) throw new Error(error.message);
      return data;
    }
    case 'update': {
      const { data, error } = await supabaseClient.from(tableFor(p.sheet)).update(p.data).eq(p.idField, p.idValue).select().single();
      if (error) throw new Error(error.message);
      return data;
    }
    case 'delete': {
      // সফট-ডিলিট — রেকর্ড আসলে মুছে যায় না, শুধু Status='Deleted' হয়ে যায় (আগের মতোই)
      const { error } = await supabaseClient.from(tableFor(p.sheet)).update({ Status: 'Deleted' }).eq(p.idField, p.idValue);
      if (error) throw new Error(error.message);
      return {};
    }

    case 'createUser': {
      throw new Error('নতুন ইউজার তৈরি এই মুহূর্তে শুধু Supabase Dashboard → Authentication → Add user থেকেই করা যাবে, নিরাপত্তার কারণে।');
    }
    case 'updateUser': {
      const { error } = await supabaseClient.from('users').update({
        FullName: p.data.FullName, RoleID: p.data.RoleID, Phone: p.data.Phone, IsActive: p.data.IsActive === 'TRUE' || p.data.IsActive === true
      }).eq('UserID', p.userId);
      if (error) throw new Error(error.message);
      return {};
    }

    case 'createDocument': {
      let { data: header, error: hErr } = await supabaseClient.from(p.headerSheet).insert(p.headerData).select().single();
      if (hErr && OPTIONAL_COLS_RE.test(hErr.message || '')) ({ data: header, error: hErr } = await supabaseClient.from(p.headerSheet).insert(stripOptionalCols(p.headerData)).select().single());   // নতুন ঘরের SQL এখনো চালানো হয়নি
      if (hErr) throw new Error(hErr.message);
      if (p.lines && p.lines.length > 0) {
        const linesWithId = p.lines.map(function (l) { const row = Object.assign({}, l); row[p.lineIdField] = header[p.idField]; return row; });
        let { error: lErr } = await supabaseClient.from(p.linesSheet).insert(linesWithId);
        if (lErr && OPTIONAL_COLS_RE.test(lErr.message || '')) {   // 30/31 নম্বর SQL এখনো চালানো হয়নি — নতুন ঘরগুলো ছাড়া সেভ
          ({ error: lErr } = await supabaseClient.from(p.linesSheet).insert(linesWithId.map(stripOptionalCols)));
        }
        if (lErr) {   // লাইন বসেনি — অসম্পূর্ণ (খালি) ভাউচার যেন পড়ে না থাকে
          try { await supabaseClient.from(p.headerSheet).delete().eq(p.idField, header[p.idField]); } catch (e) {}
          throw new Error(lErr.message);
        }
      }
      window.__lastCreatedDoc = { sheet: p.headerSheet, id: header[p.idField] };   // ভাউচার তালিকায় "এইমাত্র সেভ" চিহ্নের জন্য
      return header;
    }
    case 'updateDocument': {
      let { error: hErr } = await supabaseClient.from(p.headerSheet).update(p.headerData).eq(p.idField, p.idValue);
      if (hErr && OPTIONAL_COLS_RE.test(hErr.message || '')) ({ error: hErr } = await supabaseClient.from(p.headerSheet).update(stripOptionalCols(p.headerData)).eq(p.idField, p.idValue));
      if (hErr) throw new Error(hErr.message);
      await supabaseClient.from(p.linesSheet).delete().eq(p.lineIdField, p.idValue);
      if (p.lines && p.lines.length > 0) {
        const linesWithId = p.lines.map(function (l) { const row = Object.assign({}, l); row[p.lineIdField] = p.idValue; return row; });
        let { error: lErr } = await supabaseClient.from(p.linesSheet).insert(linesWithId);
        if (lErr && OPTIONAL_COLS_RE.test(lErr.message || '')) {   // 30/31 নম্বর SQL এখনো চালানো হয়নি — নতুন ঘরগুলো ছাড়া সেভ
          ({ error: lErr } = await supabaseClient.from(p.linesSheet).insert(linesWithId.map(stripOptionalCols)));
        }
        if (lErr) throw new Error(lErr.message);
      }
      return {};
    }
    case 'getDocument': {
      const { data: header, error: hErr } = await supabaseClient.from(p.headerSheet).select('*').eq(p.idField, p.idValue).single();
      if (hErr) throw new Error(hErr.message);
      const { data: lines, error: lErr } = await supabaseClient.from(p.linesSheet).select('*').eq(p.lineIdField, p.idValue);
      if (lErr) throw new Error(lErr.message);
      return { header: header, lines: lines };
    }

    case 'postDocument': {
      const cfg = DOC_TYPE_MAP[p.docType];
      if (!cfg) throw new Error('অজানা ডকুমেন্ট টাইপ।');
      const { data: existingDoc, error: exErr } = await supabaseClient.from(cfg.table).select('*').eq(cfg.idField, p.docId).single();
      if (exErr) throw new Error(exErr.message);
      if (existingDoc.Status === 'Posted') throw new Error('এই ডকুমেন্ট আগেই পোস্ট করা হয়েছে।');

      await runPostingLogic(p.docType, existingDoc, p.docId);

      const { error } = await supabaseClient.from(cfg.table).update({ Status: 'Posted' }).eq(cfg.idField, p.docId);
      if (error) throw new Error(error.message);
      return {};
    }

    case 'postOpeningStock': {
      await postSalesStock(p.itemId, p.warehouseId, new Date().toISOString().slice(0,10), 'Opening', 'Items', p.itemId, p.quantity, 1);
      return {};
    }

    case 'getAverageRate': {
      // কাঁচামালের গড় দর ক্রয় ভাউচার (PurchaseInvoice) থেকে — কমিশন বাদে নিট মূল্য ÷ পরিমাণ;
      // শুধু পোস্ট করা ভাউচার, দুই তারিখের মধ্যে
      const { data: lines, error: lErr } = await supabaseClient.from('PI_Lines').select('*').eq('ItemID', p.itemId);
      if (lErr) throw new Error(lErr.message);
      if (!lines || lines.length === 0) return { averageRate: 0, voucherCount: 0, grnCount: 0, totalQtyPurchased: 0 };
      const piIds = Array.from(new Set(lines.map(function (l) { return l.PIID; })));
      const { data: headers, error: hErr } = await supabaseClient.from('PurchaseInvoice').select('PIID, InvoiceDate, Status').in('PIID', piIds);
      if (hErr) throw new Error(hErr.message);
      const dateMap = {}; (headers || []).forEach(function (h) { if (h.Status === 'Posted') dateMap[h.PIID] = h.InvoiceDate; });
      const filtered = lines.filter(function (l) {
        const d = dateMap[l.PIID];
        if (!d) return false;
        if (p.dateFrom && d < p.dateFrom) return false;
        if (p.dateTo && d > p.dateTo) return false;
        return true;
      });
      const qtyOf = function (l) { return Number(l.Quantity) || 0; };
      const valueOf = function (l) {
        if (l.NetAmount !== null && l.NetAmount !== undefined && l.NetAmount !== '') return Number(l.NetAmount) || 0;
        if (l.Amount !== null && l.Amount !== undefined && l.Amount !== '') return Number(l.Amount) || 0;
        return qtyOf(l) * (Number(l.Rate) || 0);
      };
      const totalQty = filtered.reduce(function (s, l) { return s + qtyOf(l); }, 0);
      const totalValue = filtered.reduce(function (s, l) { return s + valueOf(l); }, 0);
      const count = new Set(filtered.map(function (l) { return l.PIID; })).size;
      return { averageRate: totalQty > 0 ? totalValue / totalQty : 0, voucherCount: count, grnCount: count, totalQtyPurchased: totalQty };
    }

    case 'getSystemSettings': {
      const { data, error } = await supabaseClient.from('system_settings').select('*');
      if (error) throw new Error(error.message);
      const map = {}; (data || []).forEach(function (r) { map[r.Key] = r.Value; });
      return map;
    }
    case 'saveSystemSetting': {
      const { error } = await supabaseClient.from('system_settings').upsert({ Key: p.key, Value: p.value });
      if (error) throw new Error(error.message);
      return {};
    }

    default:
      throw new Error('অজানা action: ' + action);
  }
}

/** Warehouse/Item/Supplier-এর মতো রেফারেন্স ড্রপডাউনের ডেটার জন্য — একই সেশনে একবার আনলে
 *  আবার নতুন করে আনার দরকার নেই (কোনো লেখা/পরিবর্তন হলেই ক্যাশ নিজে থেকে খালি হয়ে যায়)। */
/** আইটেমের সিরিয়াল ক্রমঃ আগে ক্যাটাগরি অনুযায়ী এক জায়গায় (কলস, হাঁড়ি…), তারপর কোড অনুযায়ী
 *  (K, তারপর সব R, সব T, সব D, তারপর অন্য কোড), প্রতিটা কোডের ভেতরে সাইজ নম্বর ছোট থেকে বড়। K-09 ও K-9 একই নম্বর। */
const ITEM_CODE_ORDER = ['K', 'R', 'T', 'D'];
function itemSerialKey(it) {
  const m = String(it.ItemName || it.ItemCode || '').trim().match(/^([A-Za-z]+)\s*-?\s*(\d+)/);
  if (!m) return { code: '', num: Infinity, rank: 999 };
  const code = m[1].toUpperCase(), idx = ITEM_CODE_ORDER.indexOf(code);
  return { code: code, num: Number(m[2]), rank: idx === -1 ? 100 + code.charCodeAt(0) : idx };
}
function sortItemsBySerial(list, catNameMap) {
  const cn = catNameMap || {};
  return list.slice().sort(function (a, b) {
    const ca = cn[a.CategoryID] || '\uffff', cb = cn[b.CategoryID] || '\uffff';
    if (ca !== cb) return ca.localeCompare(cb);
    const ka = itemSerialKey(a), kb = itemSerialKey(b);
    if (ka.rank !== kb.rank) return ka.rank - kb.rank; // আগে কোড অনুযায়ী এক জায়গায় (সব R, তারপর সব T, তারপর সব D)
    if (ka.num !== kb.num) return ka.num - kb.num;      // তারপর সাইজ নম্বর ছোট থেকে বড়
    return String(a.ItemName || '').localeCompare(String(b.ItemName || ''));
  });
}

async function cachedList(sheet) {
  if (listCache[sheet]) return listCache[sheet];
  let data = await api('list', { sheet: sheet });
  if (sheet === 'Items') data = sortItemsBySerial(data, await categoryNameMap());
  listCache[sheet] = data;
  return data;
}
async function categoryNameMap() {
  if (!listCache.Categories) listCache.Categories = await api('list', { sheet: 'Categories' });
  const m = {}; (listCache.Categories || []).forEach(function (c) { m[c.CategoryID] = c.CategoryName; }); return m;
}

/** একাধিক Sheet-এর রেফারেন্স ডেটা একসাথে আনার জন্য — যেগুলো ক্যাশে নেই শুধু সেগুলোই
 *  একটামাত্র রিকোয়েস্টে ব্যাচ করে আনা হয়, ফর্ম খোলার গতি অনেক বাড়ায়।
 *  ব্যবহার: const {Items, Suppliers} = await cachedListMultiple(['Items','Suppliers']); */
async function cachedListMultiple(sheetNames) {
  const uncached = sheetNames.filter(function (s) { return !listCache[s]; });
  if (uncached.length > 0) {
    const result = await api('listMultiple', { sheets: uncached });
    uncached.forEach(function (s) { listCache[s] = result[s] || []; });
    if (uncached.indexOf('Items') !== -1) listCache.Items = sortItemsBySerial(listCache.Items, await categoryNameMap());
  }
  const out = {};
  sheetNames.forEach(function (s) { out[s] = listCache[s]; });
  return out;
}

function showToast(message, type) {
  const wrap = document.getElementById('toastWrap');
  if (!wrap) return; // ব্যবহারকারী এই ফাঁকে অন্য পেজ/ট্যাবে চলে গেলে এই এলিমেন্ট আর DOM-এ থাকবে না
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = message;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function buildSidebar() {
  const navScroll = document.getElementById('navScroll');
  navScroll.innerHTML = '';
  MODULES.map(function (m) { return Object.assign({}, m, { sub: (m.sub || []).filter(function (s) { return s.key === 'dashboard' || permLevel(s.key) > 0; }) }); })
    .filter(function (m) { return m.sub.length; }).forEach(function (m, i) {
    const li = document.createElement('div');
    li.className = 'nav-item' + (i === 0 ? ' open active' : '');
    li.innerHTML = `
      <div class="nav-link">
        <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[m.key]}</svg></span>
        <span class="nav-label i18n" data-bn="${m.bn}" data-en="${m.en}">${m.bn}</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <div class="submenu">
        ${m.sub.map(function(s){ return `<a data-page="${s.key}" data-bn="${s.bn}" data-en="${s.en}" data-mbn="${m.bn}" data-men="${m.en}">${s.bn}</a>`; }).join('')}
      </div>`;
    const link = li.querySelector('.nav-link');
    link.addEventListener('click', function () {
      const wasOpen = li.classList.contains('open');
      document.querySelectorAll('.nav-item').forEach(function(el){ el.classList.remove('open'); });
      if (!wasOpen) li.classList.add('open');
    });
    li.querySelectorAll('.submenu a').forEach(function (a) {
      a.addEventListener('click', function () {
        document.querySelectorAll('.submenu a').forEach(function(x){ x.classList.remove('active'); });
        a.classList.add('active');
        document.querySelectorAll('.nav-item').forEach(function(el){ el.classList.remove('active'); });
        li.classList.add('active');
        navigateTo(a.dataset.page, a.dataset[currentLang === 'bn' ? 'mbn' : 'men'], getLangText(a));
        if (window.innerWidth <= 1023) closeMobile();
      });
    });
    navScroll.appendChild(li);
  });
}
function getLangText(el){ return el.getAttribute('data-' + currentLang) || el.textContent; }

/** উপরে ট্যাব বার আঁকা — প্রতিটা খোলা পেজের জন্য একটা ট্যাব, বন্ধ করার × বাটনসহ */
function renderTabBar() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = openTabs.map(function (tb) {
    const isActive = tb.key === activeTabKey;
    return `<div class="tab-item${isActive ? ' active' : ''}" onclick="switchTab('${tb.key}')">
      <span class="tab-label">${escapeHtml(tb.pageLabel)}</span>
      <span class="tab-close" onclick="closeTab(event, '${tb.key}')" title="${t('বন্ধ করুন','Close')}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </span>
    </div>`;
  }).join('');
}

/** কোনো ট্যাবে ক্লিক করলে সেই পেজে ফিরে যাওয়া (আবার রেন্ডার হবে) */
function switchTab(pageKey) {
  const tb = openTabs.find(function (t2) { return t2.key === pageKey; });
  if (!tb) return;
  navigateTo(tb.key, tb.moduleLabel, tb.pageLabel);
}

/** ট্যাব বন্ধ করা — সক্রিয় ট্যাব বন্ধ হলে পাশের একটাতে (বা Dashboard-এ) চলে যাবে */
function closeTab(evt, pageKey) {
  evt.stopPropagation(); // ট্যাব ক্লিক ইভেন্টে যাতে না চলে যায়
  const idx = openTabs.findIndex(function (tb) { return tb.key === pageKey; });
  if (idx === -1) return;
  openTabs.splice(idx, 1);

  if (activeTabKey === pageKey) {
    if (openTabs.length > 0) {
      const next = openTabs[Math.max(0, idx - 1)];
      navigateTo(next.key, next.moduleLabel, next.pageLabel);
    } else {
      navigateTo('dashboard', t('কোর','Core'), t('ড্যাশবোর্ড','Dashboard'));
    }
  } else {
    renderTabBar();
  }
}

/* ============================================================
   ৮) পেজ: DASHBOARD (লাইভ KPI)
   ============================================================ */
/** মেনুর যেকোনো পেজ তার key দিয়ে খোলা (মডিউল ও পেজের নাম MODULES থেকে) */
function goPage(key) {
  for (const m of MODULES) {
    const sub = (m.sub || []).find(function (s) { return s.key === key; });
    if (sub) return navigateTo(key, t(m.bn, m.en), t(sub.bn, sub.en));
    if (m.key === key) return navigateTo(key, t(m.bn, m.en), t(m.bn, m.en));
  }
}

   ১০) পেজ: USER MANAGEMENT (Full CRUD)
   ============================================================ */
/* ============================================================
   ব্যবহারকারী ও অনুমতি
   প্রতিটা ভূমিকায় (Role) প্রতিটা পেজের জন্য একটা মাত্রাঃ
     0 = দেখতে পাবে না (মেনুতেই আসবে না)
     1 = শুধু দেখা (সেভ/নতুন/এডিট/ডিলিট বাটন লুকানো ও বন্ধ)
     2 = এন্ট্রি ও এডিট (ডিলিট বন্ধ)
     3 = সব (ডিলিটসহ)
   অ্যাডমিন ভূমিকা (নামে "Admin"/"অ্যাডমিন" বা "পূর্ণ অ্যাডমিন" টিক) সবকিছু পারে।
   কোনো ভূমিকায় এখনো অনুমতি ঠিক করা না থাকলে আগের মতোই সব খোলা থাকে।
   ============================================================ */
const PERM_LEVELS = [
  { v: 0, bn: '— নেই', en: '— None' },
  { v: 1, bn: '👁 শুধু দেখা', en: '👁 View only' },
  { v: 2, bn: '✏️ এন্ট্রি ও এডিট', en: '✏️ Entry & edit' },
  { v: 3, bn: '🗑 সব (ডিলিটসহ)', en: '🗑 Full (with delete)' }
];
let PERM = { admin: true, configured: false, pages: {} };
function parsePerms(v) { if (!v) return null; if (typeof v === 'object') return v; try { return JSON.parse(v); } catch (e) { return null; } }
function isAdminRole(role) { const p = parsePerms(role && role.Permissions); return !!(role && ((p && p.__admin) || /admin|অ্যাডমিন|এডমিন/i.test(role.RoleName || ''))); }
function loadPermissions(roles) {
  const role = (roles || []).find(function (r) { return r.RoleID === (currentUser || {}).RoleID; });
  const p = parsePerms(role && role.Permissions);
  if (!role || isAdminRole(role) || !p) { PERM = { admin: true, configured: !!p, pages: {} }; return; }
  PERM = { admin: false, configured: true, pages: p.pages || {} };
}
function permLevel(key) {
  if (PERM.admin) return 3;
  if (key === 'dashboard') return 1;
  if (key === 'roles' || key === 'userManagement') return 0; // ব্যবহারকারী ও অনুমতি শুধু অ্যাডমিন — নইলে কেউ নিজেই নিজের অনুমতি বাড়াতে পারত
  return Number(PERM.pages[key]) || 0;
}
function permCan(key, need) { return permLevel(key) >= need; }

/** বাটনের ধরন চেনা — ডিলিট, নাকি সেভ/নতুন/এডিট */
function permButtonKind(b) {
  if (!b || b.dataset.permSafe) return '';
  const txt = ((b.textContent || '') + ' ' + (b.title || '') + ' ' + (b.getAttribute('aria-label') || '')).trim();
  const ds = Object.keys(b.dataset || {}).join(' ');
  if (/🗑|ডিলিট|Delete|মুছুন|বাতিল করুন ভাউচার/.test(txt) || /\b(del|ld|sd|bdel|hdel|pdd|colhide)\b/i.test(ds) || (b.dataset.ra === 'delete')) return 'del';
  if (b.id === 'modalCancelBtn' || b.id === 'modalCloseBtn' || /🖨|প্রিন্ট|Print|👁|দেখুন|View|বাতিল|Cancel|রিফ্রেশ|Refresh|খুঁজুন|Search/.test(txt)) return '';
  if (b.id === 'modalSaveBtn' || /save|Add/i.test(b.id || '') || /💾|সেভ|Save|পোস্ট|Post|➕|＋|নতুন|New|✏️|এডিট|Edit|ইস্যু|Issue|যোগ/.test(txt) || b.dataset.ra === 'edit') return 'edit';
  return '';
}
function permTagButtons(root) {
  if (PERM.admin) return;
  (root || document).querySelectorAll('#pageContent button, #modalBox button, #pageContent [role=button]').forEach(function (b) {
    const k = permButtonKind(b);
    b.classList.toggle('perm-del', k === 'del'); b.classList.toggle('perm-edit', k === 'edit');
  });
}
(function installPermGuard() {
  if (window.__permGuard) return; window.__permGuard = true;
  const st = document.createElement('style');
  st.textContent = 'body[data-perm="1"] .perm-edit, body[data-perm="1"] .perm-del, body[data-perm="2"] .perm-del{display:none !important;}';
  document.head.appendChild(st);
  // বাটন লুকানো থাকলেও কীবোর্ড বা অন্যভাবে চাপ পড়লে আটকানো
  document.addEventListener('click', function (e) {
    if (PERM.admin) return;
    const b = e.target.closest && e.target.closest('button'); if (!b || !b.closest('#pageContent, #modalBox')) return;
    const lv = Number(document.body.dataset.perm || 3), k = permButtonKind(b);
    if ((k === 'del' && lv < 3) || (k === 'edit' && lv < 2)) {
      e.preventDefault(); e.stopImmediatePropagation();
      showToast(t('এই কাজের অনুমতি আপনার নেই।','You do not have permission for this.'), 'error');
    }
  }, true);
  const obs = new MutationObserver(function () { if (!PERM.admin) { clearTimeout(window.__permT); window.__permT = setTimeout(function () { permTagButtons(); }, 30); } });
  document.addEventListener('DOMContentLoaded', function () { obs.observe(document.body, { childList: true, subtree: true }); });
  if (document.body) obs.observe(document.body, { childList: true, subtree: true });
})();

      ${active.map(function (r) { return `<tr><td><b>${escapeHtml(r.RoleName)}</b></td><td>${summary(r)}</td><td class="c">${userCount(r.RoleID)}</td>

        `<tr><td colspan="4" style="color:var(--text-muted);">${t('এখনো কোনো ভূমিকা নেই।','No roles yet.')}</td></tr>`}

      if (el.id === 'reAdmin') { st.admin = el.checked; rb.innerHTML = body(); }
      else if (el.dataset.pg) st.pages[el.dataset.pg] = Number(el.value);
      else if (el.dataset.mod && el.value !== '') { const m = MODULES.find(function (x) { return x.key === el.dataset.mod; }); (m.sub || []).forEach(function (s) { st.pages[s.key] = Number(el.value); }); rb.innerHTML = body(); }
    });
    rb.addEventListener('click', function (ev) { const b = ev.target.closest('[data-all]'); if (!b) return; MODULES.forEach(function (m) { (m.sub || []).forEach(function (s) { st.pages[s.key] = Number(b.dataset.all); }); }); rb.innerHTML = body(); });
  }
}

        if (d.Password && d.Password.length < 6) throw new Error(t('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।','Password min 6 characters.'));

          await adminUsersCall({ action: 'create', email: d.Email, password: d.Password, fullName: d.FullName, roleId: d.RoleID, phone: d.Phone });

      if (roles.some(function (r) { return r.Status !== 'Deleted' && String(r.RoleName).trim() === name; })) { showToast(t('এই নামে ভূমিকা আগেই আছে।','A role with this name exists.'), 'error'); return; }
      let perms;
      if (preset === 'admin') perms = { __admin: true };
      else { const lv = Number(preset), pages = {}; MODULES.forEach(function (m) { (m.sub || []).forEach(function (sb) { if (sb.key !== 'roles' && sb.key !== 'userManagement' && lv) pages[sb.key] = lv; }); }); perms = { pages: pages }; }
      this.disabled = true;
      try {
        const r = await api('create', { sheet: 'Roles', idField: 'RoleID', idPrefix: 'ROLE', requiredFields: ['RoleName'], data: { RoleName: name, Permissions: perms } });
        const newRole = (r && r.RoleID) ? r : (await api('list', { sheet: 'Roles' })).find(function (x) { return x.RoleName === name && x.Status !== 'Deleted'; });
        if (!newRole) throw new Error(t('ভূমিকা সেভ হয়েছে কিনা নিশ্চিত হওয়া যায়নি — পেজ রিফ্রেশ করুন।','Could not confirm the new role — refresh.'));
        roles.push(newRole); rolesCache = roles;
        const sel = document.getElementById('um_RoleID'), o = document.createElement('option');
        o.value = newRole.RoleID; o.textContent = name; sel.appendChild(o); sel.value = newRole.RoleID;
        box.style.display = 'none'; document.getElementById('umRoleName').value = '';
        showToast(t('নতুন ভূমিকা তৈরি ও বাছাই হয়েছে ✅','Role created and selected ✅'), 'success');
      } catch (err) { showToast(err.message, 'error'); }
      this.disabled = false;
    });
  }
}
/** নতুন ব্যবহারকারী বানানো / অন্যের পাসওয়ার্ড বদল — নিরাপত্তার জন্য Supabase-এর admin-users ফাংশনের মাধ্যমে */
async function adminUsersCall(body) {
  const { data, error } = await supabaseClient.functions.invoke('admin-users', { body: body });
  if (error) {
    let msg = error.message || '';
    try { const ctx = error.context && await error.context.json(); if (ctx && ctx.error) msg = ctx.error; } catch (e) {}
    if (/not found|404|Failed to send a request/i.test(msg)) msg = t('"admin-users" ফাংশন এখনো Supabase-এ বসানো হয়নি — ততক্ষণ Supabase → Authentication → Add user দিয়ে ব্যবহারকারী বানান।','The admin-users function is not deployed yet.');
    throw new Error(msg);
  }
  if (data && data.error) throw new Error(data.error);
  return data || {};
}
