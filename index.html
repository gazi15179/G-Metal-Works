async function renderMasterCrudPage(content, config) {
  const records = await api('list', { sheet: config.sheet });
  // কলামে আইডির বদলে নাম দেখানোর জন্য (যেমন কর্মচারীর ধরন, পণ্য)
  const fkMaps = {};
  const fkCols = config.columns.filter(function (c) { return c.fkSheet; });
  if (fkCols.length) {
    const fkData = await cachedListMultiple(Array.from(new Set(fkCols.map(function (c) { return c.fkSheet; }))));
    fkCols.forEach(function (c) { const mp = {}; (fkData[c.fkSheet] || []).forEach(function (r) { mp[r[c.fkIdField]] = r[c.fkLabel]; }); fkMaps[c.key] = mp; });
  }

  content.innerHTML = `
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="${attr(config.titleBn)}" data-en="${attr(config.titleEn||config.titleBn)}">${t(config.titleBn, config.titleEn||config.titleBn)}</h1>
        <p class="i18n" data-bn="${attr(config.subBn)}" data-en="${attr(config.subEn||config.subBn)}">${t(config.subBn, config.subEn||config.subBn)}</p>
      </div>
      <button class="btn btn-primary i18n" style="width:auto;" id="masterAddBtn" data-bn="+ নতুন যোগ করুন" data-en="+ Add New">${t('+ নতুন যোগ করুন','+ Add New')}</button></div>
    <div class="panel"><div id="masterTableWrap"></div></div>`;

  function renderTable(list) {
    const wrap = document.getElementById('masterTableWrap');
    if (!wrap) return; // ব্যবহারকারী এই ফাঁকে অন্য পেজ/ট্যাবে চলে গেলে এই এলিমেন্ট আর DOM-এ থাকবে না
    const active = list.filter(function (r) { return r.Status !== 'Deleted'; });
    if (active.length === 0) {
      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এখনো কোনো তথ্য যোগ করা হয়নি।" data-en="No records added yet.">${t('এখনো কোনো তথ্য যোগ করা হয়নি।','No records added yet.')}</div>`;
      return;
    }

    const headCells = config.columns.map(function (c) { return `<th class="i18n" data-bn="${attr(c.label)}" data-en="${attr(bnToEn(c.label))}">${t(c.label, bnToEn(c.label))}</th>`; }).join('');
    const bodyRows = active.map(function (r) {
      const cells = config.columns.map(function (c) {
        let v = r[c.key];
        if (c.key === 'IsActive') v = isTrue(v) ? `<span class="badge active i18n" data-bn="সক্রিয়" data-en="Active">${t('সক্রিয়','Active')}</span>` : `<span class="badge inactive i18n" data-bn="নিষ্ক্রিয়" data-en="Inactive">${t('নিষ্ক্রিয়','Inactive')}</span>`;
        else if (c.key === 'OpeningBalance' || c.key === 'CreditLimit') v = formatAmountDrCr(v);
        else if (c.labels) v = escapeHtml(c.labels[v] || v || '');
        else if (fkMaps[c.key]) v = escapeHtml(v ? (fkMaps[c.key][v] || v) : '—');
        else v = escapeHtml(v);
        return '<td>' + v + '</td>';
      }).join('');
      return `<tr>${cells}<td class="row-actions">
        <button onclick='openMasterModal(${JSON.stringify(config.sheet)}, ${JSON.stringify(r).replace(/'/g,"&apos;")})' title="${t('সম্পাদনা','Edit')}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="m18.5 2.5 3 3L10 17l-4 1 1-4Z"/></svg>
        </button>
        <button onclick='deleteMasterRecord(${JSON.stringify(config.sheet)}, ${JSON.stringify(r[config.idField])})' title="${t('ডিলিট','Delete')}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
        </button>
      </td></tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}<th></th></tr></thead><tbody>${bodyRows}</tbody></table>`;
  }

  renderTable(records);
  document.getElementById('masterAddBtn').addEventListener('click', function () { openMasterModal(config.sheet, null); });

  // বর্তমান config-টা গ্লোবাল রেফারেন্সে রাখা হচ্ছে যাতে row বাটনের ইনলাইন onclick থেকে পাওয়া যায়
  window.__activeMasterConfig = config;
  window.__refreshMasterTable = async function () { renderTable(await api('list', { sheet: config.sheet })); };
}

async function openMasterModal(sheetName, record) {
  const config = window.__activeMasterConfig;
  const isEdit = !!record;

  // যেসব ফিল্ডে FK ড্রপডাউন লাগবে সেগুলোর ডেটা একসাথে (parallel) আনা হচ্ছে —
  // আগে একটার পর একটা আনা হতো, যা ফর্ম খুলতে ধীরগতির প্রধান কারণ ছিল।
  const fkFieldsList = config.fields.filter(function (f) { return f.type === 'select-fk'; });
  const uniqueFkSheets = Array.from(new Set(fkFieldsList.map(function (f) { return f.fkSheet; })));
  const fkSheetMap = await cachedListMultiple(uniqueFkSheets);
  const fkLists = {};
  fkFieldsList.forEach(function (f) { fkLists[f.key] = fkSheetMap[f.fkSheet]; });

  const rawBody = config.fields.map(function (f) {
    if (f.type === 'section') return `<div class="mf-sec">${escapeHtml(f.label)}</div>`;
    const currentVal = record ? record[f.key] : '';
    const inputId = 'mf_' + f.key;
    if (f.type === 'files') return mfFilesHtml(f, currentVal);

    if (f.type === 'select-enum') {
      const opts = f.options.map(function (o) { const ov = Array.isArray(o) ? o[0] : o, ol = Array.isArray(o) ? o[1] : o; return `<option value="${ov}" ${currentVal===ov?'selected':''}>${ol}</option>`; }).join('');
      return `<div class="field"><label>${f.label}</label><select id="${inputId}"><option value="">— বাছাই করুন —</option>${opts}</select></div>`;
    }
    if (f.type === 'select-fk') {
      const list = (fkLists[f.key] || []).slice().sort(f.sortField ? hrBySortOrder(f.fkLabel) : function () { return 0; }).filter(function (r) {
        if (r.Status === 'Deleted') return false;
        // self-referencing FK (যেমন Category-র ParentCategoryID) হলে নিজেকে নিজের প্যারেন্ট বানানো যাবে না
        if (isEdit && f.fkSheet === config.sheet && r[config.idField] === record[config.idField]) return false;
        return true;
      });
      const opts = list.map(function (r) {
        const idVal = r[f.fkIdField];
        return `<option value="${attr(idVal)}" ${currentVal===idVal?'selected':''}>${escapeHtml(r[f.fkLabel])}</option>`;
      }).join('');
      if (f.manage) return `<div class="field"><label>${f.label}</label>
        <div class="mf-manage"><select id="${inputId}"><option value="">— বাছাই করুন —</option>${opts}</select>
          <button type="button" class="mf-ic" data-mf-add="${f.key}" title="নতুন">➕</button><button type="button" class="mf-ic" data-mf-edit="${f.key}" title="এডিট">✏️</button>
          <button type="button" class="mf-ic" data-mf-del="${f.key}" title="ডিলিট">🗑</button><button type="button" class="mf-ic" data-mf-save="${f.key}" title="সেভ" disabled>💾</button></div>
        <div class="mf-inline" id="mfi_${f.key}"><input id="mfin_${f.key}" placeholder="নাম লিখে 💾 চাপুন"></div></div>`;
      return `<div class="field"><label>${f.label}</label><select id="${inputId}"><option value="">— নেই —</option>${opts}</select></div>`;
    }
    if (f.type === 'boolean') {
      return `<div class="field"><label>${f.label}</label><select id="${inputId}">
        <option value="TRUE" ${!record || isTrue(currentVal) ? 'selected' : ''}>সক্রিয়</option>
        <option value="FALSE" ${record && !isTrue(currentVal) ? 'selected' : ''}>নিষ্ক্রিয়</option></select></div>`;
    }
    if (f.type === 'number') {
      return `<div class="field"><label>${f.label}</label><input id="${inputId}" type="number" step="any" value="${attr(currentVal)}"></div>`;
    }
    if (f.type === 'amount-drcr') {
      return amountDrCrFieldHtml(inputId, f.label, currentVal);
    }
    if (f.type === 'date') {
      return `<div class="field"><label>${f.label}</label><input id="${inputId}" type="date" value="${attr(currentVal)}"></div>`;
    }
    return `<div class="field"><label>${f.label}</label><input id="${inputId}" value="${attr(currentVal)}"></div>`;
  });
  // পাশাপাশি দুই ঘর (half) জোড়া করে একটা সারিতে
  const parts = [];
  for (let i = 0; i < config.fields.length; i++) {
    if (config.fields[i].half && config.fields[i + 1] && config.fields[i + 1].half) { parts.push(`<div class="mf-half">${rawBody[i]}${rawBody[i + 1]}</div>`); i++; }
    else parts.push(rawBody[i]);
  }
  let bodyHtml;
  if (config.photo) {
    // ফর্মের ডান পাশে উপরে ছবির ঘর
    window.__mfPhoto = record ? (record[config.photo.key] || '') : '';
    const n = config.photo.beside || 2;
    bodyHtml = `<div class="mf-top"><div class="mf-top-left">${parts.slice(0, n).join('')}</div>
      <div class="mf-photo-wrap"><div class="mf-ph-title">${escapeHtml(config.photo.label || 'ছবি')}</div>
        <label class="mf-photo" id="mfPhotoBox" title="ছবি বাছাই করুন"><span id="mfPhotoInner">📷<small>ছবি দিন</small></span><input type="file" accept="image/*" id="mfPhotoInput"></label>
        <button type="button" class="mf-photo-rm" id="mfPhotoRm" style="display:none;">✕ সরান</button></div></div>` + parts.slice(n).join('');
  } else bodyHtml = parts.join('');
  bodyHtml = MF_EXTRA_CSS + bodyHtml;

  openModal({
    title: (isEdit ? 'সম্পাদনা — ' : 'নতুন — ') + config.titleBn,
    bodyHtml: bodyHtml,
    onSave: async function () {
      const data = {};
      config.fields.forEach(function (f) {
        if (f.type === 'section') return;
        if (f.type === 'files') { data[f.key] = (window.__mfFiles && window.__mfFiles[f.key]) || []; return; }
        if (f.type === 'section') return;
        let v = f.type === 'amount-drcr' ? readAmountDrCr('mf_' + f.key) : val('mf_' + f.key);
        // ঐচ্ছিক ড্রপডাউন (select-fk) খালি রাখলে "" এর বদলে null পাঠানো হচ্ছে —
        // কারণ ডেটাবেসের ফরেইন-কী কলাম "" মেনে নেয় না, শুধু আসল আইডি অথবা null মানে
        if (f.type === 'select-fk' && v === '') v = null;
        if (f.type === 'number' && v === '') v = null;
        if (f.type === 'date' && v === '') v = null;
        data[f.key] = v;
      });

      const missing = config.fields.filter(function (f) { return f.required && f.key && !data[f.key]; });
      if (missing.length > 0) throw new Error(missing.map(function(f){return f.label;}).join(', ') + ' আবশ্যক।');
      if (config.photo) data[config.photo.key] = window.__mfPhoto || null;
      if (config.validate) { const msg = config.validate(data); if (msg) throw new Error(msg); }

      if (isEdit) {
        await api('update', { sheet: config.sheet, idField: config.idField, idValue: record[config.idField], data: data });
      } else {
        const requiredFields = config.fields.filter(function (f) { return f.required; }).map(function (f) { return f.key; });
        await api('create', { sheet: config.sheet, idField: config.idField, idPrefix: config.idPrefix, requiredFields: requiredFields, data: data });
      }
      showToast('সেভ হয়েছে ✅', 'success');
      await window.__refreshMasterTable();
    }
  });
  mfSetupExtras(config);
}

/* ---------- কর্মচারীর ছবি (ফর্মের ডান পাশে উপরে) ---------- */
function mfShowPhoto(url) {
  const inner = document.getElementById('mfPhotoInner'), rm = document.getElementById('mfPhotoRm');
  if (!inner) return;
  inner.innerHTML = url ? `<img src="${attr(url)}" alt="">` : '📷<small>ছবি দিন</small>';
  if (url) inner.style.cssText = 'width:100%;height:100%;'; else inner.style.cssText = '';
  rm.style.display = url ? '' : 'none';
}
async function mfSetupPhoto(ph) {
  if (window.__mfPhoto) {
    const { data } = await supabaseClient.storage.from(ph.bucket).createSignedUrl(window.__mfPhoto, 3600);
    if (data && data.signedUrl) mfShowPhoto(data.signedUrl);
  }
  document.getElementById('mfPhotoInput').addEventListener('change', async function () {
    const file = this.files && this.files[0]; if (!file) return;
    if (!/^image\//.test(file.type)) { showToast('শুধু ছবি (JPG/PNG) দেওয়া যাবে।', 'error'); return; }
    if (file.size > 5 * 1024 * 1024) { showToast('ছবি ৫ MB-এর বেশি বড় হতে পারবে না।', 'error'); return; }
    mfShowPhoto(URL.createObjectURL(file));
    const path = 'Employees/photos/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '-' + file.name.replace(/[^A-Za-z0-9._-]/g, '_');
    const { error } = await supabaseClient.storage.from(ph.bucket).upload(path, file, { contentType: file.type, upsert: false });
    if (error) { showToast('ছবি আপলোড হয়নি — ' + error.message, 'error'); mfShowPhoto(''); return; }
    const old = window.__mfPhoto; window.__mfPhoto = path;
    if (old) supabaseClient.storage.from(ph.bucket).remove([old]);
    showToast('ছবি আপলোড হয়েছে — ফর্মটা সেভ করুন।', 'success');
  });
  document.getElementById('mfPhotoRm').addEventListener('click', async function () {
    if (!window.__mfPhoto || !confirm('ছবিটা সরাবেন?')) return;
    await supabaseClient.storage.from(ph.bucket).remove([window.__mfPhoto]);
    window.__mfPhoto = ''; mfShowPhoto(''); showToast('ছবি সরানো হয়েছে — ফর্মটা সেভ করুন।', 'success');
  });
}

/* ---------- মাস্টার ফর্মের বাড়তি অংশঃ ফাইল আপলোড ও ড্রপডাউনের পাশে যোগ/এডিট/ডিলিট ---------- */
const MF_EXTRA_CSS = `<style>
  .mf-sec{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;border-top:1px solid var(--border);padding-top:10px;margin:14px 0 8px;}
  .mf-half{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px;}
  .mf-manage{display:flex;gap:4px;align-items:center;} .mf-manage select{flex:1;min-width:0;}
  .mf-ic{width:34px;height:38px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;font-size:14px;flex-shrink:0;padding:0;}
  .mf-ic:disabled{opacity:.35;cursor:not-allowed;}
  .mf-inline{display:none;margin-top:6px;} .mf-inline.on{display:block;}
  .mf-files{border:1px dashed var(--border);border-radius:10px;padding:8px;}
  .mf-file{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px solid var(--border);font-size:12.5px;}
  .mf-file span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mf-file button{width:30px;height:28px;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;padding:0;}
  .mf-up{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:6px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:12.5px;background:var(--bg);}
  .mf-up input{display:none;}
  .mf-prog{font-size:11.5px;color:var(--text-muted);margin-top:4px;}
  .mf-top{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:0 14px;align-items:start;}
  .mf-photo-wrap{display:flex;flex-direction:column;align-items:center;}
  .mf-ph-title{align-self:flex-start;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);}
  .mf-photo{width:128px;height:150px;border:2px dashed var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;background:var(--bg);margin:0;}
  .mf-photo input{display:none;} .mf-photo img{width:100%;height:100%;object-fit:cover;}
  .mf-photo span{display:flex;flex-direction:column;align-items:center;font-size:26px;color:var(--text-muted);} .mf-photo small{font-size:11.5px;margin-top:4px;}
  .mf-photo-rm{margin-top:6px;border:1px solid var(--border);background:var(--surface);border-radius:6px;font-size:11.5px;padding:3px 10px;cursor:pointer;color:var(--danger);font-family:inherit;}
  @media (max-width:600px){ .mf-half{grid-template-columns:minmax(0,1fr);} .mf-top{grid-template-columns:minmax(0,1fr) 96px;gap:0 10px;} .mf-photo{width:96px;height:116px;} }
</style>`;
function mfParseFiles(v) {
  if (!v) return [];
  if (Array.isArray(v)) return v;
  try { const x = JSON.parse(v); return Array.isArray(x) ? x : []; } catch (e) { return []; }
}
function mfFilesHtml(f, currentVal) {
  window.__mfFiles = window.__mfFiles || {};
  window.__mfFiles[f.key] = mfParseFiles(currentVal);
  return `<div class="field"><label>${f.label}</label><div class="mf-files" id="mff_${f.key}"></div></div>`;
}
function mfRenderFiles(key) {
  const box = document.getElementById('mff_' + key); if (!box) return;
  const list = window.__mfFiles[key] || [];
  box.innerHTML = (list.length ? list.map(function (d, i) {
    return `<div class="mf-file">${/pdf/i.test(d.type || d.name) ? '📄' : '🖼'}<span title="${attr(d.name)}">${escapeHtml(d.name)}</span>
      <button type="button" data-mf-view="${key}|${i}" title="দেখুন">👁</button><button type="button" data-mf-rm="${key}|${i}" title="সরান">✕</button></div>`;
  }).join('') : '<div class="mf-prog">এখনো কোনো ডকুমেন্ট নেই।</div>') +
  `<label class="mf-up">📎 ডকুমেন্ট যোগ করুন<input type="file" multiple accept="image/*,application/pdf" data-mf-upload="${key}"></label><div class="mf-prog" id="mfp_${key}"></div>`;
}
function mfSetupExtras(config) {
  const body = document.getElementById('modalBody'); if (!body) return;
  if (config.photo) mfSetupPhoto(config.photo);
  config.fields.forEach(function (f) { if (f.type === 'files') mfRenderFiles(f.key); });
  const mode = {};
  body.addEventListener('change', async function (ev) {
    const el = ev.target;
    if (!el.dataset || !el.dataset.mfUpload) return;
    const key = el.dataset.mfUpload, f = config.fields.find(function (x) { return x.key === key; });
    const files = Array.prototype.slice.call(el.files || []);
    const prog = document.getElementById('mfp_' + key);
    let ok = 0;
    for (const file of files) {
      if (file.size > 10 * 1024 * 1024) { showToast(file.name + ' — ১০ MB-এর বেশি বড় ফাইল নেওয়া যাবে না।', 'error'); continue; }
      prog.textContent = file.name + ' আপলোড হচ্ছে…';
      const path = config.sheet + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '-' + file.name.replace(/[^A-Za-z0-9._-]/g, '_');
      const { error } = await supabaseClient.storage.from(f.bucket).upload(path, file, { contentType: file.type, upsert: false });
      if (error) { showToast('আপলোড হয়নি — ' + error.message, 'error'); continue; }
      window.__mfFiles[key].push({ name: file.name, path: path, type: file.type, size: file.size, uploadedAt: new Date().toISOString() });
      ok++;
    }
    mfRenderFiles(key);
    if (ok) showToast(ok + ' টা ডকুমেন্ট আপলোড হয়েছে — ফর্মটা সেভ করতে ভুলবেন না।', 'success');
  });
  body.addEventListener('click', async function (ev) {
    const b = ev.target.closest('button'); if (!b) return;
    const d = b.dataset;
    if (d.mfView) {
      const p = d.mfView.split('|'), f = config.fields.find(function (x) { return x.key === p[0]; }), doc = window.__mfFiles[p[0]][Number(p[1])];
      const win = window.open('', '_blank');
      const { data, error } = await supabaseClient.storage.from(f.bucket).createSignedUrl(doc.path, 3600);
      if (error) { if (win) win.close(); showToast(error.message, 'error'); return; }
      if (win) win.location = data.signedUrl; else window.location = data.signedUrl;
    } else if (d.mfRm) {
      const p = d.mfRm.split('|'), f = config.fields.find(function (x) { return x.key === p[0]; });
      if (!confirm('এই ডকুমেন্টটা সরাবেন?')) return;
      const doc = window.__mfFiles[p[0]].splice(Number(p[1]), 1)[0];
      if (doc) await supabaseClient.storage.from(f.bucket).remove([doc.path]);
      mfRenderFiles(p[0]); showToast('সরানো হয়েছে — ফর্মটা সেভ করুন।', 'success');
    } else if (d.mfAdd || d.mfEdit) {
      const key = d.mfAdd || d.mfEdit, sel = document.getElementById('mf_' + key);
      if (d.mfEdit && !sel.value) { showToast('এডিট করতে আগে একটা বাছাই করুন।', 'error'); return; }
      mode[key] = d.mfAdd ? 'add' : 'edit';
      document.getElementById('mfi_' + key).classList.add('on');
      const inp = document.getElementById('mfin_' + key); inp.value = d.mfEdit ? sel.options[sel.selectedIndex].text : ''; inp.focus();
      body.querySelector(`[data-mf-save="${key}"]`).disabled = false;
    } else if (d.mfSave) {
      const key = d.mfSave, f = config.fields.find(function (x) { return x.key === key; }), sel = document.getElementById('mf_' + key);
      const name = val('mfin_' + key).trim(); if (!name) { showToast('নাম লিখুন।', 'error'); return; }
      const row = {}; row[f.fkLabel] = name;
      try {
        if (mode[key] === 'add') {
          const cur = await cachedList(f.fkSheet);
          row.SortOrder = cur.reduce(function (m, r) { return Math.max(m, Number(r.SortOrder) || 0); }, 0) + 1;
          const { data, error } = await supabaseClient.from(tableFor(f.fkSheet)).insert(row).select();
          if (error) throw new Error(error.message);
          const o = document.createElement('option'); o.value = data[0][f.fkIdField]; o.textContent = name; sel.appendChild(o); sel.value = o.value;
        } else {
          const { error } = await supabaseClient.from(tableFor(f.fkSheet)).update(row).eq(f.fkIdField, sel.value);
          if (error) throw new Error(error.message);
          sel.options[sel.selectedIndex].text = name;
        }
        listCache = {}; mode[key] = '';
        document.getElementById('mfi_' + key).classList.remove('on'); b.disabled = true;
        showToast('সেভ হয়েছে ✅', 'success');
      } catch (err) { showToast(err.message, 'error'); }
    } else if (d.mfDel) {
      const key = d.mfDel, f = config.fields.find(function (x) { return x.key === key; }), sel = document.getElementById('mf_' + key);
      if (!sel.value) { showToast('ডিলিট করতে আগে একটা বাছাই করুন।', 'error'); return; }
      const used = (await api('list', { sheet: config.sheet })).filter(function (r) { return r.Status !== 'Deleted' && r[key] === sel.value; }).length;
      if (used) { showToast(used + ' টা রেকর্ডে এটা ব্যবহার হচ্ছে — আগে সেগুলো বদলান।', 'error'); return; }
      if (!confirm('"' + sel.options[sel.selectedIndex].text + '" ডিলিট করবেন?')) return;
      const { error } = await supabaseClient.from(tableFor(f.fkSheet)).update({ Status: 'Deleted' }).eq(f.fkIdField, sel.value);
      if (error) { showToast(error.message, 'error'); return; }
      sel.remove(sel.selectedIndex); sel.value = ''; listCache = {};
      showToast('ডিলিট হয়েছে ✅', 'success');
    }
  });
}


async function deleteMasterRecord(sheetName, idValue) {
  const config = window.__activeMasterConfig;
  if (!confirm('আপনি কি নিশ্চিত এটা ডিলিট করতে চান?')) return;
  try {
    await api('delete', { sheet: config.sheet, idField: config.idField, idValue: idValue });
    showToast('ডিলিট হয়েছে ✅', 'success');
    await window.__refreshMasterTable();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

   ১২.৪) আইটেম মাস্টার — কাস্টম কার্ড (কোড/গ্রুপ/ক্যাটাগরি/একক/ডেসিমাল/

/* ============================================================
   আইটেম মাস্টার — স্টক ওভারভিউর মতোঃ পরিমাণ (কেজি | পিস) · দর (কেজি | পিস) · মূল্য
   • দরঃ সর্বশেষ পোস্ট করা প্রসেসিং (ফিনিশড গুডসের দর) → পোস্ট করা ক্রয়ের গড় → স্ট্যান্ডার্ড কস্ট;
     একটা দর না থাকলে গড় ওজন (কেজি ÷ পিস) দিয়ে অন্যটা
   • মূল্য = মূল এককের পরিমাণ × মূল এককের দর (স্টক ওভারভিউর মতোই — দুই জায়গায় একই মূল্য)
   • হেডার ও নামের কলাম স্থির; চিকন সারি; খোঁজার ঘর; মোবাইলে মসৃণ; 👁️ দেখুন · ✏️ এডিট · 🗑️ ডিলিট
   ============================================================ */
async function itemMasterRates(items, units) {
  const safe = async function (q) { try { const r = await q; return (r && !r.error && r.data) || []; } catch (e) { return []; } };
  const [fg, pv, pil, pih] = await Promise.all([
    safe(supabaseClient.from('ProcessingFG_Lines').select('*')), safe(supabaseClient.from('ProcessingVoucher').select('ProcessingID,Date,Status')),
    safe(supabaseClient.from('PI_Lines').select('*')), safe(supabaseClient.from('PurchaseInvoice').select('PIID,InvoiceDate,Status'))]);
  const itemMap = {}; items.forEach(function (i) { itemMap[i.ItemID] = i; });
  const pvMap = {}; pv.forEach(function (h) { pvMap[h.ProcessingID] = h; });
  const piMap = {}; pih.forEach(function (h) { piMap[h.PIID] = h; });
  const rates = {};
  fg.filter(function (l) { const h = pvMap[l.ProcessingID]; return h && h.Status === 'Posted'; })
    .sort(function (a, b) { return String(pvMap[a.ProcessingID].Date).localeCompare(String(pvMap[b.ProcessingID].Date)); })
    .forEach(function (l) { rates[l.ItemID] = { kg: Number(l.RatePerKg) || 0, pc: Number(l.RatePerPc) || 0, src: t('প্রসেসিং', 'processing') }; });
  const acc = {};   // পোস্ট করা ক্রয়ের গড় দর (মূল এককে)
  pil.forEach(function (l) {
    const h = piMap[l.PIID]; if (!h || h.Status !== 'Posted' || !(Number(l.Quantity) > 0) || rates[l.ItemID]) return;
    const val = (l.NetAmount !== null && l.NetAmount !== undefined && l.NetAmount !== '') ? Number(l.NetAmount) : (Number(l.Amount) || Number(l.Quantity) * (Number(l.Rate) || 0));
    const a = acc[l.ItemID] = acc[l.ItemID] || { q: 0, v: 0 }; a.q += Number(l.Quantity); a.v += Number(val) || 0;
  });
  Object.keys(acc).forEach(function (id) {
    if (rates[id] || !(acc[id].q > 0)) return;
    const r = acc[id].v / acc[id].q, piece = isPieceUOM((itemMap[id] || {}).UOMID, units);
    rates[id] = { kg: piece ? 0 : r, pc: piece ? r : 0, src: t('ক্রয়ের গড়', 'purchase average') };
  });
  items.forEach(function (i) {
    if (rates[i.ItemID]) return;
    const piece = isPieceUOM(i.UOMID, units), sc = Number(i.StandardCost) || 0;
    rates[i.ItemID] = { kg: piece ? 0 : sc, pc: piece ? sc : 0, src: t('স্ট্যান্ডার্ড কস্ট', 'standard cost') };
  });
  return rates;
}

async function renderItemMasterPage(content) {

    const groupMap = {}; groups.forEach(function (g) { groupMap[g.GroupID] = g.GroupName; });

    const unitMap = {}; units.forEach(function (u) { unitMap[u.UOMID] = u; });
    const whMap = {}; warehouses.forEach(function (w) { whMap[w.WarehouseID] = w.WarehouseName; });
    const wrap = document.getElementById('itemTableWrap');
    if (!wrap) return;   // এই ফাঁকে অন্য পেজে চলে গেলে

    const rates = await itemMasterRates(active, units);

      const its = stock.filter(function (s) { return s.ItemID === r.ItemID; });

        const kg = s ? (Number(s.QtyOnHand) || 0) : 0, pc = s ? (Number(s.QtyPieces) || 0) : 0;
        const base = rates[r.ItemID] || { kg: 0, pc: 0, src: '' }, rt = { kg: base.kg, pc: base.pc, src: base.src };
        const avg = (kg > 0 && pc > 0) ? kg / pc : 0;
        if (!rt.kg && rt.pc && avg) rt.kg = rt.pc / avg;
        if (!rt.pc && rt.kg && avg) rt.pc = rt.kg * avg;
        const value = piece ? (pc && rt.pc ? pc * rt.pc : kg * rt.kg) : (kg && rt.kg ? kg * rt.kg : pc * rt.pc);
        rowsData.push({ r: r, s: s, piece: piece, unit: unit ? unit.UOMName : '', wh: s ? (whMap[s.WarehouseID] || s.WarehouseID) : '', kg: kg, pc: pc, rt: rt, value: value,
          group: groupMap[r.GroupID] || '', cat: catMap[r.CategoryID] || '' });
      });
    });
    renderTable();
  }

  function renderTable() {
    const wrap = document.getElementById('itemTableWrap'); if (!wrap) return;
    const qy = String((document.getElementById('imSearch') || {}).value || '').trim().toLowerCase();
    const list = !qy ? rowsData : rowsData.filter(function (x) { return [x.r.ItemID, x.r.ItemName, x.group, x.cat, x.wh, x.unit].some(function (v) { return String(v || '').toLowerCase().indexOf(qy) !== -1; }); });
    const itemsShown = new Set(list.map(function (x) { return x.r.ItemID; })).size;
    document.getElementById('imCount').textContent = t('মোট ', 'Total ') + itemsShown + t('টা আইটেম', ' items') + (qy ? t(' (খোঁজা)', ' (filtered)') : '');
    if (!list.length) { wrap.innerHTML = `<div class="empty-state">${t('এই খোঁজায় কোনো আইটেম নেই।', 'No items match.')}</div>`; return; }
    const q3 = function (x) { return Math.abs(x) < 0.0005 ? '—' : (+x.toFixed(3)).toLocaleString('en-IN', { maximumFractionDigits: 3 }); };
    const m2 = function (x) { return x ? x.toFixed(2) : '—'; };
    let tKg = 0, tPc = 0, tVal = 0, vk = 0, kgPos = 0, vp = 0, pcPos = 0;
    const body = list.map(function (x) {
      tKg += x.kg; tPc += x.pc; tVal += x.value;
      const known = Math.abs(x.value) > 0.005;
      if (x.kg > 0.0005 && known) { vk += x.value; kgPos += x.kg; } if (x.pc > 0.0005 && known) { vp += x.value; pcPos += x.pc; }
      const neg = function (v) { return v < -0.0005 ? 'neg' : ''; };
      const statusCell = isTrue(x.r.IsActive) ? `<span class="badge active">${t('সক্রিয়','Active')}</span>` : `<span class="badge inactive">${t('নিষ্ক্রিয়','Inactive')}</span>`;
      const ic = function (act, icon, title, dis) { return `<button type="button" class="im-ic" data-im="${act}" data-id="${attr(x.r.ItemID)}" data-wh="${attr(x.s ? x.s.WarehouseID : '')}" title="${attr(title)}" ${dis ? 'disabled' : ''}>${icon}</button>`; };
      return `<tr>

        <td class="fz">${escapeHtml(x.r.ItemName)}<div class="im-show-m"><small>${escapeHtml(x.cat || '')}</small></div></td>
        <td class="im-hide-m">${escapeHtml(x.group || '—')}</td><td class="im-hide-m">${escapeHtml(x.cat || '—')}</td>
        <td>${escapeHtml(x.unit)}</td><td>${escapeHtml(x.wh || '—')}</td>
        <td class="r gq gstart ${!x.piece ? 'mu' : ''} ${neg(x.kg)}">${q3(x.kg)}</td><td class="r gq gend ${x.piece ? 'mu' : ''} ${neg(x.pc)}">${q3(x.pc)}</td>
        <td class="r gr" title="${attr(t('দরের উৎসঃ ', 'Rate from: ') + x.rt.src)}">${m2(x.rt.kg)}</td><td class="r gr gend" title="${attr(t('দরের উৎসঃ ', 'Rate from: ') + x.rt.src)}">${m2(x.rt.pc)}</td>
        <td class="r"><b>${x.value ? x.value.toFixed(2) : '0.00'}</b></td>
        <td>${statusCell}</td>
        <td style="white-space:nowrap;">${ic('view', '👁️', t('এই আইটেমের ভাউচার — স্টক কার্ড', 'Vouchers of this item'), !x.s)}${ic('edit', '✏️', t('এডিট', 'Edit'))}${ic('del', '🗑️', t('ডিলিট', 'Delete'))}</td>

    }).join('');
    const rk = kgPos > 0 ? vk / kgPos : 0, rp = pcPos > 0 ? vp / pcPos : 0;
    wrap.innerHTML = `<table class="data-table im-tbl"><thead>

        <td class="r gstart">${q3(tKg)}</td><td class="r gend">${q3(tPc)}</td><td class="r">${m2(rk)}</td><td class="r gend">${m2(rp)}</td><td class="r">${tVal.toFixed(2)}</td><td></td><td></td></tr></tfoot></table>`;
    // দ্বিতীয় হেডার-সারি ঠিক প্রথমটার নিচে (আসল উচ্চতা মেপে)

  }
  // দ্বিতীয় হেডার-সারি (কেজি/পিস) ঠিক প্রথম সারির নিচে — প্রথম সারির আসল উচ্চতা মেপে; পেজ তখনো না দেখা গেলে পরে আবার
  function fitImHead() {

    } catch (err) { showToast(err.message, 'error'); }
  });

async function deleteItemRecord(itemId) {
  if (!confirm(t('আপনি কি নিশ্চিত এই আইটেম ডিলিট করতে চান?','Are you sure you want to delete this item?'))) return;
  try {
    await api('delete', { sheet:'Items', idField:'ItemID', idValue: itemId });
    showToast(t('ডিলিট হয়েছে ✅','Deleted ✅'), 'success');
    if (window.__refreshItemList) await window.__refreshItemList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function openItemForm(existing) {
  const itemFormData = await cachedListMultiple(['ItemGroups', 'Categories', 'UOM', 'Warehouses']);
  const groups = itemFormData.ItemGroups.filter(function (g) { return g.Status !== 'Deleted'; });
  const categories = itemFormData.Categories.filter(function (c) { return c.Status !== 'Deleted'; });
  const units = itemFormData.UOM.filter(function (u) { return u.Status !== 'Deleted'; });
  const warehouses = itemFormData.Warehouses.filter(function (w) { return w.Status !== 'Deleted'; });
  window.__itemFormUnits = units;

  const isEdit = !!existing;
  let rec = existing || {};
  let currentItemId = isEdit ? rec.ItemID : null; // নতুন আইটেম হলে সেকশন ১ সেভ হওয়ার আগ পর্যন্ত এটা খালি থাকে

  // ক্রম — শুধু তথ্যের জন্য, তালিকায় এই আইটেমের অবস্থান কত নম্বরে সেটা দেখানো
  let serialNo = t('নতুন','New');
  if (isEdit) {
    try {
      const allItems = await api('list', { sheet:'Items' });
      const activeItems = allItems.filter(function (i) { return i.Status !== 'Deleted'; });
      const idx = activeItems.findIndex(function (i) { return i.ItemID === rec.ItemID; });
      if (idx >= 0) serialNo = String(idx + 1);
    } catch (e) {}
  }

  function opts(list, idF, labelF, selected) {
    return '<option value="">—</option>' + list.map(function (x) { return `<option value="${attr(x[idF])}" ${selected===x[idF]?'selected':''}>${escapeHtml(x[labelF])}</option>`; }).join('');
  }

  const bodyHtml = `
    <!-- ========== সেকশন ১ — মূল তথ্য ========== -->
    <div style="border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;">
      <h4 style="margin:0 0 12px;font-size:13px;color:var(--text-muted);text-transform:uppercase;">${t('১) মূল তথ্য','1) Basic Info')}</h4>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div class="field"><label>${t('ক্রম','Serial No')}</label><input id="it_Serial" value="${attr(serialNo)}" readonly style="background:var(--bg);"></div>
        <div class="field"><label>${t('কোড','Code')}</label><input id="it_Code" value="${isEdit ? attr(rec.ItemID) : t('সেভ করলে তৈরি হবে','Generated on save')}" readonly style="background:var(--bg);"></div>
        <div class="field"><label>${t('নাম','Name')}</label><input id="it_ItemName" value="${attr(rec.ItemName)}"></div>
        <div class="field"><label>${t('গ্রুপ','Group')}</label><select id="it_GroupID">${opts(groups, 'GroupID', 'GroupName', rec.GroupID)}</select></div>
        <div class="field"><label>${t('ক্যাটাগরি','Category')}</label><select id="it_CategoryID">${opts(categories, 'CategoryID', 'CategoryName', rec.CategoryID)}</select></div>
        <div class="field"><label>${t('একক','Unit')}</label><select id="it_UOMID" onchange="updateItemUnitEcho()">${opts(units, 'UOMID', 'UOMName', rec.UOMID)}</select>
          <p style="font-size:11px;color:var(--text-muted);margin:4px 0 0;">${t('এই আইটেমের ক্রয়, স্টক ও বিক্রয় — সবকিছু এই একক অনুযায়ীই হবে।','This item will be purchased, stocked, and sold entirely in this one unit.')}</p>
        </div>
        <div class="field"><label>${t('অবস্থা','Status')}</label><select id="it_IsActive">
            <option value="TRUE" ${!isEdit || isTrue(rec.IsActive) ? 'selected' : ''}>${t('সক্রিয়','Active')}</option>
            <option value="FALSE" ${isEdit && !isTrue(rec.IsActive) ? 'selected' : ''}>${t('নিষ্ক্রিয়','Inactive')}</option>
          </select></div>
      </div>
      <button type="button" class="btn btn-primary" style="width:auto;margin-top:12px;" id="it_SaveSection1">${t('মূল তথ্য সেভ করুন','Save Basic Info')}</button>
      <span id="it_Section1Status" style="margin-left:10px;font-size:12px;color:var(--success);"></span>
    </div>

    <!-- ========== সেকশন ২ — প্রারম্ভিক মজুদ ========== -->
    <div id="it_Section2" style="border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;${currentItemId?'':'opacity:.5;'}">
      <h4 style="margin:0 0 12px;font-size:13px;color:var(--text-muted);text-transform:uppercase;">${t('২) প্রারম্ভিক মজুদ বিবরণী','2) Opening Stock Details')}</h4>
      ${!currentItemId ? `<p style="font-size:12px;color:var(--text-muted);margin:0 0 10px;">${t('প্রথমে "মূল তথ্য" সেভ করুন — তারপর এই সেকশন ব্যবহার করা যাবে।','Save "Basic Info" first — then this section unlocks.')}</p>` : ''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div class="field"><label>${t('গ্রুপ','Group')}</label><input id="it_Op_GroupEcho" readonly style="background:var(--bg);"></div>
        <div class="field"><label>${t('ক্যাটাগরি','Category')}</label><input id="it_Op_CatEcho" readonly style="background:var(--bg);"></div>
        <div class="field"><label>${t('পণ্য','Item')}</label><input id="it_Op_ItemEcho" readonly style="background:var(--bg);"></div>
        <div class="field"><label>${t('ওয়ারহাউজ','Warehouse')}</label><select id="it_Op_WarehouseID" ${currentItemId?'':'disabled'}>${opts(warehouses, 'WarehouseID', 'WarehouseName', '')}</select></div>
        <div class="field"><label>${t('পরিমাণ','Quantity')}</label><input id="it_Op_Qty" type="number" step="any" ${currentItemId?'':'disabled'}></div>
        <div class="field"><label>${t('একক','Unit')}</label><input id="it_Op_UnitEcho" readonly style="background:var(--bg);"></div>
        <div class="field"><label>${t('দর','Rate')}</label><input id="it_Op_Rate" type="number" step="any" ${currentItemId?'':'disabled'}></div>
        <div class="field"><label>${t('মূল্য','Value')}</label><input id="it_Op_Value" readonly style="background:var(--bg);font-weight:600;"></div>
      </div>
      <button type="button" class="btn btn-primary" style="width:auto;margin-top:12px;" id="it_SaveSection2" ${currentItemId?'':'disabled'}>${t('প্রারম্ভিক মজুদ সেভ করুন','Save Opening Stock')}</button>
      <span id="it_Section2Status" style="margin-left:10px;font-size:12px;color:var(--success);"></span>
    </div>

    <!-- ========== সেকশন ৩ — আদর্শ ক্রয় দর ========== -->
    <div id="it_Section3" style="border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;${currentItemId?'':'opacity:.5;'}">
      <h4 style="margin:0 0 12px;font-size:13px;color:var(--text-muted);text-transform:uppercase;">${t('৩) আদর্শ ক্রয় দর','3) Standard Purchase Rate')}</h4>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;">
        <div class="field"><label>${t('দর','Rate')}</label><input id="it_StdPurchaseRate" type="number" step="any" value="${attr(rec.StandardCost)}" ${currentItemId?'':'disabled'}></div>
        <div class="field"><label>${t('একক','Unit')}</label><input id="it_StdPurchaseUnitEcho" readonly style="background:var(--bg);"></div>
        <div class="field"><label>${t('তারিখ','Date')}</label><input type="date" id="it_StdPurchaseDate" value="${attr(rec.StandardCostDate) || new Date().toISOString().slice(0,10)}" ${currentItemId?'':'disabled'}></div>
      </div>
      <button type="button" class="btn btn-primary" style="width:auto;margin-top:12px;" id="it_SaveSection3" ${currentItemId?'':'disabled'}>${t('ক্রয় দর সেভ করুন','Save Purchase Rate')}</button>
      <span id="it_Section3Status" style="margin-left:10px;font-size:12px;color:var(--success);"></span>

    <!-- ========== সেকশন ৪ — আদর্শ বিক্রয় দর ========== -->
    <div id="it_Section4" style="border:1px solid var(--border);border-radius:10px;padding:16px;${currentItemId?'':'opacity:.5;'}">
      <h4 style="margin:0 0 12px;font-size:13px;color:var(--text-muted);text-transform:uppercase;">${t('৪) আদর্শ বিক্রয় দর','4) Standard Sales Rate')}</h4>

        <div class="field"><label>${t('দর','Rate')}</label><input id="it_StdSalesRate" type="number" step="any" value="${attr(rec.SalesPrice)}" ${currentItemId?'':'disabled'}></div>
        <div class="field"><label>${t('একক','Unit')}</label><input id="it_StdSalesUnitEcho" readonly style="background:var(--bg);"></div>
        <div class="field"><label>${t('তারিখ','Date')}</label><input type="date" id="it_StdSalesDate" value="${attr(rec.SalesPriceDate) || new Date().toISOString().slice(0,10)}" ${currentItemId?'':'disabled'}></div>
      </div>
      <button type="button" class="btn btn-primary" style="width:auto;margin-top:12px;" id="it_SaveSection4" ${currentItemId?'':'disabled'}>${t('বিক্রয় দর সেভ করুন','Save Sales Rate')}</button>
      <span id="it_Section4Status" style="margin-left:10px;font-size:12px;color:var(--success);"></span>
    </div>
  `;

  openModal({
    title: (isEdit ? t('সম্পাদনা — ','Edit — ') : t('নতুন — ','New — ')) + t('আইটেম','Item'),
    bodyHtml: bodyHtml,
    wide: true,
    onSave: null
  });
  // এই ফর্মের প্রতিটা সেকশনের নিজস্ব সেভ বাটন আছে, তাই মোডালের সাধারণ
  // "সেভ করুন" বাটনটা এখানে লুকিয়ে রাখা হচ্ছে (দরকার নেই)
  const globalSaveBtn = document.getElementById('modalSaveBtn');
  if (globalSaveBtn) globalSaveBtn.style.display = 'none';
  document.getElementById('modalCloseBtn').addEventListener('click', function () { if (globalSaveBtn) globalSaveBtn.style.display = ''; }, { once: true });
  document.getElementById('modalCancelBtn').addEventListener('click', function () { if (globalSaveBtn) globalSaveBtn.style.display = ''; }, { once: true });

  function refreshUnitEchoes() {
    const uomId = val('it_UOMID');
    const unit = window.__itemFormUnits.find(function (u) { return u.UOMID === uomId; });
    const label = unit ? unit.UOMName : '—';
    ['it_StdPurchaseUnitEcho', 'it_StdSalesUnitEcho', 'it_Op_UnitEcho'].forEach(function (id) {
      const el = document.getElementById(id);
      if (el) el.value = label;
    });
    refreshOpeningEchoes();
  }
  window.updateItemUnitEcho = refreshUnitEchoes;

  function refreshOpeningEchoes() {
    const groupSel = document.getElementById('it_GroupID');
    const catSel = document.getElementById('it_CategoryID');
    const nameInput = document.getElementById('it_ItemName');
    document.getElementById('it_Op_GroupEcho').value = groupSel.options[groupSel.selectedIndex] ? groupSel.options[groupSel.selectedIndex].text : '';
    document.getElementById('it_Op_CatEcho').value = catSel.options[catSel.selectedIndex] ? catSel.options[catSel.selectedIndex].text : '';
    document.getElementById('it_Op_ItemEcho').value = nameInput.value;
  }
  document.getElementById('it_GroupID').addEventListener('change', refreshOpeningEchoes);
  document.getElementById('it_CategoryID').addEventListener('change', refreshOpeningEchoes);
  document.getElementById('it_ItemName').addEventListener('input', refreshOpeningEchoes);
  refreshUnitEchoes();

  function recalcOpeningValue() {
    const qty = Number(val('it_Op_Qty')) || 0;
    const rate = Number(val('it_Op_Rate')) || 0;
    document.getElementById('it_Op_Value').value = (qty * rate).toFixed(2);
  }
  document.getElementById('it_Op_Qty').addEventListener('input', recalcOpeningValue);
  document.getElementById('it_Op_Rate').addEventListener('input', recalcOpeningValue);

  function unlockSections() {
    ['it_Section2', 'it_Section3', 'it_Section4'].forEach(function (id) { document.getElementById(id).style.opacity = '1'; });
    document.getElementById('it_Op_WarehouseID').disabled = false;
    document.getElementById('it_Op_Qty').disabled = false;
    document.getElementById('it_Op_Rate').disabled = false;
    document.getElementById('it_SaveSection2').disabled = false;
    document.getElementById('it_StdPurchaseRate').disabled = false;
    document.getElementById('it_StdPurchaseDate').disabled = false;
    document.getElementById('it_SaveSection3').disabled = false;
    document.getElementById('it_StdSalesRate').disabled = false;
    document.getElementById('it_StdSalesDate').disabled = false;
    document.getElementById('it_SaveSection4').disabled = false;
    const p2 = document.querySelector('#it_Section2 p');
    if (p2) p2.remove();
  }

  // ---- সেকশন ১: মূল তথ্য সেভ ----
  document.getElementById('it_SaveSection1').addEventListener('click', async function () {
    const btn = this; const statusEl = document.getElementById('it_Section1Status');
    const name = val('it_ItemName');
    if (!name) { showToast(t('নাম আবশ্যক।','Name is required.'), 'error'); return; }
    btn.disabled = true; statusEl.textContent = t('সেভ হচ্ছে...','Saving...');
    try {
      const data = {
        ItemName: name, GroupID: val('it_GroupID') || null, CategoryID: val('it_CategoryID') || null,
        UOMID: val('it_UOMID') || null, IsActive: val('it_IsActive')
      };
      let saved;
      if (currentItemId) {
        saved = await api('update', { sheet:'Items', idField:'ItemID', idValue: currentItemId, data: data });
      } else {
        saved = await api('create', { sheet:'Items', idField:'ItemID', idPrefix:'ITM', requiredFields:['ItemName'], data: data });
        currentItemId = saved.ItemID;
        document.getElementById('it_Code').value = currentItemId;
        unlockSections();
      }
      refreshOpeningEchoes();
      statusEl.textContent = '✓ ' + t('সেভ হয়েছে','Saved');
      if (window.__refreshItemList) await window.__refreshItemList();
    } catch (err) {
      showToast(err.message, 'error');
      statusEl.textContent = '';
    } finally {
      btn.disabled = false;
    }
  });

  // ---- সেকশন ২: প্রারম্ভিক মজুদ সেভ ----
  document.getElementById('it_SaveSection2').addEventListener('click', async function () {
    if (!currentItemId) { showToast(t('প্রথমে মূল তথ্য সেভ করুন।','Save Basic Info first.'), 'error'); return; }
    const btn = this; const statusEl = document.getElementById('it_Section2Status');
    const warehouseId = val('it_Op_WarehouseID');
    const qty = Number(val('it_Op_Qty')) || 0;
    if (!warehouseId) { showToast(t('গুদাম বাছাই করুন।','Select a warehouse.'), 'error'); return; }
    if (qty <= 0) { showToast(t('পরিমাণ দিন।','Enter a quantity.'), 'error'); return; }
    btn.disabled = true; statusEl.textContent = t('সেভ হচ্ছে...','Saving...');
    try {
      await api('postOpeningStock', { itemId: currentItemId, warehouseId: warehouseId, quantity: qty });
      statusEl.textContent = '✓ ' + t('সেভ হয়েছে','Saved');
      showToast(t('প্রারম্ভিক মজুদ যোগ হয়েছে ✅','Opening stock added ✅'), 'success');
    } catch (err) {
      showToast(err.message, 'error');
      statusEl.textContent = '';
    } finally {
      btn.disabled = false;
    }
  });

  // ---- সেকশন ৩: আদর্শ ক্রয় দর সেভ ----
  document.getElementById('it_SaveSection3').addEventListener('click', async function () {
    if (!currentItemId) { showToast(t('প্রথমে মূল তথ্য সেভ করুন।','Save Basic Info first.'), 'error'); return; }
    const btn = this; const statusEl = document.getElementById('it_Section3Status');
    btn.disabled = true; statusEl.textContent = t('সেভ হচ্ছে...','Saving...');
    try {
      await api('update', { sheet:'Items', idField:'ItemID', idValue: currentItemId, data: {
        StandardCost: val('it_StdPurchaseRate') === '' ? 0 : val('it_StdPurchaseRate'),
        StandardCostDate: val('it_StdPurchaseDate') || null
      }});
      statusEl.textContent = '✓ ' + t('সেভ হয়েছে','Saved');
      showToast(t('ক্রয় দর সেভ হয়েছে ✅','Purchase rate saved ✅'), 'success');
      if (window.__refreshItemList) await window.__refreshItemList();
    } catch (err) {
      showToast(err.message, 'error');
      statusEl.textContent = '';
    } finally {
      btn.disabled = false;
    }
  });

  // ---- সেকশন ৪: আদর্শ বিক্রয় দর সেভ ----
  document.getElementById('it_SaveSection4').addEventListener('click', async function () {
    if (!currentItemId) { showToast(t('প্রথমে মূল তথ্য সেভ করুন।','Save Basic Info first.'), 'error'); return; }
    const btn = this; const statusEl = document.getElementById('it_Section4Status');
    btn.disabled = true; statusEl.textContent = t('সেভ হচ্ছে...','Saving...');
    try {
      await api('update', { sheet:'Items', idField:'ItemID', idValue: currentItemId, data: {
        SalesPrice: val('it_StdSalesRate') === '' ? 0 : val('it_StdSalesRate'),
        SalesPriceDate: val('it_StdSalesDate') || null
      }});
      statusEl.textContent = '✓ ' + t('সেভ হয়েছে','Saved');
      showToast(t('বিক্রয় দর সেভ হয়েছে ✅','Sales rate saved ✅'), 'success');
      if (window.__refreshItemList) await window.__refreshItemList();
    } catch (err) {
      showToast(err.message, 'error');
      statusEl.textContent = '';
    } finally {
      btn.disabled = false;
    }
  });
}


/* ============================================================
   ১২.৫) পার্টি (Party) ফর্ম — Supplier/Customer একসাথে
   ============================================================ */
/**
 * প্রতিটা পার্টি (ব্যক্তি/প্রতিষ্ঠান) স্বয়ংক্রিয়ভাবেই সাপ্লায়ার ও
 * কাস্টমার — দুটো হিসেবেই ব্যবহারযোগ্য হয় (একবার এন্ট্রি দিলেই
 * Suppliers ও Customers দুই Sheet-এ একই Code দিয়ে সেভ হয়)। তাই
 * আলাদা করে টিক দেওয়ার দরকার নেই — Purchase-এ তাকে সাপ্লায়ার
 * হিসেবে, Sales-এ কাস্টমার হিসেবে সরাসরি বাছাই করা যাবে।
 */

async function renderPartyMasterPage(content) {
  content.innerHTML = `
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="পার্টি (সাপ্লায়ার / কাস্টমার)" data-en="Party (Supplier / Customer)">${t('পার্টি (সাপ্লায়ার / কাস্টমার)','Party (Supplier / Customer)')}</h1>
        <p class="i18n" data-bn="একই ব্যক্তি বা প্রতিষ্ঠান থেকে ক্রয় ও তার কাছে বিক্রয় — দুটোই করা যাবে" data-en="Buy from and sell to the same person or business — both work">${t('একই ব্যক্তি বা প্রতিষ্ঠান থেকে ক্রয় ও তার কাছে বিক্রয় — দুটোই করা যাবে','Buy from and sell to the same person or business — both work')}</p>
      </div>
      <button class="btn btn-primary i18n" style="width:auto;" id="partyAddBtn" data-bn="+ নতুন পার্টি" data-en="+ New Party">${t('+ নতুন পার্টি','+ New Party')}</button></div>
    <div class="panel"><div id="partyListWrap"></div></div>`;

  async function loadPartyList() {
    const [suppliers, customers] = await Promise.all([api('list', { sheet:'Suppliers' }), api('list', { sheet:'Customers' })]);
    const map = {};
    function upsert(rec) {
      const key = rec.Code || rec.SupplierID || rec.CustomerID;
      if (!key) return;
      if (!map[key]) map[key] = { Code:key, Name:rec.Name, CompanyName:rec.CompanyName, Phone:rec.Phone, Zone:rec.Zone, Active:false };
      if (!map[key].Name && rec.Name) map[key].Name = rec.Name;
      if (!map[key].CompanyName && rec.CompanyName) map[key].CompanyName = rec.CompanyName;
      if (isTrue(rec.IsActive)) map[key].Active = true;
    }
    suppliers.filter(function (s) { return s.Status !== 'Deleted'; }).forEach(upsert);
    customers.filter(function (c) { return c.Status !== 'Deleted'; }).forEach(upsert);

    const rows = Object.values(map);
    const wrap = document.getElementById('partyListWrap');
    if (!wrap) return; // ব্যবহারকারী এই ফাঁকে অন্য পেজ/ট্যাবে চলে গেলে এই এলিমেন্ট আর DOM-এ থাকবে না
    if (rows.length === 0) {
      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এখনো কোনো পার্টি যোগ করা হয়নি।" data-en="No parties added yet.">${t('এখনো কোনো পার্টি যোগ করা হয়নি।','No parties added yet.')}</div>`;
      return;
    }

    const headers = [
      ['কোড','Code'], ['প্রোপ্রাইটর','Proprietor'], ['ব্যবসার নাম','Business Name'],
      ['ফোন','Phone'], ['জোন','Zone'], ['অবস্থা','Status']
    ];
    const headCells = headers.map(function (h) { return `<th class="i18n" data-bn="${h[0]}" data-en="${h[1]}">${t(h[0], h[1])}</th>`; }).join('');

    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}<th></th></tr></thead><tbody>
      ${rows.map(function (r) {
        return `<tr>
          <td>${escapeHtml(r.Code)}</td><td>${escapeHtml(r.Name)}</td><td>${escapeHtml(r.CompanyName)}</td>
          <td>${escapeHtml(r.Phone)}</td><td>${escapeHtml(r.Zone)}</td>
          <td><span class="badge ${r.Active?'active':'inactive'} i18n" data-bn="${r.Active?'সক্রিয়':'নিষ্ক্রিয়'}" data-en="${r.Active?'Active':'Inactive'}">${t(r.Active?'সক্রিয়':'নিষ্ক্রিয়', r.Active?'Active':'Inactive')}</span></td>
          <td class="row-actions"><button onclick='openPartyForm(${JSON.stringify(r.Code)})' title="${t('সম্পাদনা','Edit')}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="m18.5 2.5 3 3L10 17l-4 1 1-4Z"/></svg>
          </button></td>
        </tr>`;
      }).join('')}
    </tbody></table>`;
  }

  await loadPartyList();
  window.__refreshPartyList = loadPartyList;
  document.getElementById('partyAddBtn').addEventListener('click', function () { openPartyForm(null); });
}

async function openPartyForm(existingCode) {
  let supplierRec = null, customerRec = null;
  const zonesPromise = api('list', { sheet: 'Zones' });
  if (existingCode) {
    const [suppliers, customers] = await Promise.all([api('list', { sheet:'Suppliers' }), api('list', { sheet:'Customers' })]);
    supplierRec = suppliers.find(function (s) { return s.Code === existingCode && s.Status !== 'Deleted'; }) || null;
    customerRec = customers.find(function (c) { return c.Code === existingCode && c.Status !== 'Deleted'; }) || null;
  }
  const zones = await zonesPromise;
  const rec = supplierRec || customerRec || {};
  const isEdit = !!existingCode;

  function zoneOptionsHtml() {
    return zones.filter(function (z) { return z.Status !== 'Deleted'; })
      .map(function (z) { return `<option value="${attr(z.ZoneName)}" ${rec.Zone===z.ZoneName?'selected':''}>${escapeHtml(z.ZoneName)}</option>`; }).join('');
  }

  const bodyHtml = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
      <div class="field"><label>কোড</label><input id="pf_Code" value="${attr(existingCode || '')}" ${isEdit ? 'readonly style="background:var(--bg);"' : 'placeholder="খালি রাখলে অটো তৈরি হবে"'}></div>
      <div class="field"><label>জোন</label>
        <div style="display:flex;gap:8px;">
          <select id="pf_Zone" style="flex:1;min-width:0;"><option value="">—</option>${zoneOptionsHtml()}</select>
          <button type="button" id="pf_AddZoneBtn" class="btn" style="width:auto;padding:0 14px;flex-shrink:0;" title="নতুন জোন যোগ করুন">+</button>
        </div>
      </div>
      <div class="field"><label>ব্যবসার নাম (Business Name)</label><input id="pf_CompanyName" value="${attr(rec.CompanyName)}"></div>
      <div class="field"><label>প্রোপ্রাইটরের নাম (Proprietor Name)</label><input id="pf_Name" value="${attr(rec.Name)}"></div>
      <div class="field"><label>ফোন</label><input id="pf_Phone" value="${attr(rec.Phone)}"></div>
      <div class="field"><label>Email</label><input id="pf_Email" value="${attr(rec.Email)}"></div>
      ${amountDrCrFieldHtml('pf_OpeningBalance', 'ওপেনিং ব্যালেন্স', rec.OpeningBalance)}
      ${amountDrCrFieldHtml('pf_CreditLimit', 'ক্রেডিট লিমিট', rec.CreditLimit)}
      <div class="field"><label>লিমিট পরিশোধের তারিখ</label><input type="date" id="pf_CreditLimitPaidDate" value="${attr(rec.CreditLimitPaidDate)}"></div>
      <div class="field"><label>ঠিকানা</label><input id="pf_Address" value="${attr(rec.Address)}"></div>
      <div class="field"><label>ব্যাংক নাম</label><input id="pf_BankName" value="${attr(rec.BankName)}" placeholder="যেমন: সোনালী ব্যাংক, মতিঝিল শাখা"></div>
      <div class="field"><label>ব্যাংক অ্যাকাউন্ট নম্বর</label><input id="pf_BankAccountNumber" value="${attr(rec.BankAccountNumber)}"></div>
      <div class="field"><label>অবস্থা</label><select id="pf_IsActive">
        <option value="TRUE" ${!isEdit || isTrue(rec.IsActive) ? 'selected' : ''}>Active</option>
        <option value="FALSE" ${isEdit && !isTrue(rec.IsActive) ? 'selected' : ''}>Inactive</option>
      </select></div>
    </div>
    ${isEdit ? '<div style="margin-top:16px;"><button type="button" id="partyDeleteBtn" class="btn" style="width:auto;background:#fdecea;color:var(--danger);border-color:#f6c6c2;">ডিলিট করুন</button></div>' : ''}`;

  openModal({
    title: (isEdit ? 'সম্পাদনা — ' : 'নতুন — ') + 'পার্টি',
    bodyHtml: bodyHtml,
    onSave: async function () {
      const code = val('pf_Code') || ('PTY-' + Date.now().toString().slice(-6));
      const name = val('pf_Name');
      if (!name) throw new Error('প্রোপ্রাইটরের নাম আবশ্যক।');

      const common = {
        Code: code, Name: name, CompanyName: val('pf_CompanyName'), Phone: val('pf_Phone'), Email: val('pf_Email'),
        Address: val('pf_Address'), Zone: val('pf_Zone'), CreditLimitPaidDate: val('pf_CreditLimitPaidDate') || null,
        OpeningBalance: readAmountDrCr('pf_OpeningBalance'), CreditLimit: readAmountDrCr('pf_CreditLimit'),
        BankName: val('pf_BankName') || null, BankAccountNumber: val('pf_BankAccountNumber') || null,
        IsActive: val('pf_IsActive')
      };

      if (supplierRec) {
        await api('update', { sheet:'Suppliers', idField:'SupplierID', idValue: supplierRec.SupplierID, data: common });
      } else {
        await api('create', { sheet:'Suppliers', idField:'SupplierID', idPrefix:'SUP', requiredFields:['Name'], data: common });
      }
      if (customerRec) {
        await api('update', { sheet:'Customers', idField:'CustomerID', idValue: customerRec.CustomerID, data: common });
      } else {
        await api('create', { sheet:'Customers', idField:'CustomerID', idPrefix:'CUS', requiredFields:['Name'], data: common });
      }

      showToast('সেভ হয়েছে ✅ (কোড: ' + code + ')', 'success');
      if (window.__refreshPartyList) await window.__refreshPartyList();
    }
  });

  document.getElementById('pf_AddZoneBtn').addEventListener('click', async function () {
    const name = prompt('নতুন জোনের নাম লিখুন:');
    if (!name || !name.trim()) return;
    try {
      const newZone = await api('create', { sheet:'Zones', idField:'ZoneID', idPrefix:'ZONE', requiredFields:['ZoneName'], data:{ ZoneName: name.trim() } });
      const select = document.getElementById('pf_Zone');
      if (!select) return; // মোডাল ততক্ষণে বন্ধ হয়ে গেলে আর কিছু করার দরকার নেই
      const opt = document.createElement('option');
      opt.value = newZone.ZoneName;
      opt.textContent = newZone.ZoneName;
      opt.selected = true;
      select.appendChild(opt);
      showToast('নতুন জোন যোগ হয়েছে ✅', 'success');
    } catch (err) {
      showToast(err.message, 'error');
    }
  });

  if (isEdit) {
    document.getElementById('partyDeleteBtn').addEventListener('click', async function () {
      if (!confirm('আপনি কি নিশ্চিত এই পার্টি ডিলিট করতে চান?')) return;
      try {
        if (supplierRec) await api('delete', { sheet:'Suppliers', idField:'SupplierID', idValue: supplierRec.SupplierID });
        if (customerRec) await api('delete', { sheet:'Customers', idField:'CustomerID', idValue: customerRec.CustomerID });
        showToast('ডিলিট হয়েছে ✅', 'success');
        closeModal();
        if (window.__refreshPartyList) await window.__refreshPartyList();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  }
}

async function renderSimpleVoucherPage(content, config) {
  const records = await api('list', { sheet: config.sheet });

  content.innerHTML = `
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="${attr(config.titleBn)}" data-en="${attr(config.titleEn)}">${t(config.titleBn, config.titleEn)}</h1>
        <p class="i18n" data-bn="${attr(config.subBn)}" data-en="${attr(config.subEn)}">${t(config.subBn, config.subEn)}</p>
      </div>
      <button class="btn btn-primary i18n" style="width:auto;" id="simpleVoucherAddBtn" data-bn="+ নতুন যোগ করুন" data-en="+ Add New">${t('+ নতুন যোগ করুন','+ Add New')}</button></div>
    <div class="panel"><div id="svTableWrap"></div></div>`;

  function renderTable(list) {
    const wrap = document.getElementById('svTableWrap');
    if (!wrap) return; // ব্যবহারকারী এই ফাঁকে অন্য পেজ/ট্যাবে চলে গেলে এই এলিমেন্ট আর DOM-এ থাকবে না
    const active = list.filter(function (r) { return r.Status !== 'Deleted'; });
    if (active.length === 0) {
      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এখনো কোনো এন্ট্রি নেই।" data-en="No entries yet.">${t('এখনো কোনো এন্ট্রি নেই।','No entries yet.')}</div>`;
      return;
    }
    const headCells = config.listColumns.map(function (c) { return `<th class="i18n" data-bn="${attr(c.label)}" data-en="${attr(c.labelEn||c.label)}">${t(c.label, c.labelEn||c.label)}</th>`; }).join('');
    const bodyRows = active.slice().reverse().map(function (r) {
      const cells = config.listColumns.map(function (c) {
        let v = r[c.key];
        if (c.key === 'Status') {
          v = v === 'Posted' ? `<span class="badge active i18n" data-bn="পোস্ট করা" data-en="Posted">${t('পোস্ট করা','Posted')}</span>` : `<span class="badge draft i18n" data-bn="খসড়া" data-en="Draft">${t('খসড়া','Draft')}</span>`;
        } else v = escapeHtml(v);
        return '<td>' + v + '</td>';
      }).join('');
      const postBtn = r.Status !== 'Posted'
        ? `<button class="btn i18n" style="width:auto;padding:6px 12px;font-size:12px;" data-bn="পোস্ট করুন" data-en="Post" onclick='event.stopPropagation();postDocumentRecord(${JSON.stringify(config.docType)}, ${JSON.stringify(r[config.idField])})'>${t('পোস্ট করুন','Post')}</button>`
        : '';
      return `<tr onclick='openSimpleVoucherForm(${JSON.stringify(r).replace(/'/g,"&apos;")})' style="cursor:pointer;">${cells}<td class="row-actions">${postBtn}</td></tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}<th></th></tr></thead><tbody>${bodyRows}</tbody></table>`;
  }

  renderTable(records);
  document.getElementById('simpleVoucherAddBtn').addEventListener('click', function () { openSimpleVoucherForm(null); });
  window.__refreshSimpleVoucherList = async function () { renderTable(await api('list', { sheet: config.sheet })); };
  window.__activeSimpleVoucherConfig = config;
}

async function openSimpleVoucherForm(existing) {
  const config = window.__activeSimpleVoucherConfig;
  const isEdit = !!existing;
  const isPosted = isEdit && existing.Status === 'Posted';

  const fkFieldsList = config.fields.filter(function (f) { return f.type === 'select-fk'; });
  const uniqueFkSheets = Array.from(new Set(fkFieldsList.map(function (f) { return f.fkSheet; })));
  const fkSheetMap = await cachedListMultiple(uniqueFkSheets);
  const fkLists = {};
  fkFieldsList.forEach(function (f) { fkLists[f.key] = fkSheetMap[f.fkSheet]; });

  const bodyHtml = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">` +
    config.fields.map(function (f) {
      const id = 'sv_' + f.key;
      const currentVal = existing ? existing[f.key] : '';
      const disabledAttr = isPosted ? 'disabled' : '';
      const label = t(f.label, f.labelEn || f.label);
      if (f.type === 'select-fk') {
        const opts = (fkLists[f.key] || []).filter(function (r) { return r.Status !== 'Deleted'; })
          .map(function (r) { return `<option value="${attr(r[f.fkIdField])}" ${currentVal===r[f.fkIdField]?'selected':''}>${escapeHtml(r[f.fkLabel])}</option>`; }).join('');
        return `<div class="field"><label>${label}</label><select id="${id}" ${disabledAttr}><option value="">—</option>${opts}</select></div>`;
      }
      if (f.type === 'select-enum') {
        const opts = f.options.map(function (o) { const ov = Array.isArray(o) ? o[0] : o, ol = Array.isArray(o) ? o[1] : o; return `<option value="${ov}" ${currentVal===ov?'selected':''}>${ol}</option>`; }).join('');
        return `<div class="field"><label>${label}</label><select id="${id}" ${disabledAttr}><option value="">—</option>${opts}</select></div>`;
      }
      if (f.type === 'date') return `<div class="field"><label>${label}</label><input type="date" id="${id}" value="${attr(currentVal)}" ${disabledAttr}></div>`;
      if (f.type === 'number') return `<div class="field"><label>${label}</label><input type="number" step="any" id="${id}" value="${attr(currentVal)}" ${disabledAttr}></div>`;
      return `<div class="field"><label>${label}</label><input id="${id}" value="${attr(currentVal)}" ${disabledAttr}></div>`;
    }).join('') +
    `</div>` +
    (isPosted ? `<p style="margin-top:14px;color:var(--text-muted);font-size:12.5px;">${t('এই ভাউচার পোস্ট হয়ে গেছে — আর সম্পাদনা করা যাবে না।','This voucher is already posted — it can no longer be edited.')}</p>` : '');

  openModal({
    title: (isEdit ? t('সম্পাদনা — ','Edit — ') : t('নতুন — ','New — ')) + t(config.titleBn, config.titleEn),
    bodyHtml: bodyHtml,
    onSave: async function () {
      if (isPosted) throw new Error(t('পোস্ট করা ভাউচার সম্পাদনা করা যাবে না।','A posted voucher cannot be edited.'));
      const data = {};
      config.fields.forEach(function (f) { data[f.key] = val('sv_' + f.key); });
      const missing = config.fields.filter(function (f) { return f.required && !data[f.key]; });
      if (missing.length > 0) throw new Error(missing.map(function (f) { return t(f.label, f.labelEn||f.label); }).join(', ') + t(' আবশ্যক।',' is required.'));

      if (isEdit) {
        await api('update', { sheet: config.sheet, idField: config.idField, idValue: existing[config.idField], data: data });
      } else {
        const requiredFields = config.fields.filter(function (f) { return f.required; }).map(function (f) { return f.key; });
        await api('create', { sheet: config.sheet, idField: config.idField, idPrefix: config.idPrefix, requiredFields: requiredFields, data: data });
      }
      showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
      if (window.__refreshSimpleVoucherList) await window.__refreshSimpleVoucherList();
    }
  });
}

/** ট্রায়াল ব্যালেন্স — বর্তমানে শুধু পোস্ট করা Journal Voucher-এর হিসাব দেখায় */
async function renderTrialBalance(content) {
  const [jvHeaders, jvLines, accounts] = await Promise.all([
    api('list', { sheet:'JournalVoucher' }), api('list', { sheet:'JV_Lines' }), api('list', { sheet:'ChartOfAccounts' })
  ]);
  const postedJVIDs = new Set(jvHeaders.filter(function (h) { return h.Status === 'Posted'; }).map(function (h) { return h.JVID; }));
  const accMap = {}; accounts.forEach(function (a) { accMap[a.AccountID] = a.AccountName; });

  const totals = {};
  jvLines.filter(function (l) { return postedJVIDs.has(l.JVID); }).forEach(function (l) {
    if (!totals[l.AccountID]) totals[l.AccountID] = { debit: 0, credit: 0 };
    totals[l.AccountID].debit += Number(l.Debit || 0);
    totals[l.AccountID].credit += Number(l.Credit || 0);
  });

  content.innerHTML = `
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="ট্রায়াল ব্যালেন্স" data-en="Trial Balance">${t('ট্রায়াল ব্যালেন্স','Trial Balance')}</h1>
        <p class="i18n" data-bn="বর্তমানে শুধু পোস্ট করা জার্নাল ভাউচার এন্ট্রি থেকে হিসাব করা হয়েছে" data-en="Currently computed from posted Journal Voucher entries only">${t('বর্তমানে শুধু পোস্ট করা জার্নাল ভাউচার এন্ট্রি থেকে হিসাব করা হয়েছে','Currently computed from posted Journal Voucher entries only')}</p>
      </div></div>
    <div class="panel"><div id="trialBalanceWrap"></div></div>`;

  const wrap = document.getElementById('trialBalanceWrap');
  if (!wrap) return; // ব্যবহারকারী এই ফাঁকে অন্য পেজ/ট্যাবে চলে গেলে এই এলিমেন্ট আর DOM-এ থাকবে না
  const accountIds = Object.keys(totals);
  if (accountIds.length === 0) {
    wrap.innerHTML = `<div class="empty-state i18n" data-bn="কোনো পোস্ট করা Journal Voucher নেই।" data-en="No posted Journal Vouchers yet.">${t('কোনো পোস্ট করা Journal Voucher নেই।','No posted Journal Vouchers yet.')}</div>`;
    return;
  }

  let grandDebit = 0, grandCredit = 0;
  const rows = accountIds.map(function (accId) {
    const tt = totals[accId];
    grandDebit += tt.debit; grandCredit += tt.credit;
    return `<tr><td>${escapeHtml(accMap[accId] || accId)}</td><td>${tt.debit.toFixed(2)}</td><td>${tt.credit.toFixed(2)}</td></tr>`;
  }).join('');

  const headers = [['হিসাব খাত','Account'],['Debit','Debit'],['Credit','Credit']];
  const headCells = headers.map(function (h) { return `<th class="i18n" data-bn="${h[0]}" data-en="${h[1]}">${t(h[0], h[1])}</th>`; }).join('');

  wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}</tr></thead><tbody>${rows}
    <tr style="font-weight:700;background:var(--bg);"><td class="i18n" data-bn="মোট" data-en="Total">${t('মোট','Total')}</td><td>${grandDebit.toFixed(2)}</td><td>${grandCredit.toFixed(2)}</td></tr>
  </tbody></table>`;
}

/* ============================================================
   হাজিরা ভিত্তিক পে-রোল — সাধারণ সহায়ক ফাংশন
   ============================================================ */
const HR_WEEKDAYS_BN = ['রবি','সোম','মঙ্গল','বুধ','বৃহঃ','শুক্র','শনি'];
const HR_MONTHS_BN = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const HR_ATT = { P: 'Present', A: 'Absent', L: 'Leave' };
const HR_ATT_CODE = { Present: 'P', Absent: 'A', Leave: 'L', Idle: 'P' }; // পুরনো "বসা" এন্ট্রি উপস্থিত হিসেবে ধরা হয়

function hrIso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function hrDate(iso) { const p = String(iso).slice(0, 10).split('-'); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); }
function hrAddDays(iso, n) { const d = hrDate(iso); d.setDate(d.getDate() + n); return hrIso(d); }
function hrToday() { return hrIso(new Date()); }
function hrDayLabel(iso) { const d = hrDate(iso); return HR_WEEKDAYS_BN[d.getDay()] + ' ' + String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); }
function hrIsFriday(iso) { return hrDate(iso).getDay() === 5; }
/** যেকোনো তারিখের সপ্তাহ: শনিবার থেকে বৃহস্পতিবার */
function hrWeekOf(iso) {
  const d = hrDate(iso);
  const back = (d.getDay() + 1) % 7; // শনি=0, রবি=1 ... শুক্র=6
  const from = hrAddDays(iso, -back);
  return { from: from, to: hrAddDays(from, 5) };
}
function hrMonthRange(ym) { // ym = "2026-09"
  const y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7));
  return { from: hrIso(new Date(y, m - 1, 1)), to: hrIso(new Date(y, m, 0)), year: y, month: m };
}
function hrDatesBetween(from, to) { const out = []; let d = from; while (d <= to) { out.push(d); d = hrAddDays(d, 1); } return out; }
function hrMoney(n) { return (Number(n) || 0).toFixed(2); }
function hrNum(n) { const v = Math.round((Number(n) || 0) * 1000) / 1000; return String(v); }


/** "নাম খুঁজুন" ঘরের অটো ড্রপডাউন — লেখা শুরু করলে (বা ঘরে চাপ দিলে) মিলে যাওয়া নামের তালিকা নিচে ভেসে ওঠে।
 *  ↑ ↓ দিয়ে বাছাই, Enter চাপলে বা আঙুল/মাউসে চাপলে নেওয়া হয়। opts.list() → [{id, name, sub}], opts.onPick(item) */
function hrNameSuggest(input, opts) {
  if (!input || input.__sug) return;
  input.__sug = true;
  input.setAttribute('autocomplete', 'off');
  if (!document.getElementById('hrSugCss')) {
    const st = document.createElement('style'); st.id = 'hrSugCss';

  let box = null, items = [], idx = -1;

    const below = window.innerHeight - r.bottom;
    if (below < 200 && r.top > below) { box.style.top = ''; box.style.bottom = (window.innerHeight - r.top + 4) + 'px'; }
    else { box.style.bottom = ''; box.style.top = (r.bottom + 4) + 'px'; }
  }

    if (window.__hrSugActive && window.__hrSugActive !== api) window.__hrSugActive.close();
    window.__hrSugActive = api;

    items = (opts.list() || []).filter(function (x) { return !q || String(x.name || '').toLowerCase().indexOf(q) !== -1; }).slice(0, 40);
    if (!box) { box = document.createElement('div'); box.className = 'hr-sug'; document.body.appendChild(box); }

    box.innerHTML = items.length ? items.map(function (x, i) { return `<div data-i="${i}" class="${i === idx ? 'on' : ''}"><b>${escapeHtml(x.name)}</b><span>${escapeHtml(x.sub || '')}</span></div>`; }).join('')

/** দৈনিক হাজিরাঃ মাসিক বেতন ÷ ৩০ (সেটিংস অনুযায়ী), সাপ্তাহিক বেতন ÷ ৬ (শনি–বৃহঃ)।
 *  পুরনো রেকর্ডে "দৈনিক" থাকলে বেতনটাই দৈনিক হাজিরা; ধরন না থাকলে মাসিক ধরা হয়। */
const HR_WEEK_DAYS = 6;
function hrDailyWage(emp, divisor) {
  emp = emp || {};
  if (Number(emp.DailyRate) > 0) return Number(emp.DailyRate);
  // পুরনো রেকর্ডঃ মাসিক ÷ ৩০, সাপ্তাহিক ÷ ৬, দৈনিক = বেতন
  const sal = Number(emp.BasicSalary) || 0, type = emp.SalaryType;

}
/** SortOrder অনুযায়ী সাজানো (না থাকলে শেষে, নাম অনুযায়ী) */

  const items = (m.Items || []).filter(function (i) { return i.Status !== 'Deleted'; });
  const catMap = {}; cats.forEach(function (c) { catMap[c.CategoryID] = c.CategoryName; });

          if (!confirm(t('"' + role.RoleName + '" কলামটা সরাবেন? আগের দর ও এন্ট্রি মুছবে না, শুধু টেবিলে আর দেখাবে না।','Remove this column? Old rates/entries are kept.'))) return;
          const { error } = await supabaseClient.from('WorkRoles').update({ IsActive: false }).eq('RoleID', id);
          if (error) throw new Error(error.message);
          gp.roles = gp.roles.filter(function (x) { return x.RoleID !== id; });
          gp.laborRoles = gp.laborRoles.filter(function (x) { return x.RoleID !== id; });
          gp.costRoles = gp.costRoles.filter(function (x) { return x.RoleID !== id; });
        }
        listCache = {}; render(); showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
      } catch (err) { showToast(err.message, 'error'); }
      return;
    }
    if (!ev.target.closest('#srtAddCol')) return;
    document.getElementById('srtNew').classList.add('on'); document.getElementById('srtNewName').focus();
  });
  document.getElementById('srtNewCancel').addEventListener('click', function () { document.getElementById('srtNew').classList.remove('on'); });
  document.getElementById('srtNewSave').addEventListener('click', async function () {
    const name = val('srtNewName').trim(), kind = val('srtNewKind');
    if (!name) { showToast(t('কলামের নাম লিখুন।','Enter a column name.'), 'error'); return; }
    if (gp.roles.some(function (r) { return r.RoleName === name; })) { showToast(t('এই নামে কলাম আগেই আছে।','A column with this name exists.'), 'error'); return; }
    this.disabled = true;
    try {
      const order = gp.roles.reduce(function (m, r) { return Math.max(m, Number(r.SortOrder) || 0); }, 0) + 1;
      const { data, error } = await supabaseClient.from('WorkRoles').insert({ RoleName: name, Kind: kind, SortOrder: order }).select();
      if (error) throw new Error(error.message);
      const r = data[0]; gp.roles.push(r); gp.roleMap[r.RoleID] = r.RoleName;
      if (kind === 'Cost') gp.costRoles.push(r); else gp.laborRoles.push(r);
      listCache = {}; document.getElementById('srtNewName').value = ''; document.getElementById('srtNew').classList.remove('on');
      showToast(t('নতুন কলাম যোগ হয়েছে ✅','Column added ✅'), 'success'); render();
    } catch (err) { showToast(err.message, 'error'); }
    this.disabled = false;
  });
  /** একটা আইটেমের সব কলামের দরের যোগফল (লেখার সাথে সাথে) — ডিউটি পরিমাণ এতে ধরা হয় না */
  function rowSum(itemId) {
    return gp.roles.reduce(function (sum, r) {
      const k = itemId + '|' + r.RoleID, v = st.edits[k] !== undefined ? st.edits[k] : gp.rate[k];
      return sum + (Number(v) || 0);
    }, 0);
  }
  document.getElementById('srtRows').addEventListener('input', function (ev) {
    const k = ev.target.dataset.k; if (!k) return;
    st.edits[k] = ev.target.value;
    const itemId = k.split('|')[0], cell = document.querySelector(`[data-sum="${itemId}"]`);
    if (cell) cell.textContent = hrMoney(rowSum(itemId));
  });
  document.getElementById('srtSave').addEventListener('click', async function () {
    this.disabled = true;
    try {
      const up = [], del = [];
      Object.keys(st.edits).forEach(function (k) { const p = k.split('|'), v = Number(st.edits[k]); if (v > 0) up.push({ ItemID: p[0], RoleID: p[1], Rate: v }); else del.push(p); });
      if (up.length) { const { error } = await supabaseClient.from('SizeRates').upsert(up, { onConflict: 'ItemID,RoleID' }); if (error) throw new Error(error.message); }
      for (const p of del) await supabaseClient.from('SizeRates').delete().eq('ItemID', p[0]).eq('RoleID', p[1]);
      up.forEach(function (r) { gp.rate[r.ItemID + '|' + r.RoleID] = r.Rate; }); del.forEach(function (p) { delete gp.rate[p[0] + '|' + p[1]]; });
      st.edits = {}; listCache = {};
      showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success'); render();
    } catch (err) { showToast(err.message, 'error'); }
    this.disabled = false;
  });
}

/* ---------- দৈনিক উৎপাদন (দল) — প্রসেসিং ভাউচার ছাড়া উৎপাদন লেখার জন্য ---------- */
async function renderDailyProductionPage(content) {
  const base = await hrLoadBase();
  const gp = await hrLoadGroups();
  const m = await cachedListMultiple(['Items', 'Categories']);
  const items = (m.Items || []).filter(function (i) { return i.Status !== 'Deleted'; });

  const roles = gp.laborRoles; // শেপ, হাঃফিনিস … ফোরম্যান
  const croles = gp.costRoles; // খরচের খাত — বিদ্যুৎ, মেশিঃ ও ডাইস, মেডিসিন, ধোলাই, বিবিধ (কর্মচারী নেই, প্রতি কেজি খরচ)
  // rows: itemId → { tpId, qty, who:{roleId: empId}, locked, dirty }
  const st = { date: hrToday(), group: '', cat: '', item: '', rows: {}, present: {}, bonus: [], bonusDirty: false };

  content.innerHTML = `

    </style>
    <div class="panel dpg">

        <button class="btn btn-primary" id="dpgSave">💾 ${t('সেভ','Save')}</button>
      </div>
      <div id="dpgGrid"></div>
      <div class="dpg-sum" id="dpgSum"></div>
      <div class="dpg-bon">
        <div class="dpg-bon-h"><b>${t('বোনাস','Bonus')}</b><span>${t('এই দিনে কাউকে আলাদা টাকা দিলে এখানে লিখুন — সাপ্তাহিক বেতন শিটে যোগ হবে','Extra money for anyone on this day — added to the weekly sheet')}</span></div>
        <div id="dpgBonus"></div>
        <button type="button" class="btn btn-outline" id="dpgBonusAdd" style="width:auto;height:30px;padding:0 12px;font-size:12.5px;margin-top:6px;">+ ${t('বোনাস যোগ','Add bonus')}</button>
      </div>
    </div>`;

  // ---------- ফিল্টার ----------
  function filtered(ignoreItem) {
    return sortItemsBySerial(items.filter(function (i) {
      return (!st.group || i.GroupID === st.group) && (!st.cat || i.CategoryID === st.cat) && (ignoreItem || !st.item || i.ItemID === st.item);
    }), catName);
  }
  function fillCats() {
    const used = {}; items.forEach(function (i) { if ((!st.group || i.GroupID === st.group) && i.CategoryID) used[i.CategoryID] = true; });
    const sel = document.getElementById('dpgCat');
    sel.innerHTML = `<option value="">${t('সব ক্যাটাগরি','All categories')}</option>` + cats.filter(function (c) { return used[c.CategoryID]; })
      .sort(function (a, b) { return String(a.CategoryName).localeCompare(String(b.CategoryName)); })
      .map(function (c) { return `<option value="${attr(c.CategoryID)}">${escapeHtml(c.CategoryName)}</option>`; }).join('');
    if (!used[st.cat]) st.cat = ''; sel.value = st.cat;
  }
  function fillItems() {
    const list = filtered(true), sel = document.getElementById('dpgItem');
    sel.innerHTML = `<option value="">${t('সব আইটেম','All items')} (${list.length})</option>` + list.map(function (i) { return `<option value="${attr(i.ItemID)}">${escapeHtml(i.ItemName)}</option>`; }).join('');
    if (!list.some(function (i) { return i.ItemID === st.item; })) st.item = ''; sel.value = st.item;
  }

  // ---------- কর্মচারীর ড্রপডাউন (সেদিন P থাকা কর্মচারীরা আগে) ----------
  function empOptions(selected) {
    const sorted = base.emps.slice().sort(function (a, b) { return (st.present[b.EmployeeID] ? 1 : 0) - (st.present[a.EmployeeID] ? 1 : 0) || String(a.Name).localeCompare(String(b.Name)); });
    return `<option value="">—</option>` + sorted.map(function (e) {
      return `<option value="${attr(e.EmployeeID)}" ${e.EmployeeID === selected ? 'selected' : ''}>${escapeHtml(e.Name)}${st.present[e.EmployeeID] ? ' ✓' : ''}</option>`;
    }).join('');
  }
  function row(itemId) { return st.rows[itemId] = st.rows[itemId] || { tpId: null, qty: '', who: {}, amt: {}, camt: {}, locked: false, dirty: false }; }
  // খরচের খাতঃ r.camt[roleId] = হাতে লেখা টাকা; না থাকলে দর × কেজি
  function hasCOv(r, roleId) { return r.camt && r.camt[roleId] !== undefined && r.camt[roleId] !== ''; }
  function costAmount(itemId, roleId) { const r = row(itemId); return hasCOv(r, roleId) ? (Number(r.camt[roleId]) || 0) : (Number(r.qty) || 0) * gp.rateOf(itemId, roleId); }
  function costText(itemId, roleId) {
    const rate = gp.rateOf(itemId, roleId), r = row(itemId), q = Number(r.qty) || 0;
    if (!(q > 0)) return rate ? t('দর ','rate ') + hrMoney(rate) : '';

    const tip = (rate ? t('হিসাবঃ ','Calc: ') + hrNum(q) + ' × ' + hrMoney(rate) + ' = ' + hrMoney(q * rate) + ' — ' : '') + t('নিজে লিখে বদলানো যায়; খালি করলে আবার হিসাবের মান','Type to override; clear to go back to the calculated value');
    return (rate ? t('দর ','rate ') + hrMoney(rate) + ' =' : t('দর নেই','no rate')) + `<input type="number" step="any" min="0" inputmode="decimal" class="dpg-amt ${ov ? 'ov' : ''}" data-camtin="${attr(itemId + '|' + roleId)}" value="${attr(shown)}" placeholder="${t('টাকা','Amount')}" title="${attr(tip)}" ${r.locked ? 'disabled' : ''}>`;
  }
  // r.amt[roleId] = হাতে লেখা টাকা (থাকলে সেটাই মজুরি); না থাকলে দর × কেজি
  function hasOv(r, roleId) { return r.amt && r.amt[roleId] !== undefined && r.amt[roleId] !== ''; }
  function rowAmount(itemId, roleId) { const r = row(itemId); return hasOv(r, roleId) ? (Number(r.amt[roleId]) || 0) : (Number(r.qty) || 0) * gp.rateOf(itemId, roleId); }
  /** ঘরের নিচেঃ দর (মজুরি দর পেজ থেকে) আর নাম বাছাই করা থাকলে টাকার ঘর — দর × কেজি নিজে বসে,
