  // ---------- প্রস্তুত পণ্য লাইন (একই সার্কেল থেকে রাইচ/তরকারী/ডিস্কো ইত্যাদি) — বাই-প্রডাক্টের মতো এক লাইনে ৫টা ঘর ----------
  const gv = function (id) { const el = document.getElementById(id); return el ? el.value : ''; };
  // প্রতি কেজি দর ডিফল্টে নেট মূল্য ÷ নেট ওজন থেকে নিজে আসে (অটো); সেই দর × কেজি = লাইনের মূল্য, আর মূল্য ÷ পিস = পিস-দর।
  // কেজি-দর বা পিস-দর নিজে লিখলে ওই লাইন ম্যানুয়াল; দরের ঘর খালি করলে আবার অটো
  function fgDefaultRate() {
    const net = window.__procNet || { w: Number(gv('pv_NetWeight')) || 0, v: Number(gv('pv_NetValue')) || 0 };
    return net.w > 0 ? net.v / net.w : 0;
  }
  function fgRowValue(row) {
    const kg = Number(row.kg) || 0, pcs = Number(row.pcs) || 0;
    if (row.auto !== false) return kg * fgDefaultRate();
    return row.driver === 'pc' ? pcs * (Number(row.ratePc) || 0) : kg * (Number(row.rateKg) || 0);
  }
  function fgSyncRowsFromDom() {
    window.__procFGRows = window.__procFGRows.map(function (row, i) {
      return { itemId: gv('pv_fg_' + i + '_item'), kg: gv('pv_fg_' + i + '_kg'), rateKg: gv('pv_fg_' + i + '_rk'), pcs: gv('pv_fg_' + i + '_pcs'), ratePc: gv('pv_fg_' + i + '_rp'), driver: row.driver || 'kg', auto: row.auto !== false };
    });
  }
  function fgRefreshAuto() {
    const rate = fgDefaultRate();
    window.__procFGRows.forEach(function (row, i) {
      if (row.auto === false) return;
      const kgEl = document.getElementById('pv_fg_' + i + '_kg'), pcsEl = document.getElementById('pv_fg_' + i + '_pcs');
      if (!kgEl) return;
      row.itemId = gv('pv_fg_' + i + '_item'); row.kg = kgEl.value; row.pcs = pcsEl.value;
      const kg = Number(row.kg) || 0, pcs = Number(row.pcs) || 0, value = kg * rate;
      row.rateKg = rate > 0 ? rate.toFixed(2) : '';
      row.ratePc = (pcs > 0 && value > 0) ? (value / pcs).toFixed(2) : '';
      document.getElementById('pv_fg_' + i + '_rk').value = row.rateKg;
      document.getElementById('pv_fg_' + i + '_rp').value = row.ratePc;
      const vs = document.getElementById('pv_fg_' + i + '_val'); if (vs) vs.textContent = value.toFixed(2);
    });
  }
  function fgRefreshTotals() {
    let tk = 0, tp = 0, tv = 0;
    window.__procFGRows.forEach(function (row) { tk += Number(row.kg) || 0; tp += Number(row.pcs) || 0; tv += fgRowValue(row); });
    const setTxt = function (id, txt) { const el = document.getElementById(id); if (el) el.textContent = txt; };
    setTxt('pv_fgTotKg', tk.toFixed(3)); setTxt('pv_fgTotPcs', String(tp)); setTxt('pv_fgTotVal', tv.toFixed(2));
    renderFGRecon(tk, tv);
  }
  // নেট ওজন ও নেট মূল্যের সাথে সমন্বয় (অমিল দেখায়)
  function renderFGRecon(tk, tv) {
    const box = document.getElementById('pv_FGRecon');
    if (!box) return;
    const nw = Number(gv('pv_NetWeight')) || 0, nv = Number(gv('pv_NetValue')) || 0;
    const row = function (label, net, got, unit, dec, tol) {
      const diff = net - got, ok = Math.abs(diff) <= tol;
      return `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:7px 10px;border-radius:8px;margin-bottom:6px;font-size:12.5px;background:${ok ? '#e5f5ec' : '#fdf3e3'};color:${ok ? 'var(--success)' : 'var(--amber-dim)'};">
        <span>${label}: ${t('নেট','Net')} <b>${net.toFixed(dec)}</b> ${unit} — ${t('প্রস্তুত পণ্যের মোট','finished goods total')} <b>${got.toFixed(dec)}</b> ${unit}</span>
        <b>${ok ? '✓ ' + t('মিলেছে','Matched') : t('অমিল','Difference') + ': ' + (diff > 0 ? '+' : '') + diff.toFixed(dec) + ' ' + unit + (diff > 0 ? ' (' + t('আরও বাকি','still to assign') + ')' : ' (' + t('বেশি ধরা হয়েছে','over-assigned') + ')')}</b></div>`;
    };
    box.innerHTML = row(t('ওজন','Weight'), nw, tk, t('কেজি','kg'), 3, 0.0005) + row(t('মূল্য','Value'), nv, tv, '৳', 2, 0.5);
  }
  function renderFGRows() {
    const wrap = document.getElementById('pv_FGWrap');
    if (!wrap) return;
    const rows = window.__procFGRows;
    const headCells = `<th>${t('প্রস্তুত পণ্য আইটেম','Finished Goods Item')}</th><th>${t('পরিমাণ (কেজি)','Qty (kg)')}</th><th>${t('প্রতি কেজি দর','Rate / kg')}</th><th>${t('পরিমাণ (পিস)','Qty (pcs)')}</th><th>${t('প্রতি পিস দর','Rate / pc')}</th><th>${t('মূল্য','Value')}</th><th></th>`;
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}</tr></thead>
      <tbody>${rows.map(function (row, i) {
        return `<tr>
          <td><select id="pv_fg_${i}_item" data-i="${i}" data-f="item" style="min-width:130px;"><option value="">—</option>${opts(window.__procItems, 'ItemID', 'ItemName', row.itemId)}</select></td>
          <td><input id="pv_fg_${i}_kg" data-i="${i}" data-f="kg" type="number" step="any" value="${attr(row.kg)}" style="width:80px;"></td>
          <td><input id="pv_fg_${i}_rk" data-i="${i}" data-f="rk" type="number" step="any" value="${attr(row.rateKg)}" style="width:80px;"></td>
          <td><input id="pv_fg_${i}_pcs" data-i="${i}" data-f="pcs" type="number" step="any" value="${attr(row.pcs)}" style="width:80px;"></td>
          <td><input id="pv_fg_${i}_rp" data-i="${i}" data-f="rp" type="number" step="any" value="${attr(row.ratePc)}" style="width:80px;"></td>
          <td><b><span id="pv_fg_${i}_val">${fgRowValue(row).toFixed(2)}</span></b></td>
          <td><button type="button" class="pv-bp-del" onclick="window.__removeProcFG(${i})" title="${attr(t('মুছুন','Remove'))}">✕</button></td></tr>`;
      }).join('')}</tbody>
      <tfoot><tr style="font-weight:700;"><td>${t('মোট','Total')}</td><td id="pv_fgTotKg">0.000</td><td></td><td id="pv_fgTotPcs">0</td><td></td><td id="pv_fgTotVal">0.00</td><td></td></tr></tfoot></table>`;
    fgRefreshAuto();
    fgRefreshTotals();
  }
  // কোনো ঘরে লিখলে: লাইনের অবস্থা হালনাগাদ, অন্য দর/মূল্য/মোট নিজে থেকে হিসাব (লাইন নতুন করে না এঁকে, যাতে কার্সর না হারায়)
  function fgOnInput(e) {
    const el = e.target, f = el.getAttribute && el.getAttribute('data-f');
    if (!f) return;
    const i = Number(el.getAttribute('data-i')), row = window.__procFGRows[i];
    if (!row) return;
    if (f === 'rk') { row.driver = 'kg'; row.auto = gv('pv_fg_' + i + '_rk') === ''; }
    else if (f === 'rp') { row.driver = 'pc'; row.auto = gv('pv_fg_' + i + '_rp') === ''; }
    row.itemId = gv('pv_fg_' + i + '_item'); row.kg = gv('pv_fg_' + i + '_kg'); row.rateKg = gv('pv_fg_' + i + '_rk'); row.pcs = gv('pv_fg_' + i + '_pcs'); row.ratePc = gv('pv_fg_' + i + '_rp');
    if (row.auto === false) {
      const kg = Number(row.kg) || 0, pcs = Number(row.pcs) || 0, value = fgRowValue(row);
      if (row.driver === 'pc') { const rk = document.getElementById('pv_fg_' + i + '_rk'); rk.value = (kg > 0 && value > 0) ? (value / kg).toFixed(2) : ''; row.rateKg = rk.value; }
      else { const rp = document.getElementById('pv_fg_' + i + '_rp'); rp.value = (pcs > 0 && value > 0) ? (value / pcs).toFixed(2) : ''; row.ratePc = rp.value; }
      const vs = document.getElementById('pv_fg_' + i + '_val'); if (vs) vs.textContent = value.toFixed(2);
    }
    recalcProcessing();   // মোট পিস, প্রতি পিস দর, লাভ, অটো লাইন ও সমন্বয় — সব একসাথে নতুন হবে
  }
  const fgWrap = document.getElementById('pv_FGWrap');
  fgWrap.addEventListener('input', fgOnInput);
  fgWrap.addEventListener('change', fgOnInput);
  function fgAddRow() {
    fgSyncRowsFromDom();
    window.__procFGRows.push({});
    renderFGRows();
    const first = document.getElementById('pv_fg_' + (window.__procFGRows.length - 1) + '_item');
    if (first) first.focus();
  }
  document.getElementById('pv_AddFGBtn').addEventListener('click', fgAddRow);
  fgWrap.addEventListener('keydown', function (e) {   // শেষ লাইনের শেষ ঘরে Enter চাপলে নতুন লাইন
    const el = e.target;
    if (e.key === 'Enter' && el.getAttribute && el.getAttribute('data-f') === 'rp' && Number(el.getAttribute('data-i')) === window.__procFGRows.length - 1) fgAddRow();
  });
  window.__removeProcFG = function (i) {
    fgSyncRowsFromDom();
    window.__procFGRows.splice(i, 1);
    if (window.__procFGRows.length === 0) window.__procFGRows.push({});
    renderFGRows();
    recalcProcessing();
  };
  // strict=true (সেভ): অসম্পূর্ণ লাইনে স্পষ্ট ত্রুটি; strict=false (প্রিভিউ/প্রিন্ট/শেয়ার): অসম্পূর্ণ লাইন বাদ। পুরোপুরি ফাঁকা লাইন সবসময় বাদ
  window.__procFGCollect = function (strict) {
    if (document.getElementById('pv_fg_0_item')) fgSyncRowsFromDom();
    const out = [];
    window.__procFGRows.forEach(function (row, i) {
      const kg = Number(row.kg) || 0, pcs = Number(row.pcs) || 0, value = fgRowValue(row);
      if (!row.itemId && !kg && !pcs && (row.auto !== false || (!Number(row.rateKg) && !Number(row.ratePc)))) return;
      const no = i + 1;
      const problem = !row.itemId ? t('প্রস্তুত পণ্য লাইন ' + no + ': আইটেম বাছাই করুন।', 'Finished goods line ' + no + ': select an item.')
        : (!(kg > 0) && !(pcs > 0)) ? t('প্রস্তুত পণ্য লাইন ' + no + ': কেজি অথবা পিসের পরিমাণ দিন।', 'Finished goods line ' + no + ': enter the kg or pieces quantity.')
        : !(value > 0) ? t('প্রস্তুত পণ্য লাইন ' + no + ': দর দিন (কেজি-দর অথবা পিস-দর)।', 'Finished goods line ' + no + ': enter a rate (per kg or per piece).') : '';
      if (problem) { if (strict) throw new Error(problem); return; }
      out.push({ itemId: row.itemId, kg: kg, pcs: pcs, value: value, rateKg: kg > 0 ? value / kg : (Number(row.rateKg) || 0), ratePc: pcs > 0 ? value / pcs : (Number(row.ratePc) || 0) });
    });
    if (strict && out.length === 0) throw new Error(t('অন্তত একটা প্রস্তুত পণ্য লাইন পূরণ করুন।', 'Fill in at least one finished goods line.'));
    return out;
  };
  window.__procFGPieces = function () { return window.__procFGRows.reduce(function (s, row, i) { const el = document.getElementById('pv_fg_' + i + '_pcs'); return s + (el ? (Number(el.value) || 0) : (Number(row.pcs) || 0)); }, 0); };
  window.__procRenderFG = function () { fgRefreshAuto(); fgRefreshTotals(); };
  window.__procFGAutoDetect = function () {   // সেভ করা লাইনের দর বর্তমান ডিফল্টের সমান হলে অটো ধরা (নেট বদলালে সাথে বদলাবে)
    const rate = fgDefaultRate();
    window.__procFGRows.forEach(function (row) { if (row.auto === false && row.driver !== 'pc' && rate > 0 && Math.abs((Number(row.rateKg) || 0) - rate) < 0.005) row.auto = true; });
  };
  renderFGRows();


  wireSequentialKeyNav(document.getElementById('modalBody'));

  // পুরনো ভাউচারের মান ফর্মে বসানো
  if (existing) {
    const h = existing.header;
    const setV = function (id, v) { const el = document.getElementById(id); if (el && v !== undefined && v !== null) el.value = v; };
    setV('pv_RawMaterialItemID', h.RawMaterialItemID); setV('pv_WarehouseID', h.WarehouseID);
    setV('pv_Date', h.Date); setV('pv_DateFrom', h.DateFrom); setV('pv_DateTo', h.DateTo);
    if (h.DateFrom || h.DateTo) document.getElementById('pv_UseAvgRate').checked = true;
    setV('pv_Qty', h.RawMaterialQty); setV('pv_RMRate', h.RawMaterialRate); setV('pv_ProcRate', h.ProcessingRate);
    setV('pv_SaleRatePerKg', h.SaleRatePerKg || ''); setV('pv_SaleRatePerPiece', h.SaleRatePerPiece || '');
    try {   // এই ভাউচারে যুক্ত দৈনিক উৎপাদনের লাইন
      const lr = await supabaseClient.from('DailyProduction').select('id,ProdDate').eq('ProcessingID', existingId);
      if (!lr.error && lr.data && lr.data.length) {
        window.__procDPIds = lr.data.map(function (x) { return x.id; });
        const ds = lr.data.map(function (x) { return String(x.ProdDate).slice(0, 10); }).sort();

      }
    } catch (e) { /* টেবিল না থাকলে কিছু নেই */ }
    recalcProcessing();
    window.__procFGAutoDetect(); renderFGRows(); recalcProcessing();
    setProcessingFormLocked(true);
  }
}


/** প্রসেসিং ফর্মের সব ইনপুট লক/আনলক — পুরনো ভাউচার শুধু দেখার সময় লক থাকে */
function setProcessingFormLocked(locked) {
  const root = document.querySelector('#modalBody .pv-compact');
  if (!root) return;
  root.querySelectorAll('input, select, button').forEach(function (el) { el.disabled = locked; });
  if (!locked) {
    const on = document.getElementById('pv_UseAvgRate').checked;
    ['pv_DateFrom','pv_DateTo','pv_FetchRateBtn'].forEach(function (id) { document.getElementById(id).disabled = !on; });
    // হিসাব করা ঘরগুলো সবসময় readonly থাকে (disabled নয়)
  }
}

/** ফর্মের বর্তমান মান থেকে হেডার ও বাই-প্রডাক্ট লাইন — সেভ, প্রিন্ট ও শেয়ার তিন জায়গাতেই ব্যবহার হয় */
function collectProcessingForm() {
  const useAvg = document.getElementById('pv_UseAvgRate').checked;
  const fgLines = window.__procFGCollect ? window.__procFGCollect(false) : [];   // প্রিভিউ/শেয়ারে অসম্পূর্ণ লাইন বাদ
  const lines = (window.__procByProductRows || [])
    .map(function (_, idx) {
      const q = Number(val('pv_bp_' + idx + '_qty')) || 0, r = Number(val('pv_bp_' + idx + '_rate')) || 0;
      return { ByProductName: val('pv_bp_' + idx + '_name'), ItemID: val('pv_bp_' + idx + '_item') || null, Quantity: q, Rate: r, Value: q * r };
    })
    .filter(function (l) { return l.Quantity > 0; });
  const header = {
    Date: val('pv_Date'), RawMaterialItemID: val('pv_RawMaterialItemID'),
    DateFrom: (useAvg && val('pv_DateFrom')) ? val('pv_DateFrom') : null, DateTo: (useAvg && val('pv_DateTo')) ? val('pv_DateTo') : null,
    WarehouseID: val('pv_WarehouseID'),
    RawMaterialQty: Number(val('pv_Qty')) || 0, RawMaterialRate: Number(val('pv_RMRate')) || 0, RawMaterialValue: Number(val('pv_RMValue')) || 0,
    ProcessingRate: Number(val('pv_ProcRate')) || 0, ProcessingValue: Number(val('pv_ProcValue')) || 0,
    TotalValue: Number(val('pv_Total')) || 0,
    ByProductQty: lines.reduce(function (s, l) { return s + l.Quantity; }, 0),
    ByProductValue: lines.reduce(function (s, l) { return s + l.Value; }, 0),
    NetWeight: Number(val('pv_NetWeight')) || 0, NetValue: Number(val('pv_NetValue')) || 0,
    FinishedGoodsItemID: fgLines.length ? fgLines[0].itemId : '', Pieces: fgLines.reduce(function (s, l) { return s + l.pcs; }, 0),
    RatePerKg: Number(val('pv_RatePerKg')) || 0, RatePerPiece: Number(val('pv_RatePerPiece')) || 0,
    SaleRatePerKg: Number(val('pv_SaleRatePerKg')) || 0, SaleRatePerPiece: Number(val('pv_SaleRatePerPiece')) || 0,
    Profit: Number(val('pv_Profit')) || 0
  };
  return { header: header, lines: lines, fgLines: fgLines };
}

/** প্রসেসিং ভাউচারের সারাংশ শেয়ার — মোবাইলে শেয়ার শিট, ডেস্কটপে ক্লিপবোর্ডে কপি */
async function shareProcessingVoucher(docId, dIn) {
  const dd = dIn || collectProcessingForm();
  const h = dd.header;
  const itemMap = window.__procItemMap || {};
  const nm = function (id) { return (itemMap[id] && itemMap[id].ItemName) || id || '—'; };
  const text = 'প্রসেসিং ভাউচার' + (docId ? ' ' + docId : ' (খসড়া)') + '\n' +
    'তারিখ: ' + formatShortDate(h.Date) + '\n' +
    'কাঁচামাল: ' + nm(h.RawMaterialItemID) + ' — ' + h.RawMaterialQty + ' কেজি @ ' + h.RawMaterialRate.toFixed(2) + '\n' +
    'প্রস্তুত পণ্য:\n' + dd.fgLines.map(function (l) { return '  • ' + nm(l.itemId) + ' — ' + (l.kg ? l.kg.toFixed(3) + ' কেজি' : '') + (l.kg && l.pcs ? ', ' : '') + (l.pcs ? l.pcs + ' পিস' : '') + ' = ' + l.value.toFixed(2); }).join('\n') + '\n' +
    'মোট: ' + h.NetWeight.toFixed(3) + ' কেজি, ' + h.Pieces + ' পিস | প্রতি কেজি দর: ' + h.RatePerKg.toFixed(2) + '\n' +
    'নেট মূল্য: ' + h.NetValue.toFixed(2);
  if (navigator.share) {
    try { await navigator.share({ title: 'প্রসেসিং ভাউচার', text: text }); } catch (e) {}
  } else if (navigator.clipboard) {
    await navigator.clipboard.writeText(text);
    showToast(t('তথ্য ক্লিপবোর্ডে কপি হয়েছে — যেকোনো জায়গায় পেস্ট করুন।','Copied to clipboard — paste it anywhere.'), 'success');
  }
}

window.recalcProcessing = function () {
  const qty = Number(val('pv_Qty')) || 0;
  const rmRate = Number(val('pv_RMRate')) || 0;
  const procRate = Number(val('pv_ProcRate')) || 0;

  const rmValue = qty * rmRate;
  const procValue = qty * procRate;
  const total = rmValue + procValue;

  document.getElementById('pv_RMValue').value = rmValue.toFixed(2);
  document.getElementById('pv_ProcValue').value = procValue.toFixed(2);
  document.getElementById('pv_Total').value = total.toFixed(2);

  let bpQtySum = 0, bpValueSum = 0;
  (window.__procByProductRows || []).forEach(function (_, idx) {
    const bpQty = Number(val('pv_bp_' + idx + '_qty')) || 0;
    const bpRate = Number(val('pv_bp_' + idx + '_rate')) || 0;
    const bpValue = bpQty * bpRate;
    bpQtySum += bpQty;
    bpValueSum += bpValue;
    const valEl = document.getElementById('pv_bp_' + idx + '_val');
    if (valEl) valEl.textContent = bpValue.toFixed(2);
  });

  const netWeight = qty - bpQtySum;
  const netValue = total - bpValueSum;
  document.getElementById('pv_NetWeight').value = netWeight.toFixed(3);
  document.getElementById('pv_NetValue').value = netValue.toFixed(2);

  window.__procNet = { w: netWeight, v: netValue };   // গোল না করা নেট — প্রস্তুত পণ্যের অটো-দর এখান থেকে
  const pieces = window.__procFGPieces ? window.__procFGPieces() : (Number(val('pv_Pieces')) || 0);   // মোট পিস এখন প্রস্তুত পণ্য লাইনগুলোর যোগফল
  const pcsEl = document.getElementById('pv_Pieces'); if (pcsEl) pcsEl.value = pieces ? String(pieces) : '';
  document.getElementById('pv_RatePerKg').value = netWeight > 0 ? (netValue / netWeight).toFixed(2) : '0.00';
  document.getElementById('pv_RatePerPiece').value = pieces > 0 ? (netValue / pieces).toFixed(2) : '0.00';
  if (window.__procRenderFG) window.__procRenderFG();

  // লাভ = বিক্রয় মূল্য − নেট খরচ। কেজি বিক্রয় দর দিলে সেটা ধরে, না দিলে পিস বিক্রয় দর ধরে।
  const saleKg = Number(val('pv_SaleRatePerKg')) || 0;
  const salePc = Number(val('pv_SaleRatePerPiece')) || 0;
  const profitEl = document.getElementById('pv_Profit');
  const hintEl = document.getElementById('pv_ProfitHint');
  let profit = 0, hint = '';
  if (saleKg > 0) { profit = saleKg * netWeight - netValue; hint = t('কেজি বিক্রয় দর অনুযায়ী','Based on sale rate per kg'); }
  else if (salePc > 0) { profit = salePc * pieces - netValue; hint = t('পিস বিক্রয় দর অনুযায়ী','Based on sale rate per piece'); }
  if (profitEl) {
    profitEl.value = profit.toFixed(2);
    profitEl.style.color = profit < 0 ? 'var(--danger, #c0392b)' : '';
  }
  if (hintEl) hintEl.textContent = profit < 0 ? t('ক্ষতি — ', 'Loss — ') + hint : hint;
};

/* ============================================================
   ১৩.৯৮) একত্রিত ক্রয় ভাউচার — Purchase Invoice + Purchase Return
   একই ফর্মে, টাইপ ড্রপডাউন দিয়ে সুইচ করা যাবে
   ============================================================ */
async function renderPurchaseVoucherPage(content, defaultType) {
  defaultType = defaultType || 'PurchaseInvoice';
  content.innerHTML = `
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="ক্রয় ভাউচার" data-en="Purchase Voucher">${t('ক্রয় ভাউচার','Purchase Voucher')}</h1>
        <p class="i18n" data-bn="ক্রয় ও ক্রয় ফেরত — একই জায়গা থেকে" data-en="Purchase and purchase return — from one place">${t('ক্রয় ও ক্রয় ফেরত — একই জায়গা থেকে','Purchase and purchase return — from one place')}</p>
      </div>
      <button class="btn btn-primary i18n" style="width:auto;" id="pvAddBtn" data-bn="+ নতুন যোগ করুন" data-en="+ Add New">${t('+ নতুন যোগ করুন','+ Add New')}</button></div>
    <div class="panel"><div id="pvTableWrap"></div></div>`;

  async function loadList() {
    const [invoices, returns, suppliers, users] = await Promise.all([
      api('list', { sheet:'PurchaseInvoice' }), api('list', { sheet:'PurchaseReturn' }),
      cachedList('Suppliers'), cachedList('Users')
    ]);
    const supMap = {}; suppliers.forEach(function (s) { supMap[s.SupplierID] = s.CompanyName || s.Name; });
    const purMap = {}; users.forEach(function (u) { purMap[u.UserID] = u.FullName; });

    const merged = invoices.filter(function (r) { return r.Status !== 'Deleted'; }).map(function (r) {
      return { type:'PurchaseInvoice', typeLabel:['ক্রয় ভাউচার','Purchase Voucher'], id:r.PIID, date:r.InvoiceDate, supplierId:r.SupplierID, walkInName:r.WalkInPartyName, purchaserId:r.PurchaserID, amount:r.TotalAmount, status:r.Status };
    }).concat(returns.filter(function (r) { return r.Status !== 'Deleted'; }).map(function (r) {
      return { type:'PurchaseReturn', typeLabel:['ক্রয় ফেরত ভাউচার','Purchase Return Voucher'], id:r.PRetID, date:r.Date, supplierId:r.SupplierID, purchaserId:r.PurchaserID, amount:null, status:r.Status };
    }));
    merged.sort(function (a, b) { return String(a.date||'').localeCompare(String(b.date||'')); });

    const wrap = document.getElementById('pvTableWrap');
    if (!wrap) return;
    if (merged.length === 0) {
      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এখনো কোনো ভাউচার তৈরি হয়নি।" data-en="No vouchers created yet.">${t('এখনো কোনো ভাউচার তৈরি হয়নি।','No vouchers created yet.')}</div>`;
      return;
    }

    const headers = [['টাইপ','Type'],['ভাউচার নম্বর','Voucher No'],['তারিখ','Date'],['সাপ্লায়ার','Supplier'],['ক্রয়কারী','Purchaser'],['মূল্য','Amount'],['অবস্থা','Status']];
    const headCells = headers.map(function (h) { return `<th class="i18n" data-bn="${h[0]}" data-en="${h[1]}">${t(h[0], h[1])}</th>`; }).join('');
    const bodyRows = merged.slice().reverse().map(function (r) {
      const isPosted = r.status === 'Posted';
      const postBtn = !isPosted
        ? `<button class="btn" style="width:auto;padding:6px 12px;font-size:12px;" onclick='postPurchaseVoucherRecord(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})'>${t('পোস্ট করুন','Post')}</button>`
        : '';
      const editBtn = !isPosted
        ? `<button onclick='openPurchaseVoucherForm(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('সম্পাদনা','Edit')}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="m18.5 2.5 3 3L10 17l-4 1 1-4Z"/></svg>
          </button>`
        : '';
      const deleteBtn = !isPosted
        ? `<button onclick='deletePurchaseVoucherRecord(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('ডিলিট','Delete')}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
          </button>`
        : (currentUser && currentUser.RoleID === 'ROLE-ADMIN'
            ? `<button onclick='deletePostedPurchaseVoucher(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('এডমিন ডিলিট (পাসওয়ার্ড লাগবে)','Admin delete (password required)')}" style="color:var(--danger);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </button>`
            : '');
      const previewBtn = `<button onclick='openPrintableVoucherView(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('প্রিভিউ/প্রিন্ট/শেয়ার','Preview/Print/Share')}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        </button>`;
      return `<tr ondblclick='openPurchaseVoucherForm(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' style="cursor:pointer;" title="${t('এডিট করতে ডাবল-ক্লিক করুন','Double-click to edit')}">
        <td>${t(r.typeLabel[0], r.typeLabel[1])}</td><td>${escapeHtml(r.id)}</td><td>${escapeHtml(r.date)}</td>
        <td>${escapeHtml(r.supplierId === 'SUP-CASH' && r.walkInName ? ('নগদ (' + r.walkInName + ')') : (supMap[r.supplierId] || r.supplierId))}</td><td>${escapeHtml(purMap[r.purchaserId] || '—')}</td>
        <td>${r.amount !== null ? Number(r.amount).toFixed(2) : '—'}</td>
        <td>${isPosted ? `<span class="badge active">${t('পোস্ট করা','Posted')}</span>` : `<span class="badge draft">${t('খসড়া','Draft')}</span>`}</td>
        <td class="row-actions" onclick="event.stopPropagation();">${postBtn}${previewBtn}${editBtn}${deleteBtn}</td>
      </tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}<th></th></tr></thead><tbody>${bodyRows}</tbody></table>`;
  }

  await loadList();
  window.__refreshPurchaseVoucherList = loadList;
  document.getElementById('pvAddBtn').addEventListener('click', function () { openPurchaseVoucherForm(defaultType, null); });
}

async function postPurchaseVoucherRecord(docType, docId) {
  if (!confirm(t('আপনি কি নিশ্চিত এই ভাউচার পোস্ট করতে চান? পোস্ট হয়ে গেলে স্টক/লেজারে এন্ট্রি পড়বে এবং এটা আর বাতিল করা যাবে না।','Are you sure you want to post this voucher? Once posted, stock/ledger entries will be created and this cannot be undone.'))) return;
  try {
    await api('postDocument', { docType: docType, docId: docId });
    showToast(t('পোস্ট হয়েছে ✅','Posted ✅'), 'success');
    if (window.__refreshPurchaseVoucherList) await window.__refreshPurchaseVoucherList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function deletePurchaseVoucherRecord(docType, docId) {
  if (!confirm(t('আপনি কি নিশ্চিত এই ভাউচার ডিলিট করতে চান?','Are you sure you want to delete this voucher?'))) return;
  const config = docType === 'PurchaseReturn'
    ? { sheet:'PurchaseReturn', idField:'PRetID' }
    : { sheet:'PurchaseInvoice', idField:'PIID' };
  try {
    await api('delete', { sheet: config.sheet, idField: config.idField, idValue: docId });
    showToast(t('ডিলিট হয়েছে ✅','Deleted ✅'), 'success');
    if (window.__refreshPurchaseVoucherList) await window.__refreshPurchaseVoucherList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function deletePostedPurchaseVoucher(docType, docId) {
  const config = docType === 'PurchaseReturn'
    ? { sheet:'PurchaseReturn', idField:'PRetID', linesSheet:'PR_Return_Lines', lineIdField:'PRetID' }
    : { sheet:'PurchaseInvoice', idField:'PIID', linesSheet:'PI_Lines', lineIdField:'PIID' };
  await deletePostedVoucherWithAdminAuth(docType, docId, config.sheet, config.idField, config.linesSheet, config.lineIdField, window.__refreshPurchaseVoucherList);
}

/** প্রিভিউ/প্রিন্ট/শেয়ার — একটা প্রিন্ট-উপযোগী ভাউচার নতুন ট্যাবে খুলবে।
 *  "পেজ সেটাপ" ব্রাউজারের নিজস্ব প্রিন্ট ডায়ালগেই থাকে (কাগজের সাইজ/মার্জিন) —
 *  আলাদা করে কাস্টম বানানো সম্ভব না, তাই সেই বাটনও প্রিন্ট ডায়ালগেই নিয়ে যায়। */
async function openPrintableVoucherView(docType, docId, opts) {
  opts = opts || {};   // { challan: দর ও মূল্য ছাড়া চালান, autoPrint: খুলেই প্রিন্ট }
  const isSales = docType === 'SalesInvoice' || docType === 'SalesReturn';
  const isReturn = docType === 'PurchaseReturn' || docType === 'SalesReturn';

  const cfg = isSales
    ? { headerSheet: isReturn ? 'SalesReturn' : 'SalesInvoice', idField: isReturn ? 'SRID' : 'SIID', linesSheet: isReturn ? 'SR_Lines' : 'SI_Lines', lineIdField: isReturn ? 'SRID' : 'SIID' }
    : { headerSheet: isReturn ? 'PurchaseReturn' : 'PurchaseInvoice', idField: isReturn ? 'PRetID' : 'PIID', linesSheet: isReturn ? 'PR_Return_Lines' : 'PI_Lines', lineIdField: isReturn ? 'PRetID' : 'PIID' };
  const headerSheet = cfg.headerSheet, idField = cfg.idField, linesSheet = cfg.linesSheet, lineIdField = cfg.lineIdField;

  const [doc, parties, personRefs, items, units, groups, categories, company] = await Promise.all([
    api('getDocument', { headerSheet: headerSheet, idField: idField, linesSheet: linesSheet, lineIdField: lineIdField, idValue: docId }),
    isSales ? cachedList('Customers') : cachedList('Suppliers'),
    cachedList('Users'),
    cachedList('Items'), cachedList('UOM'),
    cachedList('ItemGroups'), cachedList('Categories'),
    api('getSingleton', { sheet:'CompanyProfile' })
  ]);
  const header = doc.header, lines = doc.lines;
  const partyIdField = isSales ? 'CustomerID' : 'SupplierID';
  const party = parties.find(function (p) { return p[partyIdField] === header[partyIdField]; });
  const personIdField = isSales ? 'SalespersonID' : 'PurchaserID';
  const personNameField = 'FullName';
  const person = personRefs.find(function (p) { return p.UserID === header[personIdField]; });
  const itemMap = {}; items.forEach(function (i) { itemMap[i.ItemID] = i; });
  const unitMap = {}; units.forEach(function (u) { unitMap[u.UOMID] = u.UOMName; });
  const groupMap = {}; groups.forEach(function (g) { groupMap[g.GroupID] = g.GroupName; });
  const catMap = {}; categories.forEach(function (c) { catMap[c.CategoryID] = c.CategoryName; });

  // পশ্চিমা (0-9) সংখ্যাকে বাংলা অঙ্কে (০-৯) বদলে দেয় — প্রিন্ট ভাউচারের সব সংখ্যা বাংলায় দেখানোর জন্য
  function bn(num) {
    const map = { '0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯' };
    return String(num).replace(/[0-9]/g, function (d) { return map[d]; });
  }

  // আইটেম | পরিমাণ (একক-সহ) | দর | মূল্য — একক আলাদা কলামে না, পরিমাণের পাশেই
  let totalQty = 0, totalValue = 0, totalComm = 0, totalNet = 0;
  const hasComm = lines.some(function (l) { return Number(l.CommissionAmount) > 0; });
  const rowsHtml = lines.map(function (l) {
    const item = itemMap[l.ItemID] || {};
    const qty = Number(l.Quantity) || 0, rate = Number(l.Rate) || 0, amt = qty * rate;
    const unitLabel = unitMap[item.UOMID] || '';
    const commRate = Number(l.CommissionRate) || 0;
    const commAmt = Number(l.CommissionAmount) || 0;
    const netAmt = (l.NetAmount !== null && l.NetAmount !== undefined) ? Number(l.NetAmount) : (amt - commAmt);
    totalQty += qty; totalValue += amt; totalComm += commAmt; totalNet += netAmt;

    return `<tr>
      <td>${escapeHtml(item.ItemName || l.ItemID)}</td>
      <td>${bn(qty)} ${escapeHtml(unitLabel)}</td>
      <td>${bn(rate.toFixed(2))}</td>
      <td>${bn(amt.toFixed(2))}</td>
      ${hasComm ? `<td>${bn(commRate)}%</td><td>${bn(commAmt.toFixed(2))}</td><td><b>${bn(netAmt.toFixed(2))}</b></td>` : ''}
    </tr>`;
  }).join('');

  const titleMap = {
    PurchaseInvoice: ['ক্রয় ভাউচার', 'Purchase Voucher'],
    PurchaseReturn: ['ক্রয় ফেরত ভাউচার', 'Purchase Return Voucher'],
    SalesInvoice: ['বিক্রয় ভাউচার', 'Sales Voucher'],
    SalesReturn: ['বিক্রয় ফেরত ভাউচার', 'Sales Return Voucher']
  };
  const titleBn = titleMap[docType][0], titleEn = titleMap[docType][1];
  const voucherDate = header.InvoiceDate || header.Date || '';
  const printedAt = formatPrintDate();
  const printedAtEn = formatPrintDate();
  const partyLabelBn = isSales ? 'গ্রাহক' : 'সাপ্লায়ার', partyLabelEn = isSales ? 'Customer' : 'Supplier';
  const personLabelBn = isSales ? 'বিক্রয়কারী' : 'ক্রয়কারী', personLabelEn = isSales ? 'Salesperson' : 'Purchaser';
  const isCashParty = header[partyIdField] === 'SUP-CASH' || header[partyIdField] === 'CUS-CASH';
  // নগদ (ওয়াক-ইন) পার্টির ক্ষেত্রে মাস্টার রেকর্ডের (সাধারণত খালি) তথ্যের বদলে,
  // ভাউচারেই সেভ করা আসল ওয়াক-ইন পার্টির নাম/ঠিকানা/মোবাইল দেখানো হবে
  const partyName = isCashParty
    ? (header.WalkInPartyName ? ('নগদ (' + header.WalkInPartyName + ')') : (party ? (party.CompanyName || party.Name) : header[partyIdField]))
    : (party ? (party.CompanyName || party.Name) : header[partyIdField]);
  const partyAddress = isCashParty ? (header.WalkInPartyAddress || '') : (party ? (party.Address || '') : '');
  const partyZone = party ? (party.Zone || '') : '';
  const partyPhone = isCashParty ? (header.WalkInPartyMobile || '') : (party ? (party.Phone || '') : '');

  // DB থেকে আসা lines-কে buildVoucherTableBody যে আকারে চায় (qty/rate/commRate ইত্যাদি) সেভাবে সাজানো
  const shapedLines = lines.map(function (l) {
    const qty = Number(l.Quantity) || 0, rate = Number(l.Rate) || 0, amt = qty * rate;
    const commAmt = Number(l.CommissionAmount) || 0;
    const pieceItem = /পিস|pcs|piece/i.test(unitMap[(itemMap[l.ItemID] || {}).UOMID] || '');
    const qKg = pieceItem ? (Number(l.QtyKg) || 0) : (Number(l.QtyKg) || qty), qPc = pieceItem ? qty : (Number(l.QtyPcs) || 0);
    return {
      itemId: l.ItemID, qty: qty, rate: rate, amount: amt,
      qtyKg: qKg, qtyPcs: qPc, rateKg: Number(l.RateKg) || 0, ratePc: Number(l.RatePc) || 0,
      costRate: (l.CostRate !== null && l.CostRate !== undefined) ? (Number(l.CostRate) || 0) : (Number((itemMap[l.ItemID] || {}).StandardCost) || 0),

      netAmount: (l.NetAmount !== null && l.NetAmount !== undefined) ? Number(l.NetAmount) : (amt - commAmt)
    };
  });

  // পূর্বের বকেয়া = এই ভাউচারের লেজার-এন্ট্রির ঠিক আগের ব্যালেন্স (পোস্ট না হলে বর্তমান ব্যালেন্স)
  let prevBalance = 0;
  if (!isCashParty && header[partyIdField]) {
    try {
      const pType = isSales ? 'Customer' : 'Supplier';
      const { data: own } = await supabaseClient.from('PartyLedger').select('id').eq('PartyType', pType).eq('PartyID', header[partyIdField]).eq('RefID', docId).order('id', { ascending: true }).limit(1);
      let q = supabaseClient.from('PartyLedger').select('Balance').eq('PartyType', pType).eq('PartyID', header[partyIdField]);
      if (own && own[0]) q = q.lt('id', own[0].id);
      const { data: prev } = await q.order('id', { ascending: false }).limit(1);
      prevBalance = (prev && prev[0]) ? Number(prev[0].Balance) || 0 : 0;
    } catch (e) { prevBalance = 0; }
  }

  if (opts.challan) {   // চালানঃ আইটেম ও পরিমাণ (কেজি/পিস) — দর, মূল্য আর টাকার কোনো হিসাব নেই
    let tKg = 0, tPc = 0;
    const cRows = lines.map(function (l, i) {
      const it = itemMap[l.ItemID] || {}, piece = /পিস|pcs|piece/i.test(unitMap[it.UOMID] || ''), q = Number(l.Quantity) || 0;
      const kg = piece ? (Number(l.QtyKg) || 0) : q, pc = piece ? q : (Number(l.QtyPcs) || 0); tKg += kg; tPc += pc;
      return `<tr><td>${bn(i + 1)}</td><td style="text-align:left;">${escapeHtml(it.ItemName || l.ItemID)}</td><td>${kg ? bn(+kg.toFixed(3)) : '—'}</td><td>${pc ? bn(pc) : '—'}</td></tr>`;

    const cName = (company && (company.CompanyName || company.Name)) || 'জি মেটাল ওয়ার্কস';
    const ch = `<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>চালান — ${escapeHtml(docId)}</title>

  table{width:100%;border-collapse:collapse;} th,td{border:1px solid #9aa2ad;padding:6px 8px;text-align:center;} th{background:#eef0f3;} tfoot td{font-weight:700;background:#f6f7f9;}

  <div class="meta"><div>চালান নংঃ <b>${escapeHtml(docId)}</b></div><div style="text-align:right;">তারিখঃ <b>${bn(formatShortDate(voucherDate))}</b></div>
    <div>${escapeHtml(partyLabelBn)}ঃ <b>${escapeHtml(String(partyName || ''))}</b></div><div style="text-align:right;">${escapeHtml(partyZone || '')}${partyPhone ? ' · ' + escapeHtml(partyPhone) : ''}</div></div>
  <table><thead><tr><th>ক্রঃ</th><th>আইটেম</th><th>পরিমাণ (কেজি)</th><th>পরিমাণ (পিস)</th></tr></thead><tbody>${cRows}</tbody>
    <tfoot><tr><td colspan="2" style="text-align:right;">মোটঃ</td><td>${tKg ? bn(+tKg.toFixed(3)) : '—'}</td><td>${tPc ? bn(tPc) : '—'}</td></tr></tfoot></table>
  <div class="signs"><div>${isSales ? 'গ্রহণকারীর স্বাঃ' : 'প্রেরকের স্বাঃ'}</div><div>বাহকের স্বাঃ</div><div>গুদাম রক্ষকের স্বাঃ</div></div>
  ${opts.autoPrint ? '<script>window.addEventListener("load",function(){setTimeout(function(){window.print();},400);});<\/script>' : ''}
</body></html>`;
    const cw = window.open('', '_blank');
    if (!cw) { showToast(t('পপ-আপ ব্লক হয়েছে — এই সাইটের জন্য পপ-আপ অনুমতি দিন।','Pop-up was blocked — please allow pop-ups for this site.'), 'error'); return; }
    cw.document.write(ch); cw.document.close(); return;
  }

  const voucherTableBody = buildVoucherBodyScreenPrint({
    vatRate: Number(header.VatRate) || 0, vatAmount: Number(header.VatAmount) || 0,
    isCashParty: isCashParty, prevDue: isSales ? prevBalance : -prevBalance,
    cashPaid: Number(isSales ? header.CashReceivedAmount : header.CashPaidAmount) || 0,
    bankPaid: Number(isSales ? header.BankReceivedAmount : header.BankPaidAmount) || 0,

/** পুরো সফটওয়্যারের সাধারণ কীবোর্ড নিয়ম (কম্পিউটারে দ্রুত কাজের জন্য):
 *  • Enter  = পরের ঘরে যাওয়া; শেষ ঘরে Enter চাপলে ওই অংশের সেভ বাটনে ফোকাস — আবার Enter চাপলেই সেভ
 *  • Escape = আগের ঘরে ফেরা; প্রথম ঘরে থাকলে (পপআপে) পপআপ বন্ধ
 *  নাম খোঁজার তালিকা খোলা থাকলে Enter সেই তালিকার নাম বাছাই করে, Escape তালিকা বন্ধ করে। */
(function installGlobalKeyNav() {
  if (window.__globalKeyNav) return; window.__globalKeyNav = true;
  function isField(el) {
    if (!el || el.disabled || el.readOnly && el.tagName !== 'SELECT') return false;
    if (el.tagName === 'SELECT' || el.tagName === 'TEXTAREA') return true;
    if (el.tagName !== 'INPUT') return false;
    return ['checkbox','radio','file','button','submit','hidden','range','color'].indexOf(el.type) === -1;
  }
  function visible(el) { return !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length) && getComputedStyle(el).visibility !== 'hidden'; }
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== 'Escape') return;
    if (e.defaultPrevented || e.ctrlKey || e.altKey || e.metaKey || e.isComposing) return;
    const el = document.activeElement;
    if (!el || el.closest('[data-keynav]')) return;
    if (document.querySelector('.hr-sug')) return; // নাম খোঁজার তালিকা নিজে সামলায়
    const modalOpen = document.getElementById('modalOverlay') && document.getElementById('modalOverlay').classList.contains('show');
    if (e.key === 'Escape' && modalOpen && !isField(el)) { e.preventDefault(); const c = document.getElementById('modalCancelBtn'); if (c) c.click(); return; }
    const scope = el.closest('#modalBody') || (modalOpen ? null : el.closest('#pageContent'));
    if (!scope) {
      if (e.key === 'Escape' && modalOpen && !el.closest('input,select,textarea')) { e.preventDefault(); const c = document.getElementById('modalCancelBtn'); if (c) c.click(); }
      return;
    }
    if (!isField(el)) return;
    if (el.tagName === 'TEXTAREA' && e.key === 'Enter') return; // লেখার বক্সে Enter = নতুন লাইন
    const fields = Array.prototype.filter.call(scope.querySelectorAll('input, select, textarea'), function (x) { return isField(x) && visible(x); });
    const i = fields.indexOf(el); if (i === -1) return;
    e.preventDefault();
    if (e.key === 'Enter') {
      const next = fields[i + 1];
      if (next) { next.focus(); if (next.select && next.tagName === 'INPUT') try { next.select(); } catch (er) {} return; }
      // শেষ ঘর — সেভ বাটনে
      const save = (scope.id === 'modalBody' ? document.getElementById('modalSaveBtn') : null) ||
        Array.prototype.find.call(scope.querySelectorAll('button.btn-primary'), function (b) { return visible(b) && !b.disabled; });
      if (save) save.focus();
    } else {
      const prev = fields[i - 1];
      if (prev) { prev.focus(); if (prev.select && prev.tagName === 'INPUT') try { prev.select(); } catch (er) {} }
      else if (scope.id === 'modalBody') { const c = document.getElementById('modalCancelBtn'); if (c) c.click(); }
    }
  }, true);
})();

/** ডেস্কটপে যেকোনো ফর্মে Enter চাপলে পরের ইনপুট ফিল্ডে, Escape চাপলে আগের
 *  ফিল্ডে ফোকাস যাবে — শুধু দৃশ্যমান ও সক্রিয় (disabled নয়) input/select/textarea
 *  ধরে, checkbox বাদ দিয়ে (checkbox নিজের স্বাভাবিক Space/click আচরণ রাখবে)। */
function wireSequentialKeyNav(container) {
  if (!container) return;
  container.dataset.keynav = '1'; // এই অংশের নিজস্ব নিয়ম আছে — সাধারণ নিয়ম এখানে কাজ করবে না
  function focusable() {
    return Array.from(container.querySelectorAll('input, select, textarea')).filter(function (el) {
      return !el.disabled && el.type !== 'checkbox' && el.offsetParent !== null && !el.classList.contains('dmy-shadow');   // লুকানো আসল তারিখ-ঘর বাদ
    });
  }
  function handler(e) {
    if (e.key !== 'Enter' && e.key !== 'Escape') return;
    if (!document.body.contains(container)) { document.removeEventListener('keydown', handler, true); return; }
    if (!container.contains(document.activeElement)) return;
    if (document.activeElement.tagName === 'TEXTAREA' && e.key === 'Enter') return; // টেক্সট-এরিয়াতে Enter মানে নতুন লাইন
    const fields = focusable();
    const idx = fields.indexOf(document.activeElement);
    if (idx === -1) return;
    e.preventDefault();
    if (e.key === 'Enter') {
      const next = fields[idx + 1];
      if (next) next.focus();
    } else {
      const prev = fields[idx - 1];
      if (prev) prev.focus();
    }
  }
  document.addEventListener('keydown', handler, true);
}

  const [parties, items, units] = await Promise.all([cachedList(K.partySheet), cachedList('Items'), cachedList('UOM')]);
  const pName = {}; parties.forEach(function (p) { pName[p[K.partyId]] = p.CompanyName || p.Name; });
  const itemMap = {}; items.forEach(function (i) { itemMap[i.ItemID] = i; });
  let rows = [];
  for (const ty of K.types) {
    const hs = (await safe(supabaseClient.from(ty[0]).select('*'))).filter(function (h) { return h.Status !== 'Deleted'; });
    hs.forEach(function (h) { rows.push({ dt: ty[0], id: h[ty[1]], date: h[ty[2]] || h.Date || h.InvoiceDate || '', party: h.WalkInPartyName ? t('নগদ', 'Cash') + ' (' + h.WalkInPartyName + ')' : (pName[h[K.partyId]] || h[K.partyId] || ''), total: Number(h.TotalAmount) || 0, posted: h.Status === 'Posted', label: ty[4], linesSheet: ty[3], idf: ty[1] }); });
  }
  rows.sort(function (a, b) { return String(b.date).localeCompare(String(a.date)) || String(b.id).localeCompare(String(a.id), undefined, { numeric: true }); });
  rows = rows.slice(0, 40);
  if (mode === 'challan') {   // চালানঃ পরিমাণ (কেজি/পিস)
    for (const ty of K.types) {
      const ids = rows.filter(function (r) { return r.dt === ty[0]; }).map(function (r) { return r.id; });

    wide: true,
    onSave: async function () {
      const supplierId = val('pv3_SupplierID');
      if (!supplierId) throw new Error(t('সাপ্লায়ার তথ্য আবশ্যক।','Supplier information is required.'));

      const hasPurchase = window.__pv3PurchaseLines.length > 0;
      const hasReturn = window.__pv3ReturnLines.length > 0;
      if (!hasPurchase && !hasReturn) throw new Error(t('অন্তত একটা ক্রয় বা ফেরত লাইন যোগ করুন।','Add at least one purchase or return line.'));

      const isCash = supplierId === 'SUP-CASH';
      const common = {
        SupplierID: supplierId,
        SupplierInvoiceNo: document.getElementById('pv3_SNNoCheck').checked ? (val('pv3_SupplierInvoiceNo') || null) : null,
        SupplierInvoiceDate: document.getElementById('pv3_SNDateCheck').checked ? (val('pv3_SupplierInvoiceDate') || null) : null,
        PurchaserID: currentUser ? currentUser.UserID : null
      };

      if (hasPurchase) {
        const warehouseId = window.__pv3PurchaseLines[0].warehouseId;
        if (!warehouseId) throw new Error(t('ক্রয় লাইনে গুদাম আবশ্যক।','Warehouse is required for purchase lines.'));
        const lineData = window.__pv3PurchaseLines.map(function (l) { return { ItemID: l.itemId, Quantity: l.qty, QtyKg: l.qtyKg || 0, QtyPcs: l.qtyPcs || 0, RateKg: l.rateKg || 0, RatePc: l.ratePc || 0, RateBasis: l.rateBasis || null, Rate: l.rate, Amount: l.amount, CommissionRate: l.commRate || 0, CommissionAmount: l.commAmount || 0, NetAmount: l.netAmount !== undefined ? l.netAmount : l.amount }; });
        const itemsTotal = lineData.reduce(function (s, l) { return s + (Number(l.Amount) || 0); }, 0);
        const cashExpenseAmount = (window.__pv3CashExpense && window.__pv3CashExpense.amount) || 0;
        const discountAmount = Number(val('pv3_DiscAmount')) || 0;
        // পার্টির হিসাবে বসবে কমিশন বাদ দিয়ে নিট মূল্য + খরচ − ডিসকাউন্ট + ভ্যাট — প্রিন্টের "সর্বমোট"-এর সাথে মিলবে
        const netItemsTotal = lineData.reduce(function (s, l) { return s + (Number(l.NetAmount) || 0); }, 0);
        const vat = window.__pv3GetVat ? window.__pv3GetVat() : { rate: 0, amount: 0 };
        const totalAmount = netItemsTotal + cashExpenseAmount - discountAmount + vat.amount;
        const cashExpenseBreakdown = Object.keys((window.__pv3CashExpense && window.__pv3CashExpense.subAmounts) || {})
          .map(function (catId) { const cat = window.__pv3ExpenseCategories.find(function (c) { return c.ExpCatID === catId; }); const amt = window.__pv3CashExpense.subAmounts[catId]; return (cat && amt > 0) ? (cat.ExpCatName + ': ৳' + amt) : null; })
          .filter(Boolean).join(', ');
        const headerData = Object.assign({}, common, {
          InvoiceDate: val('pv3_Date'), WarehouseID: warehouseId, TotalAmount: totalAmount,
          CashExpenseAmount: cashExpenseAmount || null,
          CashExpenseCategory: null,

          DiscountAmount: discountAmount || null,

          WalkInPartyName: isCash ? (val('pv3_CashName') || null) : null,
          WalkInPartyAddress: isCash ? (val('pv3_CashAddress') || null) : null,

        });
        // এই মুহূর্তে শুধু পেমেন্টের তথ্য হেডারে সেভ হচ্ছে — আসল লেজার/ব্যাংক-বই পোস্টিং
        // ঘটবে ভাউচারটা "পোস্ট করুন" চাপার সময়, যাতে ড্রাফট অবস্থায় হিসাব না বসে

          headerData.BankPaidAmount = Number(val('pv3_BankPaidAmount')) || 0;
          if (headerData.BankPaidAmount > 0 && !pv3BankPopupFilled) {
            throw new Error(t('ব্যাংক প্রদানের বিবরণ (পপআপে) পূরণ করুন।','Fill in the bank payment details (in the popup).'));
          }
          headerData.BankPaidNote = val('pv3_BankPaidNote') || null;
          const bankPayMethod = val('pv3_BankPayMethod');
          if (headerData.BankPaidAmount > 0 && bankPayMethod === 'OurBankToSupplierBank') {
            const ourBankId = val('pv3_BankAccID');
            if (!ourBankId) throw new Error(t('আমাদের কোন ব্যাংক থেকে টাকা গেল, সেটা বাছাই করুন।','Select which of our banks the money was sent from.'));
            headerData.BankAccIDForPayment = ourBankId;
          } else if (headerData.BankPaidAmount > 0) {
            headerData.BankAccIDForPayment = 'BC-CASH'; // নগদ টু সাপ্লায়ার ব্যাংক — আমাদের ক্যাশ অ্যাকাউন্ট থেকে যাবে
          } else {
            headerData.BankAccIDForPayment = null;
          }
        }

        if (isEdit && existingDocType === 'PurchaseInvoice') {
          await api('updateDocument', { headerSheet:'PurchaseInvoice', idField:'PIID', linesSheet:'PI_Lines', lineIdField:'PIID', idValue: existingId, headerData: headerData, lines: lineData });
        } else {
          await api('createDocument', { headerSheet:'PurchaseInvoice', idField:'PIID', idPrefix:'PI', requiredFields:['SupplierID','WarehouseID'], linesSheet:'PI_Lines', lineIdField:'PIID', headerData: headerData, lines: lineData });
        }
      }

      if (hasReturn) {

    // ডেস্কটপে কীবোর্ড দিয়ে দ্রুত চলাচল: Enter = পরের ঘর, Escape = আগের ঘর
    // document-এ capture-phase-এ শোনা হচ্ছে যাতে <select>-এর নিজস্ব কীবোর্ড
    // আচরণ (কোনো কোনো ব্রাউজারে) মাঝপথে আটকে না দেয়; পপআপ বন্ধ হলে সরিয়ে ফেলা হয়
    function focusableFields() {
      return Array.from(overlay.querySelectorAll('[data-order]')).filter(function (el) { return el.offsetParent !== null; });

    function keyNavHandler(e) {
      if (e.key !== 'Enter' && e.key !== 'Escape') return;
      if (!overlay.contains(document.activeElement)) return;
      const fields = focusableFields();
      const curIdx = fields.indexOf(document.activeElement);
      if (curIdx === -1) return;
      e.preventDefault();
      e.stopPropagation();
      if (e.key === 'Enter') {
        const next = fields[curIdx + 1];
        if (next) { next.focus(); } else { document.getElementById('pv3_PopConfirm').click(); }
      } else {
        const prev = fields[curIdx - 1];
        if (prev) prev.focus(); else document.getElementById('pv3_PopCancel').click();
      }
    }

  // ভ্যাট — চেকবক্স দিয়ে ঐচ্ছিক। % লিখলে পরিমাণ নিজে থেকে হিসাব হবে (নিট মোটের উপর),
  // আর চাইলে পরিমাণের ঘরে সরাসরি অংক লেখা যাবে — তখন সেটাই থাকবে, % দিয়ে আর বদলাবে না
  window.__pv3VatManual = !!(rec.VatAmount && !rec.VatRate);
  function pv3VatBase() {
    const net = window.__pv3PurchaseLines.reduce(function (s, l) { return s + (Number(l.netAmount !== undefined ? l.netAmount : l.amount) || 0); }, 0);
    const exp = (window.__pv3CashExpense && window.__pv3CashExpense.amount) || 0;
    return net + exp - (Number(val('pv3_DiscAmount')) || 0);
  }
  window.__pv3GetVat = function () {
    if (!document.getElementById('pv3_VatCheck').checked) return { rate: 0, amount: 0 };
    const rate = Number(val('pv3_VatRate')) || 0;
    let amount = Number(val('pv3_VatAmount')) || 0;
    if (!window.__pv3VatManual && rate > 0) {
      amount = Math.round(pv3VatBase() * rate) / 100;
      document.getElementById('pv3_VatAmount').value = amount || '';
    }
    return { rate: rate, amount: amount };
  };
  document.getElementById('pv3_VatCheck').addEventListener('change', function () {
    document.getElementById('pv3_VatWrap').style.display = this.checked ? 'flex' : 'none';
    if (this.checked) window.__pv3GetVat();
  });

  function collectCurrentLine() {

        <td>${r.amount !== null ? Number(r.amount).toFixed(2) : '—'}</td>

  }

  await loadList();
  window.__refreshSalesVoucherList = loadList;

}

async function postSalesVoucherRecord(docType, docId) {
  if (!confirm(t('আপনি কি নিশ্চিত এই ভাউচার পোস্ট করতে চান? পোস্ট হয়ে গেলে স্টক/লেজারে এন্ট্রি পড়বে এবং এটা আর বাতিল করা যাবে না।','Are you sure you want to post this voucher? Once posted, stock/ledger entries will be created and this cannot be undone.'))) return;
  try {
    await api('postDocument', { docType: docType, docId: docId });
    showToast(t('পোস্ট হয়েছে ✅','Posted ✅'), 'success');
    if (window.__refreshSalesVoucherList) await window.__refreshSalesVoucherList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function deleteSalesVoucherRecord(docType, docId) {
  if (!confirm(t('আপনি কি নিশ্চিত এই ভাউচার ডিলিট করতে চান?','Are you sure you want to delete this voucher?'))) return;
  const config = docType === 'SalesReturn'
    ? { sheet:'SalesReturn', idField:'SRID' }
    : { sheet:'SalesInvoice', idField:'SIID' };
  try {
    await api('delete', { sheet: config.sheet, idField: config.idField, idValue: docId });
    showToast(t('ডিলিট হয়েছে ✅','Deleted ✅'), 'success');
    if (window.__refreshSalesVoucherList) await window.__refreshSalesVoucherList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function deletePostedSalesVoucher(docType, docId) {
  const config = docType === 'SalesReturn'
    ? { sheet:'SalesReturn', idField:'SRID', linesSheet:'SR_Lines', lineIdField:'SRID' }
    : { sheet:'SalesInvoice', idField:'SIID', linesSheet:'SI_Lines', lineIdField:'SIID' };
  await deletePostedVoucherWithAdminAuth(docType, docId, config.sheet, config.idField, config.linesSheet, config.lineIdField, window.__refreshSalesVoucherList);
}

      if (!customerId) throw new Error(t('গ্রাহক তথ্য আবশ্যক।','Customer information is required.'));

      const hasSale = window.__sv3SaleLines.length > 0;
      const hasReturn = window.__sv3ReturnLines.length > 0;
      if (!hasSale && !hasReturn) throw new Error(t('অন্তত একটা বিক্রয় বা ফেরত লাইন যোগ করুন।','Add at least one sale or return line.'));

      const isCash = customerId === 'CUS-CASH';
      const common = {
        CustomerID: customerId,
        SalespersonID: currentUser ? currentUser.UserID : null
      };

      if (hasSale) {
        const warehouseId = window.__sv3SaleLines[0].warehouseId;
        if (!warehouseId) throw new Error(t('বিক্রয় লাইনে গুদাম আবশ্যক।','Warehouse is required for sale lines.'));
        const lineData = window.__sv3SaleLines.map(function (l) { return { ItemID: l.itemId, Quantity: l.qty, QtyKg: l.qtyKg || 0, QtyPcs: l.qtyPcs || 0, RateKg: l.rateKg || 0, RatePc: l.ratePc || 0, RateBasis: l.rateBasis || null, Rate: l.rate, Amount: l.amount, CommissionRate: l.commRate || 0, CommissionAmount: l.commAmount || 0, NetAmount: l.netAmount !== undefined ? l.netAmount : l.amount, CostRate: l.costRate || 0 }; });
        const itemsTotal = lineData.reduce(function (s, l) { return s + (Number(l.Amount) || 0); }, 0);
        const cashExpenseAmount = (window.__sv3CashExpense && window.__sv3CashExpense.amount) || 0;
        const discountAmount = Number(val('sv3_DiscAmount')) || 0;
        // পার্টির হিসাবে বসবে কমিশন বাদ দিয়ে নিট মূল্য + খরচ − ডিসকাউন্ট + ভ্যাট — প্রিন্টের "সর্বমোট"-এর সাথে মিলবে
        const netItemsTotal = lineData.reduce(function (s, l) { return s + (Number(l.NetAmount) || 0); }, 0);
        const vat = window.__sv3GetVat ? window.__sv3GetVat() : { rate: 0, amount: 0 };
        const totalAmount = netItemsTotal + cashExpenseAmount - discountAmount + vat.amount;
        const cashExpenseBreakdown = Object.keys((window.__sv3CashExpense && window.__sv3CashExpense.subAmounts) || {})
          .map(function (catId) { const cat = window.__sv3ExpenseCategories.find(function (c) { return c.ExpCatID === catId; }); const amt = window.__sv3CashExpense.subAmounts[catId]; return (cat && amt > 0) ? (cat.ExpCatName + ': ৳' + amt) : null; })
          .filter(Boolean).join(', ');
        const headerData = Object.assign({}, common, {
          InvoiceDate: val('sv3_Date'), WarehouseID: warehouseId, TotalAmount: totalAmount,
          CashExpenseAmount: cashExpenseAmount || null,
          CashExpenseCategory: null,
          CashExpenseNote: cashExpenseBreakdown || null,
          DiscountAmount: discountAmount || null,
          VatRate: vat.amount ? (vat.rate || null) : null,
          VatAmount: vat.amount || null,
          ManualVoucherDate: document.getElementById('sv3_ManualDateCheck').checked ? (val('sv3_ManualVoucherDate') || null) : null,
          ManualVoucherNo: document.getElementById('sv3_ManualNoCheck').checked ? (val('sv3_ManualVoucherNo') || null) : null,
          WalkInPartyName: isCash ? (val('sv3_CashName') || null) : null,
          WalkInPartyAddress: isCash ? (val('sv3_CashAddress') || null) : null,
          WalkInPartyMobile: isCash ? (val('sv3_CashMobile') || null) : null
        });
        if (!isCash) {
          headerData.CashReceivedAmount = Number(val('sv3_CashReceivedAmount')) || 0;
          headerData.CashReceivedNote = val('sv3_CashReceivedNote') || null;
          headerData.BankReceivedAmount = Number(val('sv3_BankReceivedAmount')) || 0;
          if (headerData.BankReceivedAmount > 0 && !sv3BankPopupFilled) {
            throw new Error(t('ব্যাংকে গ্রহণের বিবরণ (পপআপে) পূরণ করুন।','Fill in the bank receipt details (in the popup).'));
          }
          headerData.BankReceivedNote = val('sv3_BankReceivedNote') || null;
          headerData.BankAccIDForReceipt = headerData.BankReceivedAmount > 0 ? (val('sv3_BankAccID') || null) : null;
        }

        if (isEdit && existingDocType === 'SalesInvoice') {
          await api('updateDocument', { headerSheet:'SalesInvoice', idField:'SIID', linesSheet:'SI_Lines', lineIdField:'SIID', idValue: existingId, headerData: headerData, lines: lineData });
        } else {
          await api('createDocument', { headerSheet:'SalesInvoice', idField:'SIID', idPrefix:'SI', requiredFields:['CustomerID','WarehouseID'], linesSheet:'SI_Lines', lineIdField:'SIID', headerData: headerData, lines: lineData });
        }
      }

      if (hasReturn) {
        const warehouseId = window.__sv3ReturnLines[0].warehouseId;
        if (!warehouseId) throw new Error(t('ফেরত লাইনে গুদাম আবশ্যক।','Warehouse is required for return lines.'));
        const lineData = window.__sv3ReturnLines.map(function (l) { return { ItemID: l.itemId, Quantity: l.qty, QtyKg: l.qtyKg || 0, QtyPcs: l.qtyPcs || 0, RateKg: l.rateKg || 0, RatePc: l.ratePc || 0, RateBasis: l.rateBasis || null, Rate: l.rate, CommissionRate: l.commRate || 0, CommissionAmount: l.commAmount || 0, NetAmount: l.netAmount !== undefined ? l.netAmount : l.amount, CostRate: l.costRate || 0 }; });
        const headerData = Object.assign({}, common, { Date: val('sv3_Date'), WarehouseID: warehouseId });
        if (isEdit && existingDocType === 'SalesReturn') {
          await api('updateDocument', { headerSheet:'SalesReturn', idField:'SRID', linesSheet:'SR_Lines', lineIdField:'SRID', idValue: existingId, headerData: headerData, lines: lineData });
        } else {
          await api('createDocument', { headerSheet:'SalesReturn', idField:'SRID', idPrefix:'SR', requiredFields:['CustomerID','WarehouseID'], linesSheet:'SR_Lines', lineIdField:'SRID', headerData: headerData, lines: lineData });
        }
      }

      showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
      if (window.__refreshSalesVoucherList) await window.__refreshSalesVoucherList();
      // সেভ হলেঃ নতুন খালি ভাউচার খোলে, নিচে ভাউচার তালিকা (সদ্য সেভ করাটা চিহ্নিত)
      window.__vAfterSave = { kind: 'sales', at: Date.now(), editId: isEdit ? existingId : ((window.__lastCreatedDoc && window.__lastCreatedDoc.id) || null) };
      setTimeout(function () { openSalesVoucherForm('SalesInvoice'); }, 350);
    }
  });

  function showTab(tab) {

    const entryPanel = document.getElementById('sv3_TabEntryPanel'), previewPanel = document.getElementById('sv3_TabPreviewPanel');

      entryBtn.style.borderBottomColor = 'var(--amber)'; entryBtn.style.color = 'var(--text)';

  function wireRevealCheckbox(checkId, fieldId) {
    const check = document.getElementById(checkId), field = document.getElementById(fieldId);
    function sync() {
      field.disabled = !check.checked;
      field.style.display = check.checked ? '' : 'none';
      if (!check.checked) field.value = '';
    }
    check.addEventListener('change', sync);
    sync();
  }
  wireRevealCheckbox('sv3_ManualDateCheck', 'sv3_ManualVoucherDate');
  wireRevealCheckbox('sv3_ManualNoCheck', 'sv3_ManualVoucherNo');
  wireRevealCheckbox('sv3_StdSalesCheck', 'sv3_PreviewStdSalesRate');
  wireSequentialKeyNav(document.getElementById('sv3_TabEntryPanel'));
  wireVoucherDual('sv3');
  voucherBottomWire('sv3', 'sales', renderFullPreview);   // নিচেঃ লাইভ প্রিভিউ · ভাউচার তালিকা · চালান তালিকা

  function refreshSv3CustomerOptions() {
    const zoneChecked = document.getElementById('sv3_ZoneCheck').checked;
    const zone = zoneChecked ? val('sv3_ZoneFilter') : '';
    const sel = document.getElementById('sv3_CustomerID');
    Array.from(sel.options).forEach(function (opt) {
      if (!opt.value) return;
      opt.hidden = !!(zone && opt.getAttribute('data-zone') !== zone);
    });
    if (zone && sel.options[sel.selectedIndex] && sel.options[sel.selectedIndex].hidden) { sel.value = ''; sel.dispatchEvent(new Event('change')); }
  }
  document.getElementById('sv3_ZoneCheck').addEventListener('change', function () {
    document.getElementById('sv3_ZoneFilter').disabled = !this.checked;
    refreshSv3CustomerOptions();
  });
  document.getElementById('sv3_ZoneFilter').addEventListener('change', refreshSv3CustomerOptions);

  // লেখা যাবে; টিক দিলে নিচে খাত-ভিত্তিক ভাঙন দেখা যাবে এবং প্রতিটা খাতের
  // পরিমাণ যোগ হয়ে এই উপরের ঘরেই স্বয়ংক্রিয়ভাবে বসে যাবে
  function sv3RecalcExpenseTotal() {
    if (!document.getElementById('sv3_ExpCheck').checked) return; // ম্যানুয়াল মোডে থাকলে হাত দেওয়া হবে না
    const rows = document.querySelectorAll('#sv3_ExpSubWrap [data-exp-amount]');
    let sum = 0;
    rows.forEach(function (inp) { sum += Number(inp.value) || 0; });
    document.getElementById('sv3_ExpTotalAmount').value = sum || '';
  }

  function sv3RenderExpSubRows() {
    const wrap = document.getElementById('sv3_ExpSubWrap');
    const amounts = window.__sv3CashExpense.subAmounts || {};
    wrap.innerHTML = `
      <div style="border:1px solid var(--border);border-radius:8px;padding:10px;">
        <div id="sv3_ExpSubRows"></div>
        <button type="button" id="sv3_ExpAddCatBtn" class="btn btn-outline" style="width:100%;margin-top:6px;padding:6px;font-size:12px;">➕ ${t('নতুন সাবখাত','New Sub-category')}</button>
      </div>`;
    const rowsWrap = document.getElementById('sv3_ExpSubRows');
    function renderRows() {
      rowsWrap.innerHTML = window.__sv3ExpenseCategories.map(function (c) {
        const amt = amounts[c.ExpCatID] || '';
        return `<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;" data-cat-id="${attr(c.ExpCatID)}">
          <input data-exp-name value="${attr(c.ExpCatName)}" style="flex:1.4;">
          <input data-exp-amount type="number" step="any" value="${amt}" placeholder="৳" style="flex:1;">
          <button type="button" data-exp-save class="btn btn-outline" style="width:auto;padding:5px 8px;" title="${t('নাম সেভ করুন','Save name')}">💾</button>
          <button type="button" data-exp-del class="btn btn-outline" style="width:auto;padding:5px 8px;" title="${t('মুছুন','Delete')}">🗑️</button>
        </div>`;
      }).join('') || `<div style="color:var(--text-muted);font-size:12px;padding:4px 0;">${t('কোনো সাবখাত নেই — নিচে থেকে যোগ করুন।','No sub-categories yet — add one below.')}</div>`;

      rowsWrap.querySelectorAll('[data-exp-amount]').forEach(function (inp) {
        inp.addEventListener('input', function () {
          const catId = this.closest('[data-cat-id]').getAttribute('data-cat-id');
          window.__sv3CashExpense.subAmounts[catId] = Number(this.value) || 0;
          sv3RecalcExpenseTotal();
        });
      });
      rowsWrap.querySelectorAll('[data-exp-save]').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          const row = this.closest('[data-cat-id]');
          const catId = row.getAttribute('data-cat-id');
          const nameInput = row.querySelector('[data-exp-name]');
          const newName = nameInput.value.trim();
          if (!newName) { showToast(t('খাতের নাম দিন।','Enter a category name.'), 'error'); return; }
          try {
            await api('update', { sheet:'ExpenseCategories', idField:'ExpCatID', idValue: catId, data:{ ExpCatName: newName } });
            const cat = window.__sv3ExpenseCategories.find(function (c) { return c.ExpCatID === catId; });
            if (cat) cat.ExpCatName = newName;
            showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
          } catch (err) { showToast(err.message, 'error'); }
        });
      });
      rowsWrap.querySelectorAll('[data-exp-del]').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          const row = this.closest('[data-cat-id]');
          const catId = row.getAttribute('data-cat-id');
          if (!confirm(t('এই সাবখাতটা মুছে ফেলতে চান?','Delete this sub-category?'))) return;
          try {
            await api('delete', { sheet:'ExpenseCategories', idField:'ExpCatID', idValue: catId });
            window.__sv3ExpenseCategories = window.__sv3ExpenseCategories.filter(function (c) { return c.ExpCatID !== catId; });
            delete window.__sv3CashExpense.subAmounts[catId];
            renderRows();
            sv3RecalcExpenseTotal();
            showToast(t('মুছে ফেলা হয়েছে ✅','Deleted ✅'), 'success');
          } catch (err) { showToast(err.message, 'error'); }
        });
      });
    }
    renderRows();

    document.getElementById('sv3_ExpAddCatBtn').addEventListener('click', async function () {
      const name = prompt(t('নতুন সাবখাতের নাম লিখুন:','Enter new sub-category name:'));
      if (!name || !name.trim()) return;
      try {
        const rec2 = await api('create', { sheet:'ExpenseCategories', idField:'ExpCatID', idPrefix:'EXPCAT', requiredFields:['ExpCatName'], data:{ ExpCatName: name.trim() } });
        window.__sv3ExpenseCategories.push(rec2);
        renderRows();
        showToast(t('সাবখাত যোগ হয়েছে ✅','Sub-category added ✅'), 'success');
      } catch (err) { showToast(err.message, 'error'); }
    });
  }

    function focusableFields() {
      return Array.from(overlay.querySelectorAll('[data-order]')).filter(function (el) { return el.offsetParent !== null; });
    }
    function keyNavHandler(e) {
      if (e.key !== 'Enter' && e.key !== 'Escape') return;
      if (!overlay.contains(document.activeElement)) return;
      const fields = focusableFields();
      const curIdx = fields.indexOf(document.activeElement);
      if (curIdx === -1) return;
      e.preventDefault();
      e.stopPropagation();
      if (e.key === 'Enter') {
        const next = fields[curIdx + 1];
        if (next) { next.focus(); } else { document.getElementById('sv3_PopConfirm').click(); }
      } else {
        const prev = fields[curIdx - 1];
        if (prev) prev.focus(); else document.getElementById('sv3_PopCancel').click();
