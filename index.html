    document.getElementById('sv3_CommRate').value = '';
    document.getElementById('sv3_CommAmount').value = '';
    document.getElementById('sv3_NetLineAmount').value = '';
  }

  function collectCurrentLine() {
    const itemId = val('sv3_ItemID');
    const warehouseId = val('sv3_WarehouseID');
    const qty = Number(val('sv3_Qty')) || 0;
    const rate = Number(val('sv3_Rate')) || 0;
    if (!itemId) { showToast(t('আইটেম বাছাই করুন।','Select an item.'), 'error'); return null; }
    if (!warehouseId) { showToast(t('গুদাম বাছাই করুন।','Select a warehouse.'), 'error'); return null; }
    if (!(qty > 0 && rate > 0)) { showToast(t('পরিমাণ ও দর দিন।','Enter quantity and rate.'), 'error'); return null; }
    const amount = Math.round(qty * rate);
    const useComm = document.getElementById('sv3_CommCheck').checked;
    const commRate = useComm ? (Number(val('sv3_CommRate')) || 0) : 0;
    const commAmount = useComm ? Number((amount * commRate / 100).toFixed(2)) : 0;
    const costRate = Number((window.__sv3ItemMap[itemId] || {}).StandardCost) || 0;
    return { itemId: itemId, warehouseId: warehouseId, qty: qty, rate: rate, amount: amount, commRate: commRate, commAmount: commAmount, netAmount: useComm ? Number((amount - commAmount).toFixed(2)) : amount, costRate: costRate };
  }

  document.getElementById('sv3_ConfirmSaleCheck').addEventListener('change', function () {
    if (!this.checked) return;
    const line = collectCurrentLine();
    if (!line) { this.checked = false; return; }
    window.__sv3SaleLines.push(line);
    resetLineEntry();
    this.checked = false;
    renderRightSummary();
    showToast(t('বিক্রয় লাইন যোগ হয়েছে ✅','Sale line added ✅'), 'success');
  });
  document.getElementById('sv3_AddReturnLineBtn').addEventListener('click', function () {
    const line = collectCurrentLine();
    if (!line) return;
    window.__sv3ReturnLines.push(line);
    resetLineEntry();
    renderRightSummary();
    showToast(t('বিক্রয় ফেরত লাইন যোগ হয়েছে ✅','Sale return line added ✅'), 'success');
  });

  window.__sv3RemoveSaleLine = function (i) { window.__sv3SaleLines.splice(i, 1); renderRightSummary(); renderFullPreview(); };
  window.__sv3RemoveReturnLine = function (i) { window.__sv3ReturnLines.splice(i, 1); renderRightSummary(); renderFullPreview(); };

  function renderRightSummary() {
    document.getElementById('sv3_PreviewStockQty').value = window.__sv3LastStockQty;
    document.getElementById('sv3_PreviewStockRate').value = window.__sv3LastStockRate;
  }

  function miniLinesTable(lines, removeFnName, showComm) {
    if (lines.length === 0) return `<div style="color:var(--text-muted);padding:8px 0;">${t('কোনো লাইন নেই।','No lines.')}</div>`;
    const rows = lines.map(function (l, i) {
      const item = window.__sv3ItemMap[l.itemId] || {};
      return `<tr>
        <td>${i + 1}</td><td>${escapeHtml(item.ItemName || l.itemId)}</td>
        <td style="text-align:right;">${l.qty}</td><td style="text-align:right;">${l.rate}</td><td style="text-align:right;"><b>${l.amount}</b></td>
        ${showComm ? `<td style="text-align:right;">${l.commRate || 0}</td><td style="text-align:right;">${(l.commAmount||0).toFixed ? l.commAmount.toFixed(2) : l.commAmount}</td><td style="text-align:right;"><b>${(l.netAmount!==undefined?l.netAmount:l.amount).toFixed ? l.netAmount.toFixed(2) : l.netAmount}</b></td>` : ''}
        <td><button type="button" onclick="${removeFnName}(${i})" style="border:none;background:none;cursor:pointer;color:var(--danger);">✕</button></td>
      </tr>`;
    }).join('');
    return `<table style="width:100%;border-collapse:collapse;font-size:12px;">
      <thead><tr style="border-bottom:1px solid var(--border);"><th style="text-align:left;">${t('ক্রঃ','No.')}</th><th style="text-align:left;">${t('আইটেম','Item')}</th><th style="text-align:right;">${t('পরিমাণ','Qty')}</th><th style="text-align:right;">${t('দর','Rate')}</th><th style="text-align:right;">${t('মূল্য','Amt')}</th>${showComm ? `<th style="text-align:right;">${t('কমিঃ','Comm.')}</th><th style="text-align:right;">${t('(-)কমিঃ','(-)Comm.')}</th><th style="text-align:right;">${t('নিট মূল্য','Net Amt')}</th>` : ''}<th></th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }

  async function buildDraftPrintHtml() {
    const customerId = val('sv3_CustomerID');
    const isCash = customerId === 'CUS-CASH';
    const custRec = window.__sv3CustomerMap[customerId];
    const custName = isCash ? ('নগদ' + (val('sv3_CashName') ? ' (' + val('sv3_CashName') + ')' : '')) : (custRec ? (custRec.CompanyName || custRec.Name) : '—');
    const custZone = isCash ? '' : ((custRec && custRec.Zone) || '');
    const custAddress = isCash ? val('sv3_CashAddress') : ((custRec && custRec.Address) || '');
    const custPhone = isCash ? val('sv3_CashMobile') : ((custRec && custRec.Phone) || '');
    const company = await api('getSingleton', { sheet:'CompanyProfile' });
    const cashExpenseAmt = (window.__sv3CashExpense && window.__sv3CashExpense.amount) || 0;
    const discountAmt = Number(val('sv3_DiscAmount')) || 0;
    const manualDate = document.getElementById('sv3_ManualDateCheck').checked ? val('sv3_ManualVoucherDate') : '';
    const manualNo = document.getElementById('sv3_ManualNoCheck').checked ? val('sv3_ManualVoucherNo') : '';

    const draftVat = window.__sv3GetVat ? window.__sv3GetVat() : { rate: 0, amount: 0 };
    return buildVoucherTableHtml({
      titleBn: 'বিক্রয় ভাউচার', company: company,
      voucherDate: val('sv3_Date'), voucherNo: t('অটো তৈরি হবে','Auto'),
      manualDate: manualDate, manualNo: manualNo,
      partyLabelBn: 'গ্রাহক নামঃ', partyName: custName, partyZone: custZone, partyAddress: custAddress, partyPhone: custPhone,
      mainLines: window.__sv3SaleLines, mainLabel: 'বিক্রয়', mainTotalLabel: 'মোটঃ বিক্রয়ঃ',
      returnLines: window.__sv3ReturnLines, returnLabel: 'বিক্রয় ফেরত পণ্যঃ', returnTotalLabel: 'মোটঃ ফেরতঃ',
      itemMap: window.__sv3ItemMap, cashExpenseAmt: cashExpenseAmt, discountAmt: discountAmt,
      vatRate: draftVat.rate, vatAmount: draftVat.amount,
      isCashParty: isCash, prevDue: isCash ? 0 : (window.__sv3PartyBalance || 0),
      cashPaid: isCash ? 0 : (Number(val('sv3_CashReceivedAmount')) || 0), bankPaid: isCash ? 0 : (Number(val('sv3_BankReceivedAmount')) || 0),
      payCashLabel: 'নগদ গ্রহণঃ', payBankLabel: 'ব্যাংকে গ্রহণঃ',
      withProfit: true, showProfit: document.getElementById('sv3_ShowProfitCheck').checked,
      sign1: 'ক্রেতার স্বাঃ', sign3Label: 'বিক্রয়কারী স্বাঃ', isDraft: true
    });
  }

  async function renderFullPreview() {
    const wrap = document.getElementById('sv3_LivePreviewBody');
    if (!wrap) return;
    if (window.__sv3SaleLines.length === 0 && window.__sv3ReturnLines.length === 0) {
      wrap.innerHTML = `<div class="empty-state">${t('অন্তত একটা লাইন যোগ করলে প্রিভিউ দেখা যাবে।','Add at least one line to see the preview.')}</div>`;
      return;
    }
    const html = await buildDraftPrintHtml();
    wrap.innerHTML = `<iframe id="sv3_PreviewFrame" style="width:100%;height:70vh;border:1px solid var(--border);border-radius:8px;background:#fff;" srcdoc="${attr(html)}"></iframe>`;
  }

  function printDraftFrame() {
    const frame = document.getElementById('sv3_PreviewFrame');
    if (!frame || !frame.contentWindow) { showToast(t('প্রিন্ট করার জন্য অন্তত একটা লাইন যোগ করুন।','Add at least one line to print.'), 'error'); return; }
    frame.contentWindow.focus();
    frame.contentWindow.print();
  }
  async function shareDraft() {
    if (window.__sv3SaleLines.length === 0 && window.__sv3ReturnLines.length === 0) {
      showToast(t('শেয়ার করার জন্য অন্তত একটা লাইন যোগ করুন।','Add at least one line to share.'), 'error');
      return;
    }
    const saleTotal = window.__sv3SaleLines.reduce(function (s, l) { return s + (Number(l.amount) || 0); }, 0);
    const returnTotal = window.__sv3ReturnLines.reduce(function (s, l) { return s + (Number(l.amount) || 0); }, 0);
    const cashExpenseAmt = (window.__sv3CashExpense && window.__sv3CashExpense.amount) || 0;
    const discountAmt = Number(val('sv3_DiscAmount')) || 0;
    const text = 'বিক্রয় ভাউচার — নিট মোট: ৳ ' + (saleTotal + cashExpenseAmt - discountAmt - returnTotal).toFixed(2);
    if (navigator.share) {
      try { await navigator.share({ title: 'বিক্রয় ভাউচার', text: text }); } catch (e) {}
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(text);
      showToast(t('তথ্য ক্লিপবোর্ডে কপি হয়েছে।','Copied to clipboard.'), 'success');
    }
  }
  document.getElementById('sv3_LivePageSetupBtn').addEventListener('click', printDraftFrame);
  document.getElementById('sv3_ShowProfitCheck').addEventListener('change', renderFullPreview);
  document.getElementById('sv3_LivePrintBtn').addEventListener('click', printDraftFrame);
  document.getElementById('sv3_LiveShareBtn').addEventListener('click', shareDraft);

  renderRightSummary();
  showTab('entry');
}

/* ============================================================
   জেনেরিক DOCUMENT ইঞ্জিন — Header+Lines থাকা বাকি সব ডকুমেন্ট
   (PR, PO, GRN, MaterialIssue, StockTransfer, StockAdjust, SO, DC,
   BOM, PMI, FGR, JV) এই একটামাত্র ইঞ্জিন দিয়ে চলে।
   ============================================================ */
async function renderDocumentListPage(content, config) {
  const records = await api('list', { sheet: config.headerSheet });

  content.innerHTML = `
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="${attr(config.titleBn)}" data-en="${attr(config.titleEn)}">${t(config.titleBn, config.titleEn)}</h1>
        <p class="i18n" data-bn="${attr(config.subBn)}" data-en="${attr(config.subEn)}">${t(config.subBn, config.subEn)}</p>
      </div>
      <button class="btn btn-primary i18n" style="width:auto;" id="docAddBtn" data-bn="+ নতুন যোগ করুন" data-en="+ Add New">${t('+ নতুন যোগ করুন','+ Add New')}</button></div>
    <div class="panel"><div id="docTableWrap"></div></div>`;

  function renderTable(list) {
    const wrap = document.getElementById('docTableWrap');
    if (!wrap) return; // ব্যবহারকারী এই ফাঁকে অন্য পেজ/ট্যাবে চলে গেলে এই এলিমেন্ট আর DOM-এ থাকবে না
    const active = list.filter(function (r) { return r.Status !== 'Deleted'; });
    if (active.length === 0) {
      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এখনো কোনো এন্ট্রি নেই।" data-en="No entries yet.">${t('এখনো কোনো এন্ট্রি নেই।','No entries yet.')}</div>`;
      return;
    }
    const headCells = config.listColumns.map(function (c) { return `<th class="i18n" data-bn="${attr(c.label)}" data-en="${attr(bnToEn(c.label))}">${t(c.label, bnToEn(c.label))}</th>`; }).join('');
    const bodyRows = active.slice().reverse().map(function (r) {
      const cells = config.listColumns.map(function (c) {
        let v = r[c.key];
        if (c.key === 'Status') {
          v = v === 'Posted' ? `<span class="badge active i18n" data-bn="পোস্ট করা" data-en="Posted">${t('পোস্ট করা','Posted')}</span>` : `<span class="badge draft i18n" data-bn="খসড়া" data-en="Draft">${t('খসড়া','Draft')}</span>`;
        } else if (c.key === 'TotalAmount') {
          v = v ? Number(v).toFixed(2) : '—';
        } else v = escapeHtml(v);
        return '<td>' + v + '</td>';
      }).join('');
      const editBtn = `<button onclick='openDocumentForm(${JSON.stringify(r[config.idField])})' title="${t('সম্পাদনা','Edit')}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="m18.5 2.5 3 3L10 17l-4 1 1-4Z"/></svg>
        </button>`;
      const postBtn = (config.postable && r.Status !== 'Posted')
        ? `<button class="btn" style="width:auto;padding:6px 12px;font-size:12px;" onclick='postDocumentRecord(${JSON.stringify(config.docType)}, ${JSON.stringify(r[config.idField])})'>${t('পোস্ট করুন','Post')}</button>`
        : '';
      return `<tr>${cells}<td class="row-actions">${postBtn}${editBtn}</td></tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}<th></th></tr></thead><tbody>${bodyRows}</tbody></table>`;
  }

  renderTable(records);
  document.getElementById('docAddBtn').addEventListener('click', function () { openDocumentForm(null); });
  window.__activeDocConfig = config;
  window.__refreshDocTable = async function () { renderTable(await api('list', { sheet: config.headerSheet })); };
}

async function openDocumentForm(existingId) {
  const config = window.__activeDocConfig;
  const isEdit = !!existingId;

  let existingHeader = null, existingLines = [];
  if (isEdit) {
    const doc = await api('getDocument', { headerSheet: config.headerSheet, idField: config.idField, linesSheet: config.linesSheet, lineIdField: config.lineIdField, idValue: existingId });
    existingHeader = doc.header;
    existingLines = doc.lines;
    if (existingHeader.Status === 'Posted') {
      showToast(t('পোস্ট হয়ে যাওয়া ডকুমেন্ট এডিট করা যাবে না।','A posted document cannot be edited.'), 'error');
      return;
    }
  }

  // হেডার ও লাইন ফিল্ডের সব FK ড্রপডাউনের ডেটা একসাথে (parallel) আনা হচ্ছে
  const allFkFields = config.headerFields.concat(config.lineFields).filter(function (f) { return f.type === 'select-fk'; });
  const uniqueFkSheets = Array.from(new Set(allFkFields.map(function (f) { return f.fkSheet; })));
  const fkSheetMap = await cachedListMultiple(uniqueFkSheets);
  const fkLists = {};
  allFkFields.forEach(function (f) { fkLists[f.key] = fkSheetMap[f.fkSheet]; });
  window.__docFkLists = fkLists;
  window.__docConfig = config;

  function fieldInputHtml(f, prefix, currentVal) {
    const id = prefix + f.key;
    if (f.type === 'select-fk') {
      const opts = (fkLists[f.key] || []).filter(function (r) { return r.Status !== 'Deleted'; })
        .map(function (r) { return `<option value="${attr(r[f.fkIdField])}" ${currentVal===r[f.fkIdField]?'selected':''}>${escapeHtml(r[f.fkLabel])}</option>`; }).join('');
      return `<select id="${id}" ${f.key==='ItemID'?'onchange="updateDocLineAmount(this)"':''}><option value="">—</option>${opts}</select>`;
    }
    if (f.type === 'number') return `<input id="${id}" type="number" step="any" value="${attr(currentVal)}" ${config.computeTotal?'oninput="recalcDocTotal()"':''}>`;
    if (f.type === 'date') return `<input id="${id}" type="date" value="${attr(currentVal)}">`;
    return `<input id="${id}" value="${attr(currentVal)}">`;
  }

  const headerHtml = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">` +
    config.headerFields.map(function (f) {
      return `<div class="field"><label>${f.label}</label>${fieldInputHtml(f, 'doc_h_', existingHeader ? existingHeader[f.key] : '')}</div>`;
    }).join('') + `</div>`;

  window.__docLineRows = isEdit ? existingLines.slice() : [{}];

  function renderDocLines() {
    const wrap = document.getElementById('doc_LinesWrap');
    if (!wrap) return;
    const headCells = config.lineFields.map(function (f) { return `<th>${f.label}</th>`; }).join('') + (config.computeTotal ? '<th>' + t('মূল্য','Amount') + '</th>' : '') + '<th></th>';
    const rows = window.__docLineRows.map(function (row, idx) {
      const cells = config.lineFields.map(function (f) {
        return `<td>${fieldInputHtml(f, 'doc_ln_' + idx + '_', row[f.key])}</td>`;
      }).join('');
      const amtCell = config.computeTotal ? `<td id="doc_ln_${idx}_amt" style="font-weight:600;">0.00</td>` : '';
      return `<tr>${cells}${amtCell}<td><button type="button" onclick="window.__removeDocLine(${idx})">✕</button></td></tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}</tr></thead><tbody>${rows}</tbody></table>`;
    if (config.computeTotal) recalcDocTotal();
  }
  window.__renderDocLines = renderDocLines;
  window.__removeDocLine = function (idx) { window.__docLineRows.splice(idx, 1); renderDocLines(); };

  const bodyHtml = headerHtml +
    `<h4 style="margin:20px 0 10px;font-size:13px;color:var(--text-muted);text-transform:uppercase;border-top:1px solid var(--border);padding-top:14px;">${t('লাইন আইটেম','Line Items')}</h4>
    <div id="doc_LinesWrap"></div>
    <button type="button" class="btn" style="width:auto;margin-top:8px;" id="doc_AddLineBtn">${t('+ লাইন যোগ করুন','+ Add Line')}</button>` +
    (config.computeTotal ? `<div style="margin-top:14px;font-size:15px;font-weight:700;text-align:right;">${t('মোট','Total')}: <span id="doc_GrandTotal">0.00</span></div>` : '');

  openModal({
    title: (isEdit ? t('সম্পাদনা — ','Edit — ') : t('নতুন — ','New — ')) + t(config.titleBn, config.titleEn),
    bodyHtml: bodyHtml,
    wide: true,
    onSave: async function () {
      const headerData = {};
      config.headerFields.forEach(function (f) { const v = val('doc_h_' + f.key); headerData[f.key] = ((f.type === 'select-fk' || f.type === 'number' || f.type === 'date') && v === '') ? null : v; });
      const missingHeader = config.headerFields.filter(function (f) { return f.required && !headerData[f.key]; });
      if (missingHeader.length > 0) throw new Error(missingHeader.map(function (f) { return f.label; }).join(', ') + ' আবশ্যক।');

      const lines = window.__docLineRows.map(function (_, idx) {
        const line = {};
        config.lineFields.forEach(function (f) { const v = val('doc_ln_' + idx + '_' + f.key); line[f.key] = ((f.type === 'select-fk' || f.type === 'number') && v === '') ? null : v; });
        if (config.computeTotal) {
          const qty = Number(line.Quantity) || 0, rate = Number(line.Rate) || 0;
          line.Amount = qty * rate;
        }
        return line;
      }).filter(function (l) {
        return Object.keys(l).some(function (k) { return l[k] !== '' && l[k] !== null && l[k] !== undefined; });
      });
      if (lines.length === 0) throw new Error(t('অন্তত একটা লাইন আইটেম যোগ করুন।','Add at least one line item.'));

      if (config.computeTotal) {
        headerData.TotalAmount = lines.reduce(function (s, l) { return s + (Number(l.Amount) || 0); }, 0);
      }

      const requiredFields = config.headerFields.filter(function (f) { return f.required; }).map(function (f) { return f.key; });
      if (isEdit) {
        await api('updateDocument', { headerSheet: config.headerSheet, idField: config.idField, linesSheet: config.linesSheet, lineIdField: config.lineIdField, idValue: existingId, headerData: headerData, lines: lines });
      } else {
        await api('createDocument', { headerSheet: config.headerSheet, idField: config.idField, idPrefix: config.idPrefix, requiredFields: requiredFields, linesSheet: config.linesSheet, lineIdField: config.lineIdField, headerData: headerData, lines: lines });
      }
      showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
      if (window.__refreshDocTable) await window.__refreshDocTable();
    }
  });

  document.getElementById('doc_AddLineBtn').addEventListener('click', function () { window.__docLineRows.push({}); renderDocLines(); });
  renderDocLines();
}

window.updateDocLineAmount = function () { if (window.__docConfig && window.__docConfig.computeTotal) recalcDocTotal(); };
window.recalcDocTotal = function () {
  if (!window.__docLineRows) return;
  let grand = 0;
  window.__docLineRows.forEach(function (_, idx) {
    const qty = Number(val('doc_ln_' + idx + '_Quantity')) || 0;
    const rate = Number(val('doc_ln_' + idx + '_Rate')) || 0;
    const amt = qty * rate;
    grand += amt;
    const amtEl = document.getElementById('doc_ln_' + idx + '_amt');
    if (amtEl) amtEl.textContent = amt.toFixed(2);
  });
  const grandEl = document.getElementById('doc_GrandTotal');
  if (grandEl) grandEl.textContent = grand.toFixed(2);
};

async function postDocumentRecord(docType, docId) {
  if (!confirm(t('আপনি কি নিশ্চিত এই ডকুমেন্ট পোস্ট করতে চান? পোস্ট হয়ে গেলে স্টক/লেজারে এন্ট্রি পড়বে এবং এটা আর বাতিল করা যাবে না।','Are you sure you want to post this document? Once posted, stock/ledger entries will be created and this cannot be undone.'))) return;
  try {
    await api('postDocument', { docType: docType, docId: docId });
    showToast(t('পোস্ট হয়েছে ✅','Posted ✅'), 'success');
    if (window.__refreshDocTable) await window.__refreshDocTable();
    if (window.__refreshSimpleVoucherList) await window.__refreshSimpleVoucherList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

    <div class="page-head"><div>
        <h1 class="i18n" data-bn="স্টক ওভারভিউ" data-en="Stock Overview">${t('স্টক ওভারভিউ','Stock Overview')}</h1>
        <p class="i18n" data-bn="নির্বাচিত সময়ের স্টক ইন/আউট এবং সামগ্রিক স্টক ব্যালেন্স" data-en="Stock in/out for the selected period and overall stock balance">${t('নির্বাচিত সময়ের স্টক ইন/আউট এবং সামগ্রিক স্টক ব্যালেন্স','Stock in/out for the selected period and overall stock balance')}</p>
      </div>
      <div style="display:flex;gap:8px;align-items:end;flex-wrap:wrap;">
        <div class="field" style="margin:0;"><label>${t('তারিখ থেকে','Date From')}</label><input type="date" id="so_DateFrom" value="${monthStart}"></div>
        <div class="field" style="margin:0;"><label>${t('তারিখ পর্যন্ত','Date To')}</label><input type="date" id="so_DateTo" value="${today}"></div>
        <button class="btn btn-primary" style="width:auto;" id="so_ApplyBtn">${t('প্রয়োগ করুন','Apply')}</button>
        <button class="btn btn-outline" style="width:auto;" id="so_PrintBtn">🖨️ ${t('A4 প্রিন্ট','A4 Print')}</button>
      </div>
    </div>
    <div class="panel"><div id="stockOverviewWrap" style="overflow-x:auto;"></div></div>`;

  const REF_LABEL = {
    'PurchaseInvoice': ['ক্রয় চালান','Purchase Invoice'], 'PurchaseReturn': ['ক্রয় ফেরত','Purchase Return'],
    'ProcessingVoucher-FG': ['প্রসেসিং (তৈরি পণ্য)','Processing (Finished Goods)'],
    'ProcessingVoucher-RM': ['প্রসেসিং (কাঁচামাল)','Processing (Raw Material)'],
    'ProcessingVoucher-ByProduct': ['প্রসেসিং (বাই-প্রডাক্ট)','Processing (By-Product)'],
    'SalesInvoice': ['বিক্রয় চালান','Sales Invoice'], 'SalesReturn': ['বিক্রয় ফেরত','Sales Return'],
    'MaterialIssue': ['মালামাল ইস্যু','Material Issue'],
    'StockTransfer-In': ['স্টক ট্রান্সফার (আগমন)','Stock Transfer (In)'], 'StockTransfer-Out': ['স্টক ট্রান্সফার (বহির্গমন)','Stock Transfer (Out)'],
    'StockAdjustment': ['স্টক সমন্বয়','Stock Adjustment'], 'Opening': ['ওপেনিং স্টক','Opening Stock']
  };

  function renderReport(fromDate, toDate) {
    const wrap = document.getElementById('stockOverviewWrap');
    if (!wrap) return;
    if (ledger.length === 0) {
      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এখনো কোনো স্টক মুভমেন্ট নেই।" data-en="No stock movement yet.">${t('এখনো কোনো স্টক মুভমেন্ট নেই।','No stock movement yet.')}</div>`;
      return;
    }

    // প্রতিটা আইটেম+গুদামের জন্য: রেঞ্জের ভেতরের ইন/আউট, আর "তারিখ পর্যন্ত" মোট ব্যালেন্স (শুরু থেকে হিসাব করে)
    // — এখন শুধু একটামাত্র পরিমাণ (আইটেমের নিজের এককে), কোনো আলাদা পিস-হিসাব নেই
    const combos = {};
    function comboKey(itemId, whId) { return itemId + '::' + whId; }
    ledger.forEach(function (l) {
      const key = comboKey(l.ItemID, l.WarehouseID);
      if (!combos[key]) combos[key] = { ItemID: l.ItemID, WarehouseID: l.WarehouseID, inQty:0, outQty:0, balQty:0 };
      const c = combos[key];
      if (l.Date <= toDate) { c.balQty += (Number(l.QtyIn)||0) - (Number(l.QtyOut)||0); }
      if (l.Date >= fromDate && l.Date <= toDate) {
        c.inQty += Number(l.QtyIn)||0;
        c.outQty += Number(l.QtyOut)||0;
      }
    });

    const rows = Object.values(combos).filter(function (c) { return c.inQty || c.outQty || c.balQty; });
    if (rows.length === 0) {
      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এই সময়ে কোনো স্টক মুভমেন্ট নেই।" data-en="No stock movement in this period.">${t('এই সময়ে কোনো স্টক মুভমেন্ট নেই।','No stock movement in this period.')}</div>`;
      return;
    }

    function group(qty, rate) {
      const value = qty * rate;
      return `<td style="text-align:center;">${qty ? qty.toFixed(3) : '—'}</td><td style="text-align:center;">${rate ? rate.toFixed(2) : '—'}</td>
        <td style="text-align:center;"><b>${value.toFixed(2)}</b></td>`;
    }

    const headHtml = `<tr>
        <th rowspan="2" style="text-align:center;vertical-align:middle;">${t('আইটেম','Item')}</th>
        <th rowspan="2" style="text-align:center;vertical-align:middle;">${t('একক','Unit')}</th>
        <th rowspan="2" style="text-align:center;vertical-align:middle;">${t('ওয়ারহাউজ','Warehouse')}</th>
        <th colspan="3" style="text-align:center;">${t('স্টক ইন','Stock In')}</th>
        <th colspan="3" style="text-align:center;">${t('স্টক আউট','Stock Out')}</th>
        <th colspan="3" style="text-align:center;">${t('স্টক ব্যালেন্স','Stock Balance')}</th>
        <th rowspan="2" style="text-align:center;vertical-align:middle;">${t('ভিউ','View')}</th>
      </tr>
      <tr>
        <th style="text-align:center;">${t('পরিমাণ','Quantity')}</th><th style="text-align:center;">${t('দর','Rate')}</th><th style="text-align:center;">${t('মূল্য','Value')}</th>
        <th style="text-align:center;">${t('পরিমাণ','Quantity')}</th><th style="text-align:center;">${t('দর','Rate')}</th><th style="text-align:center;">${t('মূল্য','Value')}</th>
        <th style="text-align:center;">${t('পরিমাণ','Quantity')}</th><th style="text-align:center;">${t('দর','Rate')}</th><th style="text-align:center;">${t('মূল্য','Value')}</th>
      </tr>`;

    const bodyRows = rows.map(function (c) {
      const item = itemMap[c.ItemID] || {};
      const rate = Number(item.StandardCost) || 0;
      const unitLabel = units.find(function (u) { return u.UOMID === item.UOMID; });
      return `<tr>
        <td>${escapeHtml(item.ItemName || c.ItemID)}</td><td>${escapeHtml(unitLabel ? unitLabel.UOMName : '')}</td><td>${escapeHtml(whMap[c.WarehouseID] || c.WarehouseID)}</td>
        ${group(c.inQty, rate)}
        ${group(c.outQty, rate)}
        ${group(c.balQty, rate)}
        <td style="text-align:center;"><button class="btn btn-outline" style="width:auto;padding:6px 12px;font-size:12px;" onclick='openStockItemVouchers(${JSON.stringify(c.ItemID)}, ${JSON.stringify(c.WarehouseID)}, ${JSON.stringify(fromDate)}, ${JSON.stringify(toDate)})'>${t('ভিউ','View')}</button></td>
      </tr>`;
    }).join('');

    wrap.innerHTML = `<table class="data-table" style="font-size:12px;"><thead>${headHtml}</thead><tbody>${bodyRows}</tbody></table>`;
  }

  window.__stockOverviewLedger = ledger;
  window.__stockOverviewRefLabel = REF_LABEL;

  renderReport(monthStart, today);
  document.getElementById('so_ApplyBtn').addEventListener('click', function () {
    renderReport(val('so_DateFrom'), val('so_DateTo'));
  });
  document.getElementById('so_PrintBtn').addEventListener('click', function () {
    openStockReportPrintView(val('so_DateFrom') || monthStart, val('so_DateTo') || today);
  });
}

/** নির্দিষ্ট আইটেম+গুদামের সব ভাউচার (উৎস মডিউলসহ) — "ভিউ" বাটনে ক্লিক করলে দেখাবে */
function openStockItemVouchers(itemId, warehouseId, fromDate, toDate) {
  const ledger = window.__stockOverviewLedger || [];
  const REF_LABEL = window.__stockOverviewRefLabel || {};
  const rows = ledger.filter(function (l) { return l.ItemID === itemId && l.WarehouseID === warehouseId && l.Date >= fromDate && l.Date <= toDate; })
    .sort(function (a, b) { return String(a.Date).localeCompare(String(b.Date)); });

  const bodyHtml = rows.length === 0
    ? `<div class="empty-state">${t('এই সময়ে কোনো ভাউচার নেই।','No vouchers in this period.')}</div>`
    : `<table class="data-table"><thead><tr>
        <th>${t('তারিখ','Date')}</th><th>${t('উৎস','Source')}</th><th>${t('রেফারেন্স','Reference')}</th>
        <th>${t('ইন','In')}</th><th>${t('আউট','Out')}</th>
      </tr></thead><tbody>
        ${rows.map(function (l) {
          const lbl = REF_LABEL[l.TransactionType] || [l.TransactionType, l.TransactionType];
          const inTxt = (Number(l.QtyIn)||0) ? (Number(l.QtyIn)||0) : '—';
          const outTxt = (Number(l.QtyOut)||0) ? (Number(l.QtyOut)||0) : '—';
          return `<tr><td>${escapeHtml(l.Date)}</td><td>${t(lbl[0],lbl[1])}</td><td>${escapeHtml(l.RefID)}</td><td>${inTxt}</td><td>${outTxt}</td></tr>`;
        }).join('')}
      </tbody></table>`;

  openModal({ title: t('ভাউচারের তালিকা','Voucher List'), bodyHtml: bodyHtml, wide: true, onSave: null });
  // এই ভিউ শুধু দেখার জন্য — সেভ বাটনের দরকার নেই, তাই লুকিয়ে দেওয়া হচ্ছে
  const saveBtn = document.getElementById('modalSaveBtn');
  if (saveBtn) saveBtn.style.display = 'none';
  document.getElementById('modalCloseBtn').addEventListener('click', function () { if (saveBtn) saveBtn.style.display = ''; }, { once: true });
}

/** A4 প্রিন্ট-উপযোগী ভার্সন — নতুন ট্যাবে খুলবে */
async function openStockReportPrintView(fromDate, toDate) {
  const [items, warehouses] = await Promise.all([cachedList('Items'), cachedList('Warehouses')]);
  const ledger = window.__stockOverviewLedger || await api('list', { sheet:'StockLedger' });
  const itemMap = {}; items.forEach(function (i) { itemMap[i.ItemID] = i; });
  const whMap = {}; warehouses.forEach(function (w) { whMap[w.WarehouseID] = w.WarehouseName; });

  const combos = {};
  ledger.forEach(function (l) {
    const key = l.ItemID + '::' + l.WarehouseID;
    if (!combos[key]) combos[key] = { ItemID: l.ItemID, WarehouseID: l.WarehouseID, inQty:0, outQty:0, balQty:0 };
    const c = combos[key];
    if (l.Date <= toDate) { c.balQty += (Number(l.QtyIn)||0) - (Number(l.QtyOut)||0); }
    if (l.Date >= fromDate && l.Date <= toDate) {
      c.inQty += Number(l.QtyIn)||0;
      c.outQty += Number(l.QtyOut)||0;
    }
  });
  const rows = Object.values(combos).filter(function (c) { return c.inQty || c.outQty || c.balQty; });

  function grp(qty, rate) {
    const value = qty * rate;
    return `<td>${qty ? qty.toFixed(3) : '—'}</td><td>${rate ? rate.toFixed(2) : '—'}</td><td>${value.toFixed(2)}</td>`;
  }
  const bodyRows = rows.map(function (c) {
    const item = itemMap[c.ItemID] || {};
    const rate = Number(item.StandardCost) || 0;
    return `<tr><td>${escapeHtml(item.ItemName || c.ItemID)}</td><td>${escapeHtml(whMap[c.WarehouseID] || c.WarehouseID)}</td>${grp(c.inQty,rate)}${grp(c.outQty,rate)}${grp(c.balQty,rate)}</tr>`;
  }).join('');

  const html = `<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>স্টক রিপোর্ট ${escapeHtml(fromDate)} - ${escapeHtml(toDate)}</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @page { size: A4 landscape; margin: 10mm; }
  body{font-family:'Hind Siliguri',sans-serif;font-size:10.5px;color:#1b1f27;}
  h1{font-size:16px;margin:0 0 4px;} p{margin:0 0 14px;color:#555;font-size:11px;}
  table{width:100%;border-collapse:collapse;}
  th,td{border:1px solid #ccc;padding:4px 5px;text-align:center;}
  th{background:#1a2029;color:#f2a33c;}
  .toolbar{margin-bottom:14px;}
  .toolbar button{font-size:13px;padding:8px 16px;border-radius:8px;border:1px solid #1a2029;background:#1a2029;color:#f2a33c;cursor:pointer;}
  @media print { .toolbar{display:none;} }
</style></head><body>
  <div class="toolbar"><button onclick="window.print()">🖨️ প্রিন্ট করুন</button></div>
  <h1>স্টক ইন/আউট/ব্যালেন্স রিপোর্ট</h1>
  <p>সময়কাল: ${escapeHtml(fromDate)} থেকে ${escapeHtml(toDate)}</p>
  <table>
    <thead>
      <tr><th rowspan="2">আইটেম</th><th rowspan="2">ওয়ারহাউজ</th><th colspan="3">স্টক ইন</th><th colspan="3">স্টক আউট</th><th colspan="3">স্টক ব্যালেন্স</th></tr>
      <tr>
        <th>পরিমাণ</th><th>দর</th><th>মূল্য</th>
        <th>পরিমাণ</th><th>দর</th><th>মূল্য</th>
        <th>পরিমাণ</th><th>দর</th><th>মূল্য</th>
      </tr>
    </thead>
    <tbody>${bodyRows}</tbody>
  </table>
</body></html>`;

  const win = window.open('', '_blank');
  if (!win) { showToast(t('পপ-আপ ব্লক হয়েছে — এই সাইটের জন্য পপ-আপ অনুমতি দিন।','Pop-up was blocked — please allow pop-ups for this site.'), 'error'); return; }
  win.document.write(html);
  win.document.close();

/** স্টক লেজার — একটা আইটেম বাছাই করলে সেই আইটেমের সব স্টক মুভমেন্ট (ইন/আউট) দেখাবে, চলমান ব্যালেন্সসহ */
async function renderStockLedger(content) {
  const items = await cachedList('Items');
  content.innerHTML = `
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="স্টক লেজার" data-en="Stock Ledger">${t('স্টক লেজার','Stock Ledger')}</h1>
        <p class="i18n" data-bn="একটা আইটেম বাছাই করে তার সব স্টক মুভমেন্ট দেখুন" data-en="Select an item to see all its stock movements">${t('একটা আইটেম বাছাই করে তার সব স্টক মুভমেন্ট দেখুন','Select an item to see all its stock movements')}</p>
      </div>
      <select id="slItemFilter" style="width:auto;min-width:220px;">
        <option value="">${t('— আইটেম বাছাই করুন —','— Select item —')}</option>
        ${items.filter(function(i){return i.Status!=='Deleted';}).map(function (i) { return `<option value="${attr(i.ItemID)}">${escapeHtml(i.ItemName)}</option>`; }).join('')}
      </select>
    </div>
    <div class="panel"><div id="slWrap"><div class="empty-state">${t('উপরে একটা আইটেম বাছাই করুন।','Select an item above.')}</div></div></div>`;

  document.getElementById('slItemFilter').addEventListener('change', async function (e) {
    const itemId = e.target.value;
    const wrap = document.getElementById('slWrap');
    if (!wrap) return; // ব্যবহারকারী এই ফাঁকে অন্য পেজ/ট্যাবে চলে গেলে এই এলিমেন্ট আর DOM-এ থাকবে না
    if (!itemId) { wrap.innerHTML = `<div class="empty-state">${t('উপরে একটা আইটেম বাছাই করুন।','Select an item above.')}</div>`; return; }
    wrap.innerHTML = `<div class="empty-state">${t('লোড হচ্ছে...','Loading...')}</div>`;

    const allMovements = await api('list', { sheet:'StockLedger' });
    const rows = allMovements.filter(function (m) { return m.ItemID === itemId; });
    if (rows.length === 0) { wrap.innerHTML = `<div class="empty-state">${t('কোনো মুভমেন্ট পাওয়া যায়নি।','No movements found.')}</div>`; return; }

    const headers = [['তারিখ','Date'],['গুদাম','Warehouse'],['রেফারেন্স','Reference'],['ইন','In'],['আউট','Out'],['ব্যালেন্স','Balance']];
    const headCells = headers.map(function (h) { return `<th>${t(h[0], h[1])}</th>`; }).join('');
    const bodyRows = rows.map(function (m) {
      return `<tr><td>${escapeHtml(m.Date)}</td><td>${escapeHtml(m.WarehouseID)}</td><td>${escapeHtml(m.RefModule)} — ${escapeHtml(m.RefID)}</td>
        <td>${Number(m.QtyIn||0) || '—'}</td><td>${Number(m.QtyOut||0) || '—'}</td><td><b>${m.Balance}</b></td></tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}</tr></thead><tbody>${bodyRows}</tbody></table>`;
  });
}

/** পার্টি লেজার — একটা কাস্টমার/সাপ্লায়ার বাছাই করলে তার সব হিসাব এন্ট্রি দেখাবে, চলমান ব্যালেন্সসহ।
 *  partyTypeFilter দিলে (যেমন 'Customer') শুধু সেই ধরনের পার্টি দেখাবে — নয়তো দুটোই দেখাবে। */
async function renderPartyLedger(content, partyTypeFilter) {
  const [customers, suppliers] = await Promise.all([cachedList('Customers'), cachedList('Suppliers')]);

  // "পার্টি" পেজ থেকে তৈরি হওয়া একই ব্যক্তি/প্রতিষ্ঠান Customers ও Suppliers —
  // দুই টেবিলেই আলাদা ID নিয়ে থাকে, কিন্তু একই "Code" শেয়ার করে। এখানে সেই
  // Code দিয়ে দুটোকে একত্র করে একটামাত্র নাম/অ্যাকাউন্ট হিসেবে দেখানো হচ্ছে।
  const combined = {}; // key: Code (বা কোড না থাকলে নিজের ID) → { name, customerId, supplierId, zone }
  if (!partyTypeFilter || partyTypeFilter === 'Customer') {
    customers.filter(function (c) { return c.Status !== 'Deleted'; }).forEach(function (c) {
      const key = c.Code || c.CustomerID;
      const label = c.CompanyName || c.Name;
      if (!combined[key]) combined[key] = { name: label, customerId: null, supplierId: null, zone: c.Zone || '' };
      combined[key].customerId = c.CustomerID;
      if (!combined[key].name) combined[key].name = label;
      if (!combined[key].zone) combined[key].zone = c.Zone || '';
    });
  }
  if (!partyTypeFilter || partyTypeFilter === 'Supplier') {
    suppliers.filter(function (s) { return s.Status !== 'Deleted'; }).forEach(function (s) {
      const key = s.Code || s.SupplierID;
      const label = s.CompanyName || s.Name;
      if (!combined[key]) combined[key] = { name: label, customerId: null, supplierId: null, zone: s.Zone || '' };
      combined[key].supplierId = s.SupplierID;
      if (!combined[key].name) combined[key].name = label;
      if (!combined[key].zone) combined[key].zone = s.Zone || '';
    });
  }
  const parties = Object.keys(combined).map(function (key) { return Object.assign({ key: key }, combined[key]); })
    .sort(function (a, b) { return String(a.name).localeCompare(String(b.name), 'bn'); });
  const zoneList = Array.from(new Set(parties.map(function (p) { return p.zone; }).filter(Boolean))).sort(function (a, b) { return String(a).localeCompare(String(b), 'bn'); });

  function partyOptionsHtml(list) {
    return list.map(function (p) { return `<option data-key="${attr(p.key)}" value="${escapeHtml(p.name)}${p.zone ? ' — ' + escapeHtml(p.zone) : ''}"></option>`; }).join('');
  }

  content.innerHTML = `
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="${partyTypeFilter==='Customer'?'গ্রাহক লেজার':'পার্টি লেজার'}" data-en="${partyTypeFilter==='Customer'?'Customer Ledger':'Party Ledger'}">${t(partyTypeFilter==='Customer'?'গ্রাহক লেজার':'পার্টি লেজার', partyTypeFilter==='Customer'?'Customer Ledger':'Party Ledger')}</h1>
        <p class="i18n" data-bn="একটা পার্টি বাছাই করে তার সব (ক্রয়+বিক্রয়) হিসাব এক জায়গায় দেখুন" data-en="Select a party to see all its (purchase+sales) entries in one place">${t('একটা পার্টি বাছাই করে তার সব (ক্রয়+বিক্রয়) হিসাব এক জায়গায় দেখুন','Select a party to see all its (purchase+sales) entries in one place')}</p>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin:0;"><input type="checkbox" id="plZoneCheck" style="width:auto;"> ${t('জোন','Zone')}</label>
        <select id="plZoneFilter" style="width:auto;min-width:140px;" disabled>
          <option value="">${t('সব জোন','All Zones')}</option>
          ${zoneList.map(function (z) { return `<option value="${attr(z)}">${escapeHtml(z)}</option>`; }).join('')}
        </select>
        <input id="plPartySearch" list="plPartyDatalist" placeholder="${t('পার্টির নাম লিখে খুঁজুন...','Type to search party...')}" style="width:auto;min-width:240px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:13.5px;">
        <datalist id="plPartyDatalist">${partyOptionsHtml(parties)}</datalist>
        <button type="button" id="plPrintBtn" class="btn btn-outline" style="width:auto;display:none;">🖨️ ${t('প্রিন্ট প্রিভিউ','Print Preview')}</button>
      </div>
    </div>
    <div class="panel"><div id="plWrap"><div class="empty-state">${t('উপরে একটা পার্টি বাছাই করুন।','Select a party above.')}</div></div></div>`;

  const zoneCheck = document.getElementById('plZoneCheck');
  const zoneSelect = document.getElementById('plZoneFilter');
  const searchInput = document.getElementById('plPartySearch');
  const datalist = document.getElementById('plPartyDatalist');
  const printBtn = document.getElementById('plPrintBtn');
  let currentPartyKey = null;

  // চেকবক্স টিক দিলে তবেই জোন ড্রপডাউন সক্রিয় হবে — প্রয়োজন না হলে এটা এড়িয়ে
  // সরাসরি সব পার্টি থেকে লিখে খোঁজা যাবে
  zoneCheck.addEventListener('change', function () {
    zoneSelect.disabled = !zoneCheck.checked;
    if (!zoneCheck.checked) {
      zoneSelect.value = '';
      datalist.innerHTML = partyOptionsHtml(parties);
      searchInput.value = '';
    }
  });

  // জোন বাছাই করলে সার্চ-তালিকা শুধু সেই জোনের পার্টি দিয়ে ছেঁকে দেওয়া হবে
  zoneSelect.addEventListener('change', function () {
    const zone = zoneSelect.value;
    const filtered = zone ? parties.filter(function (p) { return p.zone === zone; }) : parties;
    datalist.innerHTML = partyOptionsHtml(filtered);
    searchInput.value = '';
  });

  function findPartyByTypedValue(typedValue) {
    const opt = Array.from(datalist.options).find(function (o) { return o.value === typedValue; });
    return opt ? opt.getAttribute('data-key') : null;
  }

  // প্রতিটা RefModule-এর জন্য "বিবরণী" ও "ভাউচার ধরন" — ইন-অ্যাপ টেবিল ও A4 প্রিন্ট দুই জায়গাতেই ব্যবহার হয়
  function refModuleInfo(refModule) {
    const map = {
      PurchaseInvoice: { desc:['ক্রয় ভাউচার পোস্টিং','Purchase voucher posting'], type:['ক্রয়','Purchase'] },
      'PurchaseInvoice-Payment': { desc:['ক্রয় ভাউচারে প্রদান','Payment against purchase voucher'], type:['পেমেন্ট','Payment'] },
      PurchaseReturn: { desc:['ক্রয় ফেরত ভাউচার পোস্টিং','Purchase return posting'], type:['ক্রয় ফেরত','Purchase Return'] },
      SalesInvoice: { desc:['বিক্রয় ভাউচার পোস্টিং','Sales voucher posting'], type:['বিক্রয়','Sales'] },
      'SalesInvoice-Receipt': { desc:['বিক্রয় ভাউচারে গ্রহণ','Receipt against sales voucher'], type:['রিসিট','Receipt'] },
      SalesReturn: { desc:['বিক্রয় ফেরত ভাউচার পোস্টিং','Sales return posting'], type:['বিক্রয় ফেরত','Sales Return'] },
      ContraVoucher: { desc:['কন্ট্রা ভাউচার','Contra voucher'], type:['কন্ট্রা','Contra'] },
      PaymentVoucher: { desc:['পেমেন্ট ভাউচার','Payment voucher'], type:['পেমেন্ট','Payment'] },
      ReceiptVoucher: { desc:['রিসিট ভাউচার','Receipt voucher'], type:['রিসিট','Receipt'] },
      SalaryIssue: { desc:['সেলারী ইস্যু (বেতন পরিশোধ)','Salary issue'], type:['বেতন','Salary'] },
      'SalaryIssue-Reversal': { desc:['সেলারী ইস্যু বাতিল','Salary issue reversal'], type:['বেতন ফেরত','Salary reversal'] }
    };
    return map[refModule] || { desc:[refModule, refModule], type:[refModule, refModule] };
  }

  let lastRows = [], lastParty = null, lastPartyName = '';

  async function loadLedgerForKey(key) {
    const wrap = document.getElementById('plWrap');
    if (!wrap) return;
    currentPartyKey = key;
    printBtn.style.display = key ? '' : 'none';
    if (!key) { wrap.innerHTML = `<div class="empty-state">${t('উপরে একটা পার্টি বাছাই করুন।','Select a party above.')}</div>`; return; }
    const party = combined[key];
    lastParty = party; lastPartyName = party.name;
    wrap.innerHTML = `<div class="empty-state">${t('লোড হচ্ছে...','Loading...')}</div>`;

    const allEntries = await api('list', { sheet:'PartyLedger' });
    const rows = allEntries.filter(function (r) {
      return (party.customerId && r.PartyType === 'Customer' && r.PartyID === party.customerId) ||
             (party.supplierId && r.PartyType === 'Supplier' && r.PartyID === party.supplierId);
    }).sort(function (a, b) { return String(a.Date || '').localeCompare(String(b.Date || '')); });
    lastRows = rows;

    if (rows.length === 0) { wrap.innerHTML = `<div class="empty-state">${t('কোনো এন্ট্রি পাওয়া যায়নি।','No entries found.')}</div>`; return; }

    // দুই দিকের (ক্রয় + বিক্রয়) এন্ট্রি একসাথে মিলিয়ে, তারিখ অনুযায়ী সাজিয়ে,
    // নতুন করে একটামাত্র চলমান ব্যালেন্স হিসাব করা হচ্ছে — টেবিলে যেটা আলাদা
    // আলাদা করে জমা ছিল সেটার উপর ভরসা না করে, যাতে দুই পাশ মিলে সত্যিকারের একটা হিসাব পাওয়া যায়
    let runningBalance = 0, totalDebit = 0, totalCredit = 0;
    // "PurchaseInvoice-Payment" জাতীয় সাফিক্স-লাগানো রেফারেন্সের আসল ভাউচার এখনো
    // মূল ডকুমেন্টেই (RefID একই) থাকে — তাই "ভিউ" বাটনের জন্য সাফিক্স বাদ দিয়ে মূল ধরন বের করা হচ্ছে
    const viewableTypes = { PurchaseInvoice:1, PurchaseReturn:1, SalesInvoice:1, SalesReturn:1 };
    const headers = [['তারিখ','Date'],['ধরন','Type'],['রেফারেন্স','Reference'],['Debit','Debit'],['Credit','Credit'],['ব্যালেন্স','Balance'],['','']];
    const headCells = headers.map(function (h) { return `<th>${t(h[0], h[1])}</th>`; }).join('');
    const bodyRows = rows.map(function (r) {
      const debit = Number(r.Debit || 0), credit = Number(r.Credit || 0);
      runningBalance += debit - credit;
      totalDebit += debit; totalCredit += credit;
      const typeLabel = r.PartyType === 'Customer' ? t('বিক্রয়','Sales') : t('ক্রয়','Purchase');
      const baseType = String(r.RefModule || '').split('-')[0];
      const viewBtn = viewableTypes[baseType]
        ? `<button type="button" class="btn btn-outline" style="width:auto;padding:4px 10px;font-size:11px;" onclick='openPrintableVoucherView(${JSON.stringify(baseType)}, ${JSON.stringify(r.RefID)})'>${t('ভিউ','View')}</button>`
        : '';
      return `<tr><td>${escapeHtml(r.Date)}</td><td>${typeLabel}</td><td>${escapeHtml(r.RefModule)} — ${escapeHtml(r.RefID)}</td>
        <td>${debit.toFixed(2)}</td><td>${credit.toFixed(2)}</td><td><b>${formatAmountDrCr(runningBalance, true)}</b></td><td>${viewBtn}</td></tr>`;
    }).join('');
    wrap.innerHTML = `
      <div style="display:flex;gap:24px;flex-wrap:wrap;margin-bottom:14px;padding:12px 14px;background:var(--bg);border-radius:8px;font-size:13px;">
        <div><span style="color:var(--text-muted);">${t('মোট Debit','Total Debit')}:</span> <b>${totalDebit.toFixed(2)}</b></div>
        <div><span style="color:var(--text-muted);">${t('মোট Credit','Total Credit')}:</span> <b>${totalCredit.toFixed(2)}</b></div>
        <div><span style="color:var(--text-muted);">${t('সর্বশেষ ব্যালেন্স','Closing Balance')}:</span> <b>${formatAmountDrCr(runningBalance, true)}</b></div>
      </div>
      <table class="data-table"><thead><tr>${headCells}</tr></thead><tbody>${bodyRows}</tbody></table>`;
  }

  searchInput.addEventListener('change', function () {
    const key = findPartyByTypedValue(searchInput.value.trim());
    if (!key && searchInput.value.trim()) { showToast(t('তালিকা থেকে একটা পার্টি বাছাই করুন।','Pick a party from the list.'), 'error'); return; }
    loadLedgerForKey(key);
  });

  printBtn.addEventListener('click', function () {
    if (!lastRows.length) { showToast(t('কোনো এন্ট্রি নেই।','No entries.'), 'error'); return; }
    openPartyLedgerPrintView(lastPartyName, lastRows, refModuleInfo);
  });
}

/** পার্টি লেজারের A4 প্রিন্ট-প্রিভিউ — তারিখ | বিবরণী | ভাউচার ধরন | ভাউচার নং |
 *  ডেবিট | ক্রেডিট | ব্যালান্স | ব্যবহারকারী কলামসহ, নতুন ট্যাবে খোলে */
function openPartyLedgerPrintView(partyName, rows, refModuleInfo) {
  const lang = currentLang || 'bn';
  const L = function (bn, en) { return lang === 'bn' ? bn : en; };
  let runningBalance = 0;
  const bodyRows = rows.map(function (r) {
    const debit = Number(r.Debit || 0), credit = Number(r.Credit || 0);
    runningBalance += debit - credit;
    const info = refModuleInfo(r.RefModule);
    return `<tr>
      <td>${escapeHtml(formatShortDate(r.Date))}</td>
      <td>${escapeHtml(L(info.desc[0], info.desc[1]))}</td>
      <td>${escapeHtml(L(info.type[0], info.type[1]))}</td>
      <td>${escapeHtml(r.RefID)}</td>
      <td>${debit ? debit.toFixed(2) : ''}</td>
      <td>${credit ? credit.toFixed(2) : ''}</td>
      <td><b>${formatAmountDrCr(runningBalance, true)}</b></td>
      <td>${escapeHtml(r.CreatedBy || '—')}</td>
    </tr>`;
  }).join('');
  const totalDebit = rows.reduce(function (s, r) { return s + (Number(r.Debit) || 0); }, 0);
  const totalCredit = rows.reduce(function (s, r) { return s + (Number(r.Credit) || 0); }, 0);

  const html = `<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${L('পার্টি লেজার','Party Ledger')} — ${escapeHtml(partyName)}</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Anek Bangla',sans-serif;color:#1b1f27;max-width:1000px;margin:20px auto;padding:0 20px;width:100%;box-sizing:border-box;}
  html,body{max-width:100%;overflow-x:hidden;}
  h1{font-family:'Oswald',sans-serif;font-size:19px;margin:0 0 4px;text-align:center;}
  .sub{text-align:center;color:#888;font-size:12px;margin-bottom:16px;}
  table{width:100%;border-collapse:collapse;margin:8px 0;}
  th,td{border:1px solid #ccc;padding:6px 8px;font-size:11.5px;text-align:center;}
  th{background:#1a2029;color:#f2a33c;}
  tfoot td{font-weight:700;border-top:2px solid #1a2029;}
  .toolbar{display:flex;gap:10px;margin-bottom:20px;align-items:center;flex-wrap:wrap;}
  .toolbar button{font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:8px;border:1px solid #d1d5db;background:#f5f6f8;cursor:pointer;}
  .toolbar button.primary{background:#1a2029;color:#f2a33c;border-color:#1a2029;}
  @page { size: A4; margin: 12mm; }
  @media print { .toolbar{display:none;} }
</style></head><body>
  <div class="toolbar">
    <button onclick="window.print()">📄 ${L('পেজ সেটাপ','Page Setup')}</button>
    <button class="primary" onclick="window.print()">🖨️ ${L('প্রিন্ট','Print')}</button>
    <button id="shareBtn">🔗 ${L('শেয়ার','Share')}</button>
  </div>
  <h1>${L('পার্টি লেজার','Party Ledger')} — ${escapeHtml(partyName)}</h1>
  <div class="sub">${L('প্রিন্টঃ','Print: ')}${formatPrintDate()}</div>
  <table>
    <thead><tr>
      <th>${L('তারিখ','Date')}</th><th>${L('বিবরণী','Description')}</th><th>${L('ভাউচার ধরন','Voucher Type')}</th><th>${L('ভাউচার নং','Voucher No')}</th>
      <th>${L('ডেবিট','Debit')}</th><th>${L('ক্রেডিট','Credit')}</th><th>${L('ব্যালান্স','Balance')}</th><th>${L('ব্যবহারকারী','User')}</th>
    </tr></thead>
    <tbody>${bodyRows}</tbody>
    <tfoot><tr><td colspan="4">${L('মোট','Total')}</td><td>${totalDebit.toFixed(2)}</td><td>${totalCredit.toFixed(2)}</td><td colspan="2"><b>${formatAmountDrCr(runningBalance, true)}</b></td></tr></tfoot>
  </table>
<script>
  document.getElementById('shareBtn').addEventListener('click', async function () {
    const text = ${JSON.stringify(L('পার্টি লেজার','Party Ledger'))} + ' — ' + ${JSON.stringify(partyName)};
    if (navigator.share) { try { await navigator.share({ title: text, text: text }); } catch (e) {} }
    else if (navigator.clipboard) { await navigator.clipboard.writeText(text); alert(${JSON.stringify(L('ক্লিপবোর্ডে কপি হয়েছে।','Copied to clipboard.'))}); }
  });
<\/script>
</body></html>`;

  const win = window.open('', '_blank');
  if (!win) { showToast(t('পপ-আপ ব্লক হয়েছে — এই সাইটের জন্য পপ-আপ অনুমতি দিন।','Pop-up was blocked — please allow pop-ups for this site.'), 'error'); return; }
  win.document.write(html);
  win.document.close();
}

/* ============================================================
   ১৩.৯) REPORTS মডিউল

async function renderInventoryReport(content) {
  const [stock, items, warehouses, units] = await Promise.all([api('list', { sheet:'CurrentStock' }), cachedList('Items'), cachedList('Warehouses'), cachedList('UOM')]);
  const itemMap = {}; items.forEach(function (i) { itemMap[i.ItemID] = i; });
  const whMap = {}; warehouses.forEach(function (w) { whMap[w.WarehouseID] = w.WarehouseName; });
  let totalValue = 0;
  const rows = stock.map(function (s) {
    const item = itemMap[s.ItemID] || {};
    const pcsItem = isPieceUOM(item.UOMID, units);
    const qty = Number(pcsItem ? s.QtyPieces : s.QtyOnHand) || 0;
    const rate = Number(item.StandardCost) || 0;
    const value = qty * rate;
    totalValue += value;
    return `<tr><td>${escapeHtml(item.ItemName || s.ItemID)}</td><td>${escapeHtml(whMap[s.WarehouseID] || s.WarehouseID)}</td><td>${qty}${pcsItem ? ' ' + t('পিস','pcs') + `<div style="font-size:11px;color:var(--text-muted);">${(Number(s.QtyOnHand) || 0).toFixed(2)} ${t('কেজি','kg')}</div>` : ''}</td><td>${rate.toFixed(2)}</td><td>${value.toFixed(2)}</td></tr>`;
  }).join('');
  content.innerHTML = `
    <div class="page-head"><div><h1>${t('ইনভেন্টরি প্রতিবেদন','Inventory Report')}</h1><p>${t('স্টকের মূল্যসহ সম্পূর্ণ তালিকা','Full stock list with valuation')}</p></div></div>
    <div class="panel"><table class="data-table"><thead><tr><th>${t('আইটেম','Item')}</th><th>${t('গুদাম','Warehouse')}</th><th>${t('পরিমাণ','Qty')}</th><th>${t('দর','Rate')}</th><th>${t('মূল্য','Value')}</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="5" class="empty-state">${t('কোনো ডেটা নেই।','No data.')}</td></tr>`}</tbody>
      <tfoot><tr style="font-weight:700;background:var(--bg);"><td colspan="4">${t('মোট মূল্য','Total Value')}</td><td>${totalValue.toFixed(2)}</td></tr></tfoot>
    </table></div>`;
}

async function renderSalesReport(content) {
  const [invoices, customers] = await Promise.all([api('list', { sheet:'SalesInvoice' }), cachedList('Customers')]);
  const custMap = {}; customers.forEach(function (c) { custMap[c.CustomerID] = c.CompanyName || c.Name; });
  const active = invoices.filter(function (r) { return r.Status !== 'Deleted'; });
  const totalSales = active.reduce(function (s, r) { return s + (Number(r.TotalAmount) || 0); }, 0);
  const rows = active.slice().reverse().map(function (r) {
    return `<tr><td>${escapeHtml(r.SIID)}</td><td>${escapeHtml(r.InvoiceDate)}</td><td>${escapeHtml(custMap[r.CustomerID] || r.CustomerID)}</td><td>${Number(r.TotalAmount||0).toFixed(2)}</td><td>${escapeHtml(r.Status)}</td></tr>`;
  }).join('');
  content.innerHTML = `
    <div class="page-head"><div><h1>${t('বিক্রয় প্রতিবেদন','Sales Report')}</h1><p>${t('মোট বিক্রয়','Total Sales')}: <b>${totalSales.toFixed(2)}</b></p></div></div>
    <div class="panel"><table class="data-table"><thead><tr><th>${t('আইডি','ID')}</th><th>${t('তারিখ','Date')}</th><th>${t('গ্রাহক','Customer')}</th><th>${t('মূল্য','Amount')}</th><th>${t('অবস্থা','Status')}</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="5" class="empty-state">${t('কোনো ডেটা নেই।','No data.')}</td></tr>`}</tbody></table></div>`;
}

async function renderPurchaseReport(content) {

async function renderBackupRestorePage(content) {
  content.innerHTML = `
    <div class="page-head"><div><h1>ব্যাকআপ ও পুনরুদ্ধার</h1><p>পুরো ডেটাবেসের ব্যাকআপ ডাউনলোড করুন</p></div></div>
    <div class="panel"><div class="modal-body" style="padding:22px;">
      <p style="font-size:13.5px;color:var(--text-muted);margin-bottom:16px;">নিচের বাটনে ক্লিক করলে সব Sheet-এর ডেটা একটা JSON ফাইলে ডাউনলোড হবে। এটা নিয়মিত করে রাখা ভালো অভ্যাস।</p>

      <div id="backupProgress" style="margin-top:14px;font-size:12.5px;color:var(--text-muted);"></div>
    </div></div>`;

  document.getElementById('backupBtn').addEventListener('click', async function () {
    const btn = this; btn.disabled = true;
    const progressEl = document.getElementById('backupProgress');
    const allData = {};
    try {
      for (let i = 0; i < ALL_DATA_SHEETS.length; i++) {
        const sheet = ALL_DATA_SHEETS[i];
        progressEl.textContent = 'আনা হচ্ছে: ' + sheet + ' (' + (i+1) + '/' + ALL_DATA_SHEETS.length + ')';

      const blob = new Blob([JSON.stringify(allData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'gmetal-backup-' + new Date().toISOString().slice(0,10) + '.json';
      a.click();
      URL.revokeObjectURL(url);
      progressEl.textContent = 'ব্যাকআপ সম্পন্ন ✅';
      showToast('ব্যাকআপ ডাউনলোড হয়েছে ✅', 'success');

  document.getElementById('modalBox').classList.toggle('modal-wide', !!opts.wide);

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');

  const actWrap = document.getElementById('modalHeaderActions');
  if (actWrap) { actWrap.innerHTML = ''; actWrap.style.display = 'none'; }
  document.getElementById('modalSaveBtn').style.display = '';
  modalOnSaveHandler = null;
}

   ============================================================ */
function val(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}
function attr(v) {
  if (v === undefined || v === null) return '';
  return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeHtml(v) {
  if (v === undefined || v === null) return '';
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function isTrue(v) {
  return v === true || v === 'TRUE' || v === 'true' || v === 1 || v === '1';
}

/** Debit/Credit — পজিটিভ সংখ্যা মানে Debit, নেগেটিভ মানে Credit।
 *  ফর্মে দুটো আলাদা ইনপুট (Dr/Cr) দেখানো হয়, ভেতরে ভেতরে একটাই সংখ্যা হিসেবে সেভ হয়। */
function amountDrCrFieldHtml(id, label, currentVal) {
  const num = Number(currentVal) || 0;
  const drVal = num > 0 ? Math.abs(num).toFixed(2) : '';
  const crVal = num < 0 ? Math.abs(num).toFixed(2) : '';
  return `<div class="field"><label>${label}</label>
    <div style="display:flex;gap:8px;">
      <input id="${id}_dr" type="number" step="any" placeholder="Dr" value="${drVal}" style="flex:1;">
      <input id="${id}_cr" type="number" step="any" placeholder="Cr" value="${crVal}" style="flex:1;">
    </div></div>`;
}
function readAmountDrCr(id) {
  const dr = Number(val(id + '_dr')) || 0;
  const cr = Number(val(id + '_cr')) || 0;
  return dr - cr;
}
/** সব ভাউচার/লেজার প্রিন্টে ব্যবহৃত তারিখ+সময়ের কমপ্যাক্ট ফরম্যাট —
 *  যেমন 26/09/26;4:27:21AM (DD/MM/YY;H:MM:SSAM/PM) */
function formatPrintDate(d) {
  d = d || new Date();
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yy = String(d.getFullYear()).slice(-2);
  let h = d.getHours();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  const mi = String(d.getMinutes()).padStart(2, '0');
  const ss = String(d.getSeconds()).padStart(2, '0');
  return dd + '/' + mm + '/' + yy + ';' + h + ':' + mi + ':' + ss + ampm;
}

/** ভাউচারের নিজের তারিখ (সেভ থাকে YYYY-MM-DD হিসেবে) প্রিন্টে DD-MM-YY
 *  আকারে দেখানোর জন্য — যেমন 2026-09-25 → 25-09-26 */
function formatShortDate(isoDate) {
  if (!isoDate) return '';
  const parts = String(isoDate).split('-');
  if (parts.length !== 3) return isoDate;
  const [yyyy, mm, dd] = parts;
  return dd + '-' + mm + '-' + yyyy.slice(-2);
}

  .v-meta{flex:0 0 150px;border:1px solid #000;border-radius:5px;overflow:hidden;display:flex;flex-direction:column;}
  /* ভাউচারের নাম — মাঝের কলামে মোবাইল নম্বরের নিচে, কালো ঘরের ভিতরে */
  .v-type{align-self:center;background:#111;color:#fff;font-weight:700;font-size:12.5px;text-align:center;padding:3px 18px;margin-top:4px;border-radius:4px;}
  /* প্রিন্টের তারিখ ও সময় — ডান পাশের বক্সে, সাদা ঘরে */
  .v-print{background:#fff;color:#111;font-size:9.5px;text-align:center;padding:3px 2px;}
  .v-meta-row{display:flex;justify-content:space-between;gap:4px;padding:2px 6px;font-size:10px;border-top:.5px solid #999;}
  .v-meta-row:first-of-type{border-top:none;}
  .v-meta{justify-content:center;}
  .v-draft{font-size:9px;color:#b45309;text-align:center;padding:1px;border-top:.5px solid #999;}
  /* ২য় অংশ — পার্টি */
  .v-party{border:1.5px solid #000;border-radius:6px;padding:5px 8px;margin-top:6px;position:relative;z-index:1;}
  .v-party-name{font-size:14px;font-weight:700;}
  .v-party-name .lbl{font-size:11px;font-weight:600;}
  .v-party-sub{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:9.5px;margin-top:2px;color:#222;}
  /* ৩য় অংশ — আইটেম টেবিল (চিকন বর্ডার, কম্প্যাক্ট সারি) */
  table{width:100%;border-collapse:collapse;table-layout:fixed;}
  .items-table{margin-top:6px;position:relative;z-index:1;}
  .items-table td,.items-table th{border:.5px solid #444;padding:1.5px 4px;font-size:10px;line-height:1.25;text-align:center;overflow-wrap:anywhere;}
  .items-table th{background:#efefef;font-weight:700;}
  .items-table td.l{text-align:left;}
  .items-table td.r,.items-table th.r{text-align:right;}
  /* আইটেম লাইনের শেষে "মোটঃ ক্রয়/বিক্রয়/ফেরত" সারির উপরে মোটা বর্ডার — পরের সব হিসাব এর নিচে */
  .items-table .total-row td{font-weight:700;background:#fafafa;border-top:1.8px solid #000;}
  .items-table .section-head td{background:#f5f5f5;font-weight:700;text-align:left;}
  .items-table .grand td{font-weight:700;font-size:11.5px;border-top:2px solid #000;}
  .items-table .vat-row td{background:#f7f7f7;}
  .items-table .grand-all td{font-weight:700;font-size:12px;border-top:2.5px solid #000;background:#f2f2f2;}
  /* ৪র্থ অংশ — ভ্যাট ও বকেয়া হিসাব (আলাদা বর্ডার) */
  .v-sum{margin-top:6px;border:1.5px solid #000;border-radius:6px;overflow:hidden;position:relative;z-index:1;}
  .v-sum table td{border:none;border-top:.5px solid #999;padding:2px 8px;font-size:10.5px;}
  .v-sum table tr:first-child td{border-top:none;}
  .v-sum td.k{text-align:right;} .v-sum td.v{text-align:right;font-weight:600;}
  .v-sum tr.vat td{background:#f7f7f7;}
  .v-sum tr.thick td{border-top:2px solid #000;}
  .v-sum tr.big td{font-weight:700;font-size:12px;}
  /* লাভের হিসাব — শুধু স্ক্রিনে, প্রিন্টে কখনো আসবে না */
  .v-profit{margin-top:6px;border:1.5px dashed #15803d;border-radius:6px;padding:4px;background:#f0fdf4;position:relative;z-index:1;}
  .v-profit h5{margin:2px 4px 4px;font-size:11.5px;color:#15803d;}
  .v-profit td,.v-profit th{border:.5px solid #86efac;padding:1.5px 4px;font-size:10px;text-align:right;}

    .toolbar{display:none;}
    .v-profit{display:none !important;}
    html,body{width:100% !important;max-width:100% !important;margin:0 !important;padding:0 !important;overflow:visible !important;}
    .v-co,.v-party,.v-meta,.v-logo,.items-table th,.items-table .total-row td,.items-table .grand-all td,.v-type{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
`;

/** প্রিন্টে সংখ্যাকে বাংলা অঙ্কে (০-৯) দেখায় — শুধু ভাউচার নম্বর/তারিখ ও মোবাইল ইংরেজিতে থাকে */
function bnDigits(v) {
  const map = { '0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯' };
  return String(v === undefined || v === null ? '' : v).replace(/[0-9]/g, function (d) { return map[d]; });
}

function buildVoucherTableBody(opts) {
  const hasComm = opts.mainLines.some(function (l) { return (l.commAmount || 0) > 0; }) ||
                   opts.returnLines.some(function (l) { return (l.commAmount || 0) > 0; });
  const B = function (v) { return escapeHtml(bnDigits(v)); };
  const M = function (n) { return B(Number(n || 0).toFixed(2)); };

  function itemRows(lines, startIdx) {
    return lines.map(function (l, i) {
      const item = opts.itemMap[l.itemId] || {};
      const net = l.netAmount !== undefined ? l.netAmount : l.amount;
      return `<tr>
        <td>${B(startIdx + i + 1)}</td>
        <td class="l">${escapeHtml(item.ItemName || l.itemId)}</td>
        <td>${B(l.qty)}</td>
        <td class="r">${M(l.rate)}</td>
        <td class="r">${M(l.amount)}</td>
        ${hasComm ? `<td>${B(l.commRate || 0)}</td><td class="r">${M(l.commAmount)}</td><td class="r">${M(net)}</td>` : ''}
      </tr>`;
    }).join('');
  }
  function sumField(lines, field) { return lines.reduce(function (s, l) { return s + (Number(l[field]) || 0); }, 0); }
  function sumNet(lines) { return lines.reduce(function (s, l) { return s + (Number(l.netAmount !== undefined ? l.netAmount : l.amount) || 0); }, 0); }

  const mainQty = sumField(opts.mainLines, 'qty'), mainAmt = sumField(opts.mainLines, 'amount'), mainComm = sumField(opts.mainLines, 'commAmount'), mainNet = sumNet(opts.mainLines);
  const retQty = sumField(opts.returnLines, 'qty'), retAmt = sumField(opts.returnLines, 'amount'), retComm = sumField(opts.returnLines, 'commAmount'), retNet = sumNet(opts.returnLines);
  const netGrandTotal = mainNet + (opts.cashExpenseAmt || 0) - (opts.discountAmt || 0) - retNet;
  const colCount = hasComm ? 8 : 5;
  const vatAmt = Number(opts.vatAmount) || 0, vatRate = Number(opts.vatRate) || 0;
  const voucherGrand = netGrandTotal + vatAmt;
  // শুধু-ফেরত ভাউচার (ক্রয় ফেরত / বিক্রয় ফেরত) — যোগফল ঋণাত্মক হয়, তাই চিহ্ন ছাড়া (−) দিয়ে দেখানো হবে
  const isReturnOnly = opts.mainLines.length === 0 && opts.returnLines.length > 0;
  const SM = function (n) { return (n < 0 ? '(−) ' : '') + M(Math.abs(n)); };
  const grandQty = Math.abs(mainQty - retQty);
  const grandLabel = isReturnOnly ? 'সর্বমোট ফেরত (ভাউচার)ঃ' : 'সর্বমোট (ভাউচার)ঃ';
  const colgroup = hasComm
    ? '<colgroup><col style="width:6%"><col style="width:24%"><col style="width:11%"><col style="width:10%"><col style="width:13%"><col style="width:8%"><col style="width:12%"><col style="width:16%"></colgroup>'
    : '<colgroup><col style="width:7%"><col style="width:38%"><col style="width:15%"><col style="width:15%"><col style="width:25%"></colgroup>';
  const headCells = `<th>ক্রঃ</th><th>আইটেম (পণ্য)</th><th>পরিমাণ</th><th class="r">দর</th><th class="r">মূল্য</th>${hasComm ? '<th>কমিঃ %</th><th class="r">(-) কমিঃ</th><th class="r">নিট মূল্য</th>' : ''}`;
  const totalRow = function (label, q, a, c, n) {
    return `<tr class="total-row"><td colspan="2">${escapeHtml(label)}</td><td>${B(q)}</td><td></td><td class="r">${M(a)}</td>${hasComm ? `<td></td><td class="r">${M(c)}</td><td class="r">${M(n)}</td>` : ''}</tr>`;
  };
  const labelRow = function (label, valueHtml) {
    return `<tr><td colspan="${colCount-1}" class="r">${escapeHtml(label)}</td><td class="r">${valueHtml}</td></tr>`;
  };

  // প্রিন্টের তারিখ ও সময় — যখন প্রিভিউ/প্রিন্ট তৈরি হয় তখনকার সময়
  const _now = new Date(), _p = function (n) { return String(n).padStart(2, '0'); };
  const _h = _now.getHours() % 12 || 12;
  const printStamp = _p(_now.getDate()) + '-' + _p(_now.getMonth() + 1) + '-' + _now.getFullYear() + ' ' +
                     _p(_h) + ':' + _p(_now.getMinutes()) + (_now.getHours() < 12 ? ' AM' : ' PM');

  const co = opts.company || {};
  // প্রিন্ট সম্পূর্ণ বাংলায় — কোম্পানি প্রোফাইলে CompanyNameBn/AddressBn থাকলে সেটাই, না থাকলে বাংলা ডিফল্ট
  const coName = co.CompanyNameBn || 'জি মেটাল ওয়ার্কস';
  const coAddr = co.AddressBn || 'আলামপুর ব্রীজঘাট বাজার, কোটচাঁদপুর রোড, মহেশপুর, ঝিনাইদহ।';

  return `
  <div class="voucher-watermark">gmetal</div>

  <div class="v-co">
    <div class="v-logo">${co.LogoURL ? `<img src="${attr(co.LogoURL)}" alt="">` : '<span>লোগো</span>'}</div>
    <div class="v-co-info">
      <div class="v-co-name">${escapeHtml(coName)}</div>
      <div class="v-co-addr">${escapeHtml(coAddr)}</div>
      ${co.Phone ? `<div class="v-co-mob">মোবাইলঃ <span class="en">${escapeHtml(co.Phone)}</span></div>` : ''}
      <div class="v-type">${escapeHtml(opts.titleBn)}</div>
    </div>
    <div class="v-meta">
      <div class="v-print">প্রিন্টঃ <span class="en">${escapeHtml(printStamp)}</span></div>
      <div class="v-meta-row"><span>ভাউচার নংঃ</span><b class="en">${escapeHtml(opts.voucherNo)}</b></div>
      <div class="v-meta-row"><span>তারিখঃ</span><b class="en">${escapeHtml(formatShortDate(opts.voucherDate))}</b></div>
      ${opts.manualNo ? `<div class="v-meta-row"><span>নিঃ ভাউঃ নংঃ</span><span class="en">${escapeHtml(opts.manualNo)}</span></div>` : ''}
      ${opts.manualDate ? `<div class="v-meta-row"><span>নিঃ ভাউঃ তারিখঃ</span><span class="en">${escapeHtml(formatShortDate(opts.manualDate))}</span></div>` : ''}
      ${opts.isDraft ? '<div class="v-draft">খসড়া — এখনো সেভ হয়নি</div>' : ''}
    </div>
  </div>

  <div class="v-party">
    <div class="v-party-name"><span class="lbl">${escapeHtml(opts.partyLabelBn)}</span> ${escapeHtml(opts.partyName)}</div>
    <div class="v-party-sub">
      <span>ঠিকানাঃ ${escapeHtml(opts.partyAddress || '—')}</span>
      <span>মোবাইলঃ <span class="en">${escapeHtml(opts.partyPhone || '—')}</span></span>
      ${opts.partyZone ? `<span>জোনঃ ${escapeHtml(opts.partyZone)}</span>` : ''}
    </div>
  </div>

  <table class="items-table">
    ${colgroup}
    <thead><tr>${headCells}</tr></thead>
    ${opts.mainLines.length > 0 ? `
    <tbody>${itemRows(opts.mainLines, 0)}</tbody>
    <tbody>${totalRow(opts.mainTotalLabel, mainQty, mainAmt, mainComm, mainNet)}</tbody>` : ''}
    ${opts.returnLines.length > 0 ? `
    <tbody>
      <tr class="section-head"><td colspan="${colCount}">${escapeHtml(opts.returnLabel)}</td></tr>
      ${itemRows(opts.returnLines, 0)}
      ${totalRow(opts.returnTotalLabel, retQty, retAmt, retComm, retNet)}
    </tbody>` : ''}
    <tbody>
      ${opts.cashExpenseAmt > 0 ? labelRow('খরচ যোগঃ', M(opts.cashExpenseAmt)) : ''}
      ${opts.discountAmt > 0 ? labelRow('ডিসকাউন্টঃ', '− ' + M(opts.discountAmt)) : ''}
      <tr class="grand"><td colspan="${colCount-1}" class="r">নিট মোটঃ</td><td class="r">${SM(netGrandTotal)}</td></tr>
      ${vatAmt > 0 ? `<tr class="vat-row"><td colspan="${colCount-1}" class="r">ভ্যাটঃ ${vatRate ? '(' + B(vatRate) + ' %)' : ''}</td><td class="r">+ ${M(vatAmt)}</td></tr>` : ''}
      <tr class="grand-all"><td colspan="2" class="r">${grandLabel}</td><td>${B(grandQty)}</td><td colspan="${colCount-4}"></td><td class="r">${SM(voucherGrand)}</td></tr>
    </tbody>
  </table>

  ${buildVoucherSummaryBox(opts, netGrandTotal, B, M)}
  ${opts.withProfit ? buildVoucherProfitBox(opts, B, M) : ''}

  <div class="sign-row"><div>${escapeHtml(opts.sign1)}</div><div>অথরাইজেশন স্বাঃ<br>${escapeHtml(currentUser ? currentUser.FullName : '')}</div><div>${escapeHtml(opts.sign3Label)}<br>${escapeHtml(currentUser ? currentUser.FullName : '')}</div></div>`;
}

/** নিট মোটের নিচের আলাদা বর্ডার-বক্স: (ঐচ্ছিক) ভ্যাট → মোটা লাইন → সর্বমোট →
 *  পূর্বের বকেয়া → সর্বমোট বকেয়া → নগদ/ব্যাংক হিসাব → অবশিষ্ট বকেয়া বা অগ্রিম।
 *  বকেয়া সবসময় ভাউচারের দিক থেকে ধনাত্মক — ক্রয়ে "আমরা সাপ্লায়ারকে দেব",
 *  বিক্রয়ে "গ্রাহক আমাদের দেবে"; ঋণাত্মক হলে সেটা "অগ্রিম" হিসেবে দেখায়। */
function buildVoucherSummaryBox(opts, netGrandTotal, B, M) {
  if (opts.prevDue === undefined) return '';
  const vatAmt = Number(opts.vatAmount) || 0, vatRate = Number(opts.vatRate) || 0;
  const grand = netGrandTotal + vatAmt;
  const row = function (label, value, cls) {
    return `<tr class="${cls || ''}"><td class="k" colspan="3">${escapeHtml(label)}</td><td class="v">${value}</td></tr>`;
  };
  const dueRow = function (posLabel, negLabel, amt, cls) {
    return row(amt < 0 ? negLabel : posLabel, M(Math.abs(amt)), cls);
  };
  // ভ্যাট ও "সর্বমোট (ভাউচার)" এখন আইটেম টেবিলের ভেতরে — এই বক্স শুরু হয় বকেয়া হিসাব থেকে
  let rows = '';
  if (opts.isCashParty) {
    rows += row(opts.payCashLabel || 'নগদঃ', (grand < 0 ? '(+) ' : '(−) ') + M(Math.abs(grand)));
    rows += row('অবশিষ্ট বকেয়াঃ', M(0), 'big thick');
  } else {
    const prev = Number(opts.prevDue) || 0;
    const totalDue = prev + grand;
    const cash = Number(opts.cashPaid) || 0, bank = Number(opts.bankPaid) || 0;
    rows += dueRow('পূর্বের বকেয়াঃ', 'পূর্বের অগ্রিমঃ', prev);
    rows += dueRow('সর্বমোট বকেয়াঃ', 'সর্বমোট অগ্রিমঃ', totalDue, 'big');
    if (cash > 0 || bank === 0) rows += row(opts.payCashLabel || 'নগদঃ', '(−) ' + M(cash));
    if (bank > 0) rows += row(opts.payBankLabel || 'ব্যাংকঃ', '(−) ' + M(bank));
    rows += dueRow('অবশিষ্ট বকেয়াঃ', 'অগ্রিমঃ', totalDue - cash - bank, 'big thick');
  }
  return `<div class="v-sum"><table><colgroup><col style="width:22%"><col style="width:18%"><col style="width:25%"><col style="width:35%"></colgroup>${rows}</table></div>`;
}

/** লাভের হিসাব (শুধু বিক্রয়ে): প্রতি লাইনে লাভ = নিট মূল্য − পরিমাণ × স্টক দর;
 *  ফেরত লাইনের লাভ বাদ যায়, ডিসকাউন্টও বাদ যায়। খরচ(+) ও ভ্যাট পার্টির কাছ থেকে
 *  আদায় হয় বলে লাভে ধরা হয় না। বক্সটা প্রিন্টে কখনো আসে না (@media print)। */
function buildVoucherProfitBox(opts, B, M) {
  const lineProfit = function (l) {
    const net = Number(l.netAmount !== undefined ? l.netAmount : l.amount) || 0;
    return net - (Number(l.qty) || 0) * (Number(l.costRate) || 0);
  };
  const fmt = function (v) { return `<span class="${v < 0 ? 'neg' : ''}">${v < 0 ? '−' : ''}${M(Math.abs(v))}</span>`; };
  let n = 0, total = 0;
  const rowsFor = function (lines, sign, tag) {
    return lines.map(function (l) {
      const item = opts.itemMap[l.itemId] || {};
      const pr = sign * lineProfit(l); total += pr; n++;
      return `<tr><td>${B(n)}</td><td class="l">${escapeHtml(item.ItemName || l.itemId)}${tag}</td><td>${B(l.qty)}</td><td>${M(l.costRate)}</td><td>${M(l.netAmount !== undefined ? l.netAmount : l.amount)}</td><td>${fmt(pr)}</td></tr>`;
    }).join('');
  };
  const rows = rowsFor(opts.mainLines, 1, '') + rowsFor(opts.returnLines, -1, ' (ফেরত)');
  const disc = Number(opts.discountAmt) || 0;
  const net = total - disc;
  return `<div class="v-profit" style="${opts.showProfit ? '' : 'display:none;'}">
    <h5>📈 লাভের হিসাব (প্রিন্টে আসবে না)</h5>
    <table><colgroup><col style="width:7%"><col style="width:33%"><col style="width:13%"><col style="width:14%"><col style="width:16%"><col style="width:17%"></colgroup>
      <thead><tr><th>ক্রঃ</th><th class="l">আইটেম</th><th>পরিমাণ</th><th>স্টক দর</th><th>নিট মূল্য</th><th>লাভ</th></tr></thead>
      <tbody>${rows}
        ${disc > 0 ? `<tr><td colspan="5">(−) ডিসকাউন্টঃ</td><td>${fmt(-disc)}</td></tr>` : ''}
        <tr class="tot"><td colspan="5">মোট লাভঃ</td><td>${fmt(net)}</td></tr>
      </tbody></table></div>`;
}

function buildVoucherTableHtml(opts) {

<title>${escapeHtml(opts.titleBn)}${opts.isDraft ? ' (খসড়া)' : ''}</title>

function formatAmountDrCr(v, showLabel) {
  const num = Number(v) || 0;
  const abs = Math.abs(num).toFixed(2);
  if (!showLabel) return abs;
  if (num > 0) return abs + ' Dr';
  if (num < 0) return abs + ' Cr';
  return abs;
}

/** আইটেমের একক "পিস" কিনা — পিস হলে বিক্রি পিসে, কেজি কমে স্টকের গড় ওজনে */
function isPieceUnitName(name) { return /পিস|pcs|pc\b|piece/i.test(String(name || '')); }
function isPieceUOM(uomId, unitsList) {
  const u = (unitsList || []).find(function (x) { return x.UOMID === uomId; });
  return !!u && isPieceUnitName(u.UOMName);
}
async function itemIsPiece(itemId) {
  const m = await cachedListMultiple(['Items', 'UOM']);
  const it = (m.Items || []).find(function (i) { return i.ItemID === itemId; });
  return !!it && isPieceUOM(it.UOMID, m.UOM);
}
/** এই গুদামে এই আইটেমের এখনকার গড় ওজন (কেজি/পিস) — ব্যাচভেদে ওজন বদলায়, তাই স্টক থেকেই নেওয়া হয় */
async function avgKgPerPiece(itemId, warehouseId) {
  const { data } = await supabaseClient.from('current_stock').select('QtyOnHand,QtyPieces').eq('ItemID', itemId).eq('WarehouseID', warehouseId).maybeSingle();
  const kg = data ? Number(data.QtyOnHand) || 0 : 0, pcs = data ? Number(data.QtyPieces) || 0 : 0;
  return pcs > 0 && kg > 0 ? kg / pcs : 0;
}
/** বিক্রয়/বিক্রয় ফেরতের স্টক পোস্ট — পিসের আইটেমে পিস ও (পিস × গড় ওজন) কেজি, কেজির আইটেমে শুধু কেজি */
async function postSalesStock(itemId, warehouseId, date, txType, refModule, refId, qty, sign) {
  qty = Number(qty) || 0;
  if (await itemIsPiece(itemId)) {
    const avg = await avgKgPerPiece(itemId, warehouseId);
    await postStockMovement(itemId, warehouseId, date, txType, refModule, refId, sign * qty * avg, sign * qty);
  } else {
    await postStockMovement(itemId, warehouseId, date, txType, refModule, refId, sign * qty, 0);
  }
}

/** UOM-এর DecimalPlaces অনুযায়ী পরিমাণ ফরম্যাট করে — যেমন কেজি হলে 10.000, পিস হলে 12.00 */
function formatQtyByUOM(qty, uomId, unitsList) {
  const unit = (unitsList || []).find(function (u) { return u.UOMID === uomId; });
  const decimals = unit && unit.DecimalPlaces !== undefined && unit.DecimalPlaces !== '' ? Number(unit.DecimalPlaces) : 2;
  return (Number(qty) || 0).toFixed(decimals);
}

  'অনুরোধকারী':'Requested By','অর্ডারের তারিখ':'Order Date','প্রত্যাশিত তারিখ':'Expected Date',
  'গ্রহণের তারিখ':'Receive Date','বিল নম্বর':'Bill No','ডেলিভারির তারিখ':'Delivery Date',
  'কার কাছে':'Issued To','উৎস':'From','গন্তব্য':'To','কারণ':'Reason',
  'উৎপাদন আদেশ':'Production Order','বিবরণ':'Narration','Invoice':'Invoice'
};
function bnToEn(bnLabel) {
  if (!bnLabel) return bnLabel;
  return BN_EN_DICT[bnLabel] || bnLabel;
}

function t(bn, en) { return currentLang === 'bn' ? bn : (en || bn); }

function applyLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-switch button').forEach(function (btn) { btn.classList.toggle('active', btn.dataset.lang === lang); });
  updateModalLangButtons();
  document.querySelectorAll('[data-bn]').forEach(function (el) {
    const text = el.getAttribute('data-' + lang);
    if (text !== null) el.textContent = text;
  });
  // সাইডবার সাবমেনুর active লেবেলও (module/page breadcrumb) নতুন ভাষায় রিফ্রেশ হবে
  const activeSub = document.querySelector('.submenu a.active');
  if (activeSub) {
    document.getElementById('crumbTitle').textContent = getLangText(activeSub);
    document.getElementById('crumbPath').textContent = activeSub.dataset[lang === 'bn' ? 'mbn' : 'men'] + ' / ' + getLangText(activeSub);
  }
  renderTabBar();
}
document.getElementById('langSwitch').querySelectorAll('button').forEach(function (btn) {
  btn.addEventListener('click', function () { applyLang(btn.dataset.lang); });
});

/* ============================================================
   ১৯) ডিজিটাল ঘড়ি — টপবার ও মোডাল দুই জায়গাতেই লাইভ সময় দেখাবে
   ============================================================ */
(function startClock() {
  function tick() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    const clockEl = document.getElementById('digitalClock');
    if (clockEl) clockEl.textContent = timeStr;
    const modalClockEl = document.getElementById('modalClock');
    if (modalClockEl) modalClockEl.textContent = timeStr;
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
