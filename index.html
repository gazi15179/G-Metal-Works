    const shown = ov ? r.amt[roleId] : (q && rate ? hrMoney(q * rate) : '');
    const lead = rate ? t('দর ','rate ') + hrMoney(rate) + ' =' : `<button type="button" class="setrate" data-setrate="${attr(itemId + '|' + roleId)}">${t('দর নেই — দিন','No rate — set')}</button>`;
    const tip = (rate ? t('হিসাবঃ ','Calc: ') + hrNum(q) + ' × ' + hrMoney(rate) + ' = ' + hrMoney(q * rate) + ' — ' : '') + t('নিজে লিখে বদলানো যায়; খালি করলে আবার হিসাবের মান','Type to override; clear to go back to the calculated value');
    return lead + `<input type="number" step="any" min="0" inputmode="decimal" class="dpg-amt ${ov ? 'ov' : ''}" data-amtin="${attr(itemId + '|' + roleId)}" value="${attr(shown)}" placeholder="${t('টাকা','Amount')}" title="${attr(tip)}" ${r.locked ? 'disabled' : ''}>`;
  }

  function renderGrid() {
    const list = filtered(false), wrap = document.getElementById('dpgGrid');

    if (!st.group && !st.cat && !st.item) { wrap.innerHTML = `<div class="dpg-hint">${t('গ্রুপ, ক্যাটাগরি বা আইটেম বাছাই করুন।','Select a group, category or item.')}</div>`; renderSum(); return; }
    wrap.innerHTML = list.length ? `<div class="dpg-scroll"><table class="dpg-tbl"><thead><tr>
        <th>${t('আইটেম','Item')}</th><th>${t('পরিমাণ (কেজি)','Qty (kg)')}</th>${roles.map(function (r) { return `<th>${escapeHtml(r.RoleName)}</th>`; }).join('')}${croles.map(function (r) { return `<th class="cst" title="${attr(t('খরচের খাত — প্রসেসিং ভাউচারে যায়','Cost head — goes to the processing voucher'))}">${escapeHtml(r.RoleName)}</th>`; }).join('')}</tr></thead><tbody>
      ${list.map(function (i) {
        const r = row(i.ItemID), dis = r.locked ? 'disabled' : '';
        const has = (Number(r.qty) || 0) > 0 || Object.keys(r.who).some(function (k) { return r.who[k]; });
        return `<tr class="${has ? 'has' : ''} ${r.dirty ? 'dirty' : ''} ${r.locked ? 'locked' : ''}" title="${r.locked ? t('এই উৎপাদনের মজুরি বেতন রানে উঠে গেছে — বদলানো যাবে না','Already paid in a salary run — locked') : ''}">
          <td title="${attr(i.ItemName)}">${escapeHtml(i.ItemName)}${r.locked ? ' 🔒' : ''}</td>
          <td><input type="number" step="any" min="0" inputmode="decimal" data-qty="${attr(i.ItemID)}" value="${attr(r.qty)}" ${dis}></td>
          ${roles.map(function (ro) {
            const rate = gp.rateOf(i.ItemID, ro.RoleID);
            return `<td><select data-item="${attr(i.ItemID)}" data-role="${attr(ro.RoleID)}" ${dis} title="${t('দর ','Rate ')}${rate ? hrMoney(rate) : t('ঠিক করা নেই','not set')}">${empOptions(r.who[ro.RoleID])}</select>
              <div class="amt ${r.who[ro.RoleID] ? 'on' : ''}" data-amt="${attr(i.ItemID + '|' + ro.RoleID)}">${amtText(i.ItemID, ro.RoleID)}</div></td>`;
          }).join('')}${croles.map(function (ro) {
            return `<td class="cst"><div class="amt ${(Number(r.qty) || 0) > 0 ? 'on' : ''}" data-camt="${attr(i.ItemID + '|' + ro.RoleID)}">${costText(i.ItemID, ro.RoleID)}</div></td>`;
          }).join('')}</tr>`;
      }).join('')}</tbody></table></div>` : `<div class="dpg-hint">${t('এই বাছাইয়ে কোনো আইটেম নেই।','No items for this selection.')}</div>`;
    renderSum();
  }
  function renderBonus() {
    const el = document.getElementById('dpgBonus');
    el.innerHTML = st.bonus.length ? st.bonus.map(function (b, i) {
      const dis = b.billed ? 'disabled' : '';
      return `<div class="dpg-brow"><select data-bi="${i}" data-bf="emp" ${dis}>${empOptions(b.emp)}</select>
        <input type="number" step="any" min="0" placeholder="${t('টাকা','Amount')}" data-bi="${i}" data-bf="amount" value="${attr(b.amount)}" ${dis}>
        <input class="note" placeholder="${t('কারণ (যেমনঃ ভালো কাজ, ঈদ)','Reason')}" data-bi="${i}" data-bf="note" value="${attr(b.note)}" ${dis}>
        ${b.billed ? `<span title="${t('বেতনে উঠে গেছে','Paid')}">🔒</span>` : `<button type="button" data-bdel="${i}">✕</button>`}</div>`;
    }).join('') : `<div class="dpg-hint">${t('এই দিনে কোনো বোনাস নেই।','No bonus on this day.')}</div>`;
  }
  function renderSum() {
    let kg = 0, wage = 0, cost = 0, n = 0, dirty = 0;
    Object.keys(st.rows).forEach(function (id) {
      const r = st.rows[id], q = Number(r.qty) || 0;
      if (r.dirty) dirty++;
      if (q > 0) { kg += q; n++; roles.forEach(function (ro) { if (r.who[ro.RoleID]) wage += rowAmount(id, ro.RoleID); }); croles.forEach(function (ro) { cost += costAmount(id, ro.RoleID); }); }
    });
    if (st.bonusDirty) dirty++;
    document.getElementById('dpgSum').innerHTML = `<span>${hrDayLabel(st.date)}</span><span>${t('আইটেম ','Items ')}<b>${n}</b></span><span>${t('মোট ','Total ')}<b>${hrNum(kg)}</b> ${t('কেজি','kg')}</span><span>${t('মজুরি ','Wages ')}<b>${hrMoney(wage)}</b></span>${croles.length ? `<span>${t('খরচ ','Costs ')}<b>${hrMoney(cost)}</b></span><span>${t('মজুরি + খরচ ','Wages + costs ')}<b>${hrMoney(wage + cost)}</b></span>` : ''}${dirty ? `<span style="color:#d97706;">● ${dirty} ${t('টা সারি সেভ হয়নি','row(s) unsaved')}</span>` : ''}${st.newPageHeads ? `<span style="color:#b42318;font-weight:700;">⚠️ ${t('এই দিনের মজুরি নতুন "দৈনিক উৎপাদন" পেজেও আছে — এখানে দিলে দুবার উঠবে','This day also has wages on the new "Daily production" page — entering here counts them twice')}</span>` : ''}
      <span style="color:var(--text-muted);">✓ = ${t('আজ হাজিরায় P','present today')}</span><span style="color:var(--text-muted);">✎ ${t('টাকার ঘর হাতে বদলানো যায় (কমলা = হাতে লেখা)','Amounts can be edited (orange = typed)')}</span>`;
  }

  // ---------- দিনের ডেটা ----------
  async function loadRates() {
    try {
      const data = await selectAllRows('SizeRates');
      Object.keys(gp.rate).forEach(function (k) { delete gp.rate[k]; });
      (data || []).forEach(function (x) { if (Number(x.Rate) > 0) gp.rate[x.ItemID + '|' + x.RoleID] = Number(x.Rate); });
    } catch (e) {}
  }
  async function loadDay() {
    st.rows = {}; st.bonus = []; st.bonusDirty = false;
    await loadRates();
    try {
      const bon = await hrQueryRange('DailyBonus', 'WorkDate', st.date, st.date);
      st.bonus = bon.map(function (b) { return { id: b.BonusID, emp: b.EmployeeID, amount: b.Amount, note: b.Note || '', billed: !!b.BilledIn }; });
    } catch (e) { st.bonus = []; }
    try {
      const [att, heads] = await Promise.all([hrQueryRange('Attendance', 'Date', st.date, st.date), hrQueryRange('TeamProduction', 'WorkDate', st.date, st.date)]);
      st.present = {}; att.forEach(function (a) { if (HR_ATT_CODE[a.Status] === 'P') st.present[a.EmployeeID] = true; });
      const own = heads.filter(function (h) { return !h.ProcessingID && !h.DPLineID; });   // প্রোডাকশন → দৈনিক উৎপাদনের ২য় অংশের রেকর্ড এখানে নয়
    st.newPageHeads = heads.filter(function (h) { return h.DPLineID; }).length;   // নতুন পেজে এই দিনের মজুরি — দুই জায়গায় দিলে বেতনে দুবার উঠবে
      if (own.length) {
        const ids = own.map(function (h) { return h.TeamProdID; });
        const [{ data: its }, { data: mems }, costRes] = await Promise.all([
          supabaseClient.from('TeamProduction_Items').select('*').in('TeamProdID', ids),
          supabaseClient.from('TeamProduction_Members').select('*').in('TeamProdID', ids),
          supabaseClient.from('TeamProduction_Costs').select('*').in('TeamProdID', ids)
        ]);
        const costs = (costRes && !costRes.error && costRes.data) || [];
        own.forEach(function (h) {
          const it = (its || []).find(function (x) { return String(x.TeamProdID) === String(h.TeamProdID); }); if (!it) return;
          const r = row(it.ItemID); r.tpId = h.TeamProdID; r.qty = Number(it.Qty) || Number(h.TotalKg) || '';
          (mems || []).filter(function (x) { return String(x.TeamProdID) === String(h.TeamProdID); }).forEach(function (mm) {
            if (mm.RoleID) {
              r.who[mm.RoleID] = mm.EmployeeID;
              // সেভ করা টাকা দর × কেজি থেকে আলাদা হলে সেটা হাতে লেখা — সেভাবেই দেখানো (দর পরে বদলালেও আগের মজুরি ঠিক থাকে)
              const calc = (Number(r.qty) || 0) * gp.rateOf(it.ItemID, mm.RoleID);
              if (mm.Amount !== null && mm.Amount !== undefined && Math.abs((Number(mm.Amount) || 0) - calc) > 0.004) r.amt[mm.RoleID] = String(Number(mm.Amount) || 0);
            }
            if (mm.BilledIn) r.locked = true;
          });
          // খরচের খাতঃ সেভ করা টাকা দর × কেজি থেকে আলাদা হলে সেটা হাতে লেখা
          costs.filter(function (x) { return String(x.TeamProdID) === String(h.TeamProdID) && x.RoleID; }).forEach(function (cx) {
            const calc = (Number(r.qty) || 0) * gp.rateOf(it.ItemID, cx.RoleID);
            if (cx.Amount !== null && cx.Amount !== undefined && Math.abs((Number(cx.Amount) || 0) - calc) > 0.004) r.camt[cx.RoleID] = String(Number(cx.Amount) || 0);
          });
        });
      }
    } catch (err) { showToast(err.message, 'error'); }
    renderGrid(); renderBonus();
  }

  // ---------- ইভেন্ট ----------
  document.getElementById('dpgDate').addEventListener('change', function () {
    if (!this.value) return;
    if ((st.bonusDirty || Object.keys(st.rows).some(function (k) { return st.rows[k].dirty; })) && !confirm(t('সেভ না করা পরিবর্তন আছে — তারিখ বদলালে হারিয়ে যাবে। চালিয়ে যাবেন?','Unsaved changes will be lost. Continue?'))) { this.value = st.date; return; }
    st.date = this.value; loadDay();
  });
  document.getElementById('dpgGroup').addEventListener('change', function () { st.group = this.value; fillCats(); fillItems(); renderGrid(); });
  document.getElementById('dpgCat').addEventListener('change', function () { st.cat = this.value; fillItems(); renderGrid(); });
  document.getElementById('dpgItem').addEventListener('change', function () { st.item = this.value; renderGrid(); });
  const grid = document.getElementById('dpgGrid');
  document.getElementById('dpgBonusAdd').addEventListener('click', function () { st.bonus.push({ id: null, emp: '', amount: '', note: '', billed: false }); st.bonusDirty = true; renderBonus(); renderSum(); });
  const bonEl = document.getElementById('dpgBonus');
  function onBonus(ev) { const el = ev.target; if (el.dataset.bi === undefined) return; st.bonus[Number(el.dataset.bi)][el.dataset.bf] = el.value; if (!st.bonusDirty) { st.bonusDirty = true; renderSum(); } }
  bonEl.addEventListener('input', onBonus); bonEl.addEventListener('change', onBonus);
  bonEl.addEventListener('click', function (ev) { const b = ev.target.closest('[data-bdel]'); if (!b) return; st.bonus.splice(Number(b.dataset.bdel), 1); st.bonusDirty = true; renderBonus(); renderSum(); });
  grid.addEventListener('input', function (ev) {
    const el = ev.target;
    if (el.dataset.amtin) {   // টাকার ঘরে হাতে লেখা
      const p = el.dataset.amtin.split('|'), ar = row(p[0]);
      if (el.value === '') delete ar.amt[p[1]]; else ar.amt[p[1]] = el.value;
      ar.dirty = true; el.closest('tr').classList.add('dirty'); el.classList.toggle('ov', el.value !== '');
      renderSum(); return;
    }
    if (el.dataset.camtin) {   // খরচের ঘরে হাতে লেখা
      const p = el.dataset.camtin.split('|'), cr = row(p[0]);
      if (el.value === '') delete cr.camt[p[1]]; else cr.camt[p[1]] = el.value;
      cr.dirty = true; el.closest('tr').classList.add('dirty'); el.classList.toggle('ov', el.value !== '');
      renderSum(); return;
    }
    if (!el.dataset.qty) return;
    const r = row(el.dataset.qty); r.qty = el.value; r.dirty = true;
    const tr = el.closest('tr'); tr.classList.add('dirty'); tr.classList.toggle('has', Number(el.value) > 0 || Object.keys(r.who).some(function (k) { return r.who[k]; }));
    roles.forEach(function (ro) { const a = grid.querySelector(`[data-amt="${el.dataset.qty}|${ro.RoleID}"]`); if (a) a.innerHTML = amtText(el.dataset.qty, ro.RoleID); });
    croles.forEach(function (ro) { const a = grid.querySelector(`[data-camt="${el.dataset.qty}|${ro.RoleID}"]`); if (a) { a.innerHTML = costText(el.dataset.qty, ro.RoleID); a.classList.toggle('on', Number(el.value) > 0); } });
    renderSum();
  });
  grid.addEventListener('click', async function (ev) {
    const b = ev.target.closest('[data-setrate]'); if (!b) return;
    const p = b.dataset.setrate.split('|'), it = items.find(function (x) { return x.ItemID === p[0]; }) || {};
    const v = prompt((it.ItemName || '') + ' — ' + (gp.roleMap[p[1]] || '') + t(' এর দর (প্রতি কেজি):',' rate (per kg):'), '');
    if (v === null) return;
    const rate = Number(String(v).replace(/[০-৯]/g, function (d) { return '০১২৩৪৫৬৭৮৯'.indexOf(d); }));
    if (!(rate > 0)) { showToast(t('সঠিক দর লিখুন।','Enter a valid rate.'), 'error'); return; }
    const { error } = await supabaseClient.from('SizeRates').upsert({ ItemID: p[0], RoleID: p[1], Rate: rate }, { onConflict: 'ItemID,RoleID' });
    if (error) { showToast(error.message, 'error'); return; }
    gp.rate[p[0] + '|' + p[1]] = rate; listCache = {};
    showToast(t('দর সেভ হয়েছে — মজুরি দর পেজেও বসে গেছে ✅','Rate saved — also in the rate page ✅'), 'success');
    const sc = grid.querySelector('.dpg-scroll'), top = sc ? sc.scrollTop : 0, left = sc ? sc.scrollLeft : 0;
    renderGrid(); const sc2 = grid.querySelector('.dpg-scroll'); if (sc2) { sc2.scrollTop = top; sc2.scrollLeft = left; }
  });
  grid.addEventListener('change', function (ev) {
    const el = ev.target;
    if (el.dataset.amtin) {   // টাকার ঘর খালি রেখে বের হলে আবার দর × কেজি দেখানো
      if (el.value === '') { const p = el.dataset.amtin.split('|'), a = grid.querySelector(`[data-amt="${p[0]}|${p[1]}"]`); if (a) a.innerHTML = amtText(p[0], p[1]); }
      return;
    }
    if (el.dataset.camtin) {
      if (el.value === '') { const p = el.dataset.camtin.split('|'), a = grid.querySelector(`[data-camt="${p[0]}|${p[1]}"]`); if (a) a.innerHTML = costText(p[0], p[1]); }
      return;
    }
    if (!el.dataset.role) return;
    const r = row(el.dataset.item); r.who[el.dataset.role] = el.value; r.dirty = true;
    // ক্রল পজিশন ঠিক রেখে শুধু টেবিল নতুন করে
    const sc = grid.querySelector('.dpg-scroll'), top = sc ? sc.scrollTop : 0, left = sc ? sc.scrollLeft : 0;
    renderGrid(); const sc2 = grid.querySelector('.dpg-scroll'); if (sc2) { sc2.scrollTop = top; sc2.scrollLeft = left; }
  });

  document.getElementById('dpgSave').addEventListener('click', async function () {
    if (st.newPageHeads && !confirm(t('এই তারিখের মজুরি নতুন "দৈনিক উৎপাদন" পেজে (২য় অংশ) আগেই দেওয়া আছে। এখানেও দিলে সেলারী ভাউচারে একই মজুরি দুবার উঠবে। তবুও সেভ করবেন?', 'Wages for this date already exist on the new "Daily production" page. Saving here too will count them twice in the salary voucher. Save anyway?'))) return;
    const dirty = Object.keys(st.rows).filter(function (k) { return st.rows[k].dirty && !st.rows[k].locked; });
    if (!dirty.length && !st.bonusDirty) { showToast(t('সেভ করার মতো কোনো পরিবর্তন নেই।','Nothing to save.'), 'error'); return; }
    for (const b of st.bonus) {
      if (b.billed) continue;
      if ((Number(b.amount) || 0) > 0 && !b.emp) { showToast(t('বোনাস — কর্মচারী বাছাই করুন।','Bonus — select the employee.'), 'error'); return; }
      if (b.emp && !((Number(b.amount) || 0) > 0)) { showToast(t('বোনাস — টাকার অঙ্ক লিখুন।','Bonus — enter the amount.'), 'error'); return; }
    }
    const itemName = {}; items.forEach(function (i) { itemName[i.ItemID] = i.ItemName; });
    for (const id of dirty) {
      const r = st.rows[id], q = Number(r.qty) || 0, who = Object.keys(r.who).filter(function (k) { return r.who[k]; });
      if (q > 0 && !who.length) { showToast(itemName[id] + t(' — কে বানিয়েছে সেটা বাছাই করুন।',' — select who made it.'), 'error'); return; }
      if (q <= 0 && who.length) { showToast(itemName[id] + t(' — পরিমাণ (কেজি) লিখুন।',' — enter the quantity (kg).'), 'error'); return; }
      if (who.some(function (k) { return hasOv(r, k) && !(Number(r.amt[k]) >= 0); })) { showToast(itemName[id] + t(' — টাকার অঙ্ক সঠিক নয়।',' — the amount is not valid.'), 'error'); return; }
      if (croles.some(function (ro) { return hasCOv(r, ro.RoleID) && !(Number(r.camt[ro.RoleID]) >= 0); })) { showToast(itemName[id] + t(' — খরচের টাকার অঙ্ক সঠিক নয়।',' — a cost amount is not valid.'), 'error'); return; }
      const noRate = who.filter(function (k) { return !gp.rateOf(id, k) && !hasOv(r, k); });   // হাতে টাকা লেখা থাকলে দর না থাকলেও চলবে
      if (q > 0 && noRate.length) { showToast(itemName[id] + ' — ' + noRate.map(function (k) { return gp.roleMap[k]; }).join(', ') + t(' এর দর ঠিক করা নেই ("সাইজ অনুযায়ী মজুরি দর" পেজে দিন)।',': rate not set (use "Size Wage Rates").'), 'error'); return; }
    }
    this.disabled = true;
    try {
      for (const id of dirty) {
        const r = st.rows[id], q = Number(r.qty) || 0;
        if (r.tpId) {
          await supabaseClient.from('TeamProduction_Members').delete().eq('TeamProdID', r.tpId);
          await supabaseClient.from('TeamProduction_Costs').delete().eq('TeamProdID', r.tpId);
          await supabaseClient.from('TeamProduction_Items').delete().eq('TeamProdID', r.tpId);
          await supabaseClient.from('TeamProduction').delete().eq('TeamProdID', r.tpId);
          r.tpId = null;
        }
        if (q > 0) {
          const it = items.find(function (x) { return x.ItemID === id; }) || {};
          const { data: hd, error } = await supabaseClient.from('TeamProduction').insert({ WorkDate: st.date, GroupID: it.GroupID || null, TotalKg: q, TargetKg: 0, ExtraKg: 0, IsHoliday: false }).select();
          if (error) throw new Error(error.message);
          const pid = hd[0].TeamProdID;
          const e1 = (await supabaseClient.from('TeamProduction_Items').insert({ TeamProdID: pid, ItemID: id, Qty: q })).error;
          const mems = Object.keys(r.who).filter(function (k) { return r.who[k]; }).map(function (k) {
            const rate = gp.rateOf(id, k), amount = hasOv(r, k) ? (Number(r.amt[k]) || 0) : q * rate;
            // বেতন শিটে দর × কেজি = টাকা মেলাতে, হাতে লেখা টাকার ক্ষেত্রে কার্যকর দর (টাকা ÷ কেজি) রাখা হয়
            return { TeamProdID: pid, EmployeeID: r.who[k], RoleID: k, Rate: q > 0 ? amount / q : rate, Amount: amount };
          });
          const e2 = e1 || (await supabaseClient.from('TeamProduction_Members').insert(mems)).error;
          // খরচের খাতঃ দর আছে বা হাতে টাকা লেখা এমন প্রতিটা খাতের সারি (শূন্য টাকাও — যাতে "ইচ্ছা করে শূন্য" বোঝা যায়)
          const crows = croles.map(function (ro) {
            const rate = gp.rateOf(id, ro.RoleID), ov = hasCOv(r, ro.RoleID);
            if (!ov && !rate) return null;
            const amount = ov ? (Number(r.camt[ro.RoleID]) || 0) : q * rate;
            return { TeamProdID: pid, RoleID: ro.RoleID, Rate: q > 0 ? amount / q : rate, Amount: amount };
          }).filter(Boolean);
          const e3 = (e1 || e2 || !crows.length) ? null : (await supabaseClient.from('TeamProduction_Costs').insert(crows)).error;
          if (e1 || e2 || e3) {
            await supabaseClient.from('TeamProduction_Members').delete().eq('TeamProdID', pid);
            await supabaseClient.from('TeamProduction_Items').delete().eq('TeamProdID', pid);
            await supabaseClient.from('TeamProduction').delete().eq('TeamProdID', pid);
            throw new Error((e1 || e2 || e3).message + (e3 ? t(' — (22_team_production_costs.sql মাইগ্রেশন রান করা আছে কিনা দেখুন)',' — (check that migration 22_team_production_costs.sql has been run)') : ''));
          }
          r.tpId = pid;
        }
        r.dirty = false;
      }
      if (st.bonusDirty) {
        // বেতনে না ওঠা বোনাসগুলো নতুন করে লেখা
        const { error: de } = await supabaseClient.from('DailyBonus').delete().eq('WorkDate', st.date).is('BilledIn', null);
        if (de) throw new Error(de.message);
        const rowsB = st.bonus.filter(function (b) { return !b.billed && b.emp && Number(b.amount) > 0; }).map(function (b) { return { WorkDate: st.date, EmployeeID: b.emp, Amount: Number(b.amount), Note: b.note || '' }; });
        if (rowsB.length) { const { error } = await supabaseClient.from('DailyBonus').insert(rowsB); if (error) throw new Error(error.message); }
        st.bonusDirty = false;
      }
      showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
      await loadDay();
    } catch (err) { showToast(err.message, 'error'); }
    this.disabled = false;
  });

  fillCats(); fillItems();
  const req = window.__dpgOpen; window.__dpgOpen = null;
  if (req && req.date) { st.date = req.date; document.getElementById('dpgDate').value = req.date; }
  await loadDay();
}

/* ============================================================
   সেলারী ভাউচার — প্রতিজন কর্মচারীর জন্য আলাদা ভাউচার
   ধরনঃ হাজিরা / মুজুরী / হাজিরা ও মুজুরী (আপাতত শুধু ৩য়টা চালু)
   • তারিখ, আইটেম, কেজি, দর, মুজুরী — দৈনিক উৎপাদন ও দল পেজ থেকে নিজে থেকে
   • দিনঃ টিক দিলে সেদিনের হাজিরা (হাজিরা পেজে P থাকলে দৈনিক হাজিরা) মোটে যোগ হয়; টাকা হাতে বদলানো যায়
   • অন্যান্যঃ খাত বাছাই (বোনাস, অগ্রিম কর্তন…) + টাকা; কর্তনের খাত বিয়োগ হয়; ড্রপডাউনেই নতুন খাত
   • + দিয়ে বাড়তি সারি (শুধু এই ভাউচারে)
   ============================================================ */
function payrollPeriodLabel(r) {

  // ---------- কর্মচারীর সপ্তাহের ডেটা ----------
  async function loadFresh() {

    const ex = (await api('list', { sheet: 'Payroll' })).filter(function (h) { return h.Status !== 'Deleted' && h.RunType === 'SalaryVoucher' && h.EmployeeID === st.emp && !(String(h.DateTo).slice(0, 10) < st.from || String(h.DateFrom).slice(0, 10) > st.to); });
    if (ex.length) { showToast(t('এই সময়ের ভাউচার আগেই আছে — সেটা খোলা হলো ', 'A voucher already exists — opened ') + (ex[0].VoucherNo || ex[0].PayrollID), 'success'); await openSaved(ex[0]); return; }
    const [att, tp, bon] = await Promise.all([

    ]);
    let mems = [], tpi = [];
    // প্রতিটা মজুরি-রেকর্ড কোথা থেকে — নতুন "দৈনিক উৎপাদন" (ক্রঃ সহ) নাকি পুরনো "দৈনিক উৎপাদন ও দল" পেজ
    const srcOf = {};
    tp.forEach(function (h) { srcOf[String(h.TeamProdID)] = h.DPLineID ? { k: 'dp', dp: h.DPLineID } : { k: 'old' }; });
    const dpIds = tp.filter(function (h) { return h.DPLineID; }).map(function (h) { return h.DPLineID; });
    if (dpIds.length) {
      try { const dr = await supabaseClient.from('DailyProduction').select('id,SerialNo').in('id', dpIds); const sn = {}; ((dr && dr.data) || []).forEach(function (x) { sn[String(x.id)] = x.SerialNo; }); Object.keys(srcOf).forEach(function (k) { if (srcOf[k].k === 'dp') srcOf[k].sn = sn[String(srcOf[k].dp)]; }); } catch (e) {}
    }
    if (tp.length) {
      const ids = tp.map(function (h) { return h.TeamProdID; });
      const [r1, r2] = await Promise.all([supabaseClient.from('TeamProduction_Members').select('*').in('TeamProdID', ids), supabaseClient.from('TeamProduction_Items').select('*').in('TeamProdID', ids)]);
      mems = (r1.data || []).filter(function (m) { return m.EmployeeID === st.emp && !m.BilledIn; });
      tpi = r2.data || [];
    }
    const tpDate = {}; tp.forEach(function (h) { tpDate[String(h.TeamProdID)] = String(h.WorkDate).slice(0, 10); });
    const attBy = {}; att.forEach(function (a) { if (a.EmployeeID === st.emp) { const c = HR_ATT_CODE[a.Status]; if (c) attBy[String(a.Date).slice(0, 10)] = c; } });
    const bonusHead = heads.find(function (h) { return /বোনাস|bonus/i.test(h.HeadName) && h.HeadType !== 'Deduction'; });
    const wage = wageOf();
    st.days = hrDatesBetween(st.from, st.to).map(function (d) {
      const rows = [];
      mems.filter(function (m) { return tpDate[String(m.TeamProdID)] === d; }).forEach(function (m) {
        const its = tpi.filter(function (x) { return String(x.TeamProdID) === String(m.TeamProdID); });
        const r = newRow('prod');
        r.memIds = [m.MemberID]; r.itemId = its.length === 1 ? its[0].ItemID : '';
        r.item = its.map(function (x) { return itemName[x.ItemID] || x.ItemID; }).join(', ') + (m.RoleID && gp.roleMap[m.RoleID] ? ' · ' + gp.roleMap[m.RoleID] : '');
        r.qty = its.reduce(function (s, x) { return s + (Number(x.Qty) || 0); }, 0); r.rate = Number(m.Rate) || 0; r.wage = Number(m.Amount) || 0;
        const so = srcOf[String(m.TeamProdID)] || { k: 'old' };
        r.src = so.k; r.srcLbl = so.k === 'dp' ? t('দৈনিক উৎপাদন', 'Daily production') + (so.sn ? t(' ক্রঃ ', ' line ') + so.sn : '') : t('পুরনো পেজ "দৈনিক উৎপাদন ও দল"', 'old "Daily production & team" page');
        r.dupKey = its.map(function (x) { return x.ItemID; }).sort().join('+') + '|' + (m.RoleID || '');
        rows.push(r);
      });
      // একই দিনে দুই জায়গার মজুরি, অথবা একই আইটেম+কাজ দুবার → সম্ভাব্য ডবল এন্ট্রি
      const prod = rows.filter(function (r) { return r.kind === 'prod'; });
      const mixed = prod.some(function (r) { return r.src === 'dp'; }) && prod.some(function (r) { return r.src === 'old'; });
      const cnt = {}; prod.forEach(function (r) { cnt[r.dupKey] = (cnt[r.dupKey] || 0) + 1; });
      prod.forEach(function (r) { r.dupWarn = mixed || cnt[r.dupKey] > 1; });
      bon.filter(function (b) { return b.EmployeeID === st.emp && !b.BilledIn && String(b.WorkDate).slice(0, 10) === d; }).forEach(function (b) {
        const r = newRow('bonus'); r.bonusIds = [b.BonusID]; r.item = t('বোনাস','Bonus') + (b.Note ? ' — ' + b.Note : '');
        r.head = bonusHead ? bonusHead.HeadID : ''; r.oth = Number(b.Amount) || 0; rows.push(r);
      });
      if (!rows.length) rows.push(newRow('manual'));
      const c = attBy[d] || '';
      return { date: d, att: c, hajOn: false, haj: c === 'P' ? Math.round(wage * 100) / 100 : '', rows: rows };
    });
    st.dirty = false; renderBody();
  }
  async function openSaved(h) {

    st.vdate = String(h.VoucherDate || h.DateTo || hrToday()).slice(0, 10); st.from = String(h.DateFrom).slice(0, 10); st.to = String(h.DateTo).slice(0, 10);

    const by = {}; hrDatesBetween(st.from, st.to).forEach(function (d) { by[d] = { date: d, att: '', hajOn: false, haj: '', rows: [] }; });
    (det || []).sort(function (a, b) { return (Number(a.DetailID) || 0) - (Number(b.DetailID) || 0); }).forEach(function (x) {
      const d = by[String(x.WorkDate).slice(0, 10)]; if (!d) return;

      else if (x.DetailType === 'SVRow') {
        let meta = {}; try { meta = JSON.parse(x.Description || '{}'); } catch (e2) {}
        const r = newRow(meta.k || 'manual'); r.item = meta.n || ''; r.itemId = x.ItemID || ''; r.qty = x.Qty || ''; r.rate = x.Rate || ''; r.wage = Number(x.Amount) || 0;
        r.head = x.HeadID || ''; r.oth = meta.o || ''; r.memIds = meta.m || []; r.bonusIds = meta.b || []; d.rows.push(r);
      }
    });
    st.days = Object.keys(by).sort().map(function (k) { if (!by[k].rows.length) by[k].rows.push(newRow('manual')); return by[k]; });

  // ---------- সেভ ----------
  async function nextVoucherNo() {
    const all = await api('list', { sheet: 'Payroll' });
    const n = all.reduce(function (m, h) { const x = /^SV-(\d+)$/.exec(h.VoucherNo || ''); return x ? Math.max(m, Number(x[1])) : m; }, 0) + 1;
    return 'SV-' + String(n).padStart(4, '0');
  }
  async function save() {
    if (!st.emp) throw new Error(t('কর্মচারী বাছাই করুন।','Select an employee.'));
    if (!st.id && dupDays().length && !confirm(t('সম্ভাব্য ডবল এন্ট্রি আছে (', 'Possible double entry (') + dupDays().map(function (d) { return dd(d.date); }).join(', ') + t(') — একই মজুরি দুবার উঠতে পারে। তবুও সেভ করবেন?', ') — the same wage may be counted twice. Save anyway?'))) throw new Error(t('সেভ বাতিল — ডবল এন্ট্রি আগে ঠিক করুন।', 'Save cancelled — fix the double entry first.'));
    if (st.from > st.to) throw new Error(t('তারিখ রেঞ্জ ঠিক নেই।','Invalid date range.'));
    for (const d of st.days) for (const r of d.rows) {
      if (r.kind === 'manual' && (Number(r.qty) || 0) > 0 && !(Number(r.rate) > 0)) throw new Error(dd(d.date) + t(' — বাড়তি সারির দর লিখুন।',' — enter the rate.'));
      if ((Number(r.oth) || 0) && !r.head) throw new Error(dd(d.date) + t(' — অন্যান্য টাকার খাত বাছাই করুন।',' — pick a head for the other amount.'));
    }
    const tt = totals(), e = base.empMap[st.emp] || {};
    const hdr = { RunType: 'SalaryVoucher', VoucherType: 'Both', EmployeeID: st.emp, VoucherDate: st.vdate, DateFrom: st.from, DateTo: st.to, TotalNetPay: tt.total, Status: 'Active', Month: HR_MONTHS_BN[hrDate(st.to).getMonth()], Year: String(hrDate(st.to).getFullYear()) };
    let pid = st.id;
    if (pid) {
      await supabaseClient.from('TeamProduction_Members').update({ BilledIn: null }).eq('BilledIn', pid);
      await supabaseClient.from('DailyBonus').update({ BilledIn: null }).eq('BilledIn', pid);
      await supabaseClient.from('Payroll_Details').delete().eq('PayrollID', pid);
      await supabaseClient.from('Payroll_Lines').delete().eq('PayrollID', pid);
      const { error } = await supabaseClient.from('Payroll').update(hdr).eq('PayrollID', pid);
      if (error) throw new Error(error.message);
    } else {
      hdr.VoucherNo = await nextVoucherNo();
      const { data, error } = await supabaseClient.from('Payroll').insert(hdr).select();
      if (error) throw new Error(error.message);
      pid = data[0].PayrollID; st.no = hdr.VoucherNo;
    }
    const p = st.days.filter(function (d) { return d.att === 'P'; }).length, a = st.days.filter(function (d) { return d.att === 'A'; }).length, l = st.days.filter(function (d) { return d.att === 'L'; }).length;
    const plus = st.days.reduce(function (s, d) { return s + d.rows.reduce(function (x, r) { const v = rowOther(r); return x + (v > 0 ? v : 0); }, 0); }, 0);
    const minus = st.days.reduce(function (s, d) { return s + d.rows.reduce(function (x, r) { const v = rowOther(r); return x + (v < 0 ? -v : 0); }, 0); }, 0);
    const r1 = await supabaseClient.from('Payroll_Lines').insert({ PayrollID: pid, EmployeeID: st.emp, CategoryID: e.CategoryID || null, SalaryType: 'Both', DailyWage: wageOf(),
      PresentDays: p, AbsentDays: a, LeaveDays: l, ProductionAmount: tt.wage, AttendancePay: tt.haj, Bonus: plus, Allowance: plus, Deduction: minus, NetPay: tt.total, CalculatedPay: tt.total, BasicSalary: tt.wage, DaysWorked: p, RatePerUnit: wageOf() });
    if (r1.error) throw new Error(r1.error.message);
    const det = [], memIds = [], bonIds = [];
    st.days.forEach(function (d) {
      det.push({ PayrollID: pid, EmployeeID: st.emp, DetailType: 'SVDay', WorkDate: d.date, Description: d.att || '', TargetQty: d.hajOn ? 1 : 0, Amount: Number(d.haj) || 0 });
      d.rows.forEach(function (r) {
        if (r.kind === 'manual' && !rowWage(r) && !(Number(r.oth) || 0) && !r.itemId) return; // খালি সারি বাদ
        const nm = r.kind === 'manual' ? (itemName[r.itemId] || '') : r.item;
        det.push({ PayrollID: pid, EmployeeID: st.emp, DetailType: 'SVRow', WorkDate: d.date, ItemID: r.itemId || null, HeadID: r.head || null, Qty: Number(r.qty) || 0, Rate: Number(r.rate) || 0, Amount: rowWage(r),
          OverQty: rowOther(r), Description: JSON.stringify({ k: r.kind, n: nm, o: r.oth, m: r.memIds, b: r.bonusIds }) });
        memIds.push.apply(memIds, r.memIds); bonIds.push.apply(bonIds, r.bonusIds);
      });
    });
    if (det.length) { const { error } = await supabaseClient.from('Payroll_Details').insert(det); if (error) throw new Error(error.message); }
    if (memIds.length) await supabaseClient.from('TeamProduction_Members').update({ BilledIn: pid }).in('MemberID', memIds);
    if (bonIds.length) await supabaseClient.from('DailyBonus').update({ BilledIn: pid }).in('BonusID', bonIds);
    st.id = pid; st.dirty = false;
  }

  // ---------- সাম্প্রতিক ভাউচার ----------
  async function renderList() {
    const el = document.getElementById('svList'); if (!el) return;

      .sort(function (a, b) { return String(b.VoucherNo || '').localeCompare(String(a.VoucherNo || '')); }).slice(0, 30);

  }

  // ---------- ইভেন্ট ----------
  function guard() { return !st.dirty || confirm(t('সেভ না করা পরিবর্তন আছে — হারিয়ে যাবে। চালিয়ে যাবেন?','Unsaved changes will be lost. Continue?')); }
  document.getElementById('svDate').addEventListener('change', function () { st.vdate = this.value; st.dirty = true; renderState(); });
  async function setRange(from, to) {
    if (!guard()) { document.getElementById('svFrom').value = st.from; document.getElementById('svTo').value = st.to; return; }
    st.from = from; st.to = to || hrAddDays(from, 5);
    document.getElementById('svFrom').value = st.from; document.getElementById('svTo').value = st.to;
    st.dirty = false; await loadFresh();
  }
  document.getElementById('svPrev').addEventListener('click', function () { setRange(hrAddDays(st.from, -7)); });
  document.getElementById('svNext').addEventListener('click', function () { setRange(hrAddDays(st.from, 7)); });
  document.getElementById('svFrom').addEventListener('change', function () { if (this.value) setRange(this.value); });
  document.getElementById('svTo').addEventListener('change', function () { if (this.value) setRange(st.from, this.value); });
  hrNameSuggest(document.getElementById('svEmp'), {
    list: function () { return hrEmpSuggestList(base, base.emps); },
    onPick: async function (it) {
      if (!guard()) { document.getElementById('svEmp').value = (base.empMap[st.emp] || {}).Name || ''; return; }
      st.emp = it.id; document.getElementById('svEmp').value = it.name; showEmpInfo(); st.dirty = false; await loadFresh();
    }
  });

  const body = document.getElementById('svBody');
  function field(el) {
    const di = Number(el.dataset.di), d = st.days[di]; if (!d || !el.dataset.f) return;
    const f = el.dataset.f;
    if (el.dataset.ri !== undefined) {
      const r = d.rows[Number(el.dataset.ri)];
      if (f === 'head' && el.value === '__new') { addHead(el, r); return; }
      if (f === 'head' && el.value === '__manage') { el.value = r.head || ''; manageHeads(); return; }
      r[f] = el.value;
      if (f === 'itemId' && r.kind === 'manual' && !r.rate) { /* দর হাতে লেখা হবে */ }
    } else if (f === 'hajOn') {
      d.hajOn = el.checked;
      if (d.hajOn && (d.haj === '' || d.haj === null)) d.haj = d.att === 'P' ? Math.round(wageOf() * 100) / 100 : 0;
    } else d[f] = el.value;
    st.dirty = true;
  }
  body.addEventListener('change', function (ev) {
    const el = ev.target; if (el.dataset.di === undefined) return;
    if (el.tagName === 'INPUT' && el.type === 'number') return; // সংখ্যা লেখার সময় input ইভেন্টেই
    field(el); refresh();
  });
  function updateNumbers(src) {
    const set = function (sel, v) { body.querySelectorAll(sel).forEach(function (x) { x.textContent = v; }); };
    // টেবিল আর মোবাইল কার্ড — দুই জায়গার একই ঘরে একই মান
    if (src) body.querySelectorAll(`[data-di="${src.dataset.di}"]` + (src.dataset.ri !== undefined ? `[data-ri="${src.dataset.ri}"]` : ':not([data-ri])') + `[data-f="${src.dataset.f}"]`).forEach(function (x) { if (x !== src) x.value = src.value; });
    st.days.forEach(function (d, di) {
      const dc = dayCalc(d);
      set(`[data-dt="${di}"]`, hrMoney(dc.total));
      d.rows.forEach(function (r, ri) {
        set(`[data-rw="${di}|${ri}"]`, hrMoney(rowWage(r)));
        set(`[data-rt="${di}|${ri}"]`, hrMoney(rowWage(r) + rowOther(r) + (ri === 0 && d.hajOn ? (Number(d.haj) || 0) : 0)));
      });
    });
    const tt = totals(), neg = (tt.oth < 0 ? '−' : '') + hrMoney(Math.abs(tt.oth));
    set('#svSW', hrMoney(tt.wage)); set('#svSH', hrMoney(tt.haj)); set('#svSO', hrMoney(tt.oth)); set('#svST', hrMoney(tt.total));
    set('#svFW', hrMoney(tt.wage)); set('#svFH', hrMoney(tt.haj)); set('#svFO', neg); set('#svFT', hrMoney(tt.total));
    renderState();
  }
  body.addEventListener('input', function (ev) {
    const el = ev.target; if (el.dataset.di === undefined || !(el.tagName === 'INPUT' && el.type === 'number')) return;
    field(el);
    updateNumbers(el);
  });
  /** অন্যান্য খাতের তালিকা — নাম বদল, যোগ/কর্তন বদল, ডিলিট, নতুন যোগ */
  function manageHeads() {
    let list = heads.map(function (h) { return { id: h.HeadID, name: h.HeadName, type: h.HeadType === 'Deduction' ? 'Deduction' : 'Earning', del: false }; });
    const usedIds = {}; st.days.forEach(function (d) { d.rows.forEach(function (r) { if (r.head) usedIds[r.head] = true; }); });
    function html() {
      return `<div class="hm-list">${list.map(function (h, i) {
        return `<div class="hm-row ${h.del ? 'del' : ''}"><input data-hi="${i}" data-hf="name" value="${attr(h.name)}" ${h.del ? 'disabled' : ''} placeholder="${t('খাতের নাম','Head name')}">
          <select data-hi="${i}" data-hf="type" ${h.del ? 'disabled' : ''}><option value="Earning" ${h.type === 'Earning' ? 'selected' : ''}>${t('যোগ (+)','Add (+)')}</option><option value="Deduction" ${h.type === 'Deduction' ? 'selected' : ''}>${t('কর্তন (−)','Deduct (−)')}</option></select>
          <button type="button" data-hdel="${i}" title="${h.del ? t('ফিরিয়ে আনুন','Restore') : t('ডিলিট','Delete')}" aria-label="${h.del ? t('ফিরিয়ে আনুন','Restore') : t('ডিলিট','Delete')}">${h.del ? '↩' : '🗑'}</button></div>`;
      }).join('')}</div>
      <button type="button" class="btn btn-outline" id="hmAdd" style="width:auto;height:34px;margin-top:8px;">➕ ${t('নতুন খাত','New head')}</button>
      <div class="hm-note">${t('নাম বদলালে পুরনো সব ভাউচারেও নতুন নাম দেখাবে। ডিলিট করা খাত আর ড্রপডাউনে আসবে না, তবে পুরনো ভাউচারে তার টাকা ও নাম ঠিক থাকবে।','Renames apply to old vouchers too. Deleted heads leave the dropdown but stay on old vouchers.')}</div>`;
    }
    openModal({
      title: t('অন্যান্য খাত — এডিট / ডিলিট','Other heads — edit / delete'),
      bodyHtml: `<style>.hm-row{display:grid;grid-template-columns:minmax(0,1fr) 120px 38px;gap:6px;margin-bottom:6px;} .hm-row input,.hm-row select{height:36px;padding:4px 8px;font-size:14px;width:100%;box-sizing:border-box;}
        .hm-row button{height:36px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;} .hm-row.del input{text-decoration:line-through;opacity:.5;}
        .hm-note{font-size:11.5px;color:var(--text-muted);margin-top:8px;line-height:1.5;}</style><div id="hmBody">${html()}</div>`,
      onSave: async function () {
        for (const h of list) { if (!h.del && !String(h.name).trim()) throw new Error(t('খাতের নাম খালি রাখা যাবে না।','Head name cannot be empty.')); }
        for (const h of list) {
          const orig = h.id ? allHeads.find(function (x) { return x.HeadID === h.id; }) : null;
          if (h.del && h.id) { const { error } = await supabaseClient.from('PayHeads').update({ Status: 'Deleted' }).eq('HeadID', h.id); if (error) throw new Error(error.message); if (orig) orig.Status = 'Deleted'; }
          else if (!h.del && h.id && orig && (orig.HeadName !== h.name.trim() || orig.HeadType !== h.type)) {
            const { error } = await supabaseClient.from('PayHeads').update({ HeadName: h.name.trim(), HeadType: h.type }).eq('HeadID', h.id); if (error) throw new Error(error.message);
            orig.HeadName = h.name.trim(); orig.HeadType = h.type;
          } else if (!h.del && !h.id) {
            const { data, error } = await supabaseClient.from('PayHeads').insert({ HeadName: h.name.trim(), HeadType: h.type }).select(); if (error) throw new Error(error.message);
            allHeads.push(data[0]);
          }
        }
        heads = allHeads.filter(activeHead); listCache = {};
        renderBody(); showToast(t('খাত সেভ হয়েছে ✅','Heads saved ✅'), 'success');
      }
    });
    const mb = document.getElementById('hmBody');
    const redraw = function () { mb.innerHTML = html(); };
    mb.addEventListener('input', function (ev) { const el = ev.target; if (el.dataset.hi !== undefined) list[Number(el.dataset.hi)][el.dataset.hf] = el.value; });
    mb.addEventListener('change', function (ev) { const el = ev.target; if (el.dataset.hi !== undefined) list[Number(el.dataset.hi)][el.dataset.hf] = el.value; });
    mb.addEventListener('click', function (ev) {
      const d = ev.target.closest('[data-hdel]'), add = ev.target.closest('#hmAdd');
      if (d) {
        const h = list[Number(d.dataset.hdel)];
        if (!h.id) { list.splice(Number(d.dataset.hdel), 1); redraw(); return; }
        if (!h.del && usedIds[h.id] && !confirm(t('"' + h.name + '" এই ভাউচারে ব্যবহার হচ্ছে। ডিলিট করলেও এখানে থাকবে, কিন্তু নতুন করে বাছাই করা যাবে না। চালিয়ে যাবেন?','This head is used in the current voucher. Continue?'))) return;
        h.del = !h.del; redraw();
      } else if (add) { list.push({ id: null, name: '', type: 'Earning', del: false }); redraw(); const ins = mb.querySelectorAll('[data-hf="name"]'); ins[ins.length - 1].focus(); }
    });
  }
  async function addHead(sel, r) {
    const name = prompt(t('নতুন খাতের নাম (যেমনঃ যাতায়াত, জরিমানা):','New head name:'), '');
    if (!name || !name.trim()) { sel.value = r.head || ''; return; }
    const isDed = confirm(t('"' + name.trim() + '" কি কর্তনের খাত (টাকা বিয়োগ হবে)?\nOK = কর্তন, Cancel = যোগ','Is this a deduction? OK = deduction, Cancel = addition'));
    const { data, error } = await supabaseClient.from('PayHeads').insert({ HeadName: name.trim(), HeadType: isDed ? 'Deduction' : 'Earning' }).select();
    if (error) { showToast(error.message, 'error'); sel.value = r.head || ''; return; }
    heads.push(data[0]); allHeads.push(data[0]); listCache = {}; r.head = data[0].HeadID; st.dirty = true; refresh();
    showToast(t('নতুন খাত যোগ হয়েছে ✅','Head added ✅'), 'success');
  }
  body.addEventListener('click', async function (ev) {
    const add = ev.target.closest('[data-add]'), rm = ev.target.closest('[data-del]');
    if (add) { const p = add.dataset.add.split('|').map(Number); st.days[p[0]].rows.splice(p[1] + 1, 0, newRow('manual')); st.dirty = true; refresh(); return; }
    if (rm) { const p = rm.dataset.del.split('|').map(Number); st.days[p[0]].rows.splice(p[1], 1); st.dirty = true; refresh(); return; }
    const b = ev.target.closest('button'); if (!b) return;
    try {
      if (b.id === 'svSave') { b.disabled = true; await save(); showToast(t('সেলারী ভাউচার সেভ হয়েছে ✅ ','Salary voucher saved ✅ ') + st.no, 'success'); renderBody(); await renderList(); }
      else if (b.id === 'svView') await printVoucher();
      else if (b.id === 'svDelOldDup') await delOldDups();
      else if (b.id === 'svDel') await del();
      else if (b.id === 'svNew') { if (!guard()) return; st.emp = ''; document.getElementById('svEmp').value = ''; showEmpInfo(); await loadFresh(); }
    } catch (err) { showToast(err.message, 'error'); }
    b.disabled = false;
  });
  document.getElementById('svList').addEventListener('click', async function (ev) {
    const b = ev.target.closest('button'); if (!b) return;
    const id = b.dataset.lv || b.dataset.le || b.dataset.ld;
    const h = (await api('list', { sheet: 'Payroll' })).find(function (x) { return x.PayrollID === id; }); if (!h) return;
    if (!guard()) return;
    await openSaved(h);
    try {
      if (b.dataset.lv) await printVoucher();
      else if (b.dataset.ld) await del();
      else window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) { showToast(err.message, 'error'); }
  });

  renderBody(); await renderList();
  // রিপোর্ট বা অন্য পেজ থেকে পাঠানো নির্দেশ — {id, action: view|edit|delete|pdf} অথবা {emp}
  const req = window.__svOpen; window.__svOpen = null;
  if (req) {
    try {
      if (req.id) {
        const h = (await api('list', { sheet: 'Payroll' })).find(function (x) { return x.PayrollID === req.id; });
        if (h) { await openSaved(h); if (req.action === 'view' || req.action === 'pdf') await printVoucher(); else if (req.action === 'delete') { if (permCan('payroll', 3)) await del(); else showToast(t('ডিলিটের অনুমতি আপনার নেই।','No delete permission.'), 'error'); } }
      } else if (req.emp) { st.emp = req.emp; document.getElementById('svEmp').value = (base.empMap[req.emp] || {}).Name || ''; showEmpInfo(); await loadFresh(); }
    } catch (err) { showToast(err.message, 'error'); }
  }
}

/* ============================================================
   সেলারী ইস্যু — বেতনের টাকা আসলে হাতে দেওয়া (নগদ/ব্যাংক)

   • প্রতিটা ইস্যু ব্যাংক/ক্যাশ বইতে খরচ হিসেবে উঠে যায় (RefModule = 'SalaryIssue')

    otpMode: false, otp: { id: null, sentTo: '', code: '', verified: false, verifiedAt: null, busy: false } };
  function resetOtp() { st.otp = { id: null, sentTo: '', code: '', verified: false, verifiedAt: null, busy: false }; }

  content.innerHTML = `

  // ---------- হিসাব ----------
  async function loadLedger() {
    const [heads, issues] = await Promise.all([api('list', { sheet: 'Payroll' }), api('list', { sheet: 'SalaryIssue' }).catch(function () { return []; })]);
    const L = {};
    const row = function (id) { return L[id] = L[id] || { vouchers: [], issues: [], earned: 0, paid: 0 }; };
    heads.filter(function (h) { return h.Status !== 'Deleted' && h.RunType === 'SalaryVoucher' && h.EmployeeID; }).forEach(function (h) { const r = row(h.EmployeeID); r.vouchers.push(h); r.earned += Number(h.TotalNetPay) || 0; });
    issues.filter(function (x) { return x.Status !== 'Deleted'; }).forEach(function (x) { const r = row(x.EmployeeID); r.issues.push(x); r.paid += Number(x.Amount) || 0; });
    Object.keys(L).forEach(function (k) {
      L[k].due = Math.round((L[k].earned - L[k].paid) * 100) / 100;
      L[k].vouchers.sort(function (a, b) { return String(a.DateFrom).localeCompare(String(b.DateFrom)); });
      L[k].issues.sort(function (a, b) { return String(b.IssueDate).localeCompare(String(a.IssueDate)) || (Number(b.IssueID) || 0) - (Number(a.IssueID) || 0); });
    });
    st.ledger = L;
    st.allIssues = issues.filter(function (x) { return x.Status !== 'Deleted'; }).sort(function (a, b) { return (Number(b.IssueID) || 0) - (Number(a.IssueID) || 0); });
  }
  /** কোন ভাউচারের কত বাকি — পুরনো ভাউচার আগে শোধ ধরা হয় (FIFO) */
  function voucherDues(L) {
    let left = L.paid;
    return L.vouchers.map(function (v) { const amt = Number(v.TotalNetPay) || 0, used = Math.min(amt, Math.max(0, left)); left -= used; return { v: v, amt: amt, paid: used, due: amt - used }; });
  }

        <div class="field"><label>${t('টাকার পরিমাণ','Amount')}</label><input type="number" step="any" min="0" inputmode="decimal" id="siAmt" value="${attr(st.amount)}"></div>
      </div>
      <div class="field"><label>${t('নোট (ঐচ্ছিক)','Note (optional)')}</label><input id="siNote" value="${attr(st.note)}" placeholder="${t('যেমনঃ সাপ্তাহিক বেতন, আংশিক পরিশোধ','e.g. weekly salary, partial payment')}"></div>
      <div class="si-sum" style="grid-template-columns:repeat(2,minmax(0,1fr));">
        <div>${t('এখন দেওয়া হচ্ছে','Paying now')}<b id="siNow">${hrMoney(amt)}</b></div>
        <div class="after">${t('ইস্যুর পর ','After issue: ')}<span id="siAfterL">${after >= 0 ? t('বকেয়া','due') : t('অগ্রিম','advance')}</span><b id="siAfter">${hrMoney(Math.abs(after))}</b></div>
      </div>
      <div class="si-otp">

        <div class="si-rad">
          <label class="${st.otpMode ? '' : 'on'}"><input type="radio" name="siOtpMode" value="0" ${st.otpMode ? '' : 'checked'}> ${t('OTP ছাড়া','Without OTP')}</label>
          <label class="${st.otpMode ? 'on' : ''}"><input type="radio" name="siOtpMode" value="1" ${st.otpMode ? 'checked' : ''}> ${t('OTP সহ','With OTP')}</label>

  }
  function empPhone() { return String((base.empMap[st.emp] || {}).Phone || '').trim(); }

    if (st.otp.verified) return `<div class="si-otp-msg ok">✔ ${t('OTP যাচাই হয়েছে','OTP verified')} — ${escapeHtml(maskPhone(st.otp.sentTo))}</div>`;

      </div>
      ${st.otp.id ? `<div class="si-otp-row"><input id="siOtpCode" inputmode="numeric" maxlength="6" placeholder="${t('৬ অঙ্কের OTP','6-digit OTP')}" value="${attr(st.otp.code)}" autocomplete="one-time-code">
        <button type="button" class="btn btn-primary" id="siOtpVerify" ${st.otp.busy ? 'disabled' : ''}>✔ ${t('যাচাই','Verify')}</button></div>

  async function otpCall(body) {
    if (!supabaseClient.functions) throw new Error(t('OTP সার্ভিস পাওয়া যায়নি।','OTP service unavailable.'));
    const { data, error } = await supabaseClient.functions.invoke('salary-otp', { body: body });
    if (error) {
      let msg = error.message || '';
      try { const ctx = error.context && await error.context.json(); if (ctx && ctx.error) msg = ctx.error; } catch (e) {}
      if (/not found|404|Failed to send a request/i.test(msg)) msg = t('OTP সার্ভিস (salary-otp) এখনো Supabase-এ বসানো হয়নি।','The salary-otp function is not deployed yet.');
      throw new Error(msg);
    }
    if (data && data.error) throw new Error(data.error);
    return data || {};
  }
  function renderDues() {
    const el = document.getElementById('siDues');
    const list = Object.keys(st.ledger).map(function (id) { return { id: id, L: st.ledger[id] }; }).filter(function (x) { return Math.abs(x.L.due) > 0.005; })
      .sort(function (a, b) { return b.L.due - a.L.due; });
    const tot = list.reduce(function (s, x) { return s + Math.max(0, x.L.due); }, 0);
    el.innerHTML = list.length ? list.map(function (x) {
      const e = base.empMap[x.id] || {};
      return `<div class="si-li"><div><b>${escapeHtml(e.Name || x.id)}</b> <span class="meta">${escapeHtml(base.catMap[e.CategoryID] || '')}</span>
          <div class="meta">${x.L.due >= 0 ? `${t('বকেয়া','Due')} <span class="si-due">${hrMoney(x.L.due)}</span>` : `${t('অগ্রিম দেওয়া আছে','Advance')} <span class="si-adv">${hrMoney(-x.L.due)}</span>`}</div></div>
        <div class="ic">${x.L.due > 0 ? `<button data-pay="${attr(x.id)}">💵 ${t('ইস্যু','Issue')}</button>` : ''}</div></div>`;
    }).join('') + `<div style="text-align:right;font-size:13px;margin-top:6px;">${t('মোট বকেয়াঃ ','Total due: ')}<b>${hrMoney(tot)}</b></div>`

    el.innerHTML = list.length ? list.map(function (x) {
      const e = base.empMap[x.EmployeeID] || {};
      return `<div class="si-li"><div><b>${escapeHtml(x.IssueNo || x.IssueID)}</b> · ${escapeHtml(e.Name || x.EmployeeID)}
          <div class="meta">${escapeHtml(formatShortDate(x.IssueDate))} · ${escapeHtml(accName[x.BankCashAccID] || '')} · <b>${hrMoney(x.Amount)}</b>${x.OtpVerified ? ' · <span style="color:#166534;">✔ OTP</span>' : ''}${x.Note ? ' · ' + escapeHtml(x.Note) : ''}</div></div>
        <div class="ic"><button data-view="${attr(x.IssueID)}" title="${t('প্রিন্ট','Print')}" aria-label="${t('প্রিন্ট','Print')}">👁</button><button data-del="${attr(x.IssueID)}" title="${t('ডিলিট','Delete')}" aria-label="${t('ডিলিট','Delete')}">🗑</button></div></div>`;
    }).join('') : `<div style="color:var(--text-muted);font-size:13px;">${t('এখনো কোনো সেলারী ইস্যু নেই।','No salary issues yet.')}</div>`;
  }
  async function reloadAll() { await loadLedger(); renderBody(); renderDues(); renderList(); }

  function pickEmp(id) {
    st.emp = id; resetOtp(); const e = base.empMap[id] || {};
    document.getElementById('siEmp').value = e.Name || id;
    const L = st.ledger[id]; st.amount = L && L.due > 0 ? L.due : ''; st.note = '';

  // ---------- সেভ / ডিলিট / প্রিন্ট ----------
  async function nextNo() {
    const n = (st.allIssues || []).reduce(function (m, x) { const r = /^SAL-(\d+)$/.exec(x.IssueNo || ''); return r ? Math.max(m, Number(r[1])) : m; }, 0) + 1;
    return 'SAL-' + String(n).padStart(4, '0');
  }
  async function save() {
    const amt = Number(st.amount) || 0;
    if (!st.emp) throw new Error(t('কর্মচারী বাছাই করুন।','Select an employee.'));
    if (!(amt > 0)) throw new Error(t('টাকার পরিমাণ লিখুন।','Enter the amount.'));
    if (!st.acc) throw new Error(t('ক্যাশ/ব্যাংক অ্যাকাউন্ট বাছাই করুন (হিসাব → ব্যাংক ও ক্যাশ অ্যাকাউন্ট)।','Select a cash/bank account.'));
    const L = st.ledger[st.emp] || { due: 0 };
    if (amt > L.due + 0.005 && !confirm(t('বকেয়ার (' + hrMoney(L.due) + ') চেয়ে বেশি দিচ্ছেন — বাড়তি অংশ অগ্রিম হিসেবে থাকবে। চালিয়ে যাবেন?','Paying more than due — the extra becomes an advance. Continue?'))) return null;
    const no = await nextNo();
    if (st.otpMode && !st.otp.verified) throw new Error(t('আগে OTP যাচাই করুন, অথবা "OTP ছাড়া" বাছাই করুন।','Verify the OTP first, or choose "Without OTP".'));
    if (st.otpMode && Math.abs((Number(st.otp.amount) || 0) - amt) > 0.005) throw new Error(t('OTP পাঠানোর পর টাকার অঙ্ক বদলেছে — আবার OTP পাঠান।','Amount changed after sending the OTP — send it again.'));
    const row = { IssueNo: no, IssueDate: st.date, EmployeeID: st.emp, BankCashAccID: st.acc, Amount: amt, Note: st.note || '', DueBefore: L.due, Status: 'Active' };
    if (st.otpMode) { row.OtpVerified = true; row.OtpPhone = st.otp.sentTo; row.OtpAt = st.otp.verifiedAt; row.OtpRef = st.otp.id; }
    const { data, error } = await supabaseClient.from('SalaryIssue').insert(row).select();
    if (error) throw new Error(error.message);
    try { await postBankCashBookEntry(st.acc, st.date, 'SalaryIssue', no, 0, amt); } // টাকা বের হলো — ক্যাশ/ব্যাংক বইতে Credit
    catch (err) { await supabaseClient.from('SalaryIssue').delete().eq('IssueID', data[0].IssueID); throw err; }
    listCache = {};
    return data[0];
  }
  async function del(id) {
    const x = (st.allIssues || []).find(function (y) { return String(y.IssueID) === String(id); }); if (!x) return;
    if (!confirm(t(x.IssueNo + ' ডিলিট করবেন? ক্যাশ/ব্যাংক বইতে টাকা ফেরত এন্ট্রি হবে।','Delete ' + x.IssueNo + '? A reversal will be posted to the cash/bank book.'))) return;
    await postBankCashBookEntry(x.BankCashAccID, hrToday(), 'SalaryIssue-Reversal', x.IssueNo, Number(x.Amount) || 0, 0);
    const { error } = await supabaseClient.from('SalaryIssue').update({ Status: 'Deleted' }).eq('IssueID', x.IssueID);
    if (error) throw new Error(error.message);
    listCache = {}; showToast(t('ডিলিট হয়েছে ✅','Deleted ✅'), 'success');
    await reloadAll();
  }
  async function printIssue(x) {
    const win = window.open('', '_blank');
    if (!win) { showToast(t('পপ-আপ ব্লক হয়েছে — এই সাইটের জন্য পপ-আপ অনুমতি দিন।','Pop-up blocked — allow pop-ups for this site.'), 'error'); return; }
    let co = {}; try { co = await api('getSingleton', { sheet: 'CompanyProfile' }); } catch (e) {}
    const e = base.empMap[x.EmployeeID] || {}, acc = accounts.find(function (a) { return a.BankAccID === x.BankCashAccID; }) || {};
    const before = Number(x.DueBefore) || 0, after = before - (Number(x.Amount) || 0);
    win.document.write(`<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>সেলারী ইস্যু — ${escapeHtml(x.IssueNo)}</title>
      <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700&display=swap" rel="stylesheet">

      <style>@page{size:A5 portrait;margin:8mm;}</style></head><body>
      <div class="toolbar"><button class="primary" onclick="window.print()">🖨️ প্রিন্ট</button></div>

        <div class="v-co-info"><div class="v-co-name">${escapeHtml(co.CompanyNameBn || 'জি মেটাল ওয়ার্কস')}</div><div class="v-co-addr">${escapeHtml(co.AddressBn || '')}</div>${co.Phone ? `<div class="v-co-mob">মোবাইলঃ <span class="en">${escapeHtml(co.Phone)}</span></div>` : ''}<div class="v-type">সেলারী ইস্যু (বেতন পরিশোধ)</div></div>
        <div class="v-meta"><div class="v-print">প্রিন্টঃ <span class="en">${escapeHtml(formatPrintDate())}</span></div><div class="v-meta-row"><span>ইস্যু নংঃ</span><b class="en">${escapeHtml(x.IssueNo)}</b></div><div class="v-meta-row"><span>তারিখঃ</span><b class="en">${escapeHtml(formatShortDate(x.IssueDate))}</b></div></div></div>
      <div class="v-party"><div class="v-party-name"><span class="lbl">কর্মচারীঃ</span> ${escapeHtml(e.Name || x.EmployeeID)}</div><div class="v-party-sub"><span>${escapeHtml(base.catMap[e.CategoryID] || '')}</span>${e.Phone ? `<span>মোবাইলঃ ${escapeHtml(e.Phone)}</span>` : ''}</div></div>
      <table class="items-table"><tbody>
        <tr><td>ইস্যুর আগে বকেয়া</td><td class="r">${hrMoney(before)}</td></tr>
        <tr><td><b>এখন পরিশোধ</b> (${escapeHtml(acc.AccountName || '')})</td><td class="r big">${hrMoney(x.Amount)}</td></tr>
        <tr class="grand-all"><td>${after >= 0 ? 'অবশিষ্ট বকেয়া' : 'অগ্রিম'}</td><td class="r">${hrMoney(Math.abs(after))}</td></tr>
        ${x.Note ? `<tr><td colspan="2">নোটঃ ${escapeHtml(x.Note)}</td></tr>` : ''}
      </tbody></table>
      ${x.OtpVerified ? `<div style="margin-top:14px;border:1.5px solid #16a34a;border-radius:6px;padding:5px 8px;font-size:10.5px;color:#166534;">✔ OTP যাচাই হয়েছে — গ্রহীতার মোবাইল <span class="en">${escapeHtml(x.OtpPhone || '')}</span>, <span class="en">${escapeHtml(x.OtpAt ? new Date(x.OtpAt).toLocaleString('en-GB') : '')}</span></div>` : ''}
      <div class="sign-row" style="margin-top:${x.OtpVerified ? 26 : 40}px;"><div>গ্রহীতার স্বাঃ<div style="font-size:9.5px;font-weight:400;margin-top:3px;">মোবাইলঃ <span class="en">${escapeHtml(e.Phone || '..................')}</span></div></div><div>প্রদানকারীর স্বাঃ</div><div>অনুমোদনকারীর স্বাঃ</div></div>
      <script>window.addEventListener("load",function(){setTimeout(function(){window.print();},400);});<\/script></body></html>`);
    win.document.close();
  }

  // ---------- ইভেন্ট ----------
  document.getElementById('siDate').addEventListener('change', function () { st.date = this.value; });
  hrNameSuggest(document.getElementById('siEmp'), { list: function () { return hrEmpSuggestList(base, base.emps); }, onPick: function (it) { pickEmp(it.id); } });
  const body = document.getElementById('siBody');
  body.addEventListener('input', function (ev) {
    const el = ev.target;
    if (el.id === 'siAmt') {
      st.amount = el.value;
      if (st.otpMode && st.otp.id && Math.abs((Number(st.otp.amount) || 0) - (Number(el.value) || 0)) > 0.005) { resetOtp(); setTimeout(renderBody, 0); }
      const L = st.ledger[st.emp] || { due: 0 }, after = L.due - (Number(el.value) || 0);
      document.getElementById('siNow').textContent = hrMoney(Number(el.value) || 0);
      document.getElementById('siAfter').textContent = hrMoney(Math.abs(after));
      document.getElementById('siAfterL').textContent = after >= 0 ? t('বকেয়া','due') : t('অগ্রিম','advance');
    } else if (el.id === 'siNote') st.note = el.value;
  });
  body.addEventListener('change', function (ev) {
    if (ev.target.id === 'siAcc') st.acc = ev.target.value;
    if (ev.target.name === 'siOtpMode') { st.otpMode = ev.target.value === '1'; resetOtp(); renderBody(); }
  });
  body.addEventListener('click', async function (ev) {
    const send = ev.target.closest('#siOtpSend'), ver = ev.target.closest('#siOtpVerify');
    if (!send && !ver) return;
    const amt = Number(st.amount) || 0;
    // ঘর নতুন করে আঁকার আগেই লেখা কোডটা নিয়ে রাখা
    if (ver) st.otp.code = String((document.getElementById('siOtpCode') || {}).value || '');
    try {
      st.otp.busy = true; renderBody();
      if (send) {
        if (!(amt > 0)) throw new Error(t('আগে টাকার পরিমাণ লিখুন।','Enter the amount first.'));
        const e = base.empMap[st.emp] || {};
        const r = await otpCall({ action: 'send', employeeId: st.emp, phone: empPhone(), name: e.Name || '', amount: amt });
        st.otp.id = r.otpId; st.otp.sentTo = empPhone(); st.otp.amount = amt; st.otp.code = '';
        showToast(t('OTP পাঠানো হয়েছে ✅','OTP sent ✅'), 'success');
      } else {
        const code = String(st.otp.code || '').replace(/[০-৯]/g, function (d) { return '০১২৩৪৫৬৭৮৯'.indexOf(d); }).trim();
        st.otp.code = code;
        if (!/^\d{6}$/.test(code)) throw new Error(t('৬ অঙ্কের OTP লিখুন।','Enter the 6-digit OTP.'));
        const r = await otpCall({ action: 'verify', otpId: st.otp.id, code: code });
        st.otp.verified = true; st.otp.verifiedAt = r.verifiedAt || new Date().toISOString();
        showToast(t('OTP যাচাই হয়েছে ✅ — এখন ইস্যু করতে পারেন','OTP verified ✅'), 'success');
      }
    } catch (err) { showToast(err.message, 'error'); }
    st.otp.busy = false; renderBody();
    const ci = document.getElementById('siOtpCode'); if (ci && !st.otp.verified) ci.focus();
  });
  body.addEventListener('click', async function (ev) {
    const b = ev.target.closest('#siSave'); if (!b) return;
    b.disabled = true;
    try {
      const x = await save();
      if (x) {
        showToast(t('সেলারী ইস্যু হয়েছে ✅ ','Salary issued ✅ ') + x.IssueNo, 'success');
        document.getElementById('siNo').value = x.IssueNo;
        await reloadAll();
        if (confirm(t('রসিদ প্রিন্ট করবেন?','Print the receipt?'))) await printIssue(x);
        st.emp = ''; document.getElementById('siEmp').value = ''; st.amount = ''; renderBody();
      }
    } catch (err) { showToast(err.message, 'error'); }
    b.disabled = false;
  });
  document.getElementById('siDues').addEventListener('click', function (ev) { const b = ev.target.closest('[data-pay]'); if (b) pickEmp(b.dataset.pay); });
  document.getElementById('siList').addEventListener('click', async function (ev) {
    const b = ev.target.closest('button'); if (!b) return;
    try {
      if (b.dataset.view) { const x = st.allIssues.find(function (y) { return String(y.IssueID) === b.dataset.view; }); if (x) await printIssue(x); }
      else if (b.dataset.del) await del(b.dataset.del);
    } catch (err) { showToast(err.message, 'error'); }
  });

  if (!accounts.length) showToast(t('আগে হিসাব → ব্যাংক ও ক্যাশ অ্যাকাউন্টে অন্তত একটা ক্যাশ অ্যাকাউন্ট যোগ করুন।','Add a cash account first in Accounts → Bank & Cash.'), 'error');
  await reloadAll();
  if (window.__siPick) { const id = window.__siPick; window.__siPick = null; pickEmp(id); }
  const req = window.__siOpen; window.__siOpen = null;
  if (req) {
    try {
      const x = (st.allIssues || []).find(function (y) { return String(y.IssueID) === String(req.id); });
      if (x && (req.action === 'view' || req.action === 'pdf')) await printIssue(x);
      else if (x && req.action === 'delete') { if (permCan('salaryIssue', 3)) await del(x.IssueID); else showToast(t('ডিলিটের অনুমতি আপনার নেই।','No delete permission.'), 'error'); }
      else if (x && req.action === 'edit') { pickEmp(x.EmployeeID); showToast(t('সেলারী ইস্যু বদলানো যায় না — ভুল হলে 🗑 ডিলিট করে নতুন ইস্যু দিন। নিচে ' + x.IssueNo + ' আছে।','Issues cannot be edited — delete and re-issue.'), 'success'); }
    } catch (err) { showToast(err.message, 'error'); }
  }
}

/* ============================================================

   ১) কর্মচারীর বেতন খতিয়ান — কবে কত পাওনা (সেলারী ভাউচার), কত দেওয়া (সেলারী ইস্যু), চলমান বকেয়া
   ২) মাসিক মজুরি খরচ — মাসে কার কত মুজুরী, হাজিরা, অন্যান্য, কর্তন, মোট; কত দেওয়া হলো; মাস শেষে বকেয়া
   ৩) উৎপাদন ও মজুরি খরচ — আইটেম বা কর্মচারী অনুযায়ী কত কেজি, কত মজুরি, কেজিপ্রতি খরচ
   ============================================================ */
async function renderHrReportsPage(content) {
  const base = await hrLoadBase();

  const items = (m.Items || []).filter(function (i) { return i.Status !== 'Deleted'; });
  const catName = {}; (m.Categories || []).forEach(function (c) { catName[c.CategoryID] = c.CategoryName; });
  const itemMap = {}; items.forEach(function (i) { itemMap[i.ItemID] = i; });
  const today = hrToday();
  const st = { tab: 'ledger', emp: '', from: today.slice(0, 8) + '01', to: today, month: today.slice(0, 7), pFrom: hrWeekOf(today).from, pTo: today, pBy: 'item', pGroup: '', pCat: '' };
  { const fy = await getFiscalYearStart(today); st.from = fy; st.pFrom = fy; }   // "হইতে" ডিফল্টঃ অর্থবছরের শুরু

  content.innerHTML = `
    <style>
      .rp{padding:12px !important;max-width:1150px;}
      .rp-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 10px;} .rp-head h1{font-size:18px;margin:0;}

      .rp-tab.on{background:var(--text);color:var(--surface);}
      .rp .field{margin:0;min-width:0;} .rp .field label{font-size:11.5px;margin-bottom:3px;}
      .rp input,.rp select{height:36px;padding:4px 8px;font-size:14px;width:100%;min-width:0;box-sizing:border-box;}
      .rp-bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:8px;align-items:end;margin-bottom:10px;}
      .rp-bar .btn{height:36px;width:auto;padding:0 14px;margin:0;}
      .rp-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px;}
      .rp-cards div{background:var(--bg);border-radius:10px;padding:8px;text-align:center;font-size:11.5px;color:var(--text-muted);} .rp-cards b{display:block;font-size:17px;color:var(--text);margin-top:2px;}
      .rp-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
      .rp-tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;min-width:640px;}
      .rp-tbl th{background:var(--bg);font-size:11.5px;font-weight:700;padding:7px 6px;text-align:center !important;white-space:nowrap;border-bottom:2px solid var(--border);position:sticky;top:0;}
      .rp-tbl td{padding:6px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;}
      .rp-tbl td.l{text-align:left;} .rp-tbl tr.tot td{font-weight:700;background:var(--bg);}
      .rp-tbl tr.open td{color:var(--text-muted);font-style:italic;}
      .rp-due{color:#b45309;font-weight:700;} .rp-adv{color:#1d4ed8;font-weight:700;}
      .rp-hint{font-size:12.5px;color:var(--text-muted);padding:10px 0;}
      .rp-tag{font-size:11px;padding:2px 7px;border-radius:8px;}
      .rp-ic{display:inline-flex;gap:4px;} .rp-ic button{width:30px;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--surface);cursor:pointer;font-size:13px;padding:0;}
      .rp-ic button:disabled{opacity:.3;cursor:not-allowed;} .rp-tbl td.ic{text-align:center;}
      @media print{ .rp-ic{display:none;} } .rp-tag.v{background:#e0f2fe;color:#075985;} .rp-tag.i{background:#dcfce7;color:#166534;}
      @media (max-width:760px){ .rp-bar{grid-template-columns:repeat(2,minmax(0,1fr));} .rp-bar .btn{grid-column:1 / -1;} .rp-cards{grid-template-columns:repeat(2,minmax(0,1fr));} }
    </style>
    <div class="panel rp">
      <div class="rp-head"><h1>${t('বেতন ও উৎপাদন রিপোর্ট','Salary & Production Reports')}</h1></div>
      <div class="rp-tabs">
        <button class="rp-tab on" data-tab="ledger">📒 ${t('কর্মচারীর বেতন খতিয়ান','Employee salary ledger')}</button>
        <button class="rp-tab" data-tab="month">📅 ${t('মাসিক মজুরি খরচ','Monthly wage cost')}</button>
        <button class="rp-tab" data-tab="prod">🏭 ${t('উৎপাদন ও মজুরি খরচ','Production & wage cost')}</button>
      </div>
      <div id="rpBar"></div>
      <div id="rpOut"></div>
    </div>`;

  // ---------- ডেটা ----------
  async function loadMoney() {
    const [heads, issues] = await Promise.all([api('list', { sheet: 'Payroll' }), api('list', { sheet: 'SalaryIssue' }).catch(function () { return []; })]);
    const vouchers = heads.filter(function (h) { return h.Status !== 'Deleted' && h.RunType === 'SalaryVoucher' && h.EmployeeID; })
      .map(function (h) { h._date = String(h.VoucherDate || h.DateTo || '').slice(0, 10); return h; });
    const iss = issues.filter(function (x) { return x.Status !== 'Deleted'; }).map(function (x) { x._date = String(x.IssueDate || '').slice(0, 10); return x; });
    return { vouchers: vouchers, issues: iss };
  }
  const empName = function (id) { return (base.empMap[id] || {}).Name || id; };
  const balTxt = function (b) { return Math.abs(b) < 0.005 ? '0.00' : (b > 0 ? `<span class="rp-due">${hrMoney(b)}</span>` : `<span class="rp-adv">${t('অগ্রিম ','Adv ')}${hrMoney(-b)}</span>`); };

  // ---------- ১) বেতন খতিয়ান ----------
  async function runLedger() {
    const out = document.getElementById('rpOut');
    if (!st.emp) { out.innerHTML = `<div class="rp-hint">${t('কর্মচারী বাছাই করুন।','Select an employee.')}</div>`; return; }
    const d = await loadMoney();
    const ev = [];
    d.vouchers.filter(function (v) { return v.EmployeeID === st.emp; }).forEach(function (v) { ev.push({ date: v._date, kind: 'v', id: v.PayrollID, no: v.VoucherNo || v.PayrollID, note: t('সময়কাল ','Period ') + payrollPeriodLabel(v), earn: Number(v.TotalNetPay) || 0, paid: 0 }); });
    d.issues.filter(function (x) { return x.EmployeeID === st.emp; }).forEach(function (x) { ev.push({ date: x._date, kind: 'i', id: x.IssueID, no: x.IssueNo || x.IssueID, note: (x.Note || '') + (x.OtpVerified ? ' ✔OTP' : ''), earn: 0, paid: Number(x.Amount) || 0 }); });
    ev.sort(function (a, b) { return a.date.localeCompare(b.date) || (a.kind === 'v' ? -1 : 1); });
    let open = 0; ev.filter(function (e) { return e.date < st.from; }).forEach(function (e) { open += e.earn - e.paid; });
    const rows = ev.filter(function (e) { return e.date >= st.from && e.date <= st.to; });
    let bal = open, te = 0, tp = 0;
    const trs = rows.map(function (e) {
      bal += e.earn - e.paid; te += e.earn; tp += e.paid;
      return `<tr><td class="l">${escapeHtml(formatShortDate(e.date))}</td><td class="l"><span class="rp-tag ${e.kind}">${e.kind === 'v' ? t('সেলারী ভাউচার','Salary voucher') : t('সেলারী ইস্যু','Salary issue')}</span></td>
        <td class="l">${escapeHtml(e.no)}</td><td class="l">${escapeHtml(e.note)}</td><td>${e.earn ? hrMoney(e.earn) : ''}</td><td>${e.paid ? hrMoney(e.paid) : ''}</td><td>${balTxt(bal)}</td><td class="ic">${rowIcons(e.kind, e.id)}</td></tr>`;
    }).join('');
    const e = base.empMap[st.emp] || {};
    st.print = { title: t('কর্মচারীর বেতন খতিয়ান','Employee salary ledger'), sub: empName(st.emp) + (base.catMap[e.CategoryID] ? ' · ' + base.catMap[e.CategoryID] : '') + ' · ' + formatShortDate(st.from) + ' — ' + formatShortDate(st.to) };
    out.innerHTML = `
      <div class="rp-cards"><div>${t('শুরুর বকেয়া','Opening due')}<b>${balTxt(open)}</b></div><div>${t('পাওনা হয়েছে','Earned')}<b>${hrMoney(te)}</b></div><div>${t('দেওয়া হয়েছে','Paid')}<b>${hrMoney(tp)}</b></div><div>${t('শেষ বকেয়া','Closing due')}<b>${balTxt(bal)}</b></div></div>
      <div class="rp-wrap" id="rpPrintArea"><table class="rp-tbl"><thead><tr><th>${t('তারিখ','Date')}</th><th>${t('ধরন','Type')}</th><th>${t('নম্বর','No.')}</th><th>${t('বিবরণ','Details')}</th><th>${t('পাওনা','Earned')}</th><th>${t('পরিশোধ','Paid')}</th><th>${t('বকেয়া','Balance')}</th><th class="rp-ic-h"></th></tr></thead>
        <tbody><tr class="open"><td class="l" colspan="6">${t('শুরুর বকেয়া (','Opening balance (')}${escapeHtml(formatShortDate(st.from))} ${t('এর আগে)','before)')}</td><td>${balTxt(open)}</td><td></td></tr>
        ${trs || `<tr><td class="l" colspan="8" style="color:var(--text-muted);">${t('এই সময়ে কোনো লেনদেন নেই।','No transactions in this period.')}</td></tr>`}
        <tr class="tot"><td class="l" colspan="4">${t('মোট','Total')}</td><td>${hrMoney(te)}</td><td>${hrMoney(tp)}</td><td>${balTxt(bal)}</td><td></td></tr></tbody></table></div>`;
  }

  // ---------- ২) মাসিক মজুরি খরচ ----------
  async function runMonth() {
    const out = document.getElementById('rpOut');
    const r = hrMonthRange(st.month);
    const d = await loadMoney();
    const vs = d.vouchers.filter(function (v) { return v._date >= r.from && v._date <= r.to; });
    let lines = [];
    if (vs.length) { const res = await supabaseClient.from('Payroll_Lines').select('*').in('PayrollID', vs.map(function (v) { return v.PayrollID; })); lines = res.data || []; }
    const per = {};
    const row = function (id) { return per[id] = per[id] || { wage: 0, haj: 0, plus: 0, minus: 0, total: 0, paid: 0, n: 0 }; };
    vs.forEach(function (v) { const x = row(v.EmployeeID); x.n++; x.total += Number(v.TotalNetPay) || 0; });

    d.issues.filter(function (i) { return i._date >= r.from && i._date <= r.to; }).forEach(function (i) { row(i.EmployeeID).paid += Number(i.Amount) || 0; });
    // মাস শেষে মোট বকেয়া (শুরু থেকে)

    const ids = Object.keys(per).sort(function (a, b) { return String(empName(a)).localeCompare(String(empName(b))); });

    }).join('');

      <div class="rp-wrap" id="rpPrintArea"><table class="rp-tbl"><thead><tr><th>${t('কর্মচারী','Employee')}</th><th>${t('মুজুরী','Wage')}</th><th>${t('হাজিরা','Attendance')}</th><th>${t('অন্যান্য (+)','Other (+)')}</th><th>${t('কর্তন (−)','Deduction (−)')}</th><th>${t('মোট পাওনা','Total earned')}</th><th>${t('দেওয়া','Paid')}</th><th>${t('মাস শেষে বকেয়া','Due')}</th><th></th></tr></thead>
        <tbody>${trs || `<tr><td class="l" colspan="9" style="color:var(--text-muted);">${t('এই মাসে কোনো সেলারী ভাউচার নেই।','No salary vouchers this month.')}</td></tr>`}
        <tr class="tot"><td class="l">${t('মোট','Total')} (${ids.length})</td><td>${hrMoney(T.wage)}</td><td>${hrMoney(T.haj)}</td><td>${hrMoney(T.plus)}</td><td>−${hrMoney(T.minus)}</td><td>${hrMoney(T.total)}</td><td>${hrMoney(T.paid)}</td><td>${balTxt(T.due)}</td><td></td></tr></tbody></table></div>
