<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G Metal Works — Production ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink-900:#12161d; --ink-800:#1a2029; --ink-700:#232b36; --steel-line:#2c3542;
  --amber:#f2a33c; --amber-dim:#c9812b; --slate-blue:#4c8fae;
  --bg:#eef0f3; --surface:#ffffff; --text:#1b1f27; --text-muted:#6b7280;
  --border:#e2e5ea; --danger:#d5484a; --success:#3fa66a;
  --sidebar-w:272px; --sidebar-w-collapsed:76px; --topbar-h:64px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter','Hind Siliguri',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
[lang-bn]{font-family:'Hind Siliguri','Inter',sans-serif;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#c7cbd3;border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}
button{font-family:inherit;}

/* ===== Login Screen ===== */
.login-screen{
  position:fixed;inset:0;z-index:200;
  background:radial-gradient(circle at 30% 20%, #232b38, var(--ink-900) 70%);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.login-card{
  width:100%;max-width:380px;background:var(--surface);border-radius:16px;
  padding:34px 30px;box-shadow:0 30px 70px rgba(0,0,0,.4);
}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
.login-brand .mark{
  width:42px;height:42px;flex-shrink:0;
  background:radial-gradient(circle at 30% 30%, #ffcf85, var(--amber) 55%, var(--amber-dim) 100%);
  clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-weight:700;color:var(--ink-900);font-size:17px;
}
.login-brand b{font-family:'Oswald',sans-serif;font-size:17px;display:block;}
.login-brand span{font-size:11px;color:var(--text-muted);letter-spacing:.08em;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--text);}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
  font:inherit;font-size:13.5px;background:var(--bg);color:var(--text);outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--amber);background:#fff;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 18px;border-radius:8px;border:none;cursor:pointer;
  font-size:13.5px;font-weight:600;font-family:inherit;
}
.btn-primary{background:var(--ink-900);color:var(--amber);width:100%;}
.btn-primary:hover{background:#000;}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-outline:hover{background:var(--bg);}
.btn-danger{background:var(--danger);color:#fff;}
.login-error{
  background:#fdecec;color:var(--danger);font-size:12.5px;padding:9px 12px;
  border-radius:8px;margin-bottom:14px;display:none;
}
.login-error.show{display:block;}
.login-hint{font-size:11.5px;color:var(--text-muted);margin-top:16px;text-align:center;line-height:1.6;}

/* ===== App shell ===== */
.app{display:none;min-height:100vh;}
.app.ready{display:flex;}
.sidebar{
  width:var(--sidebar-w);background:linear-gradient(180deg,var(--ink-900) 0%, var(--ink-800) 100%);
  color:#cdd3dc;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;
  transition:width .22s ease, transform .22s ease;z-index:40;border-right:1px solid var(--steel-line);
}
.sidebar.collapsed{width:var(--sidebar-w-collapsed);}
.brand{height:var(--topbar-h);display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--steel-line);flex-shrink:0;position:relative;}
.brand-mark{
  width:38px;height:38px;flex-shrink:0;
  background:radial-gradient(circle at 30% 30%, #ffcf85, var(--amber) 55%, var(--amber-dim) 100%);
  clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);
  display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:700;color:var(--ink-900);font-size:16px;
  box-shadow:0 0 0 2px rgba(0,0,0,.25) inset;
}
.brand-text{font-family:'Oswald',sans-serif;letter-spacing:.06em;line-height:1.1;overflow:hidden;white-space:nowrap;}
.brand-text b{display:block;font-size:15px;font-weight:600;color:#fff;}
.brand-text span{display:block;font-size:10px;color:var(--amber);font-weight:500;letter-spacing:.12em;}
.sidebar.collapsed .brand-text{display:none;}
.collapse-btn{position:absolute;right:-13px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--ink-800);border:1px solid var(--steel-line);color:var(--amber);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;z-index:5;}
.collapse-btn:hover{background:var(--amber);color:var(--ink-900);}
.nav-scroll{overflow-y:auto;flex:1;padding:10px 0 16px;}
.nav-item{list-style:none;}
.nav-link{display:flex;align-items:center;gap:12px;padding:10px 18px;cursor:pointer;color:#c3c9d3;font-size:13.5px;font-weight:500;position:relative;border-left:3px solid transparent;white-space:nowrap;}
.nav-link:hover{background:rgba(255,255,255,.04);color:#fff;}
.nav-item.active > .nav-link{background:rgba(242,163,60,.1);color:#fff;border-left:3px solid var(--amber);}
.nav-ico{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--amber);}
.nav-ico svg{width:18px;height:18px;}
.nav-label{flex:1;overflow:hidden;text-overflow:ellipsis;}
.chev{width:14px;height:14px;flex-shrink:0;transition:transform .18s ease;opacity:.7;}
.nav-item.open > .nav-link .chev{transform:rotate(90deg);}
.sidebar.collapsed .nav-label,.sidebar.collapsed .chev{display:none;}
.submenu{max-height:0;overflow:hidden;transition:max-height .22s ease;background:rgba(0,0,0,.18);}
.nav-item.open > .submenu{max-height:600px;}
.submenu a{display:block;padding:8px 18px 8px 52px;font-size:12.8px;color:#9aa2ae;border-left:3px solid transparent;cursor:pointer;}
.submenu a:hover{color:#fff;background:rgba(255,255,255,.04);}
.submenu a.active{color:var(--amber);border-left-color:var(--amber);}
.sidebar.collapsed .submenu{display:none;}
.sidebar-foot{border-top:1px solid var(--steel-line);padding:12px 18px;font-size:11px;color:#616876;flex-shrink:0;}
.sidebar.collapsed .sidebar-foot{display:none;}

.main{flex:1;margin-left:var(--sidebar-w);min-width:0;transition:margin-left .22s ease;}
.sidebar.collapsed ~ .main{margin-left:var(--sidebar-w-collapsed);}
.topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:30;}

/* ===== Tab Bar — একাধিক পেজ পরপর খোলা রাখার জন্য ===== */
.tab-bar{
  display:flex;align-items:stretch;gap:2px;
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 14px;overflow-x:auto;overflow-y:hidden;
  position:sticky;top:var(--topbar-h);z-index:25;
  scrollbar-width:thin;
}
.tab-bar:empty{display:none;}
.tab-item{
  display:flex;align-items:center;gap:8px;
  padding:9px 10px 9px 14px;
  font-size:12.5px;font-weight:500;color:var(--text-muted);
  border-bottom:2px solid transparent;
  cursor:pointer;white-space:nowrap;flex-shrink:0;
  max-width:220px;
}
.tab-item:hover{color:var(--text);background:var(--bg);}
.tab-item.active{color:var(--text);border-bottom-color:var(--amber);font-weight:600;}
.tab-item span.tab-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tab-item .tab-close{
  width:18px;height:18px;flex-shrink:0;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);
}
.tab-item .tab-close:hover{background:var(--danger);color:#fff;}
.tab-item .tab-close svg{width:11px;height:11px;}

.hamburger{display:none;width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface);align-items:center;justify-content:center;cursor:pointer;color:var(--text);flex-shrink:0;}
.crumb{font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;letter-spacing:.02em;}
.crumb small{display:block;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;color:var(--text-muted);letter-spacing:.02em;}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:10px;}
.icon-btn{width:38px;height:38px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);flex-shrink:0;position:relative;}
.icon-btn:hover{background:var(--bg);}
.icon-btn svg{width:17px;height:17px;}
.icon-btn.spinning svg{animation:spin .7s linear;}
.modal-tool-btn.spinning svg{animation:spin .7s linear;}
@keyframes spin{to{transform:rotate(360deg);}}
.lang-switch{display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:3px;font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;letter-spacing:.03em;flex-shrink:0;}
.lang-switch button{border:none;background:transparent;padding:6px 13px;border-radius:999px;cursor:pointer;color:var(--text-muted);}
.lang-switch button.active{background:var(--ink-900);color:var(--amber);}
.acct{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 5px;border:1px solid var(--border);border-radius:999px;cursor:pointer;position:relative;background:var(--surface);flex-shrink:0;}
.acct-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--slate-blue),#2c5a72);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:'Oswald',sans-serif;flex-shrink:0;}
.acct-name{font-size:12.5px;font-weight:600;line-height:1.1;}
.acct-role{font-size:10.5px;color:var(--text-muted);line-height:1.1;}
.acct-chev{width:12px;height:12px;color:var(--text-muted);}
.acct-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 14px 34px rgba(20,24,31,.14);padding:8px;display:none;z-index:50;}
.acct-menu.open{display:block;}
.acct-menu a{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:7px;font-size:13px;color:var(--text);cursor:pointer;}
.acct-menu a:hover{background:var(--bg);}
.acct-menu hr{border:none;border-top:1px solid var(--border);margin:6px 2px;}
.acct-menu a.danger{color:var(--danger);}

.content{padding:24px 26px 60px;max-width:1300px;}
.page-head{margin-bottom:20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.page-head h1{font-family:'Oswald',sans-serif;font-size:22px;margin:0 0 4px;font-weight:600;}
.page-head p{margin:0;color:var(--text-muted);font-size:13.5px;}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;top:0;left:0;width:4px;height:100%;background:var(--amber);}
.kpi.blue::before{background:var(--slate-blue);} .kpi.green::before{background:var(--success);} .kpi.red::before{background:var(--danger);}
.kpi-label{font-size:11.5px;color:var(--text-muted);letter-spacing:.03em;margin-bottom:8px;font-weight:600;text-transform:uppercase;}
.kpi-val{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;}
.kpi-sub{font-size:11.5px;color:var(--text-muted);margin-top:6px;}
.section-title{font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;margin:0 0 12px;letter-spacing:.02em;}

/* ===== Data table ===== */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap;}
table.data-table{width:100%;border-collapse:collapse;font-size:13px;}
.data-table th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);padding:11px 16px;border-bottom:1px solid var(--border);white-space:nowrap;}
.data-table td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:middle;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:#fafbfc;}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;}
.badge.active,.badge.posted,.badge.true{background:#e5f5ec;color:var(--success);}
.badge.deleted,.badge.false,.badge.inactive{background:#fdecec;color:var(--danger);}
.badge.draft{background:#fdf3e3;color:var(--amber-dim);}
.row-actions{display:flex;gap:6px;}
.row-actions button{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-muted);}
.row-actions button:hover{background:var(--bg);color:var(--text);}
.row-actions svg{width:14px;height:14px;}
.empty-state{padding:50px 20px;text-align:center;color:var(--text-muted);font-size:13.5px;}
.empty-state svg{width:38px;height:38px;color:var(--border);margin-bottom:10px;}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(10,12,16,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal-overlay.show{display:flex;}
.modal{width:100%;max-width:460px;background:var(--surface);border-radius:14px;max-height:90vh;display:flex;flex-direction:column;transition:max-width .15s;}
.modal.modal-wide{max-width:820px;}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.modal-head h3{margin:0;font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;flex-shrink:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.modal-toolbar{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.modal-toolbar #modalClock{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--text-muted);white-space:nowrap;}
.modal-tool-btn{width:26px;height:26px;flex-shrink:0;border-radius:6px;border:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);}
.modal-tool-btn:hover{background:var(--border);}
.modal-tool-btn svg{width:13px;height:13px;}
.modal-lang-switch{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;flex-shrink:0;}
.modal-lang-switch button{font-family:'Oswald',sans-serif;font-size:10px;font-weight:600;padding:5px 8px;border:none;cursor:pointer;background:var(--bg);color:var(--text-muted);}
.modal-lang-switch button.active{background:var(--ink-900);color:var(--amber);}
#modalUserName{font-size:11px;color:var(--text-muted);white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;}
.modal-close{width:30px;height:30px;border-radius:8px;border:none;background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
@media (max-width:640px){
  .modal-toolbar #modalClock, #modalUserName{display:none;}
}
.modal-body{padding:18px 20px;overflow-y:auto;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.field-error{color:var(--danger);font-size:11.5px;margin-top:12px;padding:8px 10px;background:#fdecec;border-radius:7px;display:none;}
.field-error.show{display:block;}

/* ===== Toast ===== */
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:150;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink-900);color:#fff;padding:12px 16px;border-radius:9px;font-size:13px;box-shadow:0 10px 25px rgba(0,0,0,.25);border-left:4px solid var(--amber);max-width:320px;}
.toast.error{border-left-color:var(--danger);}
.toast.success{border-left-color:var(--success);}

.overlay-mobile{display:none;position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:35;}
.overlay-mobile.show{display:block;}

@media (max-width:1023px){
  .sidebar{transform:translateX(-100%);width:var(--sidebar-w);box-shadow:0 0 40px rgba(0,0,0,.3);}
  .sidebar.mobile-open{transform:translateX(0);}
  .sidebar.collapsed{width:var(--sidebar-w);}
  .sidebar.collapsed .brand-text,.sidebar.collapsed .nav-label,.sidebar.collapsed .chev,.sidebar.collapsed .sidebar-foot{display:block;}
  .sidebar.collapsed .submenu{display:block;}
  .collapse-btn{display:none;} .hamburger{display:flex;}
  .main{margin-left:0 !important;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:640px){
  .kpi-grid{grid-template-columns:1fr 1fr;gap:10px;}
  .kpi{padding:12px;border-radius:9px;}
  .kpi-label{font-size:9.5px;margin-bottom:5px;}
  .kpi-val{font-size:17px;}
  .kpi-sub{font-size:10px;margin-top:3px;}
  .content{padding:16px 14px 40px;}
  .acct-name,.acct-role{display:none;} .acct{padding:5px;}
  .crumb{font-size:14px;}
  .data-table{font-size:12px;}
  .data-table th,.data-table td{padding:9px 10px;}
}
/* চওড়া টেবিলে (অনেক কলাম/বাটন থাকলে) মোবাইলে যাতে ডানদিকের বাটনগুলো
   কেটে না যায়, প্যানেলে পাশে স্ক্রল করা যাবে — বড় স্ক্রিনে এটা প্রভাব ফেলে না */
.panel{overflow-x:auto;}
</style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-brand">
      <div class="mark">GM</div>
      <div>
        <b>G Metal Works</b>
        <span>PRODUCTION ERP</span>
      </div>
    </div>
    <div class="login-error" id="loginError"></div>
    <form id="loginForm">
      <div class="field">
        <label>ইমেইল</label>
        <input type="email" id="loginEmail" required autocomplete="username">
      </div>
      <div class="field">
        <label>পাসওয়ার্ড</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">লগইন করুন</button>
    </form>
    <div class="login-hint">Supabase Authentication থেকে তৈরি করা অ্যাডমিন ইমেইল-পাসওয়ার্ড দিয়ে লগইন করুন।</div>
  </div>
</div>

<div class="overlay-mobile" id="overlayMobile"></div>
<div class="toast-wrap" id="toastWrap"></div>

<!-- ===== MODAL (generic, reused by every page) ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <div class="modal-head">
      <h3 id="modalTitle">শিরোনাম</h3>
      <div class="modal-toolbar">
        <span id="modalClock">--:--:--</span>
        <button type="button" class="modal-tool-btn" id="modalRefreshBtn" title="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
        </button>
        <div class="modal-lang-switch" id="modalLangSwitch">
          <button type="button" data-lang="bn">বাং</button><button type="button" data-lang="en">EN</button>
        </div>
        <span id="modalUserName" title=""></span>
        <button class="modal-close" id="modalCloseBtn">✕</button>
      </div>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="field-error" id="modalError"></div>
    <div class="modal-foot">
      <button class="btn btn-outline" id="modalCancelBtn">বাতিল</button>
      <button class="btn btn-primary" id="modalSaveBtn" style="width:auto;">সেভ করুন</button>
    </div>
  </div>
</div>

<!-- ===== APP SHELL ===== -->
<div class="app" id="app">

/** CurrentStock ও StockLedger — দুটোতেই একসাথে কেজি ও পিসের
 *  পরিবর্তন বসিয়ে দেয়। kgDelta/piecesDelta পজিটিভ হলে স্টক বাড়বে,
 *  নেগেটিভ হলে কমবে। এটাই সব ধরনের স্টক-মুভমেন্টের একমাত্র কেন্দ্রবিন্দু —
 *  যাতে CurrentStock ও StockLedger কখনো একে অপরের থেকে আলাদা (out of sync) না হয়ে যায়। */
async function postStockMovement(itemId, warehouseId, date, transactionType, refModule, refId, kgDelta, piecesDelta) {
  if (!itemId || !warehouseId) throw new Error('আইটেম বা গুদাম উল্লেখ করা নেই — স্টক পোস্ট করা যায়নি।');
  kgDelta = Number(kgDelta) || 0;
  piecesDelta = Number(piecesDelta) || 0;

  const { data: existing } = await supabaseClient.from('current_stock').select('*').eq('ItemID', itemId).eq('WarehouseID', warehouseId).maybeSingle();
  const newKg = (existing ? Number(existing.QtyOnHand) : 0) + kgDelta;
  const newPieces = (existing ? Number(existing.QtyPieces) : 0) + piecesDelta;

  if (existing) {
    const { error } = await supabaseClient.from('current_stock').update({ QtyOnHand: newKg, QtyPieces: newPieces }).eq('ItemID', itemId).eq('WarehouseID', warehouseId);
    if (error) throw new Error(error.message);
  } else {
    const { error } = await supabaseClient.from('current_stock').insert({ ItemID: itemId, WarehouseID: warehouseId, QtyOnHand: newKg, QtyPieces: newPieces });
    if (error) throw new Error(error.message);
  }

  const { error: ledgerErr } = await supabaseClient.from('stock_ledger').insert({
    ItemID: itemId, WarehouseID: warehouseId, Date: date, TransactionType: transactionType,
    RefModule: refModule, RefID: refId,
    QtyIn: kgDelta > 0 ? kgDelta : 0, QtyOut: kgDelta < 0 ? -kgDelta : 0, BalanceAfter: newKg,
    PiecesIn: piecesDelta > 0 ? piecesDelta : 0, PiecesOut: piecesDelta < 0 ? -piecesDelta : 0, PiecesBalanceAfter: newPieces
  });
  if (ledgerErr) throw new Error(ledgerErr.message);
}

/** বিক্রয়ের সময় গ্রাহক কেজি অথবা পিস — যেকোনো একটা দিয়ে থাকলে, অন্য
 *  মাত্রাটা তখনকার আসল/লাইভ গড় ওজন-প্রতি-পিস দিয়ে হিসাব করে বের করে —
 *  কোনো স্থির Conversion Factor ব্যবহার হয় না। */
async function resolveKgAndPieces(itemId, warehouseId, enteredKg, enteredPieces) {
  enteredKg = Number(enteredKg) || 0;
  enteredPieces = Number(enteredPieces) || 0;
  if (enteredKg > 0 && enteredPieces > 0) return { kg: enteredKg, pieces: enteredPieces };

  const { data: stock } = await supabaseClient.from('current_stock').select('*').eq('ItemID', itemId).eq('WarehouseID', warehouseId).maybeSingle();
  const avgKgPerPiece = (stock && Number(stock.QtyPieces) > 0) ? (Number(stock.QtyOnHand) / Number(stock.QtyPieces)) : 0;

  if (enteredKg > 0 && enteredPieces === 0) {
    return { kg: enteredKg, pieces: avgKgPerPiece > 0 ? enteredKg / avgKgPerPiece : 0 };
  }
  if (enteredPieces > 0 && enteredKg === 0) {
    return { kg: avgKgPerPiece > 0 ? enteredPieces * avgKgPerPiece : 0, pieces: enteredPieces };
  }
  return { kg: 0, pieces: 0 };
}

/** প্রতিটা ডকুমেন্ট টাইপ পোস্ট করলে ঠিক কী স্টক-প্রভাব পড়বে, তার
 *  ব্যবসায়িক নিয়ম। Status='Posted' হওয়ার আগেই এটা রান হয় (postDocument কেস দেখুন)। */
async function runPostingLogic(docType, header, docId) {
  const today = new Date().toISOString().slice(0, 10);

  if (docType === 'GRN') {
    // GRN এখন শুধু রেকর্ডের জন্য — আসল স্টক-বৃদ্ধি হয় Purchase Invoice পোস্ট করলে (নিচে দেখুন),
    // যাতে GRN+Invoice দুটোতেই স্টক দুইবার যোগ না হয়ে যায়।
    return;
  }

  if (docType === 'PurchaseInvoice') {
    if (!header.WarehouseID) throw new Error('এই ক্রয় চালানে কোনো গুদাম উল্লেখ নেই।');
    const { data: lines, error } = await supabaseClient.from('PI_Lines').select('*').eq('PIID', docId);
    if (error) throw new Error(error.message);
    for (const line of (lines || [])) {
      await postStockMovement(line.ItemID, header.WarehouseID, header.InvoiceDate || today, 'PurchaseInvoice', 'PurchaseInvoice', docId, Number(line.Quantity) || 0, Number(line.Pieces) || 0);
    }
    return;
  }

  if (docType === 'PurchaseReturn') {
    let warehouseId = header.WarehouseID;
    if (!warehouseId && header.GRNID) {
      const { data: grn } = await supabaseClient.from('GRN').select('WarehouseID').eq('GRNID', header.GRNID).maybeSingle();
      warehouseId = grn ? grn.WarehouseID : null;
    }
    if (!warehouseId) throw new Error('গুদাম খুঁজে পাওয়া যায়নি — GRN রেফারেন্স যাচাই করুন।');
    const { data: lines, error } = await supabaseClient.from('PR_Return_Lines').select('*').eq('PRetID', docId);
    if (error) throw new Error(error.message);
    for (const line of (lines || [])) {
      await postStockMovement(line.ItemID, warehouseId, header.Date || today, 'PurchaseReturn', 'PurchaseReturn', docId, -(Number(line.Quantity) || 0), -(Number(line.Pieces) || 0));
    }
    return;
  }

  if (docType === 'MaterialIssue') {
    if (!header.WarehouseID) throw new Error('গুদাম উল্লেখ নেই।');
    const { data: lines, error } = await supabaseClient.from('MI_Lines').select('*').eq('MIID', docId);
    if (error) throw new Error(error.message);
    for (const line of (lines || [])) {
      await postStockMovement(line.ItemID, header.WarehouseID, header.Date || today, 'MaterialIssue', 'MaterialIssue', docId, -(Number(line.Quantity) || 0), 0);
    }
    return;
  }

  if (docType === 'StockTransfer') {
    if (!header.FromWarehouseID || !header.ToWarehouseID) throw new Error('উৎস/গন্তব্য গুদাম উল্লেখ নেই।');
    const { data: lines, error } = await supabaseClient.from('Transfer_Lines').select('*').eq('TransferID', docId);
    if (error) throw new Error(error.message);
    for (const line of (lines || [])) {
      const qty = Number(line.Quantity) || 0;
      await postStockMovement(line.ItemID, header.FromWarehouseID, header.Date || today, 'StockTransfer-Out', 'StockTransfer', docId, -qty, 0);
      await postStockMovement(line.ItemID, header.ToWarehouseID, header.Date || today, 'StockTransfer-In', 'StockTransfer', docId, qty, 0);
    }
    return;
  }

  if (docType === 'StockAdjustment') {
    if (!header.WarehouseID) throw new Error('গুদাম উল্লেখ নেই।');
    const { data: lines, error } = await supabaseClient.from('Adjustment_Lines').select('*').eq('AdjID', docId);
    if (error) throw new Error(error.message);
    for (const line of (lines || [])) {
      await postStockMovement(line.ItemID, header.WarehouseID, header.Date || today, 'StockAdjustment', 'StockAdjustment', docId, Number(line.QtyChange) || 0, 0);
    }
    return;
  }

  if (docType === 'DeliveryChallan') {
    // DC এখন শুধু রেকর্ডের জন্য — আসল স্টক-হ্রাস হয় Sales Invoice পোস্ট করলে
    return;
  }

  if (docType === 'SalesInvoice') {
    if (!header.WarehouseID) throw new Error('এই বিক্রয় চালানে কোনো গুদাম উল্লেখ নেই।');
    const { data: lines, error } = await supabaseClient.from('SI_Lines').select('*').eq('SIID', docId);
    if (error) throw new Error(error.message);
    for (const line of (lines || [])) {
      const item = (await supabaseClient.from('items').select('TrackingType').eq('ItemID', line.ItemID).maybeSingle()).data;
      if (item && item.TrackingType === 'WeightPieces') {
        const resolved = await resolveKgAndPieces(line.ItemID, header.WarehouseID, line.Quantity, line.Pieces);
        await postStockMovement(line.ItemID, header.WarehouseID, header.InvoiceDate || today, 'SalesInvoice', 'SalesInvoice', docId, -resolved.kg, -resolved.pieces);
      } else {
        await postStockMovement(line.ItemID, header.WarehouseID, header.InvoiceDate || today, 'SalesInvoice', 'SalesInvoice', docId, -(Number(line.Quantity) || 0), 0);
      }
    }
    return;
  }

  if (docType === 'SalesReturn') {
    if (!header.WarehouseID) throw new Error('এই বিক্রয় ফেরত ভাউচারে কোনো গুদাম উল্লেখ নেই।');
    const { data: lines, error } = await supabaseClient.from('SR_Lines').select('*').eq('SRID', docId);
    if (error) throw new Error(error.message);
    for (const line of (lines || [])) {
      const item = (await supabaseClient.from('items').select('TrackingType').eq('ItemID', line.ItemID).maybeSingle()).data;
      if (item && item.TrackingType === 'WeightPieces') {
        const resolved = await resolveKgAndPieces(line.ItemID, header.WarehouseID, line.Quantity, line.Pieces);
        await postStockMovement(line.ItemID, header.WarehouseID, header.Date || today, 'SalesReturn', 'SalesReturn', docId, resolved.kg, resolved.pieces);
      } else {
        await postStockMovement(line.ItemID, header.WarehouseID, header.Date || today, 'SalesReturn', 'SalesReturn', docId, Number(line.Quantity) || 0, 0);
      }
    }
    return;
  }

  if (docType === 'ProcessingVoucher') {
    if (!header.WarehouseID) throw new Error('এই প্রসেসিং ভাউচারে কোনো গুদাম উল্লেখ নেই।');
    // কাঁচামাল খরচ — স্টক থেকে কমবে
    await postStockMovement(header.RawMaterialItemID, header.WarehouseID, header.Date || today, 'ProcessingVoucher-RM', 'ProcessingVoucher', docId, -(Number(header.RawMaterialQty) || 0), 0);
    // বাই-প্রডাক্ট (ভাঙারি/কাটিং) — স্টকে যোগ হবে
    const { data: byProducts } = await supabaseClient.from('ProcessingByProduct_Lines').select('*').eq('ProcessingID', docId);
    for (const bp of (byProducts || [])) {
      if (bp.ItemID) {
        await postStockMovement(bp.ItemID, header.WarehouseID, header.Date || today, 'ProcessingVoucher-ByProduct', 'ProcessingVoucher', docId, Number(bp.Quantity) || 0, 0);
      }
    }
    // নেট ফিনিশড গুডস — কেজি ও পিস দুটোই স্টকে যোগ হবে
    await postStockMovement(header.FinishedGoodsItemID, header.WarehouseID, header.Date || today, 'ProcessingVoucher-FG', 'ProcessingVoucher', docId, Number(header.NetWeight) || 0, Number(header.Pieces) || 0);
    return;
  }

  // বাকি ডকুমেন্ট টাইপ (BOM-ভিত্তিক Production Order route, এবং Accounts
  // ভাউচারের হিসাব-লেজার প্রভাব) এখনো শুধু স্ট্যাটাস বদলাবে —
  // এটা একটা আলাদা পরবর্তী ধাপে যোগ হবে।
}

/** পোস্ট করা ডকুমেন্ট ডিলিট করার আগে, সেই ডকুমেন্টের কারণে যা যা স্টক
 *  মুভমেন্ট হয়েছিল (StockLedger-এ RefModule+RefID দিয়ে খুঁজে) — প্রতিটার
 *  উল্টো এন্ট্রি বসিয়ে দিয়ে স্টক আবার আগের অবস্থায় ফিরিয়ে আনা হয়,
 *  তারপর পুরনো লেজার এন্ট্রিগুলো মুছে ফেলা হয়। */
async function reversePostedDocumentStock(docType, docId) {
  const { data: entries } = await supabaseClient.from('stock_ledger').select('*').eq('RefModule', docType).eq('RefID', docId);
  for (const e of (entries || [])) {
    const kgDelta = (Number(e.QtyOut) || 0) - (Number(e.QtyIn) || 0);
    const piecesDelta = (Number(e.PiecesOut) || 0) - (Number(e.PiecesIn) || 0);
    await postStockMovement(e.ItemID, e.WarehouseID, new Date().toISOString().slice(0,10), docType + '-Reversal', docType + '-Reversal', docId, kgDelta, piecesDelta);
  }
  await supabaseClient.from('stock_ledger').delete().eq('RefModule', docType).eq('RefID', docId);
}

/** এডমিনের পাসওয়ার্ড আবার যাচাই করে, পোস্ট করা ভাউচার নিরাপদে ডিলিট করে —
 *  স্টক এন্ট্রিও উল্টে ফেলা হয়, যাতে ইনভেন্টরিতে ভুতুড়ে গরমিল না থেকে যায়। */
async function deletePostedVoucherWithAdminAuth(docType, docId, sheetName, idField, linesSheet, lineIdField, onDone) {
  if (!currentUser || currentUser.RoleID !== 'ROLE-ADMIN') {
    showToast(t('শুধু এডমিনই পোস্ট করা ভাউচার ডিলিট করতে পারবেন।','Only an Admin can delete a posted voucher.'), 'error');
    return;
  }
  const password = prompt(t('নিরাপত্তার জন্য আপনার এডমিন পাসওয়ার্ড দিন:','Enter your admin password to confirm:'));
  if (!password) return;

  try {
    const { error } = await supabaseClient.auth.signInWithPassword({ email: currentUser.Email, password: password });
    if (error) throw new Error(t('পাসওয়ার্ড ভুল — ডিলিট বাতিল হয়েছে।','Incorrect password — delete cancelled.'));
  } catch (err) {
    showToast(err.message, 'error');
    return;
  }

  if (!confirm(t('আপনি কি সত্যিই এই পোস্ট করা ভাউচারটা ডিলিট করতে চান? এটা স্টক থেকে সংশ্লিষ্ট এন্ট্রি উল্টে দেবে এবং ফেরানো যাবে না।','Are you sure you want to delete this posted voucher? This will reverse its stock entries and cannot be undone.'))) return;

  try {
    await reversePostedDocumentStock(docType, docId);
    await supabaseClient.from(linesSheet).delete().eq(lineIdField, docId);
    await supabaseClient.from(sheetName).delete().eq(idField, docId);
    showToast(t('ভাউচার ও এর স্টক এন্ট্রি বাতিল করা হয়েছে ✅','Voucher and its stock entries have been reversed ✅'), 'success');
    if (onDone) await onDone();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function runSupabaseAction(action, p) {
  switch (action) {

    case 'login': {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email: p.email, password: p.password });
      if (error) throw new Error('লগইন ব্যর্থ — ইমেইল অথবা পাসওয়ার্ড ভুল।');
      const { data: profile, error: profErr } = await supabaseClient.from('users').select('*').eq('UserID', data.user.id).single();
      if (profErr || !profile) throw new Error('এই অ্যাকাউন্টের কোনো প্রোফাইল পাওয়া যায়নি — অ্যাডমিনের সাথে যোগাযোগ করুন।');
      await supabaseClient.from('users').update({ LastLogin: new Date().toISOString() }).eq('UserID', data.user.id);
      return { token: data.session.access_token, user: profile };
    }

    case 'logout': {
      await supabaseClient.auth.signOut();
      return {};
    }

    case 'list': {
      const { data, error } = await supabaseClient.from(tableFor(p.sheet)).select('*');
      if (error) throw new Error(error.message);
      return data;
    }

    case 'listMultiple': {
      const out = {};
      for (const sheet of p.sheets) {
        const { data, error } = await supabaseClient.from(tableFor(sheet)).select('*');
        if (error) throw new Error(error.message);
        out[sheet] = data;
      }
      return out;
    }

    case 'getSingleton': {
      const { data, error } = await supabaseClient.from(tableFor(p.sheet)).select('*').eq('id', 1).maybeSingle();
      if (error) throw new Error(error.message);
      return data || {};
    }
    case 'saveSingleton': {
      const { error } = await supabaseClient.from(tableFor(p.sheet)).update(p.data).eq('id', 1);
      if (error) throw new Error(error.message);
      return {};
    }

    case 'create': {
      const { data, error } = await supabaseClient.from(tableFor(p.sheet)).insert(p.data).select().single();
      if (error) throw new Error(error.message);
      return data;
    }
    case 'update': {
      const { data, error } = await supabaseClient.from(tableFor(p.sheet)).update(p.data).eq(p.idField, p.idValue).select().single();
      if (error) throw new Error(error.message);
      return data;
    }
    case 'delete': {
      // সফট-ডিলিট — রেকর্ড আসলে মুছে যায় না, শুধু Status='Deleted' হয়ে যায় (আগের মতোই)
      const { error } = await supabaseClient.from(tableFor(p.sheet)).update({ Status: 'Deleted' }).eq(p.idField, p.idValue);
      if (error) throw new Error(error.message);
      return {};
    }

    case 'createUser': {
      throw new Error('নতুন ইউজার তৈরি এই মুহূর্তে শুধু Supabase Dashboard → Authentication → Add user থেকেই করা যাবে, নিরাপত্তার কারণে।');
    }
    case 'updateUser': {
      const { error } = await supabaseClient.from('users').update({
        FullName: p.data.FullName, RoleID: p.data.RoleID, Phone: p.data.Phone, IsActive: p.data.IsActive === 'TRUE' || p.data.IsActive === true
      }).eq('UserID', p.userId);
      if (error) throw new Error(error.message);
      return {};
    }

    case 'createDocument': {
      const { data: header, error: hErr } = await supabaseClient.from(p.headerSheet).insert(p.headerData).select().single();
      if (hErr) throw new Error(hErr.message);
      if (p.lines && p.lines.length > 0) {
        const linesWithId = p.lines.map(function (l) { const row = Object.assign({}, l); row[p.lineIdField] = header[p.idField]; return row; });
        const { error: lErr } = await supabaseClient.from(p.linesSheet).insert(linesWithId);
        if (lErr) throw new Error(lErr.message);
      }
      return header;
    }
    case 'updateDocument': {
      const { error: hErr } = await supabaseClient.from(p.headerSheet).update(p.headerData).eq(p.idField, p.idValue);
      if (hErr) throw new Error(hErr.message);
      await supabaseClient.from(p.linesSheet).delete().eq(p.lineIdField, p.idValue);
      if (p.lines && p.lines.length > 0) {
        const linesWithId = p.lines.map(function (l) { const row = Object.assign({}, l); row[p.lineIdField] = p.idValue; return row; });
        const { error: lErr } = await supabaseClient.from(p.linesSheet).insert(linesWithId);
        if (lErr) throw new Error(lErr.message);
      }
      return {};
    }
    case 'getDocument': {
      const { data: header, error: hErr } = await supabaseClient.from(p.headerSheet).select('*').eq(p.idField, p.idValue).single();
      if (hErr) throw new Error(hErr.message);
      const { data: lines, error: lErr } = await supabaseClient.from(p.linesSheet).select('*').eq(p.lineIdField, p.idValue);
      if (lErr) throw new Error(lErr.message);
      return { header: header, lines: lines };
    }

    case 'postDocument': {
      const cfg = DOC_TYPE_MAP[p.docType];
      if (!cfg) throw new Error('অজানা ডকুমেন্ট টাইপ।');
      const { data: existingDoc, error: exErr } = await supabaseClient.from(cfg.table).select('*').eq(cfg.idField, p.docId).single();
      if (exErr) throw new Error(exErr.message);
      if (existingDoc.Status === 'Posted') throw new Error('এই ডকুমেন্ট আগেই পোস্ট করা হয়েছে।');

      await runPostingLogic(p.docType, existingDoc, p.docId);

      const { error } = await supabaseClient.from(cfg.table).update({ Status: 'Posted' }).eq(cfg.idField, p.docId);
      if (error) throw new Error(error.message);
      return {};
    }

    case 'postOpeningStock': {
      await postStockMovement(p.itemId, p.warehouseId, new Date().toISOString().slice(0,10), 'Opening', 'Items', p.itemId, p.quantity, p.pieces || 0);
      return {};
    }

    case 'getAverageRate': {
      const { data: lines, error: lErr } = await supabaseClient.from('GRN_Lines').select('GRNID, ReceivedQty, Rate').eq('ItemID', p.itemId);
      if (lErr) throw new Error(lErr.message);
      if (!lines || lines.length === 0) return { averageRate: 0, grnCount: 0, totalQtyPurchased: 0 };
      const grnIds = Array.from(new Set(lines.map(function (l) { return l.GRNID; })));
      const { data: headers, error: hErr } = await supabaseClient.from('GRN').select('GRNID, ReceiveDate').in('GRNID', grnIds);
      if (hErr) throw new Error(hErr.message);
      const dateMap = {}; headers.forEach(function (h) { dateMap[h.GRNID] = h.ReceiveDate; });
      const filtered = lines.filter(function (l) {
        const d = dateMap[l.GRNID];
        if (!d) return false;
        if (p.dateFrom && d < p.dateFrom) return false;
        if (p.dateTo && d > p.dateTo) return false;
        return true;
      });
      const totalQty = filtered.reduce(function (s, l) { return s + (Number(l.ReceivedQty) || 0); }, 0);
      const totalValue = filtered.reduce(function (s, l) { return s + (Number(l.ReceivedQty) || 0) * (Number(l.Rate) || 0); }, 0);
      return {
        averageRate: totalQty > 0 ? totalValue / totalQty : 0,
        grnCount: new Set(filtered.map(function (l) { return l.GRNID; })).size,
        totalQtyPurchased: totalQty
      };
    }

    case 'getSystemSettings': {
      const { data, error } = await supabaseClient.from('system_settings').select('*');
      if (error) throw new Error(error.message);
      const map = {}; (data || []).forEach(function (r) { map[r.Key] = r.Value; });
      return map;
    }
    case 'saveSystemSetting': {
      const { error } = await supabaseClient.from('system_settings').upsert({ Key: p.key, Value: p.value });
      if (error) throw new Error(error.message);
      return {};
    }

    default:
      throw new Error('অজানা action: ' + action);
  }
}

/** Warehouse/Item/Supplier-এর মতো রেফারেন্স ড্রপডাউনের ডেটার জন্য — একই সেশনে একবার আনলে
 *  আবার নতুন করে আনার দরকার নেই (কোনো লেখা/পরিবর্তন হলেই ক্যাশ নিজে থেকে খালি হয়ে যায়)। */
async function cachedList(sheet) {
  if (listCache[sheet]) return listCache[sheet];
  const data = await api('list', { sheet: sheet });
  listCache[sheet] = data;
  return data;
}

/** একাধিক Sheet-এর রেফারেন্স ডেটা একসাথে আনার জন্য — যেগুলো ক্যাশে নেই শুধু সেগুলোই
 *  একটামাত্র রিকোয়েস্টে ব্যাচ করে আনা হয়, ফর্ম খোলার গতি অনেক বাড়ায়।
 *  ব্যবহার: const {Items, Suppliers} = await cachedListMultiple(['Items','Suppliers']); */
async function cachedListMultiple(sheetNames) {
  const uncached = sheetNames.filter(function (s) { return !listCache[s]; });
  if (uncached.length > 0) {
    const result = await api('listMultiple', { sheets: uncached });
    uncached.forEach(function (s) { listCache[s] = result[s] || []; });
  }
  const out = {};
  sheetNames.forEach(function (s) { out[s] = listCache[s]; });
  return out;
}

/* ============================================================
   ৪) TOAST
   ============================================================ */
function showToast(message, type) {
  const wrap = document.getElementById('toastWrap');
  if (!wrap) return; // ব্যবহারকারী এই ফাঁকে অন্য পেজ/ট্যাবে চলে গেলে এই এলিমেন্ট আর DOM-এ থাকবে না
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = message;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

/* ============================================================

   ============================================================ */
function buildSidebar() {
  const navScroll = document.getElementById('navScroll');
  navScroll.innerHTML = '';
  MODULES.forEach(function (m, i) {
    const li = document.createElement('div');
    li.className = 'nav-item' + (i === 0 ? ' open active' : '');
    li.innerHTML = `
      <div class="nav-link">
        <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[m.key]}</svg></span>
        <span class="nav-label i18n" data-bn="${m.bn}" data-en="${m.en}">${m.bn}</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <div class="submenu">

      </div>`;
    const link = li.querySelector('.nav-link');
    link.addEventListener('click', function () {
      const wasOpen = li.classList.contains('open');
      document.querySelectorAll('.nav-item').forEach(function(el){ el.classList.remove('open'); });
      if (!wasOpen) li.classList.add('open');
    });
    li.querySelectorAll('.submenu a').forEach(function (a) {
      a.addEventListener('click', function () {
        document.querySelectorAll('.submenu a').forEach(function(x){ x.classList.remove('active'); });
        a.classList.add('active');
        document.querySelectorAll('.nav-item').forEach(function(el){ el.classList.remove('active'); });
        li.classList.add('active');
        navigateTo(a.dataset.page, a.dataset[currentLang === 'bn' ? 'mbn' : 'men'], getLangText(a));
        if (window.innerWidth <= 1023) closeMobile();
      });
    });
    navScroll.appendChild(li);
  });
}
function getLangText(el){ return el.getAttribute('data-' + currentLang) || el.textContent; }

/* ============================================================

   ============================================================ */
async function navigateTo(pageKey, moduleLabel, pageLabel) {
  document.getElementById('crumbTitle').textContent = pageLabel;
  document.getElementById('crumbPath').textContent = moduleLabel + ' / ' + pageLabel;

  // ট্যাব যোগ/আপডেট করা — একই পেজ আগে থেকেই খোলা থাকলে নতুন ট্যাব বসবে না, শুধু সক্রিয় হবে
  const existing = openTabs.find(function (tb) { return tb.key === pageKey; });
  if (existing) {
    existing.moduleLabel = moduleLabel;
    existing.pageLabel = pageLabel;
  } else {
    openTabs.push({ key: pageKey, moduleLabel: moduleLabel, pageLabel: pageLabel });
  }
  activeTabKey = pageKey;
  renderTabBar();

  const content = document.getElementById('pageContent');
  if (READY_PAGES.indexOf(pageKey) === -1) {
    content.innerHTML = `
      <div class="empty-state" style="padding:100px 20px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>

        <div>Phase 3-এ ধাপে ধাপে প্রতিটা মডিউল বানানো হচ্ছে — এই পেজটা শীঘ্রই আসছে।</div>
      </div>`;
    return;
  }

  content.innerHTML = '<div class="empty-state">লোড হচ্ছে...</div>';
  try {
    if (pageKey === 'dashboard') await renderDashboard(content);
    else if (pageKey === 'companyProfile') await renderCompanyProfile(content);
    else if (pageKey === 'userManagement') await renderUserManagement(content);
    else if (pageKey === 'roles') await renderRoles(content);
    else if (pageKey === 'activityLog') await renderActivityLog(content);
    else if (pageKey === 'items') await renderItemMasterPage(content);
    else if (MASTER_CONFIGS[pageKey]) await renderMasterCrudPage(content, MASTER_CONFIGS[pageKey]);
    else if (pageKey === 'party') await renderPartyMasterPage(content);
    else if (pageKey === 'partyLedger') await renderPartyLedger(content);
    else if (pageKey === 'custLedger') await renderPartyLedger(content, 'Customer');
    else if (pageKey === 'stockOverview') await renderStockOverview(content);
    else if (pageKey === 'stockLedger') await renderStockLedger(content);
    else if (pageKey === 'goodsReceive') await renderDocumentListPage(content, DOC_CONFIGS.grn);
    else if (pageKey === 'pi') await renderPurchaseVoucherPage(content, 'PurchaseInvoice');
    else if (pageKey === 'pret') await renderPurchaseVoucherPage(content, 'PurchaseReturn');
    else if (pageKey === 'si') await renderSalesVoucherPage(content, 'SalesInvoice');
    else if (pageKey === 'sr') await renderSalesVoucherPage(content, 'SalesReturn');
    else if (pageKey === 'empInfo') await renderMasterCrudPage(content, MASTER_CONFIGS.employees);
    else if (pageKey === 'attendance') await renderAttendancePage(content);
    else if (pageKey === 'leave') await renderLeavePage(content);
    else if (pageKey === 'payroll') await renderPayrollPage(content);
    else if (pageKey === 'payslip') await renderPayslipPage(content);
    else if (pageKey === 'invReport') await renderInventoryReport(content);
    else if (pageKey === 'salesReport') await renderSalesReport(content);
    else if (pageKey === 'purReport') await renderPurchaseReport(content);
    else if (pageKey === 'prodReport') await renderProductionReport(content);
    else if (pageKey === 'finReport') await renderFinancialReport(content);
    else if (pageKey === 'general') await renderGeneralSettingsPage(content);
    else if (pageKey === 'langSettings') await renderLanguageSettingsPage(content);
    else if (pageKey === 'companySettings') await renderCompanyProfile(content);
    else if (pageKey === 'backup') await renderBackupRestorePage(content);
    else if (pageKey === 'pOrder') await renderProductionOrderPage(content);
    else if (pageKey === 'processing') await renderProcessingPage(content);
    else if (SIMPLE_VOUCHER_CONFIGS[pageKey]) await renderSimpleVoucherPage(content, SIMPLE_VOUCHER_CONFIGS[pageKey]);
    else if (pageKey === 'bankBook') await renderBankCashBook(content);

/** উপরে ট্যাব বার আঁকা — প্রতিটা খোলা পেজের জন্য একটা ট্যাব, বন্ধ করার × বাটনসহ */
function renderTabBar() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = openTabs.map(function (tb) {
    const isActive = tb.key === activeTabKey;
    return `<div class="tab-item${isActive ? ' active' : ''}" onclick="switchTab('${tb.key}')">
      <span class="tab-label">${escapeHtml(tb.pageLabel)}</span>
      <span class="tab-close" onclick="closeTab(event, '${tb.key}')" title="${t('বন্ধ করুন','Close')}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </span>
    </div>`;
  }).join('');
}

/** কোনো ট্যাবে ক্লিক করলে সেই পেজে ফিরে যাওয়া (আবার রেন্ডার হবে) */
function switchTab(pageKey) {
  const tb = openTabs.find(function (t2) { return t2.key === pageKey; });
  if (!tb) return;
  navigateTo(tb.key, tb.moduleLabel, tb.pageLabel);
}

/** ট্যাব বন্ধ করা — সক্রিয় ট্যাব বন্ধ হলে পাশের একটাতে (বা Dashboard-এ) চলে যাবে */
function closeTab(evt, pageKey) {
  evt.stopPropagation(); // ট্যাব ক্লিক ইভেন্টে যাতে না চলে যায়
  const idx = openTabs.findIndex(function (tb) { return tb.key === pageKey; });
  if (idx === -1) return;
  openTabs.splice(idx, 1);

  if (activeTabKey === pageKey) {
    if (openTabs.length > 0) {
      const next = openTabs[Math.max(0, idx - 1)];
      navigateTo(next.key, next.moduleLabel, next.pageLabel);
    } else {
      navigateTo('dashboard', t('কোর','Core'), t('ড্যাশবোর্ড','Dashboard'));
    }
  } else {
    renderTabBar();
  }
}

  if (users.length === 0) { wrap.innerHTML = '<div class="empty-state">এখনো কোনো ব্যবহারকারী তৈরি হয়নি।</div>'; return; }
  wrap.innerHTML = `<table class="data-table"><thead><tr>

    </tr></thead><tbody>
      ${users.filter(u => u.Status !== 'Deleted').map(function (u) {

          <td><span class="badge ${isTrue(u.IsActive) ? 'active' : 'inactive'}">${isTrue(u.IsActive) ? 'সক্রিয়' : 'নিষ্ক্রিয়'}</span></td>

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="m18.5 2.5 3 3L10 17l-4 1 1-4Z"/></svg>
            </button>

}

function openUserModal(user) {
  const isEdit = !!user;
  const roleOptions = rolesCache.map(r => `<option value="${attr(r.RoleID)}" ${user && user.RoleID===r.RoleID?'selected':''}>${escapeHtml(r.RoleName)}</option>`).join('');
  openModal({
    title: isEdit ? 'ব্যবহারকারী সম্পাদনা' : 'নতুন ব্যবহারকারী',
    bodyHtml: `
      <div class="field"><label>পূর্ণ নাম</label><input id="um_FullName" value="${attr(user && user.FullName)}"></div>
      <div class="field"><label>ইমেইল</label><input id="um_Email" type="email" value="${attr(user && user.Email)}" ${isEdit ? 'disabled' : ''}></div>
      <div class="field"><label>${isEdit ? 'নতুন পাসওয়ার্ড (খালি রাখলে অপরিবর্তিত থাকবে)' : 'পাসওয়ার্ড'}</label><input id="um_Password" type="password"></div>
      <div class="field"><label>ভূমিকা</label><select id="um_RoleID">${roleOptions}</select></div>
      <div class="field"><label>ফোন</label><input id="um_Phone" value="${attr(user && user.Phone)}"></div>
      <div class="field"><label>অবস্থা</label><select id="um_IsActive"><option value="TRUE" ${!user || isTrue(user.IsActive)?'selected':''}>সক্রিয়</option><option value="FALSE" ${user && !isTrue(user.IsActive)?'selected':''}>নিষ্ক্রিয়</option></select></div>
    `,
    onSave: async function () {
      const data = {
        FullName: val('um_FullName'), Email: val('um_Email'), RoleID: val('um_RoleID'),
        Phone: val('um_Phone'), IsActive: val('um_IsActive'), Password: val('um_Password')
      };
      if (isEdit) {
        await api('updateUser', { userId: user.UserID, data: data });
      } else {
        if (!data.Password) throw new Error('নতুন ব্যবহারকারীর জন্য পাসওয়ার্ড আবশ্যক।');
        await api('createUser', { data: data });
      }
      showToast('সেভ হয়েছে ✅', 'success');
      const users = await api('list', { sheet: 'Users' });
      renderUserTable(users);
    }
  });
}

async function renderRoles(content) {
  const roles = await api('list', { sheet: 'Roles' });
  content.innerHTML = `
    <div class="page-head"><div><h1>ভূমিকা ও অনুমতি</h1><p>ব্যবহারকারীদের ভূমিকা এখান থেকে নিয়ন্ত্রণ হবে</p></div>
      <button class="btn btn-primary" style="width:auto;" id="addRoleBtn">+ নতুন ভূমিকা</button></div>
    <div class="panel"><div id="roleTableWrap"></div></div>`;
  renderRoleTable(roles);
  document.getElementById('addRoleBtn').addEventListener('click', function () { openRoleModal(); });
}

function renderRoleTable(roles) {
  const wrap = document.getElementById('roleTableWrap');
  if (!wrap) return; // ব্যবহারকারী এই ফাঁকে অন্য পেজ/ট্যাবে চলে গেলে এই এলিমেন্ট আর DOM-এ থাকবে না
  const active = roles.filter(r => r.Status !== 'Deleted');
  if (active.length === 0) { wrap.innerHTML = '<div class="empty-state">এখনো কোনো ভূমিকা তৈরি হয়নি।</div>'; return; }
  wrap.innerHTML = `<table class="data-table"><thead><tr><th>ভূমিকার নাম</th><th>মডিউল অ্যাক্সেস</th></tr></thead><tbody>
    ${active.map(r => `<tr><td>${escapeHtml(r.RoleName)}</td><td>${escapeHtml(r.ModuleAccess || '—')}</td></tr>`).join('')}
  </tbody></table>`;
}

function openRoleModal() {
  openModal({
    title: 'নতুন ভূমিকা',
    bodyHtml: `
      <div class="field"><label>ভূমিকার নাম</label><input id="rl_RoleName" placeholder="যেমন: Store Keeper"></div>
      <div class="field"><label>মডিউল অ্যাক্সেস (নোট আকারে)</label><input id="rl_ModuleAccess" placeholder="যেমন: Inventory, Purchase"></div>
    `,
    onSave: async function () {
      const name = val('rl_RoleName');
      if (!name) throw new Error('ভূমিকার নাম আবশ্যক।');
      await api('create', { sheet: 'Roles', idField: 'RoleID', idPrefix: 'ROLE', requiredFields: ['RoleName'],
        data: { RoleName: name, ModuleAccess: val('rl_ModuleAccess') } });
      showToast('ভূমিকা তৈরি হয়েছে ✅', 'success');
      renderRoleTable(await api('list', { sheet: 'Roles' }));
    }
  });
}

  function renderTable(list) {

    if (!wrap) return; // ব্যবহারকারী এই ফাঁকে অন্য পেজ/ট্যাবে চলে গেলে এই এলিমেন্ট আর DOM-এ থাকবে না
    const active = list.filter(function (r) { return r.Status !== 'Deleted'; });
    if (active.length === 0) {
      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এখনো কোনো তথ্য যোগ করা হয়নি।" data-en="No records added yet.">${t('এখনো কোনো তথ্য যোগ করা হয়নি।','No records added yet.')}</div>`;
      return;
    }

    const headCells = config.columns.map(function (c) { return `<th class="i18n" data-bn="${attr(c.label)}" data-en="${attr(bnToEn(c.label))}">${t(c.label, bnToEn(c.label))}</th>`; }).join('');
    const bodyRows = active.map(function (r) {
      const cells = config.columns.map(function (c) {
        let v = r[c.key];
        if (c.key === 'IsActive') v = isTrue(v) ? `<span class="badge active i18n" data-bn="সক্রিয়" data-en="Active">${t('সক্রিয়','Active')}</span>` : `<span class="badge inactive i18n" data-bn="নিষ্ক্রিয়" data-en="Inactive">${t('নিষ্ক্রিয়','Inactive')}</span>`;
        else if (c.key === 'OpeningBalance' || c.key === 'CreditLimit') v = formatAmountDrCr(v);
        else v = escapeHtml(v);
        return '<td>' + v + '</td>';
      }).join('');
      return `<tr>${cells}<td class="row-actions">
        <button onclick='openMasterModal(${JSON.stringify(config.sheet)}, ${JSON.stringify(r).replace(/'/g,"&apos;")})' title="${t('সম্পাদনা','Edit')}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="m18.5 2.5 3 3L10 17l-4 1 1-4Z"/></svg>
        </button>
        <button onclick='deleteMasterRecord(${JSON.stringify(config.sheet)}, ${JSON.stringify(r[config.idField])})' title="${t('ডিলিট','Delete')}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
        </button>
      </td></tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}<th></th></tr></thead><tbody>${bodyRows}</tbody></table>`;
  }

  renderTable(records);
  document.getElementById('masterAddBtn').addEventListener('click', function () { openMasterModal(config.sheet, null); });

  // বর্তমান config-টা গ্লোবাল রেফারেন্সে রাখা হচ্ছে যাতে row বাটনের ইনলাইন onclick থেকে পাওয়া যায়
  window.__activeMasterConfig = config;
  window.__refreshMasterTable = async function () { renderTable(await api('list', { sheet: config.sheet })); };
}

async function openMasterModal(sheetName, record) {
  const config = window.__activeMasterConfig;
  const isEdit = !!record;

  // যেসব ফিল্ডে FK ড্রপডাউন লাগবে সেগুলোর ডেটা একসাথে (parallel) আনা হচ্ছে —
  // আগে একটার পর একটা আনা হতো, যা ফর্ম খুলতে ধীরগতির প্রধান কারণ ছিল।
  const fkFieldsList = config.fields.filter(function (f) { return f.type === 'select-fk'; });
  const uniqueFkSheets = Array.from(new Set(fkFieldsList.map(function (f) { return f.fkSheet; })));
  const fkSheetMap = await cachedListMultiple(uniqueFkSheets);
  const fkLists = {};
  fkFieldsList.forEach(function (f) { fkLists[f.key] = fkSheetMap[f.fkSheet]; });

  const bodyHtml = config.fields.map(function (f) {
    const currentVal = record ? record[f.key] : '';
    const inputId = 'mf_' + f.key;

    if (f.type === 'select-enum') {
      const opts = f.options.map(function (o) { return `<option value="${o}" ${currentVal===o?'selected':''}>${o}</option>`; }).join('');
      return `<div class="field"><label>${f.label}</label><select id="${inputId}"><option value="">— বাছাই করুন —</option>${opts}</select></div>`;
    }
    if (f.type === 'select-fk') {
      const list = (fkLists[f.key] || []).filter(function (r) {
        if (r.Status === 'Deleted') return false;
        // self-referencing FK (যেমন Category-র ParentCategoryID) হলে নিজেকে নিজের প্যারেন্ট বানানো যাবে না
        if (isEdit && f.fkSheet === config.sheet && r[config.idField] === record[config.idField]) return false;
        return true;
      });
      const opts = list.map(function (r) {
        const idVal = r[f.fkIdField];
        return `<option value="${attr(idVal)}" ${currentVal===idVal?'selected':''}>${escapeHtml(r[f.fkLabel])}</option>`;
      }).join('');
      return `<div class="field"><label>${f.label}</label><select id="${inputId}"><option value="">— নেই —</option>${opts}</select></div>`;
    }
    if (f.type === 'boolean') {
      return `<div class="field"><label>${f.label}</label><select id="${inputId}">
        <option value="TRUE" ${!record || isTrue(currentVal) ? 'selected' : ''}>সক্রিয়</option>
        <option value="FALSE" ${record && !isTrue(currentVal) ? 'selected' : ''}>নিষ্ক্রিয়</option></select></div>`;
    }
    if (f.type === 'number') {
      return `<div class="field"><label>${f.label}</label><input id="${inputId}" type="number" step="any" value="${attr(currentVal)}"></div>`;
    }
    if (f.type === 'amount-drcr') {
      return amountDrCrFieldHtml(inputId, f.label, currentVal);
    }
    if (f.type === 'date') {
      return `<div class="field"><label>${f.label}</label><input id="${inputId}" type="date" value="${attr(currentVal)}"></div>`;
    }
    return `<div class="field"><label>${f.label}</label><input id="${inputId}" value="${attr(currentVal)}"></div>`;
  }).join('');

  openModal({
    title: (isEdit ? 'সম্পাদনা — ' : 'নতুন — ') + config.titleBn,
    bodyHtml: bodyHtml,
    onSave: async function () {
      const data = {};
      config.fields.forEach(function (f) {
        let v = f.type === 'amount-drcr' ? readAmountDrCr('mf_' + f.key) : val('mf_' + f.key);
        // ঐচ্ছিক ড্রপডাউন (select-fk) খালি রাখলে "" এর বদলে null পাঠানো হচ্ছে —
        // কারণ ডেটাবেসের ফরেইন-কী কলাম "" মেনে নেয় না, শুধু আসল আইডি অথবা null মানে
        if (f.type === 'select-fk' && v === '') v = null;
        if (f.type === 'number' && v === '') v = null;
        if (f.type === 'date' && v === '') v = null;
        data[f.key] = v;
      });

      const missing = config.fields.filter(function (f) { return f.required && !data[f.key]; });
      if (missing.length > 0) throw new Error(missing.map(function(f){return f.label;}).join(', ') + ' আবশ্যক।');

      if (isEdit) {
        await api('update', { sheet: config.sheet, idField: config.idField, idValue: record[config.idField], data: data });
      } else {
        const requiredFields = config.fields.filter(function (f) { return f.required; }).map(function (f) { return f.key; });
        await api('create', { sheet: config.sheet, idField: config.idField, idPrefix: config.idPrefix, requiredFields: requiredFields, data: data });
      }
      showToast('সেভ হয়েছে ✅', 'success');
      await window.__refreshMasterTable();
    }
  });
}

async function deleteMasterRecord(sheetName, idValue) {
  const config = window.__activeMasterConfig;
  if (!confirm('আপনি কি নিশ্চিত এটা ডিলিট করতে চান?')) return;
  try {
    await api('delete', { sheet: config.sheet, idField: config.idField, idValue: idValue });
    showToast('ডিলিট হয়েছে ✅', 'success');
    await window.__refreshMasterTable();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

/* ============================================================
   ১২.৪) আইটেম মাস্টার — কাস্টম কার্ড (কোড/গ্রুপ/ক্যাটাগরি/একক/ডেসিমাল/
   ওয়ারহাউজ/ওপেনিং স্টক/আদর্শ ক্রয়-বিক্রয় দর সহ), সাধারণ Master ইঞ্জিন
   দিয়ে নয় — কারণ এতে সেকশন-ভিত্তিক লেআউট ও লাইভ হিসাব (Decimal
   অটো-ফিল, Value = পরিমাণ×দর) দরকার যা জেনেরিক ইঞ্জিনে নেই।
   ============================================================ */
async function renderItemMasterPage(content) {
  content.innerHTML = `
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="আইটেম মাস্টার" data-en="Item Master">${t('আইটেম মাস্টার','Item Master')}</h1>
        <p class="i18n" data-bn="কাঁচামাল, তৈরি পণ্য ও অন্যান্য সব আইটেমের তালিকা" data-en="List of raw materials, finished goods and other items">${t('কাঁচামাল, তৈরি পণ্য ও অন্যান্য সব আইটেমের তালিকা','List of raw materials, finished goods and other items')}</p>
      </div>
      <button class="btn btn-primary" style="width:auto;" id="itemAddBtn">Item +</button></div>
    <div class="panel"><div id="itemTableWrap"></div></div>`;

  async function loadList() {
    const [items, groups, categories, units, stock, warehouses] = await Promise.all([
      api('list', { sheet:'Items' }), cachedList('ItemGroups'), cachedList('Categories'),
      cachedList('UOM'), api('list', { sheet:'CurrentStock' }), cachedList('Warehouses')
    ]);
    const groupMap = {}; groups.forEach(function (g) { groupMap[g.GroupID] = g.GroupName; });
    const catMap = {}; categories.forEach(function (c) { catMap[c.CategoryID] = c.CategoryName; });
    const unitMap = {}; units.forEach(function (u) { unitMap[u.UOMID] = u; });
    const whMap = {}; warehouses.forEach(function (w) { whMap[w.WarehouseID] = w.WarehouseName; });

    const wrap = document.getElementById('itemTableWrap');
    if (!wrap) return; // ব্যবহারকারী এই ফাঁকে অন্য পেজ/ট্যাবে চলে গেলে এই এলিমেন্ট আর DOM-এ থাকবে না
    const active = items.filter(function (r) { return r.Status !== 'Deleted'; });
    if (active.length === 0) {
      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এখনো কোনো আইটেম যোগ করা হয়নি।" data-en="No items added yet.">${t('এখনো কোনো আইটেম যোগ করা হয়নি।','No items added yet.')}</div>`;
      return;
    }

    const headers = [
      ['কোড','Code'], ['নাম','Name'], ['গ্রুপ','Group'], ['ক্যাটাগরি','Category'], ['একক','Unit'], ['ওয়ারহাউজ','Warehouse'],
      ['পরিমাণ','Quantity'], ['দর (ওজন)','Rate (weight)'], ['পিস','Pieces'], ['দর (পিস)','Rate (piece)'],
      ['মূল্য','Value'], ['স্ট্যাটাস','Status']
    ];
    const headCells = headers.map(function (h) { return `<th class="i18n" data-bn="${h[0]}" data-en="${h[1]}">${t(h[0], h[1])}</th>`; }).join('');

    const rowActionsHtml = function (r) {
      return `<td class="row-actions">
        <button onclick='openItemForm(${JSON.stringify(r).replace(/'/g,"&apos;")})' title="${t('সম্পাদনা','Edit')}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="m18.5 2.5 3 3L10 17l-4 1 1-4Z"/></svg>
        </button>
        <button onclick='deleteItemRecord(${JSON.stringify(r.ItemID)})' title="${t('ডিলিট','Delete')}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
        </button>
      </td>`;
    };

    const bodyRows = active.map(function (r) {
      const unit = unitMap[r.UOMID];
      const rateWeight = Number(r.StandardCost) || 0;
      const isDual = r.TrackingType === 'WeightPieces';
      const statusCell = isTrue(r.IsActive)
        ? `<span class="badge active i18n" data-bn="সক্রিয়" data-en="Active">${t('সক্রিয়','Active')}</span>`
        : `<span class="badge inactive i18n" data-bn="নিষ্ক্রিয়" data-en="Inactive">${t('নিষ্ক্রিয়','Inactive')}</span>`;

      const itemStock = stock.filter(function (s) { return s.ItemID === r.ItemID; });
      const stockRows = itemStock.length > 0 ? itemStock : [null]; // স্টক না থাকলেও আইটেমটা অন্তত একবার দেখানো হবে

      return stockRows.map(function (s) {
        const qtyNum = s ? (Number(s.QtyOnHand) || 0) : 0;
        const value = qtyNum * rateWeight;
        // "ওজন + পিস" আইটেমে পিস সংখ্যা সরাসরি সংরক্ষিত ডেটা (current_stock.QtyPieces) থেকে
        // দেখানো হচ্ছে — কোনো স্থির কনভার্সন ফ্যাক্টর দিয়ে অনুমান করা হচ্ছে না
        const pieces = isDual && s ? (Number(s.QtyPieces) || 0) : null;
        const ratePerPiece = (pieces !== null && pieces > 0) ? value / pieces : null;
        return `<tr>
          <td>${escapeHtml(r.ItemID)}</td><td>${escapeHtml(r.ItemName)}</td>
          <td>${escapeHtml(groupMap[r.GroupID] || '—')}</td><td>${escapeHtml(catMap[r.CategoryID] || '—')}</td>
          <td>${escapeHtml(unit ? unit.UOMName : '')}</td>
          <td>${s ? escapeHtml(whMap[s.WarehouseID] || s.WarehouseID) : '—'}</td>
          <td><b>${formatQtyByUOM(qtyNum, r.UOMID, units)}</b></td>
          <td>${rateWeight ? rateWeight.toFixed(2) : '—'}</td>
          <td>${pieces !== null ? pieces.toFixed(2) : '—'}</td>
          <td>${ratePerPiece !== null ? ratePerPiece.toFixed(2) : '—'}</td>
          <td><b>${value.toFixed(2)}</b></td>
          <td>${statusCell}</td>
          ${rowActionsHtml(r)}
        </tr>`;
      }).join('');
    }).join('');

    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}<th></th></tr></thead><tbody>${bodyRows}</tbody></table>`;
  }

  await loadList();
  window.__refreshItemList = loadList;
  document.getElementById('itemAddBtn').addEventListener('click', function () { openItemForm(null); });
}

async function deleteItemRecord(itemId) {
  if (!confirm(t('আপনি কি নিশ্চিত এই আইটেম ডিলিট করতে চান?','Are you sure you want to delete this item?'))) return;
  try {
    await api('delete', { sheet:'Items', idField:'ItemID', idValue: itemId });
    showToast(t('ডিলিট হয়েছে ✅','Deleted ✅'), 'success');
    if (window.__refreshItemList) await window.__refreshItemList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function openItemForm(existing) {
  itemOpeningKgPerPiece = null; // প্রতিবার নতুন করে ফর্ম খুললে আগের আইটেমের অনুপাত যেন বহন না হয়

  function opts(list, idF, labelF, selected) {

      .map(function (x) { return `<option value="${attr(x[idF])}" ${selected===x[idF]?'selected':''}>${escapeHtml(x[labelF])}</option>`; }).join('');

  const bodyHtml = `

      <div class="field"><label>${t('ক্যাটাগরি','Category')}</label><select id="it_CategoryID">${opts(categories, 'CategoryID', 'CategoryName', rec.CategoryID)}</select></div>
      <div class="field"><label>${t('একক','Unit')}</label><select id="it_UOMID" onchange="updateItemUnitEcho()">${opts(units, 'UOMID', 'UOMName', rec.UOMID)}</select></div>
      <div class="field"><label>${t('ক্রয়/বিক্রয় পদ্ধতি','Purchase/Sale Method')}</label><select id="it_UnitMode">
          <option value="Weight" ${(rec.UnitMode||'Weight')==='Weight'?'selected':''}>${t('ওজন (কেজি)','By Weight (kg)')}</option>
          <option value="Piece" ${rec.UnitMode==='Piece'?'selected':''}>${t('পিস','By Piece')}</option>
        </select></div>
      <div class="field"><label>${t('স্টক ট্র্যাকিং ধরন','Stock Tracking Type')}</label><select id="it_TrackingType">
          <option value="Weight" ${(rec.TrackingType||'Weight')==='Weight'?'selected':''}>${t('শুধু ওজন','Weight Only')}</option>
          <option value="WeightPieces" ${rec.TrackingType==='WeightPieces'?'selected':''}>${t('ওজন + পিস (তৈরি পণ্য)','Weight + Pieces (Finished Goods)')}</option>
        </select></div>
      <div class="field"><label>${t('ওয়ারহাউজ','Warehouse')}</label><select id="it_WarehouseID">${opts(warehouses, 'WarehouseID', 'WarehouseName', '')}</select></div>

            <td style="border-top:1px dashed var(--border);"><input id="it_OpPieces" type="number" step="any" oninput="updateItemOpeningFromPieces()" style="width:90px;"></td>
            <td style="border-top:1px dashed var(--border);color:var(--text-muted);font-style:italic;">${t('পিস','pcs')}</td>
            <td style="border-top:1px dashed var(--border);"><input id="it_OpRatePerPiece" type="number" step="any" oninput="updateItemOpeningFromPieceRate()" style="width:90px;"></td>
