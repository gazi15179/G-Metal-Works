        <h3 style="margin:0 0 14px;font-size:15px;">${t('ব্যাংক প্রদানের বিবরণ','Bank Payment Details')}</h3>
        <div class="field"><label>${t('পরিমাণ','Amount')}</label><input value="৳ ${amt}" readonly style="background:var(--bg);"></div>
        <div class="field"><label>${t('প্রদানের ধরন','Payment Method')} *</label>
          <select id="pv3_PopMethod" data-order="0">
            <option value="CashToSupplierBank" ${curMethod==='CashToSupplierBank'?'selected':''}>${t('নগদ টু সাপ্লায়ার ব্যাংক','Cash to Supplier Bank')}</option>
            <option value="OurBankToSupplierBank" ${curMethod==='OurBankToSupplierBank'?'selected':''}>${t('নিজের ব্যাংক টু সাপ্লায়ার ব্যাংক','Our Bank to Supplier Bank')}</option>
          </select>
        </div>
        <div class="field" id="pv3_PopOurBankField" style="display:none;"><label>${t('আমাদের ব্যাংক','Our Bank')} *</label>
          <select id="pv3_PopBankAcc" data-order="1"><option value="">—</option>${optsHtml(bankAccounts, 'BankAccID', 'AccountName', curBankAcc)}</select>
        </div>
        <div class="field"><label>${t('সাপ্লায়ারের ব্যাংক','Supplier\u2019s Bank')}</label><input value="${attr(supBankName)}" readonly style="background:var(--bg);"></div>
        <div class="field"><label>${t('অ্যাকাউন্ট নম্বর','Account No')}</label><input value="${attr(supBankAcc)}" readonly style="background:var(--bg);"></div>
        <div class="field"><label>${t('বিবরণ/নোট','Note')} *</label><input id="pv3_PopNote" data-order="2" value="${attr(curNote)}" placeholder="${t('যেমন: চালানের বিপরীতে অগ্রিম পরিশোধ','e.g. Advance against this invoice')}"></div>
        <div style="display:flex;gap:8px;margin-top:16px;">
          <button type="button" id="pv3_PopCancel" class="btn" style="flex:1;">${t('বাতিল','Cancel')}</button>
          <button type="button" id="pv3_PopConfirm" data-order="3" class="btn btn-primary" style="flex:1;">${t('নিশ্চিত করুন','Confirm')}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    function togglePopOurBank() {
      document.getElementById('pv3_PopOurBankField').style.display = document.getElementById('pv3_PopMethod').value === 'OurBankToSupplierBank' ? '' : 'none';
    }
    document.getElementById('pv3_PopMethod').addEventListener('change', togglePopOurBank);
    togglePopOurBank();

    // ডেস্কটপে কীবোর্ড দিয়ে দ্রুত চলাচল: Enter = পরের ঘর, Escape = আগের ঘর
    // document-এ capture-phase-এ শোনা হচ্ছে যাতে <select>-এর নিজস্ব কীবোর্ড
    // আচরণ (কোনো কোনো ব্রাউজারে) মাঝপথে আটকে না দেয়; পপআপ বন্ধ হলে সরিয়ে ফেলা হয়
    function focusableFields() {
      return Array.from(overlay.querySelectorAll('[data-order]')).filter(function (el) { return el.offsetParent !== null; });
    }
    function keyNavHandler(e) {
      if (e.key !== 'Enter' && e.key !== 'Escape') return;
      if (!overlay.contains(document.activeElement)) return;
      const fields = focusableFields();
      const curIdx = fields.indexOf(document.activeElement);
      if (curIdx === -1) return;
      e.preventDefault();
      e.stopPropagation();
      if (e.key === 'Enter') {
        const next = fields[curIdx + 1];
        if (next) { next.focus(); } else { document.getElementById('pv3_PopConfirm').click(); }
      } else {
        const prev = fields[curIdx - 1];
        if (prev) prev.focus(); else document.getElementById('pv3_PopCancel').click();
      }
    }
    document.addEventListener('keydown', keyNavHandler, true);
    function closePopup() {
      document.removeEventListener('keydown', keyNavHandler, true);
      overlay.remove();
    }

    document.getElementById('pv3_PopCancel').addEventListener('click', function () {
      document.getElementById('pv3_PayAmount').value = '';
      document.getElementById('pv3_BankPaidAmount').value = '';
      pv3BankPopupFilled = false;
      updateBankPaySummary();
      closePopup();
    });
    document.getElementById('pv3_PopConfirm').addEventListener('click', function () {
      const method = val('pv3_PopMethod');
      const note = document.getElementById('pv3_PopNote').value.trim();
      const ourBank = val('pv3_PopBankAcc');
      if (!note) { showToast(t('বিবরণ/নোট লিখুন।','Enter a note.'), 'error'); return; }
      if (method === 'OurBankToSupplierBank' && !ourBank) { showToast(t('আমাদের ব্যাংক বাছাই করুন।','Select our bank.'), 'error'); return; }
      document.getElementById('pv3_BankPayMethod').value = method;
      document.getElementById('pv3_BankAccID').value = method === 'OurBankToSupplierBank' ? ourBank : '';
      document.getElementById('pv3_BankPaidNote').value = note;
      pv3BankPopupFilled = true;
      updateBankPaySummary();
      closePopup();
    });
    setTimeout(function () { document.getElementById('pv3_PopMethod').focus(); }, 0);
  }

  function togglePayType() {
    const isCash = val('pv3_PayTypeSelect') === 'Cash';
    document.getElementById('pv3_CashPaidNote').style.display = isCash ? '' : 'none';
    document.getElementById('pv3_BankPaySummary').style.display = isCash ? 'none' : '';
    document.getElementById('pv3_PayAmount').value = isCash ? val('pv3_CashPaidAmount') : val('pv3_BankPaidAmount');
  }
  document.getElementById('pv3_PayTypeSelect').addEventListener('change', togglePayType);
  togglePayType();

  document.getElementById('pv3_PayAmount').addEventListener('change', function () {
    const isCash = val('pv3_PayTypeSelect') === 'Cash';
    if (isCash) {
      document.getElementById('pv3_CashPaidAmount').value = this.value;
    } else {
      document.getElementById('pv3_BankPaidAmount').value = this.value;
      if (Number(this.value) > 0 && !pv3BankPopupFilled) openBankPaymentPopup();
      if (!(Number(this.value) > 0)) { pv3BankPopupFilled = false; updateBankPaySummary(); }
    }
  });
  document.getElementById('pv3_BankPaySummary').addEventListener('click', function () {
    if (Number(val('pv3_BankPaidAmount')) > 0) openBankPaymentPopup();
  });

  document.getElementById('pv3_SupplierID').addEventListener('change', toggleCashSupplier);
  toggleCashSupplier();

  function refreshItemDropdown() {
    const groupChecked = document.getElementById('pv3_GroupCheck').checked;
    const catChecked = document.getElementById('pv3_CatCheck').checked;
    const groupVal = val('pv3_GroupSelect'), catVal = val('pv3_CatSelect');
    let list = window.__pv3Items;
    if (groupChecked && groupVal) list = list.filter(function (i) { return i.GroupID === groupVal; });
    if (catChecked && catVal) list = list.filter(function (i) { return i.CategoryID === catVal; });
    const sel = document.getElementById('pv3_ItemID');
    const prev = sel.value;
    sel.innerHTML = '<option value="">—</option>' + list.map(function (i) { return `<option value="${attr(i.ItemID)}">${escapeHtml(i.ItemName)}</option>`; }).join('');
    if (list.some(function (i) { return i.ItemID === prev; })) sel.value = prev;
  }
  document.getElementById('pv3_GroupCheck').addEventListener('change', function () {
    const sel = document.getElementById('pv3_GroupSelect');
    sel.disabled = !this.checked; sel.style.display = this.checked ? '' : 'none';
    if (!this.checked) sel.value = '';
    refreshItemDropdown();
  });
  document.getElementById('pv3_GroupSelect').addEventListener('change', refreshItemDropdown);
  document.getElementById('pv3_CatCheck').addEventListener('change', function () {
    const sel = document.getElementById('pv3_CatSelect');
    sel.disabled = !this.checked; sel.style.display = this.checked ? '' : 'none';
    if (!this.checked) sel.value = '';
    refreshItemDropdown();
  });
  document.getElementById('pv3_CatSelect').addEventListener('change', refreshItemDropdown);
  refreshItemDropdown();

  async function onItemOrWarehouseChange() {
    const itemId = val('pv3_ItemID');
    const warehouseId = val('pv3_WarehouseID');
    const item = window.__pv3ItemMap[itemId];
    document.getElementById('pv3_Unit').value = item ? ((window.__pv3UnitMap[item.UOMID]||{}).UOMName || '') : '';
    window.__pv3LastStockRate = item ? (Number(item.StandardCost)||0).toFixed(2) : '';
    if (item && warehouseId) {
      const { data } = await supabaseClient.from('current_stock').select('QtyOnHand').eq('ItemID', itemId).eq('WarehouseID', warehouseId).maybeSingle();
      const unitName = (window.__pv3UnitMap[item.UOMID] || {}).UOMName || '';
      window.__pv3LastStockQty = data ? ((Number(data.QtyOnHand)||0) + ' ' + unitName) : t('কোনো স্টক নেই','No stock');
    } else {
      window.__pv3LastStockQty = '';
    }
    document.getElementById('pv3_PreviewStockQty').value = window.__pv3LastStockQty;
    document.getElementById('pv3_PreviewStockRate').value = window.__pv3LastStockRate;
    document.getElementById('pv3_PreviewStdPurchaseRate').value = item ? (Number(item.StandardCost)||0).toFixed(2) : '';
    recalcAmount();
    renderRightSummary();
  }
  document.getElementById('pv3_ItemID').addEventListener('change', onItemOrWarehouseChange);
  document.getElementById('pv3_WarehouseID').addEventListener('change', onItemOrWarehouseChange);

  function recalcAmount() {
    const qty = Number(val('pv3_Qty')) || 0;
    const rate = Number(val('pv3_Rate')) || 0;
    const amount = Math.round(qty * rate);
    document.getElementById('pv3_Amount').value = amount;
    if (document.getElementById('pv3_CommCheck').checked) {
      const commRate = Number(val('pv3_CommRate')) || 0;
      const commAmount = amount * commRate / 100;
      document.getElementById('pv3_CommAmount').value = commAmount.toFixed(2);
      document.getElementById('pv3_NetLineAmount').value = (amount - commAmount).toFixed(2);
    }
  }
  document.getElementById('pv3_Qty').addEventListener('input', recalcAmount);
  document.getElementById('pv3_Rate').addEventListener('input', recalcAmount);
  document.getElementById('pv3_CommRate').addEventListener('input', recalcAmount);
  document.getElementById('pv3_CommCheck').addEventListener('change', function () {
    document.getElementById('pv3_CommRate').disabled = !this.checked;
    document.getElementById('pv3_CommResultRow').style.display = this.checked ? '' : 'none';
    if (!this.checked) { document.getElementById('pv3_CommRate').value = ''; document.getElementById('pv3_CommAmount').value = ''; document.getElementById('pv3_NetLineAmount').value = ''; }
    recalcAmount();
  });

  function resetLineEntry() {
    document.getElementById('pv3_GroupCheck').checked = false;
    const groupSel = document.getElementById('pv3_GroupSelect'); groupSel.disabled = true; groupSel.style.display = 'none'; groupSel.value = '';
    document.getElementById('pv3_CatCheck').checked = false;
    const catSel = document.getElementById('pv3_CatSelect'); catSel.disabled = true; catSel.style.display = 'none'; catSel.value = '';
    refreshItemDropdown();
    document.getElementById('pv3_ItemID').value = '';
    document.getElementById('pv3_WarehouseID').value = '';
    document.getElementById('pv3_Qty').value = '';
    document.getElementById('pv3_Rate').value = '';
    document.getElementById('pv3_Unit').value = '';
    document.getElementById('pv3_Amount').value = '';
    document.getElementById('pv3_PreviewStdPurchaseRate').value = '';
    document.getElementById('pv3_CommCheck').checked = false;
    document.getElementById('pv3_CommRate').disabled = true;
    document.getElementById('pv3_CommResultRow').style.display = 'none';
    document.getElementById('pv3_CommRate').value = '';
    document.getElementById('pv3_CommAmount').value = '';
    document.getElementById('pv3_NetLineAmount').value = '';
  }

  function collectCurrentLine() {
    const itemId = val('pv3_ItemID');
    const warehouseId = val('pv3_WarehouseID');
    const qty = Number(val('pv3_Qty')) || 0;
    const rate = Number(val('pv3_Rate')) || 0;
    if (!itemId) { showToast(t('আইটেম বাছাই করুন।','Select an item.'), 'error'); return null; }
    if (!warehouseId) { showToast(t('গুদাম বাছাই করুন।','Select a warehouse.'), 'error'); return null; }
    if (!(qty > 0 && rate > 0)) { showToast(t('পরিমাণ ও দর দিন।','Enter quantity and rate.'), 'error'); return null; }
    const amount = Math.round(qty * rate);
    const useComm = document.getElementById('pv3_CommCheck').checked;
    const commRate = useComm ? (Number(val('pv3_CommRate')) || 0) : 0;
    const commAmount = useComm ? Number((amount * commRate / 100).toFixed(2)) : 0;
    return { itemId: itemId, warehouseId: warehouseId, qty: qty, rate: rate, amount: amount, commRate: commRate, commAmount: commAmount, netAmount: useComm ? Number((amount - commAmount).toFixed(2)) : amount };
  }

  document.getElementById('pv3_ConfirmPurchaseCheck').addEventListener('change', function () {
    if (!this.checked) return;
    const line = collectCurrentLine();
    if (!line) { this.checked = false; return; }
    window.__pv3PurchaseLines.push(line);
    resetLineEntry();
    this.checked = false;
    renderRightSummary();
    showToast(t('ক্রয় লাইন যোগ হয়েছে ✅','Purchase line added ✅'), 'success');
  });
  document.getElementById('pv3_AddReturnLineBtn').addEventListener('click', function () {
    const line = collectCurrentLine();
    if (!line) return;
    window.__pv3ReturnLines.push(line);
    resetLineEntry();
    renderRightSummary();
    showToast(t('ক্রয় ফেরত লাইন যোগ হয়েছে ✅','Purchase return line added ✅'), 'success');
  });

  window.__pv3RemovePurchaseLine = function (i) { window.__pv3PurchaseLines.splice(i, 1); renderRightSummary(); renderFullPreview(); };
  window.__pv3RemoveReturnLine = function (i) { window.__pv3ReturnLines.splice(i, 1); renderRightSummary(); renderFullPreview(); };

  function kgPcsTotals(lines) {
    let kg = 0, pcs = 0;
    lines.forEach(function (l) {
      const item = window.__pv3ItemMap[l.itemId] || {};
      const unitName = (window.__pv3UnitMap[item.UOMID] || {}).UOMName || '';
      if (unitName.indexOf('কেজি') !== -1 || unitName.toLowerCase().indexOf('kg') !== -1) kg += l.qty;
      else if (unitName.indexOf('পিস') !== -1 || unitName.toLowerCase().indexOf('pc') !== -1) pcs += l.qty;
    });
    return { kg: kg, pcs: pcs };
  }

  function renderRightSummary() {
    document.getElementById('pv3_PreviewStockQty').value = window.__pv3LastStockQty;
    document.getElementById('pv3_PreviewStockRate').value = window.__pv3LastStockRate;
  }

  function miniLinesTable(lines, removeFnName, showComm) {
    if (lines.length === 0) return `<div style="color:var(--text-muted);padding:8px 0;">${t('কোনো লাইন নেই।','No lines.')}</div>`;
    const rows = lines.map(function (l, i) {
      const item = window.__pv3ItemMap[l.itemId] || {};
      return `<tr>
        <td>${i + 1}</td><td>${escapeHtml(item.ItemName || l.itemId)}</td>
        <td style="text-align:right;">${l.qty}</td><td style="text-align:right;">${l.rate}</td><td style="text-align:right;"><b>${l.amount}</b></td>
        ${showComm ? `<td style="text-align:right;">${l.commRate || 0}</td><td style="text-align:right;">${(l.commAmount||0).toFixed ? l.commAmount.toFixed(2) : l.commAmount}</td><td style="text-align:right;"><b>${(l.netAmount!==undefined?l.netAmount:l.amount).toFixed ? l.netAmount.toFixed(2) : l.netAmount}</b></td>` : ''}
        <td><button type="button" onclick="${removeFnName}(${i})" style="border:none;background:none;cursor:pointer;color:var(--danger);">✕</button></td>
      </tr>`;
    }).join('');
    return `<table style="width:100%;border-collapse:collapse;font-size:12px;">
      <thead><tr style="border-bottom:1px solid var(--border);"><th style="text-align:left;">${t('ক্রঃ','No.')}</th><th style="text-align:left;">${t('আইটেম','Item')}</th><th style="text-align:right;">${t('পরিমাণ','Qty')}</th><th style="text-align:right;">${t('দর','Rate')}</th><th style="text-align:right;">${t('মূল্য','Amt')}</th>${showComm ? `<th style="text-align:right;">${t('কমিঃ','Comm.')}</th><th style="text-align:right;">${t('(-)কমিঃ','(-)Comm.')}</th><th style="text-align:right;">${t('নিট মূল্য','Net Amt')}</th>` : ''}<th></th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }

  async function buildDraftPrintHtml() {
    const supplierId = val('pv3_SupplierID');
    const isCash = supplierId === 'SUP-CASH';
    const supplierRec = window.__pv3SupplierMap[supplierId];
    const supplierName = isCash ? ('নগদ' + (val('pv3_CashName') ? ' (' + val('pv3_CashName') + ')' : '')) : (supplierRec ? (supplierRec.CompanyName || supplierRec.Name) : '—');
    const company = await api('getSingleton', { sheet:'CompanyProfile' });
    const purchaseTotal = window.__pv3PurchaseLines.reduce(function (s, l) { return s + (Number(l.amount) || 0); }, 0);
    const returnTotal = window.__pv3ReturnLines.reduce(function (s, l) { return s + (Number(l.amount) || 0); }, 0);
    const cashExpenseAmt = (window.__pv3CashExpense && window.__pv3CashExpense.amount) || 0;

    function linesTableHtml(lines) {
      const hasComm = lines.some(function (l) { return (l.commAmount || 0) > 0; });
      const rows = lines.map(function (l) {
        const item = window.__pv3ItemMap[l.itemId] || {};
        const net = l.netAmount !== undefined ? l.netAmount : l.amount;
        return `<tr><td>${escapeHtml(item.ItemName || l.itemId)}</td><td>${l.qty}</td><td>${l.rate}</td><td>${l.amount}</td>${hasComm ? `<td>${l.commRate || 0}%</td><td>${(l.commAmount||0).toFixed(2)}</td><td><b>${net.toFixed ? net.toFixed(2) : net}</b></td>` : ''}</tr>`;
      }).join('');
      return `<table><thead><tr><th>আইটেম</th><th>পরিমাণ</th><th>দর</th><th>মূল্য</th>${hasComm ? '<th>কমিঃ</th><th>(-)কমিঃ</th><th>নিট মূল্য</th>' : ''}</tr></thead><tbody>${rows}</tbody></table>`;
    }

    return `<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ক্রয় ভাউচার (খসড়া প্রিভিউ)</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Anek Bangla',sans-serif;color:#1b1f27;max-width:800px;margin:20px auto;padding:0 20px;}
  h1{font-family:'Oswald',sans-serif;font-size:20px;text-align:center;margin:0 0 4px;}
  .sub{text-align:center;color:#888;font-size:12px;margin-bottom:16px;}
  table{width:100%;border-collapse:collapse;margin:8px 0;}
  th,td{border:1px solid #ccc;padding:6px 8px;font-size:12.5px;text-align:center;}
  th{background:#1a2029;color:#f2a33c;}
  .totalline{text-align:right;font-weight:700;margin:6px 0;}
  .sign-row{display:flex;justify-content:space-between;margin-top:60px;text-align:center;font-size:12px;}
  .sign-row div{width:31%;border-top:1px solid #333;padding-top:6px;}
  @page { size: A5; margin: 10mm; }
</style></head><body>
  <h1>${escapeHtml(company.CompanyName || 'জি মেটাল ওয়ার্কস')}</h1>
  <div class="sub">ক্রয় ভাউচার (খসড়া — এখনো সেভ হয়নি) — তারিখ: ${escapeHtml(formatShortDate(val('pv3_Date')))} — সাপ্লায়ার: ${escapeHtml(supplierName)}</div>
  ${window.__pv3PurchaseLines.length > 0 ? `<h3>ক্রয়কৃত পণ্য</h3>${linesTableHtml(window.__pv3PurchaseLines)}<div class="totalline">মোট ক্রয়: ৳ ${purchaseTotal.toFixed(2)}</div>${cashExpenseAmt > 0 ? `<div class="totalline">নগদ খরচ যোগঃ ৳ ${cashExpenseAmt.toFixed(2)}</div>` : ''}` : ''}
  ${window.__pv3ReturnLines.length > 0 ? `<h3>ক্রয় ফেরত পণ্য</h3>${linesTableHtml(window.__pv3ReturnLines)}<div class="totalline">মোট ক্রয় ফেরত: ৳ ${returnTotal.toFixed(2)}</div>` : ''}
  <div class="totalline" style="font-size:15px;border-top:2px solid #1a2029;padding-top:8px;">নিট মোট: ৳ ${(purchaseTotal + cashExpenseAmt - returnTotal).toFixed(2)}</div>
  <div class="sign-row"><div>বিক্রেতার স্বাঃ</div><div>অথরাইজেশন স্বাঃ<br>${escapeHtml(currentUser ? currentUser.FullName : '')}</div><div>ক্রয়কারী স্বাঃ<br>${escapeHtml(currentUser ? currentUser.FullName : '')}</div></div>
</body></html>`;
  }

  async function renderFullPreview() {
    const wrap = document.getElementById('pv3_LivePreviewBody');
    if (!wrap) return;
    if (window.__pv3PurchaseLines.length === 0 && window.__pv3ReturnLines.length === 0) {
      wrap.innerHTML = `<div class="empty-state">${t('অন্তত একটা লাইন যোগ করলে প্রিভিউ দেখা যাবে।','Add at least one line to see the preview.')}</div>`;
      return;
    }
    const html = await buildDraftPrintHtml();
    wrap.innerHTML = `<iframe id="pv3_PreviewFrame" style="width:100%;height:70vh;border:1px solid var(--border);border-radius:8px;background:#fff;" srcdoc="${attr(html)}"></iframe>`;
  }

  function printDraftFrame() {
    const frame = document.getElementById('pv3_PreviewFrame');
    if (!frame || !frame.contentWindow) { showToast(t('প্রিন্ট করার জন্য অন্তত একটা লাইন যোগ করুন।','Add at least one line to print.'), 'error'); return; }
    frame.contentWindow.focus();
    frame.contentWindow.print();
  }
  async function shareDraft() {
    if (window.__pv3PurchaseLines.length === 0 && window.__pv3ReturnLines.length === 0) {
      showToast(t('শেয়ার করার জন্য অন্তত একটা লাইন যোগ করুন।','Add at least one line to share.'), 'error');
      return;
    }
    const purchaseTotal = window.__pv3PurchaseLines.reduce(function (s, l) { return s + (Number(l.amount) || 0); }, 0);
    const returnTotal = window.__pv3ReturnLines.reduce(function (s, l) { return s + (Number(l.amount) || 0); }, 0);
    const cashExpenseAmt = (window.__pv3CashExpense && window.__pv3CashExpense.amount) || 0;
    const text = 'ক্রয় ভাউচার — নিট মোট: ৳ ' + (purchaseTotal + cashExpenseAmt - returnTotal).toFixed(2);
    if (navigator.share) {
      try { await navigator.share({ title: 'ক্রয় ভাউচার', text: text }); } catch (e) {}
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(text);
      showToast(t('তথ্য ক্লিপবোর্ডে কপি হয়েছে।','Copied to clipboard.'), 'success');
    }
  }
  document.getElementById('pv3_LivePageSetupBtn').addEventListener('click', printDraftFrame);
  document.getElementById('pv3_LivePrintBtn').addEventListener('click', printDraftFrame);
  document.getElementById('pv3_LiveShareBtn').addEventListener('click', shareDraft);

  renderRightSummary();
  showTab('entry');
}

    const slpMap = {}; users.forEach(function (u) { slpMap[u.UserID] = u.FullName; });

    const merged = invoices.filter(function (r) { return r.Status !== 'Deleted'; }).map(function (r) {
      return { type:'SalesInvoice', typeLabel:['বিক্রয় ভাউচার','Sales Voucher'], id:r.SIID, date:r.InvoiceDate, customerId:r.CustomerID, walkInName:r.WalkInPartyName, salespersonId:r.SalespersonID, amount:r.TotalAmount, status:r.Status };
    }).concat(returns.filter(function (r) { return r.Status !== 'Deleted'; }).map(function (r) {
      return { type:'SalesReturn', typeLabel:['বিক্রয় ফেরত ভাউচার','Sales Return Voucher'], id:r.SRID, date:r.Date, customerId:r.CustomerID, salespersonId:r.SalespersonID, amount:null, status:r.Status };
    }));
    merged.sort(function (a, b) { return String(a.date||'').localeCompare(String(b.date||'')); });

    const wrap = document.getElementById('svTableWrap');
    if (!wrap) return;
    if (merged.length === 0) {
      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এখনো কোনো ভাউচার তৈরি হয়নি।" data-en="No vouchers created yet.">${t('এখনো কোনো ভাউচার তৈরি হয়নি।','No vouchers created yet.')}</div>`;
      return;
    }

    const headers = [['টাইপ','Type'],['ভাউচার নম্বর','Voucher No'],['তারিখ','Date'],['গ্রাহক','Customer'],['বিক্রয়কারী','Salesperson'],['মূল্য','Amount'],['অবস্থা','Status']];
    const headCells = headers.map(function (h) { return `<th class="i18n" data-bn="${h[0]}" data-en="${h[1]}">${t(h[0], h[1])}</th>`; }).join('');
    const bodyRows = merged.slice().reverse().map(function (r) {

      const postBtn = !isPosted
        ? `<button class="btn" style="width:auto;padding:6px 12px;font-size:12px;" onclick='postSalesVoucherRecord(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})'>${t('পোস্ট করুন','Post')}</button>`
        : '';
      const previewBtn = `<button onclick='openPrintableVoucherView(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('প্রিভিউ/প্রিন্ট/শেয়ার','Preview/Print/Share')}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        </button>`;
      const editBtn = !isPosted
        ? `<button onclick='openSalesVoucherForm(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('সম্পাদনা','Edit')}">

        : (currentUser && currentUser.RoleID === 'ROLE-ADMIN'
            ? `<button onclick='deletePostedSalesVoucher(${JSON.stringify(r.type)}, ${JSON.stringify(r.id)})' title="${t('এডমিন ডিলিট (পাসওয়ার্ড লাগবে)','Admin delete (password required)')}" style="color:var(--danger);">

        <td>${t(r.typeLabel[0], r.typeLabel[1])}</td><td>${escapeHtml(r.id)}</td><td>${escapeHtml(r.date)}</td>
        <td>${escapeHtml(r.customerId === 'CUS-CASH' && r.walkInName ? ('নগদ (' + r.walkInName + ')') : (custMap[r.customerId] || r.customerId))}</td><td>${escapeHtml(slpMap[r.salespersonId] || '—')}</td>
        <td>${r.amount !== null ? Number(r.amount).toFixed(2) : '—'}</td>
        <td>${isPosted ? `<span class="badge active">${t('পোস্ট করা','Posted')}</span>` : `<span class="badge draft">${t('খসড়া','Draft')}</span>`}</td>

      </tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}<th></th></tr></thead><tbody>${bodyRows}</tbody></table>`;
  }

  await loadList();
  window.__refreshSalesVoucherList = loadList;
  document.getElementById('svAddBtn').addEventListener('click', function () { openSalesVoucherForm(defaultType, null); });
}

async function postSalesVoucherRecord(docType, docId) {
  if (!confirm(t('আপনি কি নিশ্চিত এই ভাউচার পোস্ট করতে চান? পোস্ট হয়ে গেলে স্টক/লেজারে এন্ট্রি পড়বে এবং এটা আর বাতিল করা যাবে না।','Are you sure you want to post this voucher? Once posted, stock/ledger entries will be created and this cannot be undone.'))) return;
  try {
    await api('postDocument', { docType: docType, docId: docId });
    showToast(t('পোস্ট হয়েছে ✅','Posted ✅'), 'success');
    if (window.__refreshSalesVoucherList) await window.__refreshSalesVoucherList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function deleteSalesVoucherRecord(docType, docId) {
  if (!confirm(t('আপনি কি নিশ্চিত এই ভাউচার ডিলিট করতে চান?','Are you sure you want to delete this voucher?'))) return;
  const config = docType === 'SalesReturn'
    ? { sheet:'SalesReturn', idField:'SRID' }
    : { sheet:'SalesInvoice', idField:'SIID' };
  try {
    await api('delete', { sheet: config.sheet, idField: config.idField, idValue: docId });
    showToast(t('ডিলিট হয়েছে ✅','Deleted ✅'), 'success');
    if (window.__refreshSalesVoucherList) await window.__refreshSalesVoucherList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function deletePostedSalesVoucher(docType, docId) {
  const config = docType === 'SalesReturn'
    ? { sheet:'SalesReturn', idField:'SRID', linesSheet:'SR_Lines', lineIdField:'SRID' }
    : { sheet:'SalesInvoice', idField:'SIID', linesSheet:'SI_Lines', lineIdField:'SIID' };
  await deletePostedVoucherWithAdminAuth(docType, docId, config.sheet, config.idField, config.linesSheet, config.lineIdField, window.__refreshSalesVoucherList);
}

  openModal({
    title: (isEdit ? t('সম্পাদনা — ','Edit — ') : t('নতুন — ','New — ')) + t('বিক্রয় ভাউচার','Sales Voucher'),
    bodyHtml: bodyHtml,
    wide: true,
    onSave: async function () {
      const customerId = val('sv3_CustomerID');
      if (!customerId) throw new Error(t('গ্রাহক তথ্য আবশ্যক।','Customer information is required.'));

      const hasSale = window.__sv3SaleLines.length > 0;
      const hasReturn = window.__sv3ReturnLines.length > 0;
      if (!hasSale && !hasReturn) throw new Error(t('অন্তত একটা বিক্রয় বা ফেরত লাইন যোগ করুন।','Add at least one sale or return line.'));

      const isCash = customerId === 'CUS-CASH';
      const common = {
        CustomerID: customerId,
        SalespersonID: currentUser ? currentUser.UserID : null
      };

      if (hasSale) {
        const warehouseId = window.__sv3SaleLines[0].warehouseId;
        if (!warehouseId) throw new Error(t('বিক্রয় লাইনে গুদাম আবশ্যক।','Warehouse is required for sale lines.'));
        const lineData = window.__sv3SaleLines.map(function (l) { return { ItemID: l.itemId, Quantity: l.qty, Rate: l.rate, Amount: l.amount, CommissionRate: l.commRate || 0, CommissionAmount: l.commAmount || 0, NetAmount: l.netAmount !== undefined ? l.netAmount : l.amount }; });
        const itemsTotal = lineData.reduce(function (s, l) { return s + (Number(l.Amount) || 0); }, 0);
        const cashExpenseAmount = (window.__sv3CashExpense && window.__sv3CashExpense.amount) || 0;
        const totalAmount = itemsTotal + cashExpenseAmount;
        const cashExpenseBreakdown = Object.keys((window.__sv3CashExpense && window.__sv3CashExpense.subAmounts) || {})
          .map(function (catId) { const cat = window.__sv3ExpenseCategories.find(function (c) { return c.ExpCatID === catId; }); const amt = window.__sv3CashExpense.subAmounts[catId]; return (cat && amt > 0) ? (cat.ExpCatName + ': ৳' + amt) : null; })
          .filter(Boolean).join(', ');
        const headerData = Object.assign({}, common, {
          InvoiceDate: val('sv3_Date'), WarehouseID: warehouseId, TotalAmount: totalAmount,
          CashExpenseAmount: cashExpenseAmount || null,
          CashExpenseCategory: null,
          CashExpenseNote: cashExpenseBreakdown || null,
          ManualVoucherDate: document.getElementById('sv3_ManualDateCheck').checked ? (val('sv3_ManualVoucherDate') || null) : null,
          ManualVoucherNo: document.getElementById('sv3_ManualNoCheck').checked ? (val('sv3_ManualVoucherNo') || null) : null,
          WalkInPartyName: isCash ? (val('sv3_CashName') || null) : null,
          WalkInPartyAddress: isCash ? (val('sv3_CashAddress') || null) : null,
          WalkInPartyMobile: isCash ? (val('sv3_CashMobile') || null) : null
        });
        if (!isCash) {
          headerData.CashReceivedAmount = Number(val('sv3_CashReceivedAmount')) || 0;
          headerData.CashReceivedNote = val('sv3_CashReceivedNote') || null;
          headerData.BankReceivedAmount = Number(val('sv3_BankReceivedAmount')) || 0;
          if (headerData.BankReceivedAmount > 0 && !sv3BankPopupFilled) {
            throw new Error(t('ব্যাংকে গ্রহণের বিবরণ (পপআপে) পূরণ করুন।','Fill in the bank receipt details (in the popup).'));
          }
          headerData.BankReceivedNote = val('sv3_BankReceivedNote') || null;
          headerData.BankAccIDForReceipt = headerData.BankReceivedAmount > 0 ? (val('sv3_BankAccID') || null) : null;
        }

        if (isEdit && existingDocType === 'SalesInvoice') {
          await api('updateDocument', { headerSheet:'SalesInvoice', idField:'SIID', linesSheet:'SI_Lines', lineIdField:'SIID', idValue: existingId, headerData: headerData, lines: lineData });
        } else {
          await api('createDocument', { headerSheet:'SalesInvoice', idField:'SIID', idPrefix:'SI', requiredFields:['CustomerID','WarehouseID'], linesSheet:'SI_Lines', lineIdField:'SIID', headerData: headerData, lines: lineData });
        }
      }

      if (hasReturn) {
        const warehouseId = window.__sv3ReturnLines[0].warehouseId;
        if (!warehouseId) throw new Error(t('ফেরত লাইনে গুদাম আবশ্যক।','Warehouse is required for return lines.'));
        const lineData = window.__sv3ReturnLines.map(function (l) { return { ItemID: l.itemId, Quantity: l.qty, Rate: l.rate, CommissionRate: l.commRate || 0, CommissionAmount: l.commAmount || 0, NetAmount: l.netAmount !== undefined ? l.netAmount : l.amount }; });
        const headerData = Object.assign({}, common, { Date: val('sv3_Date'), WarehouseID: warehouseId });
        if (isEdit && existingDocType === 'SalesReturn') {
          await api('updateDocument', { headerSheet:'SalesReturn', idField:'SRID', linesSheet:'SR_Lines', lineIdField:'SRID', idValue: existingId, headerData: headerData, lines: lineData });
        } else {
          await api('createDocument', { headerSheet:'SalesReturn', idField:'SRID', idPrefix:'SR', requiredFields:['CustomerID','WarehouseID'], linesSheet:'SR_Lines', lineIdField:'SRID', headerData: headerData, lines: lineData });
        }
      }

      showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
      if (window.__refreshSalesVoucherList) await window.__refreshSalesVoucherList();
    }
  });

  function showTab(tab) {
    const entryBtn = document.getElementById('sv3_TabEntryBtn'), previewBtn = document.getElementById('sv3_TabPreviewBtn');
    const entryPanel = document.getElementById('sv3_TabEntryPanel'), previewPanel = document.getElementById('sv3_TabPreviewPanel');
    if (tab === 'entry') {
      entryPanel.style.display = ''; previewPanel.style.display = 'none';
      entryBtn.style.borderBottomColor = 'var(--amber)'; entryBtn.style.color = 'var(--text)';
      previewBtn.style.borderBottomColor = 'transparent'; previewBtn.style.color = 'var(--text-muted)';
    } else {
      entryPanel.style.display = 'none'; previewPanel.style.display = '';
      previewBtn.style.borderBottomColor = 'var(--amber)'; previewBtn.style.color = 'var(--text)';
      entryBtn.style.borderBottomColor = 'transparent'; entryBtn.style.color = 'var(--text-muted)';
      renderFullPreview();
    }
  }

  function wireRevealCheckbox(checkId, fieldId) {
    const check = document.getElementById(checkId), field = document.getElementById(fieldId);
    function sync() {
      field.disabled = !check.checked;
      field.style.display = check.checked ? '' : 'none';
      if (!check.checked) field.value = '';
    }
    check.addEventListener('change', sync);
    sync();
  }
  wireRevealCheckbox('sv3_ManualDateCheck', 'sv3_ManualVoucherDate');
  wireRevealCheckbox('sv3_ManualNoCheck', 'sv3_ManualVoucherNo');
  wireRevealCheckbox('sv3_StdSalesCheck', 'sv3_PreviewStdSalesRate');
  wireSequentialKeyNav(document.getElementById('sv3_TabEntryPanel'));

  function refreshSv3CustomerOptions() {
    const zoneChecked = document.getElementById('sv3_ZoneCheck').checked;
    const zone = zoneChecked ? val('sv3_ZoneFilter') : '';
    const sel = document.getElementById('sv3_CustomerID');
    Array.from(sel.options).forEach(function (opt) {
      if (!opt.value) return;
      opt.hidden = !!(zone && opt.getAttribute('data-zone') !== zone);
    });
    if (zone && sel.options[sel.selectedIndex] && sel.options[sel.selectedIndex].hidden) { sel.value = ''; sel.dispatchEvent(new Event('change')); }
  }
  document.getElementById('sv3_ZoneCheck').addEventListener('change', function () {
    document.getElementById('sv3_ZoneFilter').disabled = !this.checked;
    refreshSv3CustomerOptions();
  });
  document.getElementById('sv3_ZoneFilter').addEventListener('change', refreshSv3CustomerOptions);

  // "খরচ(+)ঃ" — চেকবক্স টিক না থাকলেও এই ঘরে সরাসরি একটামাত্র (লাম্প-সাম) পরিমাণ
  // লেখা যাবে; টিক দিলে নিচে খাত-ভিত্তিক ভাঙন দেখা যাবে এবং প্রতিটা খাতের
  // পরিমাণ যোগ হয়ে এই উপরের ঘরেই স্বয়ংক্রিয়ভাবে বসে যাবে
  function sv3RecalcExpenseTotal() {
    if (!document.getElementById('sv3_ExpCheck').checked) return; // ম্যানুয়াল মোডে থাকলে হাত দেওয়া হবে না
    const rows = document.querySelectorAll('#sv3_ExpSubWrap [data-exp-amount]');
    let sum = 0;
    rows.forEach(function (inp) { sum += Number(inp.value) || 0; });
    document.getElementById('sv3_ExpTotalAmount').value = sum || '';
  }

  function sv3RenderExpSubRows() {
    const wrap = document.getElementById('sv3_ExpSubWrap');
    const amounts = window.__sv3CashExpense.subAmounts || {};
    wrap.innerHTML = `
      <div style="border:1px solid var(--border);border-radius:8px;padding:10px;">
        <div id="sv3_ExpSubRows"></div>
        <button type="button" id="sv3_ExpAddCatBtn" class="btn btn-outline" style="width:100%;margin-top:6px;padding:6px;font-size:12px;">➕ ${t('নতুন সাবখাত','New Sub-category')}</button>
      </div>`;
    const rowsWrap = document.getElementById('sv3_ExpSubRows');
    function renderRows() {
      rowsWrap.innerHTML = window.__sv3ExpenseCategories.map(function (c) {
        const amt = amounts[c.ExpCatID] || '';
        return `<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;" data-cat-id="${attr(c.ExpCatID)}">
          <input data-exp-name value="${attr(c.ExpCatName)}" style="flex:1.4;">
          <input data-exp-amount type="number" step="any" value="${amt}" placeholder="৳" style="flex:1;">
          <button type="button" data-exp-save class="btn btn-outline" style="width:auto;padding:5px 8px;" title="${t('নাম সেভ করুন','Save name')}">💾</button>
          <button type="button" data-exp-del class="btn btn-outline" style="width:auto;padding:5px 8px;" title="${t('মুছুন','Delete')}">🗑️</button>
        </div>`;
      }).join('') || `<div style="color:var(--text-muted);font-size:12px;padding:4px 0;">${t('কোনো সাবখাত নেই — নিচে থেকে যোগ করুন।','No sub-categories yet — add one below.')}</div>`;

      rowsWrap.querySelectorAll('[data-exp-amount]').forEach(function (inp) {
        inp.addEventListener('input', function () {
          const catId = this.closest('[data-cat-id]').getAttribute('data-cat-id');
          window.__sv3CashExpense.subAmounts[catId] = Number(this.value) || 0;
          sv3RecalcExpenseTotal();
        });
      });
      rowsWrap.querySelectorAll('[data-exp-save]').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          const row = this.closest('[data-cat-id]');
          const catId = row.getAttribute('data-cat-id');
          const nameInput = row.querySelector('[data-exp-name]');
          const newName = nameInput.value.trim();
          if (!newName) { showToast(t('খাতের নাম দিন।','Enter a category name.'), 'error'); return; }
          try {
            await api('update', { sheet:'ExpenseCategories', idField:'ExpCatID', idValue: catId, data:{ ExpCatName: newName } });
            const cat = window.__sv3ExpenseCategories.find(function (c) { return c.ExpCatID === catId; });
            if (cat) cat.ExpCatName = newName;
            showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
          } catch (err) { showToast(err.message, 'error'); }
        });
      });
      rowsWrap.querySelectorAll('[data-exp-del]').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          const row = this.closest('[data-cat-id]');
          const catId = row.getAttribute('data-cat-id');
          if (!confirm(t('এই সাবখাতটা মুছে ফেলতে চান?','Delete this sub-category?'))) return;
          try {
            await api('delete', { sheet:'ExpenseCategories', idField:'ExpCatID', idValue: catId });
            window.__sv3ExpenseCategories = window.__sv3ExpenseCategories.filter(function (c) { return c.ExpCatID !== catId; });
            delete window.__sv3CashExpense.subAmounts[catId];
            renderRows();
            sv3RecalcExpenseTotal();
            showToast(t('মুছে ফেলা হয়েছে ✅','Deleted ✅'), 'success');
          } catch (err) { showToast(err.message, 'error'); }
        });
      });
    }
    renderRows();

    document.getElementById('sv3_ExpAddCatBtn').addEventListener('click', async function () {
      const name = prompt(t('নতুন সাবখাতের নাম লিখুন:','Enter new sub-category name:'));
      if (!name || !name.trim()) return;
      try {
        const rec2 = await api('create', { sheet:'ExpenseCategories', idField:'ExpCatID', idPrefix:'EXPCAT', requiredFields:['ExpCatName'], data:{ ExpCatName: name.trim() } });
        window.__sv3ExpenseCategories.push(rec2);
        renderRows();
        showToast(t('সাবখাত যোগ হয়েছে ✅','Sub-category added ✅'), 'success');
      } catch (err) { showToast(err.message, 'error'); }
    });
  }

  document.getElementById('sv3_ExpCheck').addEventListener('change', function () {
    const wrap = document.getElementById('sv3_ExpSubWrap');
    wrap.style.display = this.checked ? '' : 'none';
    if (this.checked) {
      if (!window.__sv3CashExpense.subAmounts) window.__sv3CashExpense.subAmounts = {};

  async function toggleCashCustomer() {
    const customerId = val('sv3_CustomerID');
    const isCash = customerId === 'CUS-CASH';
    document.getElementById('sv3_CashCustomerCard').style.display = isCash ? '' : 'none';
    renderRightSummary();

      document.getElementById('sv3_PopCustBankFields').style.display = this.checked ? '' : 'none';
    });

    function focusableFields() {
      return Array.from(overlay.querySelectorAll('[data-order]')).filter(function (el) { return el.offsetParent !== null; });
    }
    function keyNavHandler(e) {
      if (e.key !== 'Enter' && e.key !== 'Escape') return;
      if (!overlay.contains(document.activeElement)) return;
      const fields = focusableFields();
      const curIdx = fields.indexOf(document.activeElement);
      if (curIdx === -1) return;
      e.preventDefault();
      e.stopPropagation();
      if (e.key === 'Enter') {
        const next = fields[curIdx + 1];
        if (next) { next.focus(); } else { document.getElementById('sv3_PopConfirm').click(); }
      } else {
        const prev = fields[curIdx - 1];
        if (prev) prev.focus(); else document.getElementById('sv3_PopCancel').click();
      }
    }
    document.addEventListener('keydown', keyNavHandler, true);
    function closePopup() {
      document.removeEventListener('keydown', keyNavHandler, true);
      overlay.remove();
    }

    document.getElementById('sv3_PopCancel').addEventListener('click', function () {
      document.getElementById('sv3_RecAmount').value = '';
      document.getElementById('sv3_BankReceivedAmount').value = '';
      sv3BankPopupFilled = false;
      updateBankRecSummary();
      closePopup();
    });
    document.getElementById('sv3_PopConfirm').addEventListener('click', function () {
      const ourBank = val('sv3_PopBankAcc');
      const note = document.getElementById('sv3_PopNote').value.trim();
      if (!ourBank) { showToast(t('আমাদের ব্যাংক বাছাই করুন।','Select our bank.'), 'error'); return; }
      if (!note) { showToast(t('বিবরণ/নোট লিখুন।','Enter a note.'), 'error'); return; }
      document.getElementById('sv3_BankAccID').value = ourBank;
      document.getElementById('sv3_BankReceivedNote').value = note;
      sv3BankPopupFilled = true;
      updateBankRecSummary();
      closePopup();
    });
    setTimeout(function () { document.getElementById('sv3_PopBankAcc').focus(); }, 0);
  }

  function toggleRecType() {
    const isCash = val('sv3_RecTypeSelect') === 'Cash';
    document.getElementById('sv3_CashReceivedNote').style.display = isCash ? '' : 'none';
    document.getElementById('sv3_BankRecSummary').style.display = isCash ? 'none' : '';
    document.getElementById('sv3_RecAmount').value = isCash ? val('sv3_CashReceivedAmount') : val('sv3_BankReceivedAmount');
  }
  document.getElementById('sv3_RecTypeSelect').addEventListener('change', toggleRecType);
  toggleRecType();

  document.getElementById('sv3_RecAmount').addEventListener('change', function () {
    const isCash = val('sv3_RecTypeSelect') === 'Cash';
    if (isCash) {
      document.getElementById('sv3_CashReceivedAmount').value = this.value;
    } else {
      document.getElementById('sv3_BankReceivedAmount').value = this.value;
      if (Number(this.value) > 0 && !sv3BankPopupFilled) openBankReceiptPopup();
      if (!(Number(this.value) > 0)) { sv3BankPopupFilled = false; updateBankRecSummary(); }
    }
  });
  document.getElementById('sv3_BankRecSummary').addEventListener('click', function () {
    if (Number(val('sv3_BankReceivedAmount')) > 0) openBankReceiptPopup();
  });

  document.getElementById('sv3_CustomerID').addEventListener('change', toggleCashCustomer);
  toggleCashCustomer();

  function refreshItemDropdown() {
    const groupChecked = document.getElementById('sv3_GroupCheck').checked;
    const catChecked = document.getElementById('sv3_CatCheck').checked;
    const groupVal = val('sv3_GroupSelect'), catVal = val('sv3_CatSelect');
    let list = window.__sv3Items;
    if (groupChecked && groupVal) list = list.filter(function (i) { return i.GroupID === groupVal; });
    if (catChecked && catVal) list = list.filter(function (i) { return i.CategoryID === catVal; });
    const sel = document.getElementById('sv3_ItemID');
    const prev = sel.value;
    sel.innerHTML = '<option value="">—</option>' + list.map(function (i) { return `<option value="${attr(i.ItemID)}">${escapeHtml(i.ItemName)}</option>`; }).join('');
    if (list.some(function (i) { return i.ItemID === prev; })) sel.value = prev;
  }
  document.getElementById('sv3_GroupCheck').addEventListener('change', function () {
    const sel = document.getElementById('sv3_GroupSelect');
    sel.disabled = !this.checked; sel.style.display = this.checked ? '' : 'none';
    if (!this.checked) sel.value = '';
    refreshItemDropdown();
  });
  document.getElementById('sv3_GroupSelect').addEventListener('change', refreshItemDropdown);
  document.getElementById('sv3_CatCheck').addEventListener('change', function () {
    const sel = document.getElementById('sv3_CatSelect');
    sel.disabled = !this.checked; sel.style.display = this.checked ? '' : 'none';
    if (!this.checked) sel.value = '';
    refreshItemDropdown();
  });
  document.getElementById('sv3_CatSelect').addEventListener('change', refreshItemDropdown);
  refreshItemDropdown();

  async function onItemOrWarehouseChange() {
    const itemId = val('sv3_ItemID');
    const warehouseId = val('sv3_WarehouseID');
    const item = window.__sv3ItemMap[itemId];
    document.getElementById('sv3_Unit').value = item ? ((window.__sv3UnitMap[item.UOMID]||{}).UOMName || '') : '';
    window.__sv3LastStockRate = item ? (Number(item.StandardCost)||0).toFixed(2) : '';
    if (item && warehouseId) {
      const { data } = await supabaseClient.from('current_stock').select('QtyOnHand').eq('ItemID', itemId).eq('WarehouseID', warehouseId).maybeSingle();
      const unitName = (window.__sv3UnitMap[item.UOMID] || {}).UOMName || '';
      window.__sv3LastStockQty = data ? ((Number(data.QtyOnHand)||0) + ' ' + unitName) : t('কোনো স্টক নেই','No stock');
    } else {
      window.__sv3LastStockQty = '';
    }
    document.getElementById('sv3_PreviewStockQty').value = window.__sv3LastStockQty;
    document.getElementById('sv3_PreviewStockRate').value = window.__sv3LastStockRate;
    document.getElementById('sv3_PreviewStdSalesRate').value = item ? (Number(item.SalesPrice)||0).toFixed(2) : '';
    if (!val('sv3_Rate') && item && item.SalesPrice) document.getElementById('sv3_Rate').value = item.SalesPrice;
    recalcAmount();
    renderRightSummary();
  }
  document.getElementById('sv3_ItemID').addEventListener('change', onItemOrWarehouseChange);
  document.getElementById('sv3_WarehouseID').addEventListener('change', onItemOrWarehouseChange);

  function recalcAmount() {
    const qty = Number(val('sv3_Qty')) || 0;
    const rate = Number(val('sv3_Rate')) || 0;
    const amount = Math.round(qty * rate);
    document.getElementById('sv3_Amount').value = amount;
    if (document.getElementById('sv3_CommCheck').checked) {
      const commRate = Number(val('sv3_CommRate')) || 0;
      const commAmount = amount * commRate / 100;
      document.getElementById('sv3_CommAmount').value = commAmount.toFixed(2);
      document.getElementById('sv3_NetLineAmount').value = (amount - commAmount).toFixed(2);
    }
  }
  document.getElementById('sv3_Qty').addEventListener('input', recalcAmount);
  document.getElementById('sv3_Rate').addEventListener('input', recalcAmount);
  document.getElementById('sv3_CommRate').addEventListener('input', recalcAmount);
  document.getElementById('sv3_CommCheck').addEventListener('change', function () {
    document.getElementById('sv3_CommRate').disabled = !this.checked;
    document.getElementById('sv3_CommResultRow').style.display = this.checked ? '' : 'none';
    if (!this.checked) { document.getElementById('sv3_CommRate').value = ''; document.getElementById('sv3_CommAmount').value = ''; document.getElementById('sv3_NetLineAmount').value = ''; }
    recalcAmount();
  });

  function resetLineEntry() {
    document.getElementById('sv3_GroupCheck').checked = false;
    const groupSel = document.getElementById('sv3_GroupSelect'); groupSel.disabled = true; groupSel.style.display = 'none'; groupSel.value = '';
    document.getElementById('sv3_CatCheck').checked = false;
    const catSel = document.getElementById('sv3_CatSelect'); catSel.disabled = true; catSel.style.display = 'none'; catSel.value = '';
    refreshItemDropdown();
    document.getElementById('sv3_ItemID').value = '';
    document.getElementById('sv3_WarehouseID').value = '';
    document.getElementById('sv3_Qty').value = '';
    document.getElementById('sv3_Rate').value = '';
    document.getElementById('sv3_Unit').value = '';
    document.getElementById('sv3_Amount').value = '';
    document.getElementById('sv3_PreviewStdSalesRate').value = '';
    document.getElementById('sv3_CommCheck').checked = false;
    document.getElementById('sv3_CommRate').disabled = true;
    document.getElementById('sv3_CommResultRow').style.display = 'none';
    document.getElementById('sv3_CommRate').value = '';
    document.getElementById('sv3_CommAmount').value = '';
    document.getElementById('sv3_NetLineAmount').value = '';
  }

  function collectCurrentLine() {
    const itemId = val('sv3_ItemID');
    const warehouseId = val('sv3_WarehouseID');
    const qty = Number(val('sv3_Qty')) || 0;
    const rate = Number(val('sv3_Rate')) || 0;
    if (!itemId) { showToast(t('আইটেম বাছাই করুন।','Select an item.'), 'error'); return null; }
    if (!warehouseId) { showToast(t('গুদাম বাছাই করুন।','Select a warehouse.'), 'error'); return null; }
    if (!(qty > 0 && rate > 0)) { showToast(t('পরিমাণ ও দর দিন।','Enter quantity and rate.'), 'error'); return null; }
    const amount = Math.round(qty * rate);
    const useComm = document.getElementById('sv3_CommCheck').checked;
    const commRate = useComm ? (Number(val('sv3_CommRate')) || 0) : 0;
    const commAmount = useComm ? Number((amount * commRate / 100).toFixed(2)) : 0;
    return { itemId: itemId, warehouseId: warehouseId, qty: qty, rate: rate, amount: amount, commRate: commRate, commAmount: commAmount, netAmount: useComm ? Number((amount - commAmount).toFixed(2)) : amount };
  }

  document.getElementById('sv3_ConfirmSaleCheck').addEventListener('change', function () {
    if (!this.checked) return;
    const line = collectCurrentLine();
    if (!line) { this.checked = false; return; }
    window.__sv3SaleLines.push(line);
    resetLineEntry();
    this.checked = false;
    renderRightSummary();
    showToast(t('বিক্রয় লাইন যোগ হয়েছে ✅','Sale line added ✅'), 'success');
  });
  document.getElementById('sv3_AddReturnLineBtn').addEventListener('click', function () {
    const line = collectCurrentLine();
    if (!line) return;
    window.__sv3ReturnLines.push(line);
    resetLineEntry();
    renderRightSummary();
    showToast(t('বিক্রয় ফেরত লাইন যোগ হয়েছে ✅','Sale return line added ✅'), 'success');
  });

  window.__sv3RemoveSaleLine = function (i) { window.__sv3SaleLines.splice(i, 1); renderRightSummary(); renderFullPreview(); };
  window.__sv3RemoveReturnLine = function (i) { window.__sv3ReturnLines.splice(i, 1); renderRightSummary(); renderFullPreview(); };

  function renderRightSummary() {
    document.getElementById('sv3_PreviewStockQty').value = window.__sv3LastStockQty;
    document.getElementById('sv3_PreviewStockRate').value = window.__sv3LastStockRate;
  }

  function miniLinesTable(lines, removeFnName, showComm) {
    if (lines.length === 0) return `<div style="color:var(--text-muted);padding:8px 0;">${t('কোনো লাইন নেই।','No lines.')}</div>`;
    const rows = lines.map(function (l, i) {
      const item = window.__sv3ItemMap[l.itemId] || {};
      return `<tr>
        <td>${i + 1}</td><td>${escapeHtml(item.ItemName || l.itemId)}</td>
        <td style="text-align:right;">${l.qty}</td><td style="text-align:right;">${l.rate}</td><td style="text-align:right;"><b>${l.amount}</b></td>
        ${showComm ? `<td style="text-align:right;">${l.commRate || 0}</td><td style="text-align:right;">${(l.commAmount||0).toFixed ? l.commAmount.toFixed(2) : l.commAmount}</td><td style="text-align:right;"><b>${(l.netAmount!==undefined?l.netAmount:l.amount).toFixed ? l.netAmount.toFixed(2) : l.netAmount}</b></td>` : ''}
        <td><button type="button" onclick="${removeFnName}(${i})" style="border:none;background:none;cursor:pointer;color:var(--danger);">✕</button></td>
      </tr>`;
    }).join('');
    return `<table style="width:100%;border-collapse:collapse;font-size:12px;">
      <thead><tr style="border-bottom:1px solid var(--border);"><th style="text-align:left;">${t('ক্রঃ','No.')}</th><th style="text-align:left;">${t('আইটেম','Item')}</th><th style="text-align:right;">${t('পরিমাণ','Qty')}</th><th style="text-align:right;">${t('দর','Rate')}</th><th style="text-align:right;">${t('মূল্য','Amt')}</th>${showComm ? `<th style="text-align:right;">${t('কমিঃ','Comm.')}</th><th style="text-align:right;">${t('(-)কমিঃ','(-)Comm.')}</th><th style="text-align:right;">${t('নিট মূল্য','Net Amt')}</th>` : ''}<th></th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }

  async function buildDraftPrintHtml() {
    const customerId = val('sv3_CustomerID');
    const isCash = customerId === 'CUS-CASH';
    const custRec = window.__sv3CustomerMap[customerId];
    const custName = isCash ? ('নগদ' + (val('sv3_CashName') ? ' (' + val('sv3_CashName') + ')' : '')) : (custRec ? (custRec.CompanyName || custRec.Name) : '—');
    const company = await api('getSingleton', { sheet:'CompanyProfile' });
    const saleTotal = window.__sv3SaleLines.reduce(function (s, l) { return s + (Number(l.amount) || 0); }, 0);
    const returnTotal = window.__sv3ReturnLines.reduce(function (s, l) { return s + (Number(l.amount) || 0); }, 0);
    const cashExpenseAmt = (window.__sv3CashExpense && window.__sv3CashExpense.amount) || 0;

    function linesTableHtml(lines) {
      const hasComm = lines.some(function (l) { return (l.commAmount || 0) > 0; });
      const rows = lines.map(function (l) {
        const item = window.__sv3ItemMap[l.itemId] || {};
        const net = l.netAmount !== undefined ? l.netAmount : l.amount;
        return `<tr><td>${escapeHtml(item.ItemName || l.itemId)}</td><td>${l.qty}</td><td>${l.rate}</td><td>${l.amount}</td>${hasComm ? `<td>${l.commRate || 0}%</td><td>${(l.commAmount||0).toFixed(2)}</td><td><b>${net.toFixed ? net.toFixed(2) : net}</b></td>` : ''}</tr>`;
      }).join('');
      return `<table><thead><tr><th>আইটেম</th><th>পরিমাণ</th><th>দর</th><th>মূল্য</th>${hasComm ? '<th>কমিঃ</th><th>(-)কমিঃ</th><th>নিট মূল্য</th>' : ''}</tr></thead><tbody>${rows}</tbody></table>`;
    }

    return `<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>বিক্রয় ভাউচার (খসড়া প্রিভিউ)</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Anek Bangla',sans-serif;color:#1b1f27;max-width:800px;margin:20px auto;padding:0 20px;}
  h1{font-family:'Oswald',sans-serif;font-size:20px;text-align:center;margin:0 0 4px;}
  .sub{text-align:center;color:#888;font-size:12px;margin-bottom:16px;}
  table{width:100%;border-collapse:collapse;margin:8px 0;}
  th,td{border:1px solid #ccc;padding:6px 8px;font-size:12.5px;text-align:center;}
  th{background:#1a2029;color:#f2a33c;}
  .totalline{text-align:right;font-weight:700;margin:6px 0;}
  .sign-row{display:flex;justify-content:space-between;margin-top:60px;text-align:center;font-size:12px;}
  .sign-row div{width:31%;border-top:1px solid #333;padding-top:6px;}
  @page { size: A5; margin: 10mm; }
</style></head><body>
  <h1>${escapeHtml(company.CompanyName || 'জি মেটাল ওয়ার্কস')}</h1>
  <div class="sub">বিক্রয় ভাউচার (খসড়া — এখনো সেভ হয়নি) — তারিখ: ${escapeHtml(formatShortDate(val('sv3_Date')))} — গ্রাহক: ${escapeHtml(custName)}</div>
  ${window.__sv3SaleLines.length > 0 ? `<h3>বিক্রীত পণ্য</h3>${linesTableHtml(window.__sv3SaleLines)}<div class="totalline">মোট বিক্রয়: ৳ ${saleTotal.toFixed(2)}</div>${cashExpenseAmt > 0 ? `<div class="totalline">নগদ খরচ যোগঃ ৳ ${cashExpenseAmt.toFixed(2)}</div>` : ''}` : ''}
  ${window.__sv3ReturnLines.length > 0 ? `<h3>ফেরত পণ্য</h3>${linesTableHtml(window.__sv3ReturnLines)}<div class="totalline">মোট ফেরত: ৳ ${returnTotal.toFixed(2)}</div>` : ''}
  <div class="totalline" style="font-size:15px;border-top:2px solid #1a2029;padding-top:8px;">নিট মোট: ৳ ${(saleTotal + cashExpenseAmt - returnTotal).toFixed(2)}</div>
  <div class="sign-row"><div>ক্রেতার স্বাঃ</div><div>অথরাইজেশন স্বাঃ<br>${escapeHtml(currentUser ? currentUser.FullName : '')}</div><div>বিক্রয়কারী স্বাঃ<br>${escapeHtml(currentUser ? currentUser.FullName : '')}</div></div>
</body></html>`;
  }

  async function renderFullPreview() {
    const wrap = document.getElementById('sv3_LivePreviewBody');
    if (!wrap) return;
    if (window.__sv3SaleLines.length === 0 && window.__sv3ReturnLines.length === 0) {
      wrap.innerHTML = `<div class="empty-state">${t('অন্তত একটা লাইন যোগ করলে প্রিভিউ দেখা যাবে।','Add at least one line to see the preview.')}</div>`;
      return;
    }
    const html = await buildDraftPrintHtml();
    wrap.innerHTML = `<iframe id="sv3_PreviewFrame" style="width:100%;height:70vh;border:1px solid var(--border);border-radius:8px;background:#fff;" srcdoc="${attr(html)}"></iframe>`;
  }

  function printDraftFrame() {
    const frame = document.getElementById('sv3_PreviewFrame');
    if (!frame || !frame.contentWindow) { showToast(t('প্রিন্ট করার জন্য অন্তত একটা লাইন যোগ করুন।','Add at least one line to print.'), 'error'); return; }
    frame.contentWindow.focus();
    frame.contentWindow.print();
  }
  async function shareDraft() {
    if (window.__sv3SaleLines.length === 0 && window.__sv3ReturnLines.length === 0) {
      showToast(t('শেয়ার করার জন্য অন্তত একটা লাইন যোগ করুন।','Add at least one line to share.'), 'error');
      return;
    }
    const saleTotal = window.__sv3SaleLines.reduce(function (s, l) { return s + (Number(l.amount) || 0); }, 0);
    const returnTotal = window.__sv3ReturnLines.reduce(function (s, l) { return s + (Number(l.amount) || 0); }, 0);
    const cashExpenseAmt = (window.__sv3CashExpense && window.__sv3CashExpense.amount) || 0;
    const text = 'বিক্রয় ভাউচার — নিট মোট: ৳ ' + (saleTotal + cashExpenseAmt - returnTotal).toFixed(2);
    if (navigator.share) {
      try { await navigator.share({ title: 'বিক্রয় ভাউচার', text: text }); } catch (e) {}
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(text);
      showToast(t('তথ্য ক্লিপবোর্ডে কপি হয়েছে।','Copied to clipboard.'), 'success');
    }
  }
  document.getElementById('sv3_LivePageSetupBtn').addEventListener('click', printDraftFrame);
  document.getElementById('sv3_LivePrintBtn').addEventListener('click', printDraftFrame);
  document.getElementById('sv3_LiveShareBtn').addEventListener('click', shareDraft);

  renderRightSummary();
  showTab('entry');
}

/* ============================================================
   জেনেরিক DOCUMENT ইঞ্জিন — Header+Lines থাকা বাকি সব ডকুমেন্ট
   (PR, PO, GRN, MaterialIssue, StockTransfer, StockAdjust, SO, DC,
   BOM, PMI, FGR, JV) এই একটামাত্র ইঞ্জিন দিয়ে চলে।
   ============================================================ */
async function renderDocumentListPage(content, config) {
  const records = await api('list', { sheet: config.headerSheet });

  content.innerHTML = `
    <div class="page-head"><div>
        <h1 class="i18n" data-bn="${attr(config.titleBn)}" data-en="${attr(config.titleEn)}">${t(config.titleBn, config.titleEn)}</h1>
        <p class="i18n" data-bn="${attr(config.subBn)}" data-en="${attr(config.subEn)}">${t(config.subBn, config.subEn)}</p>
      </div>
      <button class="btn btn-primary i18n" style="width:auto;" id="docAddBtn" data-bn="+ নতুন যোগ করুন" data-en="+ Add New">${t('+ নতুন যোগ করুন','+ Add New')}</button></div>
    <div class="panel"><div id="docTableWrap"></div></div>`;

  function renderTable(list) {
    const wrap = document.getElementById('docTableWrap');
    if (!wrap) return; // ব্যবহারকারী এই ফাঁকে অন্য পেজ/ট্যাবে চলে গেলে এই এলিমেন্ট আর DOM-এ থাকবে না
    const active = list.filter(function (r) { return r.Status !== 'Deleted'; });
    if (active.length === 0) {
      wrap.innerHTML = `<div class="empty-state i18n" data-bn="এখনো কোনো এন্ট্রি নেই।" data-en="No entries yet.">${t('এখনো কোনো এন্ট্রি নেই।','No entries yet.')}</div>`;
      return;
    }
    const headCells = config.listColumns.map(function (c) { return `<th class="i18n" data-bn="${attr(c.label)}" data-en="${attr(bnToEn(c.label))}">${t(c.label, bnToEn(c.label))}</th>`; }).join('');
    const bodyRows = active.slice().reverse().map(function (r) {
      const cells = config.listColumns.map(function (c) {
        let v = r[c.key];
        if (c.key === 'Status') {
          v = v === 'Posted' ? `<span class="badge active i18n" data-bn="পোস্ট করা" data-en="Posted">${t('পোস্ট করা','Posted')}</span>` : `<span class="badge draft i18n" data-bn="খসড়া" data-en="Draft">${t('খসড়া','Draft')}</span>`;
        } else if (c.key === 'TotalAmount') {
          v = v ? Number(v).toFixed(2) : '—';
        } else v = escapeHtml(v);
        return '<td>' + v + '</td>';
      }).join('');
      const editBtn = `<button onclick='openDocumentForm(${JSON.stringify(r[config.idField])})' title="${t('সম্পাদনা','Edit')}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="m18.5 2.5 3 3L10 17l-4 1 1-4Z"/></svg>
        </button>`;
      const postBtn = (config.postable && r.Status !== 'Posted')
        ? `<button class="btn" style="width:auto;padding:6px 12px;font-size:12px;" onclick='postDocumentRecord(${JSON.stringify(config.docType)}, ${JSON.stringify(r[config.idField])})'>${t('পোস্ট করুন','Post')}</button>`
        : '';
      return `<tr>${cells}<td class="row-actions">${postBtn}${editBtn}</td></tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}<th></th></tr></thead><tbody>${bodyRows}</tbody></table>`;
  }

  renderTable(records);
  document.getElementById('docAddBtn').addEventListener('click', function () { openDocumentForm(null); });
  window.__activeDocConfig = config;
  window.__refreshDocTable = async function () { renderTable(await api('list', { sheet: config.headerSheet })); };
}

async function openDocumentForm(existingId) {
  const config = window.__activeDocConfig;
  const isEdit = !!existingId;

  let existingHeader = null, existingLines = [];
  if (isEdit) {
    const doc = await api('getDocument', { headerSheet: config.headerSheet, idField: config.idField, linesSheet: config.linesSheet, lineIdField: config.lineIdField, idValue: existingId });
    existingHeader = doc.header;
    existingLines = doc.lines;
    if (existingHeader.Status === 'Posted') {
      showToast(t('পোস্ট হয়ে যাওয়া ডকুমেন্ট এডিট করা যাবে না।','A posted document cannot be edited.'), 'error');
      return;
    }
  }

  // হেডার ও লাইন ফিল্ডের সব FK ড্রপডাউনের ডেটা একসাথে (parallel) আনা হচ্ছে
  const allFkFields = config.headerFields.concat(config.lineFields).filter(function (f) { return f.type === 'select-fk'; });
  const uniqueFkSheets = Array.from(new Set(allFkFields.map(function (f) { return f.fkSheet; })));
  const fkSheetMap = await cachedListMultiple(uniqueFkSheets);
  const fkLists = {};
  allFkFields.forEach(function (f) { fkLists[f.key] = fkSheetMap[f.fkSheet]; });
  window.__docFkLists = fkLists;
  window.__docConfig = config;

  function fieldInputHtml(f, prefix, currentVal) {
    const id = prefix + f.key;
    if (f.type === 'select-fk') {
      const opts = (fkLists[f.key] || []).filter(function (r) { return r.Status !== 'Deleted'; })
        .map(function (r) { return `<option value="${attr(r[f.fkIdField])}" ${currentVal===r[f.fkIdField]?'selected':''}>${escapeHtml(r[f.fkLabel])}</option>`; }).join('');
      return `<select id="${id}" ${f.key==='ItemID'?'onchange="updateDocLineAmount(this)"':''}><option value="">—</option>${opts}</select>`;
    }
    if (f.type === 'number') return `<input id="${id}" type="number" step="any" value="${attr(currentVal)}" ${config.computeTotal?'oninput="recalcDocTotal()"':''}>`;
    if (f.type === 'date') return `<input id="${id}" type="date" value="${attr(currentVal)}">`;
    return `<input id="${id}" value="${attr(currentVal)}">`;
  }

  const headerHtml = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">` +
    config.headerFields.map(function (f) {
      return `<div class="field"><label>${f.label}</label>${fieldInputHtml(f, 'doc_h_', existingHeader ? existingHeader[f.key] : '')}</div>`;
    }).join('') + `</div>`;

  window.__docLineRows = isEdit ? existingLines.slice() : [{}];

  function renderDocLines() {
    const wrap = document.getElementById('doc_LinesWrap');
    if (!wrap) return;
    const headCells = config.lineFields.map(function (f) { return `<th>${f.label}</th>`; }).join('') + (config.computeTotal ? '<th>' + t('মূল্য','Amount') + '</th>' : '') + '<th></th>';
    const rows = window.__docLineRows.map(function (row, idx) {
      const cells = config.lineFields.map(function (f) {
        return `<td>${fieldInputHtml(f, 'doc_ln_' + idx + '_', row[f.key])}</td>`;
      }).join('');
      const amtCell = config.computeTotal ? `<td id="doc_ln_${idx}_amt" style="font-weight:600;">0.00</td>` : '';
      return `<tr>${cells}${amtCell}<td><button type="button" onclick="window.__removeDocLine(${idx})">✕</button></td></tr>`;
    }).join('');
    wrap.innerHTML = `<table class="data-table"><thead><tr>${headCells}</tr></thead><tbody>${rows}</tbody></table>`;
    if (config.computeTotal) recalcDocTotal();
  }
  window.__renderDocLines = renderDocLines;
  window.__removeDocLine = function (idx) { window.__docLineRows.splice(idx, 1); renderDocLines(); };

  const bodyHtml = headerHtml +
    `<h4 style="margin:20px 0 10px;font-size:13px;color:var(--text-muted);text-transform:uppercase;border-top:1px solid var(--border);padding-top:14px;">${t('লাইন আইটেম','Line Items')}</h4>
    <div id="doc_LinesWrap"></div>
    <button type="button" class="btn" style="width:auto;margin-top:8px;" id="doc_AddLineBtn">${t('+ লাইন যোগ করুন','+ Add Line')}</button>` +
    (config.computeTotal ? `<div style="margin-top:14px;font-size:15px;font-weight:700;text-align:right;">${t('মোট','Total')}: <span id="doc_GrandTotal">0.00</span></div>` : '');

  openModal({
    title: (isEdit ? t('সম্পাদনা — ','Edit — ') : t('নতুন — ','New — ')) + t(config.titleBn, config.titleEn),
    bodyHtml: bodyHtml,
    wide: true,
    onSave: async function () {
      const headerData = {};
      config.headerFields.forEach(function (f) { const v = val('doc_h_' + f.key); headerData[f.key] = ((f.type === 'select-fk' || f.type === 'number' || f.type === 'date') && v === '') ? null : v; });
      const missingHeader = config.headerFields.filter(function (f) { return f.required && !headerData[f.key]; });
      if (missingHeader.length > 0) throw new Error(missingHeader.map(function (f) { return f.label; }).join(', ') + ' আবশ্যক।');

      const lines = window.__docLineRows.map(function (_, idx) {
        const line = {};
        config.lineFields.forEach(function (f) { const v = val('doc_ln_' + idx + '_' + f.key); line[f.key] = ((f.type === 'select-fk' || f.type === 'number') && v === '') ? null : v; });
        if (config.computeTotal) {
          const qty = Number(line.Quantity) || 0, rate = Number(line.Rate) || 0;
          line.Amount = qty * rate;
        }
        return line;
      }).filter(function (l) {
        return Object.keys(l).some(function (k) { return l[k] !== '' && l[k] !== null && l[k] !== undefined; });
      });
      if (lines.length === 0) throw new Error(t('অন্তত একটা লাইন আইটেম যোগ করুন।','Add at least one line item.'));

      if (config.computeTotal) {
        headerData.TotalAmount = lines.reduce(function (s, l) { return s + (Number(l.Amount) || 0); }, 0);
      }

      const requiredFields = config.headerFields.filter(function (f) { return f.required; }).map(function (f) { return f.key; });
      if (isEdit) {
        await api('updateDocument', { headerSheet: config.headerSheet, idField: config.idField, linesSheet: config.linesSheet, lineIdField: config.lineIdField, idValue: existingId, headerData: headerData, lines: lines });
      } else {
        await api('createDocument', { headerSheet: config.headerSheet, idField: config.idField, idPrefix: config.idPrefix, requiredFields: requiredFields, linesSheet: config.linesSheet, lineIdField: config.lineIdField, headerData: headerData, lines: lines });
      }
      showToast(t('সেভ হয়েছে ✅','Saved ✅'), 'success');
      if (window.__refreshDocTable) await window.__refreshDocTable();
    }
  });

  document.getElementById('doc_AddLineBtn').addEventListener('click', function () { window.__docLineRows.push({}); renderDocLines(); });
  renderDocLines();
}

window.updateDocLineAmount = function () { if (window.__docConfig && window.__docConfig.computeTotal) recalcDocTotal(); };
window.recalcDocTotal = function () {
  if (!window.__docLineRows) return;
  let grand = 0;
  window.__docLineRows.forEach(function (_, idx) {
    const qty = Number(val('doc_ln_' + idx + '_Quantity')) || 0;
    const rate = Number(val('doc_ln_' + idx + '_Rate')) || 0;
    const amt = qty * rate;
    grand += amt;
    const amtEl = document.getElementById('doc_ln_' + idx + '_amt');
    if (amtEl) amtEl.textContent = amt.toFixed(2);
  });
  const grandEl = document.getElementById('doc_GrandTotal');
  if (grandEl) grandEl.textContent = grand.toFixed(2);
};

async function postDocumentRecord(docType, docId) {
  if (!confirm(t('আপনি কি নিশ্চিত এই ডকুমেন্ট পোস্ট করতে চান? পোস্ট হয়ে গেলে স্টক/লেজারে এন্ট্রি পড়বে এবং এটা আর বাতিল করা যাবে না।','Are you sure you want to post this document? Once posted, stock/ledger entries will be created and this cannot be undone.'))) return;
  try {
    await api('postDocument', { docType: docType, docId: docId });
    showToast(t('পোস্ট হয়েছে ✅','Posted ✅'), 'success');
    if (window.__refreshDocTable) await window.__refreshDocTable();
    if (window.__refreshSimpleVoucherList) await window.__refreshSimpleVoucherList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

/* ============================================================
   ১৩.৫) ইনভেন্টরি — Stock Overview, Stock Ledger, Party Ledger
   ============================================================ */
async function renderStockOverview(content) {
